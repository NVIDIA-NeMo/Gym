# Environment server for Harbor-format tasks. `gym eval run <folder | harbor:dataset>` generates a
# per-taskset instance that inherits from this one and fills in `tasksets` and `agent_server`.
# Dockerfile builds at prepare are configured by a top-level `builds:` block (tool, repository, platform,
# enabled) in env.yaml, a --config file or `++builds.<setting>=<value>`, not here; see the README.
harbor_environment_server:
  environment_servers:
    harbor:
      entrypoint: app.py

      # The harness that works in the task sandbox; it receives a `SandboxAccess` when its session is seeded.
      agent_server:
        type: responses_api_agents
        name: ???

      # Top-level sandbox provider block in the merged config (see nemo_gym/sandbox/providers/*/configs).
      sandbox_provider: sandbox
      sandbox_ready_timeout_s: 900
      # One episode: setup, the agent's turn and verification. Final cleanup (stopping the sandbox) has its own budget.
      max_concurrent_episodes: null
      queue_timeout_seconds: null
      default_episode_timeout_seconds: 21600
      cleanup_timeout_seconds: 180
      # Sandbox lifetime covers the full episode, final cleanup, and this slack.
      sandbox_ttl_slack_s: 900
      sandbox_provider_options: {}
      sandbox_metadata:
        benchmark: harbor
      artifacts_dir: ${results_dir}/harbor/verifier

      # Operator secrets by environment variable name (judge API keys and the like). They fill `${NAME}`
      # templates in a task's `[verifier].env`, the `test.sh` process environment, and reach nothing else.
      # Set them from env.yaml or with `++harbor_environment_server.environment_servers.harbor.secrets.NAME=...`.
      secrets: {}
      # Every episode runs under its task's own time budget, from the sandbox being ready: `harness_setup_allowance_s`,
      # `[agent].timeout_sec`, `[verifier].timeout_sec` and `verifier_grace_s`. With one sandbox start it is capped
      # by `default_episode_timeout_seconds`; the sandbox lives for that budget. `false` ignores task timeouts.
      enforce_task_timeouts: true
      harness_setup_allowance_s: 300
      # Sandbox and Compose group starts that fail on an image pull are retried here, with jittered backoff,
      # before the failure is reported as retryable.
      image_pull_retries: 2
      # Verify tasks that declare `artifacts` in a fresh sandbox even when task.toml keeps the shared mode
      # (tamper-proof grading, as training runs want). Tasks without artifacts keep their declared mode.
      separate_verifier_for_artifacts: false

      # taskset name -> {folder, tasks: {task_id: digest}, paths: {task_id: relative path, for tasks found
      # below the first level of the folder}}; written by the loader.
      tasksets: {}
