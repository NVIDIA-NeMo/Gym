# Materialized task rows select a source through task_id.taskset. The resources
# server owns each task sandbox; the shared NOOA agent borrows it for one turn.
# Supply a policy model and sandbox provider config alongside this file.
config_paths:
  - resources_servers/scale_swe/configs/scale_swe.yaml
  - resources_servers/swe_rebench/configs/swe_rebench.yaml
  - resources_servers/swemer_v1/configs/swemer_v1.yaml

environment_server_routes:
  scale_swe: scale_swe_environment
  swe_rebench: swe_rebench_environment
  swemer_v1: swemer_v1_environment

# These typed resource adapters lend the task sandbox to the selected harness.
scale_swe_resources_server:
  resources_servers:
    scale_swe:
      allowed_agents: [nooa_agent]

swe_rebench_resources_server:
  resources_servers:
    swe_rebench:
      allowed_agents: [nooa_agent]

swemer_v1_resources_server:
  resources_servers:
    swemer_v1:
      allowed_agents: [nooa_agent]

nooa_agent:
  responses_api_agents:
    nooa_agent:
      entrypoint: app.py
      model_server:
        type: responses_api_models
        name: policy_model
      max_output_tokens: 65536
      sandbox_timeout_seconds: 3600
      nooa:
        invocation_adapter: responses_api_agents.nooa_agent.bench_agent_adapter:invoke_bench_agent
        execution_mode: sandboxed
        agent_class: responses_api_agents.nooa_agent.bench_agent_no_compaction:BenchAgentWithoutCompaction

scale_swe_environment:
  environment_servers:
    single_agent_turn:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: scale_swe_resources_server
      agent_server:
        type: responses_api_agents
        name: nooa_agent
      default_episode_timeout_seconds: 10800
      cleanup_timeout_seconds: 180

swe_rebench_environment:
  environment_servers:
    single_agent_turn:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: swe_rebench_resources_server
      agent_server:
        type: responses_api_agents
        name: nooa_agent
      default_episode_timeout_seconds: 10800
      cleanup_timeout_seconds: 180

swemer_v1_environment:
  environment_servers:
    single_agent_turn:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: swemer_v1_resources_server
      agent_server:
        type: responses_api_agents
        name: nooa_agent
      default_episode_timeout_seconds: 10800
      cleanup_timeout_seconds: 180
