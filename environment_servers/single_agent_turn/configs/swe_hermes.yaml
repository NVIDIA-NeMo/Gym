# Materialized task rows select a source through task_id.taskset. The resources
# server owns each task sandbox; the shared Hermes agent borrows it for one turn.
# Supply a policy model and sandbox provider config alongside this file.
config_paths:
  - responses_api_agents/hermes_agent/configs/hermes_agent.yaml
  - resources_servers/scale_swe/configs/scale_swe.yaml
  - resources_servers/swe_rebench/configs/swe_rebench.yaml
  - resources_servers/swemer_v1/configs/swemer_v1.yaml
  - resources_servers/swemer_v2/configs/swemer_v2.yaml
  - resources_servers/swe_next/configs/swe_next.yaml

environment_server_routes:
  scale_swe: scale_swe_environment
  swe_rebench: swe_rebench_environment
  swemer_v1: swemer_v1_environment
  swemer_v2: swemer_v2_environment
  swe_next: swe_next_environment

# These typed resource adapters lend the task sandbox to the selected harness.
scale_swe_resources_server:
  resources_servers:
    scale_swe:
      allowed_agents: [hermes_agent]

swe_rebench_resources_server:
  resources_servers:
    swe_rebench:
      allowed_agents: [hermes_agent]

swemer_v1_resources_server:
  resources_servers:
    swemer_v1:
      allowed_agents: [hermes_agent]

hermes_agent:
  responses_api_agents:
    hermes_agent:
      max_turns: 90
      max_tokens: 65536
      compression_enabled: false
      enabled_toolsets: [terminal, file, delegation]
      sandbox_runner_timeout_seconds: 3600

scale_swe_environment:
  environment_servers:
    single_agent_turn:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: scale_swe_resources_server
      agent_server:
        type: responses_api_agents
        name: hermes_agent
      default_episode_timeout_seconds: 10800
      cleanup_timeout_seconds: 180

swe_rebench_environment:
  environment_servers:
    single_agent_turn:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: swe_rebench_resources_server
      agent_server:
        type: responses_api_agents
        name: hermes_agent
      default_episode_timeout_seconds: 10800
      cleanup_timeout_seconds: 180

swemer_v1_environment:
  environment_servers:
    single_agent_turn:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: swemer_v1_resources_server
      agent_server:
        type: responses_api_agents
        name: hermes_agent
      default_episode_timeout_seconds: 10800
      cleanup_timeout_seconds: 180

swemer_v2_resources_server:
  resources_servers:
    swemer_v2:
      allowed_agents: [hermes_agent]

swemer_v2_environment:
  environment_servers:
    single_agent_turn:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: swemer_v2_resources_server
      agent_server:
        type: responses_api_agents
        name: hermes_agent
      default_episode_timeout_seconds: 10800
      cleanup_timeout_seconds: 180

swe_next_resources_server:
  resources_servers:
    swe_next:
      allowed_agents: [hermes_agent]

swe_next_environment:
  environment_servers:
    single_agent_turn:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: swe_next_resources_server
      agent_server:
        type: responses_api_agents
        name: hermes_agent
      default_episode_timeout_seconds: 10800
      cleanup_timeout_seconds: 180
