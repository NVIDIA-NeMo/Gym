# partner_if's two public examples as one benchmark: this server runs the text tasks (configs/partner_if.yaml) and
# sends the mock-tool tasks (configs/mock_tools.yaml) to their own environment, and one aggregate covers both.
config_paths:
  - resources_servers/partner_if/configs/partner_if.yaml
  - resources_servers/partner_if/configs/mock_tools.yaml

# This server takes over the text example's pairing, so the text example's own server is not started.
partner_if_environment_server: null

partner_if_simple_agent:
  responses_api_agents:
    simple_agent:
      datasets:
        - name: partner_if_examples
          type: example
          # data/example.jsonl and data/mock_tools_example.jsonl of resources_servers/partner_if.
          jsonl_fpath: environment_servers/partner_if/data/example.jsonl
          prompt_config: null
          license: Apache 2.0

partner_if_examples_environment_server:
  environment_servers:
    partner_if:
      entrypoint: app.py
      cleanup_timeout_seconds: 180
      # Text tasks have no episode deadline: their step cap ends them. Routed tasks keep their own server's limits.
      default_episode_timeout_seconds: null
      resources_server:
        type: resources_servers
        name: partner_if
      resources_tool_transports: []
      agent_server:
        type: responses_api_agents
        name: partner_if_simple_agent
      task_routes:
        synthetic-1: {type: environment_servers, name: partner_if_examples_environment_server}
        synthetic-2: {type: environment_servers, name: partner_if_examples_environment_server}
        synthetic-3: {type: environment_servers, name: partner_if_examples_environment_server}
        synthetic-4: {type: environment_servers, name: partner_if_examples_environment_server}
        synthetic-5: {type: environment_servers, name: partner_if_examples_environment_server}
        synthetic-tools-1: {type: environment_servers, name: partner_if_mock_tools_environment_server}
        synthetic-tools-2: {type: environment_servers, name: partner_if_mock_tools_environment_server}
