policy_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: ${policy_base_url}
      api_key: ${policy_api_key}
      model: ${policy_model_name}
      return_token_id_information: true
      request_prompt_and_generation_token_ids: false
      uses_reasoning_parser: true
      # External harnesses may omit or choose their own sampling parameters.
      # Pin every outbound request to the integrating trainer's distribution.
      sampling_overrides:
        temperature: ${oc.select:policy_generation_temperature,1.0}
        top_p: ${oc.select:policy_generation_top_p,1.0}
        top_k: ${oc.select:policy_generation_top_k,-1}
