policy_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: ${policy_base_url}
      api_key: ${policy_api_key}
      model: ${policy_model_name}
      return_token_id_information: true
      uses_reasoning_parser: true
      # On-policy training: put the sampling params the policy is optimized under on every request
      # to the engine. Nothing else does. An external harness need not send sampling params, and the
      # converters forward only what the caller set, so without this the outbound body has no
      # temperature or top_p and the engine applies its own schema default instead of the trainer's
      # value. The integrating training framework supplies these via the generic keys below (Gym does
      # not know any framework); the defaults are standard on-policy sampling when a framework sets
      # nothing. top_k is pinned to -1 (disabled) because a training worker that constrains it
      # rejects anything else outright, and the Anthropic converter never maps it, so the value that
      # arrives is always a default.
      sampling_overrides:
        temperature: ${oc.select:policy_generation_temperature,1.0}
        top_p: ${oc.select:policy_generation_top_p,1.0}
        top_k: ${oc.select:policy_generation_top_k,-1}
