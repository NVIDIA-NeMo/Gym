[project]
name = "external-model"
version = "0.2.0rc0"
requires-python = ">=3.13.14"
dependencies = [
    "nemo-gym[dev]",
    # Local tokenizer rendering only; no inference runtime or torch required.
    # License: Apache-2.0 https://github.com/huggingface/transformers/blob/main/LICENSE
    "transformers",
    # Chat-template rendering is an optional Transformers dependency.
    # Updated: Nov 5, 2026 with jinja2>=3.1.
    # License: BSD-3-Clause https://github.com/pallets/jinja/blob/main/LICENSE.txt
    "jinja2>=3.1",
]

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61", "setuptools-scm"]

[tool.setuptools.packages.find]
where = [".."]
include = ["external_model"]

[tool.uv.sources]
nemo-gym = { path = "../..", editable = true }
