[project]
name = "local-vllm-model"
version = "0.2.0rc0"
requires-python = ">=3.13.14"
dependencies = [
    "nemo-gym[dev,ray]",
    "hf-transfer==0.1.9",
    "uvicorn==0.40.0",
    "vllm==0.11.0; sys_platform == 'darwin'",
    "vllm==0.29.0; sys_platform != 'darwin'",
    "flashinfer-python==0.6.18; sys_platform != 'darwin'",
]

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61", "setuptools-scm"]

[tool.setuptools.packages.find]
where = [".."]
include = ["local_vllm_model"]

[tool.uv]
override-dependencies = [
    "spacy>=3.8.13",
    "wcwidth; sys_platform == 'never'",
    "opencv-python-headless>=4.13.0; sys_platform != 'darwin'",
    "pynvvideocodec==2.0.4; sys_platform != 'darwin'",
    "torchcodec>=0.14; sys_platform != 'darwin'",
    "torchvision==0.28.0; sys_platform != 'darwin'",
    "torchaudio==2.11.0; sys_platform != 'darwin'",
    "pycountry",
    "gprof2dot; sys_platform == 'never'",
    "pathspec",
]
exclude-dependencies = [
    "fasttext-wheel",
    "alembic",
    "blinker",
    "flask",
    "flask-cors",
    "graphene",
    "graphql-core",
    "graphql-relay",
    "gunicorn",
    "huey",
    "prettytable",
    "skops",
    "sqlalchemy",
    "werkzeug",
    "waitress",
    "diskcache",
]
# <8.0.2 crashes on FastAPI>=0.137 pathless routes in vLLM /metrics. See vllm-project/vllm#45629
constraint-dependencies = [
    "grpcio>=1.84.1,!=1.85.0rc1",
    "certifi>=2026.10.19",
    "msgpack>=1.2.1",
    "pyarrow>=25.0.1",
    "transformers>=5.17.0",
    "prometheus-fastapi-instrumentator>=8.0.2",
]
required-version = ">=0.13.4"

[tool.uv.sources]
nemo-gym = { path = "../..", editable = true }

[tool.uv.sources.nemo-lens]
git = "https://github.com/NVIDIA-NeMo/Lens.git"
rev = "4d045c03186b90afdc815db46b671f6a21bc7e98"
[tool.uv.pip]
torch-backend = "auto"

[project.optional-dependencies]
telemetry = ["nemo-gym[telemetry]"]

[tool.uv.workspace]
members = []
