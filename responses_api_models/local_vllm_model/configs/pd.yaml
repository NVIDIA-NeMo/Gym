config_paths:
  - responses_api_models/local_vllm_model/configs/subprocess.yaml

policy_model:
  responses_api_models:
    local_vllm_model:
      router:
        executable: ${oc.env:VLLM_ROUTER_EXECUTABLE}
        executable_type: binary
        expected_version: "0.1.15"
        expected_sha256: ${oc.env:VLLM_ROUTER_SHA256}
      pd: {}
      show_vllm_engine_stats: true
