mimo_music:
  resources_servers:
    mimo_music:
      entrypoint: app.py
      domain: other
      verified: false
      description: MiMo-V2.6-RL-oss symbolic music composition (ABC), rule-based MIDI human-likeness score
      value: Creative generation with a programmatic reward
mimo_music_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: mimo_music
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/mimo_music/data/example.jsonl
      - name: train
        type: train
        jsonl_fpath: resources_servers/mimo_music/data/train.jsonl
        prepare_script: resources_servers/mimo_rl_oss/prepare.py
        license: Apache 2.0

mimo_music_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: mimo_music_simple_agent
