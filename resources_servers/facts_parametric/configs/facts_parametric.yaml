facts_parametric:
  resources_servers:
    facts_parametric:
      entrypoint: app.py
      domain: knowledge
      verified: false
      description: FACTS Parametric closed-book factoid QA graded three times with the official Gemini 2.5 Pro grader prompt
      value: Measure parametric factual recall, hedging, and attempted accuracy on the public FACTS Parametric set
      judge_model_server:
        type: responses_api_models
        name: facts_parametric_judge
      # Official protocol (paper section 4.2, starter notebook): three independent grades per response, issued
      # with seed 0, 1, 2 and the grader provider's default sampling. Only set fields are sent to the grader.
      judge_responses_create_params:
        input: []
      judge_samples: 3
      # `starter` = the published starter's substring rule (official); `output_line` = the closing
      # `Output: [LABEL]` line. Both parses are always recorded per grade.
      label_parser: starter

# Official grader: Gemini 2.5 Pro reached through any OpenAI-compatible Chat Completions endpoint (the Gemini
# API's OpenAI compatibility layer, Vertex AI through a gateway, ...). Endpoint details stay out of the repo.
facts_parametric_judge:
  responses_api_models:
    inference_provider:
      entrypoint: app.py
      base_url: ${oc.env:FACTS_PARAMETRIC_JUDGE_BASE_URL,''}
      api_key: ${oc.env:FACTS_PARAMETRIC_JUDGE_API_KEY,''}
      model: ${oc.env:FACTS_PARAMETRIC_JUDGE_MODEL,gemini-2.5-pro}
      num_concurrent_requests: ${oc.decode:${oc.env:FACTS_PARAMETRIC_JUDGE_CONCURRENCY,8}}

facts_parametric_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: facts_parametric
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
        - name: example
          type: example
          jsonl_fpath: resources_servers/facts_parametric/data/example.jsonl
          license: Apache 2.0
