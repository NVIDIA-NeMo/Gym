config_paths:
  - resources_servers/vision2code/configs/vision2code.yaml

vision2code:
  resources_servers:
    vision2code:
      verified: false
      preparation:
        include_canvas_dimensions: true
      use_blended_reward: true
      blended_reward_apply_judge_caps: true
      spatial_uncapped_judge_squared: true
      datasets:
        - name: train
          type: train
          jsonl_fpath: ${oc.env:VISION2CODE_TRAIN_TASKS}

vision2code_simple_agent:
  responses_api_agents:
    vision2code_agent:
      stop_on: final_judge_score

policy_model:
  responses_api_models:
    vllm_model:
      uses_reasoning_parser: true
      uses_interleaved_reasoning: true

judge_model:
  responses_api_models:
    vllm_model:
      uses_reasoning_parser: true
      uses_interleaved_reasoning: true
