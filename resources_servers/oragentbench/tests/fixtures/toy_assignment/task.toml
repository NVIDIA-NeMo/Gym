# Synthetic fixture task in the ORAgentBench task layout; written for this repository.
schema_version = "1.1"

[task]
name = "synthetic/toy_assignment"
description = "Toy assignment problem"

[agent]
timeout_sec = 120

[verifier]
timeout_sec = 60
user = "root"

[solution]
env = { ORCLAW_SOLVE_TIME_LIMIT_SECONDS = "10", ORCLAW_SCIP_GAP = "0.0005" }

[environment]
skills_dir = "/skills"
cpus = 1
memory_mb = 1024
