config_paths:
  - resources_servers/partner_if/configs/verifier.yaml
  - responses_api_models/openai_model/configs/openai_model.yaml

partner_if:
  resources_servers:
    partner_if:
      domain: instruction_following
      verified: false
      description: Text variant that grades a response and its visible evidence against versioned instruction-following rubrics.

partner_if_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      execute_tools: false
      resources_server:
        type: resources_servers
        name: partner_if
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
        - name: partner_if_synthetic_smoke
          type: example
          jsonl_fpath: resources_servers/partner_if/data/example.jsonl
          prompt_config: null
          license: Apache 2.0

partner_if_environment_server:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      cleanup_timeout_seconds: 180
      resources_server:
        type: resources_servers
        name: partner_if
      resources_tool_transports: []
      agent_server:
        type: responses_api_agents
        name: partner_if_simple_agent
