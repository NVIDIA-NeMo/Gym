# The mock-tool example: the example NotesBackend (example_tools.py) over data/mock_tools_example.jsonl.
config_paths:
  - resources_servers/partner_if/configs/judge.yaml
  - responses_api_models/openai_model/configs/openai_model.yaml

partner_if_mock_tools:
  resources_servers:
    partner_if:
      entrypoint: mock_tools_app.py
      domain: instruction_following
      verified: false
      description: Mock-tool variant that grades live tool-calling episodes against instruction-following rubrics, with an example notes backend.
      num_workers: 1
      backend: resources_servers.partner_if.example_tools:NotesBackend
      fixture_path: resources_servers/partner_if/data/mock_tools_notes.json
      tasks_path: resources_servers/partner_if/data/mock_tools_example.jsonl
      judge_model_server:
        type: responses_api_models
        name: partner_if_judge

partner_if_mock_tools_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 10
      resources_server:
        type: resources_servers
        name: partner_if_mock_tools
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
        - name: partner_if_mock_tools_example
          type: example
          jsonl_fpath: resources_servers/partner_if/data/mock_tools_example.jsonl
          prompt_config: null
          license: Apache 2.0

partner_if_mock_tools_environment_server:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      cleanup_timeout_seconds: 180
      resources_server:
        type: resources_servers
        name: partner_if_mock_tools
      resources_tool_transports:
        - direct_http
      agent_server:
        type: responses_api_agents
        name: partner_if_mock_tools_simple_agent
