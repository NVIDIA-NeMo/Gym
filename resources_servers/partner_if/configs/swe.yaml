# The SWE adapter (swe_app.py): OpenCode (opencode_agent) works in the row's Scale-SWE sandbox, which this server
# starts and hands to the agent through an Environment Server session, and the shared IF judge grades the trajectory.
# Each row's pre_commands set up the agent's harness, and its grading contract carries the judge's copies of the
# actor's system prompt and tool-description additions. It validates without services, but it runs only with a
# sandbox provider and such rows, and Gym ships neither.
config_paths:
  - resources_servers/partner_if/configs/verifier.yaml
  # opencode_agent's command deny-list, which partner_if_swe_agent inherits.
  - responses_api_agents/opencode_agent/configs/permissions/default.yaml

partner_if_swe:
  resources_servers:
    partner_if:
      entrypoint: swe_app.py
      domain: instruction_following
      verified: false
      description: Instruction-following rubric verification of OpenCode trajectories on Scale-SWE tasks.
      num_workers: 1
      sandbox_provider: sandbox
      sandbox_config:
        # Outlives the agent's 10800 s deadline and the seed before it.
        ttl_s: 14400
        ready_timeout_s: 600
        env: {SHELL: /bin/bash, EXECD_API_GRACE_SHUTDOWN: 50ms}
        resources: {cpu: 4, memory_mib: 16384, disk_gib: 20}
      judge_model_server:
        type: responses_api_models
        name: partner_if_judge

# OpenCode with opencode_agent's command deny-list and without the web, subagent and skill tools. The agent inherits
# only the deny-list (permissions/default.yaml), not opencode_agent.yaml: OpenCode 1.17.11 places the keys of a
# `tools` map, such as the one opencode_agent.yaml sets, before the permission map's "*" rule, and the last matching
# rule wins, so with that map none of the denials apply.
partner_if_swe_agent:
  _inherit_from: opencode_agent
  responses_api_agents:
    opencode_agent:
      entrypoint: app.py
      num_workers: 1
      model: ${policy_model_name}
      model_server: {type: responses_api_models, name: policy_model}
      context_window: 262144
      timeout: 10800
      sandbox_install_timeout_seconds: 600
      session_close_timeout_seconds: 60
      session_close_retry_window_seconds: 300
      opencode_config:
        permission:
          webfetch: deny
          websearch: deny
          task: deny
          skill: deny

partner_if_swe_environment_server:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      cleanup_timeout_seconds: 180
      default_episode_timeout_seconds: null
      resources_server: {type: resources_servers, name: partner_if_swe}
      resources_tool_transports: []
      agent_server: {type: responses_api_agents, name: partner_if_swe_agent}
