conversational_tool_use_simulation:
  resources_servers:
    conversational_tool_use_simulation:
      entrypoint: app.py
      domain: agent
      verified: false
      description: Conversational tool-use simulation environment.
      simulator_model_server:
        type: responses_api_models
        name: simulator_model
      user_model_server:
        type: responses_api_models
        name: simulator_model
      tool_simulator_model_server:
        type: responses_api_models
        name: simulator_model
      judge_model_server:
        type: responses_api_models
        name: judge_model
      generation_attempts: 3
      judge_provider_attempts: 3
      judge_provider_retry_initial_backoff_seconds: 0.5
      judge_provider_retry_max_backoff_seconds: 8.0
      enable_llm_judge: true
      enable_termination: true
      verification_type: message
      enforce_transfer_ground_truth: false
conversational_tool_use_agent:
  responses_api_agents:
    conversational_tool_use_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: conversational_tool_use_simulation
      model_server:
        type: responses_api_models
        name: policy_model
      max_agent_steps: 50
      seed_first_user_message: true
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/conversational_tool_use_simulation/data/example.jsonl
        license: Apache 2.0

simulator_model:
  _copy: policy_model

judge_model:
  _copy: policy_model
