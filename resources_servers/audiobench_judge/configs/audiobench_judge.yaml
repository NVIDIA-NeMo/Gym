audiobench_judge:
  resources_servers:
    audiobench_judge:
      entrypoint: app.py
      domain: other
      description: AudioBench judge-based scoring (0-5 rating via LLM-as-a-judge) for open-ended audio QA, instruction following, and classification phrased as open-ended QA.
      value: Improve open-ended audio understanding (instruction following, audio QA, emotion/gender/accent recognition) by porting AudioBench's judge half from NeMo Skills.
      verified: false
      # Audio is carried in responses_create_params.metadata and must be translated by a vLLM-based Gym adapter.
      allowed_model_types:
      - vllm_model
      - local_vllm_model
      - local_vllm_model_proxy
      - vllm_model_with_compaction
      judge_model_server:
        type: responses_api_models
        name: judge_model
      judge_responses_create_params:
        input: []
        max_output_tokens: 512
        temperature: 0.0
      use_chat_completions_for_judge: true

# Judge model, split from policy_model so the audio model under test isn't asked to score itself.
# Defaults to openai/gpt-oss-20b on the public NVIDIA API, the text-only judge the AudioBench port
# was validated with. Set judge_api_key (and judge_base_url / judge_model_name to use another judge)
# in env.yaml or on the command line.
judge_model:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: ${oc.select:judge_base_url,https://integrate.api.nvidia.com/v1}
      openai_api_key: ${oc.select:judge_api_key,null}
      openai_model: ${oc.select:judge_model_name,openai/gpt-oss-20b}

audiobench_judge_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: audiobench_judge
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/audiobench_judge/data/example.jsonl
        license: Creative Commons Attribution 4.0 International

audiobench_judge_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: audiobench_judge_simple_agent
