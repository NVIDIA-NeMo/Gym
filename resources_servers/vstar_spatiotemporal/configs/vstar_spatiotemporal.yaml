vstar_spatiotemporal_resources_server:
  resources_servers:
    vstar_spatiotemporal:
      entrypoint: app.py
      domain: other
      verified: false
      description: V-STaR video spatio-temporal reasoning verifier for frames-as-images prompts with 0-1000 grid boxes
      value: Rate the "what" answer with an LLM judge, score the "when" span by temporal IoU and the "where" boxes by per-second IoU, and fold each item's five tasks into the V-STaR mAM and mLGM
      # Rates the VQA answers; the V-STaR evaluation uses Qwen2.5-72B-Instruct at temperature 0.
      judge_model_server:
        type: responses_api_models
        name: policy_model
      judge_responses_create_params:
        input: []
        temperature: 0.0
        max_output_tokens: 512
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/vstar_spatiotemporal/data/example.jsonl
        num_repeats: 1
