# The example through the single-agent-turn Environment Server. The Environment Server seeds the Resources Server
# and Simple Agent sessions, grants the agent direct HTTP access to the tools, runs one agent turn, then verifies.
config_paths:
  - environment_servers/single_agent_turn_legacy/configs/single_agent_turn_legacy.yaml

example_single_tool_call:
  resources_servers:
    example_single_tool_call:
      entrypoint: app.py
      domain: agent
      verified: false
      description: Basic single-step tool calling
example_single_tool_call_session_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      # Sessions take tool access from the Environment Server's grant; dataset tooling finds the task schema here.
      resources_server:
        type: resources_servers
        name: example_single_tool_call
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/example_single_tool_call/data/example.jsonl

example_single_tool_call_single_agent_turn:
  _inherit_from: single_agent_turn_legacy
  environment_servers:
    single_agent_turn_legacy:
      resources_server:
        type: resources_servers
        name: example_single_tool_call
      agent_server:
        type: responses_api_agents
        name: example_single_tool_call_session_agent
      resources_tool_transports:
      - direct_http
