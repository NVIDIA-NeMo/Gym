# The weather example with its toolset served from a sandbox of each episode. The Environment Server seeds the Resources
# Server on the host, starts the episode's tool sandbox, grants the agent the sandbox's tools, and verifies on the host
# with the state the tools left (nemo_gym.server_runtime.resources_tool_sandbox). The weather tool keeps no state, so
# no state moves; example_session_state_mgmt_tool_sandbox.yaml moves a counter.
# The image holds the Gym repository at /gym and a Python with nemo-gym installed.
config_paths:
  - environment_servers/single_agent_turn_legacy/configs/single_agent_turn_legacy.yaml

example_single_tool_call:
  resources_servers:
    example_single_tool_call:
      entrypoint: app.py
      domain: agent
      verified: false
      description: Basic single-step tool calling
example_single_tool_call_session_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: example_single_tool_call
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/example_single_tool_call/data/example.jsonl

example_single_tool_call_tool_sandbox:
  _inherit_from: single_agent_turn_legacy
  environment_servers:
    single_agent_turn_legacy:
      resources_server:
        type: resources_servers
        name: example_single_tool_call
      agent_server:
        type: responses_api_agents
        name: example_single_tool_call_session_agent
      resources_tool_transports:
      - direct_http
      sandbox_provider:
        docker: {}
      resources_tool_sandbox:
        image: ${oc.select:example_single_tool_call_tool_sandbox_image,nemo-gym:latest}
        # The rule bounds what the tools reach; the agent reaches the tools through the sandbox's endpoint. Docker
        # cannot close the egress of a sandbox whose port it publishes; on OpenSandbox, use no_network.
        network: inherit
