indic_arena_judge:
  resources_servers:
    indic_arena_judge:
      entrypoint: app.py
      domain: other
      verified: false
      description: Indic Arena Hard v2 custom pointwise scoring with optional pairwise judging
      value: Evaluate translated open-ended prompts with language-specific baselines or reference-free rubric scores
      evaluation_mode: pointwise
      judge_model_server:
        type: responses_api_models
        name: indic_arena_judge_model
      judge_chat_completions_create_params:
        messages: []
        max_tokens: 4096
        temperature: 0.0

indic_arena_judge_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: indic_arena_judge
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
        - name: example
          type: example
          jsonl_fpath: resources_servers/indic_arena_judge/data/example.jsonl
          license: Apache 2.0

indic_arena_judge_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: indic_arena_judge_simple_agent

indic_arena_judge_model:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: ${oc.env:INDIC_ARENA_JUDGE_BASE_URL,MISSING}
      openai_api_key: ${oc.env:INDIC_ARENA_JUDGE_API_KEY,MISSING}
      openai_model: ${oc.env:INDIC_ARENA_JUDGE_MODEL,MISSING}
