[project]
name = "gym-resources-servers-spatialclaw"
version = "0.0.0"
requires-python = ">=3.13.14"
dependencies = [
    "nemo-gym[dev]",
    "numpy>=2.1,<3",
    "pandas>=2.0",
    "datasets>=2.0",
    "Pillow>=10.0",
    "opencv-python-headless>=4.8,<4.13",
    "imageio-ffmpeg>=0.5",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "jupyter_client>=8.0",
    "ipykernel>=6.0",
    "wcwidth>=0.2",
    "pyzmq>=25.0",
    "shortuuid>=1.0",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "cloudpickle>=3.0",
    "requests>=2.28",
]

[project.optional-dependencies]
telemetry = ["nemo-gym[telemetry]"]

[tool.uv]
package = false
constraint-dependencies = [
    "grpcio>=1.84.1,!=1.85.0rc1",
    "certifi>=2026.10.19",
    "msgpack>=1.2.1",
    "pyarrow>=25.0.1",
    "transformers>=5.17.0",
]
override-dependencies = [
    "spacy>=3.8.13",
    "wcwidth>=0.2",
    "opencv-python-headless>=4.8,<4.13",
    "pynvvideocodec; sys_platform == 'never'",
    "torchcodec; sys_platform == 'never'",
    "torchvision; sys_platform == 'never'",
    "torchaudio; sys_platform == 'never'",
    "pycountry; sys_platform == 'never'",
    "gprof2dot; sys_platform == 'never'",
    "pathspec; sys_platform == 'never'",
]
exclude-dependencies = [
    "fasttext-wheel",
    "alembic",
    "blinker",
    "flask",
    "flask-cors",
    "graphene",
    "graphql-core",
    "graphql-relay",
    "gunicorn",
    "huey",
    "prettytable",
    "skops",
    "sqlalchemy",
    "werkzeug",
    "waitress",
    "diskcache",
]
required-version = ">=0.13.4"

[tool.uv.sources]
nemo-gym = { path = "../..", editable = true }

[tool.uv.sources.nemo-lens]
git = "https://github.com/NVIDIA-NeMo/Lens.git"
rev = "4d045c03186b90afdc815db46b671f6a21bc7e98"
[tool.uv.workspace]
members = []
