scicodepile:
  resources_servers:
    scicodepile:
      entrypoint: app.py
      domain: coding
      verified: false
      description: Verifies model-generated Python against SciCodePile's runnable scientific-code tests.
      value: Improve scientific and research code generation grounded in real computational-science repositories.
      num_processes: 8
      subprocess_timeout: 120.0
      max_as_limit: 8192
scicodepile_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: scicodepile
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/scicodepile/data/example.jsonl
        license: Apache 2.0
