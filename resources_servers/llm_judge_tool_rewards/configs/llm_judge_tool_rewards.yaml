llm_judge_with_tools:
  resources_servers:
    llm_judge_tool_rewards:
      entrypoint: app.py
      domain: knowledge
      verified: false
      description: Generic LLM answer judging with configurable tool rewards
      judge_model_server:
        type: responses_api_models
        name: training_judge
      judge_responses_create_params:
        input: []
        max_output_tokens: 4096
      # OpenCode-compatible pairing; override these identities for other harnesses.
      tool_rewards:
        shell_tool_name: bash
        search_tool_name: websearch
        rate_limit_error_pattern: 'StatusCode: non 2xx status code \(429 POST https?://[^\s()]+\)'
        invalid_tool_call_names: [bash]
