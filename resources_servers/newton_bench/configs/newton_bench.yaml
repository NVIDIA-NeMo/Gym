# NewtonBench through the single-agent-turn Environment Server. The Environment Server seeds the Resources Server
# and Simple Agent sessions, grants the agent direct HTTP access to the experiment and Python tools, runs one agent
# turn, verifies, then closes both sessions.
config_paths:
  - environment_servers/single_agent_turn_legacy/configs/single_agent_turn_legacy.yaml

newton_bench:
  resources_servers:
    newton_bench:
      entrypoint: app.py
      domain: math
      verified: false
      description: Scientific law discovery tasks through agentic experimentation across 12 physics domains
      value: Improve science, reasoning, and tool use capabilities
newton_bench_session_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      # Sessions take tool access from the Environment Server's grant; dataset tooling finds the task schema here.
      resources_server:
        type: resources_servers
        name: newton_bench
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: train
        type: train
        jsonl_fpath: resources_servers/newton_bench/data/train.jsonl
        license: Apache 2.0
      - name: example
        type: example
        jsonl_fpath: resources_servers/newton_bench/data/example.jsonl
        license: Apache 2.0

newton_bench_single_agent_turn:
  _inherit_from: single_agent_turn_legacy
  environment_servers:
    single_agent_turn_legacy:
      resources_server:
        type: resources_servers
        name: newton_bench
      agent_server:
        type: responses_api_agents
        name: newton_bench_session_agent
      resources_tool_transports:
      - direct_http
