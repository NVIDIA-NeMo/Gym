# Agentic IF, example stack: Gym's single_agent_turn and opencode_agent with this resources server, which owns
# each episode. It borrows the task sandbox from Scale-SWE or Terminal-Bench 2.1 through their typed sessions, lends it
# to OpenCode, stages the IF plugins and grades the episode at /verify. benchmarks/agentic_if/config.yaml includes this
# file and adds the benchmark dataset and its route. The run's config sets policy_model.
config_paths:
  - responses_api_agents/opencode_agent/configs/opencode_agent.yaml
  - environment_servers/single_agent_turn/configs/single_agent_turn.yaml
  - resources_servers/scale_swe/configs/scale_swe.yaml
  - resources_servers/terminal_bench_2_1/configs/terminal_bench_2_1.yaml

environment_server_routes:
  "agentic_if:example": agentic_if_environment_server

# Not used here; it would start an extra server.
scale_swe_golden_patch_resources_server: null

agentic_if_resources:
  resources_servers:
    agentic_if:
      entrypoint: app.py
      domain: instruction_following
      verified: false
      description: Owns agentic IF episodes on Scale-SWE and Terminal-Bench 2.1 sandboxes and grades instruction following.
      value: Measure whether coding agents follow instructions while completing real repository and terminal tasks.
      # Its OpenCode plugins and evidence are built for this harness.
      allowed_agents: [opencode_agent]
      # Episodes hold sandbox connections in this process.
      num_workers: 1
      # The judge's prompts and model settings ship in if_grading/data/judge.yaml; this model server answers them.
      judge_model_server:
        type: responses_api_models
        name: agentic_if_judge_model
      # The resources servers that own the task sandboxes, by the row's agentic_if.task_backend.
      task_resources:
        swe:
          type: resources_servers
          name: scale_swe_resources_server
        tb21:
          type: resources_servers
          name: terminal_bench_2_1_resources_server
      # Each episode's evidence, receipts and task verdict, which re-verification reads. Rollout data: keep it private.
      # Absolute: the run's results_dir (which Gym makes absolute) unless agentic_if_artifacts_dir names another place.
      artifacts_dir: ${oc.select:agentic_if_artifacts_dir,${oc.select:results_dir,results}/agentic_if}
      datasets:
        - name: example
          type: example
          jsonl_fpath: resources_servers/agentic_if/data/example.jsonl
          taskset: agentic_if:example
          num_repeats: 1
          # Its Scale-SWE rows have no declared license, as in scale_swe.
          license: TBD

# The judge: the model if_grading/data/judge.yaml names, at an OpenAI-compatible Responses endpoint. Set judge_api_key,
# and judge_base_url for another endpoint, in env.yaml or as overrides.
agentic_if_judge_model:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: ${oc.select:judge_base_url,https://inference-api.nvidia.com/v1}
      openai_api_key: ${oc.select:judge_api_key,null}
      openai_model: nvidia/zai-org/glm-5.3
      # Each attempt of a judge call gets 600 s and one HTTP try; this policy retries it twice more, and the grader
      # then asks again up to its own attempts (if_grading/data/judge.yaml). A judge outage so ends as judge_failed,
      # which reverification recovers, instead of holding the episode until its deadline.
      upstream_request_timeout_seconds: 600
      upstream_max_num_tries: 1
      upstream_retry_policy:
        max_attempts: 3
        backoff_initial_seconds: 5

# The harness. A run that pins the OpenCode binary sets its path and SHA-256 together (opencode_agent ignores a SHA-256
# without its path and downloads OpenCode); benchmarks/agentic_if/config.yaml also stages ripgrep and the plugin
# dependencies.
agentic_if_opencode_agent:
  # Moves the base instance, so no extra server starts.
  _inherit_from: opencode_agent
  responses_api_agents:
    opencode_agent:
      # OpenCode's context, input and output limits: the benchmark's budgets.
      context_window: 131072
      max_output_tokens: 131072
      # The harness budget of one episode.
      timeout: 10800
      # Each close step's budget. The collection step also writes OpenCode's session exports, which take longer as a
      # session grows (17 s for a 15-call session).
      session_close_timeout_seconds: 300
      # The resources server stages these at seed (opencode_bundle.PLUGIN_PATHS), loaded in this order after Gym's.
      plugins:
        - /tmp/nemo-gym-agentic-if/if-profile.mjs
        - /tmp/nemo-gym-agentic-if/if-boundary.mjs
      # OpenCode's session exports, which the resources server reads at verify (opencode_bundle.EXPORT_DIR).
      export_dir: /tmp/nemo-gym-agentic-if/exports
      # A continuation row's recorded prefix, which the resources server stages (opencode_bundle.SESSION_IMPORT_PATH).
      session_import_path: /tmp/nemo-gym-agentic-if/prefix-export.json
      # The session's own turns, so a compaction's summary call is not counted as a step (TE-9).
      return_session_trajectory: true
      opencode_config:
        # No tools map: with the permission map's "*": allow it would expose skill and webfetch again.
        tools: null
        # The default map plus three denies: webfetch, websearch and skill are never offered; tool selection is per
        # row (the plugins).
        permission:
          webfetch: deny
          websearch: deny
          skill: deny

agentic_if_environment_server:
  _inherit_from: single_agent_turn
  environment_servers:
    single_agent_turn:
      resources_server:
        type: resources_servers
        name: agentic_if_resources
      agent_server:
        type: responses_api_agents
        name: agentic_if_opencode_agent
      # Admit episodes at the agent's rate (opencode_agent's `concurrency`, 8 by default): admission waits before an
      # episode's deadline starts. A full run of the task set at this rate can take days; raise both to run faster.
      max_concurrent_episodes: 8
      queue_timeout_seconds: 604800
      # Above OpenCode's run (10800) plus seed, installation, verification and judging.
      default_episode_timeout_seconds: 18000
      # Each cleanup callback, such as agent close: OpenCode needs up to 5 x 300 = 1500 seconds (its exports are
      # written inside the collection step).
      cleanup_timeout_seconds: 1560
