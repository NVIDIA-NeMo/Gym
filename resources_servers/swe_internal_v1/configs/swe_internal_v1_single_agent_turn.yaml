config_paths:
- resources_servers/swe_internal_v1/configs/swe_internal_v1.yaml
- responses_api_agents/opencode_agent/configs/opencode_agent.yaml
- environment_servers/single_agent_turn/configs/single_agent_turn.yaml
environment_server_routes:
  swe_internal_v1: swe_internal_v1_opencode_single_agent_turn
swe_internal_v1_resources_server:
  resources_servers:
    swe_internal_v1:
      allowed_agents:
      - opencode_agent
      datasets:
      - name: example
        type: example
        taskset: swe_internal_v1
        jsonl_fpath: resources_servers/swe_internal_v1/data/example.jsonl
        num_repeats: 1
      verified: false
swe_internal_v1_opencode_agent:
  _inherit_from: opencode_agent
  responses_api_agents:
    opencode_agent:
      resources_server: null
swe_internal_v1_opencode_single_agent_turn:
  _inherit_from: single_agent_turn
  environment_servers:
    single_agent_turn:
      resources_server:
        type: resources_servers
        name: swe_internal_v1_resources_server
      agent_server:
        type: responses_api_agents
        name: swe_internal_v1_opencode_agent
      resources_tool_transports: []
      max_concurrent_episodes: 8
      queue_timeout_seconds: 604800
      default_episode_timeout_seconds: 18000
