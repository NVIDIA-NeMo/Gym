#
# Wires the opencode sandboxed agent to swe_internal_v1_resources_server for a training run.
# `swe_internal_v1.yaml` alone only defines the resources server (enough for golden-patch validation,
# which never touches an agent); this separate file keeps that path free of the agent's much
# larger opencode/sandbox config -- same split as swemer_v1.
#
#   gym env start --config resources_servers/swe_internal_v1/configs/swe_internal_v1_opencode.yaml

config_paths:
  - responses_api_agents/opencode_sandboxed_agent/configs/opencode_sandboxed_agent.yaml
  - resources_servers/swe_internal_v1/configs/swe_internal_v1.yaml

swe_internal_v1_opencode_sandboxed_agent:
  _inherit_from: opencode_sandboxed_agent
  responses_api_agents:
    opencode_sandboxed_agent:
      resources_server:
        type: resources_servers
        name: swe_internal_v1_resources_server
      datasets:
        - name: swe_internal_v1
          type: train
          jsonl_fpath: resources_servers/swe_internal_v1/data/swe_internal_v1_training.jsonl
          num_repeats: 1
          license: NVIDIA Internal Use Only, Do Not Distribute

swe_internal_v1_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: swe_internal_v1_opencode_sandboxed_agent
