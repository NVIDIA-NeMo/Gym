# Nemotron 3 Nano Omni 30B-A3B on a local vLLM server, reasoning ON.
# Sampling follows the model card's thinking mode. The pins replace the
# dataset rows' temperature 0 and 128-token cap, which would truncate thinking.
policy_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: ${policy_base_url}
      api_key: ${policy_api_key}
      model: ${policy_model_name}
      return_token_id_information: false
      uses_reasoning_parser: true
      uses_interleaved_reasoning: true
      chat_template_kwargs:
        enable_thinking: true
        reasoning_budget: 16384
      sampling_overrides:
        temperature: 0.6
        top_p: 0.95
        max_tokens: 20480
        thinking_token_budget: 17408
      extra_body: null
      default_headers: {}
      endpoint_file: null
      endpoint_stale_grace_s: 300.0
      endpoint_connection_retries: 8
      endpoint_check_interval_s: 10.0
