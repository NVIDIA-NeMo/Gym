geobench_vlm_resources_server:
  resources_servers:
    geobench_vlm:
      entrypoint: app.py
      domain: knowledge
      verified: false
      description: GEOBench-VLM geospatial vision-language multiple-choice benchmark.
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/geobench_vlm/data/example.jsonl
        num_repeats: 1
        license: Apache 2.0

geobench_vlm_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: geobench_vlm_resources_server
      model_server:
        type: responses_api_models
        name: policy_model

geobench_vlm_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: geobench_vlm_simple_agent
