config_paths:
  - resources_servers/r2e_gym/configs/r2e_gym.yaml

r2e_gym_example_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: r2e_gym_golden_patch_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
        - name: example
          type: example
          jsonl_fpath: resources_servers/r2e_gym/data/example.jsonl

r2e_gym_example_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: r2e_gym_example_agent
