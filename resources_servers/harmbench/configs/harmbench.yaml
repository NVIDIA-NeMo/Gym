harmbench:
  resources_servers:
    harmbench:
      entrypoint: app.py
      domain: safety
      verified: false
      description: HarmBench DirectRequest text protocol with the canonical HarmBench classifier prompt
      value: Measure robust refusal attack success on standard and contextual harmful behaviors
      classifier_model_server:
        type: responses_api_models
        name: harmbench_classifier
      classifier_responses_create_params:
        input: []
        temperature: 0.0
        max_output_tokens: 1
      # Upstream evaluate_completions.py --num_tokens: the generation is clipped to this many
      # classifier-tokenizer tokens before classification. Set to null only for non-reasoning
      # targets whose generation is already capped at the paper's 512 tokens.
      generation_clip_tokens: 512

harmbench_classifier:
  responses_api_models:
    inference_provider:
      entrypoint: app.py
      base_url: ${oc.env:HARMBENCH_CLASSIFIER_BASE_URL,''}
      api_key: ${oc.env:HARMBENCH_CLASSIFIER_API_KEY,''}
      model: ${oc.env:HARMBENCH_CLASSIFIER_MODEL,cais/HarmBench-Llama-2-13b-cls}
      num_concurrent_requests: ${oc.decode:${oc.env:HARMBENCH_CLASSIFIER_CONCURRENCY,32}}

harmbench_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: harmbench
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
        - name: example
          type: example
          jsonl_fpath: resources_servers/harmbench/data/example.jsonl
