multi_object_tracking_resources_server:
  resources_servers:
    multi_object_tracking:
      entrypoint: app.py
      domain: other
      verified: false
      description: Multi-object box tracking verifier for multi-image prompts on a 0-1000 grid
      value: Score each tracked object's per-frame boxes by IoU over its visible frames with the GOT-10k verifier and average over objects
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/multi_object_tracking/data/example.jsonl
        num_repeats: 1
multi_object_tracking_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: multi_object_tracking_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
multi_object_tracking_environment_server:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: multi_object_tracking_resources_server
      agent_server:
        type: responses_api_agents
        name: multi_object_tracking_agent
