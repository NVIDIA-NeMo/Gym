code_gen:
  resources_servers:
    code_gen:
      entrypoint: app.py
      domain: coding
      verified: true
      verified_url: https://wandb.ai/nvidia/bxyu-nemo-gym-rl-integration-20250926/runs/54uzarwq
      description: Model must submit the right code to solve a problem
      value: Improve competitive coding capabilities
      num_processes: 8
      unit_test_timeout_secs: 10
      debug: false
      # Set to `sandbox` (with a provider config such as
      # nemo_gym/sandbox/providers/opensandbox/configs/opensandbox.yaml) to run unit tests in a fresh
      # sandbox per verification instead of on a Ray worker. num_processes then caps concurrent sandboxes.
      # See the README ("Running unit tests in a sandbox") for a complete example config.
      sandbox_provider: null
      sandbox_config:
        image: ${oc.env:CODE_GEN_SANDBOX_IMAGE,null}
        # One test runs at a time, as on a Ray worker. Memory stays above the harness's 4 GiB
        # RLIMIT_DATA so a memory-hungry candidate fails its test instead of killing the sandbox.
        resources:
          cpu: 1
          memory_mib: 6144
        metadata:
          benchmark: code-gen
        provider_options:
          # Candidate code needs no network, and must not fetch answers. OpenSandbox enforces this;
          # Docker ignores it (set its `network: none` instead), and Daytona, E2B and OpenShell reject
          # the key, so remove it for them.
          network_policy:
            defaultAction: deny
            egress: []
code_gen_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: code_gen
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: opencodereasoning_filtered_train
        type: train
        jsonl_fpath: resources_servers/code_gen/data/opencodereasoning_filtered_25k_train.jsonl
        huggingface_identifier:
          repo_id: nvidia/nemotron-RL-coding-competitive_coding
          artifact_fpath: opencodereasoning_filtered_25k_train.jsonl
        license: Apache 2.0
        num_repeats: 1
      - name: livecodebench_v5_validation
        type: validation
        jsonl_fpath: resources_servers/code_gen/data/livecodebench_v5_2024-07-01_2025-02-01_validation.jsonl
        huggingface_identifier:
          repo_id: nvidia/nemotron-RL-coding-competitive_coding
          artifact_fpath: validation.jsonl
        gitlab_identifier:
          dataset_name: livecodebench
          version: 0.0.1
          artifact_fpath: livecodebench_v5_2024-07-01_2025-02-01_validation.jsonl
        license: MIT
        num_repeats: 10  # Use livecodebench setting, even if sampling parameters differ.
      - name: example
        type: example
        jsonl_fpath: resources_servers/code_gen/data/example.jsonl

code_gen_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: code_gen_simple_agent
