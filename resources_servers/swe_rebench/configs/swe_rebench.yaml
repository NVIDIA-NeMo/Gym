# Default OpenCode episode pairing. The legacy config supplies the shared resources settings.
config_paths:
- resources_servers/swe_rebench/configs/swe_rebench_legacy_agent.yaml
- responses_api_agents/opencode_agent/configs/opencode_agent.yaml
- environment_servers/single_agent_turn/configs/single_agent_turn.yaml
environment_server_routes:
  swe_rebench: swe_rebench_opencode_single_agent_turn
swe_rebench_resources_server:
  resources_servers:
    swe_rebench:
      allowed_agents:
      - opencode_agent
      datasets:
      - name: example
        type: example
        taskset: swe_rebench
        jsonl_fpath: resources_servers/swe_rebench/data/example.jsonl
        num_repeats: 1
      verified: false
swe_rebench_opencode_agent:
  _inherit_from: opencode_agent
  responses_api_agents:
    opencode_agent:
      resources_server: null
swe_rebench_opencode_single_agent_turn:
  _inherit_from: single_agent_turn
  environment_servers:
    single_agent_turn:
      resources_server:
        type: resources_servers
        name: swe_rebench_resources_server
      agent_server:
        type: responses_api_agents
        name: swe_rebench_opencode_agent
      resources_tool_transports: []
      max_concurrent_episodes: 8
      queue_timeout_seconds: 604800
      default_episode_timeout_seconds: 18000
