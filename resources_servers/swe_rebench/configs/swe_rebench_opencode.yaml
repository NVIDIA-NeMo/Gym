#
# Wires the opencode sandboxed agent to swe_rebench_resources_server for a training run --
# `swe_rebench.yaml` alone only defines the resources server, which is enough for golden-patch
# validation (apply_golden_patch.py talks to it directly, no agent involved) but not enough to
# actually run an agent against the dataset. This is a separate file, not folded into
# swe_rebench.yaml, so golden-patch validation keeps working without pulling in the agent's
# (much larger) opencode/sandbox config.
#
# This is training data (data/swe_rebench_training.jsonl, only the 22,684 already-supported
# instances -- see the README), not a fixed eval benchmark.
#
#   gym env start --config resources_servers/swe_rebench/configs/swe_rebench_opencode.yaml

config_paths:
  - responses_api_agents/opencode_sandboxed_agent/configs/opencode_sandboxed_agent.yaml
  - resources_servers/swe_rebench/configs/swe_rebench.yaml

swe_rebench_opencode_sandboxed_agent:
  _inherit_from: opencode_sandboxed_agent
  responses_api_agents:
    opencode_sandboxed_agent:
      resources_server:
        type: resources_servers
        name: swe_rebench_resources_server
      datasets:
        - name: swe_rebench_v2
          type: train
          jsonl_fpath: resources_servers/swe_rebench/data/swe_rebench_training.jsonl
          num_repeats: 1
          # nebius/SWE-rebench-V2's own Hub metadata license (cc-by-4.0).
          license: Creative Commons Attribution 4.0 International
