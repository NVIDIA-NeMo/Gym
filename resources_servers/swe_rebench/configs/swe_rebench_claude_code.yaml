#
# Wires the Claude Code sandboxed agent to swe_rebench_resources_server, as
# swe_rebench_opencode.yaml does for the OpenCode agent. Rows route here with
# agent_ref.name = swe_rebench_claude_code_sandboxed_agent.
#
#   gym env start --config resources_servers/swe_rebench/configs/swe_rebench_claude_code.yaml

config_paths:
  - responses_api_agents/claude_code_sandboxed_agent/configs/claude_code_sandboxed_agent.yaml
  - resources_servers/swe_rebench/configs/swe_rebench.yaml

swe_rebench_claude_code_sandboxed_agent:
  _inherit_from: claude_code_sandboxed_agent
  responses_api_agents:
    claude_code_sandboxed_agent:
      resources_server:
        type: resources_servers
        name: swe_rebench_resources_server
      datasets:
        - name: swe_rebench_v2
          type: train
          jsonl_fpath: resources_servers/swe_rebench/data/swe_rebench_training.jsonl
          num_repeats: 1
          # nebius/SWE-rebench-V2's own Hub metadata license (cc-by-4.0).
          license: Creative Commons Attribution 4.0 International

# Rollout collection reaches an agent through its environment server. Named after the agent, not
# the environment: swe_rebench_opencode.yaml's swe_rebench_environment_server fronts the OpenCode
# agent, and a run loads both.
swe_rebench_claude_code_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: swe_rebench_claude_code_sandboxed_agent
