# Pass to `gym eval run` of the converted dataset only. The native pairing (configs/swe_rebench.yaml) runs
# opencode_agent as a sandbox session with its shipped defaults (permissions/default.yaml, no thinking or
# sandbox_model_id override), which is what `--agent opencode_agent` runs on the Harbor arm too. The one key below
# restates the native agent budget so the two arms stay pinned together if the default moves.
opencode_agent:
  responses_api_agents:
    opencode_agent:
      timeout: 10800
