#
# Runs SWE-Gym training rows with OpenCode agent sessions under single_agent_turn. The resources server starts
# each task sandbox, lends it to opencode_agent, and grades the captured patch in a fresh sandbox after the agent
# closes. swe_gym_opencode_legacy_agent.yaml keeps opencode_sandboxed_agent on the legacy_agent relay.
#
# This is training data (data/swe_gym_training.jsonl), not a fixed eval benchmark.
#
#   gym env start --config resources_servers/swe_gym/configs/swe_gym_opencode.yaml

config_paths:
  - resources_servers/swe_gym/configs/swe_gym.yaml
  - responses_api_agents/opencode_agent/configs/opencode_agent.yaml
  - environment_servers/single_agent_turn/configs/single_agent_turn.yaml

environment_server_routes:
  swe_gym: swe_gym_opencode_single_agent_turn

swe_gym_resources_server:
  resources_servers:
    swe_gym:
      allowed_agents: [opencode_agent]
      verified: false
      sandbox_config:
        # Outlive the episode (default_episode_timeout_seconds, 21600), patch extraction, and final cleanup. The
        # resources session expires with the sandbox, and a verify after that is masked as SESSION_EXPIRED.
        ttl_s: 25200
      datasets:
        - name: swe_gym
          type: train
          taskset: swe_gym
          jsonl_fpath: resources_servers/swe_gym/data/swe_gym_training.jsonl
          num_repeats: 1
          # SWE-Gym/SWE-Gym's own Hub metadata license.
          license: MIT

# Golden-patch validation runs on its own config; this run does not use it.
swe_gym_golden_patch_resources_server: null

swe_gym_opencode_agent:
  _inherit_from: opencode_agent
  responses_api_agents:
    opencode_agent:
      resources_server: null
      # Training rollouts need the policy's token IDs, as opencode_sandboxed_agent records them by default. The
      # opencode_agent README still lists its session path as evaluation only; check the capture before training on it.
      token_id_capture: true

swe_gym_opencode_single_agent_turn:
  _inherit_from: single_agent_turn
  environment_servers:
    single_agent_turn:
      resources_server:
        type: resources_servers
        name: swe_gym_resources_server
      agent_server:
        type: responses_api_agents
        name: swe_gym_opencode_agent
      resources_tool_transports: []
