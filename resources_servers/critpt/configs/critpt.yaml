config_paths:
  - responses_api_agents/critpt_agent/configs/critpt_agent.yaml

critpt_resources_server:
  resources_servers:
    critpt:
      allowed_agents: [critpt_agent]
      entrypoint: app.py
      domain: other
      api_key: ${oc.select:artificial_analysis_api_key,null}
      verified: false
      description: Research-level physics problems scored by the Artificial Analysis API
      value: Evaluate model performance on research-level physics reasoning
      fire_after: null  # smoke-test only; CLI override fires the batch after N real submissions

critpt_agent:
  responses_api_agents:
    critpt_agent:
      resources_server:
        name: critpt_resources_server
      datasets:
        - name: example
          type: example
          jsonl_fpath: resources_servers/critpt/data/example.jsonl
          num_repeats: 1
          license: Apache 2.0

critpt_agent_environment_server:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      # The episode includes CritPt's batched verify() wait (bounded by verify_timeout_seconds on the resources
      # server). The legacy_agent relay applied no episode bound, so keep none rather than the 6 h default.
      default_episode_timeout_seconds: null
      resources_server:
        type: resources_servers
        name: critpt_resources_server
      agent_server:
        type: responses_api_agents
        name: critpt_agent
