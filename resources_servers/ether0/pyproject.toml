[project]
name = "gym-resources-servers-ether0"
version = "0.0.0"
requires-python = ">=3.13.14"
dependencies = [
    "nemo-gym[dev]",
    "datasets",
    "exmol>=3.3.0",
    "httpx",
    "huggingface-hub",
    "molbloom==2.3.4",
    "pydantic>=2",
    "rdkit",
    "regex",
    "tenacity",
    "matplotlib",
    "Pillow==12.3.0",
    "contourpy",
    "cycler",
    "kiwisolver",
    "scikit-learn",
    "scipy",
    "joblib",
    "threadpoolctl",
    # Local oracles (local_oracles.py): solubility, and the MolTrans forward-reaction model.
    "molsol>=0.0.3",
    "OpenNMT-py==2.3.0",
    "torch==2.6.0",
]

[tool.uv]
package = false
constraint-dependencies = [
    "grpcio>=1.84.1,!=1.85.0rc1",
    "certifi>=2026.10.19",
    "msgpack>=1.2.1",
    "pyarrow>=25.0.1",
    "transformers>=5.17.0",
]
override-dependencies = [
    "spacy>=3.8.13",
    "wcwidth; sys_platform == 'never'",
    "opencv-python-headless; sys_platform == 'never'",
    "pynvvideocodec; sys_platform == 'never'",
    "torchcodec; sys_platform == 'never'",
    "torchvision; sys_platform == 'never'",
    "torchaudio; sys_platform == 'never'",
    "pycountry; sys_platform == 'never'",
    "gprof2dot; sys_platform == 'never'",
    "pathspec; sys_platform == 'never'",
]
exclude-dependencies = [
    "fasttext-wheel",
    "alembic",
    "blinker",
    "flask",
    "flask-cors",
    "graphene",
    "graphql-core",
    "graphql-relay",
    "gunicorn",
    "huey",
    "prettytable",
    "skops",
    "sqlalchemy",
    "werkzeug",
    "waitress",
    "diskcache",
    # OpenNMT-py 2.3.0 imports pyonmttok only inside its tokenizer transform, which a
    # pre-trained MolTrans checkpoint never builds; pyonmttok has no Python 3.13 wheels.
    "pyonmttok",
]
required-version = ">=0.13.4"

[tool.uv.sources]
"nemo-gym" = { path = "../..", editable = true }

[tool.uv.sources.nemo-lens]
git = "https://github.com/NVIDIA-NeMo/Lens.git"
rev = "4d045c03186b90afdc815db46b671f6a21bc7e98"
[project.optional-dependencies]
telemetry = ["nemo-gym[telemetry]"]

[tool.uv.workspace]
members = []
