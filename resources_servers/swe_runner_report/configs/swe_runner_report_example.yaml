#
# Golden-patch check of the committed example rows (the rows' own patch is graded; the agent's output is not used).
config_paths:
  - resources_servers/swe_runner_report/configs/swe_runner_report_legacy_agent.yaml

swe_runner_report_example_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: swe_runner_report_golden_patch_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
        - name: example
          type: example
          jsonl_fpath: resources_servers/swe_runner_report/data/example.jsonl

swe_runner_report_example_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: swe_runner_report_example_agent
