# Runs the reasoning_gym benchmark against a LangChain deepagents graph hosted as a native Gym
# responses_api_agents server, so model calls go through Gym's own model_server (on-policy) rather than
# the agent bringing its own model.
#
#   gym env start --resources-server reasoning_gym/reasoning_gym_langchain_deepagents_agent_model_server \
#       --model-type inference_provider/openrouter
#   gym eval run --no-serve --agent reasoning_gym_langchain_deepagents_agent_model_server \
#       --input resources_servers/reasoning_gym/data/example.jsonl --output /tmp/langchain_deepagents_agent_rg.jsonl

reasoning_gym:
  resources_servers:
    reasoning_gym:
      entrypoint: app.py
      domain: knowledge
      verified: false
      description: In-tree deepagents (LangChain) agent for reasoning gym tasks, via a Gym model server.
      value: Runs a LangChain deepagents graph on-policy against Gym's model server, with deterministic
        <answer>-tag scoring and no LLM judge.

reasoning_gym_langchain_deepagents_agent_model_server:
  responses_api_agents:
    langchain_deepagents_agent:
      entrypoint: reasoning_search_agent.py
      resources_server:
        type: resources_servers
        name: reasoning_gym
      model_server:
        type: responses_api_models
        name: policy_model
      tavily_api_key: ${tavily_api_key}
      max_search_results: 5
      # reasoning_gym's verifier extracts the answer from <answer></answer> tags in the final message;
      # without this, correct reasoning still scores 0.
      system_prompt: "Answer the user, then restate your final answer wrapped in <answer></answer> tags."
      # nvidia/nemotron-3-ultra-550b-a55b's actual enforced limit (OpenRouter's `top_provider.context_length`,
      # not the larger nominal `context_length: 262144` — top_provider is what the routed provider actually
      # enforces). Update this if policy_model_name changes to point at a different model.
      max_input_tokens: 202800
