# In-tree counterpart to examples/langchain_deepagent (the remote_agent version of the same deepagents
# graph): same model, same TavilySearch tool, same <answer>-tag system prompt, same reasoning_gym
# benchmark — run as a native Gym responses_api_agents server instead of proxied through remote_agent to
# an externally-hosted FastAPI service.
#
#   gym env start --resources-server reasoning_gym/reasoning_gym_deepagents_agent_model_server \
#       --model-type inference_provider/openrouter
#   gym eval run --no-serve --agent reasoning_gym_deepagents_agent_model_server \
#       --input resources_servers/reasoning_gym/data/example.jsonl --output /tmp/deepagents_agent_rg.jsonl

reasoning_gym:
  resources_servers:
    reasoning_gym:
      entrypoint: app.py
      domain: knowledge
      verified: false
      description: In-tree deepagents (LangChain) agent for reasoning gym tasks, via a Gym model server.
      value: Side-by-side comparison point against examples/langchain_deepagent's remote_agent version.

reasoning_gym_deepagents_agent_model_server:
  responses_api_agents:
    deepagents_agent:
      entrypoint: reasoning_search_agent.py
      resources_server:
        type: resources_servers
        name: reasoning_gym
      model_server:
        type: responses_api_models
        name: policy_model
      tavily_api_key: ${tavily_api_key}
      max_search_results: 5
