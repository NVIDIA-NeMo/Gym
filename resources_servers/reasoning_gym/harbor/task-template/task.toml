schema_version = "1.4"

# Nothing here is graded: declaring an artifact lets a server with `separate_verifier_for_artifacts: true` verify in
# a fresh sandbox of this image (overlay included), where nothing the agent did can change the grader. Under the
# default shared verification the agent's sandbox grades, and an agent with root there can fake the reward.
artifacts = ["/logs/artifacts"]

[task]
name = "nemo-gym/reasoning-gym"
version = "1.0.0"
description = "Answer a Reasoning Gym question; graded by the reasoning_gym Resources Server's scorer"
authors = []
keywords = ["reasoning", "reasoning_gym"]

[metadata]
category = "reasoning"
tags = ["reasoning_gym"]

[verifier]
timeout_sec = 120.0

[agent]
# opencode_reasoning_gym_agent's `timeout`.
timeout_sec = 900.0

[environment]
# The overlay builds three source-only packages (one a C extension) at every seed.
build_timeout_sec = 900.0
workdir = "/workspace"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []

[verifier.env]

[environment.env]

[solution.env]
