# Video-Index v1.0 / v1.1 single-turn video MCQA with official rule scoring (videoindex_rule_v1)
# and fixed-cohort accuracy across the four official capability groups.
videoindex:
  resources_servers:
    videoindex:
      entrypoint: app.py
      domain: other
      verified: false
      description: Video-Index v1.0/v1.1 single-turn video MCQA (2-10 options) with official rule scoring and 4-capability-group accuracy.
      cohort_manifest: ${videoindex_cohort_manifest}

videoindex_single_turn:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: videoindex
      model_server:
        type: responses_api_models
        name: policy_model

videoindex_single_turn_environment:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: videoindex
      agent_server:
        type: responses_api_agents
        name: videoindex_single_turn
