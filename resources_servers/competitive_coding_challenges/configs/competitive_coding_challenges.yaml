competitive_coding_challenges_resources_server:
  resources_servers:
    competitive_coding_challenges:
      entrypoint: app.py
      domain: coding
      description: Execution of competitive programming competition questions
      value: Improve competitive coding capabilities on contest-style problems
      test_file: ${oc.env:CCC_TEST_FILE,data/test_metadata.jsonl}
      # Tests of one submission run in parallel in its sandbox. Time limits are wall-clock, so this stays at
      # about half of sandbox_config.resources.cpu: Communication tasks run a manager next to each submission.
      test_batch_size: 4
      num_parallel_requests: 16
      time_scale: 2.0
      reward_mode: binary
      # Benchmarks set both to grade every subtask with partial credit, as IOI and NeMo Skills do.
      grade_all_subtasks: false
      partial_credit: false
      # Every submission compiles and runs in a fresh sandbox; nothing runs on the server's host. Pass a
      # provider config that binds `sandbox`, such as
      # nemo_gym/sandbox/providers/opensandbox/configs/opensandbox.yaml, and set CCC_SANDBOX_IMAGE to an
      # image built from sandbox/Dockerfile. num_parallel_requests caps concurrent sandboxes, and
      # test_batch_size must not exceed sandbox_config.resources.cpu. See the README ("Sandbox").
      sandbox_provider: sandbox
      sandbox_config:
        image: ${oc.env:CCC_SANDBOX_IMAGE,null}
        # Read-only problem data from split_problem_metadata.py, mounted or baked into the image.
        problem_data_dir: /data/ccc
        # Whole verification (compiles plus every test run); exceeding it masks the sample.
        exec_timeout_s: 3600
        resources:
          cpu: 8
          memory_mib: 16384
        metadata:
          benchmark: competitive-coding
        provider_options:
          # Submissions need no network, and must not fetch answers. OpenSandbox and E2B enforce this;
          # Docker, Enroot, Apptainer and ECS ignore it (for Docker set `network: none` instead), and
          # Daytona, OpenShell and bwrap reject the key, so remove it for them.
          network_policy:
            defaultAction: deny
            egress: []
      verified: false
competitive_coding_challenges_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: competitive_coding_challenges_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/competitive_coding_challenges/data/example.jsonl

competitive_coding_challenges_environment_server:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: competitive_coding_challenges_resources_server
      agent_server:
        type: responses_api_agents
        name: competitive_coding_challenges_simple_agent
      resources_tool_transports:
      - direct_http
