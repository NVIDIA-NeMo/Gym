competitive_coding_challenges_resources_server:
  resources_servers:
    competitive_coding_challenges:
      entrypoint: app.py
      domain: coding
      description: Execution of competitive programming competition questions
      value: Improve competitive coding capabilities on contest-style problems
      test_file: ${oc.env:CCC_TEST_FILE,data/test_metadata.jsonl}
      test_batch_size: 32
      num_parallel_requests: 16
      time_scale: 2.0
      shared_dir: ${oc.env:CCC_SHARED_TEMP_DIR,${oc.env:SHARED_TEMP_DIR,/tmp}}
      local_compile_dir: ${oc.env:CCC_LOCAL_COMPILE_DIR,${oc.env:LOCAL_COMPILE_DIR,/tmp/nemo-gym-compile}}
      reward_mode: binary
      # Benchmarks set both to grade every subtask with partial credit, as IOI and NeMo Skills do.
      grade_all_subtasks: false
      partial_credit: false
      # Set to `sandbox` (with a provider config such as
      # nemo_gym/sandbox/providers/opensandbox/configs/opensandbox.yaml) to compile and run each
      # submission in a fresh sandbox instead of the NeMo Skills sandbox. num_parallel_requests then
      # caps concurrent sandboxes, and test_batch_size must not exceed sandbox_config.resources.cpu.
      # See the README ("Running in a provider sandbox") for a complete example config.
      sandbox_provider: null
      sandbox_config:
        image: ${oc.env:CCC_SANDBOX_IMAGE,null}
        # Read-only problem data from split_problem_metadata.py, mounted or baked into the image.
        problem_data_dir: /data/ccc
        # Whole verification (compiles plus every test run); exceeding it masks the sample.
        exec_timeout_s: 3600
        resources:
          cpu: 8
          memory_mib: 16384
        metadata:
          benchmark: competitive-coding
        provider_options:
          # Submissions need no network, and must not fetch answers. OpenSandbox enforces this;
          # Docker ignores it (set its `network: none` instead), and Daytona, E2B and OpenShell reject
          # the key, so remove it for them.
          network_policy:
            defaultAction: deny
            egress: []
      verified: false
competitive_coding_challenges_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: competitive_coding_challenges_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/competitive_coding_challenges/data/example.jsonl

competitive_coding_challenges_environment_server:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: competitive_coding_challenges_simple_agent
      resources_tool_transports:
      - direct_http
