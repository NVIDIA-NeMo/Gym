structured_outputs:
  resources_servers:
    structured_outputs:
      entrypoint: app.py
      domain: instruction_following
      verified: false
      description: Check if responses follow tool-call structured output schemas. Created 20260424.
      value: Improve schema adherence when structured output is expressed through tool calls
structured_outputs_v4_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      # One model call; its tool calls go to the verifier unexecuted.
      execute_tools: false
      resources_server:
        type: resources_servers
        name: structured_outputs
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: train
        type: train
        jsonl_fpath: resources_servers/structured_outputs/data/structured_outputs_v4_tool_call.jsonl
        gitlab_identifier:
          dataset_name: structured_outputs_v4_tool_call
          version: 0.0.1
          artifact_fpath: structured_outputs_v4_tool_call.jsonl
        license: Apache 2.0
      - name: example
        type: example
        jsonl_fpath: resources_servers/structured_outputs/data/structured_outputs_v4_example.jsonl

structured_outputs_v4_simple_environment_server:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: structured_outputs_v4_simple_agent
      resources_tool_transports:
      - direct_http
      default_episode_timeout_seconds: 21600
      cleanup_timeout_seconds: 180
