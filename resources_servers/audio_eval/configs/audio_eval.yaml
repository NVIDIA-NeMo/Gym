audio_eval:
  resources_servers:
    audio_eval:
      entrypoint: app.py
      domain: other
      description: Shared corpus-level scorer behind the speech and audio benchmarks listed under "Speech and audio benchmarks" below
      value: Evaluate speech recognition, translation, and audio understanding (evaluation only)
      verified: false
      profile_contracts: ""
      allowed_model_types:
      - vllm_model
      - local_vllm_model
      - local_vllm_model_proxy

audio_eval_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: audio_eval
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/audio_eval/data/example.jsonl
        license: Apache 2.0

audio_eval_environment_server:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: audio_eval_simple_agent
      resources_server:
        type: resources_servers
        name: audio_eval
      resources_tool_transports:
      - direct_http
