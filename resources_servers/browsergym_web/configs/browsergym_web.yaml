browsergym_web:
  resources_servers:
    browsergym_web:
      entrypoint: app.py
      num_workers: 1
      domain: agent
      verified: false
      description: Stateful BrowserGym runtime for the legacy WebVoyager profile
      value: Preserve BrowserGym open-ended browsing behind the shared Gym web contract
      max_sessions: 1
      artifact_dir: cache/browsergym-web/artifacts
      inline_screenshots: true
      max_evidence_screenshots: 3
      headless: true
      tags_to_mark: standard_html
      pre_observation_delay: 0.5
      record_video: false
      session_ttl_seconds: 3600
      reaper_interval_seconds: 60
      require_auth: false
      auth_token_env: BROWSERGYM_WEB_RESOURCES_TOKEN
      site_pool_mode: unmanaged
      allowed_benchmarks: [webvoyager]
