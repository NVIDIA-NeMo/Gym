config_paths:
  - responses_api_agents/nooa_agent/configs/nooa_agent.yaml

environment_server_routes:
  nooa-counter: example_session_state_mgmt_environment_server

example_session_state_mgmt_nooa_resources:
  resources_servers:
    example_session_state_mgmt:
      entrypoint: nooa_app.py
      domain: agent
      verified: false
      description: Stateful counter tasks exercised through NOOA agent and resource sessions
      datasets:
        - name: example
          type: example
          jsonl_fpath: resources_servers/example_session_state_mgmt/data/example_nooa_tasks.jsonl
          license: Apache 2.0

example_session_state_mgmt_nooa_agent:
  _inherit_from: nooa_agent
  responses_api_agents:
    nooa_agent:
      resources_server:
        type: resources_servers
        name: example_session_state_mgmt_nooa_resources

example_session_state_mgmt_environment_server:
  _inherit_from: nooa_environment_server
  environment_servers:
    single_agent_turn:
      resources_server:
        type: resources_servers
        name: example_session_state_mgmt_nooa_resources
      agent_server:
        type: responses_api_agents
        name: example_session_state_mgmt_nooa_agent
      resources_tool_transports: [direct_http]
      default_episode_timeout_seconds: 600
