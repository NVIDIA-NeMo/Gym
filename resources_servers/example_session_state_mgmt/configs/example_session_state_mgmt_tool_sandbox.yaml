# The counter example with its toolset served from a sandbox of each episode. The Environment Server seeds the counter
# on the host, moves the session's counter into the episode's tool sandbox, grants the agent the sandbox's tools, then
# moves the counter the tools left back to the host and verifies there (nemo_gym.server_runtime.resources_tool_sandbox).
# expected_count, which only the verifier reads, never enters the sandbox.
# The image holds the Gym repository at /gym and a Python with nemo-gym installed.
config_paths:
  - environment_servers/single_agent_turn_legacy/configs/single_agent_turn_legacy.yaml

example_session_state_mgmt_tool_sandbox_resources_server:
  resources_servers:
    example_session_state_mgmt:
      entrypoint: app.py
      domain: agent
      verified: false
      description: Session state management (in-memory), with the tools in a sandbox of each episode
example_session_state_mgmt_session_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: example_session_state_mgmt_tool_sandbox_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/example_session_state_mgmt/data/example.jsonl

example_session_state_mgmt_tool_sandbox:
  _inherit_from: single_agent_turn_legacy
  environment_servers:
    single_agent_turn_legacy:
      resources_server:
        type: resources_servers
        name: example_session_state_mgmt_tool_sandbox_resources_server
      agent_server:
        type: responses_api_agents
        name: example_session_state_mgmt_session_agent
      resources_tool_transports:
      - direct_http
      sandbox_provider:
        docker: {}
      resources_tool_sandbox:
        image: ${oc.select:example_session_state_mgmt_tool_sandbox_image,nemo-gym:latest}
        # The rule bounds what the tools reach; the agent reaches the tools through the sandbox's endpoint. Docker
        # cannot close the egress of a sandbox whose port it publishes; on OpenSandbox, use no_network.
        network: inherit
