<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="t d">
  <title id="t">Who stores the count</title>
  <desc id="d">The resources server stores the counter. The agent calls tools. The model only chooses the next tool.</desc>
  <rect width="960" height="280" fill="#0A0A0A"/>
  <rect width="960" height="3" fill="#76B900"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="480" y="36" fill="#FFFFFF" font-size="16" font-weight="700">The server remembers the number. The model does not.</text>

    <rect x="40" y="56" width="280" height="168" rx="4" fill="#161616" stroke="#76B900" stroke-width="2"/>
    <text x="180" y="84" fill="#76B900" font-size="11" letter-spacing="1.5">RESOURCES SERVER</text>
    <text x="180" y="128" fill="#FFFFFF" font-size="40" font-weight="700">7</text>
    <text x="180" y="160" fill="#FFFFFF" font-size="14">stores the counter</text>
    <text x="180" y="184" fill="#8A8A8A" font-size="12">session_id → int</text>
    <text x="180" y="204" fill="#8A8A8A" font-size="12">this is session state</text>

    <rect x="340" y="56" width="280" height="168" rx="4" fill="#161616" stroke="#2A2A2A"/>
    <text x="480" y="84" fill="#8A8A8A" font-size="11" letter-spacing="1.5">AGENT</text>
    <text x="480" y="136" fill="#FFFFFF" font-size="18" font-weight="700">calls the tools</text>
    <text x="480" y="164" fill="#8A8A8A" font-size="13">talks to the server</text>
    <text x="480" y="186" fill="#8A8A8A" font-size="13">does not keep the count</text>

    <rect x="640" y="56" width="280" height="168" rx="4" fill="#161616" stroke="#2A2A2A"/>
    <text x="780" y="84" fill="#8A8A8A" font-size="11" letter-spacing="1.5">MODEL</text>
    <text x="780" y="136" fill="#FFFFFF" font-size="18" font-weight="700">picks the next tool</text>
    <text x="780" y="164" fill="#8A8A8A" font-size="13">says “add 4”</text>
    <text x="780" y="186" fill="#8A8A8A" font-size="13">never writes the dict</text>

    <text x="480" y="254" fill="#8A8A8A" font-size="13">Green box = the only place the count lives</text>
  </g>
</svg>
