<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" role="img" aria-labelledby="t d">
  <title id="t">Two sessions do not share a counter</title>
  <desc id="d">Same server. Cookie A is 2. Cookie B is 7.</desc>
  <rect width="960" height="250" fill="#0A0A0A"/>
  <rect width="960" height="3" fill="#76B900"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="480" y="36" fill="#FFFFFF" font-size="16" font-weight="700">Same server. Two cookies. Two counters.</text>

    <rect x="40" y="56" width="400" height="140" rx="4" fill="#161616" stroke="#2A2A2A"/>
    <text x="240" y="88" fill="#8A8A8A" font-size="12" letter-spacing="1">COOKIE A</text>
    <text x="240" y="140" fill="#FFFFFF" font-size="48" font-weight="700">2</text>
    <text x="240" y="172" fill="#8A8A8A" font-size="13">session_id_to_counter[A] = 2</text>

    <text x="480" y="128" fill="#76B900" font-size="28" font-weight="700">≠</text>

    <rect x="520" y="56" width="400" height="140" rx="4" fill="#161616" stroke="#2A2A2A"/>
    <text x="720" y="88" fill="#8A8A8A" font-size="12" letter-spacing="1">COOKIE B</text>
    <text x="720" y="140" fill="#FFFFFF" font-size="48" font-weight="700">7</text>
    <text x="720" y="172" fill="#8A8A8A" font-size="13">session_id_to_counter[B] = 7</text>

    <text x="480" y="226" fill="#8A8A8A" font-size="13">Drop the cookie and you start a third session at 0.</text>
  </g>
</svg>
