#
# Wires the opencode sandboxed agent to swemer_v1_resources_server for a training run --
# `swemer_v1.yaml` alone only defines the resources server, which is enough for golden-patch
# validation (apply_golden_patch.py talks to it directly, no agent involved) but not enough to
# actually run an agent against the dataset. This is a separate file, not folded into
# swemer_v1.yaml, so golden-patch validation keeps working without pulling in the agent's (much
# larger) opencode/sandbox config.
#
# data/swemer_v1_training.jsonl is built offline from an internal source (no prepare script in
# this repo -- see the README), and holds only the instances whose golden patch resolved in all
# three passes of a full-set 3x sweep.
#
#   gym env start --config resources_servers/swemer_v1/configs/swemer_v1_opencode.yaml

config_paths:
  - responses_api_agents/opencode_sandboxed_agent/configs/opencode_sandboxed_agent.yaml
  - resources_servers/swemer_v1/configs/swemer_v1.yaml

swemer_v1_opencode_sandboxed_agent:
  _inherit_from: opencode_sandboxed_agent
  responses_api_agents:
    opencode_sandboxed_agent:
      resources_server:
        type: resources_servers
        name: swemer_v1_resources_server
      datasets:
        - name: swemer_v1
          type: train
          jsonl_fpath: resources_servers/swemer_v1/data/swemer_v1_training.jsonl
          num_repeats: 1
          license: NVIDIA Internal Use Only, Do Not Distribute
