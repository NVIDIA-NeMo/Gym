visual_browser:
  resources_servers:
    visual_browser:
      entrypoint: app.py
      domain: agent
      verified: false
      description: Headed Chromium/PyAutoGUI visual-browser runtime for WebVoyager
      value: Preserve public-site proxy, CAPTCHA, and navigation behavior behind Gym's web protocol
      max_sessions: 1
      artifact_dir: cache/webvoyager-browser/artifacts
      inline_screenshots: true
      max_evidence_screenshots: 200
      headless: false
      viewport_width: 1920
      viewport_height: 1080
      action_delay_seconds: 2.0
      terminate_on_action_error: true
      max_computer_actions: 20
      proxy_mode: webvoyager_domains
      require_captcha_solver: true
      record_video: false
      session_ttl_seconds: 14400
      reaper_interval_seconds: 60
      require_auth: false
      site_pool_mode: unmanaged
      allowed_benchmarks: [webvoyager]
