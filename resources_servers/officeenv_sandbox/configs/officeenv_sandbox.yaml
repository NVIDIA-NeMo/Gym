# OfficeEnv's sandboxed episodes (configs/officeenv_sandbox_episodes.yaml) for Pi. Pi borrows each episode's
# sandbox (a container from sandbox/Dockerfile), reaches OfficeEnv's tools over MCP, and moves file content over the
# episode's file API (README.md in the workspace). Compose with a sandbox provider and a model server; the sandbox
# must reach both this resources server and the model server, so bind them to an address the containers can reach
# (a setting of the episodes' server, which Pi's server inherits):
#
#   gym env start \
#     --config resources_servers/officeenv_sandbox/configs/officeenv_sandbox.yaml \
#     --config nemo_gym/sandbox/providers/docker/configs/docker.yaml \
#     --model-type inference_provider --model <model> --model-url <url> '+policy_api_key=...' \
#     ++officeenv_sandbox_resources_server.resources_servers.officeenv_sandbox.host=<host address> \
#     ++policy_model.responses_api_models.inference_provider.host=<host address>
#
# Rows: data/sandbox_pilot.jsonl (sandbox/prepare_rows.py), whose prompts name the tools as Pi lists
# them (company_<tool>). Rows in another exposure (prepare_rows.py --exposure cli|api_search) run as they are: a `cli`
# episode's seed grants Pi no MCP tools, and Pi needs no finish tool on any exposure, since the Environment Server ends
# its run once the task has ended (end_on_task_state).
config_paths:
  - resources_servers/officeenv_sandbox/configs/officeenv_sandbox_episodes.yaml
  - responses_api_agents/pi_agent/configs/pi_agent.yaml
  - environment_servers/single_agent_turn_legacy/configs/single_agent_turn_legacy.yaml

# The episodes' server under Pi's own name, naming the MCP tools as Pi lists them. It inherits the episodes' server as
# the merged config has it, as each harness config composed beside this one does under its own name, so no episodes'
# server is left idle. Its domain and description repeat the episodes' server's: Gym's README table reads them from
# this file's first mapping.
officeenv_sandbox_pi_resources_server:
  _inherit_from: officeenv_sandbox_resources_server
  resources_servers:
    officeenv_sandbox:
      domain: agent
      verified: false
      description: OfficeEnv episodes lent to sandboxed harnesses (MCP tools, commands or endpoints, a sandbox per episode, a file API)
      sandbox_config:
        # How Pi names the MCP tools (`<mcp_server_name>_<tool>`), for the workspace guide
        mcp_tool_prefix: company_

# Gym's Pi (responses_api_agents/pi_agent), under this config's own name.
officeenv_sandbox_pi_agent:
  _inherit_from: pi_agent
  responses_api_agents:
    pi_agent:
      # No finish tool: the Environment Server ends the run once the task has ended, on every exposure
      # (end_on_task_state below), while a finish tool that a row's tools do not offer fails Pi's setup.
      finish_tool_names: []
      # the server whose rows these are, so they are checked against its task data schema
      resources_server:
        type: resources_servers
        name: officeenv_sandbox_pi_resources_server
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/officeenv_sandbox/data/example.jsonl
      timeout: 1800
      # Pi's default, set here for the admission cap below to follow.
      concurrency: 8

officeenv_sandbox_pi_environment_server:
  _inherit_from: single_agent_turn_legacy
  environment_servers:
    single_agent_turn_legacy:
      resources_server:
        name: officeenv_sandbox_pi_resources_server
      agent_server:
        name: officeenv_sandbox_pi_agent
      resources_tool_transports: [mcp]
      # Stop Pi's run once its task has ended (complete_task, on any exposure), before any further model call: the
      # server watches the episode's task state, stops the run (POST /rollouts/{rollout_id}/stop), and the call that
      # ended the task is answered only after that.
      end_on_task_state: true
      # The seed lends an episode its sandbox, whose TTL runs from then, and Pi runs at most `concurrency` episodes at
      # once: an episode admitted beyond them waits for Pi while its sandbox's TTL runs, and fails when the sandbox
      # expires ("Sandbox not found"). So the server admits no more episodes than Pi runs, and follows a raised
      # `concurrency`; the rest wait here, before their seed, holding no sandbox, their deadline not started.
      max_concurrent_episodes: ${officeenv_sandbox_pi_agent.responses_api_agents.pi_agent.concurrency}
      # A day, as GDPVal's and EnterpriseOps' capped configs wait: a large collection queues episodes for hours.
      queue_timeout_seconds: 86400
