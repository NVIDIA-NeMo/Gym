# OfficeEnv's sandboxed episodes (configs/officeenv_sandbox_episodes.yaml) for mini-SWE, on rows whose apps are
# commands (`cli`: sandbox/prepare_rows.py --exposure cli). mini-SWE borrows each episode's sandbox and works there
# with nothing but bash, so the episode grants no MCP tools; it reads the row's system and user messages as one task
# text and ends by printing its submission marker. Compose and run as configs/officeenv_sandbox.yaml shows, with this
# config and `--agent officeenv_sandbox_miniswe_agent`. mini-SWE installs its Python packages from PyPI in each
# sandbox at session start (Gym uploads its Python and uv), so its sandboxes need the internet, or an image with them
# installed.
config_paths:
  - resources_servers/officeenv_sandbox/configs/officeenv_sandbox_episodes.yaml
  - responses_api_agents/miniswe_sandboxed_agent/configs/miniswe_sandboxed_agent.yaml
  - environment_servers/single_agent_turn_legacy/configs/single_agent_turn_legacy.yaml

# The episodes' server under mini-SWE's own name, as configs/officeenv_sandbox.yaml explains for Pi.
officeenv_sandbox_miniswe_resources_server:
  _inherit_from: officeenv_sandbox_resources_server

# Gym's mini-SWE (responses_api_agents/miniswe_sandboxed_agent), under this config's own name.
officeenv_sandbox_miniswe_agent:
  _inherit_from: miniswe_sandboxed_agent
  responses_api_agents:
    miniswe_sandboxed_agent:
      # Only on 127.0.0.1, also under an explicit default_host (NeMo RL sets one): no sandbox calls this server.
      host: 127.0.0.1
      agent_timeout_sec: 1800

officeenv_sandbox_miniswe_environment_server:
  _inherit_from: single_agent_turn_legacy
  environment_servers:
    single_agent_turn_legacy:
      # Only on 127.0.0.1, also under an explicit default_host (NeMo RL sets one): no sandbox calls this server.
      host: 127.0.0.1
      resources_server:
        name: officeenv_sandbox_miniswe_resources_server
      agent_server:
        name: officeenv_sandbox_miniswe_agent
      resources_tool_transports: []
