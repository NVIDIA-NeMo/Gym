sciknoweval:
  resources_servers:
    sciknoweval:
      entrypoint: app.py
      domain: knowledge
      verified: false
      description: SciKnowEval V2 science knowledge and reasoning across four domains
      value: Exact answer grading and task-specific normalized judge scores across
        L1-L5
      judge_model_server: null
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/sciknoweval/data/example.jsonl
sciknoweval_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: sciknoweval
      model_server:
        type: responses_api_models
        name: policy_model
sciknoweval_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: sciknoweval_simple_agent
