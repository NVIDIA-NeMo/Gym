#
# Wires the Claude Code sandboxed agent to swemer_v2_resources_server, as
# swemer_v2_opencode.yaml does for the OpenCode agent. Rows route here with
# agent_ref.name = swemer_v2_claude_code_sandboxed_agent.
#
#   gym env start --config resources_servers/swemer_v2/configs/swemer_v2_claude_code.yaml

config_paths:
  - responses_api_agents/claude_code_sandboxed_agent/configs/claude_code_sandboxed_agent.yaml
  - resources_servers/swemer_v2/configs/swemer_v2.yaml

swemer_v2_claude_code_sandboxed_agent:
  _inherit_from: claude_code_sandboxed_agent
  responses_api_agents:
    claude_code_sandboxed_agent:
      resources_server:
        type: resources_servers
        name: swemer_v2_resources_server
      datasets:
        - name: swemer_v2
          type: train
          jsonl_fpath: resources_servers/swemer_v2/data/swemer_v2_training.jsonl
          num_repeats: 1
          license: NVIDIA Internal Use Only, Do Not Distribute

# Rollout collection reaches an agent through its environment server. Named after the agent, not
# the environment: swemer_v2_opencode.yaml's swemer_v2_environment_server fronts the OpenCode
# agent, and a run loads both.
swemer_v2_claude_code_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: swemer_v2_claude_code_sandboxed_agent
