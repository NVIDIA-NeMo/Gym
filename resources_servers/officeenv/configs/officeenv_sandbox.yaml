# OfficeEnv episodes for a sandboxed harness. Pi borrows each episode's sandbox (a container from
# sandbox/Dockerfile), reaches OfficeEnv's tools over MCP, and moves file content over the episode's
# file API (OFFICEENV.md in the workspace). Compose with a sandbox provider and a model server; the
# sandbox must reach both this resources server and the model server, so bind them to an address
# the containers can reach:
#
#   gym env start \
#     --config resources_servers/officeenv/configs/officeenv_sandbox.yaml \
#     --config nemo_gym/sandbox/providers/docker/configs/docker.yaml \
#     --model-type inference_provider --model <model> --model-url <url> '+policy_api_key=...' \
#     ++oe.resources_servers.officeenv.host=<host address> \
#     ++policy_model.responses_api_models.inference_provider.host=<host address>
#
# Rows: data/sandbox_pilot.jsonl (sandbox/prepare_rows.py). The resources server's instance name is
# the MCP grant name Pi prefixes to every tool, so it stays short.
config_paths:
  - responses_api_agents/pi_agent/configs/pi_agent.yaml
  - environment_servers/single_agent_turn_legacy/configs/single_agent_turn_legacy.yaml

oe:
  resources_servers:
    officeenv:
      entrypoint: app.py
      domain: agent
      verified: false
      description: OfficeEnv episodes lent to sandboxed harnesses (MCP tools, a sandbox per episode, a file API)
      expose_tools_over_mcp: true
      sandbox_provider: sandbox
      sandbox_config:
        image: officeenv-sandbox:pilot
        ttl_s: 7200
        # Drive file content stays out of the model's context: a download saves the file in the workspace
        # (/workspace/drive/<file id>/<name>) and answers with its path, the content inline only for text up to
        # this many bytes; an upload that pastes binary content or longer text is refused with the file API
        # command. null answers and takes content in full.
        inline_file_bytes: 8192

pi_agent:
  responses_api_agents:
    pi_agent:
      finish_tool_names: [user_complete_task]
      timeout: 1800

single_agent_turn_legacy:
  environment_servers:
    single_agent_turn_legacy:
      resources_server:
        name: oe
      agent_server:
        name: pi_agent
      resources_tool_transports: [mcp]
