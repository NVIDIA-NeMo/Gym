# OfficeEnv's sandboxed episodes (configs/officeenv_sandbox_episodes.yaml) for mini-SWE, on rows whose apps are
# commands (`cli`: sandbox/prepare_rows.py --exposure cli). mini-SWE borrows each episode's sandbox and works there
# with nothing but bash, so the episode grants no MCP tools; it reads the row's system and user messages as one task
# text and ends by printing its submission marker. Compose and run as configs/officeenv_sandbox.yaml shows, with this
# config and `--agent miniswe_sandboxed_agent`. mini-SWE installs its Python packages from PyPI in each sandbox at
# session start (Gym uploads its Python and uv), so its sandboxes need the internet, or an image with them installed.
config_paths:
  - resources_servers/officeenv/configs/officeenv_sandbox_episodes.yaml
  - responses_api_agents/miniswe_sandboxed_agent/configs/miniswe_sandboxed_agent.yaml
  - environment_servers/single_agent_turn_legacy/configs/single_agent_turn_legacy.yaml

miniswe_sandboxed_agent:
  responses_api_agents:
    miniswe_sandboxed_agent:
      agent_timeout_sec: 1800

single_agent_turn_legacy:
  environment_servers:
    single_agent_turn_legacy:
      resources_server:
        name: oe
      agent_server:
        name: miniswe_sandboxed_agent
      resources_tool_transports: []
