vials_judge_model:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      # Model-name settings must not collide with the vials_judge_model server instance.
      openai_base_url: ${oc.select:vials_judge_base_url,${oc.select:judge_base_url,https://api.openai.com/v1}}
      openai_api_key: ${oc.select:vials_judge_api_key,${oc.select:judge_api_key,EMPTY}}
      openai_model: ${oc.select:vials_judge_model_name,${oc.select:judge_model_name,gpt-5-mini}}
