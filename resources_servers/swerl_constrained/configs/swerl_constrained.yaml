swerl_constrained_resources_server:
  resources_servers:
    swerl_constrained:
      entrypoint: app.py
      domain: coding
      verified: false
      description: >
        Sandboxed SWE-bench patch evaluation with per-task behavioral constraints.
        Scores both task completion (sandbox test harness) and constraint adherence
        (deterministic patch analysis). Constraints are declared in metadata.constraints.
      value: Improve SWE capabilities with constraint-aware reward shaping
      env: singularity
      num_processes: 2048
      sandbox_timeout: 900
      debug: false
      relaxed_formatting: false

swerl_constrained_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: swerl_constrained_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
        - name: example
          type: example
          jsonl_fpath: resources_servers/swerl_constrained/data/example.jsonl
          num_repeats: 1
