[project]
name = "local-vllm-model"
version = "0.2.0rc0"
requires-python = ">=3.13.14"
dependencies = [
    "nemo-gym[dev]",
    # VLMEvalKit dependencies
    "accelerate",
    "anls>=0.0.2",
    # We need to remove this runtime restriction otherwise Gym's hydra won't work properly
    # "antlr4-python3-runtime==4.11.1",
    "apted>=1.0.3",
    "bert_score",
    "cairosvg",
    "colormath>=3.0.0",
    "datasets",
    # Original VLMEvalKit uses decord which is not compatible with MacOS
    # "decord>=0.6.0",
    "decord2>=3.0.0",
    "distance>=0.1.3",
    "dotenv",
    "editdistance>=0.8.1",
    "einops",
    # for gemini api
    "google-genai",
    "gradio",
    "huggingface_hub",
    "imageio",
    "ipdb",
    "jieba>=0.42.1",
    "json_repair",
    "levenshtein>=0.27.1",
    "lpips",
    "lxml>=6.0.2",
    "math-verify",
    "matplotlib",
    "nltk",
    "num2words",
    "numpy",
    "omegaconf>=2.4.0.dev4",
    "openai",
    "openai-clip",
    "opencv-python>=4.7.0.72",
    "openpyxl",
    "pandas",
    "pdf2image>=1.17.0",
    "pillow==12.2.0",
    "polygon3>=3.0.9.1",
    "portalocker",
    "protobuf",
    "pylatexenc==2.10",
    "python-dotenv",
    "qwen_vl_utils",
    "requests",
    "rich",
    "scikit-image",
    "scikit-learn",
    # For UniSVG
    "sentence_transformers",
    "sentencepiece",
    "setuptools",
    "sty",
    "sympy",
    "tabulate",
    "tiktoken",
    "timeout-decorator",
    "timm",
    "torch",
    # For SArena
    "torchmetrics",
    "torchvision",
    "tqdm",
    "transformers",
    "typing_extensions",
    "validators",
    "xlsxwriter",
    "zss>=1.2.0",
    # Somehow this is missing from VLMEvalKit requirements, possibly due to HF updates.
    "rouge",
]

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61", "setuptools-scm"]

[tool.setuptools.packages.find]
where = [".."]
include = ["local_vllm_model"]

[tool.uv]
constraint-dependencies = [
    "grpcio>=1.81.0rc1",
    "msgpack>=1.2.1",
]
exclude-dependencies = [
    "fasttext-wheel",
    "alembic",
    "blinker",
    "cryptography",
    "flask",
    "flask-cors",
    "graphene",
    "graphql-core",
    "graphql-relay",
    "gunicorn",
    "huey",
    "prettytable",
    "skops",
    "sqlalchemy",
    "werkzeug",
    "waitress",
    "diskcache",
]
# Re-enable codec-bearing packages blocked by the root nemo-gym override.
# vlm_eval_kit requires these for vision model evaluation.
override-dependencies = [
    "spacy>=3.8.13",
    "wcwidth; sys_platform == 'never'",
    "opencv-python-headless; sys_platform == 'never'",
    "pynvvideocodec; sys_platform == 'never'",
    "torchcodec; sys_platform == 'never'",
    "torchaudio; sys_platform == 'never'",
    "pycountry; sys_platform == 'never'",
    "gprof2dot; sys_platform == 'never'",
    "pathspec; sys_platform == 'never'",
    "opencv-python>=4.7.0.72",
    "decord2>=3.0.0",
    "torchvision",
]

[tool.uv.sources]
nemo-lens = { git = "https://github.com/NVIDIA-NeMo/Lens.git", rev = "4d045c03186b90afdc815db46b671f6a21bc7e98" }
nemo-gym = { path = "../..", editable = true }

[project.optional-dependencies]
telemetry = ["nemo-gym[telemetry]"]

[tool.uv.workspace]
members = []
