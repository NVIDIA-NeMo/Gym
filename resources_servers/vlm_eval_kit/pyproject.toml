[project]
name = "local-vllm-model"
version = "0.2.0rc0"
requires-python = ">=3.13.14"
dependencies = [
    "nemo-gym[dev]",
    # VLMEvalKit dependencies
    "accelerate",
    "anls>=0.0.2",
    # We need to remove this runtime restriction otherwise Gym's hydra won't work properly
    # "antlr4-python3-runtime==4.11.1",
    "apted>=1.0.3",
    "bert_score",
    "cairosvg",
    "colormath>=3.0.0",
    "datasets",
    # Original VLMEvalKit uses decord which is not compatible with MacOS
    # "decord>=0.6.0",
    "decord2>=3.0.0",
    "distance>=0.1.3",
    "dotenv",
    "editdistance>=0.8.1",
    "einops",
    # for gemini api
    "google-genai",
    "gradio",
    "huggingface_hub",
    "imageio",
    "ipdb",
    "jieba>=0.42.1",
    "json_repair",
    "levenshtein>=0.27.1",
    "lpips",
    "lxml>=6.0.2",
    "math-verify",
    "matplotlib",
    # nltk 3.10.1 (2026-08-01) added nltk/inisec.py: a meta-path finder that raises
    # ImportError for ANY nltk-initiated import whose resolved origin lies under the
    # process CWD. Gym always runs with a venv beneath the CWD -- server processes and
    # benchmark prep helpers run with CWD == <server dir>, whose venv is <server dir>/.venv,
    # and the deployment container runs with CWD == the Gym install root (/opt/Gym), which
    # contains every server venv. Either way the whole of site-packages counts as "under
    # CWD", so `import nltk` dies inside nltk/text.py on `import regex`. That kills data
    # prep for every vlm_eval_kit benchmark on a cold venv (the benchmark JSONL is never
    # written, and the run fails later with a misleading FileNotFoundError at aggregation)
    # and kills the nltk-backed scorers (OCRBench_v2 BLEU/METEOR) at verify time.
    # PYTHONSAFEPATH / -P do NOT help despite what the ImportError message suggests:
    # site-packages is on sys.path via sys.prefix, so the origin is still under CWD.
    # Moving the CWD is not a fix either -- Gym resolves relative dataset/config paths
    # against the CWD, so there is no CWD outside every venv that keeps that model intact.
    # Revisit if upstream narrows the hook to sys.path[0] or drops it.
    "nltk<3.10.1",
    "num2words",
    "numpy",
    "omegaconf>=2.4.0.dev4",
    "openai",
    "openai-clip",
    "opencv-python>=4.7.0.72",
    "openpyxl",
    "pandas",
    "pdf2image>=1.17.0",
    "pillow==12.2.0",
    "polygon3>=3.0.9.1",
    "portalocker",
    "protobuf",
    "pylatexenc==2.10",
    # Required by VLMEvalKitMcore (video datasets import these unguarded at package import).
    "pysubs2",
    "av",
    "python-dotenv",
    "qwen_vl_utils",
    "requests",
    "rich",
    "scikit-image",
    "scikit-learn",
    # For UniSVG
    "sentence_transformers",
    "sentencepiece",
    "setuptools",
    "sty",
    "sympy",
    "tabulate",
    "tiktoken",
    "timeout-decorator",
    "timm",
    "torch",
    # For SArena
    "torchmetrics",
    "torchvision",
    "tqdm",
    # transformers 5.x breaks vlmeval imports (AutoModelForVision2Seq removed,
    # huggingface_hub is_offline_mode shim); without a lower bound the resolver
    # backtracks to 4.12. Verified against the mcore pin.
    "transformers>=4.49,<5",
    "typing_extensions",
    "validators",
    "xlsxwriter",
    "zss>=1.2.0",
    # Somehow this is missing from VLMEvalKit requirements, possibly due to HF updates.
    "rouge",
]

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61", "setuptools-scm"]

[tool.setuptools.packages.find]
where = [".."]
include = ["local_vllm_model"]

[tool.uv]
# Re-enable codec-bearing packages blocked by the root nemo-gym override.
# vlm_eval_kit requires these for vision model evaluation.
override-dependencies = [
    "opencv-python>=4.7.0.72",
    "decord2>=3.0.0",
    "torchvision",
]

[tool.uv.sources]
nemo-gym = { path = "../..", editable = true }
