#
# BEAVER text-to-SQL resources server: execution-based verification on BEAVER's MySQL databases, scored with BEAVER's
# official execution accuracy (ex_acc). Needs a MySQL 8.0 server; see resources_servers/beaver_sql/README.md.

beaver_sql_resources_server:
  resources_servers:
    beaver_sql:
      entrypoint: app.py
      # The grader's read-only user, with no password in the DSN (one there is refused): the password comes from the
      # environment and is redacted in what a run saves.
      mysql_dsn: mysql://beaver_reader@127.0.0.1:3306
      mysql_password: ${oc.env:BEAVER_MYSQL_PASSWORD,null}
      # Set to load the data and create the grader's user at startup, for example mysql://root@127.0.0.1:3306.
      mysql_admin_dsn: null
      mysql_admin_password: ${oc.env:BEAVER_MYSQL_ADMIN_PASSWORD,null}
      databases: [dw]
      cache_dir: resources_servers/beaver_sql/.beaver
      max_concurrency: 8
      query_timeout_s: 10.0
      connection_timeout_s: 10
      domain: coding
      verified: false
      description: Text-to-SQL on BEAVER's enterprise data warehouses (MySQL), scored with BEAVER's official execution accuracy.
      value: Measure text-to-SQL on large, real enterprise schemas with execution-based binary reward and no LLM judge.

beaver_sql_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: beaver_sql_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      # Our own questions with literal answers (no BEAVER data): a smoke test on any server with dw loaded.
      - name: example
        type: example
        jsonl_fpath: resources_servers/beaver_sql/data/example.jsonl
        num_repeats: 1
        license: Apache 2.0

beaver_sql_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: beaver_sql_simple_agent
