deepswe_resources_server:
  resources_servers:
    deepswe:
      entrypoint: app.py
      domain: coding
      verified: false

      tasks_dir: resources_servers/deepswe/data/cache/tasks
      expected_task_count: 113
      is_verifying_golden_patch: false

      sandbox_provider: sandbox
      enforce_agent_no_network: true
      sandbox_model_base_url: ${oc.env:NEMO_GYM_SANDBOX_MODEL_BASE_URL,null}
      sandbox_model_server_name: null
      sandbox_config:
        resources:
          cpu: 2
          memory_mib: 8192
          disk_gib: 20
        metadata:
          benchmark: deepswe-v1-1
          istio.io/dataplane-mode: none

      logs_dir: resources_servers/deepswe/logs
      clear_verifier_logs: false
      include_model_patch_in_response: false
