[project]
name = "gym-resources-servers-bird-sql"
version = "0.0.0"
requires-python = ">=3.13.14"
dependencies = [
    "nemo-gym[dev]",
    # Spark dialect: pyspark runs the model's SQL; sqlglot checks it is a single SELECT/WITH. Both are imported
    # only when `dialect: spark`; the dialect also needs a JDK 17 on the machine (see benchmarks/birdbench/README.md).
    "pyspark>=3.5,<4",
    "sqlglot",
    # PostgreSQL dialect: psycopg runs the model's SQL on psycopg_pool's pooled connections. Both are imported only
    # when `dialect: postgres`; the dialect also needs a PostgreSQL server (see benchmarks/birdbench/README.md).
    "psycopg[binary]>=3.2",
    "psycopg_pool>=3.2",
]

[tool.uv]
package = false
constraint-dependencies = [
    "grpcio>=1.84.1,!=1.85.0rc1",
    "certifi>=2026.10.19",
    "msgpack>=1.2.1",
    "pyarrow>=25.0.1",
    "transformers>=5.17.0",
]
override-dependencies = [
    "spacy>=3.8.13",
    "wcwidth; sys_platform == 'never'",
    "opencv-python-headless; sys_platform == 'never'",
    "pynvvideocodec; sys_platform == 'never'",
    "torchcodec; sys_platform == 'never'",
    "torchvision; sys_platform == 'never'",
    "torchaudio; sys_platform == 'never'",
    "pycountry; sys_platform == 'never'",
    "gprof2dot; sys_platform == 'never'",
    "pathspec; sys_platform == 'never'",
]
exclude-dependencies = [
    "fasttext-wheel",
    "alembic",
    "blinker",
    "flask",
    "flask-cors",
    "graphene",
    "graphql-core",
    "graphql-relay",
    "gunicorn",
    "huey",
    "prettytable",
    "skops",
    "sqlalchemy",
    "werkzeug",
    "waitress",
    "diskcache",
]
required-version = ">=0.13.4"

[tool.uv.sources]
"nemo-gym" = { path = "../..", editable = true }

[tool.uv.sources.nemo-lens]
git = "https://github.com/NVIDIA-NeMo/Lens.git"
rev = "4d045c03186b90afdc815db46b671f6a21bc7e98"
[project.optional-dependencies]
telemetry = ["nemo-gym[telemetry]"]

[tool.uv.workspace]
members = []
