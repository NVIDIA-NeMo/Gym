math_with_code:
  resources_servers:
    math_with_code:
      entrypoint: app.py
      domain: math
      verified: false
      description: Model solves competitive math problems using simple calculator tools
      value: Improve math and simple tool use capabilities
math_with_code_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: math_with_code
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
        - name: train
          type: train
          jsonl_fpath: resources_servers/math_with_code/data/train.jsonl
          gitlab_identifier:
            dataset_name: open_math_reasoning_problems_tool
            version: 0.0.1
            artifact_fpath: open_math_reasoning_problems_tool.jsonl
          license: Apache 2.0
        - name: example
          type: example
          jsonl_fpath: resources_servers/math_with_code/data/example.jsonl
      max_steps: 3  # Tighter cap to reduce long-tail rollout stragglers
      # The agent loop and the model's Python run in the sandbox the Environment Server lends each attempt. Rows
      # opt into execute_python with agent_context: {agent: {values: {python_tools: [execute_python]}}}.
      python_tools:
        execute_python:
          timeout_seconds: 10
          requirements: [numpy==2.5.5, scipy==1.18.1, pandas==3.1.1]
          preload: {np: numpy, numpy: numpy, scipy: scipy, pd: pandas, pandas: pandas}
          builtins: [print, len, str, int, float, list, dict, tuple, set, min, max, sum, abs, range, enumerate, zip,
            __import__]

math_with_code_environment_server:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: math_with_code
      agent_server:
        type: responses_api_agents
        name: math_with_code_simple_agent
      # Configure a top-level sandbox provider block named `sandbox` before starting. The sandbox reaches only the
      # model server: the Python tool runs inside it, and this Resources Server has no tools.
      sandbox_provider: sandbox
      sandbox_config:
        image: python:3.13-slim
        workdir: /workspace
        ttl_s: 25200  # above the agent's sandbox_runner_timeout_seconds plus cleanup
        network: model_only
        model_server: policy_model
      # The grader compares boxed answers and runs nothing, so it grades in this Resources Server and the sandbox
      # stops once the agent closes. The task has a tool, so it cannot opt out.
      sandbox_opt_out:
        grader: true
