[project]
name = "longmt-scoring"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "segale @ git+https://github.com/jeffwillette/SEGALE.git@ab5e0d722e03f1b97846b7ed057ab7558218b035",
    "laser-encoders @ git+https://github.com/jeffwillette/LASER.git@14ba8c31efe48c351333ff0159fe2d25a6aaee37",
    "ersatz @ git+https://github.com/jeffwillette/ersatz.git@d21f40499be09668d7f9ecb19468be1acf1b17be",
    "torch==2.12.0", "torchvision==0.27.0", "setuptools>=70,<81",
    "unbabel-comet==2.2.7", "transformers>=4.17,<5",
    "scipy", "joblib", "langdetect", "sacrebleu[ja,ko]>=2.4",
]
[tool.uv]
package = false
required-version = ">=0.13.4"
# Shared security floors, with documented COMET compatibility exceptions in
# scripts/component-lock-policy.json. Gym/Ray runtime exclusions do not apply here.
constraint-dependencies = [
    "grpcio>=1.84.1,!=1.85.0rc1",
    "certifi>=2026.10.19",
    "msgpack>=1.2.1",
    "pyarrow>=25.0.1",
    "transformers>=4.17,<5",
    "protobuf==4.25.9",
]
override-dependencies = []
exclude-dependencies = []
[tool.uv.workspace]
members = []

# Match the CUDA 12.6 scoring stack used by LongMT cluster jobs.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
