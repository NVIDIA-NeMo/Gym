[project]
name = "gym-resources-servers-longmt-eval"
version = "0.0.0"
requires-python = ">=3.13.14"
dependencies = [
    "nemo-gym[dev,ray]",
    "segale @ git+https://github.com/jeffwillette/SEGALE.git@ab5e0d722e03f1b97846b7ed057ab7558218b035",
    "setuptools>=70,<81",
    "torch==2.12.0",
    "torchvision==0.27.0",
    "laser-encoders @ git+https://github.com/jeffwillette/LASER.git@14ba8c31efe48c351333ff0159fe2d25a6aaee37",
    "ersatz @ git+https://github.com/jeffwillette/ersatz.git@d21f40499be09668d7f9ecb19468be1acf1b17be",
    "unbabel-comet>=2.2",
    "scipy",
    "joblib",
    "langdetect",
    "sacrebleu[ja,ko]>=2.4",
]

[tool.uv]
package = false
constraint-dependencies = [
    "grpcio>=1.84.1,!=1.85.0rc1",
    "certifi>=2026.10.19",
    "msgpack>=1.2.1",
    "pyarrow>=25.0.1",
    "transformers>=4.17,<5",
]
override-dependencies = [
    "spacy>=3.8.13",
    "wcwidth; sys_platform == 'never'",
    "opencv-python-headless; sys_platform == 'never'",
    "pynvvideocodec; sys_platform == 'never'",
    "torchcodec; sys_platform == 'never'",
    "torchvision==0.27.0",
    "torchaudio; sys_platform == 'never'",
    "pycountry; sys_platform == 'never'",
    "gprof2dot; sys_platform == 'never'",
    "pathspec; sys_platform == 'never'",
    "protobuf==6.33.6",
]
exclude-dependencies = [
    "fasttext-wheel",
    "alembic",
    "blinker",
    "flask",
    "flask-cors",
    "graphene",
    "graphql-core",
    "graphql-relay",
    "gunicorn",
    "huey",
    "prettytable",
    "skops",
    "sqlalchemy",
    "werkzeug",
    "waitress",
    "diskcache",
]
required-version = ">=0.13.4"

[tool.uv.sources]
"nemo-gym" = { path = "../..", editable = true }

[tool.uv.sources.nemo-lens]
git = "https://github.com/NVIDIA-NeMo/Lens.git"
rev = "4d045c03186b90afdc815db46b671f6a21bc7e98"
[project.optional-dependencies]
telemetry = ["nemo-gym[telemetry]"]

[tool.uv.workspace]
members = []
