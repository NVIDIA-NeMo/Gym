# NeMo Skills Tools Resources Server Configuration
#
# This resources server provides integration with nemo_skills ToolManager
# for tool execution (e.g., stateful Python code execution).
#
# USAGE:
#   gym env start --resources-server ns_tools \
#   --resources-server math_with_judge \
#   --model-type vllm_model

ns_tools:
  resources_servers:
    ns_tools:
      entrypoint: app.py
      
      # Default verifier for samples without explicit verifier_type
      default_verifier: math_with_judge
      
      # Map of verifier names to server references
      # Add more verifiers here as needed (e.g., xlam_fc, mcqa)
      verifiers:
        math_with_judge:
          type: resources_servers
          name: math_with_judge
      
      # NeMo Skills tools to load
      # DirectPythonTool is the preferred python tool path: it calls the sandbox directly
      nemo_skills_tools:
        - nemo_skills.mcp.servers.python_tool::DirectPythonTool
      
      # Per-tool configuration overrides
      nemo_skills_tool_overrides:
        DirectPythonTool:
          exec_timeout_s: 10

      # Sandbox configuration
      # Respects NEMO_SKILLS_SANDBOX_HOST/PORT env vars if set, else defaults
      sandbox_host: ${oc.env:NEMO_SKILLS_SANDBOX_HOST,127.0.0.1}
      sandbox_port: ${oc.env:NEMO_SKILLS_SANDBOX_PORT,6000}

      # Disable session replay after sandbox worker restarts (improves stability)
      disable_session_restore: true

      # Sandbox backend switch: 'local' (default — today's colocated server, byte-identical
      # with zero env vars set) or 'opensandbox_pool' (disaggregated pods on OpenSandbox).
      sandbox_type: ${oc.env:NS_TOOLS_SANDBOX_TYPE,local}
      # Pool settings; read only when sandbox_type == opensandbox_pool. Selecting that
      # backend with an empty domain/api_key/image is a hard startup error, never a no-op.
      opensandbox_pool:
        provider:
          opensandbox:
            connection:
              domain: ${oc.env:OPENSANDBOX_BASE_URL,}
              api_key: ${oc.env:OPENSANDBOX_API_KEY,}
              use_server_proxy: true
              # First-ever create on a new image tag blocks on nydus conversion (40-55s);
              # the SDK default request_timeout (30s) fails the whole cold warmup wave.
              request_timeout: 180
        image: ${oc.env:NS_SANDBOX_IMAGE,}
        port: 6000
        size: ${oc.env:NS_SANDBOX_POOL_SIZE,8}
        ttl_s: ${oc.env:NS_SANDBOX_TTL_S,14400}

      domain: agent
      verified: false
      description: NeMo Skills tool execution with math verification

# Agent configuration
ns_tools_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 50
      resources_server:
        type: resources_servers
        name: ns_tools
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
        - name: example
          type: example
          license: Apache 2.0
          jsonl_fpath: resources_servers/ns_tools/data/example.jsonl
