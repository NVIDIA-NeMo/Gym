video_mcqa:
  resources_servers:
    video_mcqa:
      entrypoint: app.py
      domain: other
      verified: false
      description: Single-turn video MCQA accuracy for a VideoMME-v1, LVBench or question-set cohort; the cohort selects which.
      cohort_manifest: ${video_mcqa_cohort_manifest}

video_mcqa_single_turn:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: video_mcqa
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/video_mcqa/data/example.jsonl
        license: Apache 2.0

video_mcqa_single_turn_environment:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: video_mcqa
      agent_server:
        type: responses_api_agents
        name: video_mcqa_single_turn
