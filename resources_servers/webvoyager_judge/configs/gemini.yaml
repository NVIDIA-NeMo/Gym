webvoyager_gemini_judge:
  resources_servers:
    webvoyager_judge:
      entrypoint: app.py
      domain: agent
      verified: false
      description: Maintained WebVoyager Gemini screenshot-trajectory judge
      value: Match the maintained 552-task evaluator and evidence contract
      judge_model_server:
        type: responses_api_models
        name: webvoyager_judge_model
      judge_responses_create_params:
        input: []
        max_output_tokens: 4096
        temperature: 0
        top_p: 1.0
      max_screenshots: 200
      require_screenshot: true
      # Stay below the agent's 540 s resource-call envelope so timeout errors
      # are classified by the standard judge failure boundary.
      judge_call_timeout_secs: 510
      verifier_version: webvoyager-gemini-v1
