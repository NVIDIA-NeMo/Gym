# This resource-server-only configuration is for `gym eval reverify`. It avoids
# starting the policy model: reverification reuses stored policy responses and
# makes calls only to the configured factuality and coverage judge.
facts_multimodal:
  resources_servers:
    facts_multimodal:
      entrypoint: app.py
      domain: other
      verified: false
      description: FACTS Multimodal rubric-based factuality evaluation for image questions
      value: Evaluate visual grounding, answer coverage, and factual precision
      judge_model_server:
        type: responses_api_models
        name: judge_model
      use_base64_images: ${oc.select:use_base64_images,true}

judge_model:
  responses_api_models:
    inference_provider:
      entrypoint: app.py
      base_url: ${oc.select:judge_base_url,''}
      api_key: ${oc.select:judge_api_key,''}
      model: ${oc.select:judge_model_name,''}
