facts_multimodal:
  resources_servers:
    facts_multimodal:
      entrypoint: app.py
      domain: other
      verified: false
      description: FACTS Multimodal rubric-based factuality evaluation for image questions
      value: Evaluate visual grounding, answer coverage, and factual precision
      judge_model_server:
        type: responses_api_models
        name: judge_model
      use_base64_images: ${oc.select:use_base64_images,true}

judge_model:
  responses_api_models:
    inference_provider:
      entrypoint: app.py
      base_url: ${oc.select:judge_base_url,''}
      api_key: ${oc.select:judge_api_key,''}
      model: ${oc.select:judge_model_name,''}

facts_multimodal_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: facts_multimodal
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/facts_multimodal/data/example.jsonl
        prompt_config: null
        license: Apache 2.0
        num_repeats: 1
