#
# Wires the opencode sandboxed agent to denovo_swe_resources_server for a training run --
# `denovo_swe.yaml` alone only defines the resources server, which is enough for golden-patch
# validation (apply_golden_patch.py talks to it directly, no agent involved) but not enough to
# actually run an agent against the dataset. This is a separate file, not folded into
# denovo_swe.yaml, so golden-patch validation keeps working without pulling in the agent's (much
# larger) opencode/sandbox config.
#
# This is training data (data/denovo_swe_training.jsonl, only the already-supported instances --
# see the README), not a fixed eval benchmark.
#
#   gym env start --config resources_servers/denovo_swe/configs/denovo_swe_opencode.yaml

config_paths:
  - responses_api_agents/opencode_sandboxed_agent/configs/opencode_sandboxed_agent.yaml
  - resources_servers/denovo_swe/configs/denovo_swe.yaml

denovo_swe_opencode_sandboxed_agent:
  _inherit_from: opencode_sandboxed_agent
  responses_api_agents:
    opencode_sandboxed_agent:
      resources_server:
        type: resources_servers
        name: denovo_swe_resources_server
      datasets:
        - name: denovo_swe
          type: train
          jsonl_fpath: resources_servers/denovo_swe/data/denovo_swe_training.jsonl
          num_repeats: 1
          license: Creative Commons Attribution 4.0 International
