# LongBench v2: the rule-based scorer and the single-turn agent that drives it.
longbench:
  resources_servers:
    longbench:
      entrypoint: app.py
      domain: long_context
      verified: false
      description: LongBench v2 multiple-choice long-context QA; reward = 1 when the extracted answer letter equals the gold letter.
      value: Improve reasoning and answer extraction over long documents, dialogues and code repositories.

longbench_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      # One user message, one reply: the answer letter is graded from that reply.
      max_steps: 1
      resources_server:
        type: resources_servers
        name: longbench
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/longbench/data/example.jsonl
        license: Apache 2.0
      # Both files below are written by one run of prepare_longbench.py.
      # Rows whose untruncated prompt is under the token budget.
      - name: 48k
        type: validation
        jsonl_fpath: resources_servers/longbench/data/longbench_48k.jsonl
        license: Apache 2.0
      # Every row; prompts over the length cap are middle-truncated.
      - name: full
        type: validation
        jsonl_fpath: resources_servers/longbench/data/longbench_full.jsonl
        license: Apache 2.0
