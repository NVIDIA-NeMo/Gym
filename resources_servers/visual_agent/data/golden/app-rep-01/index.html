<title>Relay · Inbox</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: Inter, sans-serif; color: #1f2433; background: #eceff5;
    -webkit-font-smoothing: antialiased; font-size: 14px;
  }
  button, input { font-family: inherit; color: inherit; }
  button { border: 0; background: none; padding: 0; cursor: pointer; }
  svg { display: block; flex: none; }
  .ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .app { display: grid; grid-template-columns: 236px 404px 1fr; gap: 12px; height: 100vh; padding: 12px 12px 12px 0; }

  /* Sidebar */
  .side { display: flex; flex-direction: column; padding: 8px 12px 4px 16px; min-height: 0; }
  .brand { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 6px; }
  .brand-mark { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(140deg, #5b5bf0, #8b5cf6); display: grid; place-items: center; }
  .brand-name { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; color: #151a2d; }
  .compose { margin-top: 16px; height: 44px; border-radius: 12px; background: #4f46e5; color: #fff; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 6px 14px rgba(79, 70, 229, 0.28); }
  .folders { margin-top: 18px; display: flex; flex-direction: column; gap: 2px; }
  .folder { display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 10px; border-radius: 9px; color: #4a5168; font-size: 14px; font-weight: 500; }
  .folder .ico { color: #7b8299; }
  .folder.active { background: #dfe2fb; color: #3730a3; font-weight: 600; }
  .folder.active .ico { color: #4f46e5; }
  .folder .count { margin-left: auto; font-size: 12px; font-weight: 600; color: #7b8299; }
  .folder.active .count { background: #4f46e5; color: #fff; border-radius: 999px; padding: 1px 8px; }
  .side-head { margin: 20px 10px 6px; display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #8a90a6; }
  .label { display: flex; align-items: center; gap: 12px; height: 32px; padding: 0 10px; font-size: 14px; color: #4a5168; }
  .dot { width: 9px; height: 9px; border-radius: 3px; }
  .storage { margin-top: auto; padding: 12px; border-radius: 12px; background: #f7f8fc; border: 1px solid #e1e4ee; }
  .storage-row { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: #4a5168; }
  .bar { margin-top: 8px; height: 6px; border-radius: 99px; background: #e3e6f0; overflow: hidden; }
  .bar i { display: block; width: 41%; height: 100%; background: linear-gradient(90deg, #5b5bf0, #8b5cf6); }
  .storage-note { margin-top: 6px; font-size: 11px; color: #8a90a6; }
  .me { margin-top: 10px; display: flex; align-items: center; gap: 10px; padding: 6px; }
  .me-name { font-size: 13px; font-weight: 600; color: #1f2433; }
  .me-mail { font-size: 12px; color: #8a90a6; }

  .panel { background: #fff; border-radius: 16px; box-shadow: 0 1px 2px rgba(20, 27, 52, 0.06), 0 0 0 1px rgba(20, 27, 52, 0.05); min-height: 0; }

  /* List */
  .list { display: flex; flex-direction: column; overflow: hidden; }
  .list-top { padding: 16px 16px 0; }
  .search { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 10px; background: #f2f4f9; color: #8a90a6; }
  .search input { border: 0; outline: 0; background: none; font-size: 14px; flex: 1; min-width: 0; }
  .search input::placeholder { color: #8a90a6; }
  .kbd { font-size: 11px; font-weight: 600; color: #8a90a6; border: 1px solid #d9dde8; border-radius: 5px; padding: 1px 5px; background: #fff; }
  .list-title { display: flex; align-items: baseline; justify-content: space-between; margin-top: 16px; }
  .list-title h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: #151a2d; }
  .list-title span { font-size: 12px; color: #8a90a6; }
  .tabs { display: flex; gap: 20px; margin-top: 10px; border-bottom: 1px solid #eceef4; }
  .tab { padding: 8px 0 10px; font-size: 13px; font-weight: 600; color: #8a90a6; border-bottom: 2px solid transparent; margin-bottom: -1px; display: flex; gap: 6px; align-items: center; }
  .tab.active { color: #4f46e5; border-color: #4f46e5; }
  .tab b { font-size: 11px; background: #eef0ff; color: #4f46e5; padding: 0 6px; border-radius: 99px; }
  .rows { flex: 1; overflow: hidden; padding: 6px 8px 8px; }
  .list { position: relative; }
  .list::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 44px; border-radius: 0 0 16px 16px; background: linear-gradient(rgba(255, 255, 255, 0), #fff); pointer-events: none; }
  .row { position: relative; display: grid; grid-template-columns: 36px 1fr; gap: 12px; padding: 11px 10px 11px 12px; border-radius: 12px; cursor: pointer; }
  .row + .row { margin-top: 1px; }
  .row.selected { background: #eef0ff; }
  .row.unread::before { content: ""; position: absolute; left: 3px; top: 25px; width: 6px; height: 6px; border-radius: 50%; background: #4f46e5; }
  .av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 700; }
  .r-body { min-width: 0; }
  .r-line { display: flex; align-items: center; gap: 8px; }
  .r-from { font-size: 14px; font-weight: 500; color: #394056; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r-time { margin-left: auto; font-size: 12px; color: #8a90a6; white-space: nowrap; }
  .r-subj { margin-top: 2px; font-size: 13px; font-weight: 500; color: #394056; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r-prev { margin-top: 2px; font-size: 13px; color: #8a90a6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .unread .r-from, .unread .r-subj { font-weight: 700; color: #151a2d; }
  .unread .r-time { color: #4f46e5; font-weight: 600; }
  .chip { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 6px; white-space: nowrap; }
  .star { color: #c3c7d4; }
  .star.on { color: #f5a524; }
  .star.on .ico { fill: #f5a524; }
  .clip { color: #8a90a6; }
  .star .ico, .clip .ico { width: 16px; height: 16px; }

  /* Reader */
  .reader { display: flex; flex-direction: column; overflow: hidden; }
  .toolbar { display: flex; align-items: center; gap: 6px; height: 60px; padding: 0 16px; border-bottom: 1px solid #eceef4; color: #5b6278; }
  .tb { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; }
  .tb:hover { background: #f2f4f9; }
  .sep { width: 1px; height: 20px; background: #e1e4ee; margin: 0 4px; }
  .pager { margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: 12px; color: #8a90a6; }
  .msg { padding: 24px 32px 0; overflow: hidden; flex: 1; }
  .subject { display: flex; align-items: flex-start; gap: 12px; }
  .subject h1 { margin: 0; font-size: 22px; line-height: 30px; font-weight: 700; letter-spacing: -0.02em; color: #151a2d; flex: 1; }
  .from { margin-top: 18px; display: flex; align-items: center; gap: 12px; }
  .from .av { width: 42px; height: 42px; font-size: 15px; }
  .from-name { font-size: 14px; font-weight: 700; color: #151a2d; }
  .from-name span { font-weight: 400; color: #8a90a6; }
  .from-to { margin-top: 2px; font-size: 12px; color: #8a90a6; }
  .from-date { margin-left: auto; font-size: 12px; color: #8a90a6; text-align: right; }
  .body { margin-top: 22px; font-size: 14px; line-height: 23px; color: #394056; max-width: 640px; }
  .body p { margin: 0 0 14px; }
  .files { display: flex; gap: 12px; margin-top: 6px; }
  .file { display: flex; align-items: center; gap: 12px; width: 230px; padding: 10px 12px; border: 1px solid #e1e4ee; border-radius: 12px; }
  .ficon { width: 36px; height: 40px; border-radius: 7px; display: grid; place-items: center; color: #fff; font-size: 10px; font-weight: 800; letter-spacing: 0.04em; }
  .fname { font-size: 13px; font-weight: 600; color: #1f2433; }
  .fsize { margin-top: 2px; font-size: 12px; color: #8a90a6; }
  .older { margin-top: 18px; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; background: #f7f8fc; border: 1px solid #eceef4; }
  .older .av { width: 30px; height: 30px; font-size: 11px; }
  .older-text { flex: 1; min-width: 0; font-size: 13px; color: #8a90a6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .older-text b { color: #394056; font-weight: 600; margin-right: 6px; }
  .older-date { font-size: 12px; color: #8a90a6; }
  .reply { margin: 18px 32px 20px; display: flex; gap: 10px; }
  .rbtn { height: 38px; padding: 0 16px; border-radius: 10px; border: 1px solid #d9dde8; font-size: 13px; font-weight: 600; color: #394056; display: flex; align-items: center; gap: 8px; background: #fff; }
  .rbtn.primary { background: #4f46e5; color: #fff; border-color: #4f46e5; }

  .mobile-only { display: none; }

  /* Mobile */
  @media (max-width: 700px) {
    body { background: #fff; }
    .app { display: block; height: auto; padding: 0; }
    .side, .reader { display: none; }
    .panel { border-radius: 0; box-shadow: none; }
    .mobile-only { display: flex; }
    .mbar { align-items: center; gap: 14px; height: 56px; padding: 0 16px; }
    .mbar h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: #151a2d; flex: 1; }
    .mbar .av { width: 32px; height: 32px; font-size: 12px; }
    .kbd { display: none; }
    .list-top { padding: 0 16px; }
    .list-title { display: none; }
    .tabs { margin-top: 12px; }
    .rows { padding: 4px 4px 76px; }
    .list::after { display: none; }
    .row { border-radius: 0; padding: 12px 12px 12px 14px; }
    .row.selected { background: none; }
    .mnav { position: sticky; bottom: 0; justify-content: space-around; height: 64px; border-top: 1px solid #eceef4; background: #fff; }
    .mnav a { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 10px; font-size: 11px; font-weight: 600; color: #8a90a6; text-decoration: none; position: relative; }
    .mnav a.active { color: #4f46e5; }
    .mnav .badge { position: absolute; top: 4px; left: 50%; margin-left: 6px; font-size: 10px; background: #4f46e5; color: #fff; border-radius: 99px; padding: 0 5px; line-height: 16px; }
    .fab { position: absolute; right: 16px; bottom: 80px; height: 52px; padding: 0 20px 0 16px; border-radius: 16px; background: #4f46e5; color: #fff; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 18px rgba(79, 70, 229, 0.35); }
    .list { position: relative; }
    body.reading .list { display: none; }
    body.reading .reader { display: flex; min-height: 100vh; }
    .reader .toolbar { padding: 0 8px; }
    .reader .pager { display: none; }
    .msg { padding: 16px 16px 0; }
    .files { flex-direction: column; }
    .file { width: 100%; }
    .reply { margin: 16px; flex-wrap: wrap; }
  }
  .back { display: none; }
  @media (max-width: 700px) { .back { display: grid; } }
</style>
</head>

let selected = 1, folder = "inbox", query = "";
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
const icon = (id, cls = "ico") => `<svg class="${cls}"><use href="#${id}"/></svg>`;

function visible() {
  const q = query.trim().toLowerCase();
  return MESSAGES.filter((m) => (folder !== "starred" || m.starred) &&
    (!q || (m.from + " " + m.subject + " " + m.preview).toLowerCase().includes(q)));
}
function renderList() {
  const list = visible();
  document.getElementById("rows").innerHTML = list.map((m) => {
    const [bg, fg] = LABELS[m.label];
    return `<div class="row${m.unread ? " unread" : ""}${m.id === selected ? " selected" : ""}" data-id="${m.id}">
      <div class="av" style="background:${m.color}">${m.initials}</div>
      <div class="r-body">
        <div class="r-line"><span class="r-from">${esc(m.from)}</span>${m.files.length ? `<span class="clip">${icon("i-clip")}</span>` : ""}<span class="r-time">${m.time}</span></div>
        <div class="r-subj">${esc(m.subject)}</div>
        <div class="r-line"><span class="r-prev">${esc(m.preview)}</span><span class="chip" style="background:${bg};color:${fg}">${m.label}</span>
          <button class="star${m.starred ? " on" : ""}" data-star="${m.id}" aria-label="Star">${icon("i-star")}</button></div>
      </div></div>`;
  }).join("");
  const unread = MESSAGES.filter((m) => m.unread).length;
  for (const id of ["inbox-count", "tab-count", "nav-badge"]) document.getElementById(id).textContent = unread;
  document.getElementById("conv-count").textContent = query ? `${list.length} result${list.length === 1 ? "" : "s"}` : `${list.length} conversations`;
}
function renderReader() {
  const m = MESSAGES.find((x) => x.id === selected);
  const [bg, fg] = LABELS[m.label];
  const body = m.body || [`Hi Maya,`, esc(m.preview), `Best,<br>${esc(m.from)}`];
  const files = m.files.filter((f) => Array.isArray(f));
  document.getElementById("reader").innerHTML = `
    <div class="toolbar">
      <button class="tb back" id="back" aria-label="Back">${icon("i-left")}</button>
      <button class="tb">${icon("i-archive")}</button><button class="tb">${icon("i-trash")}</button><button class="tb">${icon("i-unread")}</button>
      <span class="sep"></span><button class="tb">${icon("i-clock")}</button><button class="tb">${icon("i-dots")}</button>
      <div class="pager">${MESSAGES.indexOf(m) + 1} of ${MESSAGES.length}<button class="tb">${icon("i-left")}</button><button class="tb">${icon("i-right")}</button></div>
    </div>
    <div class="msg">
      <div class="subject"><h1>${esc(m.subject)}</h1><span class="chip" style="background:${bg};color:${fg};margin-top:6px">${m.label}</span>
        <button class="star${m.starred ? " on" : ""}" data-star="${m.id}" style="margin-top:5px">${icon("i-star")}</button></div>
      ${m.older ? `<div class="older"><div class="av" style="background:${m.older[1]}">${m.older[0]}</div><div class="older-text"><b>${m.older[2]}</b>${m.older[3]}</div><div class="older-date">${m.older[4]}</div></div>` : ""}
      <div class="from"><div class="av" style="background:${m.color}">${m.initials}</div>
        <div><div class="from-name">${esc(m.from)} <span>&lt;${m.email}&gt;</span></div><div class="from-to">${m.to || "to me"}</div></div>
        <div class="from-date">${m.date || m.time}</div></div>
      <div class="body">${body.map((p) => `<p>${p}</p>`).join("")}</div>
      ${files.length ? `<div class="files">${files.map(([t, c, n, s]) => `<div class="file"><div class="ficon" style="background:${c}">${t}</div><div><div class="fname">${n}</div><div class="fsize">${s}</div></div></div>`).join("")}</div>` : ""}
    </div>
    <div class="reply"><button class="rbtn primary">${icon("i-reply")}Reply</button><button class="rbtn">${icon("i-replyall")}Reply all</button><button class="rbtn">${icon("i-fwd")}Forward</button></div>`;
}
document.addEventListener("click", (e) => {
  const star = e.target.closest("[data-star]");
  if (star) { const m = MESSAGES.find((x) => x.id === +star.dataset.star); m.starred = !m.starred; renderList(); renderReader(); return; }
  const row = e.target.closest(".row");
  if (row) { selected = +row.dataset.id; MESSAGES.find((x) => x.id === selected).unread = false; renderList(); renderReader(); document.body.classList.add("reading"); window.scrollTo(0, 0); return; }
  if (e.target.closest("#back")) { document.body.classList.remove("reading"); return; }
  const f = e.target.closest("[data-folder]");
  if (f && (f.dataset.folder === "inbox" || f.dataset.folder === "starred")) {
    folder = f.dataset.folder;
    document.querySelectorAll(".folder").forEach((x) => x.classList.toggle("active", x === f));
    renderList();
  }
});
document.getElementById("search").addEventListener("input", (e) => { query = e.target.value; renderList(); });
renderList();
renderReader();
</script>
