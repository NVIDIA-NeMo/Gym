<!doctype html>
<html lang="en">
<head>

<title>Stratus Drive · Aurora</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: Inter, sans-serif; color: #1e2536; background: #f2f4f8;

  .brand-name span { font-weight: 400; color: #5b6478; margin-left: 3px; }
  .new { margin-top: 6px; align-self: flex-start; height: 48px; padding: 0 22px 0 16px; border-radius: 14px; background: #fff; color: #1e2536; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 10px; box-shadow: 0 1px 2px rgba(17, 24, 39, 0.08), 0 4px 12px rgba(17, 24, 39, 0.08); border: 1px solid #e3e7ef; }

  .toolbar { display: flex; align-items: center; gap: 8px; padding: 6px 20px 0 22px; height: 44px; }

  .fchip small { display: block; margin-top: 1px; font-size: 12px; color: #6b7488; }
  .fchip .txt { min-width: 0; }
  .selbar { display: none; align-items: center; gap: 2px; height: 30px; padding: 0 4px 0 12px; border-radius: 15px; background: #dce8fd; color: #1a4fc4; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .selbar.show { display: flex; }

  .selbar .ico { width: 15px; height: 15px; }
  .sortbtn { margin-left: auto; display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 15px; font-size: 13px; font-weight: 500; color: #394257; }
  .sortbtn .ico { width: 15px; height: 15px; color: #1a4fc4; }

  /* Table */
  .table { flex: 1; min-height: 0; padding: 0 12px 8px; overflow: hidden; }
  .thead, .row { display: grid; grid-template-columns: minmax(0, 1fr) 146px 118px 84px 40px; align-items: center; }
  .thead { height: 36px; padding: 0 10px; border-bottom: 1px solid #e8ecf2; font-size: 12px; font-weight: 600; color: #5b6478; }

  .row:last-child { border-bottom-color: transparent; }
  .row:hover { background: #f6f8fb; }
  .row.sel { background: #e3edfd; border-bottom-color: #e3edfd; border-radius: 10px; }
  .name { display: flex; align-items: center; gap: 12px; min-width: 0; font-size: 14px; font-weight: 500; color: #1e2536; }

  .mod { font-size: 13px; color: #465067; font-variant-numeric: tabular-nums; }
  .size { font-size: 13px; color: #465067; text-align: right; font-variant-numeric: tabular-nums; }
  .star { width: 30px; height: 30px; border-radius: 15px; display: grid; place-items: center; margin-left: auto; color: #b3bac8; }

  /* File type icons */
  .ft { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; }
  .ft svg { width: 18px; height: 18px; }
  .ft-pdf { background: #fde7e7; } .ft-sheet { background: #dff3e7; } .ft-doc { background: #e1ebfd; }
  .ft-image { background: #f5e3fb; } .ft-video { background: #feead9; } .ft-zip { background: #e9edf3; } .ft-figma { background: #fff; border: 1px solid #e3e7ef; }

  /* Grid view */
  .grid { display: none; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 4px 8px 12px; }
  .main.gridmode .grid { display: grid; }
  .main.gridmode .thead, .main.gridmode .rows { display: none; }
  .main.gridmode .table { overflow: auto; }
  .card { border-radius: 12px; border: 1px solid #e3e7ef; background: #f7f8fb; overflow: hidden; cursor: default; user-select: none; }
  .card.sel { border-color: #7aa4f2; background: #e3edfd; box-shadow: 0 0 0 1px #7aa4f2; }
  .card .cap { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 6px 0 10px; font-size: 13px; font-weight: 500; }
  .card .cap .ft { width: 22px; height: 22px; border-radius: 6px; }
  .card .cap .ft svg { width: 14px; height: 14px; }
  .card .cap .n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .pv { height: 112px; margin: 0 8px 8px; border-radius: 8px; }

  /* Previews */
  .pv { position: relative; overflow: hidden; border-radius: 12px; display: grid; place-items: center; }
  .pv-pdf { background: #fbe4e1; }
  .pv-sheet { background: #dcf1e4; }
  .pv-doc { background: #dfe9fc; }
  .pv-zip { background: #e7ebf1; }
  .pv-video { background: linear-gradient(135deg, #1f2a44, #3b2f5c); }
  .pv-figma { background: #2b2d33; }
  .pv-image { background: linear-gradient(180deg, #ffd3b0 0%, #f7a8c4 55%, #c9a7f0 100%); }
  .page { width: 44%; height: 84%; align-self: end; background: #fff; border-radius: 4px 4px 0 0; box-shadow: 0 2px 8px rgba(17, 24, 39, 0.12); padding: 9% 8% 0; display: flex; flex-direction: column; gap: 6%; }
  .page i { display: block; height: 5px; border-radius: 3px; background: #e3e7ef; }
  .page i.h { height: 8px; width: 60%; background: #e5484d; }
  .page i.s { width: 70%; }
  .page .blk { height: 26%; border-radius: 4px; background: linear-gradient(120deg, #22c1a4, #3b82f6 55%, #8b5cf6); }
  .pv-doc .page i.h { background: #2563eb; }
  .sheet { width: 70%; height: 80%; align-self: end; background: #fff; border-radius: 4px 4px 0 0; box-shadow: 0 2px 8px rgba(17, 24, 39, 0.12); background-image: linear-gradient(#1f9d55 0 14%, transparent 14%), repeating-linear-gradient(0deg, transparent 0 13px, #e3e7ef 13px 14px), repeating-linear-gradient(90deg, transparent 0 27px, #e3e7ef 27px 28px); }
  .play { width: 44px; height: 44px; border-radius: 50%; background: rgba(255, 255, 255, 0.92); display: grid; place-items: center; }
  .dur { position: absolute; right: 8px; bottom: 8px; font-size: 11px; font-weight: 600; color: #fff; background: rgba(0, 0, 0, 0.55); border-radius: 5px; padding: 1px 6px; }
  .zipbig { width: 46px; height: 58px; border-radius: 6px; background: #fff; box-shadow: 0 2px 8px rgba(17, 24, 39, 0.12); position: relative; }
  .zipbig::before { content: ""; position: absolute; left: 20px; top: 0; width: 6px; height: 34px; background: repeating-linear-gradient(180deg, #64748b 0 4px, #cbd3df 4px 8px); }
  .zipbig::after { content: ""; position: absolute; left: 17px; top: 34px; width: 12px; height: 14px; border-radius: 3px; border: 2px solid #64748b; }
  .frames { display: flex; gap: 8%; width: 80%; height: 64%; }
  .frames i { flex: 1; border-radius: 5px; background: #fff; position: relative; }
  .frames i::before { content: ""; position: absolute; left: 14%; right: 14%; top: 14%; height: 22%; border-radius: 3px; background: #a78bfa; }
  .frames i:nth-child(2)::before { background: #34d399; }
  .frames i:nth-child(3)::before { background: #fb923c; }
  .frames i::after { content: ""; position: absolute; left: 14%; right: 30%; top: 46%; height: 8%; border-radius: 3px; background: #e5e7eb; box-shadow: 0 10px 0 #e5e7eb; }
  .pv-image svg { position: absolute; left: 0; bottom: 0; width: 100%; height: 70%; }

  /* Details pane */
  .details { display: flex; flex-direction: column; padding: 18px 18px 16px; overflow: hidden; }
  .d-head { display: flex; align-items: flex-start; gap: 10px; }
  .d-head .ft { width: 28px; height: 28px; }
  .d-title { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; color: #111827; line-height: 20px; margin-top: 4px; overflow-wrap: anywhere; }
  .d-close { width: 28px; height: 28px; border-radius: 14px; display: grid; place-items: center; color: #6b7488; }
  .d-pv { margin-top: 14px; height: 150px; }
  .d-pv .pv { height: 100%; }
  .d-sec { margin-top: 16px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #6b7488; }
  .props { margin-top: 8px; display: grid; grid-template-columns: 78px 1fr; row-gap: 9px; font-size: 13px; }
  .props dt { color: #6b7488; }
  .props dd { margin: 0; color: #1e2536; font-weight: 500; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .props dd .av { width: 20px; height: 20px; font-size: 8px; }

  .access { margin-top: 10px; display: flex; align-items: center; }
  .access .av { width: 30px; height: 30px; font-size: 10px; box-shadow: 0 0 0 2px #fff; }
  .access .av + .av { margin-left: 4px; }
  .access .more { background: #e6eaf1; color: #465067; }
  .access button { margin-left: auto; height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid #c9d6f2; color: #1d4ed8; font-size: 12px; font-weight: 600; }
  .acts { margin-top: 10px; display: flex; flex-direction: column; gap: 12px; }
  .act { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: #465067; line-height: 18px; }
  .act .av { width: 26px; height: 26px; font-size: 10px; }
  .act b { color: #1e2536; font-weight: 600; }
  .act small { display: block; font-size: 12px; color: #8a92a5; }
  .d-empty { margin: auto; text-align: center; color: #6b7488; font-size: 13px; line-height: 20px; }
  .d-empty .big { width: 56px; height: 56px; border-radius: 16px; background: #eef2f8; display: grid; place-items: center; margin: 0 auto 12px; color: #6b7488; }
  .d-multi { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .d-multi .it { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .d-multi .it .ft { width: 24px; height: 24px; border-radius: 6px; }
  .d-multi .it .ft svg { width: 14px; height: 14px; }
  .d-multi .it .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d-multi .it em { font-style: normal; color: #6b7488; font-variant-numeric: tabular-nums; }

  .m-only { display: none; }

  /* Mobile */
  @media (max-width: 700px) {
    body { background: #fff; }
    .app { display: block; height: auto; }
    .main { position: relative; }
    .selbar button:not(#sel-clear) { display: none; }
    .sortbtn { white-space: nowrap; padding: 0 4px 0 8px; }
    .side, .top, .details, .head, .toolbar .chip { display: none; }
    .content { display: block; padding: 0; }
    .panel { border-radius: 0; box-shadow: none; }
    .m-only { display: flex; }
    .m-search { align-items: center; gap: 12px; height: 50px; margin: 10px 14px 0; padding: 0 8px 0 14px; border-radius: 25px; background: #e9edf3; color: #465067; }
    .m-search .ph { flex: 1; font-size: 15px; color: #5b6478; }
    .m-search .av { width: 32px; height: 32px; }
    .m-title { flex-direction: column; padding: 16px 18px 0; }
    .m-title .up { display: flex; align-items: center; gap: 2px; font-size: 13px; font-weight: 500; color: #1a4fc4; margin-left: -4px; }
    .m-title h1 { margin: 2px 0 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; color: #111827; }
    .toolbar { padding: 4px 18px 0; height: 36px; }
    .count { margin-left: 0; }
    .toolbar .seg { margin-left: auto; }
    .seg button { width: 40px; height: 30px; }
    .sec { padding: 0 18px; }
    .sec.folders-h { margin-top: 6px; }
    .folders { grid-template-columns: 1fr 1fr; gap: 10px; padding: 2px 18px 6px; }
    .fchip { height: 50px; }
    .table { padding: 0 6px; overflow: visible; }
    .thead { display: none; }
    .row { grid-template-columns: minmax(0, 1fr) 36px; height: 60px; padding: 0 8px 0 12px; border-bottom: 0; }
    .row.sel { border-radius: 12px; }
    .owner, .mod, .size { display: none; }
    .name { gap: 14px; }
    .name .ft { width: 36px; height: 36px; border-radius: 10px; }
    .name .ft svg { width: 20px; height: 20px; }
    .name .txt { min-width: 0; display: flex; flex-direction: column; }
    .meta { display: block; margin-top: 2px; font-size: 12px; font-weight: 400; color: #6b7488; font-variant-numeric: tabular-nums; }
    .grid { grid-template-columns: 1fr 1fr; padding: 4px 12px 12px; }
    .fab { position: absolute; right: 16px; bottom: 84px; height: 54px; padding: 0 22px 0 18px; border-radius: 18px; background: #2563eb; color: #fff; font-weight: 600; font-size: 15px; align-items: center; gap: 8px; box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35); }
    .fab .ico { width: 20px; height: 20px; stroke-width: 2.2; }
    .mnav { position: sticky; bottom: 0; margin-top: 90px; justify-content: space-around; height: 68px; border-top: 1px solid #e8ecf2; background: #fff; }
    .mnav a { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 8px; width: 80px; font-size: 11px; font-weight: 600; color: #6b7488; text-decoration: none; cursor: pointer; }
    .mnav a .pill { width: 56px; height: 30px; border-radius: 15px; display: grid; place-items: center; }
    .mnav a.active { color: #1a4fc4; }
    .mnav a.active .pill { background: #dce8fd; }
  }
</style>
</head>

const byId = (id) => FILES.find((f) => f.id === id);
function viewFiles() {
  let list;
  if (state.view === 'starred') list = FILES.filter((f) => f.starred && !f.trashed);
  else if (state.view === 'trash') list = FILES.filter((f) => f.trashed);
  else list = FILES.filter((f) => f.folder === state.folder && !f.trashed);
  const { key, dir } = state.sort;
  const cmpName = (a, b) => a.name.localeCompare(b.name, 'en', { sensitivity: 'base' });
  list.sort((a, b) => {
    let c = 0;
    if (key === 'name') c = cmpName(a, b);
    else if (key === 'size') c = a.kb - b.kb;
    else c = a.modified < b.modified ? -1 : a.modified > b.modified ? 1 : 0;
    if (c === 0) c = cmpName(a, b);
    return dir === 'asc' ? c : -c;
  });
  return list;
}
function visibleFiles() {
  const q = state.query.trim().toLowerCase();
  const list = viewFiles();
  return q ? list.filter((f) => f.name.toLowerCase().includes(q)) : list;

  document.getElementById('storage-note').textContent = `${gb.toFixed(1)} GB of ${STORAGE_TOTAL_GB} GB used`;
}

function renderHead() {
  const crumbs = document.getElementById('crumbs');
  const mt = document.getElementById('m-title');
  const sep = icon('i-right', 'ico sep');
  if (state.view === 'folder') {
    const fo = FOLDERS[state.folder];
    const path = fo.parent ? [...FOLDERS[fo.parent].path, fo.name] : fo.path;
    crumbs.innerHTML = path.map((p, i) => {
      const last = i === path.length - 1;
      const target = p === 'Aurora' ? ' data-go="aurora"' : '';
      return `<a class="${last ? 'cur' : ''}"${target}>${esc(p)}${last ? icon('i-down', 'ico sm') : ''}</a>`;
    }).join(sep);
    const up = path[path.length - 2];
    mt.innerHTML = `<span class="up"${up === 'Aurora' ? ' data-go="aurora"' : ''}>${icon('i-left', 'ico sm')}${esc(up)}</span><h1>${esc(fo.name)}</h1>`;
  } else {
    const title = state.view === 'starred' ? 'Starred' : 'Trash';
    crumbs.innerHTML = `<a class="cur">${title}</a>`;
    mt.innerHTML = `<span class="up" data-view-go="folder">${icon('i-left', 'ico sm')}My Drive</span><h1>${title}</h1>`;
  }
  const fw = document.getElementById('folders-wrap');
  const kids = state.view === 'folder' ? (FOLDERS[state.folder].children || []) : [];
  fw.style.display = kids.length ? '' : 'none';
  document.getElementById('folders').innerHTML = kids.map((k) => {
    const n = FILES.filter((f) => f.folder === k && !f.trashed).length;
    return `<div class="fchip" data-folder="${k}">${folderSvg(FOLDERS[k].color)}<span class="txt"><b>${esc(FOLDERS[k].name)}</b><small>${plural(n, 'file')}</small></span></div>`;
  }).join('');
}

function renderList() {
  const list = visibleFiles();
  const q = state.query.trim();
  const count = document.getElementById('count');
  if (q) count.innerHTML = `<b>${plural(list.length, 'result')}</b>`;
  else count.innerHTML = `<b>${plural(list.length, 'file')}</b> · ${fmtSize(total(list))}`;

  const { key, dir } = state.sort;
  document.querySelectorAll('#thead .th[data-sort]').forEach((th) => {
    const on = th.dataset.sort === key;
    th.classList.toggle('sorted', on);
    const label = th.textContent.trim();
    th.innerHTML = label + (on ? icon(dir === 'asc' ? 'i-arrow-up' : 'i-arrow-down') : '');
  });
  const keyLabel = { name: 'Name', size: 'File size', modified: 'Last modified' }[key];
  document.getElementById('sortbtn').innerHTML = `${keyLabel}${icon(dir === 'asc' ? 'i-arrow-up' : 'i-arrow-down')}`;

  const rows = document.getElementById('rows');
  const grid = document.getElementById('grid');
  if (!list.length) {
    const msg = q ? 'No files match your search' : state.view === 'trash' ? 'Trash is empty' : 'No files here yet';
    rows.innerHTML = `<div class="empty">${msg}</div>`;
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">${msg}</div>`;
    return;
  }
  rows.innerHTML = list.map((f) => {
    const sel = state.selected.has(f.id) ? ' sel' : '';
    const own = f.owner === ME ? 'me' : PEOPLE[f.owner].name;
    return `<div class="row${sel}" data-id="${f.id}">
      <div class="name">${ft(f.kind)}<span class="txt"><span class="n">${esc(f.name)}</span><span class="meta">${fmtDate(f.modified)} · ${fmtSize(f.kb)}</span></span></div>
      <div class="owner">${av(f.owner)}${esc(own)}</div>
      <div class="mod">${fmtDate(f.modified)}</div>
      <div class="size">${fmtSize(f.kb)}</div>
      <button class="star${f.starred ? ' on' : ''}" data-star="${f.id}" aria-label="Star">${icon('i-star')}</button>
    </div>`;
  }).join('');
  grid.innerHTML = list.map((f) => {
    const sel = state.selected.has(f.id) ? ' sel' : '';
    return `<div class="card${sel}" data-id="${f.id}"><div class="cap">${ft(f.kind)}<span class="n">${esc(f.name)}</span><button class="star${f.starred ? ' on' : ''}" data-star="${f.id}" aria-label="Star">${icon('i-star')}</button></div>${preview(f)}</div>`;
  }).join('');
}

function renderSelection() {
  const sel = [...state.selected].map(byId).filter(Boolean);
  const bar = document.getElementById('selbar');
  bar.classList.toggle('show', sel.length > 0);
  document.getElementById('seltext').textContent = sel.length ? `${sel.length} selected · ${fmtSize(total(sel))}` : '';
  const d = document.getElementById('details');
  if (!sel.length) {
    d.innerHTML = `<div class="d-empty"><div class="big">${icon('i-file')}</div>Select a file to see its details</div>`;
    return;
  }
  if (sel.length > 1) {
    d.innerHTML = `<div class="d-head"><div class="d-title">${sel.length} items selected</div></div>
      <dl class="props"><dt>Total size</dt><dd>${fmtSize(total(sel))}</dd></dl>
      <div class="d-multi">${sel.map((f) => `<div class="it">${ft(f.kind)}<span class="nm">${esc(f.name)}</span><em>${fmtSize(f.kb)}</em></div>`).join('')}</div>`;
    return;
  }
  const f = sel[0];
  const acts = f.activity || [[f.owner, 'edited', fmtDate(f.modified).replace(/, \d+$/, '')], [f.owner, 'uploaded', fmtDate(f.created).replace(/, \d+$/, '')]];
  const shown = f.access.slice(0, 4);
  const more = f.access.length - shown.length;
  d.innerHTML = `<div class="d-head">${ft(f.kind)}<div class="d-title">${esc(f.name)}</div><button class="d-close" id="d-close" aria-label="Close">${icon('i-x', 'ico sm')}</button></div>
    <div class="d-pv">${preview(f)}</div>
    <div class="d-sec">Details</div>
    <dl class="props">
      <dt>Type</dt><dd>${KIND_LABEL[f.kind]}</dd>
      <dt>Size</dt><dd>${fmtSize(f.kb)}</dd>
      <dt>Location</dt><dd>${folderSvg(FOLDERS[f.folder].color || '#7c8698')}${esc(FOLDERS[f.folder].name)}</dd>
      <dt>Owner</dt><dd>${av(f.owner)}${esc(PEOPLE[f.owner].name)}</dd>
      <dt>Modified</dt><dd>${fmtDate(f.modified)}</dd>
      <dt>Created</dt><dd>${fmtDate(f.created)}</dd>
    </dl>
    <div class="d-sec">Who has access</div>
    <div class="access">${shown.map((p) => av(p)).join('')}${more > 0 ? `<span class="av more">+${more}</span>` : ''}<button>Manage</button></div>
    <div class="d-sec">Activity</div>
    <div class="acts">${acts.map(([p, verb, when]) => `<div class="act">${av(p)}<div><b>${esc(PEOPLE[p].name)}</b> ${verb}<small>${when}</small></div></div>`).join('')}</div>`;
}

function renderLayout() {
  document.getElementById('main').classList.toggle('gridmode', state.layout === 'grid');
  document.querySelectorAll('.seg button').forEach((b) => b.classList.toggle('on', b.dataset.layout === state.layout));
}

function render() { renderSide(); renderHead(); renderList(); renderSelection(); renderLayout(); }

function go(view, folder) {
  state.view = view;
  if (folder) state.folder = folder;
  state.selected = new Set();
  state.anchor = null;
  render();
}

function clickItem(id, ev) {
  const list = visibleFiles().map((f) => f.id);
  if (ev.shiftKey && state.anchor != null && list.includes(state.anchor)) {
    const a = list.indexOf(state.anchor), b = list.indexOf(id);
    const [lo, hi] = a < b ? [a, b] : [b, a];
    state.selected = new Set(list.slice(lo, hi + 1));
  } else if (ev.ctrlKey || ev.metaKey) {
    if (state.selected.has(id)) state.selected.delete(id); else state.selected.add(id);
    state.anchor = id;
  } else {
    state.selected = new Set([id]);
    state.anchor = id;
  }
  renderList(); renderSelection();
}

function trashSelected() {
  if (state.view === 'trash' || !state.selected.size) return;
  for (const id of state.selected) {
    const f = byId(id);
    if (f && !f.trashed) { f.trashed = true; storageUsedKb -= f.kb; }
  }
  state.selected = new Set();
  state.anchor = null;
  render();
}

document.getElementById('rows').addEventListener('click', (ev) => {
  const star = ev.target.closest('[data-star]');
  if (star) { const f = byId(+star.dataset.star); f.starred = !f.starred; renderList(); return; }
  const row = ev.target.closest('.row');
  if (row) clickItem(+row.dataset.id, ev);
});
document.getElementById('grid').addEventListener('click', (ev) => {
  const star = ev.target.closest('[data-star]');
  if (star) { const f = byId(+star.dataset.star); f.starred = !f.starred; renderList(); return; }
  const card = ev.target.closest('.card');
  if (card) clickItem(+card.dataset.id, ev);
});
document.getElementById('thead').addEventListener('click', (ev) => {
  const th = ev.target.closest('[data-sort]');
  if (!th) return;
  const key = th.dataset.sort;
  if (state.sort.key === key) state.sort.dir = state.sort.dir === 'asc' ? 'desc' : 'asc';
  else state.sort = { key, dir: 'asc' };
  renderList();
});
document.getElementById('sortbtn').addEventListener('click', () => {
  state.sort.dir = state.sort.dir === 'asc' ? 'desc' : 'asc';
  renderList();
});
document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => { state.layout = b.dataset.layout; renderLayout(); }));
document.getElementById('folders').addEventListener('dblclick', (ev) => {
  const chip = ev.target.closest('.fchip');
  if (chip) { state.query = ''; document.getElementById('q').value = ''; go('folder', chip.dataset.folder); }
});
document.getElementById('crumbs').addEventListener('click', (ev) => {
  const a = ev.target.closest('[data-go]');
  if (a && !(state.view === 'folder' && state.folder === a.dataset.go)) go('folder', a.dataset.go);
});
document.getElementById('m-title').addEventListener('click', (ev) => {
  const a = ev.target.closest('[data-go]');
  if (a) go('folder', a.dataset.go);
  else if (ev.target.closest('[data-view-go]')) go('folder', 'aurora');
});
document.getElementById('nav').addEventListener('click', (ev) => {
  const a = ev.target.closest('a');
  if (!a) return;
  const v = a.dataset.view;
  if (v === 'folder') go('folder', 'aurora');
  else if (v === 'starred' || v === 'trash') go(v);
});
document.getElementById('q').addEventListener('input', (ev) => { state.query = ev.target.value; renderList(); });
document.getElementById('sel-trash').addEventListener('click', trashSelected);
document.getElementById('sel-clear').addEventListener('click', () => { state.selected = new Set(); renderList(); renderSelection(); });
document.getElementById('details').addEventListener('click', (ev) => {
  if (ev.target.closest('#d-close')) { state.selected = new Set(); renderList(); renderSelection(); }
});
document.addEventListener('keydown', (ev) => {
  if (ev.target.closest && ev.target.closest('input, textarea')) return;
  if (ev.key === 'Delete') { ev.preventDefault(); trashSelected(); }
  else if (ev.key === 'Escape') { state.selected = new Set(); renderList(); renderSelection(); }
});

render();
</script>
</body>
</html>
