#
# SimpleQA with Simple Agent's loop in the attempt's sandbox group. The Environment Server starts one sandbox per
# attempt, Simple Agent runs its agent loop there, and the sandbox reaches only the policy model. The judge grader
# executes nothing, so it still opts out and runs in the Resources Server (simpleqa.yaml).
#
# Needs a sandbox provider block named `sandbox` whose provider applies `model_only`, such as
# nemo_gym/sandbox/providers/opensandbox/configs/opensandbox.yaml, and a model server address the sandbox can reach.
config_paths:
  - resources_servers/simpleqa/configs/simpleqa.yaml

simpleqa_sandboxed_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: simpleqa
      model_server:
        type: responses_api_models
        name: policy_model
      sandboxed: true

simpleqa_sandboxed_environment_server:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: simpleqa
      agent_server:
        type: responses_api_agents
        name: simpleqa_sandboxed_simple_agent
      resources_tool_transports: []
      sandbox_provider: sandbox
      sandbox_config:
        image: python:3.13-slim
        workdir: /tmp
        # Above the episode timeout plus the cleanup timeout (21600 + 180 s).
        ttl_s: 25200
        network: model_only
        model_server: policy_model
      sandbox_opt_out:
        grader: true
