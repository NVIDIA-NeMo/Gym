#
# SimpleQA with Simple Agent's loop in the attempt's sandbox group. The Environment Server starts one sandbox per
# attempt and lends it to the agent, which runs its agent loop there; the sandbox's egress allows only the policy
# model server's host. The judge verifier executes nothing, so it still opts out and runs in the Resources Server.
#
# Needs a provider block named `sandbox` whose provider applies `model_only`: E2B, or OpenSandbox with
# `networking.enforces_network_policy: true` on a deployment that enforces it (Docker and Enroot apply only `inherit`
# and `no_network`). The model server must listen on an address the sandbox reaches, such as with use_absolute_ip.
config_paths:
  - resources_servers/simpleqa/configs/simpleqa.yaml

# Its own agent instance, because each agent is fronted by one Environment Server. Simple Agent runs its loop in the
# sandbox because the seed lends one; the agent config has no switch for it.
simpleqa_sandboxed_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: simpleqa
      model_server:
        type: responses_api_models
        name: policy_model

simpleqa_sandboxed_environment_server:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: simpleqa
      agent_server:
        type: responses_api_agents
        name: simpleqa_sandboxed_simple_agent
      resources_tool_transports: []
      sandbox_provider: sandbox
      sandbox_config:
        image: python:3.13-slim
        workdir: /workspace
        # Above the episode timeout plus the cleanup timeout (21600 + 180 s).
        ttl_s: 25200
        network: model_only
        model_server: policy_model
      sandbox_opt_out:
        verifier: true
