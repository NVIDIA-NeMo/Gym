workspace_bench_resources_server:
  resources_servers:
    workspace_bench:
      entrypoint: app.py
      domain: other
      verified: false
      allowed_agents: [harness_agent]
      judge_base_url: ${oc.env:WORKSPACE_BENCH_JUDGE_BASE_URL,''}
      judge_api_key: ${oc.env:WORKSPACE_BENCH_JUDGE_API_KEY,''}
      judge_model: ${oc.env:WORKSPACE_BENCH_JUDGE_MODEL,''}
      judge_timeout_s: 600
      num_processes: 10
      sandbox_provider: sandbox
      sandbox_config:
        image: ${oc.env:WORKSPACE_BENCH_IMAGE,node:24-bookworm-slim}
        ttl_s: 10800
        ready_timeout_s: 1200
        resources:
          cpu: 2
          memory_mib: 8192
          disk_gib: 20
        provider_options:
          resource_requests:
            cpu: 0.25
            memory_mib: 1024
        metadata:
          benchmark: workspace-bench
