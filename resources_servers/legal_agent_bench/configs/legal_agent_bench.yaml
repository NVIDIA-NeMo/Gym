environment_routing_mode: taskset
environment_server_routes:
  legal_agent_bench: legal_agent_bench_environment_server
num_samples_in_parallel: 1
lab:
  rows_path: ${oc.select:prepare_script_args.output,benchmarks/legal_agent_bench/data/legal_agent_bench_benchmark.jsonl}
  reward_mode: full_task
  judge_parallelism: 6
  policy_temperature: 1.0
  policy_top_p: 0.95
  agent_timeout_seconds: 10800
  verifier_timeout_seconds: 3600
legal_agent_bench_environment_server:
  environment_servers:
    harbor:
      entrypoint: ../../resources_servers/legal_agent_bench/app.py
      agent_server:
        type: responses_api_agents
        name: legal_agent_bench_benchmark_agent
      tasksets:
        legal_agent_bench:
          folder: resources_servers/legal_agent_bench/data/environment
          tasks: {}
      prepared_tasksets_file: ${lab.rows_path}.tasksets.json
      sandbox_provider: sandbox
      max_concurrent_episodes: ${num_samples_in_parallel}
      queue_timeout_seconds: 18000
      default_episode_timeout_seconds: 18000
      cleanup_timeout_seconds: 180
      enforce_task_timeouts: true
      separate_verifier_for_artifacts: true
      judge_model_name: ${oc.select:judge_model_name,null}
      judge_base_url: ${oc.select:judge_base_url,null}
      judge_api_key: ${oc.select:judge_api_key,null}
      reward_mode: ${lab.reward_mode}
      judge_parallelism: ${lab.judge_parallelism}
