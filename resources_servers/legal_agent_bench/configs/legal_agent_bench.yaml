# Legal Agent Bench through harbor_tasks: this server prepares the LAB Harbor tasks and grades them with their task
# verifier, harbor_harness_agent runs the LAB harness in the task sandbox, and the single-agent-turn Environment
# Server drives each episode. Build the runtime image once from any prepared task's environment/ directory:
#   docker build -t legal-agent-bench-runtime:latest <harbor_tasks_dir>/<any task>/environment
# Docker is the supported sandbox backend. Add a model server.
config_paths:
  - environment_servers/single_agent_turn_legacy/configs/single_agent_turn_legacy.yaml
  - nemo_gym/sandbox/providers/docker/configs/docker.yaml

legal_agent_bench:
  resources_servers:
    legal_agent_bench:
      entrypoint: app.py
      allowed_agents: [harbor_harness_agent]
      domain: agent
      verified: false
      description: Harbor-native integration of <a href='https://github.com/harveyai/harvey-labs/tree/f46ef86e4788545622db25dcffa3aebb7a139929'>Legal Agent Benchmark (LAB)</a>
      value: Improve legal-agent document review, drafting, and analysis capability
      harbor_tasks_cache_dir: ${oc.env:LEGAL_AGENT_BENCH_TASK_CACHE_DIR,resources_servers/legal_agent_bench/data/cache/harbor_tasks/legal_agent_bench}
      harbor_tasks_dir: ${oc.env:LEGAL_AGENT_BENCH_RUNTIME_TASKS_DIR,resources_servers/legal_agent_bench/data/runtime/harbor_tasks/legal_agent_bench}
      harness_skills_dir: ${oc.env:LEGAL_AGENT_BENCH_SKILLS_DIR,resources_servers/legal_agent_bench/data/cache/harness/skills}
      auto_prepare_assets: true
      reward_mode: full_task  # official all-criteria score; criteria_pass_rate is diagnostic
      judge_base_url: ${oc.select:judge_base_url,null}
      judge_api_key: ${oc.select:judge_api_key,null}
      judge_model_name: ${oc.select:judge_model_name,null}
      judge_temperature: null
      judge_request_timeout_seconds: 90
      judge_max_retries: 1
      judge_structured_output: true
      judge_parse_repair_attempts: 1
      judge_repair_max_tokens: 4096
      judge_max_tokens: 4096
      judge_parallelism: 6

      # harbor_tasks settings: the hydrated runtime tree is the only dataset, started from the prebuilt image.
      runtime_image: legal-agent-bench-runtime:latest
      harbor_datasets:
        legal_agent_bench:
          path: ${legal_agent_bench.resources_servers.legal_agent_bench.harbor_tasks_dir}
      sandbox_provider: sandbox
      sandbox_config:
        ttl_s: 43200
        ready_timeout_s: 1800
      harbor_verifier:
        override_timeout_sec: 3600
      artifacts_dir: results/legal_agent_bench/harbor_tasks

legal_agent_bench_agent:
  responses_api_agents:
    harbor_harness_agent:
      entrypoint: app.py
      domain: agent
      description: The Legal Agent Bench harness, run as a Harbor agent in the task sandbox
      model_server:
        type: responses_api_models
        name: policy_model
      token_id_capture: true
      resources_server:
        type: resources_servers
        name: legal_agent_bench
      harbor_agent:
        import_path: resources_servers.legal_agent_bench.legal_harbor_agent:LegalAgentBenchHarborAgent
        model_name: ${policy_model_name}
        override_timeout_sec: 10800
        kwargs:
          agent_id: legal-agent-bench
          agent_config_id: legal-agent-bench
          run_timestamp: nemo-gym
          skills_dir: ${legal_agent_bench.resources_servers.legal_agent_bench.harness_skills_dir}
          max_turns: 60
          shell_timeout: 60
          temperature: 1.0
          agent_model_top_p: 0.95
          agent_model_max_tokens: 32768
          agent_model_timeout_seconds: 1800
      logs_dir: results/legal_agent_bench/harbor_harness_agent
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/legal_agent_bench/data/example.jsonl
        license: MIT
      - name: legal_agent_bench
        type: validation
        jsonl_fpath: resources_servers/legal_agent_bench/data/generated/all.jsonl
        license: MIT

legal_agent_bench_environment_server:
  _inherit_from: single_agent_turn_legacy
  environment_servers:
    single_agent_turn_legacy:
      resources_server:
        type: resources_servers
        name: legal_agent_bench
      agent_server:
        type: responses_api_agents
        name: legal_agent_bench_agent
      max_concurrent_episodes: 1
      queue_timeout_seconds: 86400
