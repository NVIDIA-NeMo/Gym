# Task-tree finance SDG, stage question_gen: Write one expert question for a sampled task-tree slot.
tt_sdg_question_gen_resources_server:
  resources_servers:
    finance_task_tree_sdg:
      allowed_agents: [finance_agent]
      entrypoint: app.py
      domain: agent
      verified: false
      description: Write one expert question for a sampled task-tree slot
      value: Generate expert finance research questions from the task tree
      stage: question_gen
      sec_edgar_user_agent: ${oc.select:sec_edgar_user_agent,${oc.env:SEC_EDGAR_USER_AGENT,null}}
      use_cache: ${oc.select:tt_sdg_use_cache,false}
      cache_dir: ${oc.select:tt_sdg_cache_dir,null}
      # Set: SEC tools read this downloaded corpus and never call SEC.
      sec_corpus_metadata_path: ${oc.select:tt_sdg_sec_corpus_metadata_path,null}
      judge_model_server:
        type: responses_api_models
        name: policy_model
      judge_responses_create_params:
        input: []
        max_output_tokens: 16384
      judge_call_timeout_s: 1800
      # Full judge outputs are written here and never returned by verify.
      audit_dir: ${oc.select:tt_sdg_audit_dir,null}

tt_sdg_question_gen_agent:
  responses_api_agents:
    finance_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: tt_sdg_question_gen_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      no_tool_call_nudge: Continue. Finish by calling the submission tool.
      continue_if_not_tool_call: true
      prose_only_behavior: nudge
      tool_call_execution: sequential
      tool_error_observation: error_prefix
      raise_on_tool_http_error: true
      done_tool_requires_success: true
      done_tools: [submit_question, submit_rejection]
      max_time_seconds: null
      abort_on_tool_error_types: []
      max_steps: 60
      model_call_timeout: null
      truncate_on_overflow: false
      tool_call_timeout: 300
      datasets:
        - name: example
          type: example
          jsonl_fpath: resources_servers/finance_task_tree_sdg/data/example_question_gen.jsonl
          license: Apache 2.0

tt_sdg_question_gen_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: tt_sdg_question_gen_agent

