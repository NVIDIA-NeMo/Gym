# One captured model response. Tools are declared to the model but never executed.
captured_instruction_following:
  resources_servers:
    captured_instruction_following:
      entrypoint: app.py
      domain: instruction_following
      verified: false
      description: Captured next-call scoring and explicitly unscored frozen-history text generation
      value: Evaluate reviewed next-call references without fabricating scores for unreviewed criteria
      allowed_agents: [simple_agent]

captured_instruction_following_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      execute_tools: false
      max_steps: 1
      resources_server:
        type: resources_servers
        name: captured_instruction_following
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
        - name: captured_instruction_following_synthetic_smoke
          type: example
          jsonl_fpath: resources_servers/captured_instruction_following/data/example.jsonl
          prompt_config: null
          license: Apache 2.0

captured_instruction_following_environment_server:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      default_episode_timeout_seconds: null
      cleanup_timeout_seconds: 180
      resources_server:
        type: resources_servers
        name: captured_instruction_following
      resources_tool_transports: []
      agent_server:
        type: responses_api_agents
        name: captured_instruction_following_simple_agent
