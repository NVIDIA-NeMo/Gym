# `tools` serves the workplace_assistant tools for this episode at http://tools:8000/mcp. It runs a public image:
# its command installs the hash-pinned dependencies (written by harbor/pin_requirements.py) and starts tool_server.py
# from the task's own files (binds are uploaded before the command runs). Its tables and call journal live only in
# this container. The image is pinned by digest, as are the agent's (Dockerfile) and the verifier's (task.toml).
services:
  main:
    image: ${MAIN_IMAGE_NAME}
    depends_on:
      tools:
        condition: service_healthy
  tools:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim@sha256:531f855bda2c73cd6ef67d56b733b357cea384185b3022bd09f05e002cd144ca
    command:
      - sh
      - -c
      - >-
        uv pip install --system --quiet --require-hashes --no-build -r /opt/wa_server/requirements.txt
        && exec python /opt/wa_server/tool_server.py
    environment:
      WA_CODE_DIR: /opt/wa
      WA_JOURNAL: /var/lib/wa-journal/calls.jsonl
      WA_PORT: "8000"
    volumes:
      - ./tool_server.py:/opt/wa_server/tool_server.py:ro
      - ./requirements.txt:/opt/wa_server/requirements.txt:ro
      - ./wa:/opt/wa:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), timeout=2).close()"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
