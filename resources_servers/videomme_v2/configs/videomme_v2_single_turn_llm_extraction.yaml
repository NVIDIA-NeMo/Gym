# videomme_v2_single_turn.yaml with answer extraction by a judge model, for Video-MME v2 rows prepared with
# prompt "videomme_v2" (the benchmark's bare-letter prompt) and a cohort with answer_policy llm_extraction_v1.
# The judge reads the row's question and options and the final answer (never the video or the gold label) and
# returns the chosen option, which is then scored. See resources_servers/video_mcqa/README.md.
videomme_v2:
  resources_servers:
    videomme_v2:
      entrypoint: app.py
      domain: other
      verified: false
      description: VideoMME-v2 single-turn video MCQA; a judge model reads the chosen option (llm_extraction_v1).
      cohort_manifest: ${videomme_v2_cohort_manifest}
      judge_model_server:
        type: responses_api_models
        name: video_mcqa_answer_judge
      judge_chat_completion_create_params:
        messages: []

# The judge: any OpenAI-compatible chat model (judge_base_url, judge_api_key, judge_model_name).
video_mcqa_answer_judge:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: ${judge_base_url}
      openai_api_key: ${judge_api_key}
      openai_model: ${judge_model_name}

videomme_v2_single_turn:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: videomme_v2
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/videomme_v2/data/example.jsonl
        license: Apache 2.0

videomme_v2_single_turn_environment:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: videomme_v2
      agent_server:
        type: responses_api_agents
        name: videomme_v2_single_turn
