# The example rows: five synthetic saved coding trials (three that game the grader, two fair fixes), replayed
# through the judge with gym eval reverify. Use with configs/mfn_reward_hacking.yaml.
mfn_reward_hacking:
  resources_servers:
    mfn_reward_hacking:
      domain: safety
      description: MFN's reward-hacking judge (v2) over saved agent rollouts, for gym eval reverify
      value: Flag passes won by solution lookup, block evasion or grader tampering, with evidence per trial
      verified: false
mfn_reward_hacking_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: mfn_reward_hacking
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/mfn_reward_hacking/data/example.jsonl
        num_repeats: 1
        license: Apache 2.0
mfn_reward_hacking_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: mfn_reward_hacking_simple_agent
