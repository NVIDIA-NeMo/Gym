#
# Wires the Claude Code sandboxed agent to scale_swe_resources_server, as
# scale_swe_opencode.yaml does for the OpenCode agent. Rows route here with
# agent_ref.name = scale_swe_claude_code_sandboxed_agent.
#
#   gym env start --config resources_servers/scale_swe/configs/scale_swe_claude_code.yaml

config_paths:
  - responses_api_agents/claude_code_sandboxed_agent/configs/claude_code_sandboxed_agent.yaml
  - resources_servers/scale_swe/configs/scale_swe.yaml

scale_swe_claude_code_sandboxed_agent:
  _inherit_from: claude_code_sandboxed_agent
  responses_api_agents:
    claude_code_sandboxed_agent:
      resources_server:
        type: resources_servers
        name: scale_swe_resources_server
      datasets:
        - name: scale_swe
          type: train
          jsonl_fpath: resources_servers/scale_swe/data/scale_swe_training.jsonl
          num_repeats: 1
          # AweAI-Team/Scale-SWE has no declared license on the Hub (no license tag, empty card
          # data) -- TBD rather than guessing one of the enum's real licenses.
          license: TBD

# Rollout collection reaches an agent through its environment server. Named after the agent, not
# the environment: scale_swe_opencode.yaml's scale_swe_environment_server fronts the OpenCode
# agent, and a run loads both.
scale_swe_claude_code_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: scale_swe_claude_code_sandboxed_agent
