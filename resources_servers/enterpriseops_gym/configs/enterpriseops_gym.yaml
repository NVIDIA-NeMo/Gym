enterpriseops_gym:
  resources_servers:
    enterpriseops_gym:
      entrypoint: app.py
      domain: agent
      verified: false
      description: EnterpriseOps-Gym enterprise tool-use benchmark (external MCP gym servers + SQL/judge verifiers)
      value: Improve stateful multi-step enterprise planning and tool use

      # Set to "sandbox" and include a provider config (e.g. docker.yaml) to have the server
      # launch EOG containers per session. Leave empty to use pre-running containers.
      sandbox_provider: ""

      # Root for seed SQL files. prepare.py downloads gym_dbs.zip here.
      seed_sql_root: resources_servers/enterpriseops_gym/data/gym_dbs

      gym_url_overrides: {}

      max_concurrent_seeds: 4
      session_ttl_seconds: 3600
      janitor_interval_seconds: 300

      # false = EOG leaderboard parity (name-collapsed verifiers, all must pass).
      # true = strict mode (every defined verifier must pass).
      strict_verifiers: false

      tool_call_timeout_seconds: 30
      sql_timeout_seconds: 30

      # EOG uses the policy model as its own judge. Keep policy_model for parity.
      judge_model_server:
        type: responses_api_models
        name: policy_model
      # Pin temperature to 0.0 to match EOG's eval config default.
      judge_responses_create_params:
        temperature: 0.0

enterpriseops_gym_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 50
      resources_server:
        type: resources_servers
        name: enterpriseops_gym
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/enterpriseops_gym/data/example.jsonl
