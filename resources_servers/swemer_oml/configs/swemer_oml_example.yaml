# swemer_oml's CI "example" data-validation config -- separate from swemer_oml.yaml so starting
# the base/golden-patch servers for golden-patch validation never needs to pull in an
# agent+model config (mirrors the *_opencode.yaml split, same reasoning as swemer_v2).
config_paths:
  - resources_servers/swemer_oml/configs/swemer_oml.yaml

# CI's "example" data-validation gate (gym env test +should_validate_data=true): grades the
# dataset's own golden patch for 5 rows via a plain simple_agent (not opencode_sandboxed_agent --
# this only needs a real verify() round-trip to exercise data/example.jsonl's shape, not an agent
# that can actually solve the task). Same pattern as resources_servers/swemer_v2.
swemer_oml_example_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: swemer_oml_golden_patch_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
        - name: example
          type: example
          jsonl_fpath: resources_servers/swemer_oml/data/example.jsonl
