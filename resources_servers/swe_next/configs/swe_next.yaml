# Resources server for TIGER-Lab/SWE-Next.
#
# Every row carries its own prebuilt image (docker_image) and a byte-identical R2E-pipeline test
# command across the whole dataset -- so there is no image repository or per-row test-command
# construction here. 2,306 rows, entirely Python, one test runner (pytest).
swe_next_resources_server:
  resources_servers:
    swe_next:
      allowed_agents: [opencode_sandboxed_agent]
      entrypoint: app.py
      domain: coding
      verified: false

      evaluation_timeout: 1200
      is_verifying_golden_patch: false
      apply_anti_cheating: true

      sandbox_provider: sandbox
      sandbox_config:
        ttl_s: 18000
        ready_timeout_s: 1200
        resources:
          cpu: 4
          memory_mib: 16384
          disk_gib: 20
        provider_options:
          resource_requests:
            cpu: 1
            memory_mib: 4096
            disk_gib: 20
        metadata:
          benchmark: swe-next

# Golden-patch validation: grade the dataset's own patch instead of an agent's. A row whose
# golden patch does not resolve is a broken row, and scoring an agent against it measures noise.
# Run it with resources_servers/swe_next/apply_golden_patch.py.
swe_next_golden_patch_resources_server:
  resources_servers:
    swe_next:
      entrypoint: app.py
      domain: coding
      verified: false

      evaluation_timeout: 1200
      is_verifying_golden_patch: true

      sandbox_provider: sandbox
      sandbox_config:
        ttl_s: 18000
        ready_timeout_s: 1200
        resources:
          cpu: 4
          memory_mib: 16384
          disk_gib: 20
        provider_options:
          resource_requests:
            cpu: 1
            memory_mib: 4096
            disk_gib: 20
        metadata:
          benchmark: swe-next-golden-patch
