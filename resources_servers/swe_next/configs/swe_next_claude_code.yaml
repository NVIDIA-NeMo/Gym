#
# Wires the Claude Code sandboxed agent to swe_next_resources_server, as
# swe_next_opencode.yaml does for the OpenCode agent. Rows route here with
# agent_ref.name = swe_next_claude_code_sandboxed_agent.
#
#   gym env start --config resources_servers/swe_next/configs/swe_next_claude_code.yaml

config_paths:
  - responses_api_agents/claude_code_sandboxed_agent/configs/claude_code_sandboxed_agent.yaml
  - resources_servers/swe_next/configs/swe_next.yaml

swe_next_claude_code_sandboxed_agent:
  _inherit_from: claude_code_sandboxed_agent
  responses_api_agents:
    claude_code_sandboxed_agent:
      resources_server:
        type: resources_servers
        name: swe_next_resources_server
      datasets:
        - name: swe_next
          type: train
          jsonl_fpath: resources_servers/swe_next/data/swe_next_training.jsonl
          num_repeats: 1
          license: MIT
