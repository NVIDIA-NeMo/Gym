# Local BM25 retrieval, multiple-choice reward. Default.
langchain_docs_qa:
  resources_servers:
    langchain_docs_qa:
      entrypoint: app.py
      domain: agent
      verified: false
      description: LangChain docs QA, BM25 retrieval with multiple-choice reward
      value: Trains retrieval-grounded question answering over a documentation corpus
      retrieval_backend: bm25
      reward_mode: mcqa
langchain_docs_qa_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: langchain_docs_qa
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/langchain_docs_qa/data/example.jsonl
      - name: docs_qa
        type: train
        jsonl_fpath: environments/langchain_docs_qa/data/langchain_docs_qa.jsonl
        license: MIT
