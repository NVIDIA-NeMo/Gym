# Live docs.langchain.com MCP retrieval, LLM equivalence judge
langchain_docs_qa:
  resources_servers:
    langchain_docs_qa:
      entrypoint: app.py
      domain: agent
      verified: false
      description: LangChain docs QA against the live docs MCP with an LLM equivalence judge
      value: Trains retrieval-grounded question answering over a documentation corpus
      retrieval_backend: mcp
      mcp_url: https://docs.langchain.com/mcp
      mcp_tools:
      - search_docs_by_lang_chain
      - query_docs_filesystem_docs_by_lang_chain
      reward_mode: judge
      judge_base_url: ""
      judge_model: judge
      judge_cred_file: ""
langchain_docs_qa_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: langchain_docs_qa
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/langchain_docs_qa/data/example.jsonl
      - name: docs_qa
        type: train
        jsonl_fpath: environments/langchain_docs_qa/data/langchain_docs_qa.jsonl
        license: MIT
