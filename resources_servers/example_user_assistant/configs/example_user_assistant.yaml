policy_model:
  responses_api_models:
    inference_provider:
      entrypoint: app.py
      base_url: ${policy_base_url}
      api_key: ${policy_api_key}
      model: ${policy_model_name}

example_user_assistant:
  resources_servers:
    example_user_assistant:
      entrypoint: app.py
      domain: agent
      verified: false
      description: Shared-state meal planning with independent user and assistant agents.

example_assistant:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: example_user_assistant
      model_server:
        type: responses_api_models
        name: policy_model
      max_steps: 4

example_user:
  responses_api_agents:
    nemo_sim_user:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: example_user_assistant
      model_server:
        type: responses_api_models
        name: policy_model
      locale: en_US
      incremental_disclosure_ratio: 0.6
      max_steps: 4

example_multi_agent_processor:
  processors:
    multi_agent:
      entrypoint: app.py
      participants:
        assistant:
          type: responses_api_agents
          name: example_assistant
        user:
          type: responses_api_agents
          name: example_user
      turn_order:
      - assistant
      - user
      focal_participant: assistant
      resources_server:
        type: resources_servers
        name: example_user_assistant
      max_turns: 6
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/example_user_assistant/data/example.jsonl
      - name: validation
        type: validation
        jsonl_fpath: resources_servers/example_user_assistant/data/example.jsonl
        license: Apache 2.0
