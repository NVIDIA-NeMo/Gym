environment_routing_mode: taskset
environment_server_routes:
  "usersim:example": usersim_environment

user_model_base_url: ???
user_model_api_key: ???
user_model_name: ???
user_model_uses_reasoning_parser: false

support_model_base_url: ???
support_model_api_key: ???
support_model_name: ???
support_model_uses_reasoning_parser: false

user_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: ${user_model_base_url}
      api_key: ${user_model_api_key}
      model: ${user_model_name}
      uses_reasoning_parser: ${oc.select:user_model_uses_reasoning_parser,false}
      return_token_id_information: false

policy_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: ${policy_base_url}
      api_key: ${policy_api_key}
      model: ${policy_model_name}
      uses_reasoning_parser: ${oc.select:policy_uses_reasoning_parser,false}
      return_token_id_information: false

support_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: ${support_model_base_url}
      api_key: ${support_model_api_key}
      model: ${support_model_name}
      uses_reasoning_parser: ${support_model_uses_reasoning_parser}
      return_token_id_information: false

usersim_resources:
  resources_servers:
    usersim:
      entrypoint: app.py
      domain: agent
      verified: false
      description: Canonical NeMo UserSim probe runtime and verification.
      usersim_revision: b3381ae021baac2a6fb314b5f08a55845243017d  # pragma: allowlist secret
      tool_simulation_model:
        type: responses_api_models
        name: support_model
      probe_scorer_model:
        type: responses_api_models
        name: support_model
      datasets:
        - name: example
          type: example
          jsonl_fpath: environments/usersim/data/example.jsonl
          license: Apache 2.0

usersim_user:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      model_server:
        type: responses_api_models
        name: user_model
      resources_server:
        type: resources_servers
        name: usersim_resources
      max_steps: 2

usersim_assistant:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      model_server:
        type: responses_api_models
        name: policy_model
      resources_server:
        type: resources_servers
        name: usersim_resources
      max_steps: 10

usersim_environment:
  environment_servers:
    usersim:
      entrypoint: app.py
      user_agent:
        type: responses_api_agents
        name: usersim_user
      assistant_agent:
        type: responses_api_agents
        name: usersim_assistant
      judge_model:
        type: responses_api_models
        name: support_model
      summary_model:
        type: responses_api_models
        name: support_model
      resources_server:
        type: resources_servers
        name: usersim_resources
      resources_tool_transports:
        - direct_http
      default_episode_timeout_seconds: 1800
      cleanup_timeout_seconds: 180
