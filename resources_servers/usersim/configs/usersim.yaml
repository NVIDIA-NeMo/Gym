environment_routing_mode: taskset
environment_server_routes:
  "usersim:example": usersim_environment

support_model_base_url: ${policy_base_url}
support_model_api_key: ${policy_api_key}
support_model_name: ${policy_model_name}
support_model_uses_reasoning_parser: false

policy_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: ${policy_base_url}
      api_key: ${policy_api_key}
      model: ${policy_model_name}
      uses_reasoning_parser: ${oc.select:policy_uses_reasoning_parser,false}
      return_token_id_information: false

support_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: ${support_model_base_url}
      api_key: ${support_model_api_key}
      model: ${support_model_name}
      uses_reasoning_parser: ${support_model_uses_reasoning_parser}
      return_token_id_information: false

usersim_resources:
  resources_servers:
    usersim:
      entrypoint: app.py
      domain: agent
      verified: false
      description: Deterministic NeMo UserSim persona, probe runtime, and verification.
      personas_cache_dir: ~/.cache/nemo-gym/usersim/personas
      personas_dataset_version: 0.0.2
      usersim_revision: 2d9ec0d7c32ac800f2171b5943382a7b1eb96cbc  # pragma: allowlist secret
      tool_simulation_model:
        type: responses_api_models
        name: support_model
      probe_scorer_model:
        type: responses_api_models
        name: support_model
      personas_locales:
      - en_US
      datasets:
        - name: example
          type: example
          jsonl_fpath: environments/usersim/data/example.jsonl
          license: Apache 2.0

usersim_user:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      model_server:
        type: responses_api_models
        name: policy_model
      resources_server:
        type: resources_servers
        name: usersim_resources
      max_steps: 2

usersim_assistant:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      model_server:
        type: responses_api_models
        name: policy_model
      resources_server:
        type: resources_servers
        name: usersim_resources
      max_steps: 10

usersim_environment:
  environment_servers:
    usersim:
      entrypoint: app.py
      user_agent:
        type: responses_api_agents
        name: usersim_user
      assistant_agent:
        type: responses_api_agents
        name: usersim_assistant
      judge_model:
        type: responses_api_models
        name: support_model
      summary_model:
        type: responses_api_models
        name: support_model
      resources_server:
        type: resources_servers
        name: usersim_resources
      resources_tool_transports:
        - direct_http
      max_turns: 6
      default_episode_timeout_seconds: 1800
      cleanup_timeout_seconds: 180
      protocol_config:
        max_query_attempts: 3
        max_assistant_attempts: 1
        enforce_user_language: true
        user_language_min_script_compliance: 0.6
        user_language_min_letters: 8
        incremental_disclosure_ratio: 0.6
        persona_grounding_ratio: 1.0
        context_compression: true
        compression_window: 1
        store_reasoning: true
        random_seed: 42
        verbosity: 1
