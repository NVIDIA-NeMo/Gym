# Judge model instance for the gdp_pdf per-criterion LLM-as-judge scorer.

judge_model:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: ${oc.select:judge_base_url,https://inference-api.nvidia.com/v1}
      openai_api_key: ${oc.select:judge_api_key,null}
      openai_model: ${oc.select:judge_model_name,openai/openai/gpt-5.6-luna}
