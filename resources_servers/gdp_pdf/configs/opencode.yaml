config_paths:
- resources_servers/gdp_pdf/configs/gdp_pdf.yaml
- responses_api_agents/opencode_agent/configs/permissions/default.yaml
gdp_pdf_simple_agent: null
gdp_pdf_simple_environment_server: null
gdp_pdf_sandbox:
  _inherit_from: gdp_pdf
  resources_servers:
    gdp_pdf:
      domain: other
      description: GDP.pdf document reasoning with OpenCode and raw PDFs
      value: Evaluate document reasoning with shell, Python and image tools
      entrypoint: sandbox_app.py
      allowed_agents:
      - opencode_agent
      num_workers: 1
      sandbox_provider: sandbox
      sandbox_image: ${gdp_pdf_sandbox_image}
      sandbox_config:
        ttl_s: 14400
        resources:
          cpu: 1
          memory_mib: 4096
      verified: false
gdp_pdf_opencode:
  _inherit_from: opencode_agent
  responses_api_agents:
    opencode_agent:
      entrypoint: app.py
      model: ${policy_model_name}
      model_server:
        type: responses_api_models
        name: policy_model
      opencode_version: 1.17.11
      supports_images: true
      max_output_tokens: 16384
      timeout: 7200
      system_prompt: The source PDF is /workspace/document.pdf. Use the available
        tools to inspect its text and images and solve the user's task using only
        this document as evidence. Put your complete answer in the final chat response.
      opencode_config:
        permission:
          task: deny
          webfetch: deny
          websearch: deny
          skill: deny
gdp_pdf_opencode_environment:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: gdp_pdf_opencode
      resources_server:
        type: resources_servers
        name: gdp_pdf_sandbox
      resources_tool_transports: []
      default_episode_timeout_seconds: 7800
      max_concurrent_episodes: 8
      queue_timeout_seconds: 7800
