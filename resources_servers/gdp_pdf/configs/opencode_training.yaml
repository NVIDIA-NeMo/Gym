config_paths:
  - resources_servers/gdp_pdf/configs/opencode.yaml
  - resources_servers/gdp_pdf/configs/judge_model_openai.yaml
  - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml

gdp_pdf_opencode:
  responses_api_agents:
    opencode_agent:
      token_id_capture: true
      opencode_config:
        compaction:
          auto: false
          prune: false
      datasets:
        - name: train
          type: train
          jsonl_fpath: ${gdp_pdf_train_jsonl}
          num_repeats: 1
          license: TBD  # Replace with the license of your training corpus.

policy_model:
  responses_api_models:
    vllm_model:
      # Match these values in the trainer; OpenCode delegates sampling to this server.
      sampling_overrides:
        temperature: 1.0
        top_p: 1.0
        top_k: -1
