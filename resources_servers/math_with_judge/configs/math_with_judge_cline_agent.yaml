# cline_agent.yaml stays the single source of truth for the harness (command, model, cline_version,
# timeouts, model server); _inherit_from pulls it in so this file only sets what the math
# environment changes: the resources server it talks to, the prompt, and the dataset.
config_paths:
  - responses_api_agents/cline_agent/configs/cline_agent.yaml

math_with_judge:
  resources_servers:
    math_with_judge:
      entrypoint: app.py
      # math-verify alone decides the reward: should_use_judge: false short-circuits before the judge
      # is ever called. Both judge fields are still required by LibraryJudgeMathResourcesServerConfig,
      # so they are set to inert values rather than omitted.
      judge_model_server:
        type: responses_api_models
        name: policy_model
      judge_responses_create_params: {input: []}
      should_use_judge: false
      domain: math
      verified: false
      description: Cline agent harness on OpenMathReasoning math dataset with math-verify
      value: Improve model math capabilities in the Cline agent harness

math_with_judge_cline_agent:
  _inherit_from: cline_agent
  responses_api_agents:
    cline_agent:
      resources_server:
        type: resources_servers
        name: math_with_judge
      system_prompt: |
        You are a precise math assistant with a shell tool. Run python3 to compute or verify numeric
        results instead of doing them by hand, then state the final answer as \boxed{answer}.
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/math_with_judge/data/example.jsonl
