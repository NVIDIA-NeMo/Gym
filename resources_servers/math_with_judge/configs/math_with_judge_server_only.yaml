# Server-only math_with_judge: the verifier ns_tools delegates to, without the
# simple_agent instance and HF dataset references of math_with_judge.yaml — for
# RL runs where rows route via agent_ref and datasets ride the trainer.
math_with_judge:
  resources_servers:
    math_with_judge:
      entrypoint: app.py
      judge_model_server:
        type: responses_api_models
        name: policy_model
      judge_responses_create_params: {
        input: []
      }
      should_use_judge: false
      domain: math
      verified: false
      description: math-verify scoring (judge disabled) for ns_tools RL runs
