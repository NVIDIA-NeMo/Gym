# In-tree counterpart to examples/langchain_deepagent's tavily_search config, structurally mirroring
# tavily_search_judge_openai_model.yaml (resources server + judge_model + an in-tree agent composing with
# --model-type at launch).
#
#   gym env start --resources-server tavily_search/tavily_search_deepagents_agent_model_server \
#       --model-type inference_provider/openrouter
#   gym eval run --no-serve --agent tavily_search_deepagents_agent_model_server \
#       --input resources_servers/tavily_search/data/example.jsonl --output /tmp/deepagents_agent_tavily.jsonl

tavily_search_resources_server:
  resources_servers:
    tavily_search:
      entrypoint: app.py
      domain: agent
      tavily_api_key: ${tavily_api_key}
      exclude_domains_file_path: ${exclude_domains_file_path}
      use_judge: true
      judge_model_server:
        type: responses_api_models
        name: judge_model
      judge_responses_create_params:
        input: []
      verified: false

judge_model:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: ${search_judge_model_base_url}
      openai_api_key: ${search_judge_model_api_key}
      openai_model: ${search_judge_model_name}

tavily_search_deepagents_agent_model_server:
  responses_api_agents:
    deepagents_agent:
      entrypoint: reasoning_search_agent.py
      resources_server:
        type: resources_servers
        name: tavily_search_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      tavily_api_key: ${tavily_api_key}
      max_search_results: 5
