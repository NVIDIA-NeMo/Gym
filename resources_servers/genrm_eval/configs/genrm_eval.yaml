genrm_eval:
  resources_servers:
    genrm_eval:
      entrypoint: app.py
      domain: rlhf
      verified: false
      scoring_module: resources_servers.genrm_eval.preferences
      metric_key: overall/accuracy
      description: Evaluate a generative reward model against chat preferences

genrm_eval_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: genrm_eval
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
        - name: example
          type: example
          jsonl_fpath: resources_servers/genrm_eval/data/example.jsonl

genrm_eval_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: genrm_eval_simple_agent
