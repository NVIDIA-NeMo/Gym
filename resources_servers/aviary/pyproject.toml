[project]
name = "gym-resources-servers-aviary"
version = "0.0.0"
requires-python = ">=3.13.14"
dependencies = [
    "nemo-gym[dev]",
    "fhaviary[gsm8k,hotpotqa,notebook,llm]>=0.28.0",
    "tqdm",
    "datasets>=4.4.1",
    "huggingface-hub",
    "pillow==12.3.0",
    "hypotest[opensandbox] @ git+https://github.com/pjin-nvidia/hypotest.git@4ca8598cf55d668610e0b4ae601876003a70d280",
]

[tool.uv]
package = false
constraint-dependencies = [
    "grpcio>=1.81.0rc1",
    "msgpack>=1.2.1",
]
override-dependencies = [
    "spacy>=3.8.13",
    "wcwidth; sys_platform == 'never'",
    "opencv-python-headless; sys_platform == 'never'",
    "pynvvideocodec; sys_platform == 'never'",
    "torchcodec; sys_platform == 'never'",
    "torchvision; sys_platform == 'never'",
    "torchaudio; sys_platform == 'never'",
    "pycountry; sys_platform == 'never'",
    "gprof2dot; sys_platform == 'never'",
    "pathspec; sys_platform == 'never'",
]
exclude-dependencies = [
    "fasttext-wheel",
    "alembic",
    "blinker",
    "cryptography",
    "flask",
    "flask-cors",
    "graphene",
    "graphql-core",
    "graphql-relay",
    "gunicorn",
    "huey",
    "prettytable",
    "skops",
    "sqlalchemy",
    "werkzeug",
    "waitress",
    "diskcache",
]

[tool.uv.sources]
"nemo-lens" = { git = "https://github.com/NVIDIA-NeMo/Lens.git", rev = "4d045c03186b90afdc815db46b671f6a21bc7e98" }
"nemo-gym" = { path = "../..", editable = true }

[project.optional-dependencies]
telemetry = ["nemo-gym[telemetry]"]

[tool.uv.workspace]
members = []
