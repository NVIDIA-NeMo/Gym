roboeval:
  resources_servers:
    roboeval:
      entrypoint: app.py
      domain: coding
      verified: false
      description: RoboEval (CodeBotler) service-robot program synthesis. Programs run in a symbolic simulator and pass only if every world state's temporal check holds.
      value: Measure robotic coding on service-robot tasks
      # Fetched at a pinned commit when unset.
      roboeval_root: ${oc.env:ROBOEVAL_ROOT,null}
      simulation_timeout_s: 5.0
      max_concurrent_simulations: 16

roboeval_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: roboeval
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: benchmarks/roboeval/data/example.jsonl
        license: TBD  # BSD-3-Clause + ML-training restriction; evaluation only (see README)

roboeval_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: roboeval_simple_agent
