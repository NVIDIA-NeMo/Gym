      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: chemreason_bench
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        # Pre-materialized with benchmarks/prompts/eval/chemreason_bench/paper.yaml.
        jsonl_fpath: resources_servers/chemreason_bench/data/example.jsonl
        license: Creative Commons Attribution 4.0 International
