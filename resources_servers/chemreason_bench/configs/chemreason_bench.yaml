chemreason_bench:
  resources_servers:
    chemreason_bench:
      entrypoint: app.py
      domain: knowledge
      description: ChemReason-Bench -- six action-grounded chemical procedure reasoning tasks, deterministically scored (ACL 2026 Long Papers 33211-33248)
      value: Tests whether a model can order, validate, complete and explain real experimental procedures, scored without an LLM judge
      verified: false
chemreason_bench_simple_agent:
