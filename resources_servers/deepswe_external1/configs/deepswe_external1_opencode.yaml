# Wires the OpenCode sandboxed agent to the resources server for model runs.
# Keep agent wiring separate so golden- and null-patch validation can use the base config alone.
config_paths:
  - responses_api_agents/opencode_sandboxed_agent/configs/opencode_sandboxed_agent.yaml
  - resources_servers/deepswe_external1/configs/deepswe_external1.yaml

deepswe_external1_opencode_resources_server:
  _inherit_from: deepswe_external1_resources_server
  resources_servers:
    deepswe_external1:
      domain: coding
      verified: false
      sandbox_model_server:
        type: responses_api_models
        name: policy_model

deepswe_external1_opencode_sandboxed_agent:
  _inherit_from: opencode_sandboxed_agent
  responses_api_agents:
    opencode_sandboxed_agent:
      resources_server:
        type: resources_servers
        name: deepswe_external1_opencode_resources_server

      sandbox_timeout: 10800
