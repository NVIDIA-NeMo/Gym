leancat:
  resources_servers:
    leancat:
      entrypoint: app.py
      # `sandbox` is the instance name every shipped provider config binds, so the provider
      # is chosen by which config is on +config_paths.
      sandbox_provider: sandbox
      sandbox_config:
        # Built by resources_servers/lean_proof/lean_image (./build.sh v4.19.0). Pin a digest
        # rather than a tag: LeanCat's statements need Mathlib v4.19.0 exactly, and an older
        # Mathlib caps the score silently instead of failing.
        image: ${oc.env:LEANCAT_SANDBOX_IMAGE,gym-lean:v4.19.0}
        # One sandbox serves a whole run; with no server shutdown hook this is what reclaims
        # it if the server dies.
        ttl_s: 86400
        ready_timeout_s: 1200
        resources:
          cpu: 4
          memory_mib: 16384
          disk_gib: 30
        provider_options:
          # Lean needs no network and the image is self-contained. OpenSandbox only (other
          # providers ignore the key): the server must have an egress sidecar configured.
          network_policy:
            default_action: deny
          # Scheduling reservations, well under the burst limits above: every verify imports
          # Mathlib, so these are not minimal, but reserving the limits would occupy the
          # capacity of ~30 ordinary sandboxes.
          resource_requests:
            cpu: 1
            memory_mib: 4096
            disk_gib: 30
        # `lake` sizes its worker pool from the host core count on clusters without LXCFS.
        derive_cpu_env: true
        metadata:
          benchmark: leancat
      compilation_timeout: 300.0
      # num_workers must stay unset: >1 launches uvicorn by import string, which needs a
      # module-level `app` object this server does not define.
      domain: math
      description: LeanCat -- formal 1-category-theory proofs in Lean 4 / Mathlib
        v4.19.0
      value: Measures library-grounded abstraction in formal theorem proving, where
        current models score near zero
      verified: false
leancat_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: leancat
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/leancat/data/example.jsonl
        prompt_config: benchmarks/prompts/eval/leancat/paper.yaml
        license: Creative Commons Attribution 4.0 International

leancat_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: leancat_simple_agent
