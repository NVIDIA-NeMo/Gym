leancat:
  resources_servers:
    leancat:
      entrypoint: app.py
      sandbox_host: ${oc.env:NEMO_SKILLS_SANDBOX_HOST,127.0.0.1}
      sandbox_port: ${oc.env:NEMO_SKILLS_SANDBOX_PORT,6000}
      compilation_timeout: 300.0
      # Verify is IO-bound (it awaits the sandbox), but one uvicorn worker still serialises
      # JSON parsing and the statement guard across every concurrent rollout. Matches the
      # pattern vibench uses.
      num_workers: 8
      domain: math
      description: LeanCat -- formal 1-category-theory proofs in Lean 4 / Mathlib
        v4.19.0
      value: Measures library-grounded abstraction in formal theorem proving, where
        current models score near zero
      verified: false
leancat_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: leancat
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: train
        type: train
        jsonl_fpath: resources_servers/leancat/data/train.jsonl
        license: CC-BY-4.0
      - name: example
        type: example
        jsonl_fpath: resources_servers/leancat/data/example.jsonl
        license: CC-BY-4.0
