leancat:
  resources_servers:
    leancat:
      entrypoint: app.py
      sandbox_host: ${oc.env:NEMO_SKILLS_SANDBOX_HOST,127.0.0.1}
      sandbox_port: ${oc.env:NEMO_SKILLS_SANDBOX_PORT,6000}
      compilation_timeout: 300.0
      domain: math
      description: LeanCat with the paper's Appendix D.1 prompt instead of the upstream
        repo's
      value: Measures how much of the published LeanCat score depends on the prompt
        the repo ships rather than the one the paper prints
      verified: false
leancat_paper_d1_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: leancat
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: train
        type: train
        jsonl_fpath: resources_servers/leancat/data/paper_d1_train.jsonl
        license: CC-BY-4.0
      - name: example
        type: example
        jsonl_fpath: resources_servers/leancat/data/paper_d1_example.jsonl
        license: CC-BY-4.0
