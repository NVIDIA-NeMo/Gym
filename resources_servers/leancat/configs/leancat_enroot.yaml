leancat:
  resources_servers:
    leancat:
      entrypoint: app.py
      compilation_timeout: 300.0
      domain: math
      description: LeanCat verified through Gym's enroot sandbox provider (no HTTP
        sandbox server)
      value: Measures library-grounded abstraction in formal theorem proving, where
        current models score near zero
      sandbox_provider:
        enroot:
          create:
            mount_point: /sandbox
            start_timeout_s: 600
            # The NeMo-Skills image keeps elan under /root, which is 0700.
            remap_root: true
            # The provider's bypass path passes `--rc /dev/null`, which enroot rejects here
            # ("No such file or directory: /dev/null"). With rw the entrypoint is harmless.
            bypass_entrypoint: false
            rw: true
          exec:
            concurrency: 8
            default_timeout_s: 330
      sandbox_spec:
        image: /lustre/fsw/portfolios/convai/projects/convai_convaird_nemo-speech/users/lgrigoryan/reasoning_science/benchmarks/containers/nemo-skills-sandbox-latest.mathlib2.19.sqsh
        provider_options:
          mounts:
          - <LEAN_PREFIX>:/lean4:none:ro,rbind
        env:
          PATH: /lean4/elan/bin:/usr/local/bin:/usr/bin:/bin
          ELAN_HOME: /lean4/elan
      lean_project_dir: /lean4/leancat_project
      verified: false
leancat_enroot_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: leancat
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: train
        type: train
        jsonl_fpath: resources_servers/leancat/data/train.jsonl
        license: CC-BY-4.0
      - name: example
        type: example
        jsonl_fpath: resources_servers/leancat/data/example.jsonl
        license: CC-BY-4.0
