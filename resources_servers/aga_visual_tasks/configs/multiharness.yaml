# The original AGA Code-assisted VQA / Agent-X training task under five native harnesses. Prepare each row with
# `environments/aga_visual_tasks/prepare.py --harness NAME`. Set AGA_SANDBOX_IMAGE (an image with the harness runtimes,
# Python3/Pillow/numpy/scipy/OpenCV and a user-writable /images) and AGA_IMAGE_ROOT (the original image root).
config_paths:
  - nemo_gym/sandbox/providers/opensandbox/configs/opensandbox.yaml
  - responses_api_agents/opencode_agent/configs/opencode_agent.yaml
  - responses_api_agents/pi_agent/configs/pi_agent.yaml
  - responses_api_agents/codex_agent/configs/codex_agent.yaml
  - responses_api_agents/claude_code_agent/configs/claude_code_agent.yaml
  - responses_api_agents/openclaw_agent/configs/openclaw_agent.yaml

use_absolute_ip: true
absolute_ip_server_types: [responses_api_models]

# The original answer graders. Only the resource servers run; rows name the original simple agents in
# `image_tools_base_agent_ref`, which `aga_visual_tasks` maps to these servers.
aga_math_with_judge:
  resources_servers:
    math_with_judge:
      entrypoint: app.py
      host: 127.0.0.1
      judge_model_server: {type: responses_api_models, name: policy_model}
      judge_responses_create_params: {input: []}
      should_use_judge: false
      domain: math
      verified: false
      description: OpenMathReasoning math dataset with math-verify and LLM-as-a-judge
      value: Improve math capabilities including AIME 24 / 25

aga_mcqa:
  resources_servers:
    mcqa:
      entrypoint: app.py
      host: 127.0.0.1
      grading_mode: null
      domain: knowledge
      verified: false
      description: Multi-choice question answering problems
      value: Improve benchmarks like MMLU / GPQA / HLE

aga_string_match:
  resources_servers:
    string_match:
      entrypoint: app.py
      host: 127.0.0.1
      domain: knowledge
      verified: false
      description: General-purpose string matching verifier for free-form text answers
      value: Verify answers via case-insensitive string matching with multiple extraction strategies

aga_visual_tasks:
  resources_servers:
    aga_visual_tasks:
      entrypoint: app.py
      host: 127.0.0.1
      domain: coding
      verified: false
      description: Original AGA Code-assisted VQA / Agent-X task graded by the original answer graders
      value: Original visual reasoning with code-assisted tools
      sandbox_provider: sandbox
      sandbox_image: ${oc.env:AGA_SANDBOX_IMAGE,null}
      image_root: ${oc.env:AGA_IMAGE_ROOT,null}
      resources_server_by_agent:
        math_with_judge_simple_agent: aga_math_with_judge
        mcqa_simple_agent: aga_mcqa
        string_match_simple_agent: aga_string_match

# Tool results carry images for the harnesses that read an image file through a tool, so keep them inline for these
# agents without changing `policy_model`, which other tasks may share.
aga_policy_model:
  _copy: policy_model
  responses_api_models:
    vllm_model:
      inline_tool_output_images: true

aga_opencode_agent:
  _inherit_from: opencode_agent
  responses_api_agents:
    opencode_agent:
      host: 127.0.0.1
      resources_server: {type: resources_servers, name: aga_visual_tasks}
      model_server: {type: responses_api_models, name: aga_policy_model}
      concurrency: 32
      timeout: 1800
      context_window: 49152
      max_output_tokens: 49152
      image_input: true
      opencode_config:
        agent:
          build: {steps: 8}

aga_opencode_environment_server:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      host: 127.0.0.1
      resources_server: {type: resources_servers, name: aga_visual_tasks}
      agent_server: {type: responses_api_agents, name: aga_opencode_agent}
      # The agent's 1800 s timeout plus time for the seed (sandbox start, image upload) and the verify.
      default_episode_timeout_seconds: 2100
      # Admit episodes at the agent's rate (its concurrency, 32). Each seed lends a sandbox, so an episode admitted
      # beyond it would wait for the harness with its sandbox started and its deadline running.
      max_concurrent_episodes: 32
      queue_timeout_seconds: 86400

aga_pi_agent:
  _inherit_from: pi_agent
  responses_api_agents:
    pi_agent:
      host: 127.0.0.1
      resources_server: {type: resources_servers, name: aga_visual_tasks}
      model_server: {type: responses_api_models, name: aga_policy_model}
      concurrency: 32
      timeout: 1800
      context_window: 49152
      max_output_tokens: 49152
      image_input: true
      bash_timeout: 300

aga_pi_environment_server:
  _copy: aga_opencode_environment_server
  environment_servers:
    single_agent_turn_legacy:
      agent_server: {type: responses_api_agents, name: aga_pi_agent}

aga_codex_agent:
  _inherit_from: codex_agent
  responses_api_agents:
    codex_agent:
      host: 127.0.0.1
      resources_server: {type: resources_servers, name: aga_visual_tasks}
      model_server: {type: responses_api_models, name: aga_policy_model}
      concurrency: 32
      timeout: 1800
      model_context_window: 49152

aga_codex_environment_server:
  _copy: aga_opencode_environment_server
  environment_servers:
    single_agent_turn_legacy:
      agent_server: {type: responses_api_agents, name: aga_codex_agent}

aga_claude_code_agent:
  _inherit_from: claude_code_agent
  responses_api_agents:
    claude_code_agent:
      host: 127.0.0.1
      resources_server: {type: resources_servers, name: aga_visual_tasks}
      model_server: {type: responses_api_models, name: aga_policy_model}
      concurrency: 32
      timeout: 1800
      max_turns: 8
      claude_code_version: 2.1.108
      anthropic_api_key: ""
      model: ${policy_model_name}

aga_claude_code_environment_server:
  _copy: aga_opencode_environment_server
  environment_servers:
    single_agent_turn_legacy:
      agent_server: {type: responses_api_agents, name: aga_claude_code_agent}

aga_openclaw_agent:
  _inherit_from: openclaw_agent
  responses_api_agents:
    openclaw_agent:
      host: 127.0.0.1
      resources_server: {type: resources_servers, name: aga_visual_tasks}
      model_server: {type: responses_api_models, name: aga_policy_model}
      concurrency: 32
      timeout: 1800
      context_window: 49152
      max_output_tokens: 49152
      image_input: true

aga_openclaw_environment_server:
  _copy: aga_opencode_environment_server
  environment_servers:
    single_agent_turn_legacy:
      agent_server: {type: responses_api_agents, name: aga_openclaw_agent}
