facts_search:
  resources_servers:
    facts_search:
      entrypoint: app.py
      domain: knowledge
      verified: false
      description: Complete public FACTS Search V2 Search-On protocol with Brave Search and Gemini 3.5 Flash grading
      value: Measure factual search-agent quality, commitment, and search efficiency
      brave_api_key: ${oc.env:FACTS_SEARCH_BRAVE_API_KEY,''}
      brave_num_results: 5
      brave_timeout_seconds: 30
      brave_max_retries: 3
      judge_model_server:
        type: responses_api_models
        name: facts_search_judge
      judge_responses_create_params:
        input: []

facts_search_judge:
  responses_api_models:
    inference_provider:
      entrypoint: app.py
      base_url: ${oc.env:FACTS_SEARCH_JUDGE_BASE_URL,''}
      api_key: ${oc.env:FACTS_SEARCH_JUDGE_API_KEY,''}
      model: ${oc.env:FACTS_SEARCH_JUDGE_MODEL,google/gemini-3.5-flash}
      num_concurrent_requests: ${oc.decode:${oc.env:FACTS_SEARCH_JUDGE_CONCURRENCY,8}}
