jsonschemabench:
  resources_servers:
    jsonschemabench:
      entrypoint: app.py
      domain: instruction_following
      verified: false
      description: Validate JSONSchemaBench responses against the original Draft 2020-12 schemas
      value: Measure standards-compliant JSON Schema generation without rewriting benchmark schemas

jsonschemabench_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: jsonschemabench
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/jsonschemabench/data/example.jsonl
        num_repeats: 1
        license: Apache 2.0
