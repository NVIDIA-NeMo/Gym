config_paths:
  - resources_servers/longfact/configs/longfact_resources.yaml

# Catalog metadata is repeated here because the README table reads each pairing directly.
longfact:
  resources_servers:
    longfact:
      domain: knowledge
      description: LongFact long-form factuality evaluation using a SAFE-style verifier.
      value: Claim-level factuality with three-way verdicts, scored with SAFE F1@100.
      verified: false

longfact_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: longfact
      model_server:
        type: responses_api_models
        name: policy_model
      max_steps: 1
      execute_tools: false
      datasets:
        - name: example
          type: example
          jsonl_fpath: resources_servers/longfact/data/example.jsonl
          license: CC-BY-4.0

longfact_environment_server:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: longfact
      agent_server:
        type: responses_api_agents
        name: longfact_simple_agent
      resources_tool_transports: []
      tool_servers: []
      default_episode_timeout_seconds: null
      cleanup_timeout_seconds: 60
