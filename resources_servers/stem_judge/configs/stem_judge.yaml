stem_judge:
  resources_servers:
    stem_judge:
      entrypoint: app.py
      # Point this at the judge model server in your run's config.
      judge_model_server:
        type: responses_api_models
        name: policy_model
      judge_responses_create_params:
        input: []
      judge_endpoint_max_concurrency: 64
      judge_system_message: null
      answer_prompt_template_fpath: prompt_templates/stem_v11.txt
      rubric_prompt_template_fpath: prompt_templates/stem_rubric.txt

      # --- What the judge is shown as the question ---
      # The last user message. extract_problem_from_prompt strips the fixed
      # "... Answer: {your final answer}" preamble; an explicit
      # question_extract_regex wins over it.
      question_extract_regex: null
      extract_problem_from_prompt: false

      # --- Answer contract (a row's answer_format wins) ---
      # The final answer is the assistant message: the policy's model server
      # must run with a reasoning parser.
      # boxed: 0 without a non-empty \boxed{} in the final answer.
      # free: the judge sees the whole final answer.
      default_answer_format: boxed
      # Boxed rows: "final_answer" gates on the box and shows the judge the whole
      # final answer (the setup the offline study measured); "box" shows only
      # the box's content.
      boxed_judge_input: final_answer
      # Off: some chemistry references run to 4K characters and correct boxes to
      # 5K (3 of 26,880 sampled training rollouts have a box over 2K, all correct).
      max_box_chars: null
      # 0 when the judge would see a final answer longer than this.
      max_answer_chars: 16000

      # --- Rubric rows ---
      # fraction: reward = earned / total positive points, clipped to [0, 1].
      # threshold: reward = 1 if that fraction >= rubric_pass_fraction.
      rubric_reward: fraction
      rubric_pass_fraction: 1.0

      # One JSONL record per verify() when set; must be a mounted, writable path.
      generation_log_dir: null
      generation_log_filename: stem_judge_generations.jsonl

      domain: knowledge
      verified: false
      description: STEM open-answer grading with an LLM judge (stem_v11 prompt, length guards, boxed/free answers, rubric rows)
      value: Improve the STEM RL reward signal
stem_judge_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: stem_judge
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        license: "TBD"
        jsonl_fpath: resources_servers/stem_judge/data/example.jsonl
