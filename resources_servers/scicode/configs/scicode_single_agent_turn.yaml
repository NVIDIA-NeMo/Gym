# SciCode run by the single_agent_turn_legacy Environment Server. scicode_agent reads each problem from the row's
# agent_context and runs the sub-step loop inside one /v1/responses activation; /verify grades the solutions its
# response carries. scicode.yaml runs the same loop in the agent's /run behind a legacy_agent relay, with the same
# model requests and the same reward. This file uses its instance names, so either one can be loaded.
# Rows need agent_context: benchmarks/scicode/prepare.py writes it (scicode_agent_context).
config_paths:
  - responses_api_agents/scicode_agent/configs/scicode_agent.yaml

scicode:
  resources_servers:
    scicode:
      allowed_agents: [scicode_agent]
      entrypoint: app.py
      domain: coding
      verified: false
      description: Multi-step scientific code generation; sub-step solutions executed against SciCode test cases
      value: Improve multi-step scientific code generation
      num_processes: 20
      timeout_secs: 30.0
      test_data_fpath: null
      # Opt-in per-sub-step execution records in every rollout row (see README).
      record_step_outputs: false
      output_tail_chars: 2000
      record_step_code: false

scicode_agent:
  responses_api_agents:
    scicode_agent:
      resources_server:
        name: scicode
      datasets:
        - name: example
          type: example
          jsonl_fpath: resources_servers/scicode/data/example.jsonl
          prompt_config: null
          num_repeats: 1
          license: Apache 2.0

scicode_agent_environment_server:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: scicode
      agent_server:
        type: responses_api_agents
        name: scicode_agent
