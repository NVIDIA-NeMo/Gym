claweval_resources:
  resources_servers:
    claweval:
      entrypoint: app.py
      num_workers: 1
      domain: agent
      verified: false
      description: ClawEval task services, tools and graders for interchangeable agent sessions
      value: Compare harnesses against the same native task state and verifier
      claweval_root: ${oc.env:CLAW_EVAL_ROOT}
      claweval_revision: ${oc.env:CLAW_EVAL_REVISION}
      claweval_python: ${oc.env:CLAW_EVAL_PYTHON,python3}
      claweval_config: ${oc.env:CLAW_EVAL_CONFIG}
      fixture_root: ${oc.env:CLAW_EVAL_FIXTURE_ROOT,null}
      sandbox_image: ${oc.env:CLAW_EVAL_SANDBOX_IMAGE}
      sandbox_dependencies: ${oc.env:CLAW_EVAL_SANDBOX_DEPS}
      output_root: ${oc.env:CLAW_EVAL_GYM_OUTPUT,outputs/claweval_sessions}
