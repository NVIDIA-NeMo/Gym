math_formal_lean:
  resources_servers:
    math_formal_lean:
      entrypoint: app.py
      # skills_sidecar (default) | gym_sandbox (AsyncSandbox + sandbox_provider)
      sandbox_backend: skills_sidecar
      sandbox_host: ${oc.env:NEMO_SKILLS_SANDBOX_HOST,127.0.0.1}
      sandbox_port: ${oc.env:NEMO_SKILLS_SANDBOX_PORT,6000}
      # Used only when sandbox_backend=gym_sandbox (include opensandbox.yaml in config_paths)
      sandbox_provider: sandbox
      sandbox_spec:
        image: ${oc.env:NEMO_GYM_LEAN_SANDBOX_IMAGE,leanprovercommunity/lean4:latest}
        resources:
          cpu: 2
          memory_mib: 4096
      lean_proof_path: /sandbox/proof.lean
      lean_compile_command: "lean {proof_path}"
      compilation_timeout: 30.0
      domain: math
      verified: false
      description: Lean4 formal proof verification environment
      value: Improve formal theorem proving capabilities

math_formal_lean_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: math_formal_lean
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: train
        type: train
        jsonl_fpath: resources_servers/math_formal_lean/data/minif2f_test.jsonl
        license: MIT
      - name: example
        type: example
        jsonl_fpath: resources_servers/math_formal_lean/data/minif2f_test.jsonl
