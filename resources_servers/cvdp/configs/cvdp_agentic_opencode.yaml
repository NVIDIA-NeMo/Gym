# CVDP agentic tasks with OpenCode in the lent task sandbox; see cvdp_agentic.yaml. Replaces
# responses_api_agents/cvdp_agent/configs/cvdp_agent_generic_opencode.yaml, whose OpenCode version and budget it
# keeps. The model is the policy model server, not a provider block in opencode_config.
config_paths:
  - resources_servers/cvdp/configs/cvdp_agentic.yaml
  # opencode_agent's command deny-list, which also denies the web and skill tools; not opencode_agent.yaml, whose
  # settings this agent sets itself.
  - responses_api_agents/opencode_agent/configs/permissions/default.yaml
  - environment_servers/single_agent_turn_legacy/configs/single_agent_turn_legacy.yaml

cvdp_agentic_opencode_agent:
  _inherit_from: opencode_agent
  responses_api_agents:
    opencode_agent:
      entrypoint: app.py
      num_workers: 1
      model: ${policy_model_name}
      model_server:
        type: responses_api_models
        name: policy_model
      resources_server:
        type: resources_servers
        name: cvdp_agentic_resources_server
      opencode_version: 1.17.11
      thinking: false
      # OpenCode asks for max_output_tokens on every call, and an OpenAI-compatible server refuses a request whose
      # prompt plus output budget exceeds the served context: keep their sum within it.
      context_window: 229376
      max_output_tokens: 32768
      # cvdp_agent's harness timeout.
      timeout: 900
      sandbox_install_timeout_seconds: 600
      session_close_timeout_seconds: 60
      session_close_retry_window_seconds: 300
      opencode_config:
        # These follow the deny-list's "*": allow, which they override. The legacy config allows webfetch.
        permission:
          webfetch: deny
          websearch: deny
          task: deny
          skill: deny

cvdp_agentic_opencode:
  _inherit_from: single_agent_turn_legacy
  environment_servers:
    single_agent_turn_legacy:
      resources_server:
        type: resources_servers
        name: cvdp_agentic_resources_server
      agent_server:
        type: responses_api_agents
        name: cvdp_agentic_opencode_agent
      # Sandbox start (an image conversion on first use), the agent's 900 s, then the harness's container_timeout.
      default_episode_timeout_seconds: 3600
