terminal_multi_harness_opencode_resources_server:
  resources_servers:
    terminal_multi_harness:
      allowed_agents: [simple_agent, tool_simulation_agent]
      entrypoint: app.py
      domain: agent
      tool_call_comparator_config:
        string_similarity_threshold: 0.9
      verified: false
      description: OpenCode harness structured-action verifier for next-step pivot RL.

terminal_multi_harness_opencode_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      # One model call; its tool calls go to the verifier unexecuted.
      execute_tools: false
      resources_server:
        type: resources_servers
        name: terminal_multi_harness_opencode_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/terminal_multi_harness/data/example.jsonl
        num_repeats: 1

terminal_multi_harness_opencode_environment_server:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: terminal_multi_harness_opencode_agent
      resources_tool_transports:
      - direct_http
      default_episode_timeout_seconds: 21600
      cleanup_timeout_seconds: 180
