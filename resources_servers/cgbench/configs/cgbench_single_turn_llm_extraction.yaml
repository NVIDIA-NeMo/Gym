# cgbench_single_turn.yaml with answer extraction by a judge model (llm_extraction_v1).
# The judge reads the row's question and 5-8 options and the final answer (never the video or gold label)
# and returns the chosen option letter. See resources_servers/video_mcqa/README.md.
cgbench:
  resources_servers:
    cgbench:
      entrypoint: app.py
      domain: other
      verified: false
      description: CG-Bench (full/mini/hard) single-turn full-video long_acc MCQA (5-8 options); a judge model reads the chosen option (llm_extraction_v1).
      cohort_manifest: ${cgbench_cohort_manifest}
      judge_model_server:
        type: responses_api_models
        name: video_mcqa_answer_judge
      judge_chat_completion_create_params:
        messages: []

# The judge: any OpenAI-compatible chat model (judge_base_url, judge_api_key, judge_model_name).
video_mcqa_answer_judge:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: ${judge_base_url}
      openai_api_key: ${judge_api_key}
      openai_model: ${judge_model_name}

cgbench_single_turn:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: cgbench
      model_server:
        type: responses_api_models
        name: policy_model

cgbench_single_turn_environment:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: cgbench
      agent_server:
        type: responses_api_agents
        name: cgbench_single_turn
