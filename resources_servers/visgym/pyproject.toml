[project]
name = "gym-resources-servers-visgym"
version = "0.0.0"
requires-python = ">=3.13.14"
dependencies = [
    "nemo-gym[dev]",
    "gymnasium",
    "opencv-python-headless>=4.11",
    "scikit-image>=0.22",
    "pycocotools>=2,<3",
    "trimesh>=4,<5",
    "ursina>=6,<8",
    "mujoco>=3,<4",
    "pygame>=2.1.3,<3",
    "pillow==12.3.0",
    "gprof2dot>=2025.4.14",
    "pydot>=4,<5",
    "pytest>=8",
    "matplotlib>=3.10",
]

[tool.uv]
package = false
required-version = ">=0.13.4"
constraint-dependencies = [
    "grpcio>=1.84.1,!=1.85.0rc1",
    "certifi>=2026.10.19",
    "msgpack>=1.2.1",
    "pyarrow>=25.0.1",
    "transformers>=5.17.0",
]
override-dependencies = [
    "spacy>=3.8.13",
    "wcwidth; sys_platform == 'never'",
    "opencv-python-headless>=4.11",
    "pynvvideocodec; sys_platform == 'never'",
    "torchcodec; sys_platform == 'never'",
    "torchvision; sys_platform == 'never'",
    "torchaudio; sys_platform == 'never'",
    "pycountry; sys_platform == 'never'",
    "gprof2dot>=2025.4.14",
    "pathspec; sys_platform == 'never'",
]
exclude-dependencies = [
    "fasttext-wheel",
    "alembic",
    "blinker",
    "flask",
    "flask-cors",
    "graphene",
    "graphql-core",
    "graphql-relay",
    "gunicorn",
    "huey",
    "prettytable",
    "skops",
    "sqlalchemy",
    "werkzeug",
    "waitress",
    "diskcache",
]

[tool.uv.sources]
gymnasium = { git = "https://github.com/aroshanghias-nvd/VisGym.git", rev = "33f996cda320db5f127b1e2a858c5653bebc90fc" }
nemo-gym = { path = "../..", editable = true }

[tool.uv.sources.nemo-lens]
git = "https://github.com/NVIDIA-NeMo/Lens.git"
rev = "4d045c03186b90afdc815db46b671f6a21bc7e98"
[tool.uv.workspace]
members = []
