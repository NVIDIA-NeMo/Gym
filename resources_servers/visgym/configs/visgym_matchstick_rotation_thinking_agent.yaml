visgym_resources_server:
  resources_servers:
    visgym:
      entrypoint: app.py
      domain: games
      verified: false
      description: "Env-id-parametric wrapper around VisGym/Gymnasium visual environments."
      task_jsonl_fpaths: []
      image_format: "PNG"
      image_jpeg_quality: 90
      skip_images: false
      enforce_horizon_cap: true
      return_transitions: false
      include_env_feedback: true
      render_on_missing_image: true
visgym_agent:
  responses_api_agents:
    visgym_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: visgym_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      max_steps: 15
      done_if_no_boxed_answer: true
      unboxed_action_regex: "^\\('(?:move|stop)',\\s*(?:\\[[0-9.,\\s-]+\\]|'stop')\\)$"
      return_transitions: false
      system_prompt: |-
        You control one blue matchstick and must align it with the red target.
        Respond with exactly one legal action tuple inside \boxed{ and }.
        An action is mandatory even when uncertain. Do not think aloud, explain,
        describe the image, estimate coordinates in prose, compare alternatives,
        plan later turns, repeat instructions, or revise the action. Output no
        text before or after the boxed tuple.
      re_emit_rules_each_turn: true
      rules_summary_template: |-
        Output exactly one legal action tuple inside \boxed{ and }, with no
        thinking or other text. Never omit the action.
      datasets:
        - name: matchstick_rotation_starter
          type: example
          jsonl_fpath: data/matchstick_rotation_easy_starter_scale64_t1024.jsonl
