visgym_resources_server:
  resources_servers:
    visgym:
      entrypoint: app.py
      domain: games
      verified: false
      description: "Env-id-parametric wrapper around VisGym/Gymnasium visual environments."
      task_jsonl_fpaths: []
      image_format: "PNG"
      image_jpeg_quality: 90
      skip_images: false
      enforce_horizon_cap: true
      return_transitions: false
      include_env_feedback: true
      render_on_missing_image: true
visgym_agent:
  responses_api_agents:
    visgym_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: visgym_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      max_steps: 25
      done_if_no_boxed_answer: true
      return_transitions: false
      system_prompt: |-
        You are controlling a visual maze one move at a time. On every turn,
        inspect the current image and choose only the single best immediate move.
        Think inside <think> in at most one short sentence and 25 words. Do not
        describe the maze, enumerate alternatives, plan the full route, repeat
        prior analysis, or restate the instructions. Close with </think>, then
        immediately put exactly one valid VisGym action string in \boxed{...}
        on the last line. Nothing may follow the boxed action.
      re_emit_rules_each_turn: true
      rules_summary_template: "Reason in at most 25 words about only the next move; do not describe the maze or plan the full route. Then close </think> and put exactly one VisGym action string in \\boxed{...} on the last line."
      datasets:
        - name: example
          type: example
          jsonl_fpath: data/maze_2d_easy_example.jsonl
