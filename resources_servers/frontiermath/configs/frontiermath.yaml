frontiermath:
  resources_servers:
    frontiermath:
      entrypoint: app.py
      domain: math
      verified: false
      description: Exact boxed-answer verification for the FrontierMath public sample
      value: Evaluate advanced mathematical reasoning across languages
      verifier_timeout_seconds: 15.0
      verifier_max_concurrency: 16

frontiermath_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: frontiermath
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
        - name: example
          type: example
          jsonl_fpath: resources_servers/frontiermath/data/example.jsonl
