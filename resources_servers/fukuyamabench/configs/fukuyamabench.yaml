fukuyamabench:
  resources_servers:
    fukuyamabench:
      entrypoint: app.py
      domain: knowledge
      verified: false
      description: FukuyamaBench organic reaction-mechanism pathway verifier
      value: Evaluate step-by-step organic reaction mechanism prediction with FukuyamaBench
fukuyamabench_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: fukuyamabench
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/fukuyamabench/data/example.jsonl
        license: Apache 2.0
      - name: val
        type: validation
        jsonl_fpath: resources_servers/fukuyamabench/data/val.jsonl
        license: Apache 2.0
