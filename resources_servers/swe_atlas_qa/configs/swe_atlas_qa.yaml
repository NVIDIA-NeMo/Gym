swe_atlas_qa_resources_server:
  resources_servers:
    swe_atlas_qa:
      entrypoint: app.py
      domain: coding
      description: SWE Atlas Codebase Q&A with the upstream rubric evaluator
      verified: false
      allowed_agents: [harness_agent]
      sandbox_provider: sandbox
      model_server:
        type: responses_api_models
        name: policy_model
      sandbox_model_base_url: http://${oc.env:SWE_ATLAS_GYM_MODEL_HOST}:${policy_model.responses_api_models.vllm_model.port}
      judge_base_url: ${oc.env:SWE_ATLAS_JUDGE_BASE_URL}
      judge_model: ${oc.env:SWE_ATLAS_JUDGE_MODEL}
      judge_api_key: ${oc.env:SWE_ATLAS_JUDGE_API_KEY,unused}

swe_atlas_qa_agent:
  responses_api_agents:
    harness_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: swe_atlas_qa_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      sandbox_provider: sandbox
      sandbox_model_base_url: ${swe_atlas_qa_resources_server.resources_servers.swe_atlas_qa.sandbox_model_base_url}
      agent: opencode
      agent_kwargs:
        model: ${policy_model_name}
        command: opencode
        timeout: 10800
      gym_source: ${oc.env:SWE_ATLAS_HARNESS_BUNDLE}
      sandbox_python: ${oc.env:SWE_ATLAS_HARNESS_PYTHON,python3}
      concurrency: 1
      rollout_timeout: 11100
      datasets:
        - name: swe_atlas_qa
          type: benchmark
          jsonl_fpath: resources_servers/swe_atlas_qa/data/benchmark.jsonl
          prepare_script: resources_servers/swe_atlas_qa/prepare.py

swe_atlas_qa_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: swe_atlas_qa_agent

policy_model:
  responses_api_models:
    vllm_model:
      host: ${oc.env:SWE_ATLAS_GYM_MODEL_HOST}
      port: 8000
