policy_model:
  responses_api_models:
    inference_provider:
      entrypoint: app.py
      base_url: ${policy_base_url}
      api_key: ${policy_api_key}
      model: ${policy_model_name}

kuhn_poker:
  resources_servers:
    kuhn_poker:
      entrypoint: app.py
      domain: games
      verified: false
      description: Seeded two-player Kuhn Poker with alternating private observations.
      value: Example reusable multi-agent environment with LLM-controlled players.
      invalid_retries: 1
      agent_ids:
      - player0
      - player1

kuhn_player0:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: kuhn_poker
      model_server:
        type: responses_api_models
        name: policy_model
      max_steps: 1

kuhn_player1:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: kuhn_poker
      model_server:
        type: responses_api_models
        name: policy_model
      max_steps: 1

kuhn_poker_orchestrator:
  rollout_orchestrators:
    alternating_turn:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: kuhn_poker
      agents:
        player0:
          type: responses_api_agents
          name: kuhn_player0
        player1:
          type: responses_api_agents
          name: kuhn_player1
      focal_agent: player0
      max_turns: 8
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/kuhn_poker/data/example.jsonl
      - name: validation
        type: validation
        jsonl_fpath: resources_servers/kuhn_poker/data/example.jsonl
        license: MIT
