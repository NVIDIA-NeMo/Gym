# Agentic UI generation: a coding harness writes one UI entry file from scratch in a per-stack sandbox that this
# resources server lends through single_agent_turn; this server then builds the snapshotted file in a fresh copy
# of the image's template and scores it with an LLM judge (reward = build x quality / 4). Run it through a harness
# composition in environments/ui_generation_agentic/ (opencode.yaml, claude_code.yaml, hermes.yaml, codex.yaml),
# which sets the agent.
#
# Images, judge and policy endpoints are supplied by the runner (env vars / env.yaml); nothing here names them.
#   UI_GEN_{NEXT,VITE,STATIC}_IMAGE       digest-pinned agent images you build and push from docker/ (README.md);
#                                         a seed of a stack whose image is unset is refused
#   UI_GEN_{NEXT,VITE,STATIC}_MANIFEST_SHA256   optional manifest pins, checked at every seed
#   judge_base_url / judge_api_key / judge_model_name   the judge model, in env.yaml (required)
config_paths:
  - environment_servers/single_agent_turn/configs/single_agent_turn.yaml

environment_server_routes:
  "ui_generation_agentic:example": ui_generation_agentic_environment_server

# The harness's output cap for each model call: reasoning plus one tool call. A call cut off at this cap is lost and
# the run stops, which scores as a model failure. Override per run with ++ui_generation_agentic_max_output_tokens=<n>.
# OpenCode and Hermes read it; Claude Code keeps its CLI default (32000); Codex takes its cap from the model server
# (README.md, "Run").
ui_generation_agentic_max_output_tokens: 32768

ui_generation_agentic_resources_server:
  resources_servers:
    ui_generation_agentic:
      entrypoint: app.py
      domain: coding
      verified: false
      description: An agent writes one front-end UI file from scratch in a sandbox; graded by building it and an LLM judge.
      value: Generate agentic UI-building traces (and rewards) across harnesses with a build check and a code judge.
      allowed_agents: [opencode_agent, claude_code_agent, hermes_agent, codex_agent]
      # Lent sandboxes and sessions live in this process.
      num_workers: 1
      sandbox_provider: sandbox
      sandbox_config:
        # Outlives the episode (default_episode_timeout_seconds below) plus verification and cleanup.
        ttl_s: 10800
        ready_timeout_s: 1200
        resources:
          cpu: 2
          memory_mib: 8192
        metadata:
          benchmark: ui-generation-agentic
      stacks:
        ui-next:
          image: ${oc.env:UI_GEN_NEXT_IMAGE,null}
          workdir: /app
          agent_user: node
          entry_path: app/sample.tsx
          language: tsx
          description: Next.js 15 app router, React 19, TypeScript, Tailwind CSS 3; the file default-exports a client component rendered on the home page; only the preinstalled npm packages are available.
          manifest_sha256: ${oc.env:UI_GEN_NEXT_MANIFEST_SHA256,null}
        ui-vite:
          image: ${oc.env:UI_GEN_VITE_IMAGE,null}
          workdir: /app
          agent_user: node
          entry_path: src/App.tsx
          language: tsx
          description: Vite 7 + React 19 + TypeScript + Tailwind CSS 3 single-page app; the file default-exports the App component; only the preinstalled npm packages are available.
          manifest_sha256: ${oc.env:UI_GEN_VITE_MANIFEST_SHA256,null}
        ui-static:
          image: ${oc.env:UI_GEN_STATIC_IMAGE,null}
          workdir: /usr/share/nginx/html
          agent_user: ui
          entry_path: index.html
          language: html
          description: A single self-contained static HTML page (inline CSS and JS; libraries only from public CDNs) served by nginx.
          manifest_sha256: ${oc.env:UI_GEN_STATIC_MANIFEST_SHA256,null}
      # restricted: deny-all egress except the policy model server's host (every port of it) and Google Fonts
      # (OpenSandbox only; another provider is refused at startup). open: no egress rule.
      agent_network_mode: restricted
      model_server:
        type: responses_api_models
        name: policy_model
      extra_allowed_hosts: [fonts.googleapis.com, fonts.gstatic.com]
      # What the deployment enforces (from the egress probe); stamped on every rollout.
      egress_enforcement: ${oc.env:UI_GEN_EGRESS_ENFORCEMENT,unknown}
      # detection_only when sandbox commands cannot switch user (self-hosted OpenSandbox 1.1.1 runs them as the
      # image user); full needs root and the verifier user (tested with the Docker provider).
      guard_mode: detection_only
      build_timeout_s: 600
      inconclusive_verification_retries: 2
      # The judge score a built file earns (reward = build x score / 4): quality, prompt_adherence, mean or min.
      reward_score: quality
      judge_model_server:
        type: responses_api_models
        name: ui_generation_agentic_judge_model
      judge_chat_completions_create_params:
        messages: []
        max_tokens: 16384
      judge_max_concurrency: 8
      judge_max_attempts: 4
      datasets:
        - name: example
          type: example
          jsonl_fpath: resources_servers/ui_generation_agentic/data/example.jsonl
          taskset: "ui_generation_agentic:example"
          num_repeats: 1

# The judge: a model of another family than the policy, supplied through env.yaml (judge_base_url, judge_api_key,
# judge_model_name; a run without them fails at config resolution). Sampling is left to the endpoint's defaults.
# The judge server listens on loopback only, so a restricted sandbox (which can reach every port of the policy model
# server's host) cannot call the judge, even with ++use_absolute_ip=true.
ui_generation_agentic_judge_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      host: 127.0.0.1
      base_url: ${judge_base_url}
      api_key: ${judge_api_key}
      model: ${judge_model_name}
      return_token_id_information: false
      uses_reasoning_parser: true
      uses_interleaved_reasoning: false
      default_headers: {}
      endpoint_file: null
      endpoint_stale_grace_s: 300.0
      endpoint_connection_retries: 8
      endpoint_connection_retry_timeout_s: null
      endpoint_check_interval_s: 10.0
      route_around_failing_endpoints: false
      endpoint_failure_threshold: 3
      endpoint_retry_after_s: 60.0

ui_generation_agentic_environment_server:
  _inherit_from: single_agent_turn
  environment_servers:
    single_agent_turn:
      resources_server:
        type: resources_servers
        name: ui_generation_agentic_resources_server
      # Set by the harness composition in environments/ui_generation_agentic/.
      agent_server:
        type: responses_api_agents
        name: ???
      resources_tool_transports: []
      # Admission waits (up to a day) before an episode's deadline starts.
      max_concurrent_episodes: 4
      queue_timeout_seconds: 86400
      # Above the harness timeout (3600) plus seed, runtime install, the build and the judge.
      default_episode_timeout_seconds: 7200
