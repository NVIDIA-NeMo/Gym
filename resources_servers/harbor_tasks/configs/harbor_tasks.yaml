# Resources server for Harbor-format tasks: owns the task sandbox and grades it with the task's Harbor verifier.
# Runs the bundled example task with Harbor's Terminus-2 through the single-agent-turn Environment Server; pick
# another agent with --agent-type (for example harbor_harness_agent/opencode). Add a sandbox provider config and a
# model server. Curated Harbor hub benchmarks live under benchmarks/harbor/.
config_paths:
  - responses_api_agents/harbor_harness_agent/configs/harbor_harness_agent.yaml
  - environment_servers/single_agent_turn_legacy/configs/single_agent_turn_legacy.yaml

harbor_tasks:
  resources_servers:
    harbor_tasks:
      allowed_agents: [harbor_harness_agent]
      entrypoint: app.py
      domain: agent
      verified: false
      description: Harbor-format tasks graded by each task's own Harbor verifier
      value: Run Harbor datasets with any agent that accepts a borrowed sandbox

      # Alias -> harbor.models.job.config:DatasetConfig. A local `path` (relative to the Gym repository), or a
      # registry `name` and `ref`. Rows name tasks as {harbor_dataset: <alias>, task_name: <name>}.
      harbor_datasets:
        example:
          path: resources_servers/harbor_tasks/data/tasks
      # Tasks without a prebuilt docker_image start this image, built by benchmarks/harbor/prepare_utils/build_images.py.
      image_template: nemo-gym-harbor-env:{environment_hash}

      # Top-level sandbox provider config, e.g. nemo_gym/sandbox/providers/docker/configs/docker.yaml.
      sandbox_provider: sandbox
      sandbox_config:
        ttl_s: 21600
        ready_timeout_s: 900

      # Follows harbor.models.trial.config:VerifierConfig.
      harbor_verifier:
        override_timeout_sec: null
        max_timeout_sec: null
      verifier_timeout_multiplier: 1.0
      reward_key: reward
      artifacts_dir: results/harbor_tasks

      datasets:
        - name: example
          type: example
          jsonl_fpath: resources_servers/harbor_tasks/data/example.jsonl
          license: Apache 2.0

harbor_tasks_harbor_harness_agent:
  _inherit_from: harbor_harness_agent
  responses_api_agents:
    harbor_harness_agent:
      resources_server:
        type: resources_servers
        name: harbor_tasks

harbor_tasks_single_agent_turn:
  _inherit_from: single_agent_turn_legacy
  environment_servers:
    single_agent_turn_legacy:
      resources_server:
        type: resources_servers
        name: harbor_tasks
      agent_server:
        type: responses_api_agents
        name: harbor_tasks_harbor_harness_agent
