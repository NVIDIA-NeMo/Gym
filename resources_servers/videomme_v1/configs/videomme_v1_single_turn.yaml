videomme_v1:
  resources_servers:
    videomme_v1:
      entrypoint: app.py
      domain: other
      verified: false
      description: VideoMME-v1 single-turn video MCQA with fixed-cohort accuracy and category coverage.
      cohort_manifest: ${videomme_v1_cohort_manifest}

videomme_v1_single_turn:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: videomme_v1
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/videomme_v1/data/example.jsonl
        license: Apache 2.0

videomme_v1_single_turn_environment:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: videomme_v1
      agent_server:
        type: responses_api_agents
        name: videomme_v1_single_turn
