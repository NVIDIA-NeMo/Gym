videomme_v1:
  resources_servers:
    videomme_v1:
      entrypoint: app.py
      domain: other
      verified: false
      description: VideoMME-v1 single-turn video MCQA with fixed-cohort accuracy and category coverage.
      cohort_manifest: ${videomme_v1_cohort_manifest}

videomme_v1_single_turn:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: videomme_v1
      model_server:
        type: responses_api_models
        name: policy_model

videomme_v1_single_turn_environment:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: videomme_v1_single_turn
