# Answer extraction by a judge model for videomme_v1_agentic.yaml: list this file after it in config_paths, with agentic rows
# that keep the benchmark's own letter prompt and a cohort whose answer_policy is llm_extraction_v1. The judge reads the
# question text and the final answer (never the video or the gold label); see resources_servers/video_mcqa/README.md.
videomme_v1_agentic:
  resources_servers:
    videomme_v1:
      judge_model_server:
        type: responses_api_models
        name: video_mcqa_answer_judge
      judge_chat_completion_create_params:
        messages: []
      verified: false

# The judge: any OpenAI-compatible chat model (judge_base_url, judge_api_key, judge_model_name). Its server listens on
# 127.0.0.1 only: the lent sandbox may reach every port of the policy model server's host, and must not reach a judge.
video_mcqa_answer_judge:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      host: 127.0.0.1
      openai_base_url: ${judge_base_url}
      openai_api_key: ${judge_api_key}
      openai_model: ${judge_model_name}
