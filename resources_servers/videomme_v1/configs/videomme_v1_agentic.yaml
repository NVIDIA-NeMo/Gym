videomme_v1_agentic_resources:
  resources_servers:
    videomme_v1:
      entrypoint: app.py
      domain: other
      verified: false
      description: VideoMME-v1 agentic video MCQA; never combined with single-turn results.
      cohort_manifest: ${videomme_v1_agentic_cohort_manifest}

videomme_v1_agentic:
  responses_api_agents:
    opencode_video_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: videomme_v1_agentic_resources
      model_server:
        type: responses_api_models
        name: policy_model
      opencode_version: 1.17.11
      preinstalled_opencode: true
      opencode_max_context_window: ${video_context_tokens}
      max_output_tokens: ${video_output_tokens}
      media_profile: ${video_media_profile}
      media_runtime_archive: ${video_runtime_archive}
      media_runtime_sha256: ${video_runtime_sha256}
      allowed_video_roots: ${video_source_roots}
      artifacts_dir: ${video_agent_artifacts_dir}
      capture_model_inputs: false
      execution_failure_reward_zero: true
      output_token_policy: fixed
      network_access: model_only
      concurrency: 1
      sandbox_provider: opensandbox
      sandbox_timeout: 2400
      sandbox_config:
        image: ${video_sandbox_image}
        workdir: /testbed/work
        resources:
          cpu: 2
          memory_mib: 8192
        ttl_s: 3300
        ready_timeout_s: 1200

videomme_v1_agentic_environment:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: videomme_v1_agentic
