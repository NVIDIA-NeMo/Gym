python_list:
  resources_servers:
    python_list:
      entrypoint: app.py
      domain: knowledge
      verified: false
      description: Rule-based verifier for Python list and tuple answers
      value: Verify list-like answers by parsing Python or JSON list/tuple literals and scoring item-level equality
python_list_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: python_list
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/python_list/data/example.jsonl
