[project]
name = "gym-resources-servers-toolsandbox"
version = "0.0.0"
requires-python = ">=3.13.14"
dependencies = [
    "nemo-gym[dev]",
    "attrs>=23.2.0",
    "polars-lts-cpu>=1.0.0",
    "numpy>=1.26.0",
    "networkx>=3.0",
    "rouge-score>=0.1.2",
    "rapidfuzz>=3.0.0",
    "dill>=0.3.7",
    "StrEnum>=0.4.15",
    "tqdm>=4.66.0",
    "tenacity>=9.1.4",
    "requests>=2.31.0",
    "phonenumbers>=8.13.0",
    "geopy>=2.4.0",
    "holidays>=0.40",
    "pint>=0.23",
    "ccy>=1.4.0",
    "decorator>=5.1.0",
]

[tool.uv]
package = false
constraint-dependencies = [
    "grpcio>=1.81.0rc1",
    "msgpack>=1.2.1",
]
override-dependencies = [
    "spacy>=3.8.13",
    "wcwidth; sys_platform == 'never'",
    "opencv-python-headless; sys_platform == 'never'",
    "pynvvideocodec; sys_platform == 'never'",
    "torchcodec; sys_platform == 'never'",
    "torchvision; sys_platform == 'never'",
    "torchaudio; sys_platform == 'never'",
    "pycountry",
    "gprof2dot; sys_platform == 'never'",
    "pathspec; sys_platform == 'never'",
]
exclude-dependencies = [
    "fasttext-wheel",
    "alembic",
    "blinker",
    "cryptography",
    "flask",
    "flask-cors",
    "graphene",
    "graphql-core",
    "graphql-relay",
    "gunicorn",
    "huey",
    "prettytable",
    "skops",
    "sqlalchemy",
    "werkzeug",
    "waitress",
    "diskcache",
]

[tool.uv.sources]
"nemo-lens" = { git = "https://github.com/NVIDIA-NeMo/Lens.git", rev = "4d045c03186b90afdc815db46b671f6a21bc7e98" }
"nemo-gym" = { path = "../..", editable = true }

[project.optional-dependencies]
telemetry = ["nemo-gym[telemetry]"]

[tool.uv.workspace]
members = []
