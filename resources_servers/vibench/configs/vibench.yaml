# Resources server: owns the build sandbox and ViBench-backed grading.
vibench_resources_server:
  resources_servers:
    vibench:
      entrypoint: app.py
      domain: coding
      verified: false
      description: PRD-to-web-app benchmark; apps are graded by seeding and driving them in a browser.
      value: Eval whether a model can ship a working web app from a spec, judged through the running UI rather than the diff.

      # Absolute path to a ViBench checkout. Grading shells into
      # _harness/runner/scripts/run-seed-then-evaluate.py inside it.
      vibench_repo_root: ${oc.env:VIBENCH_REPO_ROOT}

      # Image the coding agent builds in. Build it once from ViBench:
      #   docker build -f _harness/runner/docker/Dockerfile.base -t vibench-base:latest .
      # It must set WORKDIR to app_workdir so sandboxed agents land in the right place.
      build_image: ${oc.env:VIBENCH_BUILD_IMAGE,vibench-base:latest}
      app_workdir: /app

      # Supplies AGENT_SEEDING_LLM_* / AGENT_EVALUATION_LLM_* for the grader agents.
      # These are the verifier's models, deliberately not the policy model under test.
      vibench_env_file: ${oc.env:VIBENCH_ENV_FILE,null}

      evaluation_timeout_s: 5400
      # Each test plan stands up postgres + the app + playwright. Two at a time per rollout
      # is already heavy; raise only on a big host.
      max_concurrent_test_plans: 2
      keep_evaluation_artifacts: false

      sandbox_provider: docker
      sandbox_config:
        ttl_s: 14400
        ready_timeout_s: 600
        resources:
          cpu: 4
          memory_mib: 8192
          disk_gib: 20
        metadata:
          benchmark: vibench
          harness: opencode

# Agent pairing: reuse the sandboxed OpenCode harness, which connects to the
# sandbox_handle returned by our seed_session.
vibench_opencode_agent:
  responses_api_agents:
    opencode_sandboxed_agent:
      entrypoint: app.py
      num_workers: 4

      resources_server:
        type: resources_servers
        name: vibench_resources_server
      model_server:
        type: responses_api_models
        name: policy_model

      debug: false
      opencode_version: 1.17.11
      opencode_max_context_window: 262144
      remote_opencode_install_script_path: null
      remote_opencode_binary_path: null
      opencode_config:
        permission:
          "*": allow
          edit:
            "**": allow
          bash:
            "*": allow
            "*killall*": deny
            "*pkill*": deny
            "*rm -rf /": deny
            "*rm -rf /*": deny

      # The agent attaches to the resources server's sandbox, so these only cover the
      # fallback path where it has to create one itself.
      sandbox_provider: docker
      sandbox_config:
        ttl_s: 14400
        ready_timeout_s: 600
      sandbox_timeout: 5400.0

      datasets:
        - name: example
          type: example
          jsonl_fpath: resources_servers/vibench/data/example.jsonl
