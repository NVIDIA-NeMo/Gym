# Docker sandbox provider for ViBench. Load it as the second --config instead of
# nemo_gym/sandbox/providers/docker/configs/docker.yaml, whose 180s exec timeout kills long installs.
#
# OpenCode in the build sandbox must reach the policy model. A loopback model URL inside a bridged
# container is the container itself, so OpenCode would make zero LLM calls and the build would export
# an empty app. use_absolute_ip with absolute_ip_server_types gives only the model server the host's
# resolved address, which the default bridge can route to; every other server, including the one whose
# config endpoint returns the merged config and the resources server that holds the grader keys, stays
# on loopback. Do NOT use `network: host` instead: that puts model-written code on the host network
# namespace.
#
# EXPOSURE: the model server then listens on that host address, including the run's token-capture
# path (/ng-rollout/<id>), and takes a dummy API key. Only run this on a single-tenant host, or
# firewall the port. OpenSandbox sandboxes have their own address and need the same two settings.
use_absolute_ip: true
absolute_ip_server_types: [responses_api_models]

sandbox:
  default_metadata:
    sandbox-api: docker-cli
  docker:
    create:
      keepalive_shell: /bin/sh
      keepalive_cmd: "while :; do sleep 2147483647; done"
      start_timeout_s: 600
      use_init: true
      apply_resource_limits: true
      publish_host: 127.0.0.1
    exec:
      # ViBench builds a whole app in one exec; the stock 180s default kills long installs.
      default_timeout_s: 5400
      concurrency: 32
    probe:
      command: printf docker-sandbox-ready
      expected_stdout: docker-sandbox-ready
      timeout_s: 30
      deadline_s: 60
      stable_count: 1
