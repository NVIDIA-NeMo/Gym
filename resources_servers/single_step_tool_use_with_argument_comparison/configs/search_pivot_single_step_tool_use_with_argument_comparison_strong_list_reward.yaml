search_pivot_single_step_tool_use_with_argument_comparison_strong_list_reward_resources_server:
  resources_servers:
    single_step_tool_use_with_argument_comparison:
      entrypoint: app.py
      domain: agent
      tool_call_comparator_config:
        word_count_similarity_threshold: 0.5
        use_f1_for_list: true
        use_strong_list_reward: true
        list_f1_threshold: 0.8
        list_f1_min_precision: 1.0
        list_f1_min_recall: 1.0
        list_f1_max_actual_to_expected_ratio: 1.0
        list_f1_reject_duplicate_actual_values: true
        keep_quotes: true
      verified: false
      description: >-
        The model must output the next correct search or browse tool call.
        List-valued arguments receive reward only when the list match is
        strong, not merely partially overlapping.
      value: Improve agentic search capability while reducing list-F1 reward hacking.
search_pivot_single_step_tool_use_with_argument_comparison_strong_list_reward_agent:
  responses_api_agents:
    tool_simulation_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: search_pivot_single_step_tool_use_with_argument_comparison_strong_list_reward_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: train
        type: train
        jsonl_fpath: resources_servers/single_step_tool_use_with_argument_comparison/data/train.jsonl
        num_repeats: 1
        gitlab_identifier:
          dataset_name: single_step_tool_use_with_argument_comparison
          version: 0.0.1
          artifact_fpath: train.jsonl
        license: Apache 2.0
      - name: validation
        type: validation
        jsonl_fpath: resources_servers/single_step_tool_use_with_argument_comparison/data/validation.jsonl
        num_repeats: 1
        gitlab_identifier:
          dataset_name: single_step_tool_use_with_argument_comparison
          version: 0.0.1
          artifact_fpath: validation.jsonl
        license: Apache 2.0
      - name: example
        type: example
        jsonl_fpath: resources_servers/single_step_tool_use_with_argument_comparison/data/example.jsonl
        num_repeats: 1
