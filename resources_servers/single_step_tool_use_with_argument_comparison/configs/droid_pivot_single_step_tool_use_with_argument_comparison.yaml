droid_pivot_single_step_tool_use_with_argument_comparison_resources_server:
  resources_servers:
    single_step_tool_use_with_argument_comparison:
      allowed_agents: [simple_agent, tool_simulation_agent]
      entrypoint: app.py
      domain: agent
      tool_call_comparator_config:
        word_count_similarity_threshold: 0.0
      verified: false
      description: Droid agent pivot dataset; behavior cloning per step from successful Droid rollouts.
droid_pivot_single_step_tool_use_with_argument_comparison_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      # One model call; its tool calls go to the verifier unexecuted.
      execute_tools: false
      resources_server:
        type: resources_servers
        name: droid_pivot_single_step_tool_use_with_argument_comparison_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/single_step_tool_use_with_argument_comparison/data/example.jsonl
        num_repeats: 1

droid_pivot_single_step_tool_use_with_argument_comparison_environment_server:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: droid_pivot_single_step_tool_use_with_argument_comparison_resources_server
      agent_server:
        type: responses_api_agents
        name: droid_pivot_single_step_tool_use_with_argument_comparison_agent
      default_episode_timeout_seconds: 21600
      cleanup_timeout_seconds: 180
