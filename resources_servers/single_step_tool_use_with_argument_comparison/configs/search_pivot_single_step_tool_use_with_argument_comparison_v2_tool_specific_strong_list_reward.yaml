search_pivot_single_step_tool_use_with_argument_comparison_v2_strong_list_reward_resources_server:
  resources_servers:
    single_step_tool_use_with_argument_comparison:
      entrypoint: app.py
      domain: agent
      tool_call_comparator_config:
        word_count_similarity_threshold: 0.5
        use_f1_for_list: true
        use_strong_list_reward: true
        list_f1_threshold: 0.8
        list_f1_min_precision: 1.0
        list_f1_min_recall: 1.0
        list_f1_max_actual_to_expected_ratio: 1.0
        list_f1_reject_duplicate_actual_values: true
        keep_quotes: true
        argument_comparison_overrides:
          search:
            queries:
              word_count_similarity_threshold: 0.25
              word_count_min_precision: 0.5
              word_count_min_recall: 0.3
              word_count_max_actual_to_expected_ratio: 1.5
              word_count_max_unmatched_actual_words: 5
              keep_quotes: true
              coerce_actual_string_to_list: true
              coerce_actual_string_to_singleton_list: true
              validate_list_item_schema: true
              reject_empty_string_list_items: true
      verified: false
      description: >-
        The model must output the next correct search or browse tool call.
        List-valued arguments receive reward only when list-level strong
        guardrails pass. Search query elements use a softer lexical matcher
        with token precision/recall/length guardrails and safe
        JSON-list-string coercion; browse URL elements remain strict.
      value: Improve agentic search capability while reducing list-F1 reward hacking.
search_pivot_single_step_tool_use_with_argument_comparison_v2_strong_list_reward_agent:
  responses_api_agents:
    tool_simulation_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: search_pivot_single_step_tool_use_with_argument_comparison_v2_strong_list_reward_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: train
        type: train
        jsonl_fpath: resources_servers/single_step_tool_use_with_argument_comparison/data/train.jsonl
        num_repeats: 1
        gitlab_identifier:
          dataset_name: single_step_tool_use_with_argument_comparison
          version: 0.0.1
          artifact_fpath: train.jsonl
        license: Apache 2.0
      - name: validation
        type: validation
        jsonl_fpath: resources_servers/single_step_tool_use_with_argument_comparison/data/validation.jsonl
        num_repeats: 1
        gitlab_identifier:
          dataset_name: single_step_tool_use_with_argument_comparison
          version: 0.0.1
          artifact_fpath: validation.jsonl
        license: Apache 2.0
      - name: example
        type: example
        jsonl_fpath: resources_servers/single_step_tool_use_with_argument_comparison/data/example.jsonl
        num_repeats: 1
