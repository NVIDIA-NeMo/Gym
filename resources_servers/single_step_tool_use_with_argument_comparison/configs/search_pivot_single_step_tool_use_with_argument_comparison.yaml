search_pivot_single_step_tool_use_with_argument_comparison_resources_server:
  resources_servers:
    single_step_tool_use_with_argument_comparison:
      allowed_agents: [simple_agent, tool_simulation_agent]
      entrypoint: app.py
      domain: agent
      tool_call_comparator_config:
        word_count_similarity_threshold: 0.3
      verified: false
      description: The model must output the next correct call in a given trajectory involving search tools.
      value: Improve agentic search capability.
search_pivot_single_step_tool_use_with_argument_comparison_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      # One model call; its tool calls go to the verifier unexecuted.
      execute_tools: false
      resources_server:
        type: resources_servers
        name: search_pivot_single_step_tool_use_with_argument_comparison_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: train
        type: train
        jsonl_fpath: resources_servers/single_step_tool_use_with_argument_comparison/data/train.jsonl
        num_repeats: 1
        gitlab_identifier:
          dataset_name: single_step_tool_use_with_argument_comparison
          version: 0.0.1
          artifact_fpath: train.jsonl
        license: Apache 2.0
      - name: validation
        type: validation
        jsonl_fpath: resources_servers/single_step_tool_use_with_argument_comparison/data/validation.jsonl
        num_repeats: 1
        gitlab_identifier:
          dataset_name: single_step_tool_use_with_argument_comparison
          version: 0.0.1
          artifact_fpath: validation.jsonl
        license: Apache 2.0
      - name: example
        type: example
        jsonl_fpath: resources_servers/single_step_tool_use_with_argument_comparison/data/example.jsonl
        num_repeats: 1

search_pivot_single_step_tool_use_with_argument_comparison_environment_server:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: search_pivot_single_step_tool_use_with_argument_comparison_resources_server
      agent_server:
        type: responses_api_agents
        name: search_pivot_single_step_tool_use_with_argument_comparison_agent
      default_episode_timeout_seconds: 21600
      cleanup_timeout_seconds: 180
