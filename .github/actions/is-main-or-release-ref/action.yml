name: Check ref is main or a release branch
description: >-
  Checks whether the current ref is main or a release branch
  (rMAJOR.MINOR.PATCH), for gating alerts that shouldn't fire for
  workflow_dispatch runs against arbitrary feature branches.

outputs:
  allowed:
    description: "'true' if the ref is main or a release branch, 'false' otherwise"
    value: ${{ steps.check.outputs.allowed }}

runs:
  using: composite
  steps:
    - name: Check ref
      id: check
      shell: bash
      env:
        REF: ${{ github.ref_name }}
      run: |
        if [[ "$REF" == "main" || "$REF" =~ ^r[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "allowed=true" >> "$GITHUB_OUTPUT"
        else
          echo "allowed=false" >> "$GITHUB_OUTPUT"
          echo "Ref '$REF' is not main or a release branch; suppressing Slack alert."
        fi
