name: Unmount Gym test data
description: Release the job's read-only S3 mount
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        root="${RUNNER_TEMP}/gym-test-data"
        if mountpoint -q "$root"; then
          fusermount -u "$root"
        fi
