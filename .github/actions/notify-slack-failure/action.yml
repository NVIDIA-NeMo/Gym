name: Notify Slack on failure
description: Posts a failure alert to the Gym alerts Slack channel via incoming webhook

inputs:
  webhook-url:
    description: Slack incoming webhook URL
    required: true
  message:
    description: Markdown (mrkdwn) message body to post
    required: true

runs:
  using: composite
  steps:
    - name: Send Slack notification
      shell: bash -e -u -o pipefail {0}
      env:
        SLACK_WEBHOOK: ${{ inputs.webhook-url }}
        MESSAGE_TEXT: ${{ inputs.message }}
      run: |
        if [ -z "$SLACK_WEBHOOK" ]; then
          echo "::error::Slack webhook is not set"
          exit 1
        fi

        MESSAGE=$(jq -n --arg text "$MESSAGE_TEXT" '{blocks: [{type: "section", text: {type: "mrkdwn", text: $text}}]}')
        curl -f -X POST -H "Content-type: application/json" --data "$MESSAGE" "$SLACK_WEBHOOK"
