name: Find commits since last run
description: >-
  Lists commits on the current ref since the last completed run of the
  given workflow. Never fails: if the previous run is still in progress,
  or lookup fails for any reason, the commits-line output is simply empty.

inputs:
  workflow-file:
    description: Workflow file name (e.g. cicd-main.yml) whose prior runs to look up
    required: true
  github-token:
    description: Token used to query the GitHub API
    required: true

outputs:
  commits-line:
    description: Newline-separated "`sha` subject" lines, or empty
    value: ${{ steps.find.outputs.commits_line }}

runs:
  using: composite
  steps:
    - name: Find commits since last run
      id: find
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        WORKFLOW_FILE: ${{ inputs.workflow-file }}
        CURRENT_RUN_ID: ${{ github.run_id }}
        CUR_SHA: ${{ github.sha }}
      run: |
        set +e
        COMMITS_LINE=""

        # Query with an explicit event= filter (server-side) rather than
        # fetching an unfiltered page of recent runs and filtering
        # client-side - this workflow file may also trigger on push/PR
        # events far more often than the schedule fires, which would
        # otherwise push the actual last schedule/workflow_dispatch run out
        # of a small unfiltered page.
        fetch_latest_run() {
          local event="$1"
          local result
          result=$(gh api "repos/$REPO/actions/workflows/$WORKFLOW_FILE/runs?event=$event&per_page=5" 2>/dev/null | \
            jq -c --argjson cur "$CURRENT_RUN_ID" \
              '[.workflow_runs[]? | select(.id != $cur)] | sort_by(.created_at) | reverse | .[0]' 2>/dev/null)
          [[ -z "$result" ]] && result="null"
          echo "$result"
        }

        SCHEDULE_RUN=$(fetch_latest_run schedule)
        DISPATCH_RUN=$(fetch_latest_run workflow_dispatch)

        PREV_RUN_JSON=$(jq -cn --argjson a "$SCHEDULE_RUN" --argjson b "$DISPATCH_RUN" \
          '[$a, $b] | map(select(. != null)) | sort_by(.created_at) | reverse | .[0] // null' 2>/dev/null)
        [[ -z "$PREV_RUN_JSON" ]] && PREV_RUN_JSON="null"

        if [[ -z "$PREV_RUN_JSON" || "$PREV_RUN_JSON" == "null" ]]; then
          echo "No previous scheduled/workflow_dispatch run found; skipping commit list."
        else
          PREV_STATUS=$(echo "$PREV_RUN_JSON" | jq -r '.status' 2>/dev/null)
          if [[ "$PREV_STATUS" != "completed" ]]; then
            echo "Previous run is still '$PREV_STATUS'; skipping commit list."
          else
            PREV_SHA=$(echo "$PREV_RUN_JSON" | jq -r '.head_sha' 2>/dev/null)
            if [[ -z "$PREV_SHA" || "$PREV_SHA" == "null" || "$PREV_SHA" == "$CUR_SHA" ]]; then
              echo "No new commits since the previous run."
            else
              COMMITS_LINE=$(gh api "repos/$REPO/compare/$PREV_SHA...$CUR_SHA" --jq \
                '[.commits[]? | "`" + .sha[0:7] + "` " + (.commit.message | split("\n")[0])] | join("\n")' 2>/dev/null)
            fi
          fi
        fi

        {
          echo "commits_line<<COMMITS_EOF"
          echo "$COMMITS_LINE"
          echo "COMMITS_EOF"
        } >> "$GITHUB_OUTPUT"
        exit 0
