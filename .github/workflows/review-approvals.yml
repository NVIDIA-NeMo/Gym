name: Package approvals

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
    inputs:
      number:
        description: Pull request to reevaluate
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'pull_request_review' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: package-approvals-${{ github.event.pull_request.number || inputs.number || 'refresh' }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - id: token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.BOT_ID }}
          private-key: ${{ secrets.BOT_KEY }}
          owner: ${{ github.repository_owner }}
          permission-members: read
          permission-pull-requests: read
          permission-statuses: write
      - env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          NUMBER: ${{ github.event.pull_request.number || inputs.number }}
        run: |
          if [[ -n "$NUMBER" ]]; then
            printf '%s\n' "$NUMBER" > "$RUNNER_TEMP/requests"
          else
            gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 \
              --json number,isDraft,isCrossRepository \
              --jq '.[] | select(.isDraft == false and .isCrossRepository) | .number' > "$RUNNER_TEMP/requests"
          fi
          result=0
          while read -r number; do
            if ! bash scripts/ci/check-review-approvals.sh github "$number"; then result=1; fi
          done < "$RUNNER_TEMP/requests"
          exit "$result"
