name: Validate CODEOWNERS Suggestions

# Two fast, per-PR checks on .github/CODEOWNERS: runs the shared matcher's
# own unit tests, and warns (non-blocking) on redundant CODEOWNERS rules.
# Org-membership validation (every user/team referenced, both enforced and
# `# suggest:` lines) runs separately, on a schedule — see
# validate-codeowners-membership.yml.
#
# Implementation lives in NVIDIA-NeMo/FW-CI-templates so any NeMo repo with a
# CODEOWNERS file can reuse it the same way. See that repo's
# .github/workflows/_validate_codeowners_suggestions.yml and .github/scripts/
# codeowners-suggestions.js (+ its unit tests) for the matching logic.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  validate-codeowners-suggestions:
    # TODO: pin to a released tag once NVIDIA-NeMo/FW-CI-templates#556 merges.
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_validate_codeowners_suggestions.yml@3a1034a1c493cc178e9e12efd423377c502cd561
    with:
      workflow_ref: 3a1034a1c493cc178e9e12efd423377c502cd561
