name: NOOA agent E2E

on:
  pull_request:
    paths:
      - ".github/workflows/nooa-agent-e2e.yml"
      - "responses_api_agents/nooa_agent/**"
      - "resources_servers/nooa_capability/**"
      - "tests/e2e/nooa_calculate_e2e*"
      - "tests/e2e/deterministic_nooa_responses_server.py"
      - "tests/e2e/verify_nooa_calculate_rollout.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/nooa-agent-e2e.yml"
      - "responses_api_agents/nooa_agent/**"
      - "resources_servers/nooa_capability/**"
      - "tests/e2e/nooa_calculate_e2e*"
      - "tests/e2e/deterministic_nooa_responses_server.py"
      - "tests/e2e/verify_nooa_calculate_rollout.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nooa-agent-e2e:
    name: NOOA calculate process E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive

      - name: Reclaim runner disk
        run: ./scripts/ci/reclaim_runner_disk.sh

      - name: Cache uv dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', 'responses_api_agents/nooa_agent/requirements.txt') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Run hermetic NOOA process E2E
        run: |
          source ./scripts/ci/setup_dev.sh
          bash tests/e2e/nooa_calculate_e2e_test.sh

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nooa-agent-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nemo-gym-nooa-e2e/results
          if-no-files-found: warn
          retention-days: 7
