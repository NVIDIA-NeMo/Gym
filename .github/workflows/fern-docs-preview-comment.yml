name: "Preview Fern Docs: Comment"

on:
  workflow_run:
    workflows: ["Preview Fern Docs: Build"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Keep fork validation in the token-free pull_request workflow.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      - name: Checkout trusted preview tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: trusted-source
          persist-credentials: false

      - name: Verify originating run and PR
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/fern-run.json"
          PR_NUMBER=$(jq -er '.pull_requests | select(length == 1) | .[0].number | select(type == "number" and . > 0 and . == floor)' "$RUNNER_TEMP/fern-run.json")
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/fern-pr.json"

      - name: Download docs and metadata from the originating run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: fern-preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: incoming

      - name: Validate metadata and stage preview content
        id: metadata
        run: |
          python3 trusted-source/.github/scripts/fern_preview.py stage \
            --artifact incoming --trusted trusted-source --destination "$RUNNER_TEMP/fern-preview" \
            --run "$RUNNER_TEMP/fern-run.json" --pr "$RUNNER_TEMP/fern-pr.json"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Install fixed Fern CLI outside the artifact
        working-directory: ${{ runner.temp }}
        run: npm install --prefix "$RUNNER_TEMP/fern-cli" --ignore-scripts --no-audit --no-fund fern-api@5.50.4

      - name: Generate library reference with trusted configuration
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
        working-directory: ${{ runner.temp }}/fern-preview/fern
        run: '"$RUNNER_TEMP/fern-cli/node_modules/.bin/fern" docs md generate'

      - name: Generate preview
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
          PREVIEW_ID: ${{ steps.metadata.outputs.preview_id }}
        working-directory: ${{ runner.temp }}/fern-preview/fern
        run: |
          "$RUNNER_TEMP/fern-cli/node_modules/.bin/fern" generate --docs --preview --id "$PREVIEW_ID" > "$RUNNER_TEMP/fern-preview.log" 2>&1

      - name: Read preview URL without credentials
        id: preview
        run: |
          python3 trusted-source/.github/scripts/fern_preview.py url --log "$RUNNER_TEMP/fern-preview.log"

      - name: Post or update preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.metadata.outputs.pr_number }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          set -euo pipefail
          # Recheck the head before commenting; a newer PR revision needs its own preview.
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/fern-current-pr.json"
          jq -e --slurpfile run "$RUNNER_TEMP/fern-run.json" '.state == "open" and .head.sha == $run[0].head_sha' "$RUNNER_TEMP/fern-current-pr.json" > /dev/null
          BODY=$(printf ':herb: **Preview your docs:** <%s>\n\n<!-- preview-docs -->' "$PREVIEW_URL")
          COMMENT_ID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- preview-docs -->"))) | .id' | head -1)
          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" -X PATCH -f body="$BODY"
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$BODY"
          fi
