name: Community Bot

on:
  issues:
    types: [opened, edited, reopened, closed]
  issue_comment:
    types: [created, edited, deleted]

jobs:
  community-bot:
    permissions:
      issues: write
      pull-requests: write
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_community_label.yml@f47f58bcf571d7dee8678e0fc5f6eec7800dadd4
    secrets:
      NVIDIA_MANAGEMENT_ORG_PAT: ${{ secrets.NVIDIA_MANAGEMENT_ORG_PAT }}
