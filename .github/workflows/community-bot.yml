name: Community Bot

on:
  issues:
    types: [opened, edited, reopened, closed]
  issue_comment:
    types: [created, edited, deleted]

jobs:
  community-bot:
    permissions:
      issues: write
      pull-requests: write
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_community_label.yml@0472fc397f9d6de36d928cae2aa270d91eb2c71d
    secrets:
      NVIDIA_MANAGEMENT_ORG_PAT: ${{ secrets.NVIDIA_MANAGEMENT_ORG_PAT }}
