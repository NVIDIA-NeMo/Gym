# TEMPORARY test of FW-CI-templates cherry-pick Slack mention. Do not merge to main.
name: tmp slack ping test
on:
  push:
    branches: [tmp-slack-ping-test-base]
jobs:
  cherry-pick:
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_cherry_pick.yml@slack-ping-cherry-pick-author
    with:
      target-branch: tmp-slack-ping-test-release
      trigger-label: tmp-cp-test
      notify-mention: "<@U0ADCAVAH08>"
    secrets:
      PAT: ${{ secrets.PAT }}
      SLACK_WEBHOOK_ADMIN: ${{ secrets.SLACK_WEBHOOK_ADMIN }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_TEAM_CHANNEL_WEBHOOK }}
      NVIDIA_MANAGEMENT_ORG_PAT: ${{ secrets.NVIDIA_MANAGEMENT_ORG_PAT }}
      NEMO_FW_ALERT_MANAGER_SLACK_BOT_TOKEN: ${{ secrets.NEMO_FW_ALERT_MANAGER_SLACK_BOT_TOKEN }}
