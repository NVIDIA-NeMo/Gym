name: "Build, validate, and release NeMo-Gym"

on:
  push:
    branches:
      - main
      - "r**"
      - "pull-request/**"
      - "deploy-release/*"
  workflow_dispatch:
    inputs:
      release-ref:
        description: Commit SHA to release (must be a full 40-char SHA, not a branch name)
        required: true
        type: string
      dry-run:
        description: Compute the release but do not publish wheel, GH release, or docs.
        required: true
        default: true
        type: boolean
      create-gh-release:
        description: Create a GitHub release
        required: true
        default: true
        type: boolean
      version-bump-branch:
        description: Branch for version bump
        required: true
        type: string
      gh-release-from-tag:
        description: Tag of previous release for changelog builder
        required: false
        type: string
        default: ""

defaults:
  run:
    shell: bash -x -e -u -o pipefail {0}

permissions:
  id-token: write
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  pre-flight:
    if: github.event_name != 'workflow_dispatch'
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_cicd_preflight.yml@037094bcc9138c72bc125418e6e3653f9e1c4160 # v1.11.0
    with:
      workflow_ref: 037094bcc9138c72bc125418e6e3653f9e1c4160 # pragma: allowlist secret

  previous-tag:
    if: ${{ !inputs.gh-release-from-tag }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.find.outputs.tag }}
    steps:
      - name: Checkout release ref
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release-ref }}
          sparse-checkout: nemo_gym/package_info.py
          persist-credentials: false

      - name: Find previous release tag
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          TAGS=$(gh api --paginate "repos/${{ github.repository }}/tags" --jq '.[].name' \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V)

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            PKG=nemo_gym/package_info.py
            MAJOR=$(awk -F'= ' '/^MAJOR = /{print $2}' "$PKG")
            MINOR=$(awk -F'= ' '/^MINOR = /{print $2}' "$PKG")
            PATCH=$(awk -F'= ' '/^PATCH = /{print $2}' "$PKG")
            TARGET="v${MAJOR}.${MINOR}.${PATCH}"
            TAG=$(printf '%s\n%s\n' "$TAGS" "$TARGET" | sed '/^$/d' | sort -V -u \
              | awk -v t="$TARGET" '$0 == t {print p; exit} {p = $0}')
            echo "Release target: $TARGET"
          else
            TAG=$(printf '%s\n' "$TAGS" | tail -n1)
          fi

          echo "Previous release tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  release:
    needs: [pre-flight, previous-tag]
    if: |
      !cancelled() && !failure()
      && !(needs.pre-flight.outputs.docs_only == 'true'
           || needs.pre-flight.outputs.is_deployment_workflow == 'true')
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_release_library.yml@1ea89871720f31b9cacfd40655ad5151edd8be6f
    with:
      release-ref: ${{ inputs.release-ref || github.sha }}
      python-package: nemo_gym
      library-name: NeMo-Gym
      validate-only: ${{ github.event_name != 'workflow_dispatch' }}
      dry-run: ${{ inputs.dry-run || false }}
      version-bump-branch: ${{ inputs.version-bump-branch || github.ref_name }}
      create-gh-release: ${{ inputs.create-gh-release || true }}
      packaging: uv
      skip-test-wheel: true
      wheel-content-ignore: "W002,W004,W009"
      app-id: ${{ vars.BOT_ID }}
      publish-docs: false
      run-on-version-tag-only: ${{ github.ref_name != 'main' }}
      gh-release-use-changelog-builder: true
      gh-release-from-tag: ${{ inputs.gh-release-from-tag || needs.previous-tag.outputs.tag }}
      restrict-to-admins: true
    secrets: inherit  # pragma: allowlist secret

  release-summary:
    needs: [pre-flight, release]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FAILED_JOBS=$(gh run view $GITHUB_RUN_ID --repo ${{ github.repository }} --json jobs --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "action_required")] | length')

          if [ "${FAILED_JOBS:-0}" -eq 0 ]; then
              echo "✅ All previous jobs completed successfully"
              exit 0
          else
              echo "❌ Found $FAILED_JOBS failed job(s)"
              gh run view $GITHUB_RUN_ID --repo ${{ github.repository }} --json jobs --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "action_required") | .name'
              exit 1
          fi
