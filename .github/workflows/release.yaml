name: "Build, validate, and release NeMo-Gym"

on:
  push:
    branches:
      - main
      - "r**"
      - "pull-request/**"
      - "deploy-release/*"
  workflow_dispatch:
    inputs:
      release-ref:
        description: Ref (SHA or branch name) to release
        required: true
        type: string
      dry-run:
        description: Compute the release but do not publish wheel, GH release, or docs.
        required: true
        default: true
        type: boolean
      create-gh-release:
        description: Create a GitHub release
        required: true
        default: true
        type: boolean
      generate-changelog:
        description: Generate changelog
        required: false
        default: true
        type: boolean
      version-bump-branch:
        description: Branch for version bump
        required: true
        type: string
      gh-release-from-tag:
        description: Tag of previous release for changelog builder
        required: false
        type: string
        default: ""

defaults:
  run:
    shell: bash -x -e -u -o pipefail {0}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  pre-flight:
    if: github.event_name == 'push'
    permissions:
      contents: read
      pull-requests: read
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_cicd_preflight.yml@7c09a9e67a5cd4f2e73803114195d6705738d6c1

  bump:
    needs: pre-flight
    if: needs.pre-flight.outputs.docs_only != 'true' && needs.pre-flight.outputs.is_deployment_workflow != 'true'
    permissions:
      contents: read
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_release_bump.yml@7c09a9e67a5cd4f2e73803114195d6705738d6c1
    with:
      release-ref: ${{ github.sha }}
      python-package: nemo_gym
      library-name: NeMo-Gym
      validate-only: true
      release-environment: gym-release
      packaging: uv

  build-wheel:
    needs: bump
    permissions:
      contents: read
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_build_test_wheel.yml@7c09a9e67a5cd4f2e73803114195d6705738d6c1
    with:
      ref: ${{ github.sha }}
      python-package: nemo_gym
      packaging: uv
      skip-test-wheel: true
      wheel-content-ignore: W002,W004,W009

  finalize:
    needs: [bump, build-wheel]
    permissions:
      contents: read
      pull-requests: read
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_release_finalize.yml@7c09a9e67a5cd4f2e73803114195d6705738d6c1
    with:
      release-ref: ${{ github.sha }}
      release-version: ${{ needs.bump.outputs.release-version }}
      library-name: NeMo-Gym
      pypi-name: ${{ needs.build-wheel.outputs.pypi-name }}
      validate-only: true
      release-environment: gym-release
      publish-docs: false

  release-summary:
    needs: [pre-flight, bump, build-wheel, finalize]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check release validation
        env:
          EVENT: ${{ github.event_name }}
          RESULTS: ${{ toJSON(needs) }}
          SKIP_BUILD: ${{ needs.pre-flight.outputs.docs_only == 'true' || needs.pre-flight.outputs.is_deployment_workflow == 'true' }}
        run: |
          if [[ "$EVENT" == workflow_dispatch ]]; then
            echo "::error::Select main under 'Use workflow from' and enter the protected release branch as the version bump target."
            exit 1
          fi
          jq -e --argjson skip "$SKIP_BUILD" '
            .["pre-flight"].result == "success" and
            ([.bump, .["build-wheel"], .finalize] | all(.[]; .result == (if $skip then "skipped" else "success" end)))
          ' <<< "$RESULTS"
