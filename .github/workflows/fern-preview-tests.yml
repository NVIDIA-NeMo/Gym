name: Fern preview contract
on:
  pull_request:
    paths:
      - '.github/scripts/*fern_preview*'
      - '.github/workflows/fern*'
      - '.github/docs/fern-preview.md'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/scripts -p 'test_fern_preview.py'
