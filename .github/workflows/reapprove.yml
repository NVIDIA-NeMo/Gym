# Setup: REAPPROVE_API_KEY secret, REAPPROVE_MODEL variable, and optionally
# REAPPROVE_API_URL (OpenAI-compatible chat-completions URL). Enable Actions'
# "Allow GitHub Actions to create and approve pull requests" repository setting.
name: Reapprove conflict resolutions

on:
  issue_comment:
    types: [created]

permissions: {}

# Serialize across PRs: two commands may include overlapping stacks.
concurrency:
  group: conflict-reapproval
  cancel-in-progress: false

jobs:
  reapprove:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (github.event.comment.body == '/review-reapprove' ||
       github.event.comment.body == '/review-reapprove scope=stack')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      # issue_comment's SHA belongs to the default branch. Never run PR code.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Assess and reapprove
        # gh and git are preinstalled on the hosted Ubuntu runner.
        env:
          GH_TOKEN: ${{ github.token }}
          REAPPROVE_API_KEY: ${{ secrets.REAPPROVE_API_KEY }}
          REAPPROVE_API_URL: ${{ vars.REAPPROVE_API_URL }}
          REAPPROVE_MODEL: ${{ vars.REAPPROVE_MODEL }}
        run: python scripts/ci/reapprove.py
