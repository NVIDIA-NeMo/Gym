name: Harbor task format drift

# Scheduled (not per-PR, not part of cicd-main.yml): compares Harbor's task format on its default branch with the
# snapshot Gym's task.toml mirror is tested against
# (tests/unit_tests/data/tasks/harbor/fixtures/harbor_task_format.json). A change in Harbor is not the fault of a
# Gym pull request, so this never gates one. It fails when Harbor's format moved, or when Gym's mirror does not read
# one of Harbor's example tasks, and stays red until the snapshot is refreshed
# (scripts/harbor_task_format_snapshot.py) and the mirror follows.

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      send_notification:
        description: Send a Slack notification to the Gym alerts channel on failure
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harbor-task-format:
    name: Compare with Harbor's default branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The job imports Harbor's task model from its default branch, so neither checkout leaves a token on disk.
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Checkout Harbor
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: harbor-framework/harbor
          path: harbor-upstream
          persist-credentials: false
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/0.13.8/install.sh | sh
      - name: Compare Harbor's task format with the snapshot
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run --locked --managed-python python scripts/harbor_task_format_snapshot.py harbor-upstream --check

  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [harbor-task-format]
    environment: main
    permissions: {}
    if: >-
      ${{
        always() && !cancelled() && failure() &&
        (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
        (github.event_name != 'workflow_dispatch' || inputs.send_notification)
      }}
    steps:
      # Dispatches on feature branches must not alert the shared channel.
      - name: Check ref is main or a release branch
        id: ref_check
        shell: bash
        env:
          REF: ${{ github.ref_name }}
        run: |
          if [[ "$REF" == "main" || "$REF" =~ ^r[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Notify Gym alerts channel
        if: steps.ref_check.outputs.allowed == 'true'
        uses: NVIDIA-NeMo/FW-CI-templates/.github/actions/notify-ci-failure@7c09a9e67a5cd4f2e73803114195d6705738d6c1
        with:
          needs-json: ${{ toJSON(needs) }}
          webhook: ${{ secrets.SLACK_TEAM_CHANNEL_WEBHOOK }}
