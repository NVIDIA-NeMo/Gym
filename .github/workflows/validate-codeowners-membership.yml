name: Validate CODEOWNERS Membership

# Scheduled (not per-PR, not part of cicd-main.yml) check: every user/team
# referenced in .github/CODEOWNERS — enforced and `# suggest:` lines alike,
# teams expanded to their full current membership — must be a current
# NVIDIA-NeMo org member. Alerts Slack on failure, since a scheduled run has
# no PR author around to notice a red X on its own.
#
# Deliberately kept independent of cicd-main.yml rather than added as a job
# there: this is a CODEOWNERS/org-membership hygiene check, unrelated to
# whether the code/build/tests are healthy. Folding it into
# Nemo_CICD_Test's gate would mean a departed org member turns the *entire*
# nightly CICD run red — the same signal as "the build broke" — which
# conflates two unrelated failure categories and would mislead anyone
# glancing at CI status. Kept as its own file so it has its own run
# history, its own schedule, and never affects cicd-main.yml's status.
#
# Implementation lives in NVIDIA-NeMo/FW-CI-templates. See that repo's
# .github/workflows/_validate_codeowners_membership.yml.

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-codeowners-membership:
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_validate_codeowners_membership.yml@5c4f67f882e3ce38f5b3ebd3df5114b4b042da8c
    with:
      workflow_ref: 5c4f67f882e3ce38f5b3ebd3df5114b4b042da8c  # pragma: allowlist secret
      membership_app_id: ${{ vars.GYM_PR_APP_ID }}
    secrets:
      ROSTER_TOKEN: ${{ secrets.NVIDIA_MANAGEMENT_ORG_PAT }}
      MEMBERSHIP_APP_PRIVATE_KEY: ${{ secrets.GYM_PR_APP_PRIVATE_KEY }}
      SLACK_TEAM_CHANNEL_WEBHOOK: ${{ secrets.SLACK_TEAM_CHANNEL_WEBHOOK }}
