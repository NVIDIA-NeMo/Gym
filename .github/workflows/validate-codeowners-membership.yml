name: Validate CODEOWNERS Membership

# Scheduled (not per-PR) check: every user/team referenced in
# .github/CODEOWNERS — enforced and `# suggest:` lines alike, teams expanded
# to their full current membership — must be a current NVIDIA-NeMo org
# member. Kept off the per-PR path deliberately: a departed member makes
# suggest-reviewers.yml's reviewer-request call fail atomically for the
# whole suggestion batch wherever they'd be suggested, so catching this
# promptly and independently — not only on whichever PR happens to touch a
# CODEOWNERS-covered path first — matters more than catching it live on one
# PR. Alerts Slack on failure, since a scheduled run has no PR author around
# to notice a red X on its own.
#
# Implementation lives in NVIDIA-NeMo/FW-CI-templates. See that repo's
# .github/workflows/_validate_codeowners_membership.yml.

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-codeowners-membership:
    # TODO: pin to a released tag once NVIDIA-NeMo/FW-CI-templates#556 merges.
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_validate_codeowners_membership.yml@3a1034a1c493cc178e9e12efd423377c502cd561
    with:
      workflow_ref: 3a1034a1c493cc178e9e12efd423377c502cd561
    secrets:
      NVIDIA_MANAGEMENT_ORG_PAT: ${{ secrets.NVIDIA_MANAGEMENT_ORG_PAT }}
      SLACK_TEAM_CHANNEL_WEBHOOK: ${{ secrets.SLACK_TEAM_CHANNEL_WEBHOOK }}
