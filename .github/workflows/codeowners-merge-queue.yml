# The `Autobot codeowners` check is published on the pull request's own commit, so a merge queue run
# (which has no pull request head) would wait for it forever. A pull request can only join the queue
# after its required checks pass, so the check was already green; this job reports the same name on
# the merge group commit and nothing more.

name: Autobot codeowners (merge queue)

on:
  merge_group:
    types: [checks_requested]

permissions: {}

jobs:
  codeowners:
    name: Autobot codeowners # must equal the required check's name
    runs-on: ubuntu-latest
    steps:
      - run: echo "Owners were checked when the pull request joined the queue"
