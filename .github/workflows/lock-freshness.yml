name: Lock freshness advisory

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
    paths:
      - '**/pyproject.toml'
      - '**/uv.lock'
      - '**/uv.toml'
      - '**/setup.py'
      - '**/setup.cfg'
      - '**/.python-version'
      - 'scripts/component*'
      - 'scripts/lock_freshness.py'
      - '.github/workflows/lock-freshness.yml'
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: lock-freshness-${{ github.event.pull_request.number || 'all' }}
  cancel-in-progress: true

jobs:
  advisory:
    name: Refresh advisory statuses
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout trusted base branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Refresh optional lock-freshness status
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          args=(--repo "$GH_REPO")
          if [[ -n "$PR_NUMBER" ]]; then
            args+=(--pr "$PR_NUMBER")
          fi
          python scripts/lock_freshness.py "${args[@]}"
