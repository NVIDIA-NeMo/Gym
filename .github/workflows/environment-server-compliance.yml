name: Environment Server compliance

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: Exact revision selected by the caller; empty keeps the event default
        type: string
        required: false
        default: ""
      base-ref:
        description: Base ref for the full PR diff; empty checks all components
        type: string
        default: ""

env:
  # Check publication targets the event head; evidence identifies the checked-out tree.
  TESTED_SHA: ${{ inputs.checkout-ref || github.sha }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.select.outputs.components }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.checkout-ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select changed components
        id: select
        env:
          BASE_REF: ${{ inputs.base-ref }}
          # A push to main passes the commit before the push, which is compared directly.
          COMPARE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'commit' || 'branch' }}
          FORCE_ALL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "$FORCE_ALL" == 'true' ]]; then BASE_REF=''; fi
          python3 -m scripts.environment_server_compliance.ci select --base "$BASE_REF" --compare "$COMPARE"
      - name: Report selection failure
        if: failure()
        run: echo '::warning::Environment Server compliance could not select changed components; see the selection log.'

  check:
    name: ${{ matrix.component }} compliance
    needs: select
    if: needs.select.outputs.components != '' && needs.select.outputs.components != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.select.outputs.components) }}
    env:
      COMPONENT: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.checkout-ref }}
          submodules: recursive
          persist-credentials: false
      - name: Install Gym
        timeout-minutes: 10
        run: |
          source scripts/ci/setup_dev.sh
          # Gym's component install runs uv in the next step.
          dirname "$(command -v uv)" >> "$GITHUB_PATH"
      - name: Check the component
        timeout-minutes: 15
        run: .venv/bin/python -m scripts.environment_server_compliance.ci check "$COMPONENT"
