name: Retry full test suite infrastructure failures

on:
  workflow_run:
    workflows: ["Full test suite"]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: retry-full-test-suite-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry-failed-jobs:
    name: Retry failed jobs
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      REPOSITORY: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Classify failure and retry failed jobs
        run: |
          set -euo pipefail
          gh api \
            "repos/${REPOSITORY}/contents/scripts/ci/is_retryable_full_suite_failure.sh?ref=${HEAD_SHA}" \
            --jq .content | tr -d '\n' | base64 --decode > /tmp/is-retryable.sh
          chmod +x /tmp/is-retryable.sh

          mapfile -t failed_job_ids < <(
            gh api --paginate \
              "repos/${REPOSITORY}/actions/runs/${RUN_ID}/attempts/1/jobs?per_page=100" \
              --jq '.jobs[] | select(.conclusion == "failure" and .name != "Server suite") | .id'
          )
          ((${#failed_job_ids[@]} > 0))

          retryable=true
          for job_id in "${failed_job_ids[@]}"; do
            gh run view "${RUN_ID}" --repo "${REPOSITORY}" --job "${job_id}" --log \
              > "/tmp/failed-job-${job_id}.log"
            if ! /tmp/is-retryable.sh "/tmp/failed-job-${job_id}.log"; then
              retryable=false
            fi
          done

          if [[ "${retryable}" != true ]]; then
            echo "At least one failed job was deterministic; not retrying the run."
            exit 0
          fi

          gh api --method POST "repos/${REPOSITORY}/actions/runs/${RUN_ID}/rerun-failed-jobs"
