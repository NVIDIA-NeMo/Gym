name: Guardwords check

on:
  push:
    branches:
      - "pull-request/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  pr_info:
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ fromJSON(steps.pr.outputs.pr-info).base.sha }}
      head_sha: ${{ github.sha }}
      pr_number: ${{ fromJSON(steps.pr.outputs.pr-info).number }}
    steps:
      - name: Check out Gym mirror
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get pull request details
        id: pr
        uses: nv-gha-runners/get-pr-info@090577647b8ddc4e06e809e264f7881650ecdccf # main

      - name: Verify mirror commit
        env:
          PR_HEAD_SHA: ${{ fromJSON(steps.pr.outputs.pr-info).head.sha }}
        run: test "$PR_HEAD_SHA" = "$GITHUB_SHA"

  guardwords-check:
    needs: pr_info
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_guardwords_check.yml@7dd05d1e00c28bde40d5f90cd0b494e57bf52ce0 # v1.15.1
    with:
      bot-app-id: ${{ vars.BOT_ID }}
      base-sha: ${{ needs.pr_info.outputs.base_sha }}
      head-sha: ${{ needs.pr_info.outputs.head_sha }}
      pr-number: ${{ fromJSON(needs.pr_info.outputs.pr_number) }}
    secrets:
      BOT_KEY: ${{ secrets.BOT_KEY }}
