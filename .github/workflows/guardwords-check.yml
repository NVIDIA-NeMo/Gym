name: Guardwords check

# Runs on copy-pr-bot's approved mirror branch, including PRs from forks.
on:
  push:
    branches:
      - "pull-request/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  pr_info:
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ fromJSON(steps.pr.outputs.pr-info).base.sha }}
      head_sha: ${{ github.sha }}
    steps:
      - name: Check out Gym mirror
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get pull request details
        id: pr
        uses: nv-gha-runners/get-pr-info@090577647b8ddc4e06e809e264f7881650ecdccf # main

      - name: Verify mirror commit
        env:
          PR_INFO: ${{ steps.pr.outputs.pr-info }}
        run: jq -e --arg sha "$GITHUB_SHA" '.head.sha == $sha' <<< "$PR_INFO" >/dev/null

  guardwords-check:
    needs: pr_info
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_guardwords_check.yml@422e1ff80cc916ed4135eef123cad2e5bee1ad4f # FW-CI-templates PR #599
    with:
      bot-app-id: ${{ vars.BOT_ID }}
      base-sha: ${{ needs.pr_info.outputs.base_sha }}
      head-sha: ${{ needs.pr_info.outputs.head_sha }}
    secrets:
      BOT_KEY: ${{ secrets.BOT_KEY }}
