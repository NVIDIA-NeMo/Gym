name: Harness conformance

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: Exact revision selected by the caller; empty keeps the event default
        type: string
        required: false
        default: ""
      base-ref:
        description: Base ref for the full PR diff; empty runs all registered harnesses
        type: string
        default: ""

env:
  # Check publication targets the event head; evidence identifies the checked-out tree.
  TESTED_SHA: ${{ inputs.checkout-ref || github.sha }}

permissions:
  contents: read

defaults:
  run:
    # Explicit bash enables pipefail, so tee cannot hide installation/test failures.
    shell: bash

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      harnesses: ${{ steps.select.outputs.harnesses }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.checkout-ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select affected harnesses
        id: select
        env:
          BASE_REF: ${{ inputs.base-ref }}
          # A push to main passes the commit before the push, which is compared directly.
          COMPARE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'commit' || 'branch' }}
          FORCE_ALL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "$FORCE_ALL" == 'true' ]]; then BASE_REF=''; fi
          python3 -m scripts.harness_conformance.ci select --base "$BASE_REF" --compare "$COMPARE"
      - name: Report selection failure
        if: failure()
        run: echo '::warning::Harness conformance could not select affected harnesses; see the selection log.'

  probe:
    name: ${{ matrix.harness }} conformance probes
    needs: select
    if: needs.select.outputs.harnesses != '' && needs.select.outputs.harnesses != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      HARNESS: ${{ matrix.harness }}
      PROBE_REQUIRES_ROOT: ${{ matrix.requires_root }}
    steps:
      - name: Install runtime prerequisites
        if: matrix.packages != ''
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          installer=()
          if [[ "$(id -u)" != 0 ]]; then installer=(sudo); fi
          read -r -a packages <<< "$PACKAGES"
          "${installer[@]}" apt-get update
          "${installer[@]}" apt-get install -y --no-install-recommends "${packages[@]}"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.checkout-ref }}
          submodules: recursive
          persist-credentials: false
      - name: Trust checkout for container builds
        if: matrix.container != ''
        run: |
          # Checkout adds safe.directory under a temporary HOME. Later packaging
          # needs the same trust in this disposable container's normal Git config.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Set output and runtime directories
        run: |
          echo "RESULTS=$RUNNER_TEMP/harness-conformance-$HARNESS" >> "$GITHUB_ENV"
          echo "PROBE_OUTPUT=$RUNNER_TEMP/harness-conformance-$HARNESS/probes" >> "$GITHUB_ENV"
          # Install our own executable, even if the runner image has another version.
          echo "NPM_CONFIG_PREFIX=$RUNNER_TEMP/harness-runtime" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install pinned dependencies and runtime
        timeout-minutes: 12
        env:
          HARNESS: ${{ matrix.harness }}
        run: |
          mkdir -p "$RESULTS"
          {
            source scripts/ci/setup_dev.sh
            python -m scripts.harness_conformance.ci install --harness "$HARNESS"
            # Agent session setup needs the installer in later steps too.
            dirname "$(command -v uv)" >> "$GITHUB_PATH"
          } 2>&1 | tee "$RESULTS/setup.log"
          echo "$NPM_CONFIG_PREFIX/bin" >> "$GITHUB_PATH"
      - name: Validate probes, checker, and adapter
        timeout-minutes: 5
        env:
          HARNESS: ${{ matrix.harness }}
        run: |
          .venv/bin/python -m pytest -o addopts= --import-mode=importlib -q \
            scripts/harness_conformance/tests tests/unit_tests/tooling/test_check_suite_artifacts.py \
            tests/unit_tests/rollouts/harness_capabilities \
            "responses_api_agents/${HARNESS}_agent/tests" 2>&1 | tee "$RESULTS/tests.log"
      - name: Run full scenario suite
        id: probes
        timeout-minutes: 15
        env:
          HARNESS: ${{ matrix.harness }}
        run: |
          launcher=()
          # Some sandbox contracts require root for task setup.
          if [[ "$PROBE_REQUIRES_ROOT" == "true" ]]; then launcher=(sudo --preserve-env=GITHUB_ACTIONS); fi
          if "${launcher[@]}" .venv/bin/python -m scripts.run_harness_conformance \
            --harness "$HARNESS" --output "$PROBE_OUTPUT"; then
            code=0
          else
            code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # Exit 1 is a valid nonconforming result; execution errors fail the job.
          if [[ "$code" -gt 1 ]]; then exit "$code"; fi
      - name: Record conformance results
        if: always()
        env:
          HARNESS: ${{ matrix.harness }}
          PROBE_EXIT_CODE: ${{ steps.probes.outputs.exit_code || '2' }}
        run: |
          # Restore access even when a root-run probe stops partway through.
          if [[ "$PROBE_REQUIRES_ROOT" == "true" && -d "$PROBE_OUTPUT" ]]; then
            sudo chown -R "$(id -u):$(id -g)" "$PROBE_OUTPUT"
          fi
          python3 -m scripts.harness_conformance.ci report --harness "$HARNESS" \
            --output "$PROBE_OUTPUT" --exit-code "$PROBE_EXIT_CODE"
      - name: Upload conformance evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harness-conformance-${{ matrix.harness }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RESULTS }}
          if-no-files-found: warn
          retention-days: 14
      - name: Link downloadable report
        if: always() && steps.evidence.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          echo "[Download conformance report and logs]($ARTIFACT_URL) — open probes/conformance_report.md in the artifact." >> "$GITHUB_STEP_SUMMARY"

  report:
    name: Publish check
    needs: [select, probe]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false
      - name: Publish result from this attempt's evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_HARNESSES: ${{ needs.select.outputs.harnesses }}
          PROBE_JOB_RESULT: ${{ needs.probe.result }}
        run: python3 -m scripts.harness_conformance.checks

  docs_table:
    name: Render documentation table
    needs: [select, probe]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false
      - name: Install table renderer dependencies
        timeout-minutes: 8
        run: source scripts/ci/setup_dev.sh
      - name: Download and render this attempt's measurements
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .venv/bin/python -m scripts.harness_conformance.ci_table \
            --repo "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --commit "$TESTED_SHA" \
            --output "$RUNNER_TEMP/harness-conformance-docs/table.mdx"
      - name: Upload rendered documentation table
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harness-conformance-docs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/harness-conformance-docs/table.mdx
          if-no-files-found: error
          retention-days: 14
