name: Suggest Reviewers

# Advisory only: requests reviewers on the PR based on `# suggest:` comment
# lines in .github/CODEOWNERS. This uses the same "request a reviewer" GitHub
# API/UI as CODEOWNERS-driven requests, but is NOT a merge requirement — only
# the real (non-comment) CODEOWNERS lines are enforced by branch protection.
# `# suggest:` entries are invisible to GitHub's own CODEOWNERS parser, since
# it ignores comment lines entirely, so they can never become required.
#
# Implementation lives in NVIDIA-NeMo/FW-CI-templates so any NeMo repo with a
# CODEOWNERS file can reuse it the same way. See that repo's
# .github/workflows/_suggest_reviewers.yml and .github/scripts/
# codeowners-suggestions.js (+ its unit tests) for the matching logic.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  suggest-reviewers:
    # TODO: pin to a released tag once NVIDIA-NeMo/FW-CI-templates#556 merges.
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_suggest_reviewers.yml@f264ebcaa05bdef410edb6dc7e6df0d80ac3df4b
    with:
      workflow_ref: f264ebcaa05bdef410edb6dc7e6df0d80ac3df4b
    secrets:
      # Needed only for team-reviewer suggestions (individual-user suggestions
      # work fine without it). Fine-grained PAT, repo access limited to this
      # repo, "Pull requests: Read and write" + org "Members: Read-only".
      # See _suggest_reviewers.yml's TEAM_REVIEWER_PAT description for why a
      # PAT is required here instead of the default token or a GitHub App.
      # TEMP TEST: pointed at a personal-account fine-grained PAT to isolate
      # whether the fine-grained PAT *type* itself is unsupported for team-
      # reviewer resolution, separate from anything about the service account.
      # Revert to SVC_TEAM_REVIEWER_PAT once this test is done.
      TEAM_REVIEWER_PAT: ${{ secrets.TEST_PERSONAL_TEAM_REVIEWER_PAT }}
      SLACK_TEAM_CHANNEL_WEBHOOK: ${{ secrets.SLACK_TEAM_CHANNEL_WEBHOOK }}
