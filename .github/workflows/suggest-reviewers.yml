name: Suggest Reviewers

# Advisory only: requests reviewers on the PR based on `# suggest:` comment
# lines in .github/CODEOWNERS. This uses the same "request a reviewer" GitHub
# API/UI as CODEOWNERS-driven requests, but is NOT a merge requirement — only
# the real (non-comment) CODEOWNERS lines are enforced by branch protection.
# `# suggest:` entries are invisible to GitHub's own CODEOWNERS parser, since
# it ignores comment lines entirely, so they can never become required.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  suggest-reviewers:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/CODEOWNERS
          sparse-checkout-cone-mode: false

      - name: Request suggested reviewers from CODEOWNERS `# suggest:` lines
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const codeownersPath = '.github/CODEOWNERS';
            if (!fs.existsSync(codeownersPath)) {
              core.info(`${codeownersPath} not found, skipping.`);
              return;
            }

            const SUGGEST_PREFIX = /^#\s*suggest:\s*(.+)$/;

            const rules = fs.readFileSync(codeownersPath, 'utf8')
              .split('\n')
              .map(line => line.trim())
              .map(line => line.match(SUGGEST_PREFIX))
              .filter(Boolean)
              .map(m => m[1].trim())
              .filter(Boolean)
              .map(line => {
                const [pattern, ...owners] = line.split(/\s+/);
                return { pattern, owners };
              });

            if (rules.length === 0) {
              core.info('No `# suggest:` lines found in CODEOWNERS, skipping.');
              return;
            }

            function toRegex(pattern) {
              const anchored = pattern.startsWith('/');
              let p = pattern.replace(/^\//, '');
              const dirOnly = p.endsWith('/');
              if (dirOnly) p = p.slice(0, -1);

              const GLOBSTAR = '@@GLOBSTAR@@';
              const escaped = p
                .replace(/[.+^${}()|[\]\\]/g, '\\$&')
                .replace(/\*\*/g, GLOBSTAR)
                .replace(/\*/g, '[^/]*')
                .replace(new RegExp(GLOBSTAR, 'g'), '.*');

              const body = dirOnly ? `${escaped}(/.*)?` : escaped;
              return anchored || p.includes('/')
                ? new RegExp(`^${body}$`)
                : new RegExp(`(^|/)${body}$`);
            }

            const compiledRules = rules.map(r => ({ ...r, regex: toRegex(r.pattern) }));

            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });

            const suggested = new Set();
            for (const file of files) {
              // CODEOWNERS semantics: last matching rule wins for a given path.
              let match = null;
              for (const rule of compiledRules) {
                if (rule.regex.test(file.filename)) match = rule;
              }
              if (match) match.owners.forEach(o => suggested.add(o));
            }

            const prAuthor = context.payload.pull_request.user.login;
            suggested.delete(`@${prAuthor}`);

            if (suggested.size === 0) {
              core.info('No suggested reviewers matched the changed files.');
              return;
            }

            // `@org/team` entries are team reviewers; plain `@user` entries are user reviewers.
            const reviewers = [];
            const teamReviewers = [];
            for (const owner of suggested) {
              const name = owner.replace(/^@/, '');
              if (name.includes('/')) {
                teamReviewers.push(name.split('/')[1]);
              } else if (name !== prAuthor) {
                reviewers.push(name);
              }
            }

            // Already-requested/already-reviewed users cause a 422; drop anyone already
            // in either state so a re-run (e.g. on `synchronize`) doesn't fail the job.
            const [{ data: existingReviewRequests }, { data: existingReviews }] = await Promise.all([
              github.rest.pulls.listRequestedReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              }),
              github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              }),
            ]);
            const alreadyUsers = new Set([
              ...existingReviewRequests.users.map(u => u.login),
              ...existingReviews.map(r => r.user.login),
            ]);
            const alreadyTeams = new Set(existingReviewRequests.teams.map(t => t.slug));

            const newReviewers = reviewers.filter(r => !alreadyUsers.has(r));
            const newTeamReviewers = teamReviewers.filter(t => !alreadyTeams.has(t));

            if (newReviewers.length === 0 && newTeamReviewers.length === 0) {
              core.info('Suggested reviewers already requested or already reviewed, nothing to do.');
              return;
            }

            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                reviewers: newReviewers,
                team_reviewers: newTeamReviewers,
              });
            } catch (err) {
              // e.g. a suggested user has no repo access, or a team has no write access —
              // don't fail the whole workflow run over an advisory suggestion.
              core.warning(`Could not request some suggested reviewers: ${err.message}`);
            }
