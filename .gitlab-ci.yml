stages:
  - test

# This file is mirrored from GitHub but is active only for internal merge requests.
workflow:
  rules:
    - if: >-
        $CI_PIPELINE_SOURCE == "merge_request_event" &&
        $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "nv-internal-main"
    - when: never

variables:
  NEMO_CI_REF: "main"
  TESTS_TO_RUN_ON_THIS_COMMIT: "nightly"
  TEST_REGEX_ON_THIS_COMMIT: "NONE"

gym-cpu-ci:
  stage: test
  interruptible: true
  trigger:
    project: dl/JoC/nemo-ci
    branch: "$NEMO_CI_REF"
    strategy: depend
    forward:
      # Forward this file's explicit contract, never unrelated pipeline variables.
      yaml_variables: true
      pipeline_variables: false
  variables:
    TEST_NEMO_GYM_MODULE: "True"
    BUILD_MODULE_REGEX: "/nemo-gym/"
    GYM_CI_CONTRACT_VERSION: "3"
    GYM_SOURCE_PROVIDER: "gitlab"
    GYM_GITLAB_PROJECT_PATH: "$CI_PROJECT_PATH"
    GYM_GITLAB_MR_IID: "$CI_MERGE_REQUEST_IID"
    GYM_SOURCE_SHA: "$CI_COMMIT_SHA"
    GYM_SOURCE_REF: "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
    GYM_TARGET_REF: "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    GYM_SLURM_ACCOUNT: "coreai_dlalgo_ci"
    GYM_SLURM_PARTITION: "cpu"
  rules:
    - if: >-
        $CI_PIPELINE_SOURCE == "merge_request_event" &&
        $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "nv-internal-main"
