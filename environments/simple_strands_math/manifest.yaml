name: simple_strands_math
version: 0.1.0
experimental: true
kind: environment
integration_profile: custom-gym-agent-loop
domain: math
description: Simple Strands Agent harness on OpenMathReasoning math problems, boxed
  answers graded with math-verify.
modality: text
licensing: CC-BY-4.0
authors:
- NVIDIA NeMo Gym contributors
maintainers:
- cmunley1
intended_use:
- training
capabilities:
- reasoning
- reasoning/quantitative_reasoning
- reasoning/deductive_reasoning
- planning_and_autonomy
- planning_and_autonomy/self_verification
- knowledge
- knowledge/procedural_knowledge
domains:
- mathematics
requirements:
  gpu: false
  network: no-network
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: math_with_judge
agent_server: simple_strands_agent
datasets:
- name: train
  type: train
  jsonl_fpath: environments/simple_strands_math/data/train.jsonl
  num_repeats: 1
- name: validation
  type: validation
  jsonl_fpath: environments/simple_strands_math/data/validation.jsonl
  num_repeats: 1
- name: example
  type: example
  jsonl_fpath: environments/simple_strands_math/data/example.jsonl
  num_repeats: 1
model_server: policy_model
lifecycle: active
