math_with_judge:
  resources_servers:
    math_with_judge:
      entrypoint: app.py
      judge_model_server:
        type: responses_api_models
        name: policy_model
      judge_responses_create_params: {input: []}
      should_use_judge: false
      domain: agent
      verified: false
      description: Simple Strands Agent harness with math tasks
      value: Improve math capabilities with Simple Strands Agent

      datasets:
      - name: train
        type: train
        jsonl_fpath: environments/simple_strands_math/data/train.jsonl
        huggingface_identifier:
          repo_id: nvidia/Nemotron-RL-math-OpenMathReasoning
          artifact_fpath: train.jsonl
        license: Creative Commons Attribution 4.0 International
      - name: validation
        type: validation
        jsonl_fpath: environments/simple_strands_math/data/validation.jsonl
        huggingface_identifier:
          repo_id: nvidia/Nemotron-RL-math-OpenMathReasoning
          artifact_fpath: validation.jsonl
        license: Creative Commons Attribution 4.0 International
      - name: example
        type: example
        jsonl_fpath: environments/simple_strands_math/data/example.jsonl
simple_strands_math_agent:
  responses_api_agents:
    simple_strands_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: math_with_judge
      model_server:
        type: responses_api_models
        name: policy_model
      concurrency: 8
      max_turns: 30
      max_output_tokens: 4096
      timeout: 900
      tools: [bash]
      native_user_prompt: false
      system_prompt: |
        This is a standalone math task, not a repository task. Do not edit files. Bash is
        available for calculation and verification when useful. Put only the final answer in
        \boxed{}.
