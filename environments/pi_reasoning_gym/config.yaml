reasoning_gym:
  resources_servers:
    reasoning_gym:
      entrypoint: app.py
      domain: knowledge
      verified: false
      description: Pi agent harness on Reasoning Gym tasks
      value: Evaluate model reasoning capabilities in the Pi agent harness

pi_reasoning_gym_agent:
  responses_api_agents:
    pi_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: reasoning_gym
      concurrency: 8
      command: pi
      model: nvinf/nvidia/qwen/qwen3-next-80b-a3b-instruct
      pi_version: 0.80.2
      timeout: 900
      system_prompt: |
        You are a precise reasoning assistant with a bash tool. Use Python to calculate or verify results when helpful.
        Follow the requested final-answer format exactly.
      models_config:
        providers:
          nvinf:
            baseUrl: ${policy_base_url}
            api: openai-completions
            apiKey: ${policy_api_key}
            compat:
              supportsDeveloperRole: false
              supportsReasoningEffort: false
            models:
            - id: nvidia/qwen/qwen3-next-80b-a3b-instruct
              reasoning: false
      datasets:
      - name: example
        type: example
        jsonl_fpath: environments/pi_reasoning_gym/data/example.jsonl
      - name: train
        type: train
        jsonl_fpath: environments/pi_reasoning_gym/data/train_knights_knaves.jsonl
        license: Apache 2.0
