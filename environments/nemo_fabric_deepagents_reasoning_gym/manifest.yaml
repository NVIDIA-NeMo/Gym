name: nemo_fabric_deepagents_reasoning_gym
version: 0.1.0
experimental: true
kind: environment
integration_profile: custom-gym-agent-loop
domain: knowledge
description: DeepAgents through NeMo Fabric on five Reasoning Gym examples (knights_knaves),
  scored by Reasoning Gym's checker.
modality: text
licensing: unknown
authors:
- NVIDIA NeMo Gym contributors
maintainers:
- cmunley1
intended_use:
- training
capabilities:
- reasoning
- reasoning/deductive_reasoning
- reasoning/quantitative_reasoning
- reasoning/inductive_reasoning
- planning_and_autonomy
domains:
- mathematics
- general
requirements:
  gpu: false
  network: no-network
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: reasoning_gym
agent_server: nemo_fabric_agent
datasets:
- name: example
  type: example
  jsonl_fpath: environments/nemo_fabric_deepagents_reasoning_gym/data/example.jsonl
  num_repeats: 1
model_server: policy_model
lifecycle: active
