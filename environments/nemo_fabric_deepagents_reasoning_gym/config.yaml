reasoning_gym:
  resources_servers:
    reasoning_gym:
      entrypoint: app.py
      domain: knowledge
      verified: true
      description: Reasoning Gym evaluated through NeMo Fabric and DeepAgents.
      value: Evaluate reasoning tasks with DeepAgents.

nemo_fabric_deepagents_reasoning_gym_agent:
  responses_api_agents:
    nemo_fabric_agent:
      entrypoint: app.py
      description: Run any installed agent harness through the typed NeMo Fabric lifecycle.
      adapter_id: nvidia.fabric.langchain.deepagents
      resources_server:
        type: resources_servers
        name: reasoning_gym
      model_server:
        type: responses_api_models
        name: policy_model
      model_provider: openai-compatible
      model: gym-policy-model
      model_api_key: local  # pragma: allowlist secret
      concurrency: 32
      timeout: 1800
      cwd: null
      harness_settings: {}
      fabric_config: {}
      # reasoning_gym's verifier extracts the answer from <answer></answer> tags (last match), so DeepAgents'
      # planning narration and inline reasoning stay out of the score. Without the tags the whole reply is
      # scored and a correct final answer still scores 0 (NVBug 6900506), as
      # resources_servers/reasoning_gym/configs/reasoning_gym_langchain_deepagents_agent_model_server.yaml notes.
      system_prompt: |
        Solve the problem carefully and give the answer in the exact format requested. Put only your final
        answer inside <answer></answer> tags. Do not mention the tags elsewhere in your response.
      datasets:
        - name: example
          type: example
          jsonl_fpath: environments/nemo_fabric_deepagents_reasoning_gym/data/example.jsonl

nemo_fabric_deepagents_reasoning_gym_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: nemo_fabric_deepagents_reasoning_gym_agent
