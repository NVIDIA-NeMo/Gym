# BiomniBench-DA on HPC: config.yaml with an Apptainer (Singularity) sandbox provider. The Resources Server and the
# agent must share a host and UID, because an Apptainer sandbox is handed over by its local descriptor.
config_paths:
  - environments/biomnibench_da/config.yaml

sandbox:
  apptainer:
    create:
      extra_start_args: [--fakeroot, --containall, --writable-tmpfs]
    exec:
      default_timeout_s: 1800
      timeout_grace_s: 30
