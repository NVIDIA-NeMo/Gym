schema_version = "1.3"

[task]
name = "pare/gym-fm-02"
description = "Evaluate the installed NeMo Gym Workplace Assistant Carlos example with the selected Gym agent and retain a scored rollout."
keywords = ["pare", "nemo-gym", "product-use", "workplace-assistant"]

[[task.authors]]
name = "Maygol Kananizadeh"
email = "mkananizadeh@nvidia.com"

[metadata]
case_id = "GYM-FM-02"
product = "NeMo Gym"
product_version = "0.7.0"
lifecycle_phase = "use"
persona_id = "P3-Agent"
persona = "Agent Builder with no Post-Training Experience"
fixture_id = "gym-fm-02-installed"
fixture_revision = "upstream-1"

[agent]
timeout_sec = 1200.0

[verifier]
timeout_sec = 120.0

# Connection settings come from the run configuration; task timing stays here.
[verifier.env]
VERIFIER_JUDGE_BASE_URL = "${VERIFIER_JUDGE_BASE_URL}"
VERIFIER_JUDGE_API_KEY = "${VERIFIER_JUDGE_API_KEY}"
VERIFIER_JUDGE_MODEL = "${VERIFIER_JUDGE_MODEL}"
VERIFIER_JUDGE_REASONING_EFFORT = "${VERIFIER_JUDGE_REASONING_EFFORT}"
VERIFIER_JUDGE_TIME_BUDGET_SEC = "80"
VERIFIER_JUDGE_FINAL_RESERVE_SEC = "15"

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
network_mode = "public"

# The selected Gym run preset supplies the inner agent, model and connection to the container.
