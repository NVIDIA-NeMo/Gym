math_with_judge:
  resources_servers:
    math_with_judge:
      entrypoint: app.py
      judge_model_server:
        type: responses_api_models
        name: policy_model
      judge_responses_create_params: {input: []}
      should_use_judge: false
      domain: math
      verified: false
      description: Hermes agent harness on DAPO-Math-17k with math-verify
      value: Evaluate math reasoning in the Hermes agent harness

hermes_math_agent:
  responses_api_agents:
    hermes_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: math_with_judge
      model_server:
        type: responses_api_models
        name: policy_model
      enabled_toolsets: [terminal, file, code_execution, skills, todo]
      max_turns: 30
      concurrency: 32
      terminal_backend: local
      terminal_timeout: 30
      system_prompt: |
        You are a precise math assistant. You have access to a terminal tool to run Python for calculations or verification.
        Use it when computation would help, and put only the final answer inside \boxed{}.
      datasets:
        - name: example
          type: example
          jsonl_fpath: environments/hermes_math/data/example.jsonl
        - name: train
          type: train
          jsonl_fpath: environments/hermes_math/data/dapo17k_train.jsonl
          gitlab_identifier:
            dataset_name: dapo17k
            version: 0.0.1
            artifact_fpath: dapo17k_train.jsonl
          license: Apache 2.0
