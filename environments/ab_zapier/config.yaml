# AutomationBench with upstream zapier scoring (partial credit).
# Source: https://github.com/zapier/AutomationBench v1.0.6
# Toolset is set explicitly to "api", matching upstream's CLI default
# (upstream's Python signatures default to "zapier", so the default is ambiguous).
ab_zapier:
  responses_api_agents:
    verifiers_agent:
      entrypoint: app.py
      domain: other
      description: Zapier AutomationBench, partial credit scoring
      value: Evaluate enterprise workflow automation
      model_server:
        type: responses_api_models
        name: policy_model
      model_name: ""
      vf_env_id: automationbench_zapier_env
      vf_env_args:
        max_turns: 50
        toolset: api
      group_size: 1
      max_concurrent_generation: -1
      max_concurrent_scoring: -1
      max_tokens: 131072
      temperature: 1.0
      top_p: 1.0
      datasets:
        - name: validation
          type: validation
          jsonl_fpath: environments/ab_zapier/data/automationbench-600.jsonl
          license: MIT
