# AutomationBench with upstream zapier scoring (partial credit).
# Source: https://github.com/zapier/AutomationBench  (verifiers 0.2.0)
ab_zapier:
  responses_api_agents:
    verifiers_agent:
      entrypoint: app.py
      domain: other
      description: Zapier AutomationBench on a Verifiers V1 taskset.
      value: Improve multi-step tool use and business workflow execution.
      model_server:
        type: responses_api_models
        name: policy_model
      verifiers:
        taskset:
          id: automationbench_env
          domains: [sales, marketing, operations, support, finance, hr]
      group_size: 1
      max_concurrent_generation: -1
      max_concurrent_scoring: -1
      max_tokens: 16384
      temperature: 1.0
      top_p: 1.0
      datasets:
        - name: validation
          type: validation
          jsonl_fpath: environments/ab_zapier/data/automationbench-600.jsonl
          license: MIT
