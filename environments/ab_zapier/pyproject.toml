[project]
name = "automationbench-zapier-env"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "automation-bench @ git+https://github.com/zapier/AutomationBench.git@v1.0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["automationbench_zapier_env"]
