config_paths:
- resources_servers/ui_generation/configs/ui_generation.yaml

ui_generation_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: ui_generation_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
ui_generation_resources_server:
  resources_servers:
    ui_generation:
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/ui_generation/data/example.jsonl
        num_repeats: 1
ui_generation_environment_server:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: ui_generation_resources_server
      agent_server:
        type: responses_api_agents
        name: ui_generation_agent
