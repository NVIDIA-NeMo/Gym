name: scrabble
version: 0.1.0
experimental: true
kind: environment
integration_profile: custom-gym-agent-loop
domain: games
description: Scrabble move finding. The model plays one move on a pinned board and rack with a tool call and is
  rewarded by its score over the best possible score.
modality: text
licensing: Apache-2.0
authors:
- ngajare
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: deterministic
resources_server: scrabble
agent_server: gymnasium_agent
datasets:
- name: train
  type: train
  jsonl_fpath: environments/scrabble/data/train.jsonl
  num_repeats: 1
- name: validation
  type: validation
  jsonl_fpath: environments/scrabble/data/validation.jsonl
  num_repeats: 1
- name: example
  type: example
  jsonl_fpath: environments/scrabble/data/example.jsonl
  num_repeats: 1
model_server: policy_model
session_model: episode
state: per_session
lifecycle: active
