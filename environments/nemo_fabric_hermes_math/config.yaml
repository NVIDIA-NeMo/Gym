config_paths:
  - responses_api_agents/nemo_fabric_agent/configs/nemo_fabric_hermes.yaml

math_with_judge:
  resources_servers:
    math_with_judge:
      entrypoint: app.py
      judge_model_server:
        type: responses_api_models
        name: policy_model
      judge_responses_create_params: {input: []}
      should_use_judge: false
      domain: math
      verified: false
      description: OpenMathReasoning evaluated with math-verify through NeMo Fabric and Hermes Agent.
      value: Evaluate mathematical reasoning with Hermes Agent.

nemo_fabric_hermes_math_agent:
  _inherit_from: nemo_fabric_hermes
  responses_api_agents:
    nemo_fabric_agent:
      resources_server:
        name: math_with_judge
      timeout: 1800
      system_prompt: |
        You are a precise math assistant. Use Python when it helps and put only the final answer in \boxed{}.
      harness_settings:
        max_tokens: 32000
      datasets:
        - name: example
          type: example
          jsonl_fpath: environments/nemo_fabric_hermes_math/data/example.jsonl
