math_with_judge:
  resources_servers:
    math_with_judge:
      entrypoint: app.py
      judge_model_server:
        type: responses_api_models
        name: policy_model
      judge_responses_create_params: {input: []}
      should_use_judge: false
      domain: math
      verified: false
      description: OpenClaw agent harness on DAPO-Math-17k with math-verify
      value: Evaluate math reasoning in the OpenClaw agent harness

openclaw_math_agent:
  responses_api_agents:
    openclaw_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: math_with_judge
      concurrency: 8
      command: openclaw
      model: nvinf/nvidia/qwen/qwen3-5-397b-a17b
      openclaw_version: 2026.6.11
      thinking: "off"
      setup_timeout: 900
      timeout: 900
      system_prompt: |
        You are a precise math assistant with an exec tool. Run Python to calculate or verify numeric results when helpful.
        Put the final answer, and only the final answer, inside \boxed{}.
      openclaw_config:
        models:
          providers:
            nvinf:
              api: openai-completions
              baseUrl: ${policy_base_url}
              apiKey: ${policy_api_key}
              models:
              - id: nvidia/qwen/qwen3-5-397b-a17b
                name: nvidia/qwen/qwen3-5-397b-a17b
                api: openai-completions
      datasets:
      - name: example
        type: example
        jsonl_fpath: environments/openclaw_math/data/example.jsonl
      - name: train
        type: train
        jsonl_fpath: environments/openclaw_math/data/dapo17k_train.jsonl
        gitlab_identifier:
          dataset_name: dapo17k
          version: 0.0.1
          artifact_fpath: dapo17k_train.jsonl
        license: Apache 2.0
