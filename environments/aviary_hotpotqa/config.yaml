hotpotqa_aviary_resources_server:
  resources_servers:
    aviary:
      entrypoint: hotpotqa_app.py
      domain: agent
      verified: false
      description: Multi-hop question answering on the HotPotQA dataset with Wikipedia search
      value: Improve knowledge and agentic capability
hotpotqa_aviary_agent:
  responses_api_agents:
    aviary_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: hotpotqa_aviary_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: train
        type: train
        jsonl_fpath: environments/aviary_hotpotqa/data/hotpotqa_train.jsonl
        license: Creative Commons Attribution-ShareAlike 4.0 International
      - name: validation
        type: validation
        jsonl_fpath: environments/aviary_hotpotqa/data/hotpotqa_validation.jsonl
        license: Creative Commons Attribution-ShareAlike 4.0 International
      - name: example
        type: example
        jsonl_fpath: environments/aviary_hotpotqa/data/example.jsonl
