name: aviary_hotpotqa
version: 0.1.0
experimental: true
kind: environment
integration_profile: custom-gym-agent-loop
domain: agent
description: HotPotQA multi-hop questions through Aviary, with Wikipedia search.
modality: text
licensing: CC-BY-SA-4.0
authors:
- NVIDIA NeMo Gym contributors
maintainers:
- cmunley1
intended_use:
- training
capabilities:
- retrieval_and_grounding
- retrieval_and_grounding/open_retrieval
- retrieval_and_grounding/multi_source_synthesis
- tool_and_computer_use
- tool_and_computer_use/web_search
- tool_and_computer_use/multi_step_tool_use
- reasoning
- reasoning/deductive_reasoning
- knowledge
- knowledge/factual_knowledge
domains:
- general
requirements:
  gpu: false
  network: allowlist
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: aviary
agent_server: aviary_agent
datasets:
- name: train
  type: train
  jsonl_fpath: environments/aviary_hotpotqa/data/hotpotqa_train.jsonl
  num_repeats: 1
- name: validation
  type: validation
  jsonl_fpath: environments/aviary_hotpotqa/data/hotpotqa_validation.jsonl
  num_repeats: 1
- name: example
  type: example
  jsonl_fpath: environments/aviary_hotpotqa/data/example.jsonl
  num_repeats: 1
model_server: policy_model
lifecycle: active
