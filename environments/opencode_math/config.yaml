config_paths:
- nemo_gym/sandbox/providers/local/configs/local.yaml

math_with_judge:
  resources_servers:
    math_with_judge:
      entrypoint: app.py
      judge_model_server:
        type: responses_api_models
        name: policy_model
      judge_responses_create_params: {input: []}
      should_use_judge: false
      domain: math
      verified: false
      description: OpenCode agent harness on DAPO-Math-17k with math-verify
      value: Evaluate math reasoning in the OpenCode agent harness

opencode_math_agent:
  responses_api_agents:
    opencode_sandboxed_agent:
      entrypoint: app.py
      num_workers: 8
      resources_server:
        type: resources_servers
        name: math_with_judge
      # No Gym model server: OpenCode talks to the endpoint in opencode_config directly.
      model_server: null
      token_id_capture: false
      debug: false
      opencode_version: 1.17.11
      opencode_max_context_window: 262144
      opencode_max_output_tokens: 131072
      thinking: false
      sandbox_timeout: 900
      # Runs on the host. Swap in another provider config to containerize.
      sandbox_provider: sandbox
      sandbox_config: {}
      remote_opencode_install_script_path: null
      remote_opencode_binary_path: null
      system_prompt: |
        You are a precise math assistant with a bash tool. Run Python to calculate or verify numeric results when helpful.
        Put the final answer, and only the final answer, inside \boxed{}.
      opencode_config:
        model: nvinf/nvidia/qwen/qwen3-5-397b-a17b
        permission:
          bash: allow
          edit: allow
          webfetch: allow
        provider:
          nvinf:
            npm: "@ai-sdk/openai-compatible"
            options:
              baseURL: ${policy_base_url}
              apiKey: ${policy_api_key}
            models:
              nvidia/qwen/qwen3-5-397b-a17b: {}
      datasets:
      - name: example
        type: example
        jsonl_fpath: environments/opencode_math/data/example.jsonl
      - name: train
        type: train
        jsonl_fpath: environments/opencode_math/data/dapo17k_train.jsonl
        gitlab_identifier:
          dataset_name: dapo17k
          version: 0.0.1
          artifact_fpath: dapo17k_train.jsonl
        license: Apache 2.0
