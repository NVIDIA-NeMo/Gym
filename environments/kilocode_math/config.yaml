config_paths:
- responses_api_agents/kilocode_agent/configs/kilocode_agent.yaml

math_with_judge:
  resources_servers:
    math_with_judge:
      entrypoint: app.py
      judge_model_server:
        type: responses_api_models
        name: policy_model
      judge_responses_create_params: {input: []}
      should_use_judge: false
      domain: math
      verified: false
      description: KiloCode agent harness on DAPO-Math-17k with math-verify
      value: Evaluate math reasoning in the KiloCode agent harness

      datasets:
      - name: example
        type: example
        jsonl_fpath: environments/kilocode_math/data/example.jsonl
      - name: train
        type: train
        jsonl_fpath: environments/kilocode_math/data/dapo17k_train.jsonl
        gitlab_identifier:
          dataset_name: dapo17k
          version: 0.0.1
          artifact_fpath: dapo17k_train.jsonl
        license: Apache 2.0
kilocode_math_agent:
  _inherit_from: kilocode_agent
  responses_api_agents:
    kilocode_agent:
      resources_server:
        type: resources_servers
        name: math_with_judge
      system_prompt: |
        You are a precise math assistant with a bash tool. Run Python to calculate or verify numeric results when helpful.
        Put the final answer, and only the final answer, inside \boxed{}.
      context_window: 131072
      max_output_tokens: 65536
