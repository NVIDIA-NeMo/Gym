math_with_judge:
  resources_servers:
    math_with_judge:
      entrypoint: app.py
      judge_model_server:
        type: responses_api_models
        name: policy_model
      judge_responses_create_params: {input: []}
      should_use_judge: false
      domain: math
      verified: false
      description: Claude Code agent harness on DAPO-Math-17k with math-verify
      value: Evaluate math reasoning in the Claude Code agent harness

claude_code_math_agent:
  responses_api_agents:
    claude_code_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: math_with_judge
      model_server:
        type: responses_api_models
        name: policy_model
      concurrency: 32
      model: ${policy_model_name}
      anthropic_api_key: EMPTY  # pragma: allowlist secret
      anthropic_base_url: null
      max_turns: 30
      timeout: 300
      thinking: disabled
      system_prompt: |
        You are a precise math assistant. You have access to Bash to run Python for calculations.
        Think step by step, verify with code when helpful, and put only the final answer inside \boxed{}.
      datasets:
      - name: example
        type: example
        jsonl_fpath: environments/claude_code_math/data/example.jsonl
      - name: train
        type: train
        jsonl_fpath: environments/claude_code_math/data/dapo17k_train.jsonl
        gitlab_identifier:
          dataset_name: dapo17k
          version: 0.0.1
          artifact_fpath: dapo17k_train.jsonl
        license: Apache 2.0
