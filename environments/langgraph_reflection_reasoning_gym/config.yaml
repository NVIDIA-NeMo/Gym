reasoning_gym:
  resources_servers:
    reasoning_gym:
      entrypoint: app.py
      domain: knowledge
      description: LangGraph reflection agent compatible with resource servers that do not use tools. It provides iterative reflection for diverse agent training data and test time scaling, and it can be extended to use tools or other agent architectures
      value: Iterative test time scaling for improved performance in reasoning tasks
      verified: false

langgraph_reflection_reasoning_gym_agent:
  responses_api_agents:
    langgraph_agent:
      entrypoint: reflection_agent.py
      resources_server:
        type: resources_servers
        name: reasoning_gym
      model_server:
        type: responses_api_models
        name: policy_model
      max_reflections: 2
      datasets:
      - name: example
        type: example
        jsonl_fpath: environments/langgraph_reflection_reasoning_gym/data/example.jsonl
      - name: train
        type: train
        jsonl_fpath: environments/langgraph_reflection_reasoning_gym/data/train_knights_knaves.jsonl
        license: Apache 2.0
