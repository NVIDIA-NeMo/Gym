math_with_judge:
  resources_servers:
    math_with_judge:
      entrypoint: app.py
      judge_model_server:
        type: responses_api_models
        name: policy_model
      judge_responses_create_params: {input: []}
      should_use_judge: false
      domain: math
      verified: false
      description: Pi agent harness on DAPO-Math-17k with math-verify
      value: Evaluate math reasoning in the Pi agent harness

pi_math_agent:
  responses_api_agents:
    pi_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: math_with_judge
      concurrency: 8
      command: pi
      model: nvinf/nvidia/qwen/qwen3-5-397b-a17b
      pi_version: 0.80.2
      timeout: 900
      system_prompt: |
        You are a precise math assistant with a bash tool. Run Python to calculate or verify numeric results when helpful.
        Put the final answer, and only the final answer, inside \boxed{}.
      models_config:
        providers:
          nvinf:
            baseUrl: ${policy_base_url}
            api: openai-completions
            apiKey: ${policy_api_key}
            compat:
              supportsDeveloperRole: false
              supportsReasoningEffort: false
            models:
            - id: nvidia/qwen/qwen3-5-397b-a17b
              reasoning: false
      datasets:
      - name: example
        type: example
        jsonl_fpath: environments/pi_math/data/example.jsonl
      - name: train
        type: train
        jsonl_fpath: environments/pi_math/data/dapo17k_train.jsonl
        gitlab_identifier:
          dataset_name: dapo17k
          version: 0.0.1
          artifact_fpath: dapo17k_train.jsonl
        license: Apache 2.0
