name: hello-taskset
version: 1.0.0
description: Define uniform tasks with shared instructions and verification
tags:
  - example
license: Apache-2.0

instruction: instruction.md
episode_protocol: nemo_gym.single_agent.v1

task_model: task.py:TaskData
tasksets:
  - name: example
    path: tasksets/example.jsonl

runtime:
  dockerfile: runtime/Dockerfile
  workdir: /workspace

  # MCP services exposed to compatible agents.
  mcp_servers: []

verifier:
  implementation: verifier.py:verify
  verifier_input:
    path: task_data.expected_path
    content: task_data.expected_content
