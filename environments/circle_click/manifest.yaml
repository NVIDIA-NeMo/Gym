name: circle_click
version: 0.1.0
experimental: true
kind: environment
integration_profile: custom-gym-verifier
domain: other
description: Images of coloured circles on a white background. The model clicks the
  circle it is asked for and is rewarded for a hit.
modality: text, image
licensing: unknown
authors:
- NVIDIA NeMo Gym contributors
maintainers:
- cmunley1
intended_use:
- training
capabilities:
- multimodal_input_understanding
- multimodal_input_understanding/scene_understanding
- reasoning
- reasoning/spatial_temporal_reasoning
- tool_and_computer_use
- tool_and_computer_use/tool_calling
- tool_and_computer_use/gui_tasks
domains:
- general
requirements:
  gpu: false
  network: no-network
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: circle_click
agent_server: simple_agent
datasets:
- name: example
  type: example
  jsonl_fpath: environments/circle_click/data/example.jsonl
  num_repeats: 1
model_server: policy_model
lifecycle: active
