ab_synth:
  responses_api_agents:
    verifiers_agent:
      entrypoint: app.py
      domain: agent
      description: Synthetic multi-day SaaS workflows on the AutomationBench app simulator with simulated time, scored on the final world and on the day each write happened.
      value: Improve multi-day workflow execution (waiting for the right day, re-reading the world, acting on the due day).
      model_server:
        type: responses_api_models
        name: policy_model
      model_name: ""
      vf_env_id: ab_synth_env
      vf_env_args:
        # The same Gym rows as the dataset below (verifiers builds its dataset from them). Required.
        tasks_path: ???
        max_turns: 80
      group_size: 1
      max_concurrent_generation: -1
      max_concurrent_scoring: -1
      max_tokens: 131072
      temperature: 1.0
      top_p: 1.0
      client_timeout_s: 3600
      client_connect_timeout_s: 60
      client_max_retries: 0
      datasets:
        - name: train
          type: train
          jsonl_fpath: environments/ab_synth/data/train.jsonl
