[project]
name = "ab-synth-env"
version = "0.1.0"
requires-python = ">=3.13"
# Built on the AutomationBench app simulator, installed from benchmarks/automationbench.
dependencies = ["automationbench-env"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ab_synth_env"]
