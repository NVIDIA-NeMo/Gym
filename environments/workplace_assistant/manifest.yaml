name: workplace_assistant
version: 0.1.0
experimental: true
kind: environment
integration_profile: custom-gym-verifier
domain: agent
description: Multi-step tool use in a simulated workplace with five databases and
  27 tools, scored on whether the model's tool calls reach the expected outcome.
modality: text
licensing: Apache-2.0
authors:
- NVIDIA NeMo Gym contributors
maintainers:
- shashank3959
- ananthsub
capabilities:
- tool_and_computer_use
- tool_and_computer_use/tool_calling
- tool_and_computer_use/multi_step_tool_use
- tool_and_computer_use/env_feedback_interpretation
- planning_and_autonomy
- planning_and_autonomy/task_planning
- instruction_and_format_following
- instruction_and_format_following/instruction_following
domains:
- business_management
requirements:
  gpu: false
  network: no-network
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: workplace_assistant
agent_server: simple_agent
datasets:
- name: train
  type: train
  jsonl_fpath: environments/workplace_assistant/data/train.jsonl
  num_repeats: 1
- name: validation
  type: validation
  jsonl_fpath: environments/workplace_assistant/data/validation.jsonl
  num_repeats: 1
- name: example
  type: example
  jsonl_fpath: environments/workplace_assistant/data/example.jsonl
  num_repeats: 1
model_server: policy_model
lifecycle: active
