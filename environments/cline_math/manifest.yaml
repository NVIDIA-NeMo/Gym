name: cline_math
version: 0.1.0
experimental: true
kind: environment
integration_profile: custom-gym-agent-loop
domain: math
description: Cline agent harness on DAPO-Math-17k, answers graded with math-verify.
modality: text
licensing: Apache-2.0
authors:
- NVIDIA NeMo Gym contributors
maintainers:
- cmunley1
intended_use:
- training
capabilities:
- reasoning
- reasoning/quantitative_reasoning
- reasoning/deductive_reasoning
- planning_and_autonomy
- planning_and_autonomy/self_verification
- knowledge
- knowledge/procedural_knowledge
domains:
- mathematics
requirements:
  gpu: false
  network: no-network
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: math_with_judge
agent_server: cline_agent
datasets:
- name: example
  type: example
  jsonl_fpath: environments/cline_math/data/example.jsonl
  num_repeats: 1
- name: train
  type: train
  jsonl_fpath: environments/cline_math/data/dapo17k_train.jsonl
  num_repeats: 1
model_server: policy_model
lifecycle: active
