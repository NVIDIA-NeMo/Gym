math_with_judge:
  resources_servers:
    math_with_judge:
      entrypoint: app.py
      judge_model_server:
        type: responses_api_models
        name: policy_model
      judge_responses_create_params: {input: []}
      should_use_judge: false
      domain: math
      verified: false
      description: LangGraph ReWOO agent on DAPO-Math-17k with math-verify
      value: Evaluate math reasoning with plan-then-execute decomposition

langgraph_rewoo_math_agent:
  responses_api_agents:
    langgraph_agent:
      entrypoint: rewoo_agent.py
      resources_server:
        type: resources_servers
        name: math_with_judge
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: environments/langgraph_rewoo_math/data/example.jsonl
      - name: train
        type: train
        jsonl_fpath: environments/langgraph_rewoo_math/data/dapo17k_train.jsonl
        gitlab_identifier:
          dataset_name: dapo17k
          version: 0.0.1
          artifact_fpath: dapo17k_train.jsonl
        license: Apache 2.0
