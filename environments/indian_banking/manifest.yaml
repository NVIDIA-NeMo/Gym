name: indian_banking
version: 1.0.0
kind: environment
integration_profile: custom-gym-agent-loop
domain: agent
description: 'Multi-turn Indian retail-banking customer-support environment: the policy
  talks to an LLM-simulated customer over 33 deterministic banking tools plus human
  hand-off, and is scored against gold tool calls, final database state, required
  disclosures and an NL-assertion judge.'
modality: text
licensing: Apache-2.0
authors:
- krishnpci
maintainers:
- krishnpci
intended_use:
- training
capabilities:
- tool_and_computer_use
- tool_and_computer_use/tool_calling
- tool_and_computer_use/multi_step_tool_use
- tool_and_computer_use/env_feedback_interpretation
- instruction_and_format_following
- instruction_and_format_following/instruction_following
- human_ai_interaction
- human_ai_interaction/clarification_and_assumption_management
- retrieval_and_grounding
- retrieval_and_grounding/evidence_synthesis
- safety
- safety/agentic_action_safety
- knowledge
- knowledge/expert_knowledge
domains:
- finance
requirements:
  gpu: false
  network: allowlist
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: stochastic
resources_server: indian_banking
agent_server: gymnasium_agent
datasets:
- name: train
  type: train
  jsonl_fpath: resources_servers/indian_banking/data/train.jsonl
  num_repeats: 1
- name: validation
  type: validation
  jsonl_fpath: resources_servers/indian_banking/data/validation.jsonl
  num_repeats: 1
- name: example
  type: example
  jsonl_fpath: resources_servers/indian_banking/data/example.jsonl
  num_repeats: 1
model_server: policy_model
session_model: episode
state: per_session
lifecycle: active
