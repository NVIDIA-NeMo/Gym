name: calendar_v2
version: 0.1.0
experimental: true
kind: environment
integration_profile: custom-gym-verifier
domain: agent
description: Multi-turn calendar scheduling on the v2 dataset (Nemotron-RL-Instruction-Following-Calendar-v2).
  The user adds events with time constraints and the model answers with the schedule
  as a JSON list, checked against every constraint.
modality: text
licensing: CC-BY-4.0
authors:
- NVIDIA NeMo Gym contributors
maintainers:
- cmunley1
capabilities:
- reasoning
- reasoning/spatial_temporal_reasoning
- reasoning/deductive_reasoning
- context_management
- context_management/constraint_preservation
- instruction_and_format_following
- instruction_and_format_following/instruction_following
- instruction_and_format_following/structured_output
- planning_and_autonomy
- planning_and_autonomy/optimization
domains:
- general
requirements:
  gpu: false
  network: no-network
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: calendar
agent_server: simple_agent
datasets:
- name: train
  type: train
  jsonl_fpath: environments/calendar_v2/data/train.jsonl
  num_repeats: 1
- name: validation
  type: validation
  jsonl_fpath: environments/calendar_v2/data/validation.jsonl
  num_repeats: 1
- name: example
  type: example
  jsonl_fpath: environments/calendar_v2/data/example.jsonl
  num_repeats: 1
model_server: policy_model
lifecycle: active
