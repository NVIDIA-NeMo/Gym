# Deployment overlay for Agentic-VBench on the Harbor task shape (the generic `harbor` environment server).
# Pass it after `--sandbox <provider>`, to `gym dataset validate` and `gym eval run` alike:
#
#   gym eval run agentic_vbench --agent opencode_agent --sandbox docker \
#     --config environments/harbor/agentic_vbench/harbor_sandbox.yaml ...
#
# The repurpose verifiers judge with an LLM over the NVIDIA Inference Hub. The prepare script moved the key into
# each judged task's `[steps.verifier.env]` as the `${NVINFERENCE_API_KEY}` template, which the server fills from
# this secret for the verifier process only. The secret has no empty default: with neither variable set it resolves
# to null, which the server's `secrets` table rejects, so the server does not start without a key and no repurpose
# task can be scored 0 for want of one. The judged (repurpose) and repair tasks declare `/workspace/output` as their
# step's artifact; `separate_verifier_for_artifacts` grades them in a fresh sandbox of the task image, so the agent's
# sandbox never runs the verifier that holds the key, and cannot make it exit 75 ("could not grade"). Assembly and
# sequencing declare no artifact and verify in the agent's sandbox, as upstream does. Every episode starts one
# sandbox from a task image of a few gigabytes, so the episode cap keeps a run from starting all 100 at once.
harbor_environment_server:
  environment_servers:
    harbor:
      secrets:
        NVINFERENCE_API_KEY: ${oc.env:NVINFERENCE_API_KEY,${oc.env:INFERENCE_API_KEY,null}}
      separate_verifier_for_artifacts: true
      max_concurrent_episodes: 12
      queue_timeout_seconds: 43200
      # Cold task images build at prepare; a pull into the sandbox provider can still take minutes.
      sandbox_ready_timeout_s: 1800

# The tasks need the model to look at frames it extracts, so the harness declares image input to the model; without
# it a run is blind to the clips and not comparable to the published numbers.
opencode_agent:
  responses_api_agents:
    opencode_agent:
      image_input: true
