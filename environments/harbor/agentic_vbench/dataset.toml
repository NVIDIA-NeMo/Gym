# Agentic-VBench on the Harbor task shape: the committed entry for the 100 pinned video-editing tasks
# (Repair 18, Assembly 18, Sequencing 28, Repurpose 36) of PhiloLabs/agentic-vbench at revision
# 410a75fe3dae37de4344fc9e5317da089505330a, run by the generic `harbor` environment server with Gym's own
# sandboxed harnesses.
#
# `dataset.toml` declares no source: the tasks come from the pinned upstream git checkout, not from a Harbor
# hub, so `python -m benchmarks.agentic_vbench.prepare_harbor_env` writes them into this folder (the task
# folders, the manifest and the preparation records are gitignored beside this file), and
# `gym dataset validate agentic_vbench` and `gym eval run agentic_vbench ...` resolve the entry name to it.
[dataset]
name = "philolabs/agentic-vbench"
version = "0.1.0"

[gym]
type = "benchmark"
domain = "agent"
license = "Apache 2.0"
# The task prompt is text and the videos are files in the task's own image, so a harness can run the tasks when it
# works inside a lent sandbox and sends the model the images its tools read there (the frames the model extracts).
# `opencode_agent` is the harness the benchmark's published numbers use (OpenCode inside the task container) and the
# one the README's full-set numbers come from. `pi_agent` and `openclaw_agent` are the other harnesses with that
# switch (`image_input`, see `harbor_sandbox_pi.yaml` and `harbor_sandbox_openclaw.yaml`); their scores are their own
# baselines, not the published ones. A harness that does not send the model the images its tools read would run
# blind to the clips and still get a score, so none is listed.
allowed_agents = ["opencode_agent", "pi_agent", "openclaw_agent"]

[gym.defaults]
# The benchmark's published runs gave every verifier three times its declared 1800 s: the repurpose judges
# transcribe the agent's clip before they score it, and some repair metrics are single-threaded. The agent budgets
# stay as the tasks declare them.
verifier_timeout_multiplier = 3.0
