# Deployment overlay for Agentic-VBench on the Harbor task shape with the Codex harness. Pass it instead of
# `harbor_sandbox.yaml`, which carries the OpenCode harness's block and so loads only with `--agent opencode_agent`:
#
#   gym eval run agentic_vbench --agent codex_agent --sandbox docker --model-type vllm_model \
#     --config environments/harbor/agentic_vbench/harbor_sandbox_codex.yaml ...
#
# The server block is `harbor_sandbox.yaml`'s, key for key (a test keeps the two equal): the judge key as a
# verifier-only secret, separate verification of the tasks that declare artifacts, and the episode cap.
harbor_environment_server:
  environment_servers:
    harbor:
      secrets:
        NVINFERENCE_API_KEY: ${oc.env:NVINFERENCE_API_KEY,${oc.env:INFERENCE_API_KEY,null}}
      separate_verifier_for_artifacts: true
      max_concurrent_episodes: 12
      queue_timeout_seconds: 43200
      # Cold task images build at prepare; a pull into the sandbox provider can still take minutes.
      sandbox_ready_timeout_s: 1800

# Codex looks at a frame with its `view_image` tool, which returns the image inside the tool result. Chat tool
# messages carry text only, so the conversion of that result refuses the request unless the model server sends the
# image on as an image part, which `vllm_model` can (and vLLM accepts). This block is for a `vllm_model` server
# named `policy_model` (`--model-type vllm_model`); leave it out with a server that takes Responses natively.
policy_model:
  responses_api_models:
    vllm_model:
      inline_tool_output_images: true

codex_agent:
  responses_api_agents:
    codex_agent:
      # A ceiling above every task's own agent budget (1800 s or more), as OpenCode's shipped config has; the
      # harness's default of 600 s would end the tasks early.
      timeout: 10800
