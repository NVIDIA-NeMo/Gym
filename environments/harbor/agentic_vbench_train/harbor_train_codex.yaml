# Training overlay for Agentic-VBench tasks on the Harbor task shape with the Codex harness. Pass it instead of
# `harbor_train.yaml`, which carries the OpenCode harness's block and so loads only with `--agent opencode_agent`, and
# list it in a NeMo RL run's `env.nemo_gym.config_paths` after the generated `run_config_codex_agent.yaml` (README).
#
# The server block and the capture store are `harbor_train.yaml`'s, key for key (a test keeps them equal). The
# harness block sets for Codex what that file sets for OpenCode, where Codex has the key: the capture opt-in, the
# time ceiling and the context budget. Codex needs no `image_input`; it needs the model server's switch below.
harbor_environment_server:
  environment_servers:
    harbor:
      secrets:
        NVINFERENCE_API_KEY: ${oc.env:NVINFERENCE_API_KEY,${oc.env:INFERENCE_API_KEY,null}}
      separate_verifier_for_artifacts: true
      max_concurrent_episodes: ${oc.select:agentic_vbench_concurrency,12}
      queue_timeout_seconds: 43200
      sandbox_ready_timeout_s: 1800

token_id_capture:
  enabled: true
  dir: ${oc.env:NEMO_GYM_TOKEN_ID_CAPTURE_DIR,/tmp/nemo_gym_token_id_captures}
  delta_records: true

# Codex looks at a frame with its `view_image` tool, which returns the image inside the tool result. Chat tool
# messages carry text only, so the conversion of that result refuses the request unless the model server sends the
# image on as an image part, which `vllm_model` can (and vLLM accepts). This block is for a `vllm_model` server
# named `policy_model` (`--model-type vllm_model`); leave it out with a server that takes Responses natively.
policy_model:
  responses_api_models:
    vllm_model:
      inline_tool_output_images: true

codex_agent:
  responses_api_agents:
    codex_agent:
      token_id_capture: true
      # A ceiling: each row's agent_timeout_sec (the task's [steps.agent].timeout_sec) applies.
      timeout: 1800
      # The policy's real context, under the same key as the OpenCode overlay. Codex compacts below it at its own
      # default threshold, and a compaction call is a model call of its own, which a training framework cannot
      # join to the scored chain: give the policy its whole training context. Codex has no per-call output key;
      # the model server's limit applies.
      model_context_window: ${oc.select:agentic_vbench_context_tokens,49152}
