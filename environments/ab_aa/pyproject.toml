[project]
name = "automationbench-aa-gated-env"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "automation-bench @ git+https://github.com/zapier/AutomationBench.git@4a8e106",
]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["automationbench_aa_gated_env"]
