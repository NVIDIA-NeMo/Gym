# Model-free baseline: the suite's generator and then its ranked metric and gates, repeated until the budget runs out, no model.
rna_design_fixed:
  responses_api_agents:
    rna_design_agent:
      entrypoint: app.py
      domain: agent
      description: "RNA inverse folding baseline: a fixed generate-and-score cycle, no model."
      value: Improve RNA design with tool use.
      model_server:
        type: responses_api_models
        name: policy_model
      arm: fixed
      worker_python: ${oc.env:RNA_WORKER_PYTHON,null}
      max_tokens: 8192
      rollout_timeout_s: 3600
      max_concurrent_rollouts: 8
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/rna_design/data/example.jsonl

rna_design_fixed_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: rna_design_fixed
