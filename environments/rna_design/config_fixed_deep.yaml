# Model-free baseline: the fixed cycle plus every other scorer the suite offers, each round, until the budget runs out, no model.
rna_design_fixed_deep:
  responses_api_agents:
    rna_design_agent:
      entrypoint: app.py
      domain: agent
      description: "RNA inverse folding baseline: the fixed cycle plus every other scorer, no model."
      value: Improve RNA design with tool use.
      model_server:
        type: responses_api_models
        name: policy_model
      arm: fixed_deep
      worker_python: ${oc.env:RNA_WORKER_PYTHON,null}
      max_tokens: 8192
      rollout_timeout_s: 3600
      max_concurrent_rollouts: 8
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/rna_design/data/example.jsonl

rna_design_fixed_deep_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: rna_design_fixed_deep
