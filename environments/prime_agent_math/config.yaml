math_with_judge:
  resources_servers:
    math_with_judge:
      entrypoint: app.py
      judge_model_server:
        type: responses_api_models
        name: policy_model
      judge_responses_create_params: {input: []}
      should_use_judge: false
      domain: agent
      verified: false
      description: Prime Agent harness with math tasks
      value: Improve math capabilities with Prime Agent

prime_agent_math_agent:
  responses_api_agents:
    prime_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: math_with_judge
      concurrency: 8
      command: prime-agent
      model: policy/${policy_model_name}
      prime_agent_version: 0.7.0
      timeout: 600
      system_prompt: |
        Use IPython to compute or verify results when helpful. Put the final answer in \boxed{}.
      models_config:
        providers:
          policy:
            baseUrl: ${policy_base_url}
            api: openai-completions
            apiKey: ${policy_api_key}
            compat:
              supportsDeveloperRole: false
              supportsReasoningEffort: false
            models:
            - id: ${policy_model_name}
              reasoning: false
      datasets:
      - name: train
        type: train
        jsonl_fpath: environments/prime_agent_math/data/train.jsonl
        huggingface_identifier:
          repo_id: nvidia/Nemotron-RL-math-OpenMathReasoning
          artifact_fpath: train.jsonl
        license: Creative Commons Attribution 4.0 International
      - name: validation
        type: validation
        jsonl_fpath: environments/prime_agent_math/data/validation.jsonl
        huggingface_identifier:
          repo_id: nvidia/Nemotron-RL-math-OpenMathReasoning
          artifact_fpath: validation.jsonl
        license: Apache 2.0
      - name: example
        type: example
        jsonl_fpath: environments/prime_agent_math/data/example.jsonl
