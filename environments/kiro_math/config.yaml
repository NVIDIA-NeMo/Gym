math_with_judge:
  resources_servers:
    math_with_judge:
      entrypoint: app.py
      judge_model_server:
        type: responses_api_models
        name: policy_model
      judge_responses_create_params: {input: []}
      should_use_judge: false
      domain: agent
      verified: false
      description: Kiro agent harness with math tasks
      value: Evaluate math capabilities with Kiro

kiro_math_agent:
  responses_api_agents:
    kiro_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: math_with_judge
      concurrency: 8
      command: kiro-cli
      api_key: ${oc.env:KIRO_API_KEY,""}
      model: ${oc.env:KIRO_MODEL,null}
      timeout: 900
      system_prompt: |
        Use tools to compute or verify results when helpful. Put the final answer in \boxed{}.
      datasets:
      - name: train
        type: train
        jsonl_fpath: environments/kiro_math/data/train.jsonl
        huggingface_identifier:
          repo_id: nvidia/Nemotron-RL-math-OpenMathReasoning
          artifact_fpath: train.jsonl
        license: Creative Commons Attribution 4.0 International
      - name: validation
        type: validation
        jsonl_fpath: environments/kiro_math/data/validation.jsonl
        huggingface_identifier:
          repo_id: nvidia/Nemotron-RL-math-OpenMathReasoning
          artifact_fpath: validation.jsonl
        license: Apache 2.0
      - name: example
        type: example
        jsonl_fpath: environments/kiro_math/data/example.jsonl
