math_with_judge:
  resources_servers:
    math_with_judge:
      entrypoint: app.py
      judge_model_server:
        type: responses_api_models
        name: policy_model
      judge_responses_create_params: {input: []}
      should_use_judge: false
      domain: math
      verified: false
      description: OpenMathReasoning evaluated with math-verify through NeMo Fabric and DeepAgents.
      value: Evaluate mathematical reasoning with DeepAgents.

nemo_fabric_deepagents_math_agent:
  responses_api_agents:
    nemo_fabric_agent:
      entrypoint: app.py
      description: Run any installed agent harness through the typed NeMo Fabric lifecycle.
      adapter_id: nvidia.fabric.langchain.deepagents
      resources_server:
        type: resources_servers
        name: math_with_judge
      model_server:
        type: responses_api_models
        name: policy_model
      model_provider: openai-compatible
      model: gym-policy-model
      model_api_key: local  # pragma: allowlist secret
      concurrency: 32
      timeout: 1800
      cwd: null
      harness_settings: {}
      fabric_config: {}
      system_prompt: |
        You are a precise math assistant. Use Python when it helps and put only the final answer in \boxed{}.
      datasets:
        - name: example
          type: example
          jsonl_fpath: environments/nemo_fabric_deepagents_math/data/example.jsonl
