name: nemo_fabric_deepagents_math
version: 0.1.0
experimental: true
kind: environment
integration_profile: custom-gym-agent-loop
domain: math
description: DeepAgents through NeMo Fabric on five OpenMathReasoning examples, answers
  graded with math-verify.
modality: text
licensing: unknown
authors:
- NVIDIA NeMo Gym contributors
maintainers:
- cmunley1
capabilities:
- reasoning
- reasoning/quantitative_reasoning
- reasoning/deductive_reasoning
- planning_and_autonomy
- planning_and_autonomy/self_verification
- knowledge
- knowledge/procedural_knowledge
domains:
- mathematics
requirements:
  gpu: false
  network: no-network
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: math_with_judge
agent_server: nemo_fabric_agent
datasets:
- name: example
  type: example
  jsonl_fpath: environments/nemo_fabric_deepagents_math/data/example.jsonl
  num_repeats: 1
model_server: policy_model
lifecycle: active
