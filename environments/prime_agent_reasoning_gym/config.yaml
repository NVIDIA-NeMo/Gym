reasoning_gym:
  resources_servers:
    reasoning_gym:
      entrypoint: app.py
      domain: agent
      verified: true
      description: Prime Agent harness with reasoning gym tasks
      value: Improve reasoning capabilities with Prime Agent

prime_agent_reasoning_gym_agent:
  responses_api_agents:
    prime_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: reasoning_gym
      model_server:
        type: responses_api_models
        name: policy_model
      concurrency: 8
      command: prime-agent
      model: ${policy_model_name}
      prime_agent_version: 0.7.0
      timeout: 600
      system_prompt: |
        Reason carefully and use IPython when helpful. Put only the final answer in \boxed{}.
      datasets:
      - name: train
        type: train
        jsonl_fpath: environments/prime_agent_reasoning_gym/data/train.jsonl
        license: Apache 2.0
      - name: example
        type: example
        jsonl_fpath: environments/prime_agent_reasoning_gym/data/example.jsonl
