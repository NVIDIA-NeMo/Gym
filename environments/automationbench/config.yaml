automationbench:
  responses_api_agents:
    verifiers_agent:
      entrypoint: app.py
      domain: other
      description: AutomationBench scored with the Artificial Analysis headline metric, guardrail-gated partial credit.
      value: Evaluate enterprise workflow automation capabilities
      model_server:
        type: responses_api_models
        name: policy_model
      model_name: ""
      vf_env_id: automationbench_env
      vf_env_args:
        max_turns: 50
        toolset: api
        # "aa_headline" (guardrail-gated AA metric) or "partial_credit" (upstream ungated fraction).
        # Both are always reported as metrics; this only picks which one carries the reward weight.
        reward_fn: aa_headline
      group_size: 1
      max_concurrent_generation: -1
      max_concurrent_scoring: -1
      max_tokens: 131072
      temperature: 1.0
      top_p: 1.0
      # Deadline for one request to the policy server. The openai SDK default
      # is 600s read/write with 2 retries. A single AutomationBench turn from a
      # large policy on a shared engine exceeds that under load: on a 116B
      # policy at 512 concurrent rollouts, 421/512 came back as empty
      # trajectories with `499 CLIENT DISCONNECTED` on the server side while
      # the same job at 120 concurrent had none. No retries: the SDK retries a
      # timed-out generation from scratch, spending 3x the deadline on the same
      # failure.
      client_timeout_s: 3600
      # Connect is separate. With no retries, a connection that does not
      # establish inside the SDK's 5s is a permanently aborted rollout, and a
      # validation pass fires every rollout at once into engines that have just
      # come up: on the 116B policy at 512 in flight, 196 of 300 step-0 rows
      # aborted with ConnectTimeout before their first model call. 60s lets
      # that burst queue in the server's accept backlog instead.
      client_connect_timeout_s: 60
      client_max_retries: 0
      datasets:
        - name: example
          type: example
          jsonl_fpath: environments/automationbench/data/example.jsonl
          license: MIT
        - name: validation
          type: validation
          jsonl_fpath: environments/automationbench/data/automationbench-600.jsonl
          license: MIT
