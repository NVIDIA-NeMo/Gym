# AutomationBench-Verified, api toolset, subprocess runtime.
# Source: https://github.com/xeophon/AutomationBench-Verified @ 6173254  (verifiers 0.3.1)
ab_verified:
  responses_api_agents:
    verifiers_agent:
      entrypoint: app.py
      domain: other
      description: AutomationBench-Verified on a Verifiers V1 taskset.
      value: Improve multi-step tool use and business workflow execution.
      model_server:
        type: responses_api_models
        name: policy_model
      verifiers:
        agent:
          max_turns: 50
          runtime:
            type: subprocess
        taskset:
          id: automationbench_env
          toolset: api
          task:
            tools:
              colocated: true
              mode: api
          domains: [sales, marketing, operations, support, finance, hr]
      group_size: 1
      max_concurrent_generation: -1
      max_concurrent_scoring: -1
      max_tokens: 16384
      temperature: 1.0
      top_p: 1.0
      datasets:
        - name: validation
          type: validation
          jsonl_fpath: environments/ab_verified/data/automationbench-600.jsonl
          license: MIT
