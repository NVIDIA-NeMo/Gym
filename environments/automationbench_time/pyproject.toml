[project]
name = "automationbench-time-env"
version = "0.1.0"
requires-python = ">=3.13"
# Scores with the same AutomationBench environment and assertion registry as benchmarks/automationbench.
dependencies = ["automationbench-env"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["automationbench_time_env"]
