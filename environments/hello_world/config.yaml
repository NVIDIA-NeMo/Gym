# Temporary end-to-end integration wiring.
# Environment authors should not copy or maintain this file; the planned
# `gym eval run --environment ...` path will generate this composition.
config_paths:
  - nemo_gym/sandbox/providers/docker/configs/docker.yaml

environment_routing_mode: taskset
tasksets:
  hello-world:
    task_input_contract: nemo_gym.single_agent.v1
environment_server_routes:
  hello-world: hello_world_environment_server

hello_world_resources_server:
  resources_servers:
    environment_adapter:
      entrypoint: app.py
      environment_root: environments/hello_world
      # Temporary: the adapter cannot build runtime/Dockerfile yet, so this
      # repeats its base image. This image includes Linux uv for Hermes.
      runtime_image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
      sandbox_provider: sandbox
      sandbox_config:
        ttl_s: 1800
        ready_timeout_s: 300
      trusted_environment_code: true
      domain: coding
      verified: false
      datasets:
        - name: hello-world
          type: validation
          jsonl_fpath: environments/hello_world/data/materialized.jsonl
          prepare_script: environments/hello_world/prepare.py
          num_repeats: 1
          license: Apache 2.0

hello_world_agent:
  responses_api_agents:
    hermes_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: hello_world_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      enabled_toolsets: [terminal]
      terminal_backend: local
      chat_template_kwargs_enabled: false
      max_turns: 10

hello_world_environment_server:
  environment_servers:
    single_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: hello_world_resources_server
      agent_server:
        type: responses_api_agents
        name: hello_world_agent
      task_input_contract: nemo_gym.single_agent.v1
      default_episode_timeout_seconds: 21600
      cleanup_timeout_seconds: 180
