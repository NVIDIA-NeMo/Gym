math_with_judge:
  resources_servers:
    math_with_judge:
      entrypoint: app.py
      judge_model_server:
        type: responses_api_models
        name: policy_model
      judge_responses_create_params: {input: []}
      should_use_judge: false
      domain: math
      verified: false
      description: Codex agent harness on DAPO-Math-17k with math-verify
      value: Evaluate math reasoning in the Codex agent harness

codex_math_agent:
  responses_api_agents:
    codex_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: math_with_judge
      concurrency: 8
      model: ${policy_model_name}
      openai_api_key: ${policy_api_key}
      openai_base_url: ${policy_base_url}
      sandbox_mode: danger-full-access
      timeout: 900
      codex_version: 0.144.4
      system_prompt: |
        You are a precise math assistant with a shell. Run Python to calculate or verify numeric results when helpful.
        Put the final answer, and only the final answer, inside \boxed{}.
      datasets:
      - name: example
        type: example
        jsonl_fpath: environments/codex_math/data/example.jsonl
      - name: train
        type: train
        jsonl_fpath: environments/codex_math/data/dapo17k_train.jsonl
        gitlab_identifier:
          dataset_name: dapo17k
          version: 0.0.1
          artifact_fpath: dapo17k_train.jsonl
        license: Apache 2.0
