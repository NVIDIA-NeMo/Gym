# NeMo UserSim environment composition. Preparation materializes canonical resolved episode rows.
config_paths:
  - resources_servers/nemo_user_sim/configs/usersim.yaml

environment_server_routes:
  "usersim:validation": usersim_environment

prepare_script_args:
  policy_model_name: ${policy_model_name}
  support_model_name: ${support_model_name}

nemo_user_sim_resources:
  resources_servers:
    usersim:
      datasets:
        - name: example
          type: example
          jsonl_fpath: resources_servers/nemo_user_sim/data/example.jsonl
          taskset: nemo_user_sim:example
          num_repeats: 1
          license: Apache 2.0
        - name: usersim_validation
          type: validation
          jsonl_fpath: environments/usersim/data/validation.jsonl
          taskset: usersim:validation
          num_repeats: 1
          license: Apache 2.0
        - name: usersim
          type: benchmark
          jsonl_fpath: environments/nemo_user_sim/data/usersim.jsonl
          prepare_script: environments/nemo_user_sim/prepare.py
          taskset: usersim:benchmark
          prompt_config: null
          num_repeats: 1
          license: NVIDIA Evaluation Dataset License Agreement
