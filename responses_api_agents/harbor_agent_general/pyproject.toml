[project]
name = "harbor-agent-general"
version = "0.1.0"
requires-python = ">=3.13.14"
dependencies = [
    "nemo-gym[dev]",
    "harbor>=0.22",
]

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools"]

[tool.setuptools.packages.find]
where = [".."]
include = ["harbor_agent_general"]

[tool.uv]
sources.nemo-gym = { path = "../..", editable = true }
