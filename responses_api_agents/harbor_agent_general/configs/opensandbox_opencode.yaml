harbor_agent_general:
  responses_api_agents:
    harbor_agent_general:
      entrypoint: app.py
      domain: agent
      description: Harbor integration for agent harnesses with OpenSandbox environments.

      # Native harbor.models.job.config.JobConfig fields.
      job:
        jobs_dir: ${harbor_jobs_dir}

        ##
        # Follows harbor.models.job.config:DatasetConfig spec.
        #
        datasets:
          - path: ${harbor_dataset_path}

        ##
        # Follows harbor.models.trial.config:EnvironmentConfig spec.
        #
        environment:
          import_path: responses_api_agents.harbor_agent_general.envs.opensandbox:OpenSandboxEnvironment
          kwargs:
            # Harbor reads OPENSANDBOX_DOMAIN and OPENSANDBOX_API_KEY from the worker environment.
            protocol: https
            # Opt out only for clusters whose certificates are not trusted locally.
            tls_verify: false

        ##
        # Follows harbor.models.trial.config:AgentConfig spec.
        #
        agents:
          - name: opencode
            ## TIP: Directly use Gym's native expected variable name.
            model_name: ${policy_model_name}
            ##
            # TIP: Escape $ so that secret variables are not exposed in the written Harbor configuration, and resolved directly within Harbor.
            # If the variables are unlikely to change and exposure is not a concern, use immediate resolution via Hydra. e.g. ${oc.env:NVINF_API_KEY}
            #
            # env:
              # MY_ENV: \${MY_ENV}

        ##
        # Follows harbor.models.trial.config:VerifierConfig spec.
        #
        # verifier:
        #   disable: false

harbor_agent_general_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: harbor_agent_general
