langchain_deepagents_agent:
  responses_api_agents:
    langchain_deepagents_agent:
      entrypoint: reasoning_search_agent.py
      resources_server:
        type: resources_servers
        name: ???
      model_server:
        type: responses_api_models
        name: policy_model
      tavily_api_key: ${tavily_api_key}
      max_search_results: 5
      # nvidia/nemotron-3-ultra-550b-a55b's actual enforced limit (OpenRouter's `top_provider.context_length`,
      # not the larger nominal `context_length: 262144` — top_provider is what the routed provider actually
      # enforces). Update this if policy_model_name changes to point at a different model.
      max_input_tokens: 202800
