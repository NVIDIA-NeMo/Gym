agent:
  type: mimocode-agent
  tools:
    - tool: bash
      config:
        timeout: 60
        max_timeout: 300
        # MiMo-Code's output budget: only the tail within these limits reaches
        # the model. Observation size is bounded by the tools, not by the
        # agent's max_observation_length (0 for this catalogue).
        # max_output_lines: 2000
        # max_output_bytes: 51200
    - tool: read
      # config:
      #   max_output_bytes: 51200   # MiMo-Code's 50 KB read cap
    - tool: write
    - tool: edit
    - tool: grep
    - tool: glob
    - tool: task
    # Optional blocking child actor. Omit it (the default) for single-agent RL.
    # When enabled, concurrent actor.run children are capped by
    # agent.actor_max_concurrency (default 1, blocking wait).
    # - tool: actor
  # actor_max_concurrency: 1
  step_limit: 500

model:
  model_name: "${MIMOAGENT_MODEL_NAME:-gpt-5}"
  protocol: "chat"
  model_kwargs:
    base_url: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
    api_key: "${OPENAI_API_KEY:-}"
