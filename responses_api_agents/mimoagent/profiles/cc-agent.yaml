agent:
  type: cc-agent
  tools:
    - tool: "Bash"
      config:
        timeout: 60       # seconds (schema advertises ms to the model)
        max_timeout: 300
    - tool: "Read"
      # Optional images (png/jpg/jpeg/gif/webp); requires a vision model and
      # a gateway that accepts image attachments in tool results.
      # config:
      #   enable_media: true
      #   max_image_bytes: 5242880
    - tool: "Write"
    - tool: "Edit"
    - tool: "Grep"
    - tool: "Glob"
    - tool: "Agent"
    - tool: "Compact"

  # Context-usage signal + compaction sizing (see mimoagent.compaction).
  compaction_context_window: 100000
  compaction_buffer_tokens: 10000
  show_context_usage: true
  context_usage_warn_fraction: 0.8

  # Runtime anti-reward-hacking guard (agents/antihack.py). Default off;
  # enable per-run. Patterns can be overridden here as lists.
  # antihack:
  #   enabled: true

  system_template: |
    You are an agent, your current working directory is {{cwd}}.

    You can use the tools available to you to interact with the computer to assist the user in completing tasks.

  instance_template: |
    Fix the following issue:

    {{task}}

  step_limit: 500

model:
  model_name: "${MIMOAGENT_MODEL_NAME:-gpt-5}"
  protocol: "chat"
  model_kwargs:
    base_url: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
    api_key: "${OPENAI_API_KEY:-}"
    temperature: 1.0
