# Docker sandbox provider, on the host network.
#
# Use this INSTEAD OF nemo_gym/sandbox/providers/docker/configs/docker.yaml for ViBench.
#
# Why: the harness inside the sandbox is told to reach the policy model at
# `get_server_url(model_server)`, which resolves to http://127.0.0.1:<port> (see
# nemo_gym/server_utils.py get_server_url, used by opencode_sandboxed_agent). Inside a
# bridged container 127.0.0.1 is the container itself, so the model is unreachable and the
# harness silently makes zero LLM calls -- the OpenCode session exports with
# `"tokens": {"input": 0, "output": 0}` and an empty app. Sharing the host network namespace
# makes 127.0.0.1:<port> mean the same thing in both places. Same lever as the example in
# NVIDIA-NeMo/Gym#2082.
#
# Trade-off: `network: host` drops network isolation for a container running model-written
# code -- it can reach anything the host can, including other Gym servers and the Docker
# daemon's other containers. Acceptable on a disposable single-tenant benchmark box; do not
# use it on a shared or credentialed host. A provider whose sandboxes have their own
# routable address (OpenSandbox) does not need this.
sandbox:
  default_metadata:
    sandbox-api: docker-cli
  docker:
    create:
      keepalive_shell: /bin/sh
      keepalive_cmd: "while :; do sleep 2147483647; done"
      start_timeout_s: 600
      use_init: true
      apply_resource_limits: true
      publish_host: 127.0.0.1
      network: host
    exec:
      # ViBench builds a whole app in one exec; the stock 180s default kills long installs.
      default_timeout_s: 5400
      concurrency: 32
    probe:
      command: printf docker-sandbox-ready
      expected_stdout: docker-sandbox-ready
      timeout_s: 30
      deadline_s: 60
      stable_count: 1
