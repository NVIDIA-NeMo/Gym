finance_agent:
  responses_api_agents:
    finance_agent:
      entrypoint: app.py
      # Loop policy mirroring vals-ai/finance-agent: bounded by turns rather than
      # wall clock, and every tool error is handed back to the model.
      no_tool_call_nudge: Continue.
      # Keep declared: overlays merged in OmegaConf struct mode cannot add a key
      # that is absent here, and the app's own default is invisible to config
      # composition. Removing this line breaks such overlays with a hard error.
      continue_if_not_tool_call: true
      max_time_seconds: null
      abort_on_tool_error_types: []
      max_steps: 50
      truncate_on_overflow: false
      tool_call_timeout: 300
      resources_server:
        type: resources_servers
        name: ???
      model_server:
        type: responses_api_models
        name: policy_model
