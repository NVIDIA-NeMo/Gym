anyterminal_openclaw:
  responses_api_agents:
    anyterminal_agent:
      entrypoint: app.py
      domain: coding
      description: Terminal Bench run by OpenClaw natively inside the task container.
      value: Evaluate terminal-task capabilities on Terminal Bench with any Gym agent.

      agent_server_module: responses_api_agents.openclaw_agent.app
      agent_server_class: OpenClawAgent
      agent_config_class: OpenClawAgentConfig
      agent_kwargs:
        model: model
        openclaw_version: "2026.6.35"
        timeout: 3600
        setup_timeout: 1200
        thinking: "off"
        node_bin_dir: "/agent_deps_mount/bin"
        openclaw_config:
          agents:
            defaults:
              workspace: "."
              # Terminal-Bench supplies the complete task in the user turn. Do not create or
              # inject OpenClaw's generic workspace bootstrap files or startup-memory prelude;
              # their fixed prompt can exhaust a training model's input budget before the first
              # policy call.
              skipBootstrap: true
              contextInjection: never
              startupContext:
                enabled: false
              # OpenClaw defaults to a 20k-token compaction reserve, which leaves no usable
              # prompt budget for the 15,872-token training context. Keep one policy turn in
              # reserve and avoid an extra agentic memory-flush call before compaction.
              compaction:
                reserveTokens: 4096
                reserveTokensFloor: 4096
                keepRecentTokens: 4096
                memoryFlush:
                  enabled: false
                postCompactionSections: []
              # Terminal commands such as package installation can emit tens of thousands of
              # characters. Bound each retained result so a single tool call cannot force an
              # otherwise healthy rollout through compaction.
              contextLimits:
                toolResultMaxChars: 4000
              # An explicit empty filter removes bundled skills from both discovery and the
              # system prompt. The global zero limits below defend the same invariant if the
              # selected agent id cannot be resolved and the filter fallback changes upstream.
              skills: []
          skills:
            limits:
              maxSkillsInPrompt: 0
              maxSkillsPromptChars: 0
          # The terminal harness only uses the built-in exec tool. Loading unrelated browser,
          # canvas, memory, phone, and voice plugins adds startup latency and prompt material.
          plugins:
            enabled: false
          tools:
            # Keep the initial tool schema below the policy context limit. Terminal-Bench only
            # needs a shell; the broad coding profile also enables web, memory, sessions, cron,
            # media, and planning tools whose schemas can overflow before the first model call.
            profile: minimal
            alsoAllow:
              - exec
            deny:
              - session_status

      container_formatter: "docker://{docker_image}"

      concurrency: 6

      model_server:
        name: policy_model
        type: responses_api_models

      datasets:
        - name: example
          type: example
          jsonl_fpath: responses_api_agents/anyterminal_agent/data/terminal_bench.jsonl

anyterminal_openclaw_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: anyterminal_openclaw
