anyterminal_hermes:
  responses_api_agents:
    anyterminal_agent:
      entrypoint: app.py
      domain: coding
      description: Terminal Bench run by the Hermes agent inside the task container.
      value: Evaluate terminal-task capabilities on Terminal Bench with any Gym agent.

      agent_server_module: responses_api_agents.hermes_agent.app
      agent_server_class: HermesAgent
      agent_config_class: HermesAgentConfig
      # Hermes accepts temperature on the request; max_output_tokens is adapted
      # to its max_tokens config and unsupported fields such as top_p are omitted.
      agent_request_sampling_fields:
        - temperature
      agent_kwargs:
        model: model
        max_turns: 90
        terminal_backend: local
        terminal_timeout: 180
        compression_enabled: true
        compression_threshold: 0.85

      container_formatter: "docker://{docker_image}"

      concurrency: 6

      model_server:
        name: policy_model
        type: responses_api_models

      datasets:
        - name: example
          type: example
          jsonl_fpath: responses_api_agents/anyterminal_agent/data/terminal_bench.jsonl

anyterminal_hermes_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: anyterminal_hermes
