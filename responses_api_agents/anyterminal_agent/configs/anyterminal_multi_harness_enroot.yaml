config_paths:
  - responses_api_agents/anyterminal_agent/configs/anyterminal_multi_harness.yaml
  - nemo_gym/sandbox/providers/enroot/configs/enroot.yaml

# These benchmark images need their normal container filesystem mounted before
# Enroot resolves /dev/null; the provider documents this override for coding images.
sandbox:
  enroot:
    create:
      bypass_entrypoint: false

anyterminal_opencode:
  responses_api_agents:
    anyterminal_agent:
      sandbox_provider: sandbox

anyterminal_openclaw:
  responses_api_agents:
    anyterminal_agent:
      sandbox_provider: sandbox

anyterminal_pi:
  responses_api_agents:
    anyterminal_agent:
      sandbox_provider: sandbox

anyterminal_hermes:
  responses_api_agents:
    anyterminal_agent:
      sandbox_provider: sandbox
