[project]
name = "automationbench_env"
version = "0.1.0"
description = "Zapier AutomationBench business workflows with task-scoped, structured API discovery and execution."
requires-python = ">=3.12"
tags = ["multi-turn", "tool-use", "v1"]
license-files = ["AUTOMATIONBENCH_LICENSE"]
dependencies = [
    "verifiers>=0.3.0,<0.4",
    "datasets",
    "mcp<2",
    "pydantic>=2.13.4",
    "openai>=2.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["automationbench", "automationbench_env"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
