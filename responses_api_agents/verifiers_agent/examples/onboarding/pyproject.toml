[project]
name = "gym-legacy-verifiers-onboarding"
version = "0.1.0"
description = "Local one-task onboarding control for NeMo Gym's legacy Verifiers adapter"
requires-python = ">=3.13.14,<3.14"
license = "Apache-2.0"
dependencies = ["verifiers==0.1.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gym_legacy_verifiers_onboarding"]
