openclaw_agent:
  responses_api_agents:
    harness_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: ???
      concurrency: 32
      agent: openclaw
      agent_kwargs:
        model:
          model: nvinf/nvidia/meta/llama-3.3-70b-instruct
          provider: nvinf
        timeout_seconds: 900
        settings:
          command: openclaw
          openclaw_agent_id: main
          thinking: "off"
          openclaw_config:
            models:
              providers:
                nvinf:
                  api: openai-completions
                  baseUrl: https://integrate.api.nvidia.com/v1
                  apiKey: ${policy_api_key}
                  models:
                    - id: nvidia/meta/llama-3.3-70b-instruct
                      name: nvidia/meta/llama-3.3-70b-instruct
                      api: openai-completions
      sandbox_provider:
        local: {}
      sandbox_image: ""
      setup_commands:
        - command -v openclaw || npm install -g 'openclaw@2026.6.11'
      rollout_timeout: 900
