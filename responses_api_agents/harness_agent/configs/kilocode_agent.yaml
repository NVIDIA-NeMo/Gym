kilocode_agent:
  responses_api_agents:
    harness_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: ???
      model_server:
        type: responses_api_models
        name: policy_model
      concurrency: 8
      agent: kilocode
      agent_kwargs:
        model:
          model: ${policy_model_name}
          base_url: __SANDBOX_MODEL_URL__/v1
          settings:
            context_window: 32768
            max_output_tokens: 8192
            reasoning_field: reasoning_content
        timeout_seconds: 900
        settings:
          command: kilo
          setup_timeout: 900
          thinking: false
          kilo_config:
            permission:
              bash: allow
              edit: allow
              webfetch: allow
      sandbox_provider:
        local: {}
      sandbox_image: ""
      setup_commands:
        - command -v kilo || npm install -g '@kilocode/cli@7.4.15'
      rollout_timeout: 900
