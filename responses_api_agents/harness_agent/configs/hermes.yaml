hermes_harness:
  responses_api_agents:
    harness_agent:
      entrypoint: app.py
      agent: hermes
      concurrency: 4
      resources_server:
        type: resources_servers
        name: ???
      model_server:
        type: responses_api_models
        name: policy_model
      token_id_capture: false
      sandbox_provider: sandbox
      sandbox_model_base_url: ${oc.env:NEMO_GYM_SANDBOX_MODEL_BASE_URL,null}
      sandbox_python: /work/hermes-venv/bin/python
      rollout_timeout: 10800
      setup_commands:
        - bash /work/gym_mount/responses_api_agents/hermes_agent/scripts/setup_harness.sh
      agent_kwargs:
        model: ${policy_model_name}
        api_key: dummy
        terminal_backend: local
        max_turns: 90
        max_tokens: null
        chat_template_kwargs_enabled: false
        token_id_capture: false
      datasets: []
