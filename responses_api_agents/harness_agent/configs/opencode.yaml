harness_benchmark_agent:
  responses_api_agents:
    harness_agent:
      agent: opencode
      agent_kwargs:
        model: benchmark-model
        opencode_version: 1.17.11
        timeout: 14400
        context_window: 262144
        max_output_tokens: 262144
        output_token_policy: remaining_context
        opencode_config:
          instructions: [/tmp/nemo-gym-environment.txt]
          compaction:
            auto: false
            prune: false
          agent:
            build:
              steps: 400
          provider:
            nemo:
              options:
                timeout: false
                chunkTimeout: 14400000
          permission:
            '*': allow
            webfetch: deny
            websearch: deny
            task: deny
      sandbox_spec:
        env:
          OPENCODE_DISABLE_AUTOUPDATE: '1'
          OPENCODE_DISABLE_SHARE: '1'
          OPENCODE_DISABLE_MODELS_FETCH: 'true'
        files:
          /tmp/nemo-gym-environment.txt: |
            Internet access is disabled on this machine.
