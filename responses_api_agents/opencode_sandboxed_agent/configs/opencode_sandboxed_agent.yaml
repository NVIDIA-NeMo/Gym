opencode_sandboxed_agent:
  responses_api_agents:
    opencode_sandboxed_agent:
      entrypoint: app.py
      num_workers: 4
      resources_server:
        type: resources_servers
        name: ???
      model_server:
        type: responses_api_models
        name: policy_model
      token_id_capture: true

      debug: false

      # @bxyu-nvidia: This needs to be set appropriately for every model!
      opencode_max_context_window: 262144

      opencode_model_call_timeout: 3600000  # In milliseconds e.g. 600000 is 10min. Leave null for no timeout. Default to 1hr

      remote_opencode_install_script_path: null
      remote_opencode_binary_path: null
      remote_opencode_musl_binary_path: null
      # Optional host-local rg executable to upload for network-restricted sandboxes.
      local_ripgrep_binary_path: null

      # Drop auto-compaction summaries from the converted output items. Only matters for verifiers
      # that grade the last assistant message (an answer judge); a patch-graded benchmark wants the
      # full transcript, so this stays off here and is enabled per-benchmark.
      exclude_compaction_summaries: false

      # Extra environment for the `opencode run` process inside the sandbox. Hydra configs are
      # struct-locked, so every key a benchmark may set has to be declared here first. An empty
      # value is dropped rather than exported (see _resolve_opencode_env), so these defaults are
      # inert for benchmarks that do not set them.
      opencode_env:
        # Gates opencode's builtin websearch tool: tool/registry.ts hides it unless the provider id
        # is "opencode" or this is set, and ours is "nemo_gym".
        OPENCODE_ENABLE_EXA: ""
        OPENCODE_WEBSEARCH_PROVIDER: ""
        # A ':'-separated pool, collapsed to one EXA_API_KEY per row by hashing the question.
        EXA_API_KEYS: ""
        EXA_API_KEY: ""
        # Read by the plugins; see plugins/ for what each does.
        NEMO_GYM_MAX_TURNS: ""
        NEMO_GYM_DISABLE_SUBAGENTS: ""
        OPENCODE_EXPERIMENTAL_OUTPUT_TOKEN_MAX: ""
        NEMO_GYM_EXA_LIVECRAWL: ""
        NEMO_GYM_MAX_TURNS_GRACE: ""
        NEMO_GYM_CONTAMINATION_GUARD: ""
        # "0" leaves opencode's own bash in place instead of the guarded shadow, so an
        # unguarded-bash A/B arm costs one env var. Any other value (or unset) guards it.
        NEMO_GYM_BASH_GUARD: ""
        # "1" removes bash from the request's tool map entirely, which is a stronger statement
        # than NEMO_GYM_BASH_GUARD above: guarding filters what bash fetches, this denies the
        # route. Read by nemo_gym_turn_budget.js rather than a plugin of its own, because the
        # turn cap replaces the tool map with a Proxy that has no own keys -- a second plugin
        # doing Object.assign over it would silently re-enable every tool at the cap.
        NEMO_GYM_DISABLE_BASH: ""
        # "1" strips the two lines of grep's stock description that point at bash and at Task.
        # Only useful alongside NEMO_GYM_DISABLE_BASH: with bash gone they are dead references,
        # and grep is the documented recovery path for tool output spilled to disk.
        NEMO_GYM_FIX_GREP_DESCRIPTION: ""
        OPENCODE_WEBSEARCH_EXCLUDE_DOMAINS: ""
        NEMO_GYM_COMPACTION_CONTINUE: ""
        NEMO_GYM_COMPACTION_CONTINUE_TEXT: ""
        NEMO_GYM_EXA_SEARCH_TYPE: ""
        NEMO_GYM_EXA_NUM_RESULTS: ""
        NEMO_GYM_EXA_MAX_CHARS: ""
        # Transport switch for nemo_gym_web_guard.js, with the fork's semantics: UNSET routes
        # websearch through Exa's MCP endpoint (what every published legacy arm used); setting it
        # routes through REST with that `type`, which is the only way to reach the deep modes.
        OPENCODE_WEBSEARCH_TYPE: ""
        # Points websearch/webfetch at a Gym-side caching proxy instead of mcp.exa.ai.
        # Injected per rollout by _resolve_opencode_env when the search server has a cache
        # root configured; unset means straight to Exa, byte-identical to today.
        NEMO_GYM_EXA_BASE_URL: ""

      # Feed the question to `opencode run` on stdin instead of as an argv message. run.ts
      # re-quotes an argv message containing spaces, which corrupts natural-language prompts.
      opencode_query_via_stdin: false

      # Plugin .js files (under responses_api_agents/opencode_sandboxed_agent/plugins/) uploaded
      # into the sandbox and registered with opencode. This is how behaviour is changed without
      # rebuilding the binary. Empty by default; benchmarks opt in.
      # nemo_gym_sentinel.js must be FIRST whenever any plugin is used: app.py refuses to score a
      # rollout whose stderr lacks its marker, because opencode swallows plugin load failures.
      opencode_plugins: []

      # Taken from https://github.com/sdevare-nv/nv-opencode/blob/f261004b4e4269a6e193fd242e5ec8ced9a7aec0/packages/opencode/src/bench/cli.ts#L198-L325
      opencode_config:
        # Declared-but-unset knobs. Same struct-lock reason as opencode_env above: a benchmark that
        # _inherit_from's this agent can only override keys that ALREADY EXIST here — a brand-new
        # key fails the config merge with "Key '<name>' is not in struct". _create_opencode_config
        # drops null/"" leaves before serialising, so an unset placeholder never reaches opencode and
        # these are byte-inert for benchmarks that do not set them.
        # Plugin list is populated by app.py from opencode_plugins; declared so the struct lock
        # permits it and a benchmark could add an extra entry.
        plugin: null

        agent:
          title:
            # Saves one model call per rollout. _create_opencode_config sets this too; restated here
            # so a benchmark can address agent.title at all without tripping the struct lock.
            disable: true
          build:
            # Replaces opencode's built-in (software-engineering) system prompt outright
            # (llm/request.ts prepare(): agent.prompt wins over SystemPrompt.provider(model)).
            prompt: ""
            # Soft cap: at step >= steps opencode appends a "respond with text only" nudge every
            # turn (prompt.ts isLastStep). It does not break the loop.
            steps: null
          compaction:
            # Replaces the summariser turn's system prompt; cannot change the summary template,
            # which arrives as the user turn.
            prompt: ""
        compaction:
          # Compaction fires at model.limit.input - reserved; reserved defaults to
          # min(20000, maxOutputTokens), i.e. 242144 at the default 262144 window.
          auto: null
          prune: null
          tail_turns: null
          preserve_recent_tokens: null
          reserved: null

        permission:
          "*": allow
          webfetch: deny
          websearch: deny
          skill: deny

          edit:
            "**": allow

          bash:
            "*": allow

            # process termination
            "*killall*": deny
            "*pkill*": deny
            "*kill -1*": deny
            "*kill 0*": deny

            # filesystem destruction
            "*rm -rf /": deny
            "*rm -rf /*": deny
            "*rm -rf /bin*": deny
            "*rm -rf /usr*": deny
            "*rm -rf /etc*": deny
            "*rm -rf /var*": deny
            "*rm -rf /home*": deny
            "*rm -rf /root*": deny
            "*rm -rf /opt*": deny
            "*rm -rf /lib*": deny
            "*rm -rf /lib64*": deny
            "*rm -rf /sbin*": deny
            "*rm -rf /boot*": deny
            "*rm -rf /dev*": deny
            "*rm -rf /proc*": deny
            "*rm -rf /sys*": deny

            # system control
            # "*shutdown*": deny
            # "*reboot*": deny
            # "*poweroff*": deny
            # "*halt*": deny
            # "init 0*": deny
            # "init 6*": deny

            # disk devices
            "dd *of=/dev/sd*": deny
            "dd *of=/dev/nvme*": deny
            "dd *of=/dev/hd*": deny
            "dd *of=/dev/null*": deny

            # git network
            "*git fetch*": deny
            "*git pull*": deny
            "*git clone*": deny
            "*git ls-remote*": deny
            "*git remote add*": deny
            "*git remote set-url*": deny
            "*git remote set-head*": deny
            "*git remote update*": deny
            "*git remote rename*": deny
            "*git remote set-branches*": deny
            "*git submodule add*": deny
            "*git submodule update*": deny
            "*git submodule sync*": deny
            "*git submodule init*": deny
            "*git archive*--remote*": deny
            "*git *://*": deny
            "*git *@*:*": deny

            # git history mining
            "*git log*--all*": deny
            "*git log*--branches*": deny
            "*git log*--remotes*": deny
            "*git log*--walk-reflogs*": deny
            "*git log*--grep*": deny
            "*git rev-list*--all*": deny
            "*git rev-list*--branches*": deny
            "*git rev-list*--remotes*": deny
            "*git rev-list*--grep*": deny
            "*git shortlog*--all*": deny
            "*git reflog*": deny
            "*git cat-file*": deny
            "*git fsck*": deny
            "*git verify-pack*": deny
            "*git unpack-objects*": deny
            "*git cherry*": deny
            "*git show*": deny
            "*git merge-base*--is-ancestor*": deny
            "*git branch*--contains*": deny
            "*git tag*--contains*": deny
            "*git for-each-ref*--contains*": deny

            # git internals (substring match on path)
            "*.git/logs*": deny
            "*.git/packed-refs*": deny
            "*.git/ORIG_HEAD*": deny
            "*.git/FETCH_HEAD*": deny
            "*.git/refs*": deny

            # online lookups
            "*curl *github.com*": deny
            "*wget *github.com*": deny
            "*curl *githubusercontent.com*": deny
            "*wget *githubusercontent.com*": deny
            "*curl *github.io*": deny
            "*wget *github.io*": deny


      sandbox_timeout: 10800  # 3hr default for harness execution

      sandbox_provider: sandbox
      sandbox_config:
        ttl_s: 18000
        ready_timeout_s: 1200
        env:
          # execd holds each finished command's response open for this long (default 1s);
          # a short grace keeps every command and the readiness probe from paying that tail.
          EXECD_API_GRACE_SHUTDOWN: "50ms"
        resources:
          cpu: 0.25
          memory_mib: 512
          # 30 GiB works on every provider: within Fargate's 21-200 GiB ephemeral range
          # (an explicit 20 is rejected there) and fine as an ephemeral request elsewhere.
          disk_gib: 30
        provider_options: {}
        metadata:
          benchmark: swebench-verified
          harness: mini-swe-agent

      datasets: []
