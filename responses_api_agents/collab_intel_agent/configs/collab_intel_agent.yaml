collab_intel_agent:
  responses_api_agents:
    collab_intel_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: ???
      model_server:
        type: responses_api_models
        name: policy_model
      data_root: benchmarks/collab_intel/data/repo
