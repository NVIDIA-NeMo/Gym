# Deprecated legacy relay path: cvdp_agent runs Claude Code in a sandbox of its own behind legacy_agent.
# Use resources_servers/cvdp/configs/cvdp_agentic_claude_code.yaml, where the cvdp resources server lends the task
# sandbox to claude_code_agent through an agent session. This config stays for existing runs, and as the base of
# cvdp_agent_heavy_claude.yaml: heavy-agentic repository tasks have no session config yet.
cvdp_agent_generic_claude:
  responses_api_agents:
    cvdp_agent:
      entrypoint: app.py
      simple_agent: false
      resources_server: {type: resources_servers, name: cvdp}
      model_server: {type: responses_api_models, name: policy_model}
      concurrency: 4
      timeout: 900

      datasets:
      - name: example_agentic
        type: example
        jsonl_fpath: resources_servers/cvdp/data/example_agentic.jsonl

      # the harness: swap these three + setup_scripts/<key>_deps.sh to change agent
      agent_server_module: responses_api_agents.claude_code_agent.app
      agent_server_class: ClaudeCodeAgent
      agent_config_class: ClaudeCodeAgentConfig
      agent_kwargs:
        model: ${anthropic_model_name}
        max_turns: 30

      # Apptainer default. Override sandbox_provider for another backend.
      image: ${cvdp_sim_image}
      sandbox_provider:
        apptainer:
          create:
            mount_point: /code
            # Hide host temporary directories, home, CWD, and site-wide filesystem binds.
            extra_start_args: [--writable-tmpfs, --containall, --no-mount, "hostfs,bind-paths,cwd"]
      container_workdir: /code
      deps_provision: archive

cvdp_agent_generic_claude_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: cvdp_agent_generic_claude
