cvdp_agent_generic_claude:
  responses_api_agents:
    cvdp_agent:
      entrypoint: app.py
      simple_agent: false
      resources_server: {type: resources_servers, name: cvdp}
      model_server: {type: responses_api_models, name: policy_model}
      concurrency: 4
      timeout: 900

      datasets:
      - name: example_agentic
        type: example
        jsonl_fpath: resources_servers/cvdp/data/example_agentic.jsonl

      agent: claude_code
      agent_kwargs:
        model:
          model: ${anthropic_model_name}
        max_turns: 30
        timeout_seconds: 900
        workspace: /code

      # Apptainer default. Override sandbox_provider for another backend.
      image: ${cvdp_sim_image}
      sandbox_provider:
        apptainer:
          create:
            mount_point: /code
            extra_start_args: [--writable-tmpfs]
      container_workdir: /code
      deps_provision: archive
