# Provider-neutral mini-swe-agent 2 config.
#
# `sandbox_provider` names the sandbox to use; its config lives in a separate
# provider file, so swapping providers is swapping that path in `+config_paths`:
#
#   AGENT=responses_api_agents/mini_swe_agent_2/configs/mini_swe_agent_2.yaml
#   MODEL=responses_api_models/vllm_model/configs/vllm_model.yaml
#   gym env start \
#       --config $AGENT \
#       --config nemo_gym/sandbox/providers/opensandbox/configs/opensandbox.yaml \
#       --config $MODEL
mini_swe_agent_2:
  responses_api_agents:
    mini_swe_agent_2:
      entrypoint: app.py
      domain: coding
      description: Software engineering tasks driven by mini-swe-agent harness on a Gym sandbox.
      value: Improve agentic software engineering capabilities.
      model_server:
        type: responses_api_models
        name: policy_model
      concurrency: 64
      # Declared (empty) so benchmark configs can inherit this server config and
      # fill in their dataset list; the config merge rejects undeclared keys.
      datasets: []
      env: sandbox
      # Name of the sandbox to use; include a provider config that defines a
      # `sandbox` block (e.g. nemo_gym/sandbox/providers/opensandbox/configs/opensandbox.yaml).
      sandbox_provider: sandbox
      sandbox_spec:
        ttl_s: 18000
        ready_timeout_s: 1200
        # Limits (burst ceiling); memory-spiky test suites OOM-kill below this.
        resources:
          cpu: 2
          memory_mib: 8192
          # 30 GiB works on every provider: within Fargate's 21-200 GiB ephemeral range
          # (an explicit 20 is rejected there) and fine as an ephemeral request elsewhere.
          disk_gib: 30
        provider_options:
          # Scheduling requests, kept below the limits so sandboxes pack densely.
          resource_requests:
            cpu: 0.5
            memory_mib: 2048
            disk_gib: 30
        metadata:
          benchmark: swebench-verified
          harness: mini-swe-agent
      sandbox_environment_kwargs:
        cwd: /testbed
        conda_env: testbed
        activate_conda: true
        user: root
      # How `gym sandbox debug` reconstructs a task's sandbox without running the
      # agent. The image is derived from the row rather than declared, so a
      # resolver is needed; the wrapper makes a debugged command run against the
      # testbed Python, exactly as a rollout's does (`--bare` opts out).
      #
      #   gym sandbox debug --config <this file> --config <provider config> \
      #       --task django__django-10973 --command "python -m pytest -x"
      sandbox_task:
        id_from_row: instance_id
        image_from_row: image_name
        spec_resolver: responses_api_agents.mini_swe_agent_2.sandbox_hooks:spec_for_row
        exec_wrapper: responses_api_agents.mini_swe_agent_2.sandbox_hooks:conda_activate_wrap
      run_golden: false
      step_timeout: 600
      eval_timeout: 1800
      skip_if_exists: false
      step_limit: 250
      datasets: []
