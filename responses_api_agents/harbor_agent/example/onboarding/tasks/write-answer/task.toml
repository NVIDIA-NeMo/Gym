version = "1.0"

[metadata]
description = "A deterministic, one-file onboarding task; not a model-quality benchmark."
category = "onboarding"
difficulty = "easy"
tags = ["onboarding", "deterministic"]

[agent]
timeout_sec = 180.0

[verifier]
timeout_sec = 10.0

[environment]
build_timeout_sec = 300.0
cpus = 1
memory_mb = 1024
storage_mb = 1024
gpus = 0
allow_internet = false
