# OpenHands SDK harness (openhands-sdk/openhands-tools 1.50: terminal, file_editor, task_tracker,
# finish, think; native tool calling). Same shape as opencode_sandboxed_agent's config; the
# sandbox itself is seeded by the resources server, so no sandbox_config here.
openhands_sdk_sandboxed_agent:
  responses_api_agents:
    openhands_sdk_sandboxed_agent:
      entrypoint: app.py
      num_workers: 4
      resources_server:
        type: resources_servers
        name: ???
      model_server:
        type: responses_api_models
        name: policy_model
      token_id_capture: true

      sandbox_provider: sandbox
      sandbox_timeout: 21600
      max_iterations: 500
      debug: false

      datasets: []
