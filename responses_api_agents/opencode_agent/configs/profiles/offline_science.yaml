# Shared settings of the offline scientific benchmark presets (benchmarks/hle/opencode.yaml,
# benchmarks/apex_shortlist/opencode.yaml), merged into the `opencode_agent` instance that each preset's agent
# inherits. Each session creates its own sandbox from the offline science image
# (responses_api_agents/opencode_sandboxed_agent/offline_science_image), which reaches only the model server.
# The settings follow opencode_sandboxed_agent's configs/benchmark.yaml where opencode_agent has them; the
# benchmark READMEs list what differs.
use_absolute_ip: true
# The head server's config endpoint is unauthenticated, so keep it off the address sandboxes reach.
head_server:
  host: 127.0.0.1
config_paths:
- nemo_gym/sandbox/providers/opensandbox/configs/opensandbox.yaml
- responses_api_agents/opencode_agent/configs/opencode_agent.yaml
opencode_agent:
  responses_api_agents:
    opencode_agent:
      # An unseeded request runs the harness on the Gym host, so keep the agent off the address sandboxes reach.
      host: 127.0.0.1
      num_workers: 4
      concurrency: 512
      timeout: 14400
      # One model call must fit the served 262,144-token context: OpenCode asks for max_output_tokens on every call.
      context_window: 229376
      max_output_tokens: 32768
      token_id_capture: false
      sandbox_provider: sandbox
      network_access: model_only
      # The image ships the pinned OpenCode binary (offline_science_image/Dockerfile checks this digest).
      sandbox_executable_path: /usr/local/bin/opencode
      sandbox_executable_sha256: 0254a429cd0e6cf0ba53fc01672cf98e4a8dc728f7fa94be88f1e4b3645e6ded  # pragma: allowlist secret
      system_prompt: |
        Internet access is disabled on this machine.
        Scientific Python packages (including NumPy, SciPy, and SymPy), SageMath, and Lean/Mathlib are preinstalled. See /opt/science/README.md for available tools and usage.
      opencode_config:
        permission:
          # No subagents, as in the deprecated preset; the web and skill tools are denied by the default rules.
          task: deny
      sandbox_config:
        image: ${oc.env:OPENCODE_SANDBOX_IMAGE}
        ttl_s: 14400
        ready_timeout_s: 1200
        workdir: /workspace
        entrypoint:
        - sleep
        - infinity
        resources:
          cpu: 2
          memory_mib: 8192
        env:
          EXECD_API_GRACE_SHUTDOWN: 50ms
