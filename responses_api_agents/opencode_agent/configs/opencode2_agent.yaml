# OpenCode 2 through the same adapter (README "OpenCode 2"). `opencode_agent` keeps OpenCode 1 as its default, so
# configs that use it run unchanged; pair a benchmark with `opencode2_agent`, or set `opencode_version: "2.2.7"` on
# an `opencode_agent` instance, to run OpenCode 2. Both instances can serve one run, for an A/B on the same rows.
config_paths:
  - responses_api_agents/opencode_agent/configs/opencode_agent.yaml

opencode2_agent:
  _inherit_from: opencode_agent
  responses_api_agents:
    opencode_agent:
      opencode_version: "2.2.7"
