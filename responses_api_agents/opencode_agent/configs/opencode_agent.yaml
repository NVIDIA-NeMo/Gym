config_paths:
  - responses_api_agents/opencode_agent/configs/permissions/default.yaml

# Agent sessions run in a sandbox; unseeded requests run the local CLI.
opencode_agent:
  responses_api_agents:
    opencode_agent:
      entrypoint: app.py
      num_workers: 1
      resources_server: null
      model: ${policy_model_name}
      model_server:
        type: responses_api_models
        name: policy_model

      # Set this to the actual model context window; it is metadata, not an output-token limit.
      context_window: 262144
      timeout: 10800
      sandbox_install_timeout_seconds: 600
      session_close_timeout_seconds: 60
      session_close_retry_window_seconds: 300

      # Owner extensions for sandbox sessions (README "Owner extensions"); these defaults change nothing.
      plugins: []  # absolute sandbox paths of owner-staged OpenCode plugins, loaded after Gym's
      # Pinned offline bundle beside the binary: a file already in the sandbox (*_path), each requiring its SHA-256
      # (*_sha256), which is checked inside the sandbox.
      sandbox_ripgrep_path: null  # e.g. ripgrep 15.1.0, the build OpenCode 1.17.11 downloads
      sandbox_ripgrep_sha256: null
      sandbox_plugin_dependencies_path: null  # tar of package.json, package-lock.json and node_modules
      sandbox_plugin_dependencies_sha256: null
      export_dir: null  # absolute sandbox directory outside the workdir; keeps OpenCode session exports after close
      session_import_path: null  # absolute sandbox path of an OpenCode export to continue, if present

      opencode_config:
        tools:
          bash: true
          edit: true
          read: true
          glob: true
          grep: true
          write: true
          apply_patch: true
          webfetch: false
          websearch: false
          task: true
          skill: false
          todowrite: true

      datasets: []
