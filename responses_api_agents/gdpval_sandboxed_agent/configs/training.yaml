gdpval_train:
  responses_api_agents:
    gdpval_sandboxed_agent:
      entrypoint: app.py
      resources_server: {type: resources_servers, name: gdpval_train_resources}
      model_server: {type: responses_api_models, name: policy_model}
      checkpoint: ${policy_model_name}
      remote_openhands_install_script_path: ${oc.env:GDPVAL_OPENHANDS_INSTALL_SCRIPT}
      remote_openhands_archive_path: ${oc.env:GDPVAL_OPENHANDS_ARCHIVE}
      datasets:
        - name: example
          type: example
          jsonl_fpath: resources_servers/gdpval_disaggregated/data/example.jsonl
          license: Apache 2.0
gdpval_val:
  responses_api_agents:
    gdpval_sandboxed_agent:
      entrypoint: app.py
      resources_server: {type: resources_servers, name: gdpval_val_resources}
      model_server: {type: responses_api_models, name: policy_model}
      checkpoint: ${policy_model_name}
      remote_openhands_install_script_path: ${oc.env:GDPVAL_OPENHANDS_INSTALL_SCRIPT}
      remote_openhands_archive_path: ${oc.env:GDPVAL_OPENHANDS_ARCHIVE}
      datasets:
        - name: example
          type: example
          jsonl_fpath: resources_servers/gdpval_disaggregated/data/example.jsonl
          license: Apache 2.0


# Gym requires an environment server per agent instance (AgentWithoutEnvironmentServerError otherwise).
gdpval_train_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: gdpval_train
gdpval_val_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: gdpval_val
