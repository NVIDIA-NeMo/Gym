# The partner_if Harbor agent and its grader. It validates without services, but it runs only with an
# OpenSandbox deployment (OPENSANDBOX_DOMAIN, OPENSANDBOX_API_KEY) and Harbor tasks with live_agent rows,
# which Gym does not ship.
config_paths:
  - resources_servers/partner_if/configs/verifier.yaml

# OpenHands calls the model server from inside the sandbox.
use_absolute_ip: true

partner_if_harbor_agent:
  responses_api_agents:
    partner_if_harbor_agent:
      entrypoint: app.py
      model_server:
        type: responses_api_models
        name: partner_if_harbor_model
      resources_server:
        type: resources_servers
        name: partner_if
      # One TaskBundle JSON (the task's contract and actor documents) per Harbor task.
      task_bundles_dir: ${partner_if_harbor_task_bundles_dir}
      harbor_resolve_paths_from_gym_root: true
      # Native harbor.models.job.config.JobConfig fields.
      job:
        # Trials go to a harbor/ directory beside the --output file, taking a relative --output from the
        # Gym root; without --output, to results/partner_if_harbor_agent/harbor_jobs under the Gym root.
        jobs_dir: ${oc.select:output_jsonl_fpath,results/partner_if_harbor_agent/harbor_jobs}
        datasets:
          - path: ${partner_if_harbor_tasks_dir}
        environment:
          import_path: responses_api_agents.partner_if_harbor_agent.environment:ArtifactEnvironment
          kwargs:
            workdir: /root
            exec_shell: bash -c
            actor_directories: {}
            output_directory: /root/output
            sandbox_provider:
              opensandbox:
                connection:
                  domain: ${oc.env:OPENSANDBOX_DOMAIN,opensandbox-server.opensandbox-system.svc.cluster.local}
                  # The Harbor worker reads OPENSANDBOX_API_KEY, so Harbor's job files never hold the key.
                  api_key: supplied-by-worker-environment
                  use_server_proxy: true
                  transport_backend: aiohttp
        agents:
          - name: openhands
            model_name: openai/${policy_model_name}
            # A placeholder: OpenHands reaches the policy through the Gym model server.
            env:
              LLM_API_KEY: gym-proxy-no-provider-secret
            kwargs:
              version: "0.62.0"
              max_iterations: 30

# The policy over Chat Completions, as OpenHands 0.62 requires.
partner_if_harbor_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: ${policy_base_url}
      api_key: ${policy_api_key}
      model: ${policy_model_name}
      is_responses_native: false
      return_token_id_information: false
      uses_reasoning_parser: true

partner_if_harbor_agent_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: partner_if_harbor_agent

partner_if_harbor_tasks_dir: data/partner_if_harbor/tasks
partner_if_harbor_task_bundles_dir: data/partner_if_harbor/task-bundles
