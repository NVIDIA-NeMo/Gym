prime_agent:
  responses_api_agents:
    prime_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: ???
      concurrency: 8
      command: prime-agent
      model: nvinf/nvidia/qwen/qwen3-next-80b-a3b-instruct
      env: {}
      workspace_root: outputs/prime_agent/workspaces
      kernel_venv: outputs/prime_agent/kernel-venv
      thinking: null
      system_prompt: null
      timeout: 900
      extra_args: []
      models_config:
        providers:
          nvinf:
            baseUrl: https://integrate.api.nvidia.com/v1
            api: openai-completions
            apiKey: ${nvidia_api_key}
            compat:
              supportsDeveloperRole: false
              supportsReasoningEffort: false
            models:
            - id: nvidia/qwen/qwen3-next-80b-a3b-instruct
              reasoning: false
      prime_agent_version: 0.7.0
