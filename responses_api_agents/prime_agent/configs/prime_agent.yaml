prime_agent:
  responses_api_agents:
    harness_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: ???
      concurrency: 8
      agent: prime
      agent_kwargs:
        model:
          model: policy/...
          provider: policy
        timeout_seconds: 900
        settings:
          command: prime-agent
          kernel_venv: outputs/prime_agent/kernel-venv
          models_config:
            providers:
              policy:
                baseUrl: ...
                api: openai-completions
                apiKey: ...
                compat:
                  supportsDeveloperRole: false
                  supportsReasoningEffort: true
                models:
                  - id: ...
                    reasoning: false
      sandbox_provider:
        local: {}
      sandbox_image: ""
      setup_commands:
        - command -v prime-agent || curl -fsSL https://app.primeintellect.ai/prime-agent/install.sh | sh -s -- 0.7.0
      rollout_timeout: 900
