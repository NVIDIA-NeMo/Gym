[project]
name = "skill-trigger-agent"
version = "0.1.0"
requires-python = ">=3.13.14"
dependencies = ["nemo-gym[dev,ray]", "harbor==0.24.0"]

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools"]

[tool.setuptools.packages.find]
where = [".."]
include = ["skill_trigger"]

[tool.uv]
sources.nemo-gym = { path = "../..", editable = true }
