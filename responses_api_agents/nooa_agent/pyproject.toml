[project]
name = "gym-responses-api-agents-nooa-agent"
version = "0.0.0"
requires-python = ">=3.13.14"
dependencies = [
    "nemo-gym[dev]",
    "jsonschema>=4.25.1,<5",
    "nooa @ git+https://github.com/NVIDIA-NeMo/labs-OO-Agents.git@051472343211914222e24ce36d8752f4e86bbe43",
    "nooa-cli @ https://github.com/NVIDIA-NeMo/labs-OO-Agents/archive/051472343211914222e24ce36d8752f4e86bbe43.tar.gz#subdirectory=packages/nooa-cli",
    "nooa-bench @ https://github.com/NVIDIA-NeMo/labs-OO-Agents/archive/051472343211914222e24ce36d8752f4e86bbe43.tar.gz#subdirectory=packages/nooa-bench",
]

[tool.uv]
package = false
constraint-dependencies = [
    "grpcio>=1.81.0rc1",
    "msgpack>=1.2.1",
]
override-dependencies = [
    "spacy>=3.8.13",
    "wcwidth; sys_platform == 'never'",
    "opencv-python-headless; sys_platform == 'never'",
    "pynvvideocodec; sys_platform == 'never'",
    "torchcodec; sys_platform == 'never'",
    "torchvision; sys_platform == 'never'",
    "torchaudio; sys_platform == 'never'",
    "pycountry; sys_platform == 'never'",
    "gprof2dot; sys_platform == 'never'",
    "pathspec; sys_platform == 'never'",
    "openai==2.44.0",
]
exclude-dependencies = [
    "fasttext-wheel",
    "alembic",
    "blinker",
    "cryptography",
    "flask",
    "flask-cors",
    "graphene",
    "graphql-core",
    "graphql-relay",
    "gunicorn",
    "huey",
    "prettytable",
    "skops",
    "sqlalchemy",
    "werkzeug",
    "waitress",
    "diskcache",
]

[tool.uv.sources]
"nemo-lens" = { git = "https://github.com/NVIDIA-NeMo/Lens.git", rev = "4d045c03186b90afdc815db46b671f6a21bc7e98" }
"nemo-gym" = { path = "../..", editable = true }

[project.optional-dependencies]
telemetry = ["nemo-gym[telemetry]"]

[tool.uv.workspace]
members = []
