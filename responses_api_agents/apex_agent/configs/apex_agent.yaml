apex_agent_apptainer_sandbox:
  apptainer:
    create:
      start_timeout_s: 1800
      extra_start_args: ${oc.select:apex_agent_apptainer_extra_start_args,[--containall,--cleanenv,--writable-tmpfs,--fakeroot]}
      direct_exec: ${oc.select:apex_agent_apptainer_direct_exec,false}
    exec:
      fakeroot_for_root: ${oc.select:apex_agent_apptainer_fakeroot_for_root,true}

apex_agent:
  responses_api_agents:
    apex_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: apex_agents
      model_server:
        type: responses_api_models
        name: policy_model
      concurrency: ${oc.select:apex_agent_concurrency,4}
      timeout: ${oc.select:apex_agent_timeout,12600}
      # Existing SIF, OCI reference, or the target for a one-time automatic build from Archipelago's pinned upstream Dockerfile.
      image: ${oc.select:apex_agents_image,responses_api_agents/apex_agent/images/archipelago.sif}
      # Used only when `image` is a local path that does not exist. Existing SIFs and OCI/registry references skip this build entirely.
      image_build:
        enabled: ${oc.select:apex_agents_auto_build,true}
        source_repo: ${oc.select:apex_archipelago_repo,https://github.com/Mercor-Intelligence/archipelago.git}
        source_revision: ${oc.select:apex_archipelago_revision,0cb5c476c219a9df637e0bd37fb86b2361f4ab89}
        # Optional developer override. By default Gym fetches and caches the
        # pinned commit using the trusted host's normal Git authentication.
        source_root: ${oc.select:apex_archipelago_root,null}
        source_github_token: ${oc.select:apex_archipelago_github_token,null}
        dockerfile: ${oc.select:apex_archipelago_dockerfile,environment/Dockerfile}
        docker_tag: ${oc.select:apex_archipelago_docker_tag,nemo-gym-archipelago:0cb5c476c219}
        timeout: ${oc.select:apex_archipelago_build_timeout,7200}
      sandbox_provider: ${oc.select:apex_agent_sandbox_provider,apex_agent_apptainer_sandbox}
      sandbox_spec:
        resources: ${oc.select:apex_agent_sandbox_resources,{}}
      edgar_user_agent: ${oc.select:apex_edgar_user_agent,"Mercor APEX-Agents apex@mercor.com"}
      max_turns: ${oc.select:apex_agent_max_turns,200}
      max_output_tokens: ${oc.select:apex_agent_max_output_tokens,32768}
      # Policy context window for Stirrup's context summarization, which starts at 70% of it. Unset keeps Stirrup
      # using max_output_tokens as the window, i.e. summarizing at ~23k tokens with the default 32768.
      context_window_tokens: ${oc.select:apex_agent_context_window_tokens,null}
      supports_vision: ${oc.select:apex_agent_supports_vision,true}
      temperature: ${oc.select:apex_agent_temperature,1.0}
      top_p: ${oc.select:apex_agent_top_p,1.0}
      # A turn that exhausts max_output_tokens is kept as a normal turn instead of
      # ending the rollout; when it carried no tool call, the next turn runs with
      # thinking disabled and a recovery notice.
      truncation_recovery: ${oc.select:apex_agent_truncation_recovery,true}
      max_snapshot_bytes: ${oc.select:apex_agent_max_snapshot_bytes,null}
      max_world_bytes: ${oc.select:apex_agent_max_world_bytes,null}
      # Shares the verifier's output root. Incomplete/max-turn runs are saved
      # here without being sent to the grader.
      artifact_output_dir: ${oc.select:apex_artifact_output_dir,results/apex_agents_artifacts}
      # Mid-rollout checkpoint and resume. Point this at a host directory that
      # outlives the node (a shared filesystem); a per-rollout subdirectory is
      # bind-mounted into the sandbox and a rollout killed mid-flight continues
      # from its last turn boundary when Gym re-dispatches it. Null disables it.
      resume_checkpoint_dir: ${oc.select:apex_agent_resume_checkpoint_dir,null}
      resume_checkpoint_mount: ${oc.select:apex_agent_resume_checkpoint_mount,/checkpoint}
      resume_checkpoint_interval_seconds: ${oc.select:apex_agent_resume_checkpoint_interval_seconds,60}
      resume_min_remaining_seconds: ${oc.select:apex_agent_resume_min_remaining_seconds,300}
      # Optional trusted world_id -> SIF manifest for prebuilt world deliveries.
      # Ordinary Hugging Face APEX rows continue to use the shared image above.
      prebuilt_world_manifest: ${oc.select:apex_prebuilt_world_manifest,null}
      # Overall deadline for a prebuilt world's gateway and MCP startup.
      prebuilt_startup_timeout_seconds: ${oc.select:apex_prebuilt_startup_timeout_seconds,1800}
      # Relay policy traffic through a unix socket bound into the sandbox:
      # auto | always | never. "auto" turns it on when
      # apex_agent_apptainer_extra_start_args contains --net or a --network
      # option, i.e. the sandbox has its own network namespace, which lets
      # worlds with fixed service ports run several rollouts per node.
      policy_egress_relay: ${oc.select:apex_agent_policy_egress_relay,auto}
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/apex_agents/data/example.jsonl
      - name: validation
        type: validation
        jsonl_fpath: resources_servers/apex_agents/data/apex_agents_validation.jsonl
        gitlab_identifier:
          dataset_name: apex_agents
          version: 0.0.1
          artifact_fpath: apex_agents_validation.jsonl
        license: Creative Commons Attribution 4.0 International
        num_repeats: 1
