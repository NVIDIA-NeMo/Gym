config_paths:
  - responses_api_agents/nemo_fabric_agent/configs/nemo_fabric_agent.yaml

nemo_fabric_mini_swe_agent:
  _inherit_from: nemo_fabric_agent
  responses_api_agents:
    nemo_fabric_agent:
      adapter_id: nvidia.fabric.mini-swe-agent
      model_provider: anthropic
      harness_settings: {}
      fabric_config:
        environment:
          env:
            MSWEA_COST_TRACKING: ignore_errors
        runtime:
          max_turns: 8

nemo_fabric_mini_swe_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: nemo_fabric_mini_swe_agent
