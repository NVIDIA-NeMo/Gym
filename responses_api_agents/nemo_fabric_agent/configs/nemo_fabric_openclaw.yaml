# Needs the openclaw npm CLI on PATH. The Python extra installs only the adapter.
config_paths:
  - responses_api_agents/nemo_fabric_agent/configs/nemo_fabric_agent.yaml

nemo_fabric_openclaw:
  _inherit_from: nemo_fabric_agent
  responses_api_agents:
    nemo_fabric_agent:
      adapter_id: nvidia.fabric.openclaw
      harness_settings:
        # The gateway can take longer than the 30 s default to start.
        startup_timeout_seconds: 120
      fabric_config: {}

nemo_fabric_openclaw_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: nemo_fabric_openclaw
