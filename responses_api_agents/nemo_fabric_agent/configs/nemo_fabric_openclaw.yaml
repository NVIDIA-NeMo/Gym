# Needs the openclaw npm CLI on PATH. The Python extra installs only the adapter.
config_paths:
  - responses_api_agents/nemo_fabric_agent/configs/nemo_fabric_agent.yaml

nemo_fabric_openclaw:
  _inherit_from: nemo_fabric_agent
  responses_api_agents:
    nemo_fabric_agent:
      adapter_id: nvidia.fabric.openclaw
      harness_settings:
        # The gateway can take longer than the 30 s default to start.
        startup_timeout_seconds: 120
        # One gateway request covers the whole run, so the invocation timeout bounds it, not the 600 s default.
        read_timeout_seconds: 86400
        # Fabric allows the adapter host 10 s to stop, the same as the adapter's default wait for the gateway to
        # exit, so a slow exit failed a finished run. Kill the gateway sooner.
        shutdown_timeout_seconds: 5
      fabric_config: {}

nemo_fabric_openclaw_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: nemo_fabric_openclaw
