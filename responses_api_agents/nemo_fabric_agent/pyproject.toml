[project]
name = "gym-responses-api-agents-nemo-fabric-agent"
version = "0.0.0"
requires-python = ">=3.13.14"
dependencies = [
    "nemo-gym[dev]",
    "nemo-fabric[claude,codex,deepagents,hermes-agent,mini-swe-agent,nooa,openclaw,openhands,relay]==0.6.0",
    # The openhands extra installs the adapter only. These are the OpenHands packages NeMo Fabric 0.6.0 validates.
    "openhands-sdk==1.50.0",
    "openhands-tools==1.50.0",
    # LiteLLM 1.103 and later import mcp 2 types, while nemo-gym pins mcp<2.
    "litellm>=1.83.0,<1.103",
    "hermes-agent @ git+https://github.com/NousResearch/hermes-agent@0ee05d72f2b30385d4861fd8e30511c6d51100e4",
    "tokenizers>=0.22.2",
]

[tool.uv]
package = false
constraint-dependencies = [
    "grpcio>=1.84.1,!=1.85.0rc1",
    "certifi>=2026.10.19",
    "msgpack>=1.2.1",
    "pyarrow>=25.0.1",
    "transformers>=5.17.0",
]
# Unlike the root policy, wcwidth and pathspec stay installed: OpenHands tools import them.
override-dependencies = [
    "spacy>=3.8.13",
    "wcwidth",
    "opencv-python-headless; sys_platform == 'never'",
    "pynvvideocodec; sys_platform == 'never'",
    "torchcodec; sys_platform == 'never'",
    "torchvision; sys_platform == 'never'",
    "torchaudio; sys_platform == 'never'",
    "pycountry; sys_platform == 'never'",
    "gprof2dot; sys_platform == 'never'",
    "pathspec",
    "openai==2.44.0",
    "pyjwt==2.15.1",
    # hermes-agent pins pillow==12.2.0 exactly, while openhands-sdk 1.50.0 needs >=12.3.0.
    "pillow==12.3.0",
    # hermes-agent pins packaging==26.0 exactly, while the Codex harness in NeMo Fabric 0.6.0 needs >=26.2.
    "packaging>=26.2",
    "certifi>=2026.10.19",
]
exclude-dependencies = [
    "fasttext-wheel",
    "alembic",
    "blinker",
    "flask",
    "flask-cors",
    "graphene",
    "graphql-core",
    "graphql-relay",
    "gunicorn",
    "huey",
    "prettytable",
    "skops",
    "sqlalchemy",
    "werkzeug",
    "waitress",
    "diskcache",
]
required-version = ">=0.13.4"

[tool.uv.sources]
"nemo-gym" = { path = "../..", editable = true }

[tool.uv.sources.nemo-lens]
git = "https://github.com/NVIDIA-NeMo/Lens.git"
rev = "4d045c03186b90afdc815db46b671f6a21bc7e98"
[project.optional-dependencies]
telemetry = ["nemo-gym[telemetry]"]

[tool.uv.workspace]
members = []
