kilocode_agent:
  responses_api_agents:
    kilocode_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: ???
      # Environment-specific; declared here so configs that _inherit_from this one can override it.
      datasets: null
      concurrency: 8
      command: kilo
      model: policy/${policy_model_name}
      openai_api_key: ""
      openai_base_url: null
      env: {}
      workspace_root: outputs/kilocode_agent/workspaces
      repo_dir: null
      thinking: false
      system_prompt: null
      setup_timeout: 900
      timeout: 900
      extra_args: []
      # written to kilo.json in the run dir (OpenCode-compatible config schema)
      kilo_config:
        permission:
          bash: allow
          edit: allow
          webfetch: allow
        # Kilo calls the model endpoint itself instead of going through a Gym model server, so it gets
        # a generic OpenAI-compatible provider aimed at whatever env.yaml points to (OpenAI, an NVIDIA
        # endpoint, a Gym-served vLLM). `policy` is only a local label and must match the prefix in
        # `model`; `models` is filled in from `model` when kilo.json is written.
        provider:
          policy:
            npm: "@ai-sdk/openai-compatible"
            options:
              baseURL: ${policy_base_url}
              apiKey: ${policy_api_key}
      kilo_version: 7.4.15
