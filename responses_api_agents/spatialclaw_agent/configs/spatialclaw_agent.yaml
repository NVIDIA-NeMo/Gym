spatialclaw_agent:
  responses_api_agents:
    spatialclaw_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: spatialclaw_resources
      model_server:
        type: responses_api_models
        name: policy_model
      spatialclaw_root: ${oc.env:SPATIALCLAW_ROOT,''}
      model_name: ${policy_model_name}
      dataset_config: null
      model_config_path: ${oc.env:SPATIALCLAW_MODEL_CONFIG,null}
      config_overrides: {}
      video_mm_processor_kwargs: {}
      temperature: null
      top_p: null
      max_output_tokens: null
      concurrency: 1
      timeout: 1800
      workspace_root: ${oc.env:SPATIALCLAW_WORKSPACE_ROOT,outputs/spatialclaw_agent}
      frame_cache_root: ${oc.env:SPATIALCLAW_FRAME_CACHE_ROOT,outputs/spatialclaw_frame_cache}
      keep_workspaces: true
      enable_logging: true

spatialclaw_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: spatialclaw_agent
