harness_exa_search_claude_code:
  responses_api_agents:
    harness_exa_search:
      entrypoint: app.py
      domain: agent
      description: Run a Gym harness with Exa search in a sandbox
      value: Evaluate and train sandboxed search agents
      model_server:
        type: responses_api_models
        name: policy_model
      resources_server:
        type: resources_servers
        name: ???
      agent: claude_code
      agent_kwargs:
        model: nvidia/qwen/qwen3.8-27b
        max_turns: 200
        timeout: 7200
        bare: true
        disallowed_tools: Read
        system_prompt: You must call an Exa MCP search tool before answering. Research the request on the web and return a complete final answer.
        claude_code_version: null
      image: nikolaik/python-nodejs:python3.13-nodejs22-slim
      setup_command: python3 -m pip install -q https://github.com/NVIDIA-NeMo/Gym/archive/4b30acc3eb3a316e5d6e0475e6959606c8512cbf.zip && npm install -g @anthropic-ai/claude-code
      sandbox_provider: sandbox
      sandbox_spec:
        ttl_s: 9000
        resources:
          memory_mib: 8192
        env:
          CLAUDE_CODE_MAX_CONTEXT_TOKENS: "1048576"
          DISABLE_COMPACT: "1"
      sandbox_model_base_url: null
      exa_api_key: null
      token_id_capture: false
