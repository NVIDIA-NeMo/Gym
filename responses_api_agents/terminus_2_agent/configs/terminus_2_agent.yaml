terminus_2_agent:
  responses_api_agents:
    harness_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: ???
      model_server:
        type: responses_api_models
        name: policy_model
      concurrency: 1
      agent: terminus_2
      agent_kwargs:
        model:
          model: null
          base_url: __SANDBOX_MODEL_URL__/v1
          settings:
            temperature: 0.7
            model_info:
              max_input_tokens: 262144
              max_output_tokens: 81920
              input_cost_per_token: 0.0
              output_cost_per_token: 0.0
            timeout_seconds: 2400
        timeout_seconds: 10800
        settings:
          parser_name: json
          enable_summarize: true
          proactive_summarization_threshold: 8000
          trajectory_config:
            raw_content: false
          tmux_pane_width: 160
          tmux_pane_height: 40
          command_timeout_seconds: 1800
          keep_logs: false
          logs_root: outputs/terminus_2_agent/runs
      sandbox_provider:
        local: {}
      sandbox_image: ""
      rollout_timeout: 10800
