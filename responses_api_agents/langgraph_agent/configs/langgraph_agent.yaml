langgraph_agent:
  responses_api_agents:
    langgraph_agent:
      num_workers: 1
      # This directory ships four distinct agents, selected by entrypoint. There is no default, so start
      # from a flavor config rather than setting this by hand:
      #   responses_api_agents/langgraph_agent/configs/orchestrator_agent.yaml
      #   responses_api_agents/langgraph_agent/configs/parallel_thinking_agent.yaml
      #   responses_api_agents/langgraph_agent/configs/reflection_agent.yaml
      #   responses_api_agents/langgraph_agent/configs/rewoo_agent.yaml
      # or select --agent-type langgraph_agent/<flavor> alongside a benchmark. See the README.
      entrypoint: ???
      resources_server: null
      model_server:
        type: responses_api_models
        name: policy_model
