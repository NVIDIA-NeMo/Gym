# The image tools agent through a single_agent_turn_legacy Environment Server and the agent sessions API. The
# image_tools_reward server verifies: it routes each row to the verifier its image_tools_base_agent_ref names and adds
# the tool reward. Load the verifiers in resource_servers_by_agent (string_match, math_with_judge, mcqa,
# gui_coordinate) as with image_tools_agent.yaml.
config_paths:
  - responses_api_agents/image_tools_agent/configs/image_tools_agent.yaml
  - resources_servers/image_tools/configs/image_tools_reward.yaml
  - environment_servers/single_agent_turn_legacy/configs/single_agent_turn_legacy.yaml

# Rows keep routing by image_tools_simple_agent, so this server replaces the agent's /run relay.
image_tools_simple_environment_server: null

image_tools_single_agent_turn:
  _inherit_from: single_agent_turn_legacy
  environment_servers:
    single_agent_turn_legacy:
      resources_server:
        type: resources_servers
        name: image_tools_reward
      agent_server:
        type: responses_api_agents
        name: image_tools_simple_agent
