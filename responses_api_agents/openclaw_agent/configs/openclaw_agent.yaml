# EnvironmentServer sessions. Use openclaw_local_agent.yaml for host CLI execution.
openclaw_agent:
  responses_api_agents:
    openclaw_agent:
      entrypoint: app.py
      num_workers: 1
      resources_server: null
      model_server: {type: responses_api_models, name: policy_model}
      model: ${policy_model_name}
      openclaw_version: 2026.6.11
      timeout: 900
      model_timeout_seconds: 600
      sandbox_install_timeout_seconds: 900
      session_close_timeout_seconds: 60
      session_close_retry_window_seconds: 300
