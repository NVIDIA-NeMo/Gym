deep_swe_agent:
  responses_api_agents:
    deep_swe_agent:
      entrypoint: app.py
      domain: coding
      description: DeepSWE v1.1 tasks through Pier's Harbor-compatible lifecycle and OpenSandbox.
      value: Improve repository-scale software engineering across languages.
      concurrency: 32
      datasets: []
      model_server:
        type: responses_api_models
        name: policy_model
      harbor_datasets:
        deep_swe:
          local_dataset_path: benchmarks/deep_swe/data/deep-swe/tasks
          workdir: /app
      harbor_agent_name: mini-swe-agent
      harbor_agent_kwargs:
        version: 2.4.6
        reasoning_effort: xhigh
        # Zero disables mini-swe-agent's default cost limit.
        cost_limit: 0
        model_class: litellm_response
      harbor_agent_env:
        OPENAI_BASE_URL: https://inference-api.nvidia.com/v1
      harbor_jobs_dir: responses_api_agents/deep_swe_agent/jobs
      sandbox_provider:
        opensandbox:
          connection:
            domain: opensandbox-server.opensandbox-system.svc.cluster.local
            api_key: ${oc.env:OPENSANDBOX_API_KEY}
            protocol: http
            request_timeout_s: 6000
            use_server_proxy: true
          create:
            request_timeout_s: 1200
            timeout_s: 1200
            skip_health_check: true
            retries: 10
            retry_delay_s: 5.0
            retry_max_delay_s: 90.0
          probe:
            timeout_s: 60
            deadline_s: 180
            stable_count: 2
            stable_delay_s: 1.0
          operations:
            retries: 5
            retry_delay_s: 1.0
            retry_max_delay_s: 45.0
            command_retries: 0
            close_timeout_s: 30
      sandbox_spec:
        ttl_s: 18000
        ready_timeout_s: 1200
        agent_install_timeout_s: 1800
        tmux_bundle_path: /workspace/gym-deepswe/cache/deep_swe_runtime/tmux-jammy-amd64.tar.gz
        provider_options:
          platform:
            os: linux
            arch: amd64
          network_policy:
            defaultAction: deny
        metadata:
          benchmark: deep-swe
          harness: pier
          sandbox-api: opensandbox-sdk
