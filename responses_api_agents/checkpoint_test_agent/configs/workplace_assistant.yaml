# Deterministic Workplace Assistant checkpoint fixture: the real Workplace resources server behind an agent
# that holds its first post-tool-call boundary when NEMO_GYM_TEST_HOLD_FIRST_MUTATED_BOUNDARY=1.
workplace_assistant_checkpoint_resources_server:
  resources_servers:
    workplace_assistant:
      entrypoint: app.py
      domain: agent
      verified: false
      description: Workplace Assistant resources for the checkpoint test agent
workplace_assistant_checkpoint_test_agent:
  responses_api_agents:
    checkpoint_test_agent:
      entrypoint: app.py
      # One tool call, the held boundary after it, then one closing model call after a restore.
      max_steps: 2
      resources_server:
        type: resources_servers
        name: workplace_assistant_checkpoint_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
        - name: example
          type: example
          jsonl_fpath: resources_servers/workplace_assistant/data/example.jsonl
workplace_assistant_checkpoint_test_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: workplace_assistant_checkpoint_test_agent
