# The EQ-Bench 4 conversation runner. resources_servers/eqbench4/configs/eqbench4.yaml defines the complete
# pairing with its resources server, persona model and environment server.
eqbench4_agent:
  responses_api_agents:
    eqbench4_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: ???
      model_server:
        type: responses_api_models
        name: policy_model
      persona_model_server:
        type: responses_api_models
        name: ???
      persona_responses_create_params:
        input: []
        temperature: 0.7
        max_output_tokens: 10000
      persona_max_attempts: 3
      persona_correction_message: |-
        Your reply could not be used ({problems}). Reply again as your character, in exactly this format:

        <internal>
        Your private thoughts and feelings, complete and closed.
        </internal>

        <dialogue>
        Only the words you say out loud, with no tags inside.
        </dialogue>

        <status>
        active
        </status>
      policy_max_attempts: 7
