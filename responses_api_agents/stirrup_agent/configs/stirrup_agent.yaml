# Stand-alone stirrup_agent config. Stirrup runs only in agent sessions, in a sandbox the resources server lends it;
# benchmarks/gdpval/config.yaml composes it with the GDPVal resources server.
stirrup_agent:
  responses_api_agents:
    stirrup_agent:
      entrypoint: app.py
      model_server:
        name: policy_model
        type: responses_api_models
      agent_max_turns: 250
      concurrency: 32
      temperature: 1.0
      # Request tools that end the episode; null uses Stirrup's own finish tool.
      finish_tool_names: null
      sandbox_install_timeout_seconds: 900
      sandbox_runner_timeout_seconds: 12600
      session_close_timeout_seconds: 30
