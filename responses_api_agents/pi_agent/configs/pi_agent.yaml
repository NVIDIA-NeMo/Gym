# Pi borrows SandboxAccess from EnvironmentServer. The run configuration
# binds the independent benchmark and agent; this config selects only the harness and model.
pi_agent:
  responses_api_agents:
    pi_agent:
      entrypoint: app.py
      num_workers: 1
      resources_server: null
      model_server:
        type: responses_api_models
        name: policy_model
      model: ${policy_model_name}
      pi_version: 0.80.2
      timeout: 900
