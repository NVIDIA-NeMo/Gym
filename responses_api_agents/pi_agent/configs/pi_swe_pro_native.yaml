# Compose with resources_servers/swebench_pro/configs/swebench_pro.yaml,
# a sandbox provider, and a Gym model-server configuration named policy.
pi_swe_pro_agent:
  responses_api_agents:
    pi_agent:
      entrypoint: app.py
      num_workers: 1
      resources_server:
        type: resources_servers
        name: swebench_pro_resources_server
      model_server:
        type: responses_api_models
        name: policy
      model: ???
      pi_version: 0.80.2
      concurrency: 8
      timeout: 1800
      thinking: null
      context_window: 262144
      max_output_tokens: 32768
      sandbox_install_timeout_seconds: 600
      session_close_timeout_seconds: 60

pi_swe_pro_environment:
  environment_servers:
    single_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: swebench_pro_resources_server
      agent_server:
        type: responses_api_agents
        name: pi_swe_pro_agent
      task_input_contract: nemo_gym.single_agent.v1
      resources_tool_transports: []
      default_episode_timeout_seconds: 7200
      cleanup_timeout_seconds: 180
