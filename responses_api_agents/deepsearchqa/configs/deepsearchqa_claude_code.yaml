deepsearchqa_claude_code:
  responses_api_agents:
    deepsearchqa:
      entrypoint: app.py
      domain: agent
      description: Run DeepSearchQA with any Gym harness in a sandbox
      value: Evaluate agentic search sandboxed performance
      model_server:
        type: responses_api_models
        name: policy_model
      judge_model_server:
        type: responses_api_models
        name: policy_model
      judge_responses_create_params:
        input: []
        max_output_tokens: 32768
        temperature: 0.0
        top_p: 1.0
      harness_module: responses_api_agents.claude_code_agent.app
      harness_class: ClaudeCodeAgent
      harness_config_class: ClaudeCodeAgentConfig
      harness_kwargs:
        model: ${oc.env:DEEPSEARCHQA_MODEL,nvidia/qwen/qwen3.8-27b}
        max_turns: 30
        timeout: 900
        bare: true
        system_prompt: You must call an Exa MCP search tool before answering. Use Exa to research the question on the web, do not substitute local file searches for web research.
        claude_code_version: ${oc.env:CLAUDE_CODE_VERSION,null}
      image: ${oc.env:DEEPSEARCHQA_IMAGE}
      setup_command: ${oc.env:DEEPSEARCHQA_SETUP_COMMAND,null}
      sandbox_provider: sandbox
      sandbox_spec:
        ttl_s: 1800
      sandbox_model_base_url: null
      exa_api_key: ${oc.env:EXA_API_KEY,null}
      token_id_capture: false
      datasets:
        - name: example
          type: example
          jsonl_fpath: responses_api_agents/deepsearchqa/data/example.jsonl
        - name: deepsearchqa
          type: benchmark
          jsonl_fpath: benchmarks/deepsearchqa/data/deepsearchqa_benchmark.jsonl
          prepare_script: benchmarks/deepsearchqa/prepare.py
