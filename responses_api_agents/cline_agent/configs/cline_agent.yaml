cline_agent:
  responses_api_agents:
    harness_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: ???
      model_server:
        type: responses_api_models
        name: policy_model
      concurrency: 8
      agent: cline
      agent_kwargs:
        model:
          model: ${policy_model_name}
          provider: openai-compatible
          api_key: ""
          base_url: __SANDBOX_MODEL_URL__/v1
        timeout_seconds: 900
        settings:
          command: cline
          setup_timeout: 300
          command_permissions: {}
      sandbox_provider:
        local: {}
      sandbox_image: ""
      setup_commands:
        - command -v cline || npm install -g 'cline@3.0.55'
      rollout_timeout: 900
