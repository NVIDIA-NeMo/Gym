[project]
name = "gym-responses-api-agents-miniswe-sandboxed-agent"
version = "0.0.0"
requires-python = ">=3.13.14"
dependencies = [
    "nemo-gym[dev,sandbox]",
    "mini-swe-agent==2.4.6",
    "litellm==1.102.1",
    "mcp==1.29.0",
    "httpx-aiohttp==0.2.0",
    "opensandbox==0.1.16",
    "pathspec==1.1.1",
    "anyio>=4.15.1",
]

[tool.uv]
package = false
constraint-dependencies = [
    "grpcio>=1.81.0rc1",
    "msgpack>=1.2.1",
]
override-dependencies = [
    "spacy>=3.8.13",
    "wcwidth>=0.2.13",
    "opencv-python-headless; sys_platform == 'never'",
    "pynvvideocodec; sys_platform == 'never'",
    "torchcodec; sys_platform == 'never'",
    "torchvision; sys_platform == 'never'",
    "torchaudio; sys_platform == 'never'",
    "pycountry; sys_platform == 'never'",
    "gprof2dot; sys_platform == 'never'",
    "pathspec",
]
exclude-dependencies = [
    "fasttext-wheel",
    "alembic",
    "blinker",
    "cryptography",
    "flask",
    "flask-cors",
    "graphene",
    "graphql-core",
    "graphql-relay",
    "gunicorn",
    "huey",
    "prettytable",
    "skops",
    "sqlalchemy",
    "werkzeug",
    "waitress",
    "diskcache",
]

[tool.uv.sources]
"nemo-lens" = { git = "https://github.com/NVIDIA-NeMo/Lens.git", rev = "4d045c03186b90afdc815db46b671f6a21bc7e98" }
"nemo-gym" = { path = "../..", editable = true }

[project.optional-dependencies]
telemetry = ["nemo-gym[telemetry]"]

[tool.uv.workspace]
members = []
