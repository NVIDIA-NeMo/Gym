# mini-SWE 2.4.6 on an episode session: the environment server seeds the sandbox, hands it over
# through the session seed, and calls /v1/responses with the task instruction as the input.
# Step limit and command timeout follow the Terminal Bench 4 profile (Artificial Analysis settings).
miniswe_sandboxed_agent:
  responses_api_agents:
    miniswe_sandboxed_agent:
      entrypoint: app.py
      num_workers: 1
      # Only the legacy /run route needs one; episode sessions get their sandbox from the environment server.
      resources_server: null
      model_server:
        type: responses_api_models
        name: policy_model
      harness:
        step_limit: 500
        step_timeout_sec: 30
      agent_timeout_sec: 28800
      agent_max_timeout_sec: null
      artifacts_dir: results/miniswe_sandboxed_agent
      datasets: []
