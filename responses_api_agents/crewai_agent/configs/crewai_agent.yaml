# CrewAI runs in the Agent Server, one crew turn per agent session. Its shell tool borrows the SandboxAccess the
# Environment Server forwards, and MCP tool grants add the benchmark's tools. The run configuration binds the
# benchmark and this agent; see the README for compositions.
crewai_agent:
  responses_api_agents:
    crewai_agent:
      entrypoint: app.py
      num_workers: 1
      resources_server: null
      model_server:
        type: responses_api_models
        name: policy_model
      model: ${policy_model_name}
      timeout: 1800
      max_iter: 50
      shell_timeout_seconds: 600
      session_close_timeout_seconds: 60
