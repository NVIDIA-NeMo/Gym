# Compose after the training recipe. EnvironmentServer sessions own each episode.
config_paths:
- nemo_gym/sandbox/providers/opensandbox/configs/opensandbox.yaml
training_resources_server: ??? # Explicit verifier instance; never infer string matching.
use_absolute_ip: true
head_server:
  host: 127.0.0.1
string_match:
  resources_servers:
    string_match:
      entrypoint: app.py
      host: 127.0.0.1
      strip_trailing_eos: true
      domain: knowledge
token_id_capture:
  enabled: true
opencode_multimodal_agent:
  responses_api_agents:
    opencode_multimodal_agent:
      host: 127.0.0.1
      num_workers: 1
      command: opencode
      _delete_key: env
      sandbox: null
      sandbox_provider: sandbox
      sandbox_config:
        image: ???
        workdir: /testbed
        ttl_s: 3600
      network_access: model_only
      token_id_capture: true
opencode_multimodal_agent_environment_server:
  environment_servers:
    single_agent_turn:
      entrypoint: opencode.py
      host: 127.0.0.1
      cleanup_timeout_seconds: 180
      resources_server:
        type: resources_servers
        name: ${training_resources_server}
      agent_server:
        type: responses_api_agents
        name: opencode_multimodal_agent
      agent_outcome_policy:
        by_failure_kind:
          provider_oom_killed: retry
