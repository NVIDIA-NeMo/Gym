# One static environment per verifier, using main's agent routing for flat training rows.
config_paths:
- responses_api_agents/opencode_multimodal_agent/configs/opencode_multimodal_agent.yaml
training_resources_server: math_with_judge
math_with_judge:
  resources_servers:
    math_with_judge:
      entrypoint: app.py
      host: 127.0.0.1
      domain: math
      should_use_judge: false
      judge_model_server:
        type: responses_api_models
        name: policy_model
      judge_responses_create_params:
        input: []
mcqa:
  resources_servers:
    mcqa:
      entrypoint: app.py
      host: 127.0.0.1
      domain: knowledge
      grading_mode: null
opencode_string_match:
  _copy: opencode_multimodal_agent
opencode_mcqa:
  _copy: opencode_multimodal_agent
opencode_string_match_environment_server:
  _copy: opencode_multimodal_agent_environment_server
  environment_servers:
    single_agent_turn:
      resources_server:
        name: string_match
      agent_server:
        name: opencode_string_match
opencode_mcqa_environment_server:
  _copy: opencode_multimodal_agent_environment_server
  environment_servers:
    single_agent_turn:
      resources_server:
        name: mcqa
      agent_server:
        name: opencode_mcqa
