# Multimodal training with token capture and per-episode filesystem isolation.
opencode_multimodal_agent:
  responses_api_agents:
    opencode_multimodal_agent:
      entrypoint: app.py
      # Inherits the capture endpoint. Stock 1.17.11 does not emit the assistant
      # message correlation header; training uses verified content lineage.
      token_id_capture: true
      model_server: {type: responses_api_models, name: policy_model}
      resources_server: {type: resources_servers, name: string_match}
      model: ???
      # Same npm installer, CLI, provider and dependency stack as opencode_agent.
      opencode_version: 1.17.11
      command: opencode
      # Concurrent runs need a private filesystem per episode. Install these
      # read-only dependencies and expose their paths in the outer container.
      sandbox:
        bwrap_command: ["???"]
        python_env: ???  # Python with Pillow/numpy/scipy/OpenCV
        plugin_dependencies: ???  # node_modules/@opencode-ai/plugin
      # Applied to initial attachments and read-tool images. Set auto_resize:
      # false to disable resizing; the model still has its own image processing.
      image_policy:
        auto_resize: true
        max_width: 8000
        max_height: 8000
        max_base64_bytes: 1073741824
      concurrency: 256
      context_window: 49152
      max_output_tokens: 49152
      # The local plugin forces the last answer and blocks tools/extra turns.
      # The exact-token worker cap retains this context budget before that turn.
      final_answer_reserve: 2048 # Reserve context and force a tool-free terminal answer.
      max_turns: 8
      # Input limits only; stock OpenCode does not prune accumulated tool images.
      max_source_pixels: 150000000
      max_images: 33
      subagents_enabled: true
      command_exec_timeout: 300
      timeout: 1800
      # system_prompt defaults to prompts/visual_prefix.txt. As in the parent,
      # this and optional task system text are prepended to the USER message.
      # Override system_prompt to customize the prefix, or null to omit it.
      # OpenCode selects its unchanged default system prompt (default.txt for policy).
      tool_rewards:
        correct_only: false
        correct_bash_call_penalties: [0.0]
        invalid_tool_call_names: null
      resources_server_by_agent:
        string_match_simple_agent: string_match
        math_with_judge_simple_agent: math_with_judge
        mcqa_simple_agent: mcqa

# Normalize only the known stock 1.17.11 final-turn harness directive before
# lineage resolution. Pair with the usual vllm_model_for_training config.
policy_model:
  responses_api_models:
    vllm_model:
      entrypoint: app_opencode.py
