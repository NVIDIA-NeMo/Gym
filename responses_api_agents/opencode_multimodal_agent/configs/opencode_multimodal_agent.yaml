# Multimodal training with token capture and per-episode filesystem isolation.
config_paths:
- responses_api_agents/opencode_multimodal_agent/configs/train_sessions.yaml
opencode_multimodal_agent:
  responses_api_agents:
    opencode_multimodal_agent:
      entrypoint: app.py
      model_server:
        type: responses_api_models
        name: policy_model
      model: ${policy_model_name}
      context_window: 49152
      max_output_tokens: 49152
      max_turns: 8
      final_answer_reserve: 2048
      max_source_pixels: 150000000
      max_images: 33
      concurrency: 256
      timeout: 1800
policy_model:
  responses_api_models:
    vllm_model:
      entrypoint: app_opencode.py
