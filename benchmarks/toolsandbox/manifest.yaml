name: toolsandbox
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-agent-loop
domain: agent
description: ToolSandbox scenario-driven stateful tool use with a simulated user and
  milestone similarity reward in [0, 1], zero when a minefield is hit.
modality: text
licensing: CC-BY-NC-4.0
authors:
- NVIDIA NeMo Gym contributors
maintainers:
- pachmu
capabilities:
- tool_and_computer_use
- tool_and_computer_use/tool_calling
- tool_and_computer_use/multi_step_tool_use
- tool_and_computer_use/env_feedback_interpretation
- human_ai_interaction
- human_ai_interaction/clarification_and_assumption_management
- context_management
- context_management/constraint_preservation
- safety
- safety/agentic_action_safety
domains:
- general
primary_metric: mean/reward
requirements:
  gpu: false
  network: allowlist
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: toolsandbox
agent_server: toolsandbox_agent
datasets:
- name: toolsandbox
  type: benchmark
  jsonl_fpath: benchmarks/toolsandbox/data/toolsandbox_benchmark.jsonl
  prepare_script: benchmarks/toolsandbox/prepare.py
  num_repeats: 1
model_server: policy_model
canonical_split: full
prompt_source: agent
lifecycle: active
