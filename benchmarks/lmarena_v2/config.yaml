# LMArena proxy v2 benchmark.
judge_api_key: dummy  # pragma: allowlist secret

config_paths:
  - resources_servers/arena/configs/lmarena_v2.yaml

judge_model:
  responses_api_models:
    vllm_model:
      api_key: ${judge_api_key}

lmarena_v2_benchmark_resources_server:
  _inherit_from: lmarena_v2
  resources_servers:
    arena:
      policy_model_aliases:
      - ${policy_model_name}
      judge_responses_create_params:
        max_output_tokens: 32768

lmarena_v2_benchmark_agent:
  _inherit_from: lmarena_v2_simple_agent
  responses_api_agents:
    simple_agent:
      max_steps: 1
      resources_server:
        type: resources_servers
        name: lmarena_v2_benchmark_resources_server
      datasets:
      - name: lmarena_v2
        type: benchmark
        jsonl_fpath: benchmarks/lmarena_v2/data/lmarena_v2_validation.jsonl
        prompt_config: null
        prepare_script: benchmarks/lmarena_v2/prepare.py
        num_repeats: 1

policy_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: ${policy_base_url}
      api_key: ${policy_api_key}
      model: ${policy_model_name}
      return_token_id_information: false
      uses_reasoning_parser: true
      sequential_reasoning_allowed: true
      chat_template_kwargs:
        enable_thinking: true
      extra_body: {}

responses_create_params:
  temperature: 1.0
  top_p: 0.95
  max_output_tokens: 16384
  stream: false
