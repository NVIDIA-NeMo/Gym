name: lmarena_v2
# Initial manifest composition version, not an upstream dataset release.
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: rlhf
description: >-
  LMArena proxy v2 chat evaluation against baseline responses with weighted pairwise judge verdicts.
modality: text
licensing: unknown
# Integration authors from the introducing config commits.
authors:
  - Julien Veron Vialard
reward:
  range: [0.0, 1.0]
  higher_is_better: true
determinism: unknown
resources_server: arena
agent_server: simple_agent
model_server: policy_model
prompt_source: prepared
datasets:
  - name: lmarena_v2
    type: benchmark
    jsonl_fpath: benchmarks/lmarena_v2/data/lmarena_v2_validation.jsonl
    prepare_script: benchmarks/lmarena_v2/prepare.py
    num_repeats: 1
# Gym evaluation split; upstream splits are described separately.
canonical_split: benchmark
lifecycle: active
