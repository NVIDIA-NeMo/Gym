# BIRD-Interact Lite in c-Interact, with the Auto Ontology agent in place of simple_agent. Auto Ontology runs c-Interact
# only, so this file has no a-Interact server. See responses_api_agents/auto_ontology_agent/README.md.
#
#   gym eval prepare --config benchmarks/bird_interact/auto_ontology.yaml \
#     +prepare_script_args.ground_truth_jsonl=<ground truth file>
#   gym eval run --config benchmarks/bird_interact/auto_ontology.yaml --model-type vllm_model --split benchmark \
#     --config nemo_gym/sandbox/providers/docker/configs/docker.yaml --output results/bird_interact_lite_c_ao.jsonl

config_paths:
  - benchmarks/bird_interact/config.yaml
  - responses_api_agents/auto_ontology_agent/configs/auto_ontology_agent.yaml

# Auto Ontology's interactive mode also makes helper calls on its fast model: it merges the user's answers into the
# question, checks evidence and extracts structured fields. It runs on its own Model Server, apart from the evaluated
# policy, so these have no default.
auto_ontology_fast_model_base_url: ???
auto_ontology_fast_model_api_key: ???
auto_ontology_fast_model_name: ???
auto_ontology_fast_model_uses_reasoning_parser: false

auto_ontology_fast_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: ${auto_ontology_fast_model_base_url}
      api_key: ${auto_ontology_fast_model_api_key}
      model: ${auto_ontology_fast_model_name}
      uses_reasoning_parser: ${auto_ontology_fast_model_uses_reasoning_parser}
      return_token_id_information: false

# The datasets move from simple_agent's instance to Auto Ontology's.
bird_interact_agent: null
auto_ontology_agent:
  responses_api_agents:
    auto_ontology_agent:
      # To run the fast calls on the policy too, set policy_model and openai/${policy_model_name} here.
      fast_model_server:
        type: responses_api_models
        name: auto_ontology_fast_model
      fast_model: openai/${auto_ontology_fast_model_name}
      # As auto-ontology-eval runs BIRD-Interact.
      numeric_type_alignment: true
      # auto-ontology-eval's BIRD-Interact flags (ontology_sql_eval/env.py) that Auto Ontology reads.
      feature_flags:
        INTERACTIVE: "true"
        DB_PROBE_JSONB_PATH_CHECK: "true"
        DB_PROBE_JOIN_PATH_CHECK: "true"
        DB_PROBE_PROACTIVE: "true"
        DETECT_VACUOUS_GROUP_BY: "true"
        HUB_SIBLING_EXPANSION_ENABLED: "true"
        HUB_SIBLING_CAP: "6"
      # A directory of <database>/<database>_kb.jsonl files, to give Auto Ontology the knowledge entries' children,
      # as auto-ontology-eval does. The ADK hides them from agents, so leave it null for scores to compare with others.
      knowledge_children_dir: null
      datasets:
        - name: bird_interact_lite_c_interact
          type: benchmark
          jsonl_fpath: benchmarks/bird_interact/data/lite/c_interact.jsonl
          taskset: bird_interact:c_interact
          prepare_script: benchmarks/bird_interact/prepare.py
          num_repeats: 1
          license: CC BY-SA 4.0

environment_server_routes:
  _delete_key: "bird_interact:a_interact,bird_interact:a_interact_example"
bird_interact_a_interact: null

bird_interact_c_interact:
  environment_servers:
    bird_interact:
      agent_server:
        name: auto_ontology_agent
