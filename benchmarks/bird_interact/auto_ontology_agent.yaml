#
# BIRD-Interact Lite in c-Interact with Auto Ontology's ReAct agent in place of simple_agent. The agent runs Auto
# Ontology's own loop, prompts and tools in a sandbox of its own each episode, with the release's databases and Auto
# Ontology's catalog of them (auto_ontology/), asks the simulated user through the server's ask_user, and submits
# through its submit_sql. See README.md, "Auto Ontology".
#
#   benchmarks/bird_interact/auto_ontology/build_image.sh lite <models env>
#   gym eval prepare --config benchmarks/bird_interact/auto_ontology_agent.yaml
#   gym eval run --config benchmarks/bird_interact/auto_ontology_agent.yaml --model-type vllm_model --split benchmark \
#     --config nemo_gym/sandbox/providers/docker/configs/docker.yaml \
#     --output results/bird_interact_lite_c_auto_ontology.jsonl ++auto_ontology_api_key=<key>
#
# full_auto_ontology_agent.yaml runs Full.

config_paths:
  - benchmarks/bird_interact/config.yaml
  - responses_api_agents/auto_ontology_agent/configs/auto_ontology_agent.yaml

# The image auto_ontology/build_image.sh builds for the release.
auto_ontology_image: nemo-gym/bird-interact-catalog:${bird_interact_release}

auto_ontology_agent:
  responses_api_agents:
    auto_ontology_agent:
      datasets:
        - name: bird_interact_lite_c_interact
          type: benchmark
          jsonl_fpath: benchmarks/bird_interact/data/lite/c_interact.jsonl
          taskset: bird_interact:c_interact
          prepare_script: benchmarks/bird_interact/prepare.py
          num_repeats: 1
          license: CC BY-SA 4.0

# Auto Ontology runs c-Interact: a-Interact's tools would stand in for its own catalog, SQL and answer. No dataset
# routes to the a-Interact server, so it does not start.
bird_interact_agent: null
bird_interact_a_interact: null

bird_interact_c_interact:
  environment_servers:
    bird_interact:
      agent_server:
        name: auto_ontology_agent
      # A turn is one Auto Ontology episode, with the user's answers: as long as the agent lets an episode run.
      activation_timeout_seconds: 1800
