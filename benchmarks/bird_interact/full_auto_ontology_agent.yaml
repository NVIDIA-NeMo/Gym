#
# BIRD-Interact Full in c-Interact with Auto Ontology's ReAct agent: auto_ontology_agent.yaml on the Full release, with
# the images built for it. See README.md, "Auto Ontology".
#
#   benchmarks/bird_interact/auto_ontology/build_image.sh full <models env>
#   gym eval prepare --config benchmarks/bird_interact/full_auto_ontology_agent.yaml ++auto_ontology_api_key=<key>
#   gym eval run --config benchmarks/bird_interact/full_auto_ontology_agent.yaml --model-type vllm_model \
#     --split benchmark --config nemo_gym/sandbox/providers/docker/configs/docker.yaml \
#     --output results/bird_interact_full_c_auto_ontology.jsonl ++auto_ontology_api_key=<key>

config_paths:
  - benchmarks/bird_interact/auto_ontology_agent.yaml

bird_interact_release: full

auto_ontology_agent:
  responses_api_agents:
    auto_ontology_agent:
      datasets:
        - name: bird_interact_full_c_interact
          type: benchmark
          jsonl_fpath: benchmarks/bird_interact/data/full/c_interact.jsonl
          taskset: bird_interact:c_interact
          prepare_script: benchmarks/bird_interact/prepare.py
          num_repeats: 1
          license: CC BY-SA 4.0
