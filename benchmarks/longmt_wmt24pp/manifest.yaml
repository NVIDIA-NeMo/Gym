name: longmt_wmt24pp
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: other
description: Document-level MT verifier for wmt24pp short docs using the SEGALE pipeline
  (ersatz segment → LASER2 embed → vecalign align → COMETKiwi score).
modality: text
licensing: unknown
authors:
- Jeff Willette
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: longmt_eval
agent_server: simple_agent
datasets:
- name: wmt24pp_benchmark
  type: benchmark
  jsonl_fpath: benchmarks/longmt_wmt24pp/data/wmt24pp_benchmark.jsonl
  prepare_script: benchmarks/longmt_wmt24pp/prepare.py
  prompt_config: benchmarks/prompts/generic/longmt.yaml
  num_repeats: 5
model_server: policy_model
canonical_split: benchmark
standard_prompt_config: benchmarks/prompts/generic/longmt.yaml
lifecycle: active
