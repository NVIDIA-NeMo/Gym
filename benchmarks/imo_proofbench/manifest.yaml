name: imo_proofbench
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: math
description: IMO ProofBench grader using a strong LLM judge with the IMO 0-7 rubric
modality: text
licensing: unknown
authors:
- gwarmstrong
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: imo_proofbench_judge
agent_server: simple_agent
datasets:
- name: imo_proofbench
  type: benchmark
  jsonl_fpath: benchmarks/imo_proofbench/data/imo_proofbench_benchmark.jsonl
  prepare_script: benchmarks/imo_proofbench/prepare.py
  prompt_config: benchmarks/imo_proofbench/prompts/default.yaml
  num_repeats: 1
model_server: policy_model
canonical_split: benchmark
standard_prompt_config: benchmarks/imo_proofbench/prompts/default.yaml
lifecycle: active
