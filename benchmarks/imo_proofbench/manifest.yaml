name: imo_proofbench
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: math
description: IMO ProofBench grader using a strong LLM judge with the IMO 0-7 rubric
modality: text
licensing: unknown
authors:
- gwarmstrong
maintainers:
- gwarmstrong
capabilities:
- reasoning
- reasoning/deductive_reasoning
- reasoning/quantitative_reasoning
- reasoning/spatial_temporal_reasoning
