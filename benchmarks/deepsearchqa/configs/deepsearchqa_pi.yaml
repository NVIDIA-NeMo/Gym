# DeepSearchQA with Pi in a sandbox the agent creates, searching through the exa_search tool
# server. single_agent_turn_legacy seeds the deepsearchqa verifier and an exa_search session, grants exa_search to
# Pi over MCP, closes the agent, verifies its answer, then closes both sessions. Pi calls the
# model server and exa_search from the sandbox, so Gym binds them to an address the sandbox can reach. Export
# EXA_API_KEY and pass a sandbox provider config (nemo_gym/sandbox/providers/<provider>/configs/<provider>.yaml).
config_paths:
- resources_servers/exa_search/configs/exa_search.yaml

use_absolute_ip: true
absolute_ip_server_types: [responses_api_models, resources_servers]

deepsearchqa:
  resources_servers:
    deepsearchqa:
      entrypoint: app.py
      domain: knowledge
      verified: false
      description: Grade DeepSearchQA single-answer and set-answer responses
      value: Evaluate multi-step web research answers
      judge_model_server:
        type: responses_api_models
        name: policy_model
      judge_responses_create_params:
        input: []
        max_output_tokens: 32768
        temperature: null
        top_p: null

deepsearchqa_agent:
  responses_api_agents:
    pi_agent:
      entrypoint: app.py
      domain: agent
      description: Run DeepSearchQA with Pi and the exa_search tool server
      value: Evaluate agentic web search
      # Names the benchmark for its manifest; the Environment Server binds the episode's resources server.
      resources_server:
        type: resources_servers
        name: deepsearchqa
      model_server:
        type: responses_api_models
        name: policy_model
      model: ${policy_model_name}
      timeout: 7200
      context_window: 262144
      max_output_tokens: 131072
      pi_version: 0.80.2
      system_prompt: You must search with the exa_search tool before answering. Research the request on the web and return a complete final answer.
      concurrency: 32
      sandbox_provider: sandbox
      sandbox_config:
        image: nikolaik/python-nodejs:python3.13-nodejs22-slim
        ttl_s: 9000
        resources:
          memory_mib: 8192
      datasets:
        - name: deepsearchqa
          type: benchmark
          jsonl_fpath: benchmarks/deepsearchqa/data/deepsearchqa_benchmark.jsonl
          prepare_script: benchmarks/deepsearchqa/prepare.py

deepsearchqa_environment_server:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: deepsearchqa
      agent_server:
        type: responses_api_agents
        name: deepsearchqa_agent
      # The deepsearchqa verifier serves no tools; Exa search comes from the exa_search tool server.
      resources_tool_transports: []
      tool_servers:
        - type: resources_servers
          name: exa_search
