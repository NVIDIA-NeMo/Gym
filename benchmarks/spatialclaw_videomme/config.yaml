config_paths:
  - resources_servers/spatialclaw/configs/spatialclaw.yaml
  - responses_api_agents/spatialclaw_agent/configs/spatialclaw_agent.yaml

spatialclaw_videomme_resources_server:
  _inherit_from: spatialclaw_resources

spatialclaw_videomme_agent:
  _inherit_from: spatialclaw_agent
  responses_api_agents:
    spatialclaw_agent:
      resources_server:
        type: resources_servers
        name: spatialclaw_videomme_resources_server
      dataset_config: videomme.json
      datasets:
        - name: spatialclaw_videomme
          type: benchmark
          jsonl_fpath: benchmarks/spatialclaw_videomme/data/spatialclaw_videomme.jsonl
          prepare_script: benchmarks/spatialclaw_videomme/prepare.py
          prompt_config: null
          num_repeats: 3

spatialclaw_videomme_environment_server:
  _inherit_from: spatialclaw_environment_server
  environment_servers:
    legacy_agent:
      agent_server:
        name: spatialclaw_videomme_agent
