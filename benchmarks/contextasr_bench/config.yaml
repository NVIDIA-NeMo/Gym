config_paths:
- resources_servers/audio_eval/configs/audio_eval.yaml

contextasr_bench_resources_server:
  _inherit_from: audio_eval
  resources_servers:
    audio_eval:
      profile_contracts: benchmarks/contextasr_bench/profiles.json

contextasr_bench_simple_agent:
  _inherit_from: audio_eval_simple_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        name: contextasr_bench_resources_server
      datasets:
      - name: contextasr_bench
        type: benchmark
        jsonl_fpath: benchmarks/contextasr_bench/data/contextasr_bench_benchmark.jsonl
        prepare_script: benchmarks/contextasr_bench/prepare.py
        prepare_dependencies:
        - soundfile
        license: MIT

contextasr_bench_environment_server:
  _inherit_from: audio_eval_environment_server
  environment_servers:
    single_agent_turn_legacy:
      agent_server:
        name: contextasr_bench_simple_agent
      resources_server:
        type: resources_servers
        name: contextasr_bench_resources_server
