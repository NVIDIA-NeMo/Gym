# GDP.pdf through a persistent Python tool. The initial prompt contains only the question;
# the model reads the source PDF and displays any pages it needs from its sandbox.
# Add a sandbox provider config, e.g. --config nemo_gym/sandbox/providers/docker/configs/docker.yaml, and set
# GDP_PDF_SANDBOX_IMAGE to an image built from resources_servers/gdp_pdf/containers/Dockerfile.
config_paths:
  - benchmarks/gdp_pdf/config.yaml

gdp_pdf_benchmark_resources_server:
  resources_servers:
    gdp_pdf:
      sandbox_provider: sandbox
      sandbox_config:
        image: ${oc.env:GDP_PDF_SANDBOX_IMAGE,null}

gdp_pdf_benchmark_simple_agent:
  responses_api_agents:
    gdp_pdf_agent:
      max_steps: 50
      include_text: false
      include_images: false
      strip_images_from_output: false
      max_total_output_tokens: 65536
      final_answer_tokens: 8192
      datasets:
      - name: gdp_pdf
        type: benchmark
        jsonl_fpath: benchmarks/gdp_pdf/data/gdp_pdf_python_benchmark.jsonl
        prompt_config: null
        prepare_script: benchmarks/gdp_pdf/prepare_python.py
        num_repeats: 5
        license: MIT
