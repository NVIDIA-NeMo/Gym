# GDP.pdf with a `python` tool: the same tasks, documents and grading as config.yaml, and each row also offers the
# resources server's `python` tool, a persistent IPython kernel in a per-rollout sandbox holding the source PDF.
# Add a sandbox provider config, e.g. --config nemo_gym/sandbox/providers/docker/configs/docker.yaml, and set
# GDP_PDF_SANDBOX_IMAGE to an image built from resources_servers/gdp_pdf/containers/Dockerfile.
config_paths:
  - benchmarks/gdp_pdf/config.yaml

gdp_pdf_benchmark_resources_server:
  resources_servers:
    gdp_pdf:
      sandbox_provider: sandbox
      sandbox_config:
        image: ${oc.env:GDP_PDF_SANDBOX_IMAGE,null}

gdp_pdf_benchmark_simple_agent:
  responses_api_agents:
    gdp_pdf_agent:
      max_steps: 50
      datasets:
      - name: gdp_pdf
        type: benchmark
        jsonl_fpath: benchmarks/gdp_pdf/data/gdp_pdf_python_benchmark.jsonl
        prompt_config: null
        prepare_script: benchmarks/gdp_pdf/prepare_python.py
        num_repeats: 5
        license: MIT
