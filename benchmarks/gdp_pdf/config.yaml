# Chain to the existing resources server + agent config.
# The judge config is chained separately so a user who wants a non-OpenAI judge
# can drop judge_model_openai.yaml and supply their own.
config_paths:
  - resources_servers/gdp_pdf/configs/gdp_pdf.yaml
  - resources_servers/gdp_pdf/configs/judge_model_openai.yaml

# We use `_inherit_from` directives to inherit from and not use the generic config above to ensure this benchmark config is isolated.
gdp_pdf_benchmark_resources_server:
  _inherit_from: gdp_pdf

gdp_pdf_benchmark_simple_agent:
  _inherit_from: gdp_pdf_simple_agent
  responses_api_agents:
    gdp_pdf_agent:
      resources_server:
        name: gdp_pdf_benchmark_resources_server
      datasets:
      # num_repeats: 5 matches the published protocol -- GDP.pdf's headline
      # all-pass rate is reported over five independent attempts per task.
      - name: gdp_pdf
        type: benchmark
        jsonl_fpath: benchmarks/gdp_pdf/data/gdp_pdf_benchmark.jsonl
        prompt_config: null
        prepare_script: benchmarks/gdp_pdf/prepare.py
        num_repeats: 5
        license: MIT
