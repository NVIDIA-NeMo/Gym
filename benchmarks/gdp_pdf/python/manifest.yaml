name: gdp_pdf/python
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: other
description: GDP.pdf professional reasoning with a persistent Python tool over the source
  PDF, scored per rubric criterion over five attempts per task.
modality: multimodal
licensing: MIT
authors:
- dylanelu
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: stochastic
config_path: ../python.yaml
resources_server: gdp_pdf
agent_server: gdp_pdf_agent
datasets:
- name: gdp_pdf
  type: benchmark
  jsonl_fpath: benchmarks/gdp_pdf/data/gdp_pdf_python_benchmark.jsonl
  prepare_script: benchmarks/gdp_pdf/prepare_python.py
  num_repeats: 5
model_server: policy_model
session_model: episode
state: per_session
sandbox: Required for PDF access and persistent Python execution; select a Gym sandbox provider.
canonical_split: benchmark
prompt_source: prepared
lifecycle: active
