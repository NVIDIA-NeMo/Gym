config_paths:
  - resources_servers/audiobench_judge/configs/audiobench_judge.yaml

audiobench_judge_audiobench_judge_resources_server:
  _inherit_from: audiobench_judge

audiobench_judge_audiobench_judge_simple_agent:
  _inherit_from: audiobench_judge_simple_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        name: audiobench_judge_audiobench_judge_resources_server
      datasets:
      - name: audiobench_judge
        type: benchmark
        jsonl_fpath: benchmarks/audiobench/data/audiobench_judge.jsonl
        prepare_script: benchmarks/audiobench/judge/prepare.py
        prompt_config: benchmarks/audiobench/prompts/default.yaml
        num_repeats: 1
        license: Multiple (CC-BY-4.0, CC-BY-NC-4.0, MERaLiON-NSC gated; per-sub-dataset)

audiobench_judge_audiobench_judge_environment_server:
  _inherit_from: audiobench_judge_environment_server
  environment_servers:
    legacy_agent:
      agent_server:
        name: audiobench_judge_audiobench_judge_simple_agent
