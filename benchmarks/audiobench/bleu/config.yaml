config_paths:
  - resources_servers/asr_with_pc/configs/asr_with_pc.yaml

audiobench_bleu_asr_with_pc_resources_server:
  _inherit_from: asr_with_pc
  resources_servers:
    asr_with_pc:
      task_type: BLEU

audiobench_bleu_asr_with_pc_simple_agent:
  _inherit_from: asr_with_pc_simple_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        name: audiobench_bleu_asr_with_pc_resources_server
      datasets:
      - name: audiobench_bleu
        type: benchmark
        jsonl_fpath: benchmarks/audiobench/data/audiobench_bleu.jsonl
        prepare_script: benchmarks/audiobench/bleu/prepare.py
        prompt_config: benchmarks/audiobench/prompts/default.yaml
        num_repeats: 1
        license: CC-BY-4.0 (CoVoST 2)

audiobench_bleu_asr_with_pc_environment_server:
  _inherit_from: asr_with_pc_environment_server
  environment_servers:
    legacy_agent:
      agent_server:
        name: audiobench_bleu_asr_with_pc_simple_agent
