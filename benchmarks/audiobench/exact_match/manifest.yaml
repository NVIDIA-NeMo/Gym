name: audiobench/exact_match
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: other
description: AudioBench Spoken-MQA spoken math (4 sub-datasets) scored by exact match.
modality: audio
licensing: unknown
authors: [gwarmstrong]
reward:
  range: [0, 1]
  higher_is_better: true
determinism: stochastic
resources_server: asr_with_pc
agent_server: simple_agent
model_server: policy_model
datasets:
  - name: audiobench_exact_match
    type: benchmark
    jsonl_fpath: benchmarks/audiobench/data/audiobench_exact_match.jsonl
    prepare_script: benchmarks/audiobench/exact_match/prepare.py
    prompt_config: benchmarks/audiobench/prompts/default.yaml
    num_repeats: 1
standard_prompt_config: benchmarks/audiobench/prompts/default.yaml
canonical_split: benchmark
session_model: episode
state: none
lifecycle: active
