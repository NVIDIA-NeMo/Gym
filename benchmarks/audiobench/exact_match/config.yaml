config_paths:
  - resources_servers/asr_with_pc/configs/asr_with_pc.yaml

audiobench_exact_match_asr_with_pc_resources_server:
  _inherit_from: asr_with_pc
  resources_servers:
    asr_with_pc:
      task_type: EXACT_MATCH

audiobench_exact_match_asr_with_pc_simple_agent:
  _inherit_from: asr_with_pc_simple_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        name: audiobench_exact_match_asr_with_pc_resources_server
      datasets:
      - name: audiobench_exact_match
        type: benchmark
        jsonl_fpath: benchmarks/audiobench/data/audiobench_exact_match.jsonl
        prepare_script: benchmarks/audiobench/exact_match/prepare.py
        prompt_config: benchmarks/audiobench/prompts/default.yaml
        num_repeats: 1
        license: Apache-2.0 (Spoken-MQA)

audiobench_exact_match_asr_with_pc_environment_server:
  _inherit_from: asr_with_pc_environment_server
  environment_servers:
    legacy_agent:
      agent_server:
        name: audiobench_exact_match_asr_with_pc_simple_agent
