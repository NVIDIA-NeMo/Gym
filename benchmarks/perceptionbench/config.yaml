# PerceptionBench (MoonshotAI): 3,000 short-answer visual-perception VQA items across ten
# atomic perception capabilities, graded 0/1 by an LLM judge against reference answers.
config_paths:
  - resources_servers/perceptionbench/configs/perceptionbench.yaml
  - resources_servers/perceptionbench/configs/judge_model_openai.yaml

perceptionbench_benchmark_resources_server:
  _inherit_from: perceptionbench_resources_server
  resources_servers:
    perceptionbench:
      datasets:
      - name: perceptionbench
        type: benchmark
        jsonl_fpath: benchmarks/perceptionbench/data/perceptionbench_benchmark.jsonl
        prepare_script: benchmarks/perceptionbench/prepare.py
        num_repeats: 1
        license: CC-BY-NC-4.0

perceptionbench_benchmark_simple_agent:
  _inherit_from: perceptionbench_simple_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        type: resources_servers
        name: perceptionbench_benchmark_resources_server

perceptionbench_benchmark_environment_server:
  _inherit_from: perceptionbench_environment_server
  environment_servers:
    single_agent_turn_legacy:
      resources_server:
        type: resources_servers
        name: perceptionbench_benchmark_resources_server
      agent_server:
        type: responses_api_agents
        name: perceptionbench_benchmark_simple_agent
