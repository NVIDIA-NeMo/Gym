name: agentic_if
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-agent-loop
domain: instruction_following
description: Instruction following by a coding agent (OpenCode) that completes repository and terminal tasks in
  their sandboxes; reward is the task's own verifier result, and an LLM judge's per-instruction verdicts give
  if_all, if_frac and task_and_if.
modality: text
licensing: internal
authors:
- NVIDIA NeMo Gym contributors
maintainers:
- katherineh123
capabilities:
- instruction_and_format_following
- instruction_and_format_following/structured_output
- instruction_and_format_following/instruction_following
- writing_and_editing
- writing_and_editing/informational_writing
- writing_and_editing/summarization
- tool_and_computer_use
- tool_and_computer_use/tool_calling
- tool_and_computer_use/multi_step_tool_use
- tool_and_computer_use/web_search
- retrieval_and_grounding
- retrieval_and_grounding/open_retrieval
- retrieval_and_grounding/evidence_synthesis
- reasoning
- reasoning/quantitative_reasoning
- reasoning/deductive_reasoning
- knowledge
- knowledge/expert_knowledge
- coding
- coding/code_generation
- planning_and_autonomy
- planning_and_autonomy/task_planning
- human_ai_interaction
- human_ai_interaction/empathic_and_supportive_dialogue
domains:
- general
- computer_science
- psychology
- finance
- media_entertainment
- business_management
primary_metric: unknown
requirements:
  gpu: false
  network: public
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: stochastic
resources_server: agentic_if
agent_server: opencode_agent
datasets:
- name: agentic_if
  type: benchmark
  jsonl_fpath: benchmarks/agentic_if/data/agentic_if_benchmark.jsonl
  prepare_script: benchmarks/agentic_if/prepare.py
  num_repeats: 1
model_server: policy_model
canonical_split: full
prompt_source: prepared
lifecycle: active
