# APEX Shortlist with OpenCode agent sessions under single_agent_turn_legacy. Each session creates its own sandbox
# from the offline science image (see responses_api_agents/opencode_agent/configs/profiles/offline_science.yaml).
# opencode_legacy_agent.yaml keeps opencode_sandboxed_agent on the deprecated legacy_agent relay; the two harnesses
# are configured differently, so do not compare their scores as the same measurement.
config_paths:
- benchmarks/apex_shortlist/config.yaml
- responses_api_agents/opencode_agent/configs/profiles/offline_science.yaml
apex_shortlist_opencode_agent:
  _inherit_from: opencode_agent
  responses_api_agents:
    opencode_agent:
      resources_server:
        type: resources_servers
        name: apex_shortlist_math_with_judge_resources_server
      datasets:
      - name: apex_shortlist
        type: benchmark
        jsonl_fpath: benchmarks/apex_shortlist/data/apex_shortlist_benchmark.jsonl
        prompt_config: benchmarks/prompts/generic/math.yaml
        prepare_script: benchmarks/apex_shortlist/prepare.py
        num_repeats: 16
math_with_judge_simple_agent: null
apex_shortlist_math_with_judge_simple_agent: null

# Keep the benchmark's routing name and its single_agent_turn_legacy server, with this harness as the agent.
math_with_judge_environment_server: null
apex_shortlist_math_with_judge_environment_server:
  _delete_key: _inherit_from
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: apex_shortlist_math_with_judge_resources_server
      agent_server:
        type: responses_api_agents
        name: apex_shortlist_opencode_agent
