name: apex_shortlist
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: math
description: OpenMathReasoning math dataset with math-verify and LLM-as-a-judge
modality: text
licensing: unknown
authors:
- gwarmstrong
maintainers:
- gwarmstrong
capabilities:
- instruction_and_format_following
- instruction_and_format_following/structured_output
- reasoning
- reasoning/quantitative_reasoning
- reasoning/deductive_reasoning
- reasoning/spatial_temporal_reasoning
- knowledge
- knowledge/expert_knowledge
- knowledge/procedural_knowledge
- planning_and_autonomy
- planning_and_autonomy/strategy_and_search
domains:
- mathematics
primary_metric: pass@1[avg-of-1]/symbolic_accuracy
requirements:
  gpu: false
  network: no-network
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: math_with_judge
agent_server: simple_agent
datasets:
- name: apex_shortlist
  type: benchmark
  jsonl_fpath: benchmarks/apex_shortlist/data/apex_shortlist_benchmark.jsonl
  prepare_script: benchmarks/apex_shortlist/prepare.py
  prompt_config: benchmarks/prompts/generic/math.yaml
  num_repeats: 1
model_server: policy_model
canonical_split: train
standard_prompt_config: benchmarks/prompts/generic/math.yaml
lifecycle: active
