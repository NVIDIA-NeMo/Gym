name: apex_shortlist
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: math
description: MathArena APEX Shortlist math problems with symbolic-only math-verify
  grading.
modality: text
licensing: unknown
authors:
- gwarmstrong
maintainers:
- gwarmstrong
intended_use:
- evaluation
capabilities:
- instruction_and_format_following
- instruction_and_format_following/structured_output
- reasoning
- reasoning/quantitative_reasoning
- reasoning/deductive_reasoning
- reasoning/spatial_temporal_reasoning
- knowledge
- knowledge/expert_knowledge
- knowledge/procedural_knowledge
- planning_and_autonomy
- planning_and_autonomy/strategy_and_search
domains:
- mathematics
primary_metric: pass@1[avg-of-1]/symbolic_accuracy
requirements:
  gpu: false
  network: no-network
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: math_with_judge
agent_server: simple_agent
datasets:
- name: apex_shortlist
  type: benchmark
  jsonl_fpath: benchmarks/apex_shortlist/data/apex_shortlist_benchmark.jsonl
  prepare_script: benchmarks/apex_shortlist/prepare.py
  prompt_config: benchmarks/prompts/generic/math.yaml
  num_repeats: 1
model_server: policy_model
canonical_split: train
standard_prompt_config: benchmarks/prompts/generic/math.yaml
lifecycle: active
setups:
- name: apex_shortlist/opencode
  config_path: opencode.yaml
  integration_profile: custom-gym-agent-loop
  description: MathArena APEX Shortlist math problems with symbolic-only math-verify grading, solved by the OpenCode harness in agent sessions.
  primary_metric: pass@1[avg-of-16]/symbolic_accuracy
  requirements:
    network: allowlist
  agent_server: opencode_agent
  datasets:
  - name: apex_shortlist
    type: benchmark
    jsonl_fpath: benchmarks/apex_shortlist/data/apex_shortlist_benchmark.jsonl
    prepare_script: benchmarks/apex_shortlist/prepare.py
    prompt_config: benchmarks/prompts/generic/math.yaml
    num_repeats: 16
- name: apex_shortlist/opencode_legacy_agent
  config_path: opencode_legacy_agent.yaml
  integration_profile: custom-gym-agent-loop
  description: MathArena APEX Shortlist math problems with symbolic-only math-verify grading, solved by OpenCode through the sandboxed OpenCode agent server.
  primary_metric: pass@1[avg-of-16]/symbolic_accuracy
  requirements:
    network: allowlist
  agent_server: opencode_sandboxed_agent
  datasets:
  - name: apex_shortlist
    type: benchmark
    jsonl_fpath: benchmarks/apex_shortlist/data/apex_shortlist_benchmark.jsonl
    prepare_script: benchmarks/apex_shortlist/prepare.py
    prompt_config: benchmarks/prompts/generic/math.yaml
    num_repeats: 16
- name: apex_shortlist/pi
  config_path: pi.yaml
  integration_profile: custom-gym-agent-loop
  description: MathArena APEX Shortlist math problems with symbolic-only math-verify grading, solved by the pi harness in agent sessions.
  primary_metric: pass@1[avg-of-16]/symbolic_accuracy
  requirements:
    network: allowlist
  agent_server: pi_agent
  datasets:
  - name: apex_shortlist
    type: benchmark
    jsonl_fpath: benchmarks/apex_shortlist/data/apex_shortlist_benchmark.jsonl
    prepare_script: benchmarks/apex_shortlist/prepare.py
    prompt_config: benchmarks/prompts/generic/math.yaml
    num_repeats: 16
- name: apex_shortlist/pi_legacy_agent
  config_path: pi_legacy_agent.yaml
  integration_profile: custom-gym-agent-loop
  description: MathArena APEX Shortlist math problems with symbolic-only math-verify grading, solved by pi through the sandboxed pi agent server.
  primary_metric: pass@1[avg-of-16]/symbolic_accuracy
  requirements:
    network: allowlist
  agent_server: pi_sandboxed_agent
  datasets:
  - name: apex_shortlist
    type: benchmark
    jsonl_fpath: benchmarks/apex_shortlist/data/apex_shortlist_benchmark.jsonl
    prepare_script: benchmarks/apex_shortlist/prepare.py
    prompt_config: benchmarks/prompts/generic/math.yaml
    num_repeats: 16
