# PrimeVul paired vulnerability detection benchmark.
config_paths:
  - resources_servers/primevul/configs/primevul.yaml

primevul_benchmark_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: primevul
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: primevul
        type: benchmark
        jsonl_fpath: benchmarks/primevul/data/primevul_benchmark.jsonl
        prompt_config: benchmarks/primevul/prompt.yaml
        prepare_script: benchmarks/primevul/prepare.py
        license: MIT
        # Benchmark repetition is a run-level option. Pass `--num-repeats N` to `gym eval run`.
        num_repeats: 1
