name: cgbench
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: other
description: CG-Bench full single-turn full-video multiple-choice QA (long_acc without subtitles; 12,129 questions,
  1,219 videos, 5-8 options) across category, sub_category, domain, and duration buckets.
modality: video
licensing: MIT
authors:
- Guo Chen
maintainers:
- cg1177
capabilities:
- multimodal_input_understanding/temporal_media_understanding
- retrieval_and_grounding/long_context_learning
- reasoning/spatial_temporal_reasoning
domains:
- general
primary_metric: mean/CG_Bench
requirements:
  gpu: false
  network: no-network
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: stochastic
config_path: config.yaml
resources_server: cgbench
agent_server: simple_agent
datasets:
- name: cgbench
  type: benchmark
  jsonl_fpath: benchmarks/cgbench/data/cgbench_benchmark.jsonl
  prepare_script: benchmarks/cgbench/prepare.py
  num_repeats: 1
model_server: policy_model
canonical_split: benchmark
prompt_source: prepared
lifecycle: active
