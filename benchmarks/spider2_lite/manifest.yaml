name: spider2_lite
# Initial catalog composition version; not an upstream dataset release.
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: coding
description: >-
  Spider2 Lite SQLite validation tasks with prepared SQL task messages and binary execution-match scoring.
modality: text
licensing: unknown
# Contributor attribution follows the NVIDIA source headers.
authors:
  - NVIDIA NeMo Gym contributors
reward:
  range: [0, 1]
  higher_is_better: true
determinism: unknown
prompt_source: prepared
resources_server: spider2_lite
agent_server: simple_agent
model_server: policy_model
datasets:
  - name: spider2_lite
    type: benchmark
    jsonl_fpath: benchmarks/spider2_lite/data/spider2_lite_benchmark.jsonl
    prepare_script: benchmarks/spider2_lite/prepare.py
    num_repeats: 16
canonical_split: benchmark
lifecycle: active
