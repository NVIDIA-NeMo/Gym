config_paths:
  - resources_servers/genrm_eval/configs/genrm_eval.yaml

genrm_rmbench_resources_server:
  _inherit_from: genrm_eval
  resources_servers:
    genrm_eval:
      scoring_module: benchmarks.genrm_rmbench.metrics
      metric_key: avg
      additional_metric_keys: [domain_coverage]

genrm_rmbench_benchmark_agent:
  _inherit_from: genrm_eval_simple_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        name: genrm_rmbench_resources_server
      datasets:
        - name: genrm_rmbench
          type: benchmark
          jsonl_fpath: benchmarks/genrm_rmbench/data/rmbench_validation.jsonl
          prepare_script: benchmarks/genrm_rmbench/prepare.py
          prompt_config: null
          num_repeats: 1
          license: unknown

genrm_rmbench_environment_server:
  _inherit_from: genrm_eval_environment_server
  environment_servers:
    legacy_agent:
      agent_server:
        name: genrm_rmbench_benchmark_agent
