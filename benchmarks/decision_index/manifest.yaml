name: decision_index
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: other
description: Decision Index 0.3 public suite, LLM mode. 140,178 typed decision requests (choice and yes/no
  questions with explicit options) over 43 benchmarks in five areas; the policy answers each request with a JSON
  object, and the run is scored with the Decision Index kit's chance-corrected, coverage-adjusted public index.
modality: text
licensing: MIT AND Apache-2.0 AND CC-BY-4.0 AND CC-BY-3.0 AND CC-BY-SA-4.0 AND CC-BY-NC-4.0 AND LicenseRef-DecisionIndex-Upstream-Terms
authors:
- pst2154
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: decision_index
agent_server: simple_agent
datasets:
- name: decision_index
  type: benchmark
  jsonl_fpath: benchmarks/decision_index/data/decision_index_benchmark.jsonl
  prepare_script: benchmarks/decision_index/prepare.py
  prompt_config: benchmarks/decision_index/prompt.yaml
  num_repeats: 1
model_server: policy_model
canonical_split: test
standard_prompt_config: benchmarks/decision_index/prompt.yaml
lifecycle: active
