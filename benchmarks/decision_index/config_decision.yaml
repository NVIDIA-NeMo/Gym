# Decision Index 0.3 (public suite), decision-model mode: the policy is a typed decision engine behind
# decision_engine_model (/v1/systemone by default), which returns a probability for every option; decision_index
# validates the answers with the kit and scores the run with the kit's index. Set the engine with
# DECISION_ENGINE_BASE_URL / DECISION_ENGINE_API_KEY / DECISION_ENGINE_MODEL or the matching env.yaml keys.
config_paths:
- resources_servers/decision_index/configs/decision_index.yaml
- responses_api_models/decision_engine_model/configs/decision_engine_model.yaml

decision_index_decision_resources_server:
  _inherit_from: decision_index_resources_server
  resources_servers:
    decision_index:
      answer_mode: decision
      datasets:
      - name: decision_index
        type: benchmark
        jsonl_fpath: benchmarks/decision_index/data/decision_index_benchmark.jsonl
        prepare_script: benchmarks/decision_index/prepare.py
        prompt_config: benchmarks/decision_index/prompt.yaml
        num_repeats: 1

decision_index_decision_agent:
  _inherit_from: decision_index_simple_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        name: decision_index_decision_resources_server

decision_index_decision_environment_server:
  _inherit_from: decision_index_environment_server
  environment_servers:
    single_agent_turn_legacy:
      agent_server:
        name: decision_index_decision_agent
