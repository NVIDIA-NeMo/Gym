  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: sciknoweval
agent_server: simple_agent
model_server: policy_model
datasets:
- name: sciknoweval
  type: benchmark
  jsonl_fpath: benchmarks/sciknoweval/data/test.jsonl
  prepare_script: benchmarks/sciknoweval/prepare.py
  num_repeats: 1
canonical_split: test
prompt_source: prepared
adopted_from:
  source: https://huggingface.co/datasets/hicai-zju/SciKnowEval
  ref: 92ef969ad0a8bd6e195e0ac18af2c46e307e0cc2
  reconciled: '2026-10-12'
lifecycle: active
