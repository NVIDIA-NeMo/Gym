name: sciknoweval
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: knowledge
description: SciKnowEval V2 scientific knowledge across four domains and five levels
modality: text
licensing: Apache-2.0 AND MIT
authors:
- gnalbandyan
maintainers:
- gnalbandyan
intended_use:
- evaluation
capabilities:
- knowledge
- knowledge/expert_knowledge
- knowledge/factual_knowledge
- reasoning
- reasoning/quantitative_reasoning
- reasoning/deductive_reasoning
- instruction_and_format_following
- instruction_and_format_following/structured_output
domains:
- chemistry
- biology
- physics
primary_metric: mean/reward
requirements:
