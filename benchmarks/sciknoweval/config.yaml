config_paths:
- resources_servers/sciknoweval/configs/sciknoweval.yaml
sciknoweval_simple_agent:
  responses_api_agents:
    simple_agent:
      max_steps: 1
sciknoweval:
  resources_servers:
    sciknoweval:
      judge_model_server:
        type: responses_api_models
        name: policy_model
      judge_responses_create_params:
        input: []
        temperature: 0
        max_output_tokens: 16384
      datasets:
      - name: sciknoweval
        type: benchmark
        jsonl_fpath: benchmarks/sciknoweval/data/test.jsonl
        prepare_script: benchmarks/sciknoweval/prepare.py
        num_repeats: 1
