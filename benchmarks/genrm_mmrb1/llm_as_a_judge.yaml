config_paths:
  - benchmarks/genrm_mmrb1/dataset.yaml
  - resources_servers/genrm_eval/configs/llm_as_a_judge_model.yaml

judge_mode: llm_as_a_judge
genrm_mmrb1_benchmark_agent:
  responses_api_agents:
    simple_agent:
      resources_server:
        name: genrm_mmrb1_resources_server
      datasets:
        - name: genrm_mmrb1
          type: benchmark
          jsonl_fpath: benchmarks/genrm_mmrb1/data/genrm_mmrb1_llm_as_a_judge_validation.jsonl
          prepare_script: benchmarks/genrm_mmrb1/prepare.py
          prompt_config: null
          num_repeats: 1
          license: CC-BY-NC-4.0; third-party image licenses also apply

genrm_mmrb1_resources_server:
  _inherit_from: genrm_eval
  resources_servers:
    genrm_eval:
      verdict_format: brackets
