name: genrm_mmrb1/genrm
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: rlhf
description: Multimodal RewardBench 1 human-preference pairs of answers to image-grounded
  questions, judged by a GenRM checkpoint through its own chat template and scored
  by accuracy against the human preference.
modality: text, image
licensing: CC-BY-NC-4.0
authors:
- Julien Veron Vialard
maintainers:
- jveronvialard
capabilities:
- evaluation_and_judging
- evaluation_and_judging/preference_judging
- multimodal_input_understanding
- multimodal_input_understanding/scene_understanding
- multimodal_input_understanding/cross_modal_understanding
- evaluation_and_judging/error_analysis
domains:
- artificial_intelligence
- general
primary_metric: overall/accuracy
requirements:
  gpu: false
  network: no-network
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
config_path: ../genrm.yaml
resources_server: genrm_eval
agent_server: simple_agent
datasets:
- name: genrm_mmrb1
  type: benchmark
  jsonl_fpath: benchmarks/genrm_mmrb1/data/genrm_mmrb1_genrm_validation.jsonl
  prepare_script: benchmarks/genrm_mmrb1/prepare.py
  num_repeats: 1
model_server: policy_model
canonical_split: full
prompt_source: prepared
adopted_from:
  source: https://github.com/facebookresearch/multimodal_rewardbench
  ref: b4b92cdac0df81b2a134bcb1b91411d67b55f80f  # pragma: allowlist secret
  reconciled: '2026-10-23'
lifecycle: active
