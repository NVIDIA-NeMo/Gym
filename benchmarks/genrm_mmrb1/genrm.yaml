config_paths:
  - benchmarks/genrm_mmrb1/dataset.yaml
  - resources_servers/genrm_eval/configs/policy_model.yaml

genrm_mmrb1_benchmark_agent:
  responses_api_agents:
    simple_agent:
      datasets:
        - name: genrm_mmrb1
          type: benchmark
          jsonl_fpath: benchmarks/genrm_mmrb1/data/genrm_mmrb1_genrm_validation.jsonl
          prepare_script: benchmarks/genrm_mmrb1/prepare.py
          prompt_config: null
          num_repeats: 1
          license: CC-BY-NC-4.0; third-party image licenses also apply

policy_model:
  responses_api_models:
    genrm_model:
      base_url: ${policy_base_url}
      api_key: ${policy_api_key}
      supports_principle_role: false
      propagate_context_overflow_errors: true
