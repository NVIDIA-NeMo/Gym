config_paths:
  - resources_servers/genrm_eval/configs/genrm_eval.yaml

judge_mode: genrm
prepare_script_args:
  judge_mode: ${judge_mode}

genrm_eval:
  resources_servers:
    genrm_eval:
      scoring_module: resources_servers.genrm_eval.mmrb
      additional_metric_keys:
        - overall/accuracy_valid
        - overall/invalid_judgment_rate
        - overall/total_pairs
        - overall/total_judgments

genrm_mmrb1_benchmark_agent:
  _inherit_from: genrm_eval_simple_agent
  responses_api_agents:
    simple_agent:
      datasets:
      - name: genrm_mmrb1
        type: benchmark
        jsonl_fpath: benchmarks/genrm_mmrb1/data/genrm_mmrb1_genrm_validation.jsonl
        prepare_script: benchmarks/genrm_mmrb1/prepare.py
        prompt_config: null
        num_repeats: 1
        license: CC-BY-NC-4.0; third-party image licenses also apply

responses_create_params:
  max_output_tokens: 16384
  stream: false

genrm_mmrb1_environment_server:
  _inherit_from: genrm_eval_environment_server
  environment_servers:
    legacy_agent:
      agent_server:
        name: genrm_mmrb1_benchmark_agent
