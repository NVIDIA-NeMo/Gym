config_paths:
  - responses_api_agents/claweval_agent/configs/claweval_agent.yaml

claweval_multimodal_agent:
  _inherit_from: claweval_agent
  responses_api_agents:
    claweval_agent:
      claweval_config: ${oc.env:CLAW_EVAL_MULTIMODAL_CONFIG,config_multimodal.yaml}
      datasets:
        - name: claweval_multimodal
          type: benchmark
          jsonl_fpath: benchmarks/claweval/data/multimodal.jsonl
          prepare_script: benchmarks/claweval/prepare_multimodal.py
          prompt_config: null
          num_repeats: 3
          license: MIT

claweval_multimodal_environment_server:
  _inherit_from: claweval_environment_server
  environment_servers:
    legacy_agent:
      agent_server:
        name: claweval_multimodal_agent
