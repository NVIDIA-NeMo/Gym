config_paths:
  - benchmarks/claweval/sessions.yaml

claweval_assistant:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      num_workers: 1
      resources_server: {type: resources_servers, name: claweval_resources}
      model_server: {type: responses_api_models, name: policy_model}
      max_steps: 100

claweval_episode:
  environment_servers:
    claweval:
      agent_server: {type: responses_api_agents, name: claweval_assistant}
      tool_transport: direct_http
      turn_sessions: separate
