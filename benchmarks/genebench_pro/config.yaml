prepare_script_args:
  output_dir: benchmarks/genebench_pro/data
  docker_image: benchmarks/genebench_pro:latest

genebench_pro:
  responses_api_agents:
    harbor_agent_general:
      entrypoint: app.py
      domain: agent
      description: Harbor agent integration for GeneBench-Pro public case studies using OpenCode in Singularity environments.

      datasets:
        - name: genebench_pro
          type: benchmark
          jsonl_fpath: ${prepare_script_args.output_dir}/gym.jsonl
          prepare_script: benchmarks/genebench_pro/harbor/adapter.py
          prepare_dependencies:
            - huggingface_hub
            - tqdm
            - tyro
          num_repeats: 4

      harbor_max_retries: 3

      ## TIP: Auto-resolves to a sibling harbor folder when set.
      harbor_jobs_dir: ${oc.select:output_jsonl_fpath,''}

      harbor_dataset:
        path: ${prepare_script_args.output_dir}

      harbor_environment:
        type: singularity
        kwargs:
          singularity_image_cache_dir: ${oc.env:SINGULARITY_CACHEDIR}/harbor
          singularity_force_pull: false
          singularity_no_mount: home,tmp

      harbor_agent:
        name: opencode
        model_name: ${policy_model_name}
        env:
          OPENCODE_CONFIG_CONTENT: '{"snapshot": false}'
          NVINF_API_KEY: \${NVINF_API_KEY:-}
          VLLM_API_BASE: \${VLLM_API_BASE:-}

      ## The verifier must map the reference grader's `passed` decision to binary `reward`.
      harbor_reward_key: reward

genebench_pro_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: genebench_pro
