# LeanCat's prompt, as printed in the paper's Appendix D.1 (arXiv:2512.24796v2). The
# benchmark default: this is the template the published numbers correspond to.
#
# A reconstruction, not a copy -- the paper prints it inside a LaTeX listing. See the
# "Prompt" section of resources_servers/leancat/README.md for what was reconstructed and
# how it differs from the upstream repo's template in upstream-repo.yaml.
user: |-
  You are an expert in Lean 4 and Mathematics. Please finish the following proof in Lean4 code.
  Do not change the original statement. Copy the final statement to prove exactly.
  Please include the complete header (including imports and namespaces) so that your code can
  pass the Lean4 compiler. Please solve the statement step by step and provide your complete
  Lean4 code between ```lean4 and ``` after careful reasoning.
  The statement for you to complete is:

  ```lean4
  {formal_statement}
  ```
