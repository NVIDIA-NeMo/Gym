name: agentic_if_realworld
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: external-rollout-driver
domain: instruction_following
description: Frozen evaluation-only real-world Agentic IF single-turn text challenge
  with strict-v2.2 judging.
modality: text
licensing: internal
authors:
- Eric Yang
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: stochastic
resources_server: agentic_if_realworld
agent_server: simple_agent
datasets:
- name: agentic_if_realworld
  type: benchmark
  jsonl_fpath: benchmarks/agentic_if_realworld/data/prepared.jsonl
  prepare_script: benchmarks/agentic_if_realworld/prepare.py
  num_repeats: 1
model_server: policy_model
rollout_driver: benchmarks.agentic_if_realworld.rollout_driver:run_rollout_collection
canonical_split: development_exposed
prompt_source: prepared
lifecycle: active
