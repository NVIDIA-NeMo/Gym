name: agentic_if_realworld
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: external-rollout-driver
domain: instruction_following
description: Frozen evaluation-only real-world Agentic IF single-turn text challenge
  with strict-v2.2 judging.
modality: text
licensing: internal
authors:
- Eric Yang
maintainers:
- ericyang0
capabilities:
- instruction_and_format_following
- instruction_and_format_following/instruction_following
- context_management
- context_management/constraint_preservation
- retrieval_and_grounding
- retrieval_and_grounding/long_context_learning
- tool_and_computer_use
- tool_and_computer_use/tool_calling
domains:
- general
primary_metric: composite/complete_accuracy
requirements:
  gpu: false
  network: allowlist
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: stochastic
resources_server: agentic_if_realworld
agent_server: simple_agent
datasets:
- name: agentic_if_realworld
  type: benchmark
  jsonl_fpath: benchmarks/agentic_if_realworld/data/prepared.jsonl
  prepare_script: benchmarks/agentic_if_realworld/prepare.py
  num_repeats: 1
model_server: policy_model
rollout_driver: benchmarks.agentic_if_realworld.rollout_driver:run_rollout_collection
canonical_split: development_exposed
prompt_source: prepared
lifecycle: active
