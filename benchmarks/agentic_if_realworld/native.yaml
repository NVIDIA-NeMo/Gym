# Standard Gym execution, independent of the adaptive evaluation driver.
# Select a stock policy server with --model-type.
config_paths:
  - resources_servers/agentic_if_realworld/configs/agentic_if_realworld.yaml
policy_api_key: ${oc.env:AGENTIC_IF_POLICY_API_KEY,""}
agentic_if_realworld_resources:
  resources_servers:
    agentic_if_realworld:
      response_source: gym_response
      datasets:
        - name: agentic_if_realworld
          type: benchmark
          jsonl_fpath: benchmarks/agentic_if_realworld/data/prepared.jsonl
          prepare_script: benchmarks/agentic_if_realworld/prepare.py
          num_repeats: 1
agentic_if_realworld_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      execute_tools: false
      resources_server: {type: resources_servers, name: agentic_if_realworld_resources}
      model_server: {type: responses_api_models, name: policy_model}
agentic_if_realworld_environment:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      cleanup_timeout_seconds: 180
      resources_server: {type: resources_servers, name: agentic_if_realworld_resources}
      resources_tool_transports: []
      agent_server: {type: responses_api_agents, name: agentic_if_realworld_agent}
