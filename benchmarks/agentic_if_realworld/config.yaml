config_paths:
  - resources_servers/agentic_if_realworld/configs/agentic_if_realworld.yaml
rollout_collection_driver: benchmarks.agentic_if_realworld.rollout_driver:run_rollout_collection
agentic_if_realworld_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server: {type: resources_servers, name: agentic_if_realworld_resources}
      model_server: {type: responses_api_models, name: policy_model}
      max_steps: 1
      skip_verification: true
agentic_if_realworld_environment:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server: {type: responses_api_agents, name: agentic_if_realworld_agent}
policy_model:
  responses_api_models:
    agentic_if_text:
      entrypoint: app.py
      endpoint: ${oc.env:AGENTIC_IF_POLICY_ENDPOINT,http://localhost:8000/v1/chat/completions}
      model: ${oc.env:AGENTIC_IF_POLICY_MODEL,policy}
      receipt_dir: ${agentic_if_realworld_resources.resources_servers.agentic_if_realworld.receipt_dir}
      api_key_env: AGENTIC_IF_POLICY_API_KEY
      reasoning_effort: null
