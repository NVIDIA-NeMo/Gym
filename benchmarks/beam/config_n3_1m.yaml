# BEAM — full set (100K / 500K / 1M splits), Nemotron-3 tokenizer. `prepare_n3_1m.py` keeps only
# questions whose full prompt (whole chat + question, default single-turn
# harness, Nemotron-3 chat template) is <= 1048576 tokens; nothing is truncated.
config_paths:
  - resources_servers/beam/configs/beam.yaml

beam_n3_1m_benchmark_simple_agent:
  _inherit_from: beam_simple_agent
  responses_api_agents:
    simple_agent:
      datasets:
      - name: beam_n3_1m
        type: benchmark
        jsonl_fpath: benchmarks/beam/data/beam_n3_1m_benchmark.jsonl
        prompt_config: null
        prepare_script: benchmarks/beam/prepare_n3_1m.py
        license: Creative Commons Attribution-ShareAlike 4.0 International
        # pass@1[avg-of-4]: collation repeats every question 4x (keep --num-repeats at 1).
        num_repeats: 4

beam_n3_1m_benchmark_environment_server:
  _inherit_from: beam_environment_server
  environment_servers:
    legacy_agent:
      agent_server:
        name: beam_n3_1m_benchmark_simple_agent
