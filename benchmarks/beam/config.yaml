# Full-length BEAM (100K / 500K / 1M chats, no truncation). Serving the 1M split
# needs a ~1M-token window; for a capped variant see config_muse_128k.yaml or
# run prepare.py with --tokenizer_name / --max_context_tokens.
config_paths:
  - resources_servers/beam/configs/beam.yaml

beam_benchmark_simple_agent:
  _inherit_from: beam_simple_agent
  responses_api_agents:
    simple_agent:
      datasets:
      - name: beam
        type: benchmark
        jsonl_fpath: benchmarks/beam/data/beam_benchmark.jsonl
        prompt_config: null
        prepare_script: benchmarks/beam/prepare.py
        license: Creative Commons Attribution-ShareAlike 4.0 International
        # pass@1[avg-of-4]: collation repeats every question 4x (keep --num-repeats at 1).
        num_repeats: 4

beam_benchmark_environment_server:
  _inherit_from: beam_environment_server
  environment_servers:
    legacy_agent:
      agent_server:
        name: beam_benchmark_simple_agent
