[project]
name = "automationbench-env"
version = "0.1.0"
requires-python = ">=3.13.14"
dependencies = [
    "nemo-gym",
    "automation-bench @ git+https://github.com/zapier/AutomationBench.git@4a8e1061254004d9dac807054eed33fad7d1ff14",
    # verifiers requires openai unbounded. Left free it pulls openai 3.x and
    # openai-agents 0.22, which imports PromptCacheOptions -- a name openai
    # 2.44.0 does not have. Installing into a running Gym cannot replace the
    # already-imported openai 2.44.0, so that import fails. Stay on Gym's line.
    "openai<3",
]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["automationbench_env"]

[tool.uv]
constraint-dependencies = ["grpcio>=1.81.0rc1", "msgpack>=1.2.1"]
override-dependencies = ["spacy>=3.8.13", "wcwidth; sys_platform == 'never'", "opencv-python-headless; sys_platform == 'never'", "pynvvideocodec; sys_platform == 'never'", "torchcodec; sys_platform == 'never'", "torchvision; sys_platform == 'never'", "torchaudio; sys_platform == 'never'", "pycountry; sys_platform == 'never'", "gprof2dot; sys_platform == 'never'", "pathspec; sys_platform == 'never'"]
exclude-dependencies = ["fasttext-wheel", "alembic", "blinker", "cryptography", "flask", "flask-cors", "graphene", "graphql-core", "graphql-relay", "gunicorn", "huey", "prettytable", "skops", "sqlalchemy", "werkzeug", "waitress", "diskcache"]

[tool.uv.sources]
"nemo-gym" = { path = "../..", editable = true }
"nemo-lens" = { git = "https://github.com/NVIDIA-NeMo/Lens.git", rev = "4d045c03186b90afdc815db46b671f6a21bc7e98" }

[tool.uv.workspace]
members = []
