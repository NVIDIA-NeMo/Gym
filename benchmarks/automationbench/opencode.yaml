# AutomationBench with OpenCode in place of simple_agent: the same resources server, tasks and aa_headline scoring as
# config.yaml. OpenCode runs in a sandbox it creates and calls the api tools over MCP. See "Session harnesses" in
# README.md for the run command, the sandbox image and the model server settings.
config_paths:
  - benchmarks/automationbench/config.yaml
  - responses_api_agents/opencode_agent/configs/profiles/benchmark.yaml

# The sandbox reaches the resources server's MCP endpoint by address, so the resources servers leave loopback too.
absolute_ip_server_types: [responses_api_models, resources_servers]

# Sampling goes on the model server, as for the other harness presets: drop config.yaml's run-level temperature and
# top_p. Deleted, not cleared, so the other workloads of a run keep their rows' values.
responses_create_params:
  _delete_key: temperature,top_p

# Drop simple_agent and its environment server; automationbench_opencode_environment_server below runs OpenCode.
automationbench: null
automationbench_environment_server: null

automationbench_resources_server:
  resources_servers:
    automationbench:
      expose_tools_over_mcp: true
      # The harness-neutral rows below carry no tools: OpenCode takes them from its MCP grant.
      rows_carry_tools: false

automationbench_opencode_agent:
  _inherit_from: opencode_agent
  responses_api_agents:
    opencode_agent:
      resources_server:
        type: resources_servers
        name: automationbench_resources_server
      # The task needs no files in the sandbox: any Linux glibc image with bash, curl, tar, gzip and CA certificates.
      sandbox_config:
        image: python:3.12
      # The task needs nothing from the internet, but OpenCode installs its runtime in the sandbox at the start of
      # each episode, from GitHub. With model_and_tools, supply the binary in the image instead
      # (sandbox_executable_path and sandbox_executable_sha256).
      network_access: inherit
      sandbox_executable_path: null
      sandbox_executable_sha256: null
      # OpenCode compacts near context_window minus min(20000, max_output_tokens): 229,376 + 32,768 keeps every call
      # inside a 262,144-token window.
      context_window: 229376
      max_output_tokens: 32768
      timeout: 3600
      datasets:
        # The tasks without the tool list and the output budget, which OpenCode refuses in the request
        # (prepare_harness_neutral.py; `gym eval prepare --benchmark automationbench/opencode`).
        - name: automationbench
          type: benchmark
          jsonl_fpath: benchmarks/automationbench/data/automationbench-600-harness-neutral.jsonl
          prepare_script: benchmarks/automationbench/prepare_harness_neutral.py
          prepare_project: benchmarks/automationbench
          num_repeats: 1
          license: MIT

# Its own environment server rather than config.yaml's rebound, so a run that loads several of these presets binds
# each harness.
automationbench_opencode_environment_server:
  _inherit_from: single_agent_turn_legacy
  environment_servers:
    single_agent_turn_legacy:
      resources_server:
        type: resources_servers
        name: automationbench_resources_server
      agent_server:
        type: responses_api_agents
        name: automationbench_opencode_agent
      resources_tool_transports: [mcp]
