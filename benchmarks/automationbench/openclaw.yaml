# AutomationBench with OpenClaw in place of simple_agent: the same resources server, tasks and aa_headline scoring as
# config.yaml. OpenClaw runs in a sandbox it creates and calls the api tools over MCP. See "Session harnesses" in
# README.md for the run command, the sandbox image and the model server settings.

# config.yaml's resources server and environment server type, without config.yaml itself: its run-level
# temperature and top_p would reach every row of a run that loads it. These presets set no run-level request
# field; sampling goes on the model server.
config_paths:
  - resources_servers/automationbench/configs/automationbench.yaml
  - environment_servers/single_agent_turn_legacy/configs/single_agent_turn_legacy.yaml
  - responses_api_agents/openclaw_agent/configs/profiles/benchmark.yaml

# The sandbox reaches the resources server's MCP endpoint by address, so the resources servers leave loopback too.
absolute_ip_server_types: [responses_api_models, resources_servers]

automationbench_resources_server:
  resources_servers:
    automationbench:
      expose_tools_over_mcp: true
      # The harness-neutral rows below carry no tools: OpenClaw takes them from its MCP grant.
      rows_carry_tools: false

automationbench_openclaw_agent:
  _inherit_from: openclaw_agent
  responses_api_agents:
    openclaw_agent:
      resources_server:
        type: resources_servers
        name: automationbench_resources_server
      # The task needs no files in the sandbox: any Linux glibc image with bash, curl, tar, gzip and CA certificates.
      sandbox_config:
        image: python:3.12
      # The task needs nothing from the internet, but OpenClaw installs Node.js and its runtime in the sandbox at the
      # start of each episode, from nodejs.org and the npm registry. With model_and_tools, supply the runtime in the
      # image instead (sandbox_runtime_dir).
      network_access: inherit
      sandbox_runtime_dir: null
      # The served model's context length; OpenClaw assumes 200,000 tokens when it is unset.
      context_window: 262144
      # Per model call (OpenClaw's maxTokens); OpenClaw requests less when the input leaves less room.
      max_output_tokens: 32768
      timeout: 3600
      # One model call; a 32,768-token reply can take longer than the 600 s default.
      model_timeout_seconds: 1800
      # Concurrent OpenClaw runs. Keep it at least the environment server's max_concurrent_episodes: an episode
      # beyond it waits with its deadline running.
      concurrency: 32
      datasets:
        # The tasks without the tool list and the output budget, which OpenClaw refuses in the request
        # (prepare_harness_neutral.py; `gym eval prepare --benchmark automationbench/openclaw`).
        - name: automationbench
          type: benchmark
          jsonl_fpath: benchmarks/automationbench/data/automationbench-600-harness-neutral.jsonl
          prepare_script: benchmarks/automationbench/prepare_harness_neutral.py
          prepare_project: benchmarks/automationbench
          num_repeats: 1
          license: MIT

# Its own environment server, so a run that loads several of these presets binds each harness.
automationbench_openclaw_environment_server:
  _inherit_from: single_agent_turn_legacy
  environment_servers:
    single_agent_turn_legacy:
      resources_server:
        type: resources_servers
        name: automationbench_resources_server
      agent_server:
        type: responses_api_agents
        name: automationbench_openclaw_agent
      resources_tool_transports: [mcp]
      # Admit episodes at the agent's rate (its concurrency, 32): an episode admitted beyond it would wait for a
      # OpenClaw run with its deadline running. Admission comes before the deadline starts.
      max_concurrent_episodes: 32
      queue_timeout_seconds: 86400
