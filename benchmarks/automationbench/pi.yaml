# AutomationBench with Pi in place of simple_agent: the same resources server, rows and aa_headline scoring as
# config.yaml. Pi runs in a sandbox it creates and calls the api tools over MCP. See "Session harnesses" in
# README.md for the run command, the sandbox image and the model server settings.
config_paths:
  - benchmarks/automationbench/config.yaml
  - responses_api_agents/pi_agent/configs/profiles/benchmark.yaml

# The sandbox reaches the resources server's MCP endpoint by address, so the resources servers leave loopback too.
absolute_ip_server_types: [responses_api_models, resources_servers]

# The harness takes the tools from its MCP grant and refuses a tool list in the request, so the run drops the rows'
# tools, and with them their output budget and config.yaml's sampling: set sampling on the model server.
responses_create_params:
  tools: []
  max_output_tokens: null
  temperature: null
  top_p: null

# Drop simple_agent; the environment server below runs Pi.
automationbench: null

automationbench_resources_server:
  resources_servers:
    automationbench:
      expose_tools_over_mcp: true

automationbench_pi_agent:
  _inherit_from: pi_agent
  responses_api_agents:
    pi_agent:
      resources_server:
        type: resources_servers
        name: automationbench_resources_server
      # The task needs no files in the sandbox: any Linux glibc image with bash, curl, tar, gzip and CA certificates.
      sandbox_config:
        image: python:3.12
      # The task needs nothing from the internet, but Pi installs Node.js and Pi in the sandbox at the start of each
      # episode, from nodejs.org and the npm registry. With model_and_tools, supply the runtime in the image instead
      # (sandbox_runtime_dir).
      network_access: inherit
      sandbox_runtime_dir: null
      context_window: 262144
      # Per model call; the shipped 131,072 leaves no room for a prompt past half a 262,144-token window.
      max_output_tokens: 32768
      timeout: 3600
      datasets:
        - name: example
          type: example
          jsonl_fpath: benchmarks/automationbench/data/example.jsonl
          license: MIT
        - name: automationbench
          type: benchmark
          jsonl_fpath: benchmarks/automationbench/data/automationbench-600.jsonl
          prepare_script: benchmarks/automationbench/prepare.py
          prepare_project: benchmarks/automationbench
          num_repeats: 1
          license: MIT

automationbench_environment_server:
  environment_servers:
    single_agent_turn_legacy:
      agent_server:
        type: responses_api_agents
        name: automationbench_pi_agent
      resources_tool_transports: [mcp]
