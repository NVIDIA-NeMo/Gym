# AutomationBench with Hermes in place of simple_agent: the same resources server, tasks and aa_headline scoring as
# config.yaml. Hermes runs in a sandbox it creates and calls the api tools over MCP. See "Session harnesses" in
# README.md for the run command, the sandbox image and the model server settings.
config_paths:
  - benchmarks/automationbench/config.yaml
  - responses_api_agents/hermes_agent/configs/profiles/benchmark.yaml

# The sandbox reaches the resources server's MCP endpoint by address, so the resources servers leave loopback too.
absolute_ip_server_types: [responses_api_models, resources_servers]

# Hermes refuses top_p in the request and sends its own temperature: drop config.yaml's run-level temperature and
# top_p, and set sampling on the model server. Deleted, not cleared, so the other workloads of a run keep their rows'
# values.
responses_create_params:
  _delete_key: temperature,top_p

# Drop simple_agent and its environment server; automationbench_hermes_environment_server below runs Hermes.
automationbench: null
automationbench_environment_server: null

automationbench_resources_server:
  resources_servers:
    automationbench:
      expose_tools_over_mcp: true
      # The harness-neutral rows below carry no tools: Hermes takes them from its MCP grant.
      rows_carry_tools: false

automationbench_hermes_agent:
  _inherit_from: hermes_agent
  responses_api_agents:
    hermes_agent:
      resources_server:
        type: resources_servers
        name: automationbench_resources_server
      # The task needs no files in the sandbox: any Linux glibc image with bash, curl, tar, gzip and CA certificates.
      sandbox_config:
        image: python:3.12
      # The Agent Server uploads Hermes's runtime, so the sandbox needs to reach only the model server and the
      # resources server's MCP endpoint.
      network_access: model_and_tools
      # verifiers' max_turns.
      max_turns: 50
      # The served model's context length; Hermes falls back to 128,000 tokens when it is unset.
      context_length: 262144
      # Per model call.
      max_tokens: 32768
      sandbox_runner_timeout_seconds: 3600
      datasets:
        # The tasks without the tool list and the output budget, which Hermes refuses in the request
        # (prepare_harness_neutral.py; `gym eval prepare --benchmark automationbench/hermes`).
        - name: automationbench
          type: benchmark
          jsonl_fpath: benchmarks/automationbench/data/automationbench-600-harness-neutral.jsonl
          prepare_script: benchmarks/automationbench/prepare_harness_neutral.py
          prepare_project: benchmarks/automationbench
          num_repeats: 1
          license: MIT

# Its own environment server rather than config.yaml's rebound, so a run that loads several of these presets binds
# each harness.
automationbench_hermes_environment_server:
  _inherit_from: single_agent_turn_legacy
  environment_servers:
    single_agent_turn_legacy:
      resources_server:
        type: resources_servers
        name: automationbench_resources_server
      agent_server:
        type: responses_api_agents
        name: automationbench_hermes_agent
      resources_tool_transports: [mcp]
