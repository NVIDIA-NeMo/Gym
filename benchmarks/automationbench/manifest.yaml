name: automationbench
version: 0.2.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: other
description: AutomationBench enterprise workflows scored by guardrail-gated objective
  completion, run with simple_agent sessions against the automationbench resources server.
modality: text
licensing: MIT
authors:
- Christian Munley
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
agent_server: simple_agent
datasets:
- name: example
  type: example
  jsonl_fpath: benchmarks/automationbench/data/example.jsonl
  num_repeats: 1
- name: automationbench
  type: benchmark
  jsonl_fpath: benchmarks/automationbench/data/automationbench-600.jsonl
  prepare_script: benchmarks/automationbench/prepare.py
  num_repeats: 1
model_server: policy_model
canonical_split: benchmark
prompt_source: prepared
lifecycle: active
resources_server: automationbench
