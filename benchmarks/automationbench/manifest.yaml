name: automationbench
version: 0.2.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: agent
description: AutomationBench enterprise workflows scored by guardrail-gated objective
  completion, run with simple_agent sessions against the automationbench resources server.
modality: text
licensing: MIT
authors:
- Christian Munley
maintainers:
- cmunley1
- d-molinari
intended_use:
- evaluation
primary_metric: pass@1[avg-of-1]/aa_headline
requirements:
  gpu: false
  network: no-network
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
agent_server: simple_agent
datasets:
- name: example
  type: example
  jsonl_fpath: benchmarks/automationbench/data/example.jsonl
  num_repeats: 1
- name: automationbench
  type: benchmark
  jsonl_fpath: benchmarks/automationbench/data/automationbench-600.jsonl
  prepare_script: benchmarks/automationbench/prepare.py
  num_repeats: 1
model_server: policy_model
canonical_split: full
prompt_source: prepared
lifecycle: active
resources_server: automationbench
adopted_from:
  source: https://github.com/zapier/AutomationBench
  ref: 4a8e1061254004d9dac807054eed33fad7d1ff14
  reconciled: '2026-11-04'
