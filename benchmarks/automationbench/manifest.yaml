name: automationbench
version: 0.2.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: agent
description: AutomationBench enterprise workflows scored by guardrail-gated objective
  completion, run with simple_agent sessions against the automationbench resources server.
modality: text
licensing: MIT
authors:
- Christian Munley
maintainers:
- cmunley1
- d-molinari
capabilities:
- tool_and_computer_use
- tool_and_computer_use/tool_calling
- tool_and_computer_use/multi_step_tool_use
- tool_and_computer_use/env_feedback_interpretation
- instruction_and_format_following
- instruction_and_format_following/instruction_following
- retrieval_and_grounding
- retrieval_and_grounding/evidence_synthesis
- data_analysis
- data_analysis/tabular_data_analysis
- writing_and_editing
- writing_and_editing/summarization
- writing_and_editing/informational_writing
- reasoning
- reasoning/quantitative_reasoning
domains:
- business_management
- general
- marketing_advertising
- accounting_audit
primary_metric: pass@1[avg-of-1]/aa_headline
