# AutomationBench scored with the Artificial Analysis headline metric, run with simple_agent through the
# single_agent_turn Environment Server. See README.md.
#
#   gym eval prepare --benchmark automationbench
#   gym eval run --benchmark automationbench --split benchmark --output <rollouts.jsonl> ...
#
# The verifiers_agent recipe behind the legacy_agent relay is config_legacy_agent.yaml (deprecated).
config_paths:
  - resources_servers/automationbench/configs/automationbench.yaml
  - environment_servers/single_agent_turn_legacy/configs/single_agent_turn_legacy.yaml

automationbench:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      # verifiers' max_turns: 50 model calls per task.
      max_steps: 50
      # Sessions take tool access from the Environment Server's grant; dataset tooling finds the task schema here.
      resources_server:
        type: resources_servers
        name: automationbench_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
        - name: example
          type: example
          jsonl_fpath: benchmarks/automationbench/data/example.jsonl
          license: MIT
        - name: automationbench
          type: benchmark
          jsonl_fpath: benchmarks/automationbench/data/automationbench-600.jsonl
          prepare_script: benchmarks/automationbench/prepare.py
          # prepare() imports automationbench_env from this directory's own
          # package, which is not a Gym dependency.
          prepare_project: benchmarks/automationbench
          num_repeats: 1
          license: MIT

automationbench_environment_server:
  _inherit_from: single_agent_turn_legacy
  environment_servers:
    single_agent_turn_legacy:
      resources_server:
        type: resources_servers
        name: automationbench_resources_server
      agent_server:
        type: responses_api_agents
        name: automationbench
      resources_tool_transports:
        - direct_http
