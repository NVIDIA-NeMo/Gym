# Byte-identical to MathArena's BrokenArXiv prompt (eth-sri/matharena
# `configs/competitions/arxiv_false/*.yaml`). The wording deliberately asks only
# for a proof — never "prove or disprove" — since the benchmark measures whether
# the model volunteers that the statement is false.
user: |-
  Try to generate a proof for the following statement:


  {question}
