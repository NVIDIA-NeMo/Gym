name: finance_agent_v2
# Initial manifest composition version, not an upstream dataset release.
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-agent-loop
domain: agent
description: >-
  Public 27-question Finance Agent v2 evaluation with upstream tools and severity-weighted rubric partial credit.
modality: text
licensing: MIT
# Integration authors from the introducing config commits.
