    type: benchmark
    jsonl_fpath: benchmarks/finance_agent_v2/data/vals_v2_public_27q.jsonl
    prepare_script: benchmarks/finance_agent_v2/prepare.py
    num_repeats: 1
# Gym evaluation split; upstream splits are described separately.
canonical_split: benchmark
lifecycle: active
