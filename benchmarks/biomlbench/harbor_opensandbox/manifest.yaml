name: biomlbench/harbor_opensandbox
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: external-agent-loop
domain: agent
description: BioML-bench v0.1a CPU tasks through Harbor and OpenSandbox, in the upstream task image.
modality: text
licensing: MIT
authors:
  - science-machine (BioML-bench)
  - NVIDIA NeMo Gym contributors
reward:
