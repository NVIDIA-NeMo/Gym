config_paths:
- resources_servers/combibench/configs/combibench.yaml

# Isolated instances so a benchmark run never shares state with the generic config.
combibench_resources_server:
  _inherit_from: combibench
  resources_servers:
    combibench:
      datasets:
      # Prepared with `split=test` by default: the paper's "without solution" setting.
      # `gym eval prepare --benchmark combibench +prepare_script_args.split=test_with_solution`
      # prepares the "with solution" setting (answers substituted, only the proof missing)
      # into the same file; rows are tagged by `split`.
      - name: combibench
        type: benchmark
        jsonl_fpath: benchmarks/combibench/data/combibench.jsonl
        prepare_script: benchmarks/combibench/prepare.py
        prompt_config: benchmarks/combibench/prompt.yaml
        # The paper reports Pass@1/8/16 from 16 samples per problem.
        num_repeats: 16
        license: MIT

combibench_agent:
  _inherit_from: combibench_simple_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        name: combibench_resources_server
      datasets: []
