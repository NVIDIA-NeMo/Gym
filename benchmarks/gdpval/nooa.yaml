# Native generation-only collection. Configure an audited GDP image and durable
# artifacts; use a pinned GDP judge_only recipe to score them afterward.
config_paths:
  - resources_servers/gdpval/configs/gdpval.yaml
  - responses_api_agents/nooa_agent/configs/nooa_agent.yaml
  - environment_servers/single_agent_turn/configs/single_agent_turn.yaml

num_samples_in_parallel: 8
max_resident_rollout_tasks: 8

sandbox:
  apptainer:
    create:
      mount_point: /workspace
      # The audited HSG controller is already UID 0 inside Pyxis. Explicitly
      # create a child user namespace so later instance joins do not re-enter it.
      extra_start_args: [--userns, --containall, --cleanenv, --writable-tmpfs]
    exec:
      # The NOOA supervisor spans the whole episode; the environment owns its
      # 6-hour deadline. Per-command preparation/tool limits remain explicit.
      default_timeout_s: null
      fakeroot_for_root: false
      extra_exec_args: [--cleanenv, --writable-tmpfs]

gdpval_judge_model:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: ${oc.env:JUDGE_BASE_URL,https://inference-api.nvidia.com/v1}
      openai_api_key: ${oc.env:JUDGE_API_KEY,dummy}
      openai_model: ${oc.env:JUDGE_MODEL_NAME,gcp/google/gemini-3.1-pro-preview}

gdpval_nooa_resources_server:
  _inherit_from: gdpval_resources_server
  resources_servers:
    gdpval:
      entrypoint: sandbox_app.py
      allowed_agents: [nooa_agent]
      num_workers: 1
      image: ${oc.env:GDPVAL_CONTAINER_PATH,null}
      deliverables_root: ${oc.env:PERSIST_DELIVERABLES_DIR,null}
      hf_token: ${oc.env:HF_TOKEN,null}
      execute_only: true
      # These verifier defaults are inactive during generation. Inline grading
      # requires execute_only=false, comparison mode and explicit references.
      reward_mode: rubric
      preconvert_office_to_pdf: false
      judge_sampling_seed: 42
      num_comparison_trials: 4
      persist_raw_judge_responses: true
      judge_panel:
        - name: gpt-5.5
          model: openai/openai/gpt-5.5
          create_params_overrides: {reasoning_effort: medium}
        - name: gemini-3.1-pro
          model: gcp/google/gemini-3.1-pro-preview
          create_params_overrides: {extra_body: {reasoning_effort: high}}
          handles_audio_video: true
        - name: claude-opus-4.8
          model: aws/anthropic/bedrock-claude-opus-4-8
          create_params_overrides: {extra_body: {thinking: {type: enabled}}}
      datasets:
        - name: gdpval
          type: benchmark
          jsonl_fpath: benchmarks/gdpval/data/gdpval_nooa.jsonl
          prepare_script: benchmarks/gdpval/prepare_nooa.py
          num_repeats: 1

gdpval_nooa_agent:
  _inherit_from: nooa_agent
  responses_api_agents:
    nooa_agent:
      nooa:
        execution_mode: sandboxed
      max_policy_calls: 250
      context_window: 262144

gdpval_nooa:
  _inherit_from: single_agent_turn
  environment_servers:
    single_agent_turn:
      max_concurrent_episodes: ${num_samples_in_parallel}
      queue_timeout_seconds: 300
      default_episode_timeout_seconds: 21600
      cleanup_timeout_seconds: 180
      resources_server:
        type: resources_servers
        name: gdpval_nooa_resources_server
      agent_server:
        type: responses_api_agents
        name: gdpval_nooa_agent
