# GDPVal with Codex in place of Stirrup: same resources server, judges and multi-stage driver as config.yaml.
# Codex runs in the task sandbox the resources server lends it and reaches the task tools
# (finish, abandon_task_finish, web_search, fetch_web_page) over MCP. The rows use the harness-neutral prompt.
# See "Run another harness" in README.md for the run command and the model server settings Codex needs.
# Codex has no finish_tool_names: finish does not end its run. Codex continues until the model replies without a
# tool call, a later finish or abandon_task_finish replaces the recorded call, and the resources server collects
# the files when the run ends.
config_paths:
  - benchmarks/gdpval/config.yaml

# Drop the Stirrup agent; the environment server below runs Codex instead.
gdpval_stirrup_agent: null

gdpval_resources_server:
  resources_servers:
    gdpval:
      allowed_agents: [codex_agent]
      expose_tools_over_mcp: true

gdpval_codex_agent:
  responses_api_agents:
    codex_agent:
      entrypoint: app.py
      description: GDPVal professional deliverable tasks with Codex in place of Stirrup
      model_server:
        type: responses_api_models
        name: policy_model
      model: ${policy_model_name}
      codex_version: 0.144.4
      # Concurrent Codex runs, as Stirrup's concurrency. Keep it at least the environment server's
      # max_concurrent_episodes: an episode beyond it waits with its sandbox started and its deadline running.
      concurrency: 32
      model_context_window: 262144
      # Codex checks this after each reply that calls a tool, so the context can pass it by about a reply and its
      # tool output. The compaction call re-sends the context without the tool definitions, and vLLM reserves
      # 32,768 tokens for its reply: 196,608 + 32,768 + 32,768 = 262,144 fits a full reply with a short tool
      # result. At 229,376 the compaction call would usually overflow the window.
      model_auto_compact_token_limit: 196608
      # The Codex process, inside the environment server's default_episode_timeout_seconds.
      timeout: 10800
      session_close_timeout_seconds: 90
      # A Codex MCP call that times out keeps running on the server and holds back the next call to it, so keep
      # this well above a slow web call: httpx gives each step of a search or fetch up to 180 s.
      mcp_tool_timeout_seconds: 900
      datasets:
        - name: gdpval
          type: benchmark
          jsonl_fpath: benchmarks/gdpval/data/gdpval_benchmark_harness_neutral.jsonl
          prompt_config: benchmarks/gdpval/prompts/harness-neutral.yaml
          prepare_script: benchmarks/gdpval/prepare_harness_neutral.py
          num_repeats: 1

gdpval_environment_server:
  environment_servers:
    single_agent_turn_legacy:
      agent_server:
        type: responses_api_agents
        name: gdpval_codex_agent
      resources_tool_transports: [mcp]
