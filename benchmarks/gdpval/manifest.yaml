name: gdpval
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: external-rollout-driver
domain: other
description: GDPVal professional deliverable tasks with Stirrup and rubric scoring;
  preparation uses the upstream train split.
modality: multimodal
licensing: unknown
authors:
- Serge Panev
maintainers:
- Kh4L
- AdamRajfer
- agronskiy
- ananthsub
- athitten
- marta-sd
- vadam5
intended_use:
- evaluation
capabilities:
- tool_and_computer_use
- tool_and_computer_use/file_operations
- tool_and_computer_use/terminal_and_cli_use
- tool_and_computer_use/multi_step_tool_use
- tool_and_computer_use/web_search
- tool_and_computer_use/env_feedback_interpretation
- instruction_and_format_following
- instruction_and_format_following/structured_output
- instruction_and_format_following/instruction_following
- coding
- coding/code_generation
- planning_and_autonomy
- planning_and_autonomy/self_verification
- planning_and_autonomy/error_recovery
- planning_and_autonomy/task_planning
- writing_and_editing
- writing_and_editing/informational_writing
- retrieval_and_grounding
- retrieval_and_grounding/evidence_synthesis
- retrieval_and_grounding/open_retrieval
- knowledge
- knowledge/expert_knowledge
- data_analysis
- data_analysis/tabular_data_analysis
- data_analysis/data_transformation
- multimodal_generation_and_editing
- multimodal_generation_and_editing/artifact_composition
- reasoning
- reasoning/quantitative_reasoning
- multimodal_input_understanding
domains:
- finance
- business_management
- medicine
- retail_ecommerce
- real_estate
- manufacturing
- media_entertainment
- law
primary_metric: mean/reward
requirements:
  gpu: false
  network: public
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: gdpval
agent_server: stirrup_agent
datasets:
- name: gdpval
  type: benchmark
  jsonl_fpath: benchmarks/gdpval/data/gdpval_benchmark.jsonl
  prepare_script: benchmarks/gdpval/prepare.py
  prompt_config: benchmarks/gdpval/prompts/default-stirrup.yaml
  num_repeats: 1
model_server: policy_model
rollout_driver: resources_servers.gdpval.multistage_orchestrator:run_rollout_collection
canonical_split: train
standard_prompt_config: benchmarks/gdpval/prompts/default-stirrup.yaml
lifecycle: active
protocols:
- name: gdpval/opencode
  config_path: opencode.yaml
  description: GDPval professional deliverable tasks with a harness-neutral prompt in place of Stirrup's and the GDPval tools served over MCP, scored by a rubric judge panel and run with the OpenCode harness.
  maintainers:
  - Kh4L
  - vadam5
  resources_server: null
  agent_server: opencode_agent
  datasets:
  - name: gdpval
    type: benchmark
    jsonl_fpath: benchmarks/gdpval/data/gdpval_benchmark_harness_neutral.jsonl
    prepare_script: benchmarks/gdpval/prepare_harness_neutral.py
    prompt_config: benchmarks/gdpval/prompts/harness-neutral.yaml
    num_repeats: 1
  standard_prompt_config: benchmarks/gdpval/prompts/harness-neutral.yaml
  setups:
  - name: gdpval/codex
    config_path: codex.yaml
    description: GDPval professional deliverable tasks with harness-neutral prompts and rubric scoring, run with the Codex harness.
    agent_server: codex_agent
  - name: gdpval/openclaw
    config_path: openclaw.yaml
    description: GDPval professional deliverable tasks with harness-neutral prompts and rubric scoring, run with the OpenClaw harness.
    agent_server: openclaw_agent
  - name: gdpval/pi
    config_path: pi.yaml
    description: GDPval professional deliverable tasks with harness-neutral prompts and rubric scoring, run with the pi harness.
    agent_server: pi_agent
