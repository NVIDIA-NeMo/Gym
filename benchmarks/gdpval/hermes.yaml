# GDPVal with Hermes in place of Stirrup: same resources server, judges and multi-stage driver as config.yaml.
# Hermes runs in the task sandbox the resources server lends it and reaches the task tools
# (finish, abandon_task_finish, web_search, fetch_web_page) over MCP. The rows use the harness-neutral prompt.
# See "Run another harness" in README.md for the run command and the model server settings Hermes needs.
# Hermes has no finish_tool_names: finish does not end its run. Hermes continues until the model replies without a
# tool call or max_turns, a later finish or abandon_task_finish replaces the recorded call, and the resources
# server collects the files when the run ends.
config_paths:
  - benchmarks/gdpval/config.yaml

# Drop the Stirrup agent; the environment server below runs Hermes instead.
gdpval_stirrup_agent: null

gdpval_resources_server:
  resources_servers:
    gdpval:
      allowed_agents: [hermes_agent]
      expose_tools_over_mcp: true

gdpval_hermes_agent:
  responses_api_agents:
    hermes_agent:
      entrypoint: app.py
      description: GDPVal professional deliverable tasks with Hermes in place of Stirrup
      resources_server: null
      model_server:
        type: responses_api_models
        name: policy_model
      model: ${policy_model_name}
      # Concurrent Hermes runs, as Stirrup's concurrency. Keep it at least the environment server's
      # max_concurrent_episodes: an episode beyond it waits with its sandbox started and its deadline running.
      concurrency: 32
      # The task's MCP tools are added to these automatically; Hermes' own web and browser toolsets stay off.
      enabled_toolsets: [terminal, file, code_execution]
      max_turns: 250
      # Per model call.
      max_tokens: 32768
      # The served model's context length; Hermes compresses its history at compression_threshold of it.
      context_length: 262144
      # The Hermes run, inside the environment server's default_episode_timeout_seconds (18,000).
      sandbox_runner_timeout_seconds: 10800
      sandbox_install_timeout_seconds: 1200
      session_close_timeout_seconds: 90
      datasets:
        - name: gdpval
          type: benchmark
          jsonl_fpath: benchmarks/gdpval/data/gdpval_benchmark_harness_neutral.jsonl
          prompt_config: benchmarks/gdpval/prompts/harness-neutral.yaml
          prepare_script: benchmarks/gdpval/prepare_harness_neutral.py
          num_repeats: 1

gdpval_environment_server:
  environment_servers:
    single_agent_turn_legacy:
      agent_server:
        type: responses_api_agents
        name: gdpval_hermes_agent
      resources_tool_transports: [mcp]
