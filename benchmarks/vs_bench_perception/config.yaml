config_paths:
  - resources_servers/vs_bench_reference/configs/vs_bench_reference.yaml

vs_bench_perception_resources_server:
  _inherit_from: vs_bench_reference_resources_server
  resources_servers:
    vs_bench_reference:
      bwrap_path: ${vs_bench_bwrap_path}
      dataset_root: ${vs_bench_dataset_root}
      author_venv: ${vs_bench_author_venv}
      author_python_root: ${vs_bench_author_python_root}

vs_bench_perception_agent:
  _inherit_from: vs_bench_reference_agent
  responses_api_agents:
    vs_bench_reference:
      resources_server:
        name: vs_bench_perception_resources_server
      datasets:
      - name: vs_bench_perception
        type: benchmark
        jsonl_fpath: benchmarks/vs_bench_perception/data/vs_bench_perception.jsonl
        prepare_script: benchmarks/vs_bench_perception/prepare.py
        num_repeats: 1

vs_bench_perception_environment_server:
  _inherit_from: vs_bench_reference_environment_server
  environment_servers:
    legacy_agent:
      agent_server:
        name: vs_bench_perception_agent
