config_paths:
- resources_servers/audio_eval/configs/audio_eval.yaml

mmar_resources_server:
  _inherit_from: audio_eval
  resources_servers:
    audio_eval:
      profile_contracts: benchmarks/mmar/profiles.json

mmar_simple_agent:
  _inherit_from: audio_eval_simple_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        name: mmar_resources_server
      datasets:
      - name: mmar
        type: benchmark
        jsonl_fpath: benchmarks/mmar/data/mmar_benchmark.jsonl
        prepare_script: benchmarks/mmar/prepare.py
        license: Creative Commons Attribution Non Commercial 4.0 International

mmar_environment_server:
  _inherit_from: audio_eval_environment_server
  environment_servers:
    single_agent_turn_legacy:
      agent_server:
        name: mmar_simple_agent
      resources_server:
        type: resources_servers
        name: mmar_resources_server
