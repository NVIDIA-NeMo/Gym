name: mmar
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: other
description: Multiple-choice reasoning over the 1,000 MMAR audio questions (speech, sound, music and mixtures; the 294 speech questions can be selected alone), scored by accuracy per category.
modality: audio
licensing: CC-BY-NC-4.0
authors:
- NVIDIA NeMo Gym contributors
reward:
  range:
  - 0.0
  - 0.0
  higher_is_better: true
determinism: unknown
resources_server: audio_eval
agent_server: simple_agent
datasets:
- name: mmar
  type: benchmark
  jsonl_fpath: benchmarks/mmar/data/mmar_benchmark.jsonl
  prepare_script: benchmarks/mmar/prepare.py
  num_repeats: 1
model_server: policy_model
canonical_split: test
prompt_source: prepared
lifecycle: active
