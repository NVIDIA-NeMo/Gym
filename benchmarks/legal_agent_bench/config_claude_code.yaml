config_paths:
- resources_servers/legal_agent_bench/configs/legal_agent_bench.yaml
- responses_api_agents/claude_code_agent/configs/claude_code_agent.yaml
legal_agent_bench_benchmark_agent:
  _inherit_from: claude_code_agent
  responses_api_agents:
    claude_code_agent:
      model_server:
        type: responses_api_models
        name: policy_model
      model: ${policy_model_name}
      anthropic_api_key: ''
      max_turns: 60
      timeout: ${lab.agent_timeout_seconds}
      concurrency: ${num_samples_in_parallel}
      claude_code_version: 2.1.108
      bare: true
      datasets:
      - name: legal_agent_bench
        type: benchmark
        taskset: legal_agent_bench
        jsonl_fpath: ${lab.rows_path}
        prepare_script: benchmarks/legal_agent_bench/prepare.py
        prepare_project: resources_servers/legal_agent_bench
        num_repeats: 1
use_absolute_ip: true
