config_paths:
  - resources_servers/legal_agent_bench/configs/legal_agent_bench.yaml

legal_agent_bench_benchmark_resources_server:
  _inherit_from: legal_agent_bench
  resources_servers:
    legal_agent_bench:
      harbor_datasets:
        legal_agent_bench:
          path: ${legal_agent_bench_benchmark_resources_server.resources_servers.legal_agent_bench.harbor_tasks_dir}

legal_agent_bench_benchmark_agent:
  _inherit_from: legal_agent_bench_agent
  responses_api_agents:
    harbor_harness_agent:
      resources_server:
        type: resources_servers
        name: legal_agent_bench_benchmark_resources_server
      harbor_agent:
        kwargs:
          skills_dir: ${legal_agent_bench_benchmark_resources_server.resources_servers.legal_agent_bench.harness_skills_dir}
      datasets:
        - name: legal_agent_bench
          type: benchmark
          jsonl_fpath: benchmarks/legal_agent_bench/data/legal_agent_bench_benchmark.jsonl
          prompt_config: null
          prepare_script: benchmarks/legal_agent_bench/prepare.py
          num_repeats: 1

legal_agent_bench_benchmark_environment_server:
  _inherit_from: legal_agent_bench_environment_server
  environment_servers:
    single_agent_turn_legacy:
      resources_server:
        type: resources_servers
        name: legal_agent_bench_benchmark_resources_server
      agent_server:
        type: responses_api_agents
        name: legal_agent_bench_benchmark_agent
