config_paths:
- resources_servers/audio_eval/configs/audio_eval.yaml

halas_resources_server:
  _inherit_from: audio_eval
  resources_servers:
    audio_eval:
      profile_contracts: benchmarks/halas/profiles.json

halas_simple_agent:
  _inherit_from: audio_eval_simple_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        name: halas_resources_server
      datasets:
      - name: halas
        type: benchmark
        jsonl_fpath: benchmarks/halas/data/halas_benchmark.jsonl
        prepare_script: benchmarks/halas/prepare.py
        prepare_dependencies:
        - soundfile
        license: Creative Commons Attribution-ShareAlike 4.0 International (HALAS annotations); Creative Commons Attribution 4.0 International (Earnings-22 audio)

halas_environment_server:
  _inherit_from: audio_eval_environment_server
  environment_servers:
    single_agent_turn_legacy:
      agent_server:
        name: halas_simple_agent
      resources_server:
        type: resources_servers
        name: halas_resources_server
