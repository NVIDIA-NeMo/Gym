config_paths:
- resources_servers/job_bench/configs/job_bench.yaml
- nemo_gym/sandbox/providers/opensandbox/configs/opensandbox.yaml

job_bench_codex_agent:
  responses_api_agents:
    harness_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: job_bench_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      agent: codex
      agent_kwargs:
        model: ${policy_model_name}
        openai_api_key: ${policy_api_key}
        cwd: /workspace
        sandbox_mode: danger-full-access
        timeout: 7200
        codex_version: 0.144.4
        system_prompt: Complete the task using its specified input paths. Save every requested deliverable in /workspace/output.
      sandbox_provider: sandbox
      rollout_timeout: 7800
      concurrency: 32
      datasets:
        - name: job_bench
          type: benchmark
          jsonl_fpath: benchmarks/job_bench/data/job_bench.jsonl
          prepare_script: benchmarks/job_bench/prepare.py
          num_repeats: 1
