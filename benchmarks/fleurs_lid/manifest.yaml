name: fleurs_lid
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: asr
description: Spoken language identification of FLEURS test clips (102 locales by default, 36 for the reduced subset), scored by accuracy.
modality: audio
licensing: CC-BY-4.0
authors:
- NVIDIA NeMo Gym contributors
reward:
  range:
  - 0.0
  - 0.0
  higher_is_better: true
determinism: unknown
resources_server: audio_eval
agent_server: simple_agent
datasets:
- name: fleurs_lid
  type: benchmark
  jsonl_fpath: benchmarks/fleurs_lid/data/fleurs_lid_benchmark.jsonl
  prepare_script: benchmarks/fleurs_lid/prepare.py
  num_repeats: 1
model_server: policy_model
canonical_split: test
prompt_source: prepared
lifecycle: active
