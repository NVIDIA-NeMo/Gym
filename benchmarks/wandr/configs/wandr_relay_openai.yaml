# WANDR on a vendor-hosted agent, as in the paper's OpenAI row: GPT-5.5 with reasoning effort high on the OpenAI
# Responses API, with hosted web_search_preview and code_interpreter in background mode, through Relay.
# The vendor runs the agent loop, search and sandbox; the model writes the output files in its container, and
# the WANDR verifier scores the files as written. The score measures the whole vendor system, not only the model.
#
# Run with this file alone; it loads the benchmark config itself, so that the keys below win:
#   gym eval run --config benchmarks/wandr/configs/wandr_relay_openai.yaml ...
config_paths:
- benchmarks/wandr/config.yaml

# The benchmark config's simple_agent needs a policy model; this run has none, so drop it.
wandr_simple_agent: null
wandr_environment_server: null

wandr_relay_agent_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: wandr_relay_agent

wandr_relay_agent:
  responses_api_agents:
    relay_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: wandr_resources_server
      # The NVIDIA inference API forwards the Responses API, including background runs and container files.
      model: openai/openai/gpt-5.5
      base_url: https://inference-api.nvidia.com/v1
      api_key: ${oc.select:inference_api_key,null}
      # Upstream configs/wandr.yaml at ccb0baeb96f1c77a48e47f92122c57479ee99700: effort high, 2 full restarts,
      # 16 h per task, 24 tasks at a time, files delivered from the code interpreter container.
      request:
        reasoning_effort: high
      delivery_channel: sandbox
      max_full_restarts: 2
      timeout_s: 57600
      max_concurrent_runs: 24
      trace_dir: ${oc.select:relay_trace_dir,null}

wandr_resources_server:
  resources_servers:
    wandr:
      datasets:
      - name: wandr
        type: benchmark
        jsonl_fpath: benchmarks/wandr/data/wandr_benchmark.jsonl
        prepare_script: benchmarks/wandr/prepare.py
        num_repeats: 1
        agent: wandr_relay_agent
