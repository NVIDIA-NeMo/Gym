name: agentif
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: instruction_following
description: AgentIF whole-dataset instruction following, rewarded by all-constraints
  instruction success rate.
modality: text
licensing: CC-BY-4.0
authors:
- Maria Bagdasarova
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: agentif
agent_server: simple_agent
datasets:
- name: agentif
  type: benchmark
  jsonl_fpath: benchmarks/agentif/data/agentif_benchmark.jsonl
  prepare_script: benchmarks/agentif/prepare.py
  num_repeats: 1
model_server: policy_model
canonical_split: benchmark
prompt_source: prepared
lifecycle: active
