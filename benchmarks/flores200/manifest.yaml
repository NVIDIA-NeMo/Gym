name: flores200
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: other
description: Machine-translation verifier computing corpus-level spBLEU and ChrF per
  language pair plus optional xCOMET-XXL neural QE via a Ray GPU actor.
modality: text
licensing: unknown
authors:
- gwarmstrong
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: wmt_translation
agent_server: simple_agent
datasets:
- name: flores200
  type: benchmark
  jsonl_fpath: benchmarks/flores200/data/flores200_devtest_benchmark.jsonl
  prepare_script: benchmarks/flores200/prepare.py
  prompt_config: benchmarks/flores200/prompts/default.yaml
  num_repeats: 1
model_server: policy_model
canonical_split: benchmark
standard_prompt_config: benchmarks/flores200/prompts/default.yaml
lifecycle: active
