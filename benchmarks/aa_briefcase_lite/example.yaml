# Public-reference example overlay; load after config.yaml and the policy adapter.
# The policy adapter is unused in judge-only mode.
policy_base_url: https://api.openai.com/v1
policy_api_key: unused
policy_model_name: judge_only
aa_briefcase_lite_resources_server:
  resources_servers:
    aa_briefcase_lite:
      dataset_dir: /opt/aa-briefcase-lite
      reward_mode: binary
      persist_raw_judge_responses: false
aa_briefcase_lite_stirrup_agent:
  responses_api_agents:
    stirrup_agent:
      resources_server:
        type: resources_servers
        name: aa_briefcase_lite_resources_server
      judge_only: true
      execute_only: false
      rerun_incomplete: false
      persist_deliverables_dir: /opt/aa-briefcase-lite-demo
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/aa_briefcase_lite/data/example.jsonl
        num_repeats: 1
