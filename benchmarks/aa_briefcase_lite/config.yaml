# AA-Briefcase-Lite — Stirrup rollout plus public binary/local pairwise judging.
#
# The task sandbox is started by the resources server from an OCI image that provides AA's offline working
# environment (see README.md); the Stirrup agent runs in it and verification reads the files it submitted.

config_paths:
  - nemo_gym/sandbox/providers/opensandbox/configs/opensandbox.yaml
  - environment_servers/single_agent_turn_legacy/configs/single_agent_turn_legacy.yaml


# openai_model pins the upstream model, so each panel member needs its own adapter.
aa_briefcase_lite_judge_model:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: ${oc.env:JUDGE_BASE_URL,https://inference-api.nvidia.com/v1}
      openai_api_key: ${oc.env:JUDGE_API_KEY,dummy}
      openai_model: ${oc.env:JUDGE_GEMINI_MODEL,gcp/google/gemini-3.1-pro-preview}

aa_briefcase_lite_gpt_judge_model:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: ${oc.env:JUDGE_BASE_URL,https://inference-api.nvidia.com/v1}
      openai_api_key: ${oc.env:JUDGE_API_KEY,dummy}
      openai_model: ${oc.env:JUDGE_GPT_MODEL,openai/openai/gpt-5.5}

aa_briefcase_lite_claude_judge_model:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: ${oc.env:JUDGE_BASE_URL,https://inference-api.nvidia.com/v1}
      openai_api_key: ${oc.env:JUDGE_API_KEY,dummy}
      openai_model: ${oc.env:JUDGE_CLAUDE_MODEL,aws/anthropic/bedrock-claude-opus-4-8}

aa_briefcase_lite_resources_server:
  resources_servers:
    aa_briefcase_lite:
      allowed_agents: [stirrup_agent]
      entrypoint: app.py
      domain: other
      verified: false
      # Allow benchmark discovery before dataset setup; the server requires a path at startup.
      dataset_dir: ${oc.env:AA_BRIEFCASE_LITE_DATASET_DIR,null}
      # binary: released A/C prompt and checks; pairwise: local AQ/P comparison;
      # all: both, with a non-official convenience scalar averaging the two.
      reward_mode: ${oc.env:AA_BRIEFCASE_REWARD_MODE,all}
      pairwise_reference_ids: [gpt-5-5]
      pairwise_num_trials: 2
      binary_formatting_retries: 2
      binary_max_tokens_by_judge: {gpt-5.5: 16384}
      preconvert_office_to_pdf: true
      preconvert_max_concurrent: 1
      persist_deliverables_dir: ${oc.env:PERSIST_DELIVERABLES_DIR}
      # Names a top-level provider block such as nemo_gym/sandbox/providers/opensandbox/configs/opensandbox.yaml.
      sandbox_provider: sandbox
      sandbox_config:
        image: ${oc.env:AA_BRIEFCASE_SANDBOX_IMAGE,null}
        # Without a TTL the OpenSandbox SDK expires a sandbox 10 minutes after creation.
        ttl_s: 21600
        env:
          # execd otherwise waits 1 s after every command.
          EXECD_API_GRACE_SHUTDOWN: 50ms
      judge_model_server:
        type: responses_api_models
        name: aa_briefcase_lite_judge_model
      judge_responses_create_params_overrides: {}
      judge_panel:
        - name: gpt-5.5
          model: ${oc.env:JUDGE_GPT_MODEL,openai/openai/gpt-5.5}
          model_server:
            type: responses_api_models
            name: aa_briefcase_lite_gpt_judge_model
          media_mode: images_and_text
          create_params_overrides: {reasoning_effort: high, temperature: null}
        - name: gemini-3.1-pro
          model: ${oc.env:JUDGE_GEMINI_MODEL,gcp/google/gemini-3.1-pro-preview}
          model_server:
            type: responses_api_models
            name: aa_briefcase_lite_judge_model
          handles_audio: true
          handles_video: true
          media_mode: native_pdf
          create_params_overrides: {extra_body: {reasoning_effort: high}, temperature: null}
        - name: claude-opus-4.8
          model: ${oc.env:JUDGE_CLAUDE_MODEL,aws/anthropic/bedrock-claude-opus-4-8}
          model_server:
            type: responses_api_models
            name: aa_briefcase_lite_claude_judge_model
          media_mode: native_pdf
          create_params_overrides:
            extra_body: {thinking: {type: adaptive}, output_config: {effort: medium}}
            temperature: null
            max_tokens: 49152
      judge_sampling_seed: ${oc.env:JUDGE_SAMPLING_SEED,null}
      persist_raw_judge_responses: false

aa_briefcase_lite_stirrup_agent:
  responses_api_agents:
    stirrup_agent:
      entrypoint: app.py
      # The system prompt in the prepared rows names this cap (prepare.py AGENT_MAX_TURNS).
      agent_max_turns: 500
      concurrency: 4
      temperature: ${oc.env:AA_BRIEFCASE_TEMPERATURE,1.0}
      finish_tool_names: [finish, abandon_task_finish]
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
        - name: aa_briefcase_lite
          type: benchmark
          jsonl_fpath: benchmarks/aa_briefcase_lite/data/aa_briefcase_lite.jsonl
          prompt_config: null
          prepare_script: benchmarks/aa_briefcase_lite/prepare.py
          num_repeats: 1

aa_briefcase_lite_environment_server:
  _inherit_from: single_agent_turn_legacy
  environment_servers:
    single_agent_turn_legacy:
      resources_server:
        type: resources_servers
        name: aa_briefcase_lite_resources_server
      agent_server:
        type: responses_api_agents
        name: aa_briefcase_lite_stirrup_agent
      resources_tool_transports: [direct_http]
      default_episode_timeout_seconds: 18000
      max_concurrent_episodes: 4
      queue_timeout_seconds: 86400
