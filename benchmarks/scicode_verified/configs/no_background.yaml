config_paths:
  - benchmarks/scicode_verified/base.yaml

scicode_verified_without_background_agent:
  _inherit_from: scicode_agent
  responses_api_agents:
    scicode_agent:
      resources_server:
        type: resources_servers
        name: scicode_verified_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      prompt_fpath: benchmarks/scicode/prompts/default.yaml
      with_background: false
      datasets:
        - name: scicode_verified
          type: benchmark
          jsonl_fpath: benchmarks/scicode_verified/data/scicode_verified_benchmark.jsonl
          prepare_script: benchmarks/scicode_verified/prepare.py
          prompt_config: null
          num_repeats: 1
          license: Apache 2.0
