config_paths:
- resources_servers/audio_eval/configs/audio_eval.yaml

air_bench_foundation_resources_server:
  _inherit_from: audio_eval
  resources_servers:
    audio_eval:
      profile_contracts: benchmarks/air_bench_foundation/profiles.json

air_bench_foundation_simple_agent:
  _inherit_from: audio_eval_simple_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        name: air_bench_foundation_resources_server
      datasets:
      - name: air_bench_foundation
        type: benchmark
        jsonl_fpath: benchmarks/air_bench_foundation/data/air_bench_foundation_benchmark.jsonl
        prepare_script: benchmarks/air_bench_foundation/prepare.py
        license: Apache License 2.0 (stated by the AIR-Bench repository; the dataset card states Creative Commons Attribution Non Commercial 4.0 International)

air_bench_foundation_environment_server:
  _inherit_from: audio_eval_environment_server
  environment_servers:
    single_agent_turn_legacy:
      agent_server:
        name: air_bench_foundation_simple_agent
      resources_server:
        type: resources_servers
        name: air_bench_foundation_resources_server
