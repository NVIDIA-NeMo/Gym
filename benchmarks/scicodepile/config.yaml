config_paths:
  - resources_servers/scicodepile/configs/scicodepile.yaml

scicodepile_benchmark_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: scicodepile
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: scicodepile
        type: benchmark
        jsonl_fpath: benchmarks/scicodepile/data/scicodepile_benchmark.jsonl
        prompt_config: benchmarks/scicodepile/prompts/default.yaml
        prepare_script: benchmarks/scicodepile/prepare.py
        num_repeats: 1
        license: Apache 2.0

scicodepile_benchmark_environment_server:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: scicodepile_benchmark_simple_agent
      resources_tool_transports:
      - direct_http
