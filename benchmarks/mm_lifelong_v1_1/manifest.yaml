name: mm_lifelong_v1_1
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-agent-loop
domain: other
description: MM-Lifelong v1.1 open-ended questions about a recorded day, week and month, answered from 256 frames of
  each split's video and graded 0-5 against frozen rubrics by the dataset's grader.
modality: video
licensing: MIT
authors:
- Guo Chen
maintainers:
- cg1177
requirements:
  gpu: false
  network: allowlist
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: stochastic
config_path: config.yaml
resources_server: video_qa_rubric
agent_server: simple_agent
datasets:
- name: mm_lifelong_v1_1
  type: benchmark
  jsonl_fpath: benchmarks/mm_lifelong_v1_1/data/mm_lifelong_v1_1_benchmark.jsonl
  prepare_script: benchmarks/mm_lifelong_v1_1/prepare.py
  num_repeats: 1
model_server: policy_model
canonical_split: benchmark
prompt_source: prepared
lifecycle: active
