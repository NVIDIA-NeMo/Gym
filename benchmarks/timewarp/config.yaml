config_paths:
- resources_servers/timewarp/configs/timewarp.yaml

timewarp_benchmark_resources_server:
  _inherit_from: timewarp
  resources_servers:
    timewarp:
      datasets:
      - name: timewarp
        type: benchmark
        jsonl_fpath: benchmarks/timewarp/data/timewarp_benchmark.jsonl
        prepare_script: benchmarks/timewarp/prepare.py
        prompt_config: benchmarks/timewarp/prompt.yaml
        num_repeats: 1
        license: MIT

timewarp_benchmark_simple_agent:
  _inherit_from: timewarp_simple_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        name: timewarp_benchmark_resources_server
      datasets: []

timewarp_benchmark_environment_server:
  _inherit_from: timewarp_environment_server
  environment_servers:
    legacy_agent:
      agent_server:
        name: timewarp_benchmark_simple_agent
