name: mucs2021
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: asr
description: Hindi-English and Bengali-English code-switched speech recognition on the MUCS 2021 blind test, scored by normal and transliterated WER.
modality: audio
licensing: CC-BY-SA-4.0
authors:
- NVIDIA NeMo Gym contributors
reward:
  range:
  - 0.0
  - 0.0
  higher_is_better: true
determinism: unknown
resources_server: audio_eval
agent_server: simple_agent
datasets:
- name: mucs2021
  type: benchmark
  jsonl_fpath: benchmarks/mucs2021/data/mucs2021_benchmark.jsonl
  prepare_script: benchmarks/mucs2021/prepare.py
  num_repeats: 1
model_server: policy_model
canonical_split: test
prompt_source: prepared
lifecycle: active
