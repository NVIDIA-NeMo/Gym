config_paths:
- resources_servers/audio_eval/configs/audio_eval.yaml

mucs2021_resources_server:
  _inherit_from: audio_eval
  resources_servers:
    audio_eval:
      profile_contracts: benchmarks/mucs2021/profiles.json

mucs2021_simple_agent:
  _inherit_from: audio_eval_simple_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        name: mucs2021_resources_server
      datasets:
      - name: mucs2021
        type: benchmark
        jsonl_fpath: benchmarks/mucs2021/data/mucs2021_benchmark.jsonl
        prepare_script: benchmarks/mucs2021/prepare.py
        prepare_dependencies:
        - soundfile
        license: Creative Commons Attribution-ShareAlike 4.0 International

mucs2021_environment_server:
  _inherit_from: audio_eval_environment_server
  environment_servers:
    single_agent_turn_legacy:
      agent_server:
        name: mucs2021_simple_agent
      resources_server:
        type: resources_servers
        name: mucs2021_resources_server
