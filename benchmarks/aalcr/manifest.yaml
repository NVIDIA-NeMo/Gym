resources_server: "aalcr"
agent_server: "simple_agent"
model_server: "policy_model"
prompt_source: "prepared"
datasets:
  - name: "aalcr"
    type: "benchmark"
    jsonl_fpath: "benchmarks/aalcr/data/aalcr_v1_0_benchmark.jsonl"
    prepare_script: "benchmarks/aalcr/prepare.py"
    num_repeats: 16
canonical_split: "benchmark"
lifecycle: "active"
