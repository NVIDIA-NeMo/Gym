# Version identifies this initial manifest composition, not the upstream dataset release.
name: "aalcr"
version: "0.1.0"
experimental: true
kind: "benchmark"
config_path: "config.yaml"
integration_profile: "custom-gym-verifier"
domain: "other"
description: "AA-LCR long-context document question answering with the legacy v1.0 equality judge."
modality: "text"
licensing: "unknown"
authors:
  - "Andrea Santilli"
reward:
  range: [0.0, 1.0]
  higher_is_better: true
