config_paths:
- resources_servers/opencode_multimodal_benchmarks/configs/opencode_multimodal_benchmarks.yaml
opencode_multimodal_benchmarks:
  resources_servers:
    opencode_multimodal_benchmarks:
      entrypoint: app.py
      judge_model: null
      datasets:
      - name: hrbench8k
        type: benchmark
        jsonl_fpath: benchmarks/opencode_multimodal_benchmarks/data/hrbench8k.jsonl
        prompt_config: null
        prepare_script: benchmarks/opencode_multimodal_benchmarks/prepare.py
        prepare_dependencies:
        - Pillow
        num_repeats: 1
        taskset: visual_tasks
visual_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: opencode_multimodal_benchmarks
      model_server:
        type: responses_api_models
        name: policy_model
visual_environment:
  environment_servers:
    single_agent_turn:
      entrypoint: app.py
      cleanup_timeout_seconds: 180
      resources_server:
        type: resources_servers
        name: opencode_multimodal_benchmarks
      agent_server:
        type: responses_api_agents
        name: visual_agent
      resources_tool_transports: []

environment_routing_mode: taskset
environment_server_routes:
  visual_tasks: visual_environment
