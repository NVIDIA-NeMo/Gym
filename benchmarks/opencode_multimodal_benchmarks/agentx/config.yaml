config_paths:
- resources_servers/opencode_multimodal_benchmarks/configs/opencode_multimodal_benchmarks.yaml
opencode_multimodal_benchmarks:
  resources_servers:
    opencode_multimodal_benchmarks:
      entrypoint: agentx.py
      judge_model: gpt-5.5
      judge_max_tokens: 4096
      judge_required: true
      datasets:
      - name: agentx
        type: benchmark
        jsonl_fpath: benchmarks/opencode_multimodal_benchmarks/data/agentx.jsonl
        prompt_config: null
        prepare_script: benchmarks/opencode_multimodal_benchmarks/agentx_prepare.py
        prepare_dependencies:
        - --no-config
        - Pillow
        - numpy
        - opencv-python-headless==4.11.0.86
        num_repeats: 1
        taskset: visual_tasks
      judge_concurrency: 4
      judge_timeout: 300
      judge_attempts: 10
visual_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: opencode_multimodal_benchmarks
      model_server:
        type: responses_api_models
        name: policy_model
visual_environment:
  environment_servers:
    single_agent_turn:
      entrypoint: app.py
      cleanup_timeout_seconds: 180
      resources_server:
        type: resources_servers
        name: opencode_multimodal_benchmarks
      agent_server:
        type: responses_api_agents
        name: visual_agent
      resources_tool_transports: []

environment_routing_mode: taskset
environment_server_routes:
  visual_tasks: visual_environment
