config_paths:
  - resources_servers/opencode_multimodal_benchmarks/configs/opencode_multimodal_benchmarks.yaml
visual_opencode:
  responses_api_agents:
    opencode_multimodal_agent:
      network_access: model_only
      entrypoint: app.py
      resources_server: {type: resources_servers, name: opencode_multimodal_benchmarks}
      datasets:
        - name: babyvision
          type: benchmark
          jsonl_fpath: benchmarks/opencode_multimodal_benchmarks/data/babyvision.jsonl
          prompt_config: null
          prepare_script: benchmarks/opencode_multimodal_benchmarks/prepare.py
          prepare_dependencies: [Pillow]
          num_repeats: 1

visual_opencode_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: visual_opencode
