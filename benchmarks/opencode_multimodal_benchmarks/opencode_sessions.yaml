config_paths:
- benchmarks/opencode_multimodal_benchmarks/opencode_eval_agent.yaml
- nemo_gym/sandbox/providers/opensandbox/configs/opensandbox.yaml
use_absolute_ip: true
head_server:
  host: 127.0.0.1
opencode_multimodal_benchmarks:
  resources_servers:
    opencode_multimodal_benchmarks:
      host: 127.0.0.1
visual_agent:
  responses_api_agents:
    opencode_agent:
      network_access: model_only
      host: 127.0.0.1
      num_workers: 1
    _delete_key: simple_agent
visual_environment:
  environment_servers:
    single_agent_turn:
      entrypoint: app.py
      host: 127.0.0.1
      cleanup_timeout_seconds: 180
      agent_server:
        type: responses_api_agents
        name: visual_agent
      resources_server:
        type: resources_servers
        name: opencode_multimodal_benchmarks
      agent_outcome_policy:
        by_failure_kind:
          provider_oom_killed: retry
