config_paths:
  - resources_servers/opencode_multimodal_benchmarks/configs/opencode_multimodal_benchmarks.yaml
opencode_multimodal_benchmarks:
  resources_servers:
    opencode_multimodal_benchmarks:
      entrypoint: agentx.py
      judge_concurrency: 4
      judge_timeout: 300
      judge_attempts: 10
visual_opencode:
  responses_api_agents:
    opencode_multimodal_agent:
      entrypoint: eval.py
      resources_server: {type: resources_servers, name: opencode_multimodal_benchmarks}
      datasets:
        - name: agentx
          type: benchmark
          jsonl_fpath: benchmarks/opencode_multimodal_benchmarks/data/agentx.jsonl
          prompt_config: null
          prepare_script: benchmarks/opencode_multimodal_benchmarks/agentx_prepare.py
          prepare_dependencies: [Pillow, numpy, opencv-python-headless==4.11.0.86]
          num_repeats: 1
