# Evaluation profile for vLLM-compatible endpoints; supply model identity and deployment settings separately.
config_paths:
- responses_api_models/vllm_model/configs/vllm_model.yaml
- benchmarks/opencode_multimodal_benchmarks/opencode_eval_vllm.yaml
policy_base_url: ${oc.env:POLICY_BASE_URL}
policy_api_key: ${oc.env:POLICY_API_KEY}
policy_model:
  responses_api_models:
    vllm_model:
      sampling_overrides:
        temperature: 0.6
        top_p: 0.95
