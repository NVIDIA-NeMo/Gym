config_paths:
  - resources_servers/biomysterybench_judge/configs/biomysterybench_judge.yaml

biomysterybench_resources_server:
  _inherit_from: biomysterybench_judge

biomysterybench_claude_code:
  responses_api_agents:
    claude_code_sandboxed_agent:
      entrypoint: app.py
      domain: agent
      description: Anthropic's 99-task BioMysteryBench run with Claude Code in benchmark-owned sandboxes
      value: Evaluate agentic bioinformatics analysis over anonymized real-world datasets

      resources_server:
        type: resources_servers
        name: biomysterybench_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      model: ${policy_model_name}
      claude_code_version: null
      max_turns: 128
      sandbox_timeout: 14400
      sandbox_provider: sandbox
      bare: true
      system_prompt: |-
        You are solving a BioMysteryBench bioinformatics task. The anonymized task files are
        available at /data. Analyze the files with terminal tools and write temporary files under
        /workspace. You may install additional tools with apt, pip, or conda and may use standard
        bioinformatics databases for gene lookup, sequence annotation, BLAST, and reference-genome
        downloads.

        Before installing anything, check the existing environment. It already includes NumPy,
        pandas, SciPy, scikit-learn, scikit-image, Biopython, pysam, PyBigWig, Sourmash, PyDESeq2,
        Scanpy, igraph/Leidenalg, R/Bioconductor, samtools, bcftools, bedtools, BWA, Bowtie2,
        minimap2, BLAST, SeqKit, FastQC, Nextflow, and PLINK.

        Do not look up GEO, SRA, ENA, or BioProject accession IDs to identify the original dataset,
        source publication, or study metadata. Do not reverse-identify the source study. When the
        analysis is complete, return a concise final answer that follows the requested format. Your
        final response is graded, not the analysis method you choose.
      concurrency: 5

      datasets:
        - name: biomysterybench
          type: benchmark
          jsonl_fpath: benchmarks/biomysterybench/data/biomysterybench_official_99.jsonl
          prompt_config: null
          prepare_script: benchmarks/biomysterybench/prepare_official.py
          num_repeats: 5
