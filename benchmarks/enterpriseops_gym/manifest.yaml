name: enterpriseops_gym
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-agent-loop
domain: agent
description: ServiceNow EnterpriseOps-Gym oracle-mode tasks across eight enterprise
  domains, run with the Stirrup agent against live MCP gym servers in per-task sandboxes
  and scored by SQL checks on the final database state.
modality: text
licensing: Apache-2.0
authors:
- Khushi Bhardwaj
maintainers:
- kbhardwaj-nvidia
intended_use:
- evaluation
capabilities:
- tool_and_computer_use
- tool_and_computer_use/mcp_tool_use
- tool_and_computer_use/multi_step_tool_use
- tool_and_computer_use/tool_calling
- planning_and_autonomy
- planning_and_autonomy/task_planning
- planning_and_autonomy/long_horizon_execution
- instruction_and_format_following
- instruction_and_format_following/instruction_following
domains:
- business_management
primary_metric: pass@1[avg-of-3]/success
requirements:
  gpu: false
  network: allowlist
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: stochastic
agent_server: stirrup_agent
datasets:
- name: enterpriseops_gym
  type: benchmark
  jsonl_fpath: benchmarks/enterpriseops_gym/data/enterpriseops_gym_benchmark.jsonl
  prepare_script: benchmarks/enterpriseops_gym/prepare.py
  num_repeats: 3
- name: example
  type: example
  jsonl_fpath: resources_servers/enterpriseops_gym/data/example.jsonl
  num_repeats: 1
model_server: policy_model
session_model: episode
state: per_session
sandbox: opensandbox
canonical_split: calendar+csm+drive+email+hr+hybrid+itsm+teams
prompt_source: prepared
lifecycle: active
resources_server: enterpriseops_gym
adopted_from:
  source: https://huggingface.co/datasets/ServiceNow-AI/EnterpriseOps-Gym
  ref: c8e538eae8a6205294f0a86675fefdc1fac408f6  # pragma: allowlist secret
  reconciled: '2026-10-25'
