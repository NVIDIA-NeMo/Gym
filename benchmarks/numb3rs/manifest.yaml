name: numb3rs
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: asr
description: Spoken numbers with neutral, written-form and spoken-form transcription prompts, scored by corpus word error rate.
modality: audio
licensing: CC-BY-NC-SA-4.0
authors:
- gwarmstrong
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: asr_with_pc
agent_server: simple_agent
datasets:
- name: numb3rs
  type: benchmark
  jsonl_fpath: benchmarks/numb3rs/data/numb3rs_benchmark.jsonl
  prepare_script: benchmarks/numb3rs/prepare.py
  prompt_config: benchmarks/numb3rs/prompts/default.yaml
  num_repeats: 1
model_server: policy_model
canonical_split: benchmark
standard_prompt_config: benchmarks/numb3rs/prompts/default.yaml
lifecycle: active
