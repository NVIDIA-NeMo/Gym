name: scicode
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-agent-loop
domain: coding
description: Scientific code generation on the SciCode test split, with background-informed
  per-step prompts and binary whole-problem execution reward.
modality: text
licensing: Apache-2.0
authors:
- NVIDIA NeMo Gym contributors
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: scicode
agent_server: scicode_agent
datasets:
- name: scicode
  type: benchmark
  jsonl_fpath: benchmarks/scicode/data/scicode_benchmark.jsonl
  prepare_script: benchmarks/scicode/prepare.py
  num_repeats: 8
model_server: policy_model
canonical_split: test
prompt_source: agent
standard_prompt_config: benchmarks/scicode/prompts/background.yaml
lifecycle: active
