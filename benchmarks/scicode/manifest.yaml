name: scicode
# Initial catalog composition version; not an upstream dataset release.
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-agent-loop
domain: coding
description: >-
  Scientific code generation on the SciCode test split, with background-informed per-step prompts and binary
  whole-problem execution reward.
modality: text
licensing: Apache-2.0
# Contributor attribution follows the NVIDIA source headers.
authors:
  - NVIDIA NeMo Gym contributors
reward:
  range: [0, 1]
  higher_is_better: true
determinism: unknown
prompt_source: agent
resources_server: scicode
agent_server: scicode_agent
model_server: policy_model
datasets:
  - name: scicode
    type: benchmark
    jsonl_fpath: benchmarks/scicode/data/scicode_benchmark.jsonl
    prepare_script: benchmarks/scicode/prepare.py
    num_repeats: 8
canonical_split: test
# Informational agent template, filled once per sub-step.
standard_prompt_config: benchmarks/scicode/prompts/background.yaml
lifecycle: active
