config_paths:
- resources_servers/audio_eval/configs/audio_eval.yaml

aishell4_sot_resources_server:
  _inherit_from: audio_eval
  resources_servers:
    audio_eval:
      profile_contracts: benchmarks/aishell4_sot/profiles.json

aishell4_sot_simple_agent:
  _inherit_from: audio_eval_simple_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        name: aishell4_sot_resources_server
      datasets:
      - name: aishell4_sot
        type: benchmark
        jsonl_fpath: benchmarks/aishell4_sot/data/aishell4_sot_benchmark.jsonl
        prepare_script: benchmarks/aishell4_sot/prepare.py
        prepare_dependencies:
        - soundfile
        license: Creative Commons Attribution-ShareAlike 4.0 International

aishell4_sot_environment_server:
  _inherit_from: audio_eval_environment_server
  environment_servers:
    single_agent_turn_legacy:
      agent_server:
        name: aishell4_sot_simple_agent
      resources_server:
        type: resources_servers
        name: aishell4_sot_resources_server
