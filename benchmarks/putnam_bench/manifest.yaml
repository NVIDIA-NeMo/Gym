name: putnam_bench
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: math
description: Lean4 formal proof verification environment
modality: text
licensing: unknown
authors:
- stephencge
maintainers:
- stephencge
primary_metric: mean/reward
requirements:
  gpu: false
  network: no-network
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: math_formal_lean
agent_server: simple_agent
datasets:
- name: putnam_bench
  type: benchmark
  jsonl_fpath: benchmarks/putnam_bench/data/putnam_bench_benchmark.jsonl
  prepare_script: benchmarks/putnam_bench/prepare.py
  prompt_config: benchmarks/prompts/lean4/formal-proof-deepseek-prover-v2.yaml
  num_repeats: 32
model_server: policy_model
canonical_split: full
standard_prompt_config: benchmarks/prompts/lean4/formal-proof-deepseek-prover-v2.yaml
adopted_from:
  source: https://github.com/trishullab/PutnamBench
  ref: 64cedd86ef523f3d5f5dc7a21c10e3f69564c7d4
  reconciled: '2026-04-23'
lifecycle: active
