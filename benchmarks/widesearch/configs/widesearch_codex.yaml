# WideSearch with Codex in a sandbox the agent creates, searching through the exa_search tool
# server. single_agent_turn_legacy seeds the widesearch verifier and an exa_search session, grants exa_search to
# Codex over MCP, closes the agent, verifies its answer, then closes both sessions. Codex calls the
# model server and exa_search from the sandbox, so Gym binds them to an address the sandbox can reach. Export
# EXA_API_KEY and pass a sandbox provider config (nemo_gym/sandbox/providers/<provider>/configs/<provider>.yaml).
config_paths:
- resources_servers/exa_search/configs/exa_search.yaml

use_absolute_ip: true
absolute_ip_server_types: [responses_api_models, resources_servers]

widesearch:
  resources_servers:
    widesearch:
      entrypoint: app.py
      domain: knowledge
      verified: false
      description: WideSearch benchmark
      value: Evaluate wide search coverage and accuracy
      judge_model_server:
        type: responses_api_models
        name: policy_model
      judge_responses_create_params:
        input: []
        max_output_tokens: 32768
        temperature: 0.0
        top_p: 1.0

widesearch_codex_benchmark:
  responses_api_agents:
    codex_agent:
      entrypoint: app.py
      domain: agent
      description: Run WideSearch with Codex and the exa_search tool server
      value: Evaluate agentic web search
      # Names the benchmark for its manifest; the Environment Server binds the episode's resources server.
      resources_server:
        type: resources_servers
        name: widesearch
      model_server:
        type: responses_api_models
        name: policy_model
      model: ${policy_model_name}
      timeout: 7200
      codex_version: 0.144.4
      system_prompt: You must search with the exa_search tool before answering. Research the request on the web and return exactly the requested Markdown table.
      concurrency: 32
      sandbox_provider: sandbox
      sandbox_config:
        image: nikolaik/python-nodejs:python3.13-nodejs22-slim
        ttl_s: 9000
        resources:
          memory_mib: 8192
      datasets:
        - name: widesearch
          type: benchmark
          jsonl_fpath: benchmarks/widesearch/data/widesearch_benchmark.jsonl
          prepare_script: benchmarks/widesearch/prepare.py
          license: MIT

widesearch_codex_benchmark_environment_server:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: widesearch
      agent_server:
        type: responses_api_agents
        name: widesearch_codex_benchmark
      # The widesearch verifier serves no tools; Exa search comes from the exa_search tool server.
      resources_tool_transports: []
      tool_servers:
        - type: resources_servers
          name: exa_search
