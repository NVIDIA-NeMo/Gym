widesearch:
  resources_servers:
    widesearch:
      entrypoint: app.py
      domain: knowledge
      verified: false
      description: WideSearch benchmark
      value: Evaluate wide search coverage and accuracy
      judge_model_server:
        type: responses_api_models
        name: policy_model
      judge_responses_create_params:
        input: []
        max_output_tokens: 32768
        temperature: 0.0
        top_p: 1.0
widesearch_nemo_fabric_deepagents_benchmark:
  responses_api_agents:
    harness_exa_search:
      entrypoint: app.py
      domain: agent
      description: Run WideSearch with NeMoFabricAgent in a sandbox
      value: Evaluate agentic web search
      model_server:
        type: responses_api_models
        name: policy_model
      resources_server:
        type: resources_servers
        name: widesearch
      harness_module: responses_api_agents.nemo_fabric_agent.app
      harness_class: NeMoFabricAgent
      harness_config_class: NeMoFabricAgentConfig
      harness_kwargs:
        adapter_id: nvidia.fabric.langchain.deepagents
        model_provider: openai-compatible
        model: ${policy_model_name}
        model_api_key: local
        concurrency: 1
        timeout: 7200
        system_prompt: You must call the web_search_exa tool before answering. Research the request on the web and return exactly the requested Markdown table. The web_fetch_exa tool is unavailable, so use the text returned by search.
        harness_settings: {}
        fabric_config:
          tools:
            blocked: [web_fetch_exa]
      image: nikolaik/python-nodejs:python3.13-nodejs22-slim
      setup_command: >-
        python3 -m pip install -q
        https://github.com/NVIDIA-NeMo/Gym/archive/621ecac6906f332c54ba4a588e3ce7b7005bbe98.zip
        nemo-fabric[deepagents]==0.2.0
      sandbox_provider: sandbox
      sandbox_spec:
        ttl_s: 9000
        resources:
          memory_mib: 8192
      sandbox_model_base_url: null
      exa_api_key: null
      token_id_capture: false
      datasets:
        - name: widesearch
          type: benchmark
          jsonl_fpath: benchmarks/widesearch/data/widesearch_benchmark.jsonl
          prepare_script: benchmarks/widesearch/prepare.py
          license: MIT
