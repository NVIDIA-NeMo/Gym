# WideSearch with Kilo Code in a sandbox the agent creates, searching the web with Exa through the
# exa_search tool server (tavily_search with search_provider: exa). single_agent_turn_legacy seeds the
# widesearch verifier and an exa_search session, grants its web_search, find_in_page and scroll_page tools to
# Kilo Code over MCP, closes the agent, verifies its answer, then closes both sessions. Kilo Code calls the model
# server and exa_search from the sandbox, so Gym binds them to an address the sandbox can reach. Export
# EXA_API_KEY and pass a sandbox provider config (nemo_gym/sandbox/providers/<provider>/configs/<provider>.yaml).
use_absolute_ip: true
absolute_ip_server_types: [responses_api_models, resources_servers]

exa_search:
  resources_servers:
    tavily_search:
      entrypoint: app.py
      domain: agent
      description: Exa web search and page tools
      search_provider: exa
      exa_api_key: ${oc.env:EXA_API_KEY}
      # Keeps the benchmark's own dataset pages out of search results and page reads.
      exclude_domains_file_path: benchmarks/widesearch/search_exclusions.json
      expose_tools_over_mcp: true
      use_judge: false
      max_cached_page_chars: 200000
      max_scroll_words: 2000
      verified: false

widesearch:
  resources_servers:
    widesearch:
      entrypoint: app.py
      domain: knowledge
      verified: false
      description: WideSearch benchmark
      value: Evaluate wide search coverage and accuracy
      judge_model_server:
        type: responses_api_models
        name: policy_model
      judge_responses_create_params:
        input: []
        max_output_tokens: 32768
        temperature: 0.0
        top_p: 1.0

widesearch_kilocode_benchmark:
  responses_api_agents:
    kilocode_agent:
      entrypoint: app.py
      domain: agent
      description: Run WideSearch with Kilo Code and Exa web search
      value: Evaluate agentic web search
      # Names the benchmark for its manifest; the Environment Server binds the episode's resources server.
      resources_server:
        type: resources_servers
        name: widesearch
      model_server:
        type: responses_api_models
        name: policy_model
      model: ${policy_model_name}
      thinking: true
      timeout: 7200
      setup_timeout: 900
      context_window: 262144
      max_output_tokens: 131072
      kilo_version: 7.4.15
      # Per-call MCP tool timeout in ms (Kilo's default is the MCP SDK's 60 s), above the exa_search worst case
      # of about 183 s. The sandbox lifetime is left to Kilo, which sizes it from setup_timeout and timeout.
      kilo_config:
        experimental:
          mcp_timeout: 300000
      system_prompt: You must search the web with the web_search tool before answering, and read pages with find_in_page or scroll_page. Research the request on the web and return exactly the requested Markdown table.
      concurrency: 32
      sandbox_provider: sandbox
      sandbox_config:
        image: nikolaik/python-nodejs:python3.13-nodejs22-slim
        resources:
          memory_mib: 8192
      datasets:
        - name: widesearch
          type: benchmark
          jsonl_fpath: benchmarks/widesearch/data/widesearch_benchmark.jsonl
          prepare_script: benchmarks/widesearch/prepare.py
          license: MIT

widesearch_kilocode_benchmark_environment_server:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: widesearch
      agent_server:
        type: responses_api_agents
        name: widesearch_kilocode_benchmark
      # The widesearch verifier serves no tools; the Exa search tools come from exa_search.
      resources_tool_transports: []
      tool_servers:
        - type: resources_servers
          name: exa_search
