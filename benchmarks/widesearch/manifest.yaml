name: widesearch
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-agent-loop
domain: knowledge
description: Broad web research with official strict table and item matching, run
  by any Gym harness with Exa search.
modality: text
licensing: MIT
authors:
- Christian Munley
maintainers:
- cmunley1
intended_use:
- evaluation
capabilities:
- instruction_and_format_following
- instruction_and_format_following/structured_output
- instruction_and_format_following/instruction_following
- retrieval_and_grounding
- retrieval_and_grounding/open_retrieval
- retrieval_and_grounding/multi_source_synthesis
- retrieval_and_grounding/evidence_synthesis
- retrieval_and_grounding/source_assessment
- tool_and_computer_use
- tool_and_computer_use/web_search
- multilingual_and_multicultural
- multilingual_and_multicultural/requested_language_response
- data_analysis
- data_analysis/tabular_data_analysis
domains:
- media_entertainment
- education
- sports_recreation
- politics_government
- travel_hospitality
primary_metric: mean/reward
requirements:
  gpu: false
  network: public
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: widesearch
agent_server: harness_exa_search
datasets:
- name: widesearch
  type: benchmark
  jsonl_fpath: benchmarks/widesearch/data/widesearch_benchmark.jsonl
  prepare_script: benchmarks/widesearch/prepare.py
  num_repeats: 1
model_server: policy_model
canonical_split: full
prompt_source: prepared
lifecycle: active
setups:
- name: widesearch/configs/widesearch_claude_code
  config_path: configs/widesearch_claude_code.yaml
  description: Broad web research with official strict table and item matching using the claude_code harness and Exa search.
- name: widesearch/configs/widesearch_cline
  config_path: configs/widesearch_cline.yaml
  description: Broad web research with official strict table and item matching using the cline harness and Exa search.
- name: widesearch/configs/widesearch_codex
  config_path: configs/widesearch_codex.yaml
  description: Broad web research with official strict table and item matching using the codex harness and Exa search.
- name: widesearch/configs/widesearch_hermes
  config_path: configs/widesearch_hermes.yaml
  description: Broad web research with official strict table and item matching using the hermes harness and Exa search.
- name: widesearch/configs/widesearch_kilocode
  config_path: configs/widesearch_kilocode.yaml
  description: Broad web research with official strict table and item matching using the kilocode harness and Exa search.
- name: widesearch/configs/widesearch_nemo_fabric_deepagents
  config_path: configs/widesearch_nemo_fabric_deepagents.yaml
  description: Broad web research with official strict table and item matching using the deepagents harness and Exa search.
- name: widesearch/configs/widesearch_openclaw
