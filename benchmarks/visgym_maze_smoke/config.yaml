config_paths:
  - environments/visgym/config.yaml

visgym_maze_smoke_resources_server:
  _inherit_from: visgym_resources_server
  resources_servers:
    visgym:
      reward_mode: task_success

visgym_maze_smoke_agent:
  _inherit_from: visgym_agent
  responses_api_agents:
    visgym_agent:
      resources_server:
        name: visgym_maze_smoke_resources_server
      datasets:
        - name: visgym_maze_smoke
          type: benchmark
          jsonl_fpath: benchmarks/visgym_maze_smoke/data/visgym_maze_smoke_benchmark.jsonl
          prepare_script: benchmarks/visgym_maze_smoke/prepare.py
          num_repeats: 1

# Override the inherited relay; a second relay would make agent routing ambiguous.
visgym_agent_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: visgym_maze_smoke_agent
      max_concurrent_episodes: null
      queue_timeout_seconds: null
      default_episode_timeout_seconds: null
      cleanup_timeout_seconds: 180
