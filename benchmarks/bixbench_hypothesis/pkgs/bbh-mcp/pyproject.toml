[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "wheel"]

[project]
name = "bbh-mcp"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx",
  "jupyterlab",
  "litellm",
  "mcp>=1.29.0,<2.0.0",
  "nbformat",
  "tyro",
  "websockets",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
