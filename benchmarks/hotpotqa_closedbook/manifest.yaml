name: hotpotqa_closedbook
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: knowledge
description: Short-answer QA with deterministic SQuAD-style + alternative-aware substring
  verification (HotpotQA closed-book).
modality: text
licensing: unknown
authors:
- gwarmstrong
maintainers:
- gwarmstrong
capabilities:
- knowledge
- knowledge/factual_knowledge
- reasoning
- reasoning/deductive_reasoning
- writing_and_editing
- writing_and_editing/general_qa
- instruction_and_format_following
- instruction_and_format_following/structured_output
domains:
- general
primary_metric: pass@1[avg-of-1]/is_correct_strict
requirements:
  gpu: false
  network: no-network
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: hotpotqa_qa
agent_server: simple_agent
datasets:
- name: hotpotqa_closedbook
  type: benchmark
  jsonl_fpath: benchmarks/hotpotqa_closedbook/data/hotpotqa_closedbook_benchmark.jsonl
  prepare_script: benchmarks/hotpotqa_closedbook/prepare.py
  prompt_config: benchmarks/hotpotqa_closedbook/prompts/default.yaml
  num_repeats: 1
model_server: policy_model
canonical_split: validation
standard_prompt_config: benchmarks/hotpotqa_closedbook/prompts/default.yaml
lifecycle: active
