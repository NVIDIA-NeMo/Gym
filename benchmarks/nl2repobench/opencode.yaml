config_paths:
  - responses_api_agents/opencode_sandboxed_agent/configs/opencode_sandboxed_agent.yaml
  - resources_servers/nl2repobench/configs/nl2repobench.yaml

nl2repobench_opencode_resources_server:
  _inherit_from: nl2repobench_resources_server
  resources_servers:
    nl2repobench:
      # Upstream's agent sandbox is a generic, task-agnostic image with no
      # pre-installed deps (see _AGENT_SANDBOX_IMAGE in app.py) - it needs
      # real network access to pip install whatever the task requires, same
      # as upstream. The verifier sandbox is unaffected by this flag; it
      # always uses the real pinned per-task image with no network policy.
      enforce_agent_no_network: false
      sandbox_model_server:
        type: responses_api_models
        name: policy_model
      # agent_network_mode defaults to "official" (set in nl2repobench.yaml), which reproduces
      # today's behavior exactly - needed to keep already-completed eval runs reproducible. To
      # run a different network posture, override at the CLI instead of editing this file, e.g.:
      #   ++nl2repobench_opencode_resources_server.resources_servers.nl2repobench.agent_network_mode=no_internet_preinstalled
      #   ++nl2repobench_opencode_resources_server.resources_servers.nl2repobench.agent_network_mode=block_target
      # See docs/PIPELINE.md "Network access and reference-lookup risk" for what each mode does.

nl2repobench_opencode_sandboxed_agent:
  _inherit_from: opencode_sandboxed_agent
  responses_api_agents:
    opencode_sandboxed_agent:
      sandbox_timeout: 21600

      # The shared opencode_sandboxed_agent default (3600000ms = 1hr, see
      # responses_api_agents/opencode_sandboxed_agent/configs/opencode_sandboxed_agent.yaml)
      # is a single-model-call HTTP client timeout (one `opencode run` request to
      # policy_model, not the whole session) - if vLLM ever hangs/stalls generating a
      # single response past that point, OpenCode hard-aborts the call and the run
      # errors out. Empirically this produced a tight cluster of official/block_target
      # rollouts landing at exactly ~60.0-60.4 minutes total duration with reward=0 (see
      # docs/PIPELINE.md's duration-vs-reward analysis) - consistent with a single early
      # call getting stuck and timing out rather than the agent genuinely giving up.
      # Raised to 4hr here, scoped to nl2repobench only (not the shared default, so
      # other opencode_sandboxed_agent benchmarks are unaffected). sandbox_timeout above
      # is already 21600s (6hr), comfortably above this, so it's left as-is.
      opencode_model_call_timeout: 14400000

      # The agent sandbox denies all egress except the policy model host
      # (enforce_agent_no_network: true), so the default `curl
      # https://opencode.ai/install` fallback fails (confirmed via a live
      # run: "curl: (6) Could not resolve host: opencode.ai" on 100% of
      # rollouts). Reuse the same pre-staged, network-free OpenCode binary as
      # the other opencode benchmarks. (A prior E2BIG failure on this same
      # install path — "fork/exec /usr/bin/bash: argument list too long" —
      # turned out to be caused by NL2RepoBench's much larger prompts
      # (15KB-375KB vs a few KB for other benchmarks) being inlined into the
      # exec command, not by this install method; fixed in
      # responses_api_agents/opencode_sandboxed_agent/app.py by uploading the
      # query to a file instead.)
      remote_opencode_install_script_path: /mnt/s3-data/data/bxyu/opencode/install.sh
      remote_opencode_binary_path: /mnt/s3-data/data/bxyu/opencode/opencode-linux-x64

      resources_server:
        type: resources_servers
        name: nl2repobench_opencode_resources_server
      datasets:
        - name: nl2repobench_v1
          type: benchmark
          jsonl_fpath: benchmarks/nl2repobench/data/nl2repobench_benchmark.jsonl
          prepare_script: benchmarks/nl2repobench/prepare.py
          num_repeats: 1

nl2repobench_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: nl2repobench_opencode_sandboxed_agent
