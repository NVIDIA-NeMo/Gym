name: nl2repobench/opencode
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-agent-loop
domain: coding
description: NL2RepoBench greenfield "0-to-1" repository-generation tasks (natural-language
  spec to a complete, installable Python package, no base repository or reference solution)
  with an OpenCode sandboxed agent and execution-based pytest verification against each
  task's hidden test suite.
modality: text
licensing: unknown
authors:
- NVIDIA NeMo Gym contributors
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
config_path: ../opencode.yaml
resources_server: nl2repobench
agent_server: opencode_sandboxed_agent
datasets:
- name: nl2repobench_v1
  type: benchmark
  jsonl_fpath: benchmarks/nl2repobench/data/nl2repobench_benchmark.jsonl
  prepare_script: benchmarks/nl2repobench/prepare.py
  num_repeats: 1
model_server: policy_model
canonical_split: test
prompt_source: prepared
lifecycle: active
