config_paths:
- resources_servers/ether0/configs/ether0.yaml
ether0_simple_agent:
  responses_api_agents:
    simple_agent:
      # Replaces the environment's example and validation datasets: the validation file is
      # not shipped, and rollout collection requires every declared dataset to exist.
      datasets:
      - name: ether0
        type: benchmark
        jsonl_fpath: benchmarks/ether0/data/test.jsonl
        prepare_script: benchmarks/ether0/prepare.py
        num_repeats: 1
        license: Creative Commons Attribution 4.0 International
