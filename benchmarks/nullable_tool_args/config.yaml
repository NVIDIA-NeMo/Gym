# Chain to existing resource server + agent config
config_paths:
  - resources_servers/nullable_tool_args/configs/nullable_tool_args.yaml

nullable_tool_args_benchmark_resources_server:
  _inherit_from: nullable_tool_args

nullable_tool_args_benchmark_simple_agent:
  _inherit_from: nullable_tool_args_simple_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        name: nullable_tool_args_benchmark_resources_server
      datasets:
      - name: nullable_tool_args
        type: benchmark
        jsonl_fpath: benchmarks/nullable_tool_args/data/nullable_tool_args_benchmark.jsonl
        prompt_config: null
        prepare_script: benchmarks/nullable_tool_args/prepare.py

nullable_tool_args_benchmark_environment_server:
  _inherit_from: nullable_tool_args_environment_server
  environment_servers:
    legacy_agent:
      agent_server:
        name: nullable_tool_args_benchmark_simple_agent
