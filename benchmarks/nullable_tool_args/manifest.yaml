name: nullable_tool_args
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: agent
description: Synthetic single-tool-call requests whose required nullable arguments
  should be JSON null, scored on whether the call writes null rather than the string
  "None".
modality: text
licensing: Apache-2.0
authors:
- NVIDIA NeMo Gym contributors
maintainers:
- cmunley1
capabilities:
- tool_and_computer_use
- tool_and_computer_use/tool_calling
- instruction_and_format_following
- instruction_and_format_following/structured_output
domains:
- general
primary_metric: mean/reward
requirements:
  gpu: false
  network: no-network
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: nullable_tool_args
agent_server: simple_agent
datasets:
- name: nullable_tool_args
  type: benchmark
  jsonl_fpath: benchmarks/nullable_tool_args/data/nullable_tool_args_benchmark.jsonl
  prepare_script: benchmarks/nullable_tool_args/prepare.py
  num_repeats: 1
model_server: policy_model
canonical_split: full
prompt_source: prepared
lifecycle: active
