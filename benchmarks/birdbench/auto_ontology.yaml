# BIRD dev with the Auto Ontology agent in place of simple_agent. The bird_sql Resources Server grades the query it
# submits, as it grades simple_agent's. See responses_api_agents/auto_ontology_agent/README.md.
#
#   gym eval prepare --config benchmarks/birdbench/auto_ontology.yaml
#   gym eval run --config benchmarks/birdbench/auto_ontology.yaml --model-type vllm_model --split benchmark \
#     --limit 200 --output results/birdbench_auto_ontology.jsonl
#
# `--limit 200` runs the first 200 dev tasks, the subset auto-ontology's ReAct results report.

config_paths:
  - benchmarks/birdbench/config.yaml
  - responses_api_agents/auto_ontology_agent/configs/auto_ontology_agent.yaml

# The rows also carry the task in their agent context: the question as BIRD asks it, its evidence apart, and the
# database. Auto Ontology writes its own prompts from it.
prepare_script_args:
  agent_context: true

# The dataset moves from simple_agent's instance to Auto Ontology's. birdbench's simple_agent inherits from
# bird_sql's, so both go.
birdbench_bird_sql_simple_agent: null
bird_sql_simple_agent: null
auto_ontology_agent:
  responses_api_agents:
    auto_ontology_agent:
      datasets:
        - name: birdbench
          type: benchmark
          jsonl_fpath: benchmarks/birdbench/data/birdbench_sqlite_dev_agent_context.jsonl
          prompt_config: benchmarks/birdbench/prompts/default_sqlite.yaml
          prepare_script: benchmarks/birdbench/prepare.py
          prepare_project: benchmarks/birdbench
          num_repeats: 1

birdbench_bird_sql_environment_server:
  environment_servers:
    single_agent_turn_legacy:
      agent_server:
        name: auto_ontology_agent
      # Auto Ontology calls its own tools, not the Resources Server's.
      resources_tool_transports: []
