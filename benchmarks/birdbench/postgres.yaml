#
# BIRD dev in the PostgreSQL dialect (birdbench/postgres): config.yaml with the PostgreSQL prompt and prepared file, and
# bird_sql running the model's SQL on a PostgreSQL server that you provide. A dialect changes the prompt and the engine,
# so it is a benchmark of its own, with its own taskset. bird_sql connects with its postgres_dsn; eval.sh passes
# BIRD_PG_DSN and BIRD_PG_ADMIN_DSN. See README.md, "Installation" and "Dialects and splits".
#
#   ./benchmarks/birdbench/eval.sh --model <name> --dialect postgres

config_paths:
  - benchmarks/birdbench/config.yaml

prepare_script_args:
  dialect: postgres

birdbench_bird_sql_resources_server:
  resources_servers:
    bird_sql:
      dialect: postgres

birdbench_bird_sql_simple_agent:
  responses_api_agents:
    simple_agent:
      datasets:
        - name: birdbench_postgres
          type: benchmark
          jsonl_fpath: benchmarks/birdbench/data/birdbench_postgres_dev.jsonl
          prompt_config: benchmarks/birdbench/prompts/default_postgres.yaml
          prepare_script: benchmarks/birdbench/prepare.py
          prepare_project: benchmarks/birdbench
          num_repeats: 1  # Never repeat the dataset; see config.yaml.
          taskset: birdbench/postgres

environment_server_routes:
  birdbench/postgres: birdbench_bird_sql_environment_server
