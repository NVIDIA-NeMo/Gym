# BIRD dev with Auto Ontology's ReAct agent in place of simple_agent: the agent runs Auto Ontology's own loop, prompts
# and tools in a sandbox per episode (responses_api_agents/auto_ontology_agent), and bird_sql grades the query it
# submits, as it grades simple_agent's. See README.md, "Auto Ontology".
#
#   gym eval prepare --config benchmarks/birdbench/auto_ontology_agent.yaml ++auto_ontology_api_key=<key>
#   gym eval run --config benchmarks/birdbench/auto_ontology_agent.yaml --model-type vllm_model --split benchmark \
#     --output results/auto_ontology_agent/rollouts.jsonl ++auto_ontology_api_key=<key>

config_paths:
  - benchmarks/birdbench/config.yaml
  - responses_api_agents/auto_ontology_agent/configs/auto_ontology_agent.yaml

prepare_script_args:
  agent_context: true

# bird_sql's instance declares the dataset, so its TaskData checks the rows, as it checks simple_agent's.
birdbench_bird_sql_resources_server:
  resources_servers:
    bird_sql:
      datasets:
        - name: birdbench
          type: benchmark
          # The task rides in each row's agent context; the agent writes its own prompts from it.
          jsonl_fpath: benchmarks/birdbench/data/birdbench_sqlite_dev_auto_ontology_agent.jsonl
          prepare_script: benchmarks/birdbench/prepare.py
          num_repeats: 1
          taskset: birdbench

# simple_agent's instance, which declares BIRD dev's dataset without the agent context, does not run.
birdbench_bird_sql_simple_agent: null
bird_sql_simple_agent: null

birdbench_bird_sql_environment_server:
  environment_servers:
    single_agent_turn:
      agent_server:
        name: auto_ontology_agent
      # Auto Ontology calls its own tools, not the Resources Server's.
      resources_tool_transports: []
