name: birdbench
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: coding
description: Text-to-SQL with execution-based evaluation on BIRD dev (1534 SQLite
  tasks). Binary reward from unordered result-set equality.
modality: text
licensing: unknown
authors:
- George Armstrong
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: bird_sql
agent_server: simple_agent
datasets:
- name: birdbench
  type: benchmark
  jsonl_fpath: benchmarks/birdbench/data/birdbench_benchmark.jsonl
  prepare_script: benchmarks/birdbench/prepare.py
  prompt_config: benchmarks/birdbench/prompts/default.yaml
  num_repeats: 16
model_server: policy_model
canonical_split: benchmark
standard_prompt_config: benchmarks/birdbench/prompts/default.yaml
lifecycle: active
