name: birdbench
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: coding
description: Text-to-SQL with execution-based evaluation on BIRD dev (1534 SQLite
  tasks). Binary reward from unordered result-set equality.
modality: text
licensing: unknown
authors:
- gwarmstrong
maintainers:
- gwarmstrong
- dkmisra
intended_use:
- evaluation
capabilities:
- coding
- coding/data_query_coding
- reasoning
- reasoning/quantitative_reasoning
- data_analysis
- data_analysis/tabular_data_analysis
domains:
- computer_science
- data_science
- general
primary_metric: pass@1[avg-of-1]/accuracy
requirements:
  gpu: false
  network: no-network
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: bird_sql
agent_server: simple_agent
datasets:
- name: birdbench
  type: benchmark
  jsonl_fpath: benchmarks/birdbench/data/birdbench_sqlite_dev.jsonl
  prepare_script: benchmarks/birdbench/prepare.py
  prompt_config: benchmarks/birdbench/prompts/default_sqlite.yaml
  num_repeats: 1
model_server: policy_model
canonical_split: dev
standard_prompt_config: benchmarks/birdbench/prompts/default_sqlite.yaml
adopted_from:
  source: https://github.com/RUCKBReasoning/OmniSQL
  ref: a66d732010c89fac4353488d1c59e0b06f92b742  # pragma: allowlist secret
  reconciled: '2026-11-11'
lifecycle: active
