# BIRD text-to-SQL benchmark configuration.

# Chain to the BIRD execution-based resource server + agent config.
config_paths:
  - resources_servers/bird_sql/configs/bird_sql.yaml

# Forwarded as kwargs to benchmarks/birdbench/prepare.py's prepare(). Pre-declared here (rather
# than left implicit) to document the default; still needs the Hydra `+` prefix to override from
# the CLI, e.g. `+prepare_script_args.include_evidence=false`, since `--config` merges this file
# in via `+config_paths=[...]` rather than as Hydra's primary/root config.
prepare_script_args:
  include_evidence: true
  dscp: name_or_col_dscp
  dialect: sqlite  # the default; other dialects are selected by `eval.sh --dialect` (see README.md, "SQL dialects")
  split: dev  # the default; the train split is selected by `eval.sh --split train` (see README.md, "Splits")
  # BIRD dev release, dated: dev_20240627 (the default), dev_20251106, minidev_20250704 or minidev_20261028 (see
  # README.md, "Versions"); selected by `eval.sh --version` or `+prepare_script_args.version=<version>`.
  version: dev_20240627
  # or schema_only (SQLite): `eval.sh --prompt-format schema_only` or `+prepare_script_args.prompt_format=schema_only`
  prompt_format: default

# The dataset below follows prepare_script_args.version and prompt_format, so setting either one directly selects the
# file prepare() writes for it and the matching prompt. File names mirror prepare.output_fpath_for on SQLite dev: the
# default version's file is named by the split and any other by the version; any prompt format but the default adds
# `_<format>`. An unknown value reaches prepare(), which rejects it. Another dialect or split also changes the server;
# eval.sh handles those and replaces the whole dataset entry.
birdbench_prepared_file:
  name_for_version:
    dev_20240627: dev  # every other version: the version
  suffix_for_prompt_format:
    default: ""  # every other prompt format: _<format>

# Inherit-from directives isolate this benchmark config from the generic server config.
birdbench_bird_sql_resources_server:
  _inherit_from: bird_sql_resources_server

birdbench_bird_sql_simple_agent:
  _inherit_from: bird_sql_simple_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        name: birdbench_bird_sql_resources_server
      datasets:
        - name: birdbench
          type: benchmark
          # benchmarks/birdbench/data/birdbench_sqlite_dev.jsonl by default (see birdbench_prepared_file above)
          jsonl_fpath: benchmarks/birdbench/data/birdbench_sqlite_${oc.select:birdbench_prepared_file.name_for_version.${prepare_script_args.version},${prepare_script_args.version}}${oc.select:birdbench_prepared_file.suffix_for_prompt_format.${prepare_script_args.prompt_format},_${prepare_script_args.prompt_format}}.jsonl
          prompt_config: benchmarks/birdbench/prompts/${prepare_script_args.prompt_format}_sqlite.yaml
          prepare_script: benchmarks/birdbench/prepare.py
          prepare_project: benchmarks/birdbench
          # Never repeat the dataset: `gym eval run` multiplies this by `--num-repeats`, so any value above 1 makes
          # the prepared files 1534 x N rows. Take several rollouts per task with `--num-repeats` only.
          num_repeats: 1

birdbench_bird_sql_environment_server:
  _inherit_from: bird_sql_environment_server
  environment_servers:
    single_agent_turn_legacy:
      resources_server:
        type: resources_servers
        name: birdbench_bird_sql_resources_server
      agent_server:
        name: birdbench_bird_sql_simple_agent
