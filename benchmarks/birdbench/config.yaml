# BIRD text-to-SQL benchmark configuration: BIRD dev in the SQLite dialect (birdbench). spark.yaml and postgres.yaml
# are the other dialects, each a benchmark of its own (birdbench/spark, birdbench/postgres). See README.md.

# Chain to the BIRD execution-based resource server + agent config.
config_paths:
  - resources_servers/bird_sql/configs/bird_sql.yaml

# Forwarded as kwargs to benchmarks/birdbench/prepare.py's prepare(). Pre-declared here (rather
# than left implicit) to document the default; still needs the Hydra `+` prefix to override from
# the CLI, e.g. `+prepare_script_args.include_evidence=false`, since `--config` merges this file
# in via `+config_paths=[...]` rather than as Hydra's primary/root config.
prepare_script_args:
  include_evidence: true
  dscp: name_or_col_dscp
  dialect: sqlite  # spark.yaml and postgres.yaml set their own (see README.md, "Dialects and splits")
  split: dev  # the default; the train split is selected by `eval.sh --split train` (see README.md, "Splits")

# Inherit-from directives isolate this benchmark config from the generic server config.
birdbench_bird_sql_resources_server:
  _inherit_from: bird_sql_resources_server

birdbench_bird_sql_simple_agent:
  _inherit_from: bird_sql_simple_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        name: birdbench_bird_sql_resources_server
      datasets:
        - name: birdbench
          type: benchmark
          jsonl_fpath: benchmarks/birdbench/data/birdbench_sqlite_dev.jsonl
          prompt_config: benchmarks/birdbench/prompts/default_sqlite.yaml
          prepare_script: benchmarks/birdbench/prepare.py
          prepare_project: benchmarks/birdbench
          # Never repeat the dataset: `gym eval run` multiplies this by `--num-repeats`, so any value above 1 makes
          # the prepared files 1534 x N rows. Take several rollouts per task with `--num-repeats` only.
          num_repeats: 1
          # Each task runs on the Environment Server this taskset routes to (environment_server_routes).
          taskset: birdbench

# BIRD dev's tasks run on single_agent_turn: it seeds the agent's session with each task, activates it once, closes it,
# and has bird_sql grade the answer. bird_sql's own Environment Server, for its flat example rows, is not used.
environment_server_routes:
  birdbench: birdbench_bird_sql_environment_server
bird_sql_environment_server: null
birdbench_bird_sql_environment_server:
  environment_servers:
    single_agent_turn:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: birdbench_bird_sql_resources_server
      agent_server:
        type: responses_api_agents
        name: birdbench_bird_sql_simple_agent
      resources_tool_transports:
        - direct_http
      # The limits single_agent_turn_legacy gave BIRD dev's episodes.
      default_episode_timeout_seconds: 21600
      cleanup_timeout_seconds: 180
