name: birdbench/postgres
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: coding
description: Text-to-SQL with execution-based evaluation on BIRD dev (1534 tasks) in the PostgreSQL dialect, on a
  PostgreSQL server you provide. Binary reward from unordered result-set equality.
modality: text
licensing: unknown
authors:
- gwarmstrong
- abelatnvidia
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
config_path: ../postgres.yaml
resources_server: bird_sql
agent_server: simple_agent
datasets:
- name: birdbench_postgres
  type: benchmark
  jsonl_fpath: benchmarks/birdbench/data/birdbench_postgres_dev.jsonl
  prepare_script: benchmarks/birdbench/prepare.py
  prompt_config: benchmarks/birdbench/prompts/default_postgres.yaml
  num_repeats: 1
model_server: policy_model
canonical_split: benchmark
standard_prompt_config: benchmarks/birdbench/prompts/default_postgres.yaml
lifecycle: active
