# Overlay on the unchanged benchmark recipe. Install all three NOOA packages
# from runtime/benchagent-requirements.txt in the controller/server environment too.
swebench_pro_nooa_agent:
  responses_api_agents:
    nooa_agent:
      runtime_requirements_file: responses_api_agents/nooa_agent/runtime/benchagent-requirements.txt
      nooa:
        agent_class: nooa_bench.bench_agent:BenchAgent
        invocation_adapter: responses_api_agents.nooa_agent.bench_agent_adapter:invoke_bench_agent
        execution_mode: sandboxed
        init_kwargs: {}
