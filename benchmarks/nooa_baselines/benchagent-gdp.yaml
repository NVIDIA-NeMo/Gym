# Compatibility selector for the default BenchAgent and its invocation adapter.
# Standard NOOA requirements install the matching core, CLI, and benchmark packages.
gdpval_nooa_agent:
  responses_api_agents:
    nooa_agent:
      nooa:
        agent_class: nooa_bench.bench_agent:BenchAgent
        invocation_adapter: responses_api_agents.nooa_agent.bench_agent_adapter:invoke_bench_agent
        execution_mode: sandboxed
        init_kwargs: {}
