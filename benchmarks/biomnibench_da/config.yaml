bob:
  responses_api_agents:
    harbor_agent_general:
      entrypoint: app.py
      domain: agent
      description: Harbor agent integration for BiomniBench data-analysis tasks using OpenCode in Singularity environments.

      harbor_max_retries: 3

      harbor_jobs_dir: ${oc.select:harbor_jobs_dir,${oc.select:output_jsonl_fpath,logs/biomnibench_da}}

      harbor_dataset:
        path: ${oc.select:harbor_dataset_path,benchmarks/biomnibench_da/data/harbor}

      harbor_environment:
        type: singularity
        kwargs:
          singularity_image_cache_dir: ${oc.env:SINGULARITY_CACHEDIR}/harbor
          singularity_force_pull: false
          ## TIP: Skip bind-paths if broken network access.
          # singularity_no_mount: home,tmp

      harbor_agent:
        name: opencode
        model_name: ${policy_model_name}
        env:
          NVINF_API_KEY: \${NVINF_API_KEY:-}
          VLLM_API_BASE: \${VLLM_API_BASE:-}

      harbor_reward_key: score
