name: chartography
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: other
description: Chartography professional chart reading, graded by the benchmark's own LLM judge; the
  headline metric is the all-pass rate over ten runs per task.
modality: multimodal
licensing: CC-BY-4.0
authors:
- Tuomas Rintamaki
maintainers:
- trintamaki
intended_use:
- evaluation
capabilities:
- multimodal_input_understanding
- multimodal_input_understanding/structured_visual_artifact_understanding
- data_analysis
- data_analysis/data_visualization
- reasoning
- reasoning/quantitative_reasoning
- knowledge
- knowledge/expert_knowledge
domains:
- data_science
- statistics
primary_metric: pass@1[avg-of-10]/all_pass
requirements:
  gpu: false
  network: allowlist
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: chartography
agent_server: simple_agent
datasets:
- name: chartography
  type: benchmark
  jsonl_fpath: benchmarks/chartography/data/chartography_benchmark.jsonl
  prepare_script: benchmarks/chartography/prepare.py
  num_repeats: 10
model_server: policy_model
canonical_split: test
prompt_source: prepared
adopted_from:
  source: https://github.com/surge-ai/chartography
  ref: 3f1bf837232d3918c2cc35c6e2418c9e70d2a57b  # pragma: allowlist secret
  reconciled: '2026-11-10'
lifecycle: active
