# Prefix pass@K on SWE-bench Pro (backticks wire).
#
# Rows pin each instance of the reference's Pro backticks batch
# (glm53flash-backticks-2026-09-11: 130 instances, mini-swe-agent in text mode)
# to its decisive turn T. A rollout replays turns 1..T-1 into a fresh task
# container and the candidate produces T onward; scoring is the stock SWE-bench
# Pro verification. `num_repeats` IS K, as in verified.yaml.
#
# THE POOL IS PASSED-ONLY: the collecting model resolved all 130, and their
# decisive turns sit deeper than Verified's (median 55% into the trajectory).
# Compare checkpoints' ordering on it, not its level against another benchmark.
#
# Everything below mirrors the batch's pinned mini-swe-agent config, because
# each piece changes what the candidate reads or what gets scored:
#   * commands run in a LOGIN shell (`bash -lc`) in /app, with mini's env and a
#     300 s timeout: Pro images put their toolchains on PATH via profile scripts;
#   * the agent's sandbox is offline, as the batch ran (`--network none`): 15
#     prefix commands try to fetch the upstream fix (`pip download ansible-core`,
#     `git clone .../vuls.git`, raw.githubusercontent.com) and must fail as they
#     did rather than leave the solution in the sandbox. Grading runs in its own
#     sandbox and stays online (it prefetches Go modules), so this is the
#     agent's `offline`, not a network policy on the resources server, which
#     would bind both;
#   * no anti-cheat rewrite of git history: the trajectories saw the raw image;
#   * the steer names /app, in the reference bridge's `pro_bash` wording.
#
# Validate before quoting a number (both take zero model turns, so run them at
# --num-repeats 1):
#   gold check (replay 1..T; every row MUST resolve):
#     +prefix_pass_k_agent_pro.responses_api_agents.prefix_pass_k_agent.replay_through_target=true
#   contamination screen (replay 1..T-1; NO row may resolve):
#     +prefix_pass_k_agent_pro.responses_api_agents.prefix_pass_k_agent.max_forwards=0
config_paths:
- responses_api_agents/prefix_pass_k_agent/configs/prefix_pass_k_agent.yaml
- resources_servers/swebench_pro/configs/swebench_pro.yaml

prefix_pass_k_pro_resources_server:
  _inherit_from: swebench_pro_resources_server
  resources_servers:
    swebench_pro:
      allowed_agents: [prefix_pass_k_agent]
      apply_anti_cheating: false

# The checkpoint under test. Point it at yours in env.yaml (policy_base_url,
# policy_model_name) or on the command line, and send the `id` /v1/models
# reports: a wrong name 404s every forward, which scores as a quiet 0. Sampling
# is the reference bridge's: temperature 0.6 and 1024 tokens.
policy_model_pro:
  responses_api_models:
    base_model:
      entrypoint: app.py
      openai_base_url: ${policy_base_url}
      # Self-hosted vLLM ignores this. Deliberately not ${policy_api_key}, which
      # belongs to a different provider.
      openai_api_key: unused-for-local-vllm
      openai_model: ${policy_model_name}
      # The reference's `pro_bash`: its `craft_bash` edit cue (no new file, no
      # reproduction script, no tests), which keeps a base checkpoint on a
      # 3-forward budget from spending it on exploration, with the root at /app.
      steer: "\nSystem: Your investigation is complete. Fix the bug now by EDITING the existing source in /app. Do NOT create a new file, do NOT write a reproduction script, and do NOT run tests -- make the code change itself. Reply with exactly one bash command in this exact form and nothing after it:\n```mswea_bash_command\n<your command>\n```"
      max_tokens: 1024
      temperature: 0.6

prefix_pass_k_agent_pro:
  _inherit_from: prefix_pass_k_agent
  responses_api_agents:
    prefix_pass_k_agent:
      resources_server:
        type: resources_servers
        name: prefix_pass_k_pro_resources_server
      model_server:
        type: responses_api_models
        name: policy_model_pro
      step_timeout: 300
      interpreter: [bash, -lc]
      # mini's env, and only that: the batch set no locale, and the images that
      # need one (openlibrary) set their own.
      exec_env:
        PAGER: cat
        MANPAGER: cat
        LESS: -R
        PIP_PROGRESS_BAR: "off"
        TQDM_DISABLE: "1"
      offline: true
      record_git_state: true
      datasets:
        - name: prefix_pass_k_pro
          type: benchmark
          jsonl_fpath: benchmarks/prefix_pass_k/data/prefix_pass_k_pro_benchmark.jsonl
          prepare_script: benchmarks/prefix_pass_k/prepare_pro.py
          num_repeats: 32

prefix_pass_k_agent_pro_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: prefix_pass_k_agent_pro
