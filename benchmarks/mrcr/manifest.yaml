name: mrcr
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: long_context
description: MRCR multi-round coreference resolution with prefix-gated SequenceMatcher
  grading.
modality: text
licensing: MIT
authors:
- Marta Stepniewska-Dziubinska
maintainers:
- gwarmstrong
capabilities:
- retrieval_and_grounding
- retrieval_and_grounding/long_context_learning
- context_management
- context_management/reference_resolution
- instruction_and_format_following
- instruction_and_format_following/instruction_following
domains:
- general
primary_metric: pass@1[avg-of-4]/accuracy
requirements:
  gpu: false
  network: no-network
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: mrcr
agent_server: simple_agent
datasets:
- name: mrcr
  type: benchmark
  jsonl_fpath: benchmarks/mrcr/data/mrcr_benchmark.jsonl
  prepare_script: benchmarks/mrcr/prepare.py
  num_repeats: 4
model_server: policy_model
canonical_split: train
prompt_source: prepared
lifecycle: active
