name: molmo2_videotrack
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: other
description: Molmo2-VideoTrackEval text-referred video point tracking (3,147 expressions in five categories).
  The model reports a point per visible matching object in frames 1 second apart, scored by mask-membership F1.
modality: text, image
licensing: ODC-BY-1.0
authors:
- Pulkit Khandelwal
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: molmo2_videotrack
agent_server: simple_agent
datasets:
- name: molmo2_videotrack
  type: benchmark
  jsonl_fpath: benchmarks/molmo2_videotrack/data/molmo2_videotrack_benchmark.jsonl
  prepare_script: benchmarks/molmo2_videotrack/prepare.py
  num_repeats: 1
model_server: policy_model
canonical_split: test
prompt_source: prepared
lifecycle: active
