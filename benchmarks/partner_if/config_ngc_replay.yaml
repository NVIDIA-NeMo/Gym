config_paths:
- resources_servers/partner_if/configs/verifier_base.yaml
- benchmarks/partner_if/config_ngc_replay_runtime.yaml
policy_base_url: https://inference-api.nvidia.com/v1
policy_model_name: nvidia/nvidia/nemotron-3.5-super-vl
policy_api_key: null
judge_base_url: null
judge_api_key: null
judge_model_name: nvidia/zai-org/glm-5.3
skip_venv_if_present: true
partner_if:
  resources_servers:
    partner_if:
      accept_verification_input: true
      allow_provisional_rubrics: true
      judge_max_concurrency: 1
      judge_responses_create_params:
        input: []
        max_output_tokens: 32768
        temperature: 0.0
partner_if_judge:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: ${judge_base_url}
      api_key: ${judge_api_key}
      model: ${judge_model_name}
      uses_reasoning_parser: true
      uses_interleaved_reasoning: true
      reasoning_field: reasoning_content
      return_token_id_information: false
      max_num_tries: 1
      max_http_attempts: 1
      request_timeout_seconds: 180
observability_enabled: true
model_call_capture_dir: ${replay_artifacts}/../model_calls
policy_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: ${policy_base_url}
      api_key: ${policy_api_key}
      model: ${policy_model_name}
      uses_reasoning_parser: true
      uses_interleaved_reasoning: true
      reasoning_field: reasoning_content
      return_token_id_information: false
      max_num_tries: 1
      max_http_attempts: 1
      request_timeout_seconds: 180
partner_if_dispatcher:
  responses_api_agents:
    partner_if_dispatcher:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: partner_if
      task_routes:
        pif_029:
          type: environment_servers
          name: partner_if_ngc_replay_environment_server
      datasets:
      - name: partner_if_ngc_replay
        type: benchmark
        jsonl_fpath: benchmarks/partner_if/data/ngc_replay/partner_if_ngc_replay.jsonl
        prepare_script: benchmarks/partner_if/prepare_ngc_replay.py
        prompt_config: null
        num_repeats: 1
partner_if_dispatcher_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: partner_if_dispatcher
