config_paths:
  - resources_servers/ocsr/configs/ocsr.yaml

responses_create_params:
  max_output_tokens: 65536

ocsr_benchmark_resources_server:
  _inherit_from: ocsr

ocsr_benchmark_simple_agent:
  _inherit_from: ocsr_simple_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        name: ocsr_benchmark_resources_server
      datasets:
      - name: ocsr
        type: benchmark
        jsonl_fpath: benchmarks/ocsr/data/ocsr_benchmark.jsonl
        prompt_config: null
        prepare_script: benchmarks/ocsr/prepare.py
        num_repeats: 1
        license: Apache-2.0

ocsr_benchmark_environment_server:
  _inherit_from: ocsr_environment_server
  environment_servers:
    single_agent_turn_legacy:
      resources_server:
        name: ocsr_benchmark_resources_server
      agent_server:
        name: ocsr_benchmark_simple_agent
