name: simpleqa
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: knowledge
description: SimpleQA short-form factual QA with 3-tier LLM judge (CORRECT / INCORRECT
  / NOT_ATTEMPTED)
modality: text
licensing: unknown
authors:
- gwarmstrong
maintainers:
- gwarmstrong
intended_use:
- evaluation
capabilities:
- knowledge
- knowledge/factual_knowledge
- knowledge/knowledge_uncertainty
- writing_and_editing
- writing_and_editing/general_qa
domains:
- general
primary_metric: pass@1[avg-of-1]/f1
requirements:
  gpu: false
  network: allowlist
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: simpleqa
agent_server: simple_agent
datasets:
- name: simpleqa
  type: benchmark
  jsonl_fpath: benchmarks/simpleqa/data/simpleqa_benchmark.jsonl
  prepare_script: benchmarks/simpleqa/prepare.py
  prompt_config: benchmarks/prompts/generic/default.yaml
  num_repeats: 1
model_server: policy_model
canonical_split: train
standard_prompt_config: benchmarks/prompts/generic/default.yaml
lifecycle: active
