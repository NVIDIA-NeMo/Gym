name: simpleqa
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: knowledge
description: SimpleQA short-form factual QA with 3-tier LLM judge (CORRECT / INCORRECT
  / NOT_ATTEMPTED)
modality: text
licensing: unknown
authors:
- George Armstrong
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: simpleqa
agent_server: simple_agent
datasets:
- name: simpleqa
  type: benchmark
  jsonl_fpath: benchmarks/simpleqa/data/simpleqa_benchmark.jsonl
  prepare_script: benchmarks/simpleqa/prepare.py
  prompt_config: benchmarks/prompts/generic/default.yaml
  num_repeats: 1
model_server: policy_model
canonical_split: benchmark
standard_prompt_config: benchmarks/prompts/generic/default.yaml
lifecycle: active
