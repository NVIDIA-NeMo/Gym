name: robolab
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: external-agent-loop
domain: agent
description: RoboLab simulated manipulation via EmberBridge OpenCode episodes (SDK 1.5 RGB and open_model RGB-D) with sealed Nanoverse native grading.
modality: image
licensing: unknown
authors:
  - NVIDIA NeMo Gym contributors
reward:
  range: [0.0, 1.0]
  higher_is_better: true
determinism: unknown
resources_server: null
agent_server: robolab_agent
model_server: policy_model
canonical_split: benchmark
prompt_source: agent
datasets:
  - name: robolab
    type: benchmark
    jsonl_fpath: ${oc.env:NEMO_GYM_BENCH_DIR,benchmarks/robolab/data}/case.jsonl
    prepare_script: benchmarks/robolab/prepare.py
    num_repeats: 1
    taskset: robolab
  - name: example
    type: example
    jsonl_fpath: benchmarks/robolab/data/example.jsonl
    num_repeats: 1
    taskset: robolab
