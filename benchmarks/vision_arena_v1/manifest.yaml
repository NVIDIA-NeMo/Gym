  jsonl_fpath: benchmarks/vision_arena_v1/data/vision_arena_v1_validation.jsonl
  prepare_script: benchmarks/vision_arena_v1/prepare.py
  num_repeats: 1
model_server: policy_model
canonical_split: train
prompt_source: prepared
adopted_from:
  source: https://huggingface.co/datasets/lmarena-ai/vision-arena-bench-v0.1
  ref: 3abe18efa30d674a8903386b463ce278e7f41f2d  # pragma: allowlist secret
  reconciled: '2026-10-23'
lifecycle: active
