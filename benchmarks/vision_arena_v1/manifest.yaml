name: vision_arena_v1
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: rlhf
description: VisionArena-Bench image-and-text prompts, each answer compared with a
  saved baseline answer in both orders by an LLM judge.
modality: text, image
licensing: MIT
authors:
- NVIDIA NeMo Gym contributors
maintainers:
- jveronvialard
intended_use:
- evaluation
capabilities:
- multimodal_input_understanding
