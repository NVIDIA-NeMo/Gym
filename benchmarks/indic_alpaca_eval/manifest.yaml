name: indic_alpaca_eval
version: 1.0.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: other
description: Custom pointwise evaluation of translated AlpacaEval instructions in 12 Indic languages.
modality: text
licensing: Apache-2.0 AND CC-BY-NC-4.0
authors: [NVIDIA NeMo Gym contributors]
reward:
  range: [0, 1]
  higher_is_better: true
determinism: stochastic
resources_server: alpaca_pointwise_judge
agent_server: simple_agent
model_server: policy_model
datasets:
  - name: indic_alpaca_eval
    type: benchmark
    jsonl_fpath: benchmarks/indic_alpaca_eval/data/indic_alpaca_eval_benchmark.jsonl
    prepare_script: benchmarks/indic_alpaca_eval/prepare.py
    num_repeats: 1
prompt_source: prepared
canonical_split: benchmark
session_model: episode
state: none
lifecycle: active
