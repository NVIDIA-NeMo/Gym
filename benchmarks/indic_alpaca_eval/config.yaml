# Custom reference-free rubric. Official AlpacaEval pairwise metrics use export.py.
config_paths:
  - resources_servers/arena_judge/configs/arena_judge.yaml

indic_alpaca_eval_resources_server:
  _inherit_from: arena_judge
  resources_servers:
    arena_judge:
      evaluation_mode: pointwise
      description: Indic AlpacaEval instructions evaluated with a custom reference-free rubric
      value: Measure instruction-following answer quality without reference answers

indic_alpaca_eval_simple_agent:
  _inherit_from: arena_judge_simple_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        name: indic_alpaca_eval_resources_server
      datasets:
        - name: indic_alpaca_eval
          type: benchmark
          jsonl_fpath: benchmarks/indic_alpaca_eval/data/indic_alpaca_eval_benchmark.jsonl
          prompt_config: benchmarks/prompts/generic/default.yaml
          prepare_script: benchmarks/indic_alpaca_eval/prepare.py
          license: CC-BY-NC-4.0

indic_alpaca_eval_environment_server:
  _inherit_from: arena_judge_environment_server
  environment_servers:
    legacy_agent:
      agent_server:
        name: indic_alpaca_eval_simple_agent
