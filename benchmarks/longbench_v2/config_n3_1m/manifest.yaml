name: longbench_v2/config_n3_1m
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: long_context
description: LongBench-v2 multiple-choice questions filtered to at most 1048576 context
  tokens using the Nemotron-3-Super tokenizer.
modality: text
licensing: unknown
authors:
- gwarmstrong
maintainers:
- gwarmstrong
capabilities:
- instruction_and_format_following
- instruction_and_format_following/structured_output
