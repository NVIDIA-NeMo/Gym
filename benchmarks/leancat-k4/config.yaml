# LeanCat at the paper's generalist-model budget: k=4 (Table 1). `benchmarks/leancat` is k=32,
# the specialized-prover budget of Table 3. Same rows, same prompt, same verifier settings.
config_paths:
  - resources_servers/leancat/configs/leancat.yaml

leancat_k4_leancat_resources_server:
  _inherit_from: leancat
  resources_servers:
    leancat:
      # Off for reproduction: upstream's verifier has no statement check.
      require_statement_preserved: false

leancat_k4_leancat_simple_agent:
  _inherit_from: leancat_simple_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        name: leancat_k4_leancat_resources_server
      datasets:
      - name: leancat_k4
        type: benchmark
        jsonl_fpath: benchmarks/leancat-k4/data/leancat_k4_benchmark.jsonl
        prepare_script: benchmarks/leancat-k4/prepare.py
        license: CC-BY-4.0
        prompt_config: benchmarks/prompts/eval/leancat/paper.yaml
        num_repeats: 4
