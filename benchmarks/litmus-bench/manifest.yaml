name: litmus-bench
# Initial manifest composition version, not an upstream dataset release.
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: knowledge
description: >-
  Pinned Litmus-Bench v0.1 test split with rendered chemistry questions and exact-answer verification.
modality: text
licensing: CC-BY-4.0
# Integration authors from the introducing config commits.
authors:
  - Dane
reward:
  range: [0.0, 1.0]
  higher_is_better: true
determinism: unknown
resources_server: litmus_agent
agent_server: simple_agent
model_server: policy_model
prompt_source: prepared
datasets:
  - name: litmus-bench
    type: benchmark
    jsonl_fpath: benchmarks/litmus-bench/data/litmus-bench_benchmark.jsonl
    prepare_script: benchmarks/litmus-bench/prepare.py
    num_repeats: 5
# Gym evaluation split; upstream splits are described separately.
canonical_split: benchmark
lifecycle: active
