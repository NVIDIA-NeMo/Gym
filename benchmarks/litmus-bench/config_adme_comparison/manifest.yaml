name: litmus-bench/config_adme_comparison
version: 0.2.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: knowledge
description: Litmus-Bench ADME Tier-5 comparison held-out evaluation,
  scored with per-row comparison rules.
modality: text
licensing: LicenseRef-OpenMDW-1.1
authors:
- Olivia Viessmann
maintainers:
- OliviaViessmann
intended_use:
- evaluation
capabilities:
- instruction_and_format_following
- instruction_and_format_following/structured_output
- instruction_and_format_following/instruction_following
- knowledge
- knowledge/expert_knowledge
- reasoning
- reasoning/quantitative_reasoning
- reasoning/deductive_reasoning
- reasoning/spatial_temporal_reasoning
domains:
- chemistry
primary_metric: pass@1[avg-of-5]/accuracy
requirements:
  gpu: false
  network: no-network
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
config_path: ../config_adme_comparison.yaml
resources_server: litmus_agent
agent_server: simple_agent
datasets:
- name: adme-tier5-comparison
  type: benchmark
  jsonl_fpath: benchmarks/litmus-bench/data/adme-tier5-comparison_benchmark.jsonl
  prepare_script: benchmarks/litmus-bench/prepare.py
  num_repeats: 5
model_server: policy_model
canonical_split: validation
prompt_source: prepared
lifecycle: active
