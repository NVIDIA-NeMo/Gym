# Litmus-Bench ADME Tier-5, direct subset.
config_paths:
  - benchmarks/litmus-bench/config_adme_base.yaml

prepare_script_args:
  subset: direct

adme_tier5_direct_agent:
  _inherit_from: litmus_agent_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        name: adme_tier5_resources_server
      datasets:
        - name: adme-tier5-direct
          type: benchmark
          jsonl_fpath: benchmarks/litmus-bench/data/adme-tier5-direct_benchmark.jsonl
          prompt_config: null
          prepare_script: benchmarks/litmus-bench/prepare.py
          num_repeats: 5
          license: LicenseRef-OpenMDW-1.1

adme_tier5_direct_environment_server:
  _inherit_from: litmus_agent_environment_server
  environment_servers:
    legacy_agent:
      agent_server:
        name: adme_tier5_direct_agent
