name: litmus-bench/config_tier12
version: 0.2.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: knowledge
description: Litmus-Bench Tier 1/2 held-out molecular-property questions, scored
  with per-question answer extraction and comparison rules.
modality: text
licensing: CC-BY-SA-4.0
authors:
- Olivia Viessmann
maintainers:
- OliviaViessmann
capabilities:
- instruction_and_format_following
- instruction_and_format_following/structured_output
- instruction_and_format_following/instruction_following
- knowledge
- knowledge/expert_knowledge
- reasoning
- reasoning/quantitative_reasoning
- reasoning/deductive_reasoning
- reasoning/spatial_temporal_reasoning
domains:
- chemistry
primary_metric: pass@1[avg-of-5]/accuracy
requirements:
  gpu: false
  network: no-network
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
config_path: ../config_tier12.yaml
resources_server: litmus_agent
agent_server: simple_agent
datasets:
- name: litmus-tier12
  type: benchmark
  jsonl_fpath: benchmarks/litmus-bench/data/litmus-tier12_benchmark.jsonl
  prepare_script: benchmarks/litmus-bench/prepare.py
  num_repeats: 5
model_server: policy_model
canonical_split: validation
prompt_source: prepared
lifecycle: active
