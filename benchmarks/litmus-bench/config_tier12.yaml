# Litmus-Bench Tier 1/2 direct-answer evaluation.
config_paths:
  - resources_servers/litmus_agent/configs/litmus_agent.yaml

responses_create_params:
  max_output_tokens: 131072

prepare_script_args:
  subset: tier12

litmus_tier12_resources_server:
  _inherit_from: litmus_agent
  resources_servers:
    litmus_agent:
      verified: false

litmus_tier12_agent:
  _inherit_from: litmus_agent_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        name: litmus_tier12_resources_server
      datasets:
        - name: litmus-tier12
          type: benchmark
          jsonl_fpath: benchmarks/litmus-bench/data/litmus-tier12_benchmark.jsonl
          prompt_config: null
          prepare_script: benchmarks/litmus-bench/prepare.py
          num_repeats: 5
          license: CC-BY-SA-4.0

litmus_tier12_environment_server:
  _inherit_from: litmus_agent_environment_server
  environment_servers:
    legacy_agent:
      agent_server:
        name: litmus_tier12_agent
