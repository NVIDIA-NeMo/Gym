name: litmus-bench/config_adme_analogue
# Initial manifest composition version, not an upstream dataset release.
version: 0.1.0
experimental: true
kind: benchmark
config_path: ../config_adme_analogue.yaml
integration_profile: custom-gym-verifier
domain: knowledge
description: >-
  ADME Tier-5 analogue property evaluation from local validation exports, scored with per-row comparison rules.
modality: text
licensing: unknown
# Integration authors from the introducing config commits.
authors:
  - Olivia Viessmann
reward:
  range: [0.0, 1.0]
  higher_is_better: true
determinism: unknown
resources_server: litmus_agent
agent_server: simple_agent
model_server: policy_model
prompt_source: prepared
datasets:
  - name: adme-tier5-analogue
    type: benchmark
    jsonl_fpath: benchmarks/litmus-bench/data/adme-tier5-analogue_benchmark.jsonl
    prepare_script: benchmarks/litmus-bench/prepare_adme_tier5.py
    num_repeats: 5
# Gym evaluation split; upstream splits are described separately.
canonical_split: benchmark
lifecycle: active
