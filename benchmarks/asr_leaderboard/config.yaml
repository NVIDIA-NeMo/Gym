config_paths:
  - resources_servers/asr_with_pc/configs/asr_with_pc.yaml

asr_leaderboard_asr_with_pc_resources_server:
  _inherit_from: asr_with_pc
  resources_servers:
    asr_with_pc:
      task_type: OpenASR
      cleanup_generation_loops: true

asr_leaderboard_asr_with_pc_simple_agent:
  _inherit_from: asr_with_pc_simple_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        name: asr_leaderboard_asr_with_pc_resources_server
      datasets:
      - name: asr_leaderboard
        type: benchmark
        jsonl_fpath: benchmarks/asr_leaderboard/data/asr_leaderboard_benchmark.jsonl
        prepare_script: benchmarks/asr_leaderboard/prepare.py
        prepare_dependencies:
        - soundfile
        - whisper-normalizer==0.1.15
        license: Creative Commons Attribution 4.0 International

# ASR request settings: reasoning off, greedy decoding, seed 0.
policy_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: ${policy_base_url}
      api_key: ${policy_api_key}
      model: ${policy_model_name}
      return_token_id_information: false
      chat_template_kwargs:
        enable_thinking: false
      extra_body:
        seed: 0

responses_create_params:
  temperature: 0.0
  top_p: 1.0
  max_output_tokens: 16384
  stream: false

asr_leaderboard_asr_with_pc_environment_server:
  _inherit_from: asr_with_pc_environment_server
  environment_servers:
    single_agent_turn_legacy:
      resources_server:
        type: resources_servers
        name: asr_leaderboard_asr_with_pc_resources_server
      agent_server:
        name: asr_leaderboard_asr_with_pc_simple_agent
