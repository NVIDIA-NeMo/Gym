name: asr_leaderboard
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: asr
description: English ASR on the eight Hugging Face Open ASR Leaderboard test sets, scored with the leaderboard's text normalizer and corpus-level WER.
modality: audio
licensing: CC-BY-4.0 AND CC0-1.0 AND CC-BY-SA-4.0 AND Apache-2.0 AND LicenseRef-SPGISpeech-Terms AND LicenseRef-URGENT2024-Unspecified
authors:
- gwarmstrong
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: asr_with_pc
agent_server: simple_agent
datasets:
- name: asr_leaderboard
  type: benchmark
  jsonl_fpath: benchmarks/asr_leaderboard/data/asr_leaderboard_benchmark.jsonl
  prepare_script: benchmarks/asr_leaderboard/prepare.py
  num_repeats: 1
model_server: policy_model
canonical_split: benchmark
prompt_source: prepared
lifecycle: active
