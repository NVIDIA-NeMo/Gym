name: asr_leaderboard
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: other
description: ASR with WER scoring (standard, case-sensitive, punctuation+capitalization)
modality: audio
licensing: unknown
authors:
- gwarmstrong
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: asr_with_pc
agent_server: simple_agent
datasets:
- name: asr_leaderboard
  type: benchmark
  jsonl_fpath: benchmarks/asr_leaderboard/data/asr_leaderboard_benchmark.jsonl
  prepare_script: benchmarks/asr_leaderboard/prepare.py
  prompt_config: benchmarks/asr_leaderboard/prompts/default.yaml
  num_repeats: 1
model_server: policy_model
canonical_split: benchmark
standard_prompt_config: benchmarks/asr_leaderboard/prompts/default.yaml
lifecycle: active
