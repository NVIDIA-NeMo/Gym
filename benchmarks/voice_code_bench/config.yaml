config_paths:
- resources_servers/audio_eval/configs/audio_eval.yaml

# The entity verifier; set judge_base_url, judge_api_key and judge_model_name (the reference verifier is gpt-5.5) in env.yaml.
judge_model:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: ${oc.select:judge_base_url,http://unset.local/v1}
      openai_api_key: ${oc.select:judge_api_key,unset}
      openai_model: ${oc.select:judge_model_name,unset}

voice_code_bench_resources_server:
  _inherit_from: audio_eval
  resources_servers:
    audio_eval:
      profile_contracts: benchmarks/voice_code_bench/profiles.json
      judge_model_server:
        type: responses_api_models
        name: judge_model

voice_code_bench_simple_agent:
  _inherit_from: audio_eval_simple_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        name: voice_code_bench_resources_server
      datasets:
      - name: voice_code_bench
        type: benchmark
        jsonl_fpath: benchmarks/voice_code_bench/data/voice_code_bench.jsonl
        prepare_script: benchmarks/voice_code_bench/prepare.py
        license: MIT AND LicenseRef-VoiceCodeBench-Audio

voice_code_bench_environment_server:
  _inherit_from: audio_eval_environment_server
  environment_servers:
    single_agent_turn_legacy:
      agent_server:
        name: voice_code_bench_simple_agent
      resources_server:
        type: resources_servers
        name: voice_code_bench_resources_server
