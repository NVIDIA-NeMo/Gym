# Reward profiling: run swemer_v2's training tasks through the opencode sandboxed agent (not
# the golden patch) to collect real rollouts + rewards for a policy checkpoint, 8 repeats per
# task. See resources_servers/swemer_v2/configs/swemer_v2.yaml for the base resources server.
config_paths:
- responses_api_agents/opencode_sandboxed_agent/configs/opencode_sandboxed_agent.yaml
- resources_servers/swemer_v2/configs/swemer_v2.yaml

swemer_v2_reward_profiling_resources_server:
  _inherit_from: swemer_v2_resources_server

  resources_servers:
    swemer_v2:
      allowed_agents: [opencode_sandboxed_agent]
      evaluation_timeout: 1200

swemer_v2_reward_profiling_opencode_sandboxed_agent:
  _inherit_from: opencode_sandboxed_agent
  responses_api_agents:
    opencode_sandboxed_agent:
      resources_server:
        type: resources_servers
        name: swemer_v2_reward_profiling_resources_server
      # 1hr harness execution budget per rollout, not the eval-server's own evaluation_timeout.
      sandbox_timeout: 3600
      # Keep every full turn in the rollout for reward profiling -- no OpenCode-side
      # auto-summarization/pruning of earlier context.
      opencode_config:
        compaction:
          auto: false
          prune: false
      datasets:
        - name: swemer_v2_reward_profiling
          type: benchmark
          jsonl_fpath: resources_servers/swemer_v2/data/swemer_v2_training_enriched_with_prompt_template.jsonl
          prepare_script: benchmarks/reward_profiling/swemer_v2/prepare.py
          num_repeats: 8
