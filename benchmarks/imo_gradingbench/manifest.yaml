name: imo_gradingbench
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: math
description: Four-class grading of math proofs — the policy model reads a problem
  plus a candidate proof and emits one of correct / almost / partial / incorrect as
  the last word.
modality: text
licensing: unknown
authors:
- George Armstrong
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: imo_gradingbench
agent_server: simple_agent
datasets:
- name: imo_gradingbench
  type: benchmark
  jsonl_fpath: benchmarks/imo_gradingbench/data/imo_gradingbench_benchmark.jsonl
  prepare_script: benchmarks/imo_gradingbench/prepare.py
  prompt_config: benchmarks/imo_gradingbench/prompts/default.yaml
  num_repeats: 1
model_server: policy_model
canonical_split: benchmark
standard_prompt_config: benchmarks/imo_gradingbench/prompts/default.yaml
lifecycle: active
