name: lvbench
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: other
description: LVBench (THUDM/LVBench, not LongVideoBench) single-turn long-video multiple-choice QA; each row sends
  the video as a file:// URL for the model server to sample frames, and a judge model reads the chosen option.
modality: video
licensing: CC-BY-NC-SA-4.0
authors:
- Guo Chen
maintainers:
- cg1177
capabilities:
- multimodal_input_understanding/temporal_media_understanding
- retrieval_and_grounding/long_context_learning
- reasoning/spatial_temporal_reasoning
domains:
- general
primary_metric: mean/LVBench
requirements:
  gpu: false
  network: allowlist
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: stochastic
config_path: config.yaml
resources_server: lvbench
agent_server: simple_agent
datasets:
- name: lvbench
  type: benchmark
  jsonl_fpath: benchmarks/lvbench/data/lvbench_benchmark.jsonl
  prepare_script: benchmarks/lvbench/prepare.py
  num_repeats: 1
model_server: policy_model
canonical_split: benchmark
prompt_source: prepared
lifecycle: active
