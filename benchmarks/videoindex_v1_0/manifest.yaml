  network: no-network
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: stochastic
config_path: config.yaml
resources_server: videoindex
agent_server: simple_agent
datasets:
- name: videoindex_v1_0
  type: benchmark
  jsonl_fpath: benchmarks/videoindex_v1_0/data/videoindex_v1_0_benchmark.jsonl
  prepare_script: benchmarks/videoindex_v1_0/prepare.py
  num_repeats: 1
model_server: policy_model
