name: videoindex_v1_0
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: other
description: Video-Index v1.0 single-turn video multiple-choice QA (840 questions, 2-10 options) across four
  capability groups (perception, temporal, spatial_physical, reasoning_knowledge), scored by the official rule
  (videoindex_rule_v1) or an optional judge model (llm_extraction_v1).
modality: video
licensing: unknown
authors:
- Guo Chen
maintainers:
- cg1177
capabilities:
- multimodal_input_understanding/temporal_media_understanding
