name: ifbench
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: instruction_following
description: IFBench instruction following evaluation using AllenAI's IFBench library
  (57 instruction types)
modality: text
licensing: unknown
authors:
- fsiino-nvidia
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: ifbench
agent_server: simple_agent
datasets:
- name: ifbench
  type: benchmark
  jsonl_fpath: benchmarks/ifbench/data/ifbench_benchmark.jsonl
  prepare_script: benchmarks/ifbench/prepare.py
  prompt_config: benchmarks/ifbench/prompts/default.yaml
  num_repeats: 5
model_server: policy_model
canonical_split: benchmark
standard_prompt_config: benchmarks/ifbench/prompts/default.yaml
lifecycle: active
