config_paths:
- resources_servers/spatialclaw/configs/spatialclaw_resources.yaml
- responses_api_agents/spatialclaw_agent/configs/spatialclaw_agent.yaml
spatialclaw_paibench_benchmark_resources_server:
  _inherit_from: spatialclaw_resources_server
  resources_servers:
    spatialclaw:
      dataset_config: paibench_spatialclaw_256f
      data_root: ${oc.env:SPATIALCLAW_DATA_ROOT}
      datasets:
      - name: spatialclaw_paibench
        type: benchmark
        jsonl_fpath: benchmarks/spatialclaw/data/paibench_benchmark.jsonl
        prompt_config: null
        prepare_script: benchmarks/spatialclaw/prepare_paibench.py
        num_repeats: 1
        taskset: spatialclaw:paibench_spatialclaw_256f
spatialclaw_paibench_benchmark_agent:
  _inherit_from: spatialclaw_agent
  responses_api_agents:
    spatialclaw_agent:
      resources_server: null
      dataset_config: paibench_spatialclaw_256f
      video_root: ${oc.env:SPATIALCLAW_DATA_ROOT}
spatialclaw_paibench_benchmark_environment_server:
  environment_servers:
    single_agent_turn:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: spatialclaw_paibench_benchmark_resources_server
      agent_server:
        type: responses_api_agents
        name: spatialclaw_paibench_benchmark_agent
      resources_tool_transports:
      - direct_http
      max_concurrent_episodes: 1
      default_episode_timeout_seconds: 2400
      cleanup_timeout_seconds: 180
environment_routing_mode: taskset
environment_server_routes:
  spatialclaw:paibench_spatialclaw_256f: spatialclaw_paibench_benchmark_environment_server
