# omni3d evaluated through the SpatialClaw agent and native evaluator.
config_paths:
  - resources_servers/spatialclaw/configs/spatialclaw_resources.yaml
  - responses_api_agents/spatialclaw_agent/configs/spatialclaw_agent.yaml

spatialclaw_omni3d_benchmark_resources_server:
  _inherit_from: spatialclaw_resources_server
  resources_servers:
    spatialclaw:
      dataset_config: omni3d_spatialclaw
      data_root: ${oc.env:SPATIALCLAW_DATA_ROOT}

spatialclaw_omni3d_benchmark_agent:
  _inherit_from: spatialclaw_agent
  responses_api_agents:
    spatialclaw_agent:
      resources_server:
        name: spatialclaw_omni3d_benchmark_resources_server
      dataset_config: omni3d_spatialclaw
      video_root: ${oc.env:SPATIALCLAW_DATA_ROOT}
      datasets:
      - name: spatialclaw_omni3d
        type: benchmark
        jsonl_fpath: benchmarks/spatialclaw/data/omni3d_benchmark.jsonl
        prompt_config: null
        prepare_script: benchmarks/spatialclaw/prepare_omni3d.py
        num_repeats: 1

spatialclaw_omni3d_benchmark_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: spatialclaw_omni3d_benchmark_agent
