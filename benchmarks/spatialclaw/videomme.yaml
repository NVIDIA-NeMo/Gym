# Video-MME (without subtitles) evaluated through the SpatialClaw agent and
# native evaluator.
config_paths:
  - resources_servers/spatialclaw/configs/spatialclaw_resources.yaml
  - responses_api_agents/spatialclaw_agent/configs/spatialclaw_agent.yaml

spatialclaw_videomme_benchmark_resources_server:
  _inherit_from: spatialclaw_resources_server
  resources_servers:
    spatialclaw:
      dataset_config: videomme_spatialclaw
      data_root: ${oc.env:SPATIALCLAW_DATA_ROOT}

spatialclaw_videomme_benchmark_agent:
  _inherit_from: spatialclaw_agent
  responses_api_agents:
    spatialclaw_agent:
      resources_server:
        name: spatialclaw_videomme_benchmark_resources_server
      # Match the complete Nano GA SpatialClaw reference run (1811/2700):
      # 256 key frames at <=2 FPS, Reconstruct+SAM3, thinking enabled, and
      # 16,384 output tokens.
      dataset_config: videomme_spatialclaw
      model_config_path: nemotron-3-nano-omni-30b-a3b-reasoning-hf
      max_output_tokens: 16384
      config_overrides:
        # The input remains capped at 256 key frames. This is the independent
        # upper bound used when SAM3 processes video internally.
        sam3_max_video_frames: 1000
      video_root: ${oc.env:SPATIALCLAW_DATA_ROOT}
      datasets:
      - name: spatialclaw_videomme
        type: benchmark
        jsonl_fpath: benchmarks/spatialclaw/data/videomme_benchmark.jsonl
        prompt_config: null
        prepare_script: benchmarks/spatialclaw/prepare_videomme.py
        num_repeats: 1

spatialclaw_videomme_benchmark_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: spatialclaw_videomme_benchmark_agent
