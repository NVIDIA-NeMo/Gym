# mmsivideo evaluated through the SpatialClaw agent and native evaluator.
config_paths:
  - resources_servers/spatialclaw/configs/spatialclaw_resources.yaml
  - responses_api_agents/spatialclaw_agent/configs/spatialclaw_agent.yaml

spatialclaw_mmsivideo_benchmark_resources_server:
  _inherit_from: spatialclaw_resources_server
  resources_servers:
    spatialclaw:
      dataset_config: mmsivideo_spatialclaw_256f
      data_root: ${oc.env:SPATIALCLAW_DATA_ROOT}

spatialclaw_mmsivideo_benchmark_agent:
  _inherit_from: spatialclaw_agent
  responses_api_agents:
    spatialclaw_agent:
      resources_server:
        name: spatialclaw_mmsivideo_benchmark_resources_server
      dataset_config: mmsivideo_spatialclaw_256f
      video_root: ${oc.env:SPATIALCLAW_DATA_ROOT}
      datasets:
      - name: spatialclaw_mmsivideo
        type: benchmark
        jsonl_fpath: benchmarks/spatialclaw/data/mmsivideo_benchmark.jsonl
        prompt_config: null
        prepare_script: benchmarks/spatialclaw/prepare_mmsivideo.py
        num_repeats: 1

spatialclaw_mmsivideo_benchmark_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: spatialclaw_mmsivideo_benchmark_agent
