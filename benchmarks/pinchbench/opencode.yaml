config_paths:
  - environment_servers/pinchbench/configs/pinchbench.yaml
  - responses_api_agents/opencode_agent/configs/opencode_agent.yaml

opencode_agent:
  responses_api_agents:
    opencode_agent:
      datasets:
        - name: pinchbench
          type: benchmark
          taskset: pinchbench
          jsonl_fpath: benchmarks/pinchbench/data/pinchbench_benchmark.jsonl
          prompt_config: null
          prepare_script: benchmarks/pinchbench/prepare.py
          num_repeats: 10
          license: MIT

pinchbench_environment_server:
  environment_servers:
    pinchbench:
      agent_server: {type: responses_api_agents, name: opencode_agent}
