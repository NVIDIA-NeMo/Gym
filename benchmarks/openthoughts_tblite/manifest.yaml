determinism: unknown
config_path: config.yaml
agent_server: harbor_agent_general
datasets:
- name: openthoughts_tblite
  type: benchmark
  jsonl_fpath: benchmarks/openthoughts_tblite/data/benchmark.jsonl
  prepare_script: benchmarks/openthoughts_tblite/prepare.py
  num_repeats: 3
resources_server: null
model_server: null
canonical_split: full
prompt_source: agent
adopted_from:
  source: https://github.com/open-thoughts/OpenThoughts-TBLite
  ref: f075e463472c7790b85793b392dff1fff20cc0e3
  reconciled: '2026-10-24'
lifecycle: active
