  jsonl_fpath: benchmarks/openthoughts_tblite/data/benchmark.jsonl
  prepare_script: benchmarks/openthoughts_tblite/prepare.py
  num_repeats: 3
resources_server: null
model_server: null
canonical_split: benchmark
prompt_source: agent
lifecycle: active
