# Reuse the English Arena Hard judge, policy model, and prompt settings.
config_paths:
  - resources_servers/arena_judge/configs/arena_judge.yaml

# pointwise scores one answer without a baseline; pairwise preserves Arena-Elo.
arena_judge_mode: pairwise

indic_arena_hard_arena_judge_resources_server:
  _inherit_from: arena_judge
  resources_servers:
    arena_judge:
      evaluation_mode: ${arena_judge_mode}

indic_arena_hard_arena_judge_simple_agent:
  _inherit_from: arena_judge_simple_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        name: indic_arena_hard_arena_judge_resources_server
      datasets:
      - name: indic_arena_hard
        type: benchmark
        jsonl_fpath: benchmarks/indic_arena_hard/data/indic_arena_hard_benchmark.jsonl
        prompt_config: benchmarks/prompts/generic/default.yaml
        prepare_script: benchmarks/indic_arena_hard/prepare.py
        license: Apache 2.0

indic_arena_hard_arena_judge_environment_server:
  _inherit_from: arena_judge_environment_server
  environment_servers:
    legacy_agent:
      agent_server:
        name: indic_arena_hard_arena_judge_simple_agent
