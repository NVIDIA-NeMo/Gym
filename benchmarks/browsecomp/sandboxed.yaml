# BrowseComp with bash_command in a per-rollout sandbox (browsecomp_sandboxed_agent).
# Same harness settings as config.yaml; requires OPENSANDBOX_DOMAIN and OPENSANDBOX_API_KEY.
config_paths:
- benchmarks/browsecomp/config.yaml
- responses_api_agents/browsecomp_sandboxed_agent/configs/browsecomp_sandboxed_agent.yaml
browsecomp_benchmark_agent: null
browsecomp_sandboxed_benchmark_agent:
  _inherit_from: browsecomp_sandboxed_agent
  responses_api_agents:
    browsecomp_sandboxed_agent:
      max_steps: 400
      nudge_steps: true
      max_context_tokens: 196608
      context_reset_tokens: 50000
      context_reset_keep_rounds: 3
      max_run_retries: 1
      max_reset_count: null
      progress: true
      snap_dir: null
      save_model_call_using_vllm_tokenize_endpoint: true
      resources_server:
        type: resources_servers
        name: browsecomp_benchmark_resources_server
      datasets:
      - name: browsecomp
        type: benchmark
        jsonl_fpath: benchmarks/browsecomp/data/browsecomp_benchmark.jsonl
        prompt_config: null
        prepare_script: benchmarks/browsecomp/prepare.py
        num_repeats: 1
browsecomp_benchmark_environment_server:
  environment_servers:
    legacy_agent:
      agent_server:
        name: browsecomp_sandboxed_benchmark_agent
