# BrowseComp search and browse use Brave's public LLM Context API directly.
browsecomp_benchmark_resources_server:
  resources_servers:
    browsecomp_advanced_harness:
      search_provider: brave
      brave:
        api_key: ${brave_search_api_key}
      exclude_domains_file_path: benchmarks/browsecomp/data/empty_exclude_domains.json
