name: genrm_rewardbench2
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: rlhf
description: GenRM judge evaluation on RewardBench 2 best-of-n response sets
modality: text
licensing: ODC-BY-1.0
authors:
- Daniel Egert
reward:
  range: [0.0, 1.0]
  higher_is_better: true
determinism: stochastic
