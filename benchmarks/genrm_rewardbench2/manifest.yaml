    type: benchmark
    jsonl_fpath: benchmarks/genrm_rewardbench2/data/rewardbench2_validation.jsonl
    prepare_script: benchmarks/genrm_rewardbench2/prepare.py
    prompt_config: null
    num_repeats: 1
canonical_split: benchmark
prompt_source: prepared
lifecycle: active
