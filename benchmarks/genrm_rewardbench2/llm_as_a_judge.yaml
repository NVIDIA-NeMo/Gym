config_paths:
  - benchmarks/genrm_rewardbench2/config.yaml
  - resources_servers/genrm_eval/configs/llm_as_a_judge_model.yaml

genrm_rewardbench2_benchmark_agent:
  responses_api_agents:
    simple_agent:
      datasets:
        - name: genrm_rewardbench2_llm_as_a_judge
          type: benchmark
          jsonl_fpath: benchmarks/genrm_rewardbench2/data/rewardbench2_llm_as_a_judge_validation.jsonl
          prepare_script: benchmarks/genrm_rewardbench2/prepare_llm_as_a_judge.py
          prompt_config: null
          num_repeats: 1
          license: ODC-BY-1.0

responses_create_params:
  temperature: 1.0
  top_p: 0.95
  max_output_tokens: 32768
  stream: false
