  prepare_script: benchmarks/babyvision_opencode/prepare.py
  num_repeats: 1
model_server: policy_model
canonical_split: train
prompt_source: prepared
adopted_from:
  source: https://huggingface.co/datasets/UnipatAI/BabyVision
