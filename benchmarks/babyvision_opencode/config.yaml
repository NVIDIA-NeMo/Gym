# BabyVision (388 rows) under OpenCode with a Python shell, as Python_call_gen evaluates it:
# the same prompt, opencode 1.17.11 tools (bash/read/glob/grep/write/edit/todowrite, `read`
# returns images), 1800 s per task and no turn cap, and a gpt-4o-mini correctness judge.
# The environment is the generic visual_coding_opencode; this file only adds the data.
# Data: prepare.py reads $LMUData/BabyVision.tsv (or $BABYVISION_TSV).
config_paths:
  - resources_servers/visual_coding_opencode/configs/visual_coding_opencode.yaml

visual_coding_opencode_agent:
  responses_api_agents:
    opencode_vision_agent:
      datasets:
      - name: babyvision_opencode
        type: benchmark
        jsonl_fpath: benchmarks/babyvision_opencode/data/babyvision_opencode_benchmark.jsonl
        prepare_script: benchmarks/babyvision_opencode/prepare.py
        num_repeats: 1
