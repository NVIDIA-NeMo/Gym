name: deepswe/opencode
# Initial catalog composition version; not an upstream dataset release.
version: 0.1.0
experimental: true
kind: benchmark
config_path: ../opencode.yaml
integration_profile: custom-gym-agent-loop
domain: coding
description: >-
  DeepSWE v1.1 software engineering tasks with prepared instructions, an OpenCode sandboxed agent, and
  execution-based patch verification.
modality: text
licensing: unknown
# Contributor attribution follows the NVIDIA source headers.
authors:
  - NVIDIA NeMo Gym contributors
reward:
  range: [0, 1]
  higher_is_better: true
determinism: unknown
prompt_source: prepared
resources_server: deepswe
agent_server: opencode_sandboxed_agent
model_server: policy_model
datasets:
  - name: deepswe_v1_1
    type: benchmark
    jsonl_fpath: benchmarks/deepswe/data/deepswe_benchmark.jsonl
    prepare_script: benchmarks/deepswe/prepare.py
    num_repeats: 10
canonical_split: test
lifecycle: active
