name: deepswe/opencode
version: 0.2.0
experimental: true
kind: benchmark
integration_profile: custom-gym-agent-loop
domain: coding
description: DeepSWE v1.1 software engineering tasks with prepared instructions, OpenCode
  working in the no-network task sandbox through an agent session, and execution-based
  patch verification.
modality: text
licensing: unknown
authors:
- NVIDIA NeMo Gym contributors
maintainers:
- bxyu-nvidia
primary_metric: mean/reward
requirements:
  gpu: false
  network: allowlist
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
config_path: ../opencode.yaml
resources_server: deepswe
agent_server: opencode_agent
datasets:
- name: deepswe_v1_1
  type: benchmark
  jsonl_fpath: benchmarks/deepswe/data/deepswe_benchmark.jsonl
  prepare_script: benchmarks/deepswe/prepare.py
  num_repeats: 10
model_server: policy_model
canonical_split: full
prompt_source: prepared
adopted_from:
  source: https://github.com/datacurve-ai/deep-swe
  ref: 435ee89ec2f2e2289f33b0da4f992f0b7b7266b9
  reconciled: '2026-08-21'
lifecycle: active
