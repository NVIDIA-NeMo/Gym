# DeepSWE with OpenClaw in place of OpenCode: the same resources server, no-network agent sandbox and fresh verifier
# as opencode.yaml. The agent sandbox cannot download OpenClaw's Node runtime, so the resources server copies a
# prebuilt one into it: build it on an x86_64 Linux host with network, then point DEEPSWE_OPENCLAW_RUNTIME at it.
#
#   bash responses_api_agents/openclaw_agent/install_openclaw_runtime.sh /path/to/openclaw-runtime 2026.6.11
#   export DEEPSWE_OPENCLAW_RUNTIME=/path/to/openclaw-runtime
config_paths:
  - responses_api_agents/openclaw_agent/configs/openclaw_agent.yaml
  - resources_servers/deepswe/configs/deepswe.yaml
  - environment_servers/single_agent_turn_legacy/configs/single_agent_turn_legacy.yaml

deepswe_openclaw_resources_server:
  _inherit_from: deepswe_resources_server
  resources_servers:
    deepswe:
      allowed_agents: [openclaw_agent]
      sandbox_model_server:
        type: responses_api_models
        name: policy_model
      # Copied to /tmp/nemo-gym-deepswe/openclaw in every agent sandbox (sandbox_runtime_dir below).
      agent_runtime_paths:
        openclaw: ${oc.env:DEEPSWE_OPENCLAW_RUNTIME,null}

deepswe_openclaw_agent:
  _inherit_from: openclaw_agent
  responses_api_agents:
    openclaw_agent:
      resources_server:
        type: resources_servers
        name: deepswe_openclaw_resources_server
      openclaw_version: 2026.6.11
      sandbox_runtime_dir: /tmp/nemo-gym-deepswe/openclaw
      # An admitted episode already holds its agent sandbox, so let it run at once.
      concurrency: 1024
      # The three-hour DeepSWE agent budget, in place of the shipped 15 minutes.
      timeout: 10800
      # The served model's context length. OpenClaw lowers a call's output request, compacts and caps long tool
      # results against it, and assumes 200,000 tokens when it is unset.
      context_window: 262144
      # Per model call (OpenClaw's maxTokens). The shipped 8,192 cuts reasoning short, and 32,768 ended a smoke task
      # on a reply truncated at the cap. OpenClaw requests less when the input leaves less room, so a call still fits.
      max_output_tokens: 131072
      # One model call; a long reasoning reply can take longer than the 600 s default.
      model_timeout_seconds: 1800
      datasets:
        - name: deepswe_v1_1
          type: benchmark
          jsonl_fpath: benchmarks/deepswe/data/deepswe_benchmark.jsonl
          prepare_script: benchmarks/deepswe/prepare.py
          num_repeats: 10

deepswe_openclaw_environment_server:
  _inherit_from: single_agent_turn_legacy
  environment_servers:
    single_agent_turn_legacy:
      resources_server:
        type: resources_servers
        name: deepswe_openclaw_resources_server
      agent_server:
        type: responses_api_agents
        name: deepswe_openclaw_agent
      # OpenClaw's run (10800) plus seed, runtime copy and verification, within the agent sandbox's ttl_s (18000).
      default_episode_timeout_seconds: 18000
