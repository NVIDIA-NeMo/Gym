# DeepSWE with NOOA: the same episode as opencode.yaml (Resources seeds the no-network agent sandbox, the
# harness works in it through an agent session, Resources grades the patch in a fresh verifier sandbox), with
# NOOA's BenchAgent as the harness. The agent sandbox has no network, so NOOA's runtime comes from a prepared
# offline bundle (see resources_servers/deepswe/README.md).
config_paths:
  - responses_api_agents/nooa_agent/configs/nooa_agent.yaml
  - resources_servers/deepswe/configs/deepswe.yaml
  - environment_servers/single_agent_turn_legacy/configs/single_agent_turn_legacy.yaml

# This recipe binds its own environment instead of the generic NOOA environment.
nooa_environment_server: null

deepswe_nooa_resources_server:
  _inherit_from: deepswe_resources_server
  resources_servers:
    deepswe:
      allowed_agents: [nooa_agent]
      sandbox_model_server:
        type: responses_api_models
        name: policy_model

deepswe_nooa_agent:
  _inherit_from: nooa_agent
  responses_api_agents:
    nooa_agent:
      resources_server:
        type: resources_servers
        name: deepswe_nooa_resources_server
      nooa:
        execution_mode: sandboxed
      # Built outside the task sandbox for this checkout; task setup then downloads nothing.
      runtime_wheelhouse: ${oc.env:NOOA_SWE_RUNTIME_WHEELHOUSE,null}
      runtime_wheelhouse_required: true
      # DeepSWE agent budget: 3 hours, as opencode.yaml. NOOA has no model-call limit by default.
      sandbox_runner_timeout_seconds: 10800
      # Match the serving context window when overriding it.
      context_window: 262144
      datasets:
        - name: deepswe_v1_1
          type: benchmark
          jsonl_fpath: benchmarks/deepswe/data/deepswe_benchmark.jsonl
          prepare_script: benchmarks/deepswe/prepare.py
          num_repeats: 10

deepswe_environment_server:
  _inherit_from: single_agent_turn_legacy
  environment_servers:
    single_agent_turn_legacy:
      resources_server:
        type: resources_servers
        name: deepswe_nooa_resources_server
      agent_server:
        type: responses_api_agents
        name: deepswe_nooa_agent
      # NOOA's run (10800) plus seed, installation and verification, and no longer than the agent sandbox's
      # ttl_s (18000 in deepswe.yaml).
      default_episode_timeout_seconds: 18000
