# DeepSWE with Hermes: the same episode as opencode.yaml (Resources seeds the no-network agent sandbox, the
# harness works in it through an agent session, Resources grades the patch in a fresh verifier sandbox), with
# Hermes as the harness. The Agent Server stages Hermes's runtime into the sandbox, so no network is needed there.
config_paths:
  - responses_api_agents/hermes_agent/configs/hermes_agent.yaml
  - resources_servers/deepswe/configs/deepswe.yaml
  - environment_servers/single_agent_turn_legacy/configs/single_agent_turn_legacy.yaml

deepswe_hermes_resources_server:
  _inherit_from: deepswe_resources_server
  resources_servers:
    deepswe:
      allowed_agents: [hermes_agent]
      sandbox_model_server:
        type: responses_api_models
        name: policy_model

deepswe_hermes_agent:
  _inherit_from: hermes_agent
  responses_api_agents:
    hermes_agent:
      resources_server:
        type: resources_servers
        name: deepswe_hermes_resources_server
      # DeepSWE agent budget: 3 hours, as opencode.yaml.
      sandbox_runner_timeout_seconds: 10800
      # No step limit: the run limit above is the bound, as for OpenCode, which has none. max_turns takes no
      # null, so it is set where three hours cannot reach it.
      max_turns: 1000000
      # Hermes's own default for the per-command timeout; hermes_agent.yaml lowers it to 60. Every toolset
      # stays enabled, as hermes_agent.yaml leaves it.
      terminal_timeout: 180
      # Match the serving context window when overriding it; compression triggers at 85% of it.
      context_length: 262144
      # One worker runs every session; an admitted episode already holds its agent sandbox.
      concurrency: 1024
      datasets:
        - name: deepswe_v1_1
          type: benchmark
          jsonl_fpath: benchmarks/deepswe/data/deepswe_benchmark.jsonl
          prepare_script: benchmarks/deepswe/prepare.py
          num_repeats: 10

deepswe_environment_server:
  _inherit_from: single_agent_turn_legacy
  environment_servers:
    single_agent_turn_legacy:
      resources_server:
        type: resources_servers
        name: deepswe_hermes_resources_server
      agent_server:
        type: responses_api_agents
        name: deepswe_hermes_agent
      # Hermes's run (10800) plus seed, installation and verification, and no longer than the agent sandbox's
      # ttl_s (18000 in deepswe.yaml).
      default_episode_timeout_seconds: 18000
