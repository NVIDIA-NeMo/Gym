# DeepSWE with Codex in place of OpenCode: the same resources server, no-network agent sandbox and fresh verifier as
# opencode.yaml. The agent sandbox cannot download Codex's Node runtime, so the resources server copies a prebuilt
# one into it: build it on an x86_64 Linux host with network, then point DEEPSWE_CODEX_RUNTIME at it.
#
#   bash responses_api_agents/codex_agent/install_codex_runtime.sh /path/to/codex-runtime 0.144.4
#   export DEEPSWE_CODEX_RUNTIME=/path/to/codex-runtime
config_paths:
  - responses_api_agents/codex_agent/configs/codex_agent.yaml
  - resources_servers/deepswe/configs/deepswe.yaml
  - environment_servers/single_agent_turn_legacy/configs/single_agent_turn_legacy.yaml

deepswe_codex_resources_server:
  _inherit_from: deepswe_resources_server
  resources_servers:
    deepswe:
      allowed_agents: [codex_agent]
      sandbox_model_server:
        type: responses_api_models
        name: policy_model
      # Copied to /tmp/nemo-gym-deepswe/codex in every agent sandbox (sandbox_runtime_dir below).
      agent_runtime_paths:
        codex: ${oc.env:DEEPSWE_CODEX_RUNTIME,null}

deepswe_codex_agent:
  _inherit_from: codex_agent
  responses_api_agents:
    codex_agent:
      resources_server:
        type: resources_servers
        name: deepswe_codex_resources_server
      codex_version: 0.144.4
      sandbox_runtime_dir: /tmp/nemo-gym-deepswe/codex
      # An admitted episode already holds its agent sandbox, so let it run at once.
      concurrency: 1024
      # The three-hour DeepSWE agent budget, in place of the shipped 10 minutes.
      timeout: 10800
      # As benchmarks/gdpval/codex.yaml: the served context length, and compaction at 75% of it.
      model_context_window: 262144
      model_auto_compact_token_limit: 196608
      # Codex and its shell tools see the task image's environment (its PATH and toolchains), as in Harbor.
      inherit_sandbox_environment: true
      datasets:
        - name: deepswe_v1_1
          type: benchmark
          jsonl_fpath: benchmarks/deepswe/data/deepswe_benchmark.jsonl
          prepare_script: benchmarks/deepswe/prepare.py
          num_repeats: 10

deepswe_codex_environment_server:
  _inherit_from: single_agent_turn_legacy
  environment_servers:
    single_agent_turn_legacy:
      resources_server:
        type: resources_servers
        name: deepswe_codex_resources_server
      agent_server:
        type: responses_api_agents
        name: deepswe_codex_agent
      # Codex's run (10800) plus seed, runtime copy and verification, within the agent sandbox's ttl_s (18000).
      default_episode_timeout_seconds: 18000
      # Every agent sandbox first receives the harness runtime (a few hundred MB), at most two uploads at a time per
      # resources server, while its episode's deadline runs. An episode waits for admission before its deadline
      # starts, so admitting 128 at once keeps the last copy of a full burst within about 45 minutes at 40 s a copy.
      max_concurrent_episodes: 128
      # Longer than a whole run takes 128 at a time, even if every episode used its full 18,000 seconds.
      queue_timeout_seconds: 259200
