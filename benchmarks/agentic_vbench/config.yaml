agentic_vbench_agent:
  responses_api_agents:
    agentic_vbench_agent:
      entrypoint: app.py
      benchmark_root: ${oc.env:AGENTIC_VBENCH_ROOT}
      harbor_python: ${oc.env:AGENTIC_VBENCH_HARBOR_PYTHON}
      model_context_tokens: ${oc.env:AGENTIC_VBENCH_CONTEXT_TOKENS,262144}
      model_output_capability_tokens: ${oc.env:AGENTIC_VBENCH_OUTPUT_TOKENS,100000}
      output_root: ${oc.env:AGENTIC_VBENCH_OUTPUT_ROOT}
      runtime_root: ${oc.env:AGENTIC_VBENCH_RUNTIME_ROOT}
      model_base_url: ${oc.env:AGENTIC_VBENCH_MODEL_BASE_URL}
      model_id: ${oc.env:AGENTIC_VBENCH_MODEL_ID}
      credentials_file: ${oc.env:AGENTIC_VBENCH_CREDENTIALS_FILE,null}
      concurrency: 2
      datasets:
        - name: agentic_vbench
          type: benchmark
          jsonl_fpath: ${oc.env:AGENTIC_VBENCH_DATASET,benchmarks/agentic_vbench/data/agentic_vbench_benchmark.jsonl}
          prepare_script: benchmarks/agentic_vbench/prepare.py
          num_repeats: 1

agentic_vbench_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: agentic_vbench_agent
