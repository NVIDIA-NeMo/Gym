config_paths:
  - benchmarks/swe_atlas_qa/config.yaml

swe_atlas_qa_agent:
  responses_api_agents:
    harness_agent:
      agent: opencode
      agent_kwargs:
        # The Gym model server substitutes policy_model_name for any model id.
        model: policy
        workspace_root: /tmp/opencode-ws
        opencode_config:
          permission:
            external_directory:
              /logs/*: allow
              /tmp/*: allow
