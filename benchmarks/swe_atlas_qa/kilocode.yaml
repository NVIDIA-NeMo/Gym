# The harness bundle must also contain responses_api_agents/opencode_agent/, which kilocode imports.
config_paths:
  - benchmarks/swe_atlas_qa/config.yaml

swe_atlas_qa_agent:
  responses_api_agents:
    harness_agent:
      agent: kilocode
      agent_kwargs:
        command: kilo
        # The Gym model server substitutes policy_model_name for any model id.
        model: policy
        workspace_root: /tmp/kilo-ws
        # The 32768 default overflowed on most tasks.
        context_window: 200000
