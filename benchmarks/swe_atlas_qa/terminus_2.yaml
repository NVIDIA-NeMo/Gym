config_paths:
  - benchmarks/swe_atlas_qa/config.yaml

swe_atlas_qa_agent:
  responses_api_agents:
    harness_agent:
      agent: terminus_2
      agent_kwargs:
        # The Gym model server substitutes policy_model_name for any model id.
        model: policy
        max_turns: 500
      # Harbor runs tmux and script through a login shell, which resets PATH. Link the bundled copies.
      setup_commands:
        - test -e /usr/local/bin/tmux || ln -s /work/gym_mount/runtime/tmuxbin/tmux /usr/local/bin/tmux
        - command -v script >/dev/null || ln -s /work/gym_mount/runtime/tools/script /usr/local/bin/script
