config_paths:
  - benchmarks/swe_atlas_qa/config.yaml

swe_atlas_qa_agent:
  responses_api_agents:
    harness_agent:
      agent: openclaw
      agent_kwargs:
        command: openclaw
        # Required. Match the CLI in the harness bundle.
        openclaw_version: 2026.6.11
        # Bundle directory holding node and openclaw.
        node_bin_dir: /work/gym_mount/runtime/bin
        openclaw_config:
          agents:
            defaults:
              workspace: /app
