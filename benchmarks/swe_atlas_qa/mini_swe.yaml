# mini-SWE-agent through NeMo Fabric. The runner also needs LITELLM_LOCAL_MODEL_COST_MAP=True and
# MSWEA_COST_TRACKING=ignore_errors in SWE_ATLAS_HARNESS_PYTHON (see README).
config_paths:
  - benchmarks/swe_atlas_qa/config.yaml

swe_atlas_qa_agent:
  responses_api_agents:
    harness_agent:
      agent: mini_swe
      agent_kwargs:
        # LiteLLM routes by provider prefix. The Gym model server substitutes policy_model_name.
        model: openai/${policy_model_name}
        fabric_config:
          runtime:
            max_turns: 500
