# Model-neutral VisualWebArena task and browser profile. The default agent
# selects Nano Omni's policy protocol; another policy can override it while
# keeping the same screenshots, actions, sites, and evaluator.
config_paths:
  - resources_servers/webarena_browser/configs/webarena_browser.yaml
  - responses_api_agents/web_agent/configs/web_agent.yaml

cache_dir: cache
visualwebarena_source_root: ${oc.env:VISUALWEBARENA_SOURCE_ROOT,${cache_dir}/webarena_benchmarks/6a2977939b157b0ab9de7799bb089c721f1ac115}

prepare_script_args:
  source_root: ${visualwebarena_source_root}

visualwebarena_environment:
  _inherit_from: webarena_browser
  resources_servers:
    webarena_browser:
      allowed_benchmarks: [visualwebarena]
      artifact_dir: cache/visualwebarena-browser/artifacts
      task_image_root: ${visualwebarena_source_root}
      terminate_on_action_error: false

visualwebarena_benchmark_agent:
  _inherit_from: web_agent
  responses_api_agents:
    web_agent:
      resources_server:
        type: resources_servers
        name: visualwebarena_environment
      policy_protocol: nano_omni_toolcall
      max_steps: 100
      max_parse_retries: 2
      nano_omni_action_recovery: repair_single_closing_bracket
      nano_omni_tool_alias_recovery: webvoyager_v3
      nano_omni_max_computer_actions: 20
      nano_omni_parse_retry_feedback: true
      nano_omni_parse_retry_temperature: 0.2
      model_turn_max_retries: 19
      model_retry_delay_secs: 5.0
      max_image_history: 3
      visual_observation_text: none
      resources_request_timeout_secs: 1800
      model_request_timeout_secs: 1200
      run_timeout_secs: 14400
      task_image_root: ${visualwebarena_source_root}
      datasets:
        - name: visualwebarena
          type: benchmark
          jsonl_fpath: benchmarks/visualwebarena/data/visualwebarena.jsonl
          prompt_config: null
          prepare_script: benchmarks/visualwebarena/prepare.py
          num_repeats: 1
          license: Apache-2.0
