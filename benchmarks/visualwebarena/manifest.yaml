name: visualwebarena
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-agent-loop
domain: agent
description: VisualWebArena's maintained 908 visually grounded browser tasks on self-hosted sites, using WebAgent and the reference rules, semantic judge and image evaluator.
modality: multimodal
licensing: Apache-2.0
authors:
  - Jeff Peng
maintainers:
- JeffPengCoder
primary_metric: mean/reward
requirements:
  gpu: false
  network: allowlist
reward:
  range: [0.0, 1.0]
  higher_is_better: true
determinism: stochastic
resources_server: webarena_browser
agent_server: web_agent
model_server: policy_model
dataset_owner: visualwebarena_benchmark_agent
datasets:
  - name: visualwebarena
    type: benchmark
    jsonl_fpath: benchmarks/visualwebarena/data/visualwebarena.jsonl
    prepare_script: benchmarks/visualwebarena/prepare.py
    num_repeats: 1
canonical_split: test
prompt_source: agent
lifecycle: active
