# MM-BrowseComp on the BrowseComp harness: same tools, agent loop and context management, plus
# view_image and the upstream checklist judge. The judge is a hosted model, independent of the policy.
judge_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: https://inference-api.nvidia.com/v1
      model: nvidia/zai-org/glm-5.1
      api_key: ${oc.select:inference_api_key,null}
      return_token_id_information: false
      uses_reasoning_parser: true

mm_browsecomp_benchmark_resources_server:
  resources_servers:
    mm_browsecomp:
      allowed_agents: [browsecomp_agent]
      entrypoint: app.py
      domain: agent
      debug: false
      search_provider: exa
      max_results: 10
      exa_api_key: ${oc.select:exa_api_key,null}
      # Page images that browse lists for view_image.
      exa_browse_image_links: 20
      workspace: per_session
      use_judge: true
      judge_model_server:
        type: responses_api_models
        name: judge_model
      judge_responses_create_params:
        input: []
      verified: false

mm_browsecomp_benchmark_agent:
  responses_api_agents:
    browsecomp_agent:
      entrypoint: app.py
      max_steps: 400
      nudge_steps: true
      max_context_tokens: 196608
      context_reset_tokens: 50000
      context_reset_keep_rounds: 3
      max_run_retries: 1
      max_reset_count: null
      progress: true
      snap_dir: null
      # The post-call token count decides resets; /tokenize is not relied on for image prompts.
      save_model_call_using_vllm_tokenize_endpoint: false
      tool_images: true
      max_tool_images_in_context: 8
      resources_server:
        type: resources_servers
        name: mm_browsecomp_benchmark_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: mm_browsecomp
        type: benchmark
        jsonl_fpath: benchmarks/mm_browsecomp/data/mm_browsecomp_benchmark.jsonl
        prompt_config: null
        prepare_script: benchmarks/mm_browsecomp/prepare.py
        num_repeats: 1

mm_browsecomp_benchmark_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: mm_browsecomp_benchmark_agent
