name: preference_asr
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: asr
description: Transcription of 2,822 clips that follow a natural-language preference instruction (numbers, entities, disfluencies, casing), scored with a preference-aware word error rate.
modality: audio
licensing: CC-BY-NC-4.0
authors:
- NVIDIA NeMo Gym contributors
reward:
  range:
  - 0.0
  - 0.0
  higher_is_better: true
determinism: unknown
resources_server: audio_eval
agent_server: simple_agent
datasets:
- name: preference_asr
  type: benchmark
  jsonl_fpath: benchmarks/preference_asr/data/preference_asr_benchmark.jsonl
  prepare_script: benchmarks/preference_asr/prepare.py
  num_repeats: 1
model_server: policy_model
canonical_split: test
prompt_source: prepared
lifecycle: active
