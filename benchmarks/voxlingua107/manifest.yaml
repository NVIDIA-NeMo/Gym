name: voxlingua107
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: asr
description: Spoken language identification of VoxLingua107 development clips (33 languages by default, 24 for the reduced subset), scored by accuracy.
modality: audio
licensing: CC-BY-4.0
authors:
- NVIDIA NeMo Gym contributors
reward:
  range:
  - 0.0
  - 0.0
  higher_is_better: true
determinism: unknown
resources_server: audio_eval
agent_server: simple_agent
datasets:
- name: voxlingua107
  type: benchmark
  jsonl_fpath: benchmarks/voxlingua107/data/voxlingua107_benchmark.jsonl
  prepare_script: benchmarks/voxlingua107/prepare.py
  num_repeats: 1
model_server: policy_model
canonical_split: dev
prompt_source: prepared
lifecycle: active
