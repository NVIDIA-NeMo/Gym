name: agent_arena
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: agent
description: AgentArena, held-out turns from recorded agent-harness conversations
  in which the model plays the agent's next turn against simulated tools, scored by
  code gates and an LLM judge.
modality: text
licensing: internal
authors:
- NVIDIA NeMo Gym contributors
maintainers:
- jkyi-nvidia
intended_use:
- evaluation
capabilities:
- knowledge
- knowledge/factual_knowledge
- knowledge/expert_knowledge
- knowledge/procedural_knowledge
- writing_and_editing
- writing_and_editing/general_qa
- writing_and_editing/informational_writing
- reasoning
- retrieval_and_grounding
- retrieval_and_grounding/open_retrieval
domains:
- general
- finance
- history
- mathematics
- earth_environmental_science
primary_metric: turn_score
requirements:
  gpu: false
  network: allowlist
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: agentic_turn_simulation
agent_server: agentic_turn_simulation_agent
datasets:
- name: agent_arena
  type: benchmark
  jsonl_fpath: benchmarks/agent_arena/data/agent_arena_benchmark.jsonl
  prepare_script: benchmarks/agent_arena/prepare.py
  num_repeats: 4
model_server: policy_model
canonical_split: validation
prompt_source: prepared
lifecycle: active
