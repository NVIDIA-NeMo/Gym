config_paths:
- resources_servers/vials/configs/vials.yaml
- resources_servers/vials/configs/judge_model.yaml

vials_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: vials_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
vials_resources_server:
  resources_servers:
    vials:
      datasets:
      - name: vials
        type: benchmark
        jsonl_fpath: benchmarks/vials/data/vials.jsonl
        prepare_script: benchmarks/vials/prepare.py
        prompt_config: null
        num_repeats: 1
      - name: vials_example
        type: example
        jsonl_fpath: benchmarks/vials/data/example.jsonl
        num_repeats: 1
vials_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: vials_agent
