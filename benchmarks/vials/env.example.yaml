# Merge these values into the repository-root env.yaml; do not commit actual keys.
policy_base_url: https://your-vision-endpoint.example/v1
policy_api_key: REPLACE_WITH_POLICY_KEY
# Example serving alias for Nemotron VL 3.5; use your endpoint's exact model ID.
policy_model_name: nemotron-vl-3.5

# The judge is independent of the policy endpoint.
judge_base_url: https://api.openai.com/v1
judge_api_key: REPLACE_WITH_JUDGE_KEY
judge_model_name: gpt-5-mini
# For NVIDIA's inference endpoint, use its URL and exact served judge model ID
# (for example openai/openai/gpt-5-mini), rather than assuming the OpenAI model ID.
