name: vials
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: other
description: Direct visual question answering on VIALS scientific images with upstream LLM judging.
modality: multimodal
licensing: CC-BY-4.0
authors:
- The VIALS Authors
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: vials
agent_server: simple_agent
datasets:
- name: vials
  type: benchmark
  jsonl_fpath: benchmarks/vials/data/vials.jsonl
  prepare_script: benchmarks/vials/prepare.py
  num_repeats: 1
- name: vials_example
  type: example
  jsonl_fpath: benchmarks/vials/data/example.jsonl
  num_repeats: 1
model_server: policy_model
canonical_split: test
prompt_source: prepared
lifecycle: active
