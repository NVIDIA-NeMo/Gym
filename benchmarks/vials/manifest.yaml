name: vials
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: external-agent-loop
domain: other
description: Direct visual question answering on VIALS scientific images with upstream LLM judging.
modality: multimodal
licensing: CC-BY-4.0
authors:
- The VIALS Authors
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: null
agent_server: harbor_agent_general
datasets:
- name: vials
  type: benchmark
  jsonl_fpath: benchmarks/vials/data/harbor/gym.jsonl
  prepare_script: benchmarks/vials/prepare.py
  num_repeats: 1
- name: vials_example
  type: example
  jsonl_fpath: benchmarks/vials/data/harbor_example.jsonl
  num_repeats: 1
canonical_split: test
prompt_source: agent
lifecycle: active
