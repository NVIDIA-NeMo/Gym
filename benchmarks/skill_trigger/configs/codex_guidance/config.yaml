config_paths:
- benchmarks/skill_trigger/common.yaml
skill_trigger_settings:
  harness: codex_guidance
harbor_agent_general:
  responses_api_agents:
    harbor_agent_general:
      datasets:
      - name: skill_trigger
        type: benchmark
        jsonl_fpath: ${skill_trigger_settings.tasks}/gym.jsonl
        prepare_script: benchmarks/skill_trigger/package.py
        num_repeats: 1
      job:
        agents:
        - model_name: ${policy_model_name}
          kwargs:
            version: 0.156.1
            web_search: disabled
            model_catalog_path: ${skill_trigger_settings.model_catalog_path}
            model_catalog_sha256: ${skill_trigger_settings.model_catalog_sha256}
            config:
              model_catalog_json: /tmp/skill-trigger-models.json
              model_provider: benchmark
              model_providers:
                benchmark:
                  name: Benchmark endpoint
                  wire_api: responses
                  env_key: OPENAI_API_KEY
                  supports_websockets: false
          import_path: benchmarks.skill_trigger.profiles:CodexGuidance
