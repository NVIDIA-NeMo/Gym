# Chain to existing resource server + agent config
config_paths:
  - resources_servers/math_with_judge/configs/math_with_judge.yaml
  - benchmarks/judge_luna.yaml

# Symbolic-first grading with Luna fallback and positive swapped-order confirmation.
arxivmath_0526_math_with_judge_resources_server:
  _inherit_from: math_with_judge
  resources_servers:
    math_with_judge:
      should_use_judge: true
      judge_model_server:
        type: responses_api_models
        name: judge_model

arxivmath_0526_math_with_judge_simple_agent:
  _inherit_from: math_with_judge_simple_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        name: arxivmath_0526_math_with_judge_resources_server
      datasets:
      - name: arxivmath_0526
        type: benchmark
        jsonl_fpath: benchmarks/arxivmath_0526/data/arxivmath_0526_withsys.jsonl
        prompt_config: benchmarks/arxivmath_0526/prompts/with_system.yaml
        prepare_script: benchmarks/arxivmath_0526/prepare.py
