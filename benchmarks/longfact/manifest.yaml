name: longfact
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: knowledge
description: Long-form factuality over the complete LongFact Objects and Concepts prompts, scored with SAFE-style F1@100 and claim-level diagnostics.
modality: text
licensing: CC-BY-4.0
authors:
  - NVIDIA NeMo Gym contributors
reward:
  range: [0.0, 1.0]
  higher_is_better: true
determinism: stochastic
dataset_owner: longfact_longfact_simple_agent
resources_server: longfact
agent_server: simple_agent
model_server: policy_model
datasets:
  - name: longfact
    type: benchmark
    jsonl_fpath: benchmarks/longfact/data/longfact_benchmark.jsonl
    prepare_script: benchmarks/longfact/prepare.py
    num_repeats: 1
session_model: episode
state: none
canonical_split: full-objects-and-concepts
prompt_source: prepared
lifecycle: active
