config_paths:
  - resources_servers/longfact/configs/longfact.yaml
  - benchmarks/longfact/evaluator_local_vllm.yaml

# A judge or search failure fails one rollout (see the server README). Record it in the
# failures sidecar and keep collecting; resume retries it.
route_failures_to_sidecar: true

longfact_longfact_resources_server:
  _inherit_from: longfact

longfact_longfact_gymnasium_agent:
  _inherit_from: longfact_gymnasium_agent
  responses_api_agents:
    gymnasium_agent:
      resources_server:
        name: longfact_longfact_resources_server
      datasets:
        - name: longfact
          type: benchmark
          jsonl_fpath: benchmarks/longfact/data/longfact_benchmark.jsonl
          prompt_config: null
          prepare_script: benchmarks/longfact/prepare.py

longfact_longfact_environment_server:
  _inherit_from: longfact_environment_server
  environment_servers:
    legacy_agent:
      agent_server:
        name: longfact_longfact_gymnasium_agent
