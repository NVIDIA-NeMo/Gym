name: officeqa_pro
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-agent-loop
domain: agent
description: OfficeQA Pro document retrieval and reasoning over U.S. Treasury Bulletins.
modality: multimodal
# Code license; the separately downloaded dataset is CC-BY-SA-4.0.
licensing: Apache-2.0
authors: [Jarno Seppänen]
maintainers:
- jseppanen
capabilities:
- retrieval_and_grounding
- retrieval_and_grounding/long_context_learning
- retrieval_and_grounding/multi_source_synthesis
- retrieval_and_grounding/evidence_synthesis
- reasoning
- reasoning/quantitative_reasoning
- multimodal_input_understanding
- multimodal_input_understanding/structured_visual_artifact_understanding
- tool_and_computer_use
- tool_and_computer_use/multi_step_tool_use
- tool_and_computer_use/terminal_and_cli_use
domains:
- finance
- economics
- politics_government
