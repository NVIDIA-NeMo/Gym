name: polymath
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: math
description: PolyMath multilingual math benchmark with weighted (difficulty) and per-language
  metrics
modality: text
licensing: unknown
authors:
- gwarmstrong
maintainers:
- gwarmstrong
intended_use:
- evaluation
capabilities:
- reasoning
- reasoning/quantitative_reasoning
- reasoning/deductive_reasoning
- planning_and_autonomy
- planning_and_autonomy/strategy_and_search
- knowledge
- knowledge/procedural_knowledge
- multilingual_and_multicultural
- multilingual_and_multicultural/language_consistency
domains:
- mathematics
- language_linguistics
primary_metric: pass@1[avg-of-1]/symbolic_accuracy_weighted
requirements:
  gpu: false
  network: no-network
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: polymath
agent_server: simple_agent
datasets:
- name: polymath
  type: benchmark
  jsonl_fpath: benchmarks/polymath/data/polymath_benchmark.jsonl
  prepare_script: benchmarks/polymath/prepare.py
  prompt_config: benchmarks/prompts/generic/default.yaml
  num_repeats: 1
model_server: policy_model
canonical_split: low+medium+high+top
standard_prompt_config: benchmarks/prompts/generic/default.yaml
lifecycle: active
