# EnterpriseOps-Gym, plus_10_tools split: the oracle tool set plus distractor tools.
# Registered as `--benchmark enterpriseops/plus_10_tools` (name derives from this file's path).
config_paths:
  - resources_servers/enterpriseops_gym/configs/enterpriseops_gym.yaml

enterpriseops_benchmark_resources_server:
  _inherit_from: enterpriseops_gym

enterpriseops_plus_10_tools_simple_agent:
  _inherit_from: enterpriseops_gym_simple_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        name: enterpriseops_benchmark_resources_server
      datasets:
      - name: enterpriseops_plus_10_tools
        type: benchmark
        jsonl_fpath: benchmarks/enterpriseops/data/enterpriseops_plus_10_tools_benchmark.jsonl
        prepare_script: benchmarks/enterpriseops/prepare_plus_10_tools.py
        # Rows are fully materialized by the converter (system+user input, tools baked in),
        # so no prompt templating applies.
        prompt_config: null
        # EOG leaderboard reports single-run task success; raise for mean@k.
        num_repeats: 1
