config_paths:
- resources_servers/workspace_bench/configs/workspace_bench.yaml
- nemo_gym/sandbox/providers/opensandbox/configs/opensandbox.yaml

workspace_bench_pi_agent:
  responses_api_agents:
    harness_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: workspace_bench_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      agent: pi
      agent_kwargs:
        model: ${policy_model_name}
        workspace_root: /tmp/pi-agent
        thinking: high
        timeout: 7200
        pi_version: 0.80.2
        context_window: 262144
        max_output_tokens: 65536
        models_config: {}
        system_prompt: Complete the task using its specified input paths. Save every requested deliverable in /workspace/output.
      sandbox_provider: sandbox
      rollout_timeout: 7800
      concurrency: 32
      datasets:
        - name: workspace_bench_lite
          type: benchmark
          jsonl_fpath: benchmarks/workspace_bench/data/workspace_bench_lite.jsonl
          prepare_script: benchmarks/workspace_bench/prepare.py
          num_repeats: 1
