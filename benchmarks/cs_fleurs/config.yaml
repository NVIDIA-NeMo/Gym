config_paths:
- resources_servers/audio_eval/configs/audio_eval.yaml

cs_fleurs_resources_server:
  _inherit_from: audio_eval
  resources_servers:
    audio_eval:
      profile_contracts: benchmarks/cs_fleurs/profiles.json

cs_fleurs_simple_agent:
  _inherit_from: audio_eval_simple_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        name: cs_fleurs_resources_server
      datasets:
      - name: cs_fleurs
        type: benchmark
        jsonl_fpath: benchmarks/cs_fleurs/data/cs_fleurs_benchmark.jsonl
        prepare_script: benchmarks/cs_fleurs/prepare.py
        license: Creative Commons Attribution Non-Commercial 4.0 International

cs_fleurs_environment_server:
  _inherit_from: audio_eval_environment_server
  environment_servers:
    single_agent_turn_legacy:
      agent_server:
        name: cs_fleurs_simple_agent
      resources_server:
        type: resources_servers
        name: cs_fleurs_resources_server
