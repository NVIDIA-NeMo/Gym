# Chain to the existing resources server + agent config.
config_paths:
  - resources_servers/leancat/configs/leancat.yaml

# `_inherit_from` keeps this benchmark config isolated from the generic one above.
leancat_leancat_resources_server:
  _inherit_from: leancat
  resources_servers:
    leancat:
      # Off for reproduction: upstream's verify_lean is has_invalid_tokens + compile, with no
      # statement check. Ours rejected 236 of 1799 rollouts (15%) whose theorem signature was
      # byte-identical and whose imports were present -- upstream compiles all of those, so
      # leaving it on guarantees a number below the paper's for a reason that is not the model.
      # `statement_preserved` is still reported as a second score, so the cost stays visible.
      # The environment default in resources_servers/leancat stays true: it is the better
      # verifier, just not the one the published numbers were produced with.
      require_statement_preserved: false

leancat_leancat_simple_agent:
  _inherit_from: leancat_simple_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        name: leancat_leancat_resources_server
      datasets:
      - name: leancat
        type: benchmark
        jsonl_fpath: benchmarks/leancat/data/leancat_benchmark.jsonl
        prepare_script: benchmarks/leancat/prepare.py
        license: CC-BY-4.0
        # Paper v2: k=4 for generalist models, k=32 for the specialized provers of Table 3.
        # Goedel-Prover-V2-32B is in Table 3, so 32 is the comparable budget.
        # NOTE: this is applied at preprocessing. Passing --num-repeats as well multiplies
        # on top of it (4 x 32 = 128 samples/problem), so the runner must not pass it.
        num_repeats: 32
