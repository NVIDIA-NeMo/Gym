# Chain to the existing resources server + agent config.
config_paths:
  - resources_servers/leancat/configs/leancat.yaml

# `_inherit_from` keeps this benchmark config isolated from the generic one above.
leancat_leancat_resources_server:
  _inherit_from: leancat
  resources_servers:
    leancat:
      # Off, because this benchmark reproduces the paper's numbers and upstream's scorer
      # (scripts/eval_common.py::verify_lean) is banned tokens plus the `lake env lean` exit
      # code -- it never compares against the reference statement. Upstream's EVALUATION.md
      # does require the statement to be unchanged, so its document and its code disagree;
      # this follows the code that produced the published numbers. `statement_preserved` is
      # reported on every response either way, so the documented criterion can be applied
      # afterwards without rerunning.
      require_statement_preserved: false

leancat_leancat_simple_agent:
  _inherit_from: leancat_simple_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        name: leancat_leancat_resources_server
      datasets:
      - name: leancat
        type: benchmark
        jsonl_fpath: benchmarks/leancat/data/leancat_benchmark.jsonl
        prepare_script: benchmarks/leancat/prepare.py
        license: Creative Commons Attribution 4.0 International
        # The paper's Appendix D.1 prompt.
        prompt_config: benchmarks/prompts/eval/leancat/paper.yaml
        # Paper v2: k=4, the generalist-model budget of Table 1 and one of upstream's
        # `recommended_k_values`. Table 3's specialized provers use k=32 -- override with
        # --num-repeats. Applied at preprocessing; --num-repeats multiplies on top of it.
        num_repeats: 4

leancat_leancat_environment_server:
  _inherit_from: leancat_environment_server
  environment_servers:
    legacy_agent:
      agent_server:
        name: leancat_leancat_simple_agent
