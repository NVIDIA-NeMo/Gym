# BabyVision with only the question as the user message, under OpenCode in a sandbox session. Otherwise identical to
# benchmarks/babyvision_opencode/sandbox_sessions.yaml. Data: $LMUData/BabyVision.tsv (or $BABYVISION_TSV).
config_paths:
  - resources_servers/visual_coding_opencode/configs/sandbox_sessions.yaml

visual_coding_opencode_session_agent:
  responses_api_agents:
    opencode_agent:
      datasets:
      - name: babyvision_opencode_question_only
        type: benchmark
        jsonl_fpath: benchmarks/babyvision_opencode_question_only/data/babyvision_opencode_question_only_benchmark.jsonl
        prepare_script: benchmarks/babyvision_opencode_question_only/prepare.py
        num_repeats: 1
