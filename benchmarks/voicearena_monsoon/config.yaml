config_paths:
- resources_servers/audio_eval/configs/audio_eval.yaml

voicearena_monsoon_resources_server:
  _inherit_from: audio_eval
  resources_servers:
    audio_eval:
      profile_contracts: benchmarks/voicearena_monsoon/profiles.json

voicearena_monsoon_simple_agent:
  _inherit_from: audio_eval_simple_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        name: voicearena_monsoon_resources_server
      datasets:
      - name: voicearena_monsoon
        type: benchmark
        jsonl_fpath: benchmarks/voicearena_monsoon/data/voicearena_monsoon_benchmark.jsonl
        prepare_script: benchmarks/voicearena_monsoon/prepare.py
        prepare_dependencies:
        - soundfile
        license: Creative Commons Attribution 4.0 International

voicearena_monsoon_environment_server:
  _inherit_from: audio_eval_environment_server
  environment_servers:
    single_agent_turn_legacy:
      agent_server:
        name: voicearena_monsoon_simple_agent
      resources_server:
        type: resources_servers
        name: voicearena_monsoon_resources_server
