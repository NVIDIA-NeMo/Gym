name: voicearena_monsoon
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: asr
description: Transcription of conversational Indian English (2,102 clips) and Hindi (753 clips) from the public VoiceArena Monsoon test splits, scored by corpus word error rate (Hindi with lattice-aware OIWER).
modality: audio
licensing: CC-BY-4.0
authors:
- NVIDIA NeMo Gym contributors
reward:
  range:
  - 0.0
  - 0.0
  higher_is_better: true
determinism: unknown
resources_server: audio_eval
agent_server: simple_agent
datasets:
- name: voicearena_monsoon
  type: benchmark
  jsonl_fpath: benchmarks/voicearena_monsoon/data/voicearena_monsoon_benchmark.jsonl
  prepare_script: benchmarks/voicearena_monsoon/prepare.py
  num_repeats: 1
model_server: policy_model
canonical_split: test
prompt_source: prepared
lifecycle: active
