name: solexecbench
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: coding
description: The complete pinned 235-task SOL-ExecBench corpus with native GPU correctness and timing.
modality: text
licensing: LicenseRef-NVIDIA-Evaluation
authors:
  - NVIDIA NeMo Gym contributors
reward:
  range: [0.0, 1.0]
  higher_is_better: true
determinism: unknown
resources_server: sol_execbench
agent_server: simple_agent
model_server: policy_model
datasets:
  - name: solexecbench
    type: benchmark
    jsonl_fpath: benchmarks/solexecbench/data/solexecbench_cuda_cpp.jsonl
    prepare_script: benchmarks/solexecbench/prepare.py
    num_repeats: 1
  - name: solexecbench_example
    type: example
    jsonl_fpath: benchmarks/solexecbench/data/example_cuda_cpp.jsonl
canonical_split: benchmark
prompt_source: prepared
lifecycle: active
