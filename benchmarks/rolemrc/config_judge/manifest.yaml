name: rolemrc/config_judge
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: rlhf
description: RoleMRC judge subset scored by the mean of applicable binary aspect verdicts
  from an LLM judge.
modality: text
licensing: CC-BY-4.0
authors:
- Maria Bagdasarova
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
config_path: ../config_judge.yaml
resources_server: rolemrc
agent_server: simple_agent
datasets:
- name: rolemrc_judge
  type: benchmark
  jsonl_fpath: benchmarks/rolemrc/data/rolemrc_judge_benchmark.jsonl
  prepare_script: benchmarks/rolemrc/prepare_judge.py
  num_repeats: 1
model_server: policy_model
canonical_split: benchmark
prompt_source: prepared
lifecycle: active
