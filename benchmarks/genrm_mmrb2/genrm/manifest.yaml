name: genrm_mmrb2/genrm
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: rlhf
description: Multimodal RewardBench 2 reasoning pairs whose answers are text-only,
  judged in both orders by a GenRM checkpoint through its own chat template and scored
  by accuracy against the human preference.
modality: text, image
licensing: CC-BY-NC-4.0
authors:
- Julien Veron Vialard
maintainers:
- jveronvialard
intended_use:
- evaluation
capabilities:
- evaluation_and_judging
- evaluation_and_judging/preference_judging
- evaluation_and_judging/error_analysis
- multimodal_input_understanding
- multimodal_input_understanding/scene_understanding
- multimodal_input_understanding/cross_modal_understanding
- reasoning
- reasoning/deductive_reasoning
domains:
- artificial_intelligence
primary_metric: overall/accuracy
requirements:
  gpu: false
  network: no-network
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
config_path: ../genrm.yaml
resources_server: genrm_eval
agent_server: simple_agent
datasets:
- name: genrm_mmrb2_reasoning_text_only
  type: benchmark
  jsonl_fpath: benchmarks/genrm_mmrb2/data/genrm_mmrb2_reasoning_text_only_genrm_validation.jsonl
  prepare_script: benchmarks/genrm_mmrb2/prepare.py
  num_repeats: 1
model_server: policy_model
canonical_split: test
prompt_source: prepared
adopted_from:
  source: https://huggingface.co/datasets/rl-research/multimodal-rewardbench-2
  ref: 78392e6ab989bfc75d3ee19e3e8ca5c1cbe4e323  # pragma: allowlist secret
  reconciled: '2026-10-23'
lifecycle: active
