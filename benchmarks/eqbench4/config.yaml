# EQ-Bench 4: the policy roleplays with a simulated persona for up to eight turns per side, and judges compare its
# transcripts with published leaderboard transcripts. The policy model is chosen on the command line; see README.md.
config_paths:
  - resources_servers/eqbench4/configs/eqbench4.yaml
  - resources_servers/eqbench4/configs/eqbench4_models.yaml

environment_server_routes:
  eqbench4:benchmark: eqbench4_benchmark_environment_server

eqbench4_benchmark_resources_server:
  _inherit_from: eqbench4_resources_server
  resources_servers:
    eqbench4:
      datasets:
      - name: eqbench4
        type: benchmark
        jsonl_fpath: benchmarks/eqbench4/data/eqbench4_benchmark.jsonl
        prompt_config: null
        prepare_script: benchmarks/eqbench4/prepare.py
        taskset: eqbench4:benchmark
        num_repeats: 1
        # Upstream: BSD-3-Clause with the Commons Clause condition, which the license list cannot name.
        license: TBD

eqbench4_benchmark_environment_server:
  _inherit_from: eqbench4_environment_server
  environment_servers:
    eqbench4:
      resources_server:
        type: resources_servers
        name: eqbench4_benchmark_resources_server

# Persona and judge outages never become a score. A persona simulator that stays down (past
# eqbench4_connection_retry_timeout_s, see eqbench4_models.yaml) fails the episode as a retryable environment failure,
# which a resume runs again; a judge outage masks the row as judge_failed, which a re-judge grades from the saved
# conversation. Routing failures to the sidecar also keeps an environment server /run that fails outright, instead of
# returning its failure, as a failure row rather than ending the run. Above these shares of expected rollouts the run's
# health check reports it unhealthy.
route_failures_to_sidecar: true
health_check_max_not_final_failure_fraction: 0.02
health_check_max_final_failure_fraction: 0.02
