name: agentvista
version: 5.0.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: other
description: AgentVista visual search and Python tasks, using the pinned original tools and answer judge with separate original-loop and OpenCode evaluation protocols.
modality: multimodal
licensing: CC-BY-4.0
authors:
- NVIDIA
maintainers:
- bpritam14
intended_use:
- evaluation
primary_metric: agentvista/mean_score
requirements:
  gpu: false
  network: public
reward:
  range: [0.0, 1.0]
  higher_is_better: true
determinism: stochastic
resources_server: agentvista
agent_server: agentvista_agent
model_server: policy_model
datasets:
- name: agentvista
  type: benchmark
  jsonl_fpath: benchmarks/agentvista/data/agentvista_benchmark.jsonl
  prepare_script: benchmarks/agentvista/prepare.py
  num_repeats: 1
canonical_split: train
prompt_source: agent
adopted_from:
  source: https://github.com/hkust-nlp/AgentVista
  ref: a3385d51d0c3dd0c8501350a08d52065e3e94ab4  # pragma: allowlist secret
  reconciled: '2026-11-16'
lifecycle: active
