# Chain to the existing resources server + agent config.
config_paths:
  - resources_servers/verisoftbench/configs/verisoftbench.yaml

verisoftbench_benchmark_agent:
  _inherit_from: verisoftbench_agent
  responses_api_agents:
    verisoftbench_agent:
      datasets:
      - name: verisoftbench
        type: benchmark
        jsonl_fpath: benchmarks/verisoftbench/data/verisoftbench_benchmark.jsonl
        prepare_script: benchmarks/verisoftbench/prepare.py
        # Pass-through: benchmark rows carry upstream's system and user turns as top-level
        # fields and no pre-populated input (Gym rejects populated input plus a prompt
        # config); this config renders exactly the server split's explicit turns.
        prompt_config: benchmarks/verisoftbench/prompt.yaml
        # Upstream's estimand is "solved if any of 8 candidates or their repairs verify",
        # which needs eight draws per task. A single draw reports a different quantity
        # from the published figures.
        num_repeats: 8
        # Harness and dataset are MIT (utopia-group/VeriSoftBench LICENSE; HF dataset card).
        # The 23 source Lean repositories keep their own licences; see the server README.
        license: MIT
