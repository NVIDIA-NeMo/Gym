# Chartography under OpenCode: each task runs in its own sandbox session with a Python image toolkit and OpenCode's
# own tools, 1800 s per task and no turn cap, graded by the benchmark's own judge over the final answer.
# The environment is resources_servers/chartography/configs/chartography_opencode.yaml; this file adds the data.
# The judge config is chained separately so a user who wants a different judge endpoint can drop
# judge_model_openai.yaml and supply their own.
config_paths:
  - resources_servers/chartography/configs/chartography_opencode.yaml
  - resources_servers/chartography/configs/judge_model_openai.yaml

chartography_opencode_agent:
  responses_api_agents:
    opencode_agent:
      datasets:
      # num_repeats: 10 matches the published protocol (the all-pass rate over ten runs per task).
      - name: chartography_opencode
        type: benchmark
        jsonl_fpath: benchmarks/chartography_opencode/data/chartography_opencode_benchmark.jsonl
        prompt_config: null
        prepare_script: benchmarks/chartography_opencode/prepare.py
        num_repeats: 10
        license: Creative Commons Attribution 4.0 International

# The lent sandbox may reach every port of the policy model's host, so the judge (it spends the judge's key for any
# caller) stays on loopback.
judge_model:
  responses_api_models:
    openai_model:
      host: 127.0.0.1
