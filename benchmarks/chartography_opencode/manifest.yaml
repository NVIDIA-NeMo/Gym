primary_metric: pass@1[avg-of-10]/all_pass
requirements:
  gpu: false
  network: allowlist
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: stochastic
resources_server: chartography
agent_server: opencode_agent
datasets:
- name: chartography_opencode
  type: benchmark
  jsonl_fpath: benchmarks/chartography_opencode/data/chartography_opencode_benchmark.jsonl
  prepare_script: benchmarks/chartography_opencode/prepare.py
  num_repeats: 10
model_server: policy_model
canonical_split: test
prompt_source: prepared
adopted_from:
  source: https://github.com/surge-ai/chartography
  ref: 3f1bf837232d3918c2cc35c6e2418c9e70d2a57b  # pragma: allowlist secret
