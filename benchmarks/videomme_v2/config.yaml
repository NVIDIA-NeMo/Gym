# Single-turn Video-MME v2 (3,200 questions over 800 videos, w/o subtitles): one policy call per question with the
# video as a file:// input_video URL (frame sampling is chosen on the serving side, e.g. vLLM's
# --allowed-local-media-path and --media-io-kwargs). The rows ask in the benchmark's letter wording, so a judge model
# reads the chosen option (llm_extraction_v1) and the official group rating scores it.
# Data: prepare.py downloads the authors' annotation (test.parquet of MME-Benchmarks/Video-MME-v2 at a pinned revision)
# and binds each question to its video in videomme_v2_source_dir by the SHA-256 in that directory's FILES.sha256; rows
# point at videomme_v2_video_url_dir (where the model server reads video/).
config_paths:
  - resources_servers/videomme_v2/configs/videomme_v2_single_turn_llm_extraction.yaml

videomme_v2_source_dir: null
videomme_v2_video_url_dir: null
videomme_v2_cohort_manifest: benchmarks/videomme_v2/data/videomme_v2_cohort.json
prepare_script_args:
  source_dir: ${videomme_v2_source_dir}
  video_url_dir: ${videomme_v2_video_url_dir}

# The judge: gpt-6.1-sol at max reasoning effort; override the endpoint, key and model together.
judge_base_url: ${oc.env:JUDGE_BASE_URL,https://inference-api.nvidia.com/v1}
judge_api_key: ${oc.env:JUDGE_API_KEY,${oc.env:INFERENCE_API_KEY,dummy}}
judge_model_name: ${oc.env:JUDGE_MODEL,openai/openai/gpt-6.1-sol}
videomme_v2:
  resources_servers:
    videomme_v2:
      judge_chat_completion_create_params:
        messages: []
        reasoning_effort: max

videomme_v2_single_turn:
  responses_api_agents:
    simple_agent:
      datasets:
      - name: videomme_v2
        type: benchmark
        jsonl_fpath: benchmarks/videomme_v2/data/videomme_v2_benchmark.jsonl
        prepare_script: benchmarks/videomme_v2/prepare.py
        num_repeats: 1
