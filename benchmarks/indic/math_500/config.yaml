config_paths:
  - resources_servers/math_with_judge/configs/math_with_judge.yaml

indic_math_500_math_with_judge_resources_server:
  _inherit_from: math_with_judge
  resources_servers:
    math_with_judge:
      should_use_judge: false
      # Preserve the 500-question denominator while accepting explicit final-answer formats beyond \boxed{}.
      format_tolerant_answer_extraction: true

indic_math_500_math_with_judge_simple_agent:
  _inherit_from: math_with_judge_simple_agent
  responses_api_agents:
    simple_agent:
      resources_server:
        name: indic_math_500_math_with_judge_resources_server
      datasets:
        - name: indic_math_500
          type: benchmark
          jsonl_fpath: benchmarks/indic/math_500/data/math_500_benchmark.jsonl
          prompt_config: benchmarks/prompts/generic/math.yaml
          prepare_script: benchmarks/indic/math_500/prepare.py
          num_repeats: 1
          license: Apache-2.0
