name: in22
version: 1.0.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: other
description: IN22-Gen bidirectional English-Indic translation with reference chrF, chrF++, and BLEU metrics.
modality: text
licensing: CC-BY-4.0
authors: [NVIDIA NeMo Gym contributors]
reward:
  range: [0, 1]
  higher_is_better: true
determinism: seeded
resources_server: wmt_translation
agent_server: simple_agent
model_server: policy_model
datasets:
  - name: in22_gen
    type: benchmark
    jsonl_fpath: benchmarks/indic/in22/data/in22_gen_benchmark.jsonl
    prepare_script: benchmarks/indic/in22/prepare.py
    prompt_config: benchmarks/indic/in22/prompts/default.yaml
    num_repeats: 1
standard_prompt_config: benchmarks/indic/in22/prompts/default.yaml
canonical_split: test
session_model: episode
state: none
lifecycle: active
