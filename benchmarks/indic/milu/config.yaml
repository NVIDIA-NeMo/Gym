config_paths:
  - responses_api_models/vllm_loglikelihood/configs/vllm_loglikelihood.yaml

milu_mcqa_resources_server:
  resources_servers:
    mcqa:
      entrypoint: app.py
      domain: knowledge
      verified: false
      description: MILU answer-letter likelihood accuracy.
      grading_mode: strict_single_letter_boxed

milu_multiple_choice_agent:
  responses_api_agents:
    multiple_choice:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: milu_mcqa_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
        - name: milu
          type: benchmark
          jsonl_fpath: benchmarks/indic/milu/data/milu_benchmark.jsonl
          prepare_script: benchmarks/indic/milu/prepare.py
          prompt_config: benchmarks/indic/milu/prompts/default.yaml
          num_repeats: 1
          license: CC-BY-4.0
