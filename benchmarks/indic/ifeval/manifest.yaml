name: indic/ifeval
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: instruction_following
description: IndicIFEval-Trans with upstream language-specific strict and loose instruction checks.
modality: text
licensing: Apache-2.0 AND MIT AND CC-BY-4.0
authors: [NVIDIA NeMo Gym contributors]
reward:
  range: [0, 1]
  higher_is_better: true
determinism: stochastic
resources_server: instruction_following
agent_server: simple_agent
model_server: policy_model
datasets:
  - name: indic_ifeval_trans
    type: benchmark
    jsonl_fpath: benchmarks/indic/ifeval/data/ifeval_benchmark.jsonl
    prepare_script: benchmarks/indic/ifeval/prepare.py
    num_repeats: 1
  - name: example
    type: example
    jsonl_fpath: benchmarks/indic/ifeval/data/example.jsonl
    num_repeats: 1
canonical_split: benchmark
prompt_source: prepared
session_model: episode
state: none
lifecycle: active
