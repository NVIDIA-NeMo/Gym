name: indic/arc_challenge
version: 1.0.0
experimental: true
kind: benchmark
integration_profile: custom-gym-agent-loop
domain: knowledge
description: Indic ARC-Challenge with five-shot answer-letter likelihood scoring.
modality: text
licensing: CC-BY-SA-4.0
authors:
  - NVIDIA NeMo Gym contributors
reward:
  range:
    - 0.0
    - 1.0
  higher_is_better: true
determinism: seeded
resources_server: mcqa
agent_server: multiple_choice
model_server: policy_model
datasets:
  - name: indic_arc_challenge
    type: benchmark
    jsonl_fpath: benchmarks/indic/arc_challenge/data/arc_challenge_benchmark.jsonl
    prepare_script: benchmarks/indic/arc_challenge/prepare.py
    prompt_config: benchmarks/indic/arc_challenge/prompts/default.yaml
    num_repeats: 1
grading_mode: strict_single_letter_boxed
standard_prompt_config: benchmarks/indic/arc_challenge/prompts/default.yaml
canonical_split: test
session_model: episode
state: none
lifecycle: active
