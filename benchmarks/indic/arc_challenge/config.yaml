config_paths:
  - responses_api_models/vllm_model/configs/vllm_model_completions.yaml

indic_arc_challenge_mcqa_resources_server:
  resources_servers:
    mcqa:
      entrypoint: app.py
      domain: knowledge
      verified: false
      description: Indic ARC-Challenge answer-letter likelihood accuracy.
      grading_mode: strict_single_letter_boxed

indic_arc_challenge_multiple_choice_agent:
  responses_api_agents:
    multiple_choice:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: indic_arc_challenge_mcqa_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
        - name: indic_arc_challenge
          type: benchmark
          jsonl_fpath: benchmarks/indic/arc_challenge/data/arc_challenge_benchmark.jsonl
          prepare_script: benchmarks/indic/arc_challenge/prepare.py
          prompt_config: benchmarks/indic/arc_challenge/prompts/default.yaml
          num_repeats: 1
          license: CC-BY-SA-4.0
