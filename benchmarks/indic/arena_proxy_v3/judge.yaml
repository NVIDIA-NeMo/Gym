# This config can serve only the judge model and resources server on a CPU node.
judge_api_key: MISSING  # pragma: allowlist secret
judge_base_url: https://inference-api.nvidia.com/v1
judge_model_name: gcp/google/gemini-3.8-flash
input_jsonl: benchmarks/indic/arena_proxy_v3/data/arena_proxy_v3_benchmark.jsonl

indic_arena_proxy_v3_judge_model:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: ${judge_base_url}
      openai_api_key: ${judge_api_key}
      openai_model: ${judge_model_name}

indic_arena_proxy_v3_resources_server:
  resources_servers:
    arena_judge:
      entrypoint: app.py
      domain: other
      verified: false
      description: Indic Arena Proxy v3 conversation completion with side-swapped pairwise judging
      value: Compare the next assistant turn against frozen GPT-5.4-mini answers
      judge_model_server:
        type: responses_api_models
        name: indic_arena_proxy_v3_judge_model
      judge_chat_completions_create_params:
        messages: []
        max_tokens: 32768
        temperature: 0.0
        reasoning_effort: low
      judge_prompt_paths:
        hard_prompt: benchmarks/indic/arena_proxy_v3/prompts/arena.yaml
        creative_writing: benchmarks/indic/arena_proxy_v3/prompts/arena_creative.yaml
      default_category: hard_prompt
      arena_elo_bootstrap_rounds: 100
      arena_elo_bootstrap_seed: 42
      indic_metrics_input_fpath: ${input_jsonl}
      sanitize_generations: true
      strip_thinking: true
