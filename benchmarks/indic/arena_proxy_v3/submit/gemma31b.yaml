defaults:
  - generate
  - _self_

# Match the Gemma smoke's context, sampling and parsers; no expert parallelism.
_generation:
  context: 131072
  top_k: 64
services:
  policy:
    tensor_parallel_size: 8
    number_of_instances: 1
    extra_args: >-
      ${_generation.vllm_args} --reasoning-parser gemma4
      --enable-auto-tool-choice --tool-call-parser gemma4
driver:
  env:
    CONCURRENCY: lit:5
