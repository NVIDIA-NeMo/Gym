name: imo_answerbench
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: math
description: Math QA verified by a Skills-style autograder LLM judge with math-verify
  symbolic fallback
modality: text
licensing: unknown
authors:
- gwarmstrong
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: math_with_autograder
agent_server: simple_agent
datasets:
- name: imo_answerbench
  type: benchmark
  jsonl_fpath: benchmarks/imo_answerbench/data/imo_answerbench_benchmark.jsonl
  prepare_script: benchmarks/imo_answerbench/prepare.py
  prompt_config: benchmarks/prompts/generic/math.yaml
  num_repeats: 1
model_server: policy_model
canonical_split: benchmark
standard_prompt_config: benchmarks/prompts/generic/math.yaml
lifecycle: active
