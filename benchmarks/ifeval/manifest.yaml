name: ifeval
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: instruction_following
description: IFEval prompt-level strict instruction following with binary all-instructions
  grading.
modality: text
licensing: Apache-2.0
authors:
- arti4nvj
maintainers:
- gwarmstrong
capabilities:
- instruction_and_format_following
- instruction_and_format_following/instruction_following
- instruction_and_format_following/structured_output
- writing_and_editing
- writing_and_editing/creative_writing
- writing_and_editing/informational_writing
- knowledge
- knowledge/factual_knowledge
- multilingual_and_multicultural
- multilingual_and_multicultural/requested_language_response
domains:
- general
- media_entertainment
- marketing_advertising
primary_metric: mean/reward
requirements:
  gpu: false
  network: no-network
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: instruction_following
agent_server: simple_agent
datasets:
- name: ifeval
  type: benchmark
  jsonl_fpath: benchmarks/ifeval/data/ifeval_benchmark.jsonl
  prepare_script: benchmarks/ifeval/prepare.py
  num_repeats: 1
model_server: policy_model
canonical_split: full
prompt_source: prepared
lifecycle: active
