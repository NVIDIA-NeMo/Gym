name: global-piqa
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: knowledge
description: Multi-choice question answering problems
modality: text
licensing: unknown
authors:
- wedu-nvidia
maintainers:
- wedu-nvidia
intended_use:
- evaluation
primary_metric: pass@1[avg-of-1]/accuracy
requirements:
  gpu: false
  network: no-network
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: mcqa
agent_server: simple_agent
datasets:
- name: global-piqa
  type: benchmark
  jsonl_fpath: benchmarks/global-piqa/data/global-piqa_benchmark.jsonl
  prepare_script: benchmarks/global-piqa/prepare.py
  prompt_config: benchmarks/global-piqa/prompts/default.yaml
  num_repeats: 1
model_server: policy_model
canonical_split: test
standard_prompt_config: benchmarks/global-piqa/prompts/default.yaml
lifecycle: active
