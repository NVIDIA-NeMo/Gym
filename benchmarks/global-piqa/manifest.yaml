name: global-piqa
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: knowledge
description: Multi-choice question answering problems
modality: text
licensing: unknown
authors:
- wedu-nvidia
maintainers:
- wedu-nvidia
capabilities:
- knowledge
- knowledge/factual_knowledge
- knowledge/cultural_knowledge
- reasoning
- reasoning/causal_reasoning
- multilingual_and_multicultural
