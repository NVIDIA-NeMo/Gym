config_paths:
  - resources_servers/browsergym_web/configs/browsergym_web.yaml
  - resources_servers/webvoyager_judge/configs/webvoyager_judge.yaml
  - resources_servers/webvoyager_judge/configs/judge_model_openai.yaml
  - responses_api_agents/web_agent/configs/web_agent.yaml

webvoyager_benchmark_resources_server:
  _inherit_from: browsergym_web
  resources_servers:
    browsergym_web:
      allowed_benchmarks: [webvoyager]

webvoyager_benchmark_judge:
  _inherit_from: webvoyager_judge

webvoyager_benchmark_agent:
  _inherit_from: web_agent
  responses_api_agents:
    web_agent:
      resources_server:
        type: resources_servers
        name: webvoyager_benchmark_resources_server
      webvoyager_judge_server:
        type: resources_servers
        name: webvoyager_benchmark_judge
      # Match upstream WebVoyager's compact SoM prompt and its default policy
      # context of one current screenshot/observation. Judge evidence remains 3.
      visual_observation_text: som_only
      max_image_history: 1
      redact_old_visual_observations: true
      datasets:
        - name: webvoyager
          type: benchmark
          jsonl_fpath: benchmarks/webvoyager/data/webvoyager_benchmark.jsonl
          prompt_config: null
          prepare_script: benchmarks/webvoyager/prepare.py
          num_repeats: 1
