# Qwen3.5-122B-A10B-FP8 profile aligned with the maintained WebVoyager recipe.
config_paths:
  - resources_servers/visual_browser/configs/visual_browser.yaml
  - resources_servers/webvoyager_judge/configs/gemini.yaml
  - resources_servers/webvoyager_judge/configs/judge_model_gemini.yaml
  - responses_api_agents/web_agent/configs/web_agent.yaml
  - responses_api_models/vllm_model/configs/vllm_model.yaml

qwen35_policy_model:
  _inherit_from: policy_model
  responses_api_models:
    vllm_model:
      base_url: ${policy_base_url}
      api_key: ${policy_api_key}
      model: ${policy_model_name}
      uses_reasoning_parser: true
      replace_developer_role_with_system: true
      chat_template_kwargs:
        enable_thinking: true
      sampling_overrides:
        temperature: 0.1
        top_p: 0.9

webvoyager_environment:
  _inherit_from: visual_browser
  resources_servers:
    visual_browser:
      terminate_on_action_error: false
      max_computer_actions: 20

webvoyager_judge:
  _inherit_from: webvoyager_gemini_judge

qwen35_webvoyager_agent:
  _inherit_from: web_agent
  responses_api_agents:
    web_agent:
      resources_server:
        type: resources_servers
        name: webvoyager_judge
      environment_server:
        type: resources_servers
        name: webvoyager_environment
      model_server:
        type: responses_api_models
        name: qwen35_policy_model
      policy_protocol: qwen_xml_computer_use
      max_steps: 100
      max_parse_retries: 2
      nano_omni_parse_retry_delay_secs: 1.0
      model_turn_max_retries: 4
      model_retry_delay_secs: 5.0
      max_image_history: 20
      qwen_fold_size: 10
      qwen_history_n: 100
      qwen_coordinate_type: relative
      qwen_thinking: true
      judge_max_screenshots: 200
      resources_request_timeout_secs: 420
      model_request_timeout_secs: 130
      # The judge service may legitimately use its full 510 s upstream-call
      # budget. Keep the agent envelope larger so it never cancels a valid
      # in-flight judge request at the old 120 s boundary.
      judge_request_timeout_secs: 540
      run_timeout_secs: 14400
      datasets:
        - name: webvoyager
          type: benchmark
          jsonl_fpath: benchmarks/webvoyager/data/webvoyager.jsonl
          prompt_config: null
          prepare_script: benchmarks/webvoyager/prepare.py
          num_repeats: 1
