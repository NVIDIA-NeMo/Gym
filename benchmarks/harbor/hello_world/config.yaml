# Harbor's hello-world task from the Harbor hub, graded by its own Harbor verifier. Default agent: Harbor's Terminus-2; pick another
# with --agent-type (for example harbor_harness_agent/opencode). Add a sandbox provider config and a model server.
config_paths:
  - responses_api_agents/harbor_harness_agent/configs/harbor_harness_agent.yaml
  - environment_servers/single_agent_turn_legacy/configs/single_agent_turn_legacy.yaml

harbor_hello_world_resources_server:
  resources_servers:
    harbor_tasks:
      entrypoint: app.py
      domain: other
      verified: false
      description: Harbor's hello-world task from the Harbor hub, graded by its Harbor verifier
      allowed_agents: [harbor_harness_agent]
      # Pinned to one published version, so rows and the server resolve the same tasks.
      harbor_datasets:
        hello_world:
          name: harbor/hello-world
          ref: "sha256:d10e96e201d6816b22553504e06e7de0153a26381e808d11404cbca530b9d388"
      # Tasks build from environment/Dockerfile; build these images with build_images.py before running.
      image_template: nemo-gym-harbor-env:{environment_hash}
      sandbox_provider: sandbox
      sandbox_config:
        ttl_s: 21600
        ready_timeout_s: 900
      artifacts_dir: results/harbor/hello_world/harbor_tasks
      datasets:
        - name: harbor_hello_world
          type: benchmark
          jsonl_fpath: benchmarks/harbor/hello_world/data/benchmark.jsonl
          prepare_script: benchmarks/harbor/hello_world/prepare.py
          num_repeats: 1

harbor_hello_world_harbor_harness_agent:
  _inherit_from: harbor_harness_agent
  responses_api_agents:
    harbor_harness_agent:
      resources_server:
        type: resources_servers
        name: harbor_hello_world_resources_server
      logs_dir: results/harbor/hello_world/harbor_harness_agent

harbor_hello_world:
  _inherit_from: single_agent_turn_legacy
  environment_servers:
    single_agent_turn_legacy:
      resources_server:
        type: resources_servers
        name: harbor_hello_world_resources_server
      agent_server:
        type: responses_api_agents
        name: harbor_hello_world_harbor_harness_agent
