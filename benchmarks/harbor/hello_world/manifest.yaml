name: harbor/hello_world
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-agent-loop
domain: other
description: Harbor's one-task hello-world dataset, the smallest end-to-end check of a Harbor benchmark.
modality: text
licensing: Apache-2.0
authors:
- NVIDIA NeMo Gym contributors
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
config_path: config.yaml
resources_server: harbor_tasks
agent_server: harbor_harness_agent
datasets:
- name: harbor_hello_world
  type: benchmark
  jsonl_fpath: benchmarks/harbor/hello_world/data/benchmark.jsonl
  prepare_script: benchmarks/harbor/hello_world/prepare.py
  num_repeats: 1
model_server: policy_model
canonical_split: benchmark
prompt_source: prepared
lifecycle: active
