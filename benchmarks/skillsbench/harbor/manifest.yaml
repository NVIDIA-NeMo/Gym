name: skillsbench/harbor
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: external-agent-loop
domain: agent
description: Official benchflow-ai/skillsbench default tasks run through Gym's Harbor bridge.
modality: text
licensing: Apache-2.0
authors:
  - benchflow-ai
  - NVIDIA NeMo Gym contributors
maintainers:
- abukharin-nv
intended_use:
- evaluation
primary_metric: mean/reward
requirements:
  gpu: false
  network: public
reward:
  range: [0.0, 1.0]
  higher_is_better: true
determinism: unknown
config_path: ../harbor.yaml
resources_server: null
agent_server: harbor_agent_general
datasets:
  - name: skillsbench_official
    type: benchmark
    jsonl_fpath: benchmarks/skillsbench/data/skillsbench_official.jsonl
    prepare_script: benchmarks/skillsbench/prepare.py
    num_repeats: 1
model_server: policy_model
canonical_split: full
prompt_source: agent
adopted_from:
  source: https://github.com/benchflow-ai/skillsbench
  ref: 12ebd8653093e0734c7902835cb20c054196026c
  reconciled: '2026-10-27'
lifecycle: active
