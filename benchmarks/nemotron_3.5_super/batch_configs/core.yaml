# Pilot evaluation settings. Supply credentials in env.yaml or the environment.
# Judge/service choices are part of this recipe, not requirements of batching.
config_paths:
  - benchmarks/nemotron_3.5_super/suites/core_text.yaml
  - responses_api_models/vllm_model/configs/vllm_model.yaml

num_samples_in_parallel: 512
num_samples_in_parallel_by_agent:
  tau2_benchmark_agent: 64
  tau2_banking_knowledge_bm25_grep_artificial_analysis_agent: 64
  hle_equivalence_llm_judge_simple_agent: 64
  omniscience_omniscience_simple_agent: 64
  aalcr_benchmark_simple_agent: 64
  lmarena_v2_benchmark_agent: 32
num_repeats:
  apex_shortlist_math_with_judge_simple_agent: 16
  lmarena_v2_benchmark_agent: 3
  _default: 1
num_repeats_add_seed:
  apex_shortlist_math_with_judge_simple_agent: true
  lmarena_v2_benchmark_agent: true
  _default: false
route_failures_to_sidecar: true
uv_pip_set_python: true
uv_cache_dir: /tmp/gym-batch-uv-${oc.env:SLURM_JOB_ID,local}
model_endpoint_readiness_timeout_seconds: 1800
policy_model:
  responses_api_models:
    vllm_model:
      sampling_overrides:
        temperature: 1.0
        top_p: 0.95

nv_inference_api_key: ${oc.env:NV_INFERENCE_API_KEY}
# Tau2 uses Qwen for its simulated user; banking uses GPT-5.4 mini below.
gpt-5_2-2025-12-11: null
tau2_benchmark_agent:
  responses_api_agents:
    tau2:
      user_model_server:
        name: Qwen3-235B-A22B-Instruct-2507-FP8
Qwen3-235B-A22B-Instruct-2507-FP8:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: https://inference-api.nvidia.com/v1
      api_key: ${nv_inference_api_key}
      model: nvidia/qwen/qwen-235b

gpt-5_4-mini-2026-03-17:
  responses_api_models:
    openai_model:
      openai_base_url: https://inference-api.nvidia.com/v1
      openai_api_key: ${nv_inference_api_key}
      openai_model: openai/openai/gpt-5.4-mini
      extra_body:
        _delete_key: max_output_tokens
        reasoning_effort: medium

hle_batch_judge:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: https://inference-api.nvidia.com/v1
      openai_api_key: ${nv_inference_api_key}
      openai_model: openai/openai/gpt-5.6-luna
      max_concurrent_requests: 32
      extra_body:
        reasoning_effort: medium
hle_equivalence_llm_judge_resources_server:
  resources_servers:
    equivalence_llm_judge:
      judge_model_server:
        name: hle_batch_judge
      judge_endpoint_max_concurrency: 32
hle_equivalence_llm_judge_simple_agent:
  responses_api_agents:
    simple_agent:
      max_steps: 1

aalcr_batch_judge:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: https://inference-api.nvidia.com/v1
      openai_api_key: ${nv_inference_api_key}
      openai_model: openai/openai/gpt-5.6-luna
      max_concurrent_requests: 32
      extra_body:
        reasoning_effort: medium
aalcr_benchmark_resources_server:
  resources_servers:
    aalcr:
      judge_model_server:
        name: aalcr_batch_judge

genrm_model:
  responses_api_models:
    openai_model:
      openai_base_url: https://inference-api.nvidia.com/v1
      openai_api_key: ${nv_inference_api_key}
      openai_model: openai/openai/gpt-5.6-luna
      max_concurrent_requests: 32
      extra_body:
        reasoning_effort: medium
omniscience_omniscience_resources_server:
  resources_servers:
    omniscience:
      judge_responses_create_params:
        max_output_tokens: 32768
omniscience_omniscience_simple_agent:
  responses_api_agents:
    simple_agent:
      datasets:
        - name: omniscience
          type: benchmark
          jsonl_fpath: benchmarks/omniscience/data/omniscience_benchmark.jsonl
          prompt_config: benchmarks/omniscience/prompts/generation.yaml
          prepare_script: benchmarks/omniscience/prepare.py
          num_repeats: 10

judge_api_key: ${nv_inference_api_key}
lmarena_v2_benchmark_resources_server:
  resources_servers:
    arena:
      max_rollout_failure_rate: 0.015

ifbench_benchmark_simple_agent:
  responses_api_agents:
    simple_agent:
      datasets:
        - name: ifbench
          type: benchmark
          jsonl_fpath: benchmarks/ifbench/data/ifbench_benchmark.jsonl
          prompt_config: benchmarks/ifbench/prompts/default.yaml
          prepare_script: benchmarks/ifbench/prepare.py
          num_repeats: 8
