# Nemotron 3.5 Super GA MTP-boosted BF16 — 1P1D.
# Measured full 500-task run: 18.3293 min, 319/500 resolved (63.8%), 128 external agents.
# P/D counts mean whole four-GPU nodes. Larger D roles are one shared engine.
# Source checkpoint: nim-mtp-boosted-09212026 (83 registry-hash-verified files).
# Runtime: SGLang 0.5.20, git 94602c9c2b7cbdb8efd5c52802dac6a1c180089e;
# Torch 2.13.0+cu130, FlashInfer 0.6.18, NIXL 1.4.1, router 0.3.2,
# mooncake-transfer-engine-cuda13 0.3.13. Bind the container alias to this runtime.
# Image tag recorded; installed digest was not freshly exposed by the devbox API.
# Benchmark hardware was GB300 with 189470 MiB free/GPU before loading.
# This is a GB200 memory-capacity simulation, not measured GB200 compute speed.
# Do not allocate VRAM balloons on real GB200 GPUs.
# BF16 weights/dispatch, FP8 KV/TRT-LLM Q, FP32 recurrent state; no added quantization.
# Keep SGLANG_MOE_NVFP4_DISPATCH and SGLANG_CUTEDSL_MOE_NVFP4_DISPATCH unset.
# All participating nodes need compatible IMEX/MNNVL fabric and local weights.
# Adapt eth0 to the site's control-network interface if needed.
# Writable HF/JIT caches use /tmp in-container; model/draft paths use the /model mount.
# External SWE-bench driver: frozen 500 IDs, default thinking, 250 steps,
# temperature 1/top-p .95, max output 32768, context 262144, seed-42 task order.
# Measured 1P1D agent concurrency: 128; server request/graph ceilings remain 256.
# Serving capacity does not enlarge the external CPU/sandbox resource budget.

schema: 2
name: nemotron35-ga-gb200-1p1d
model:
  path: /scratch/models/nemotron_3_5_super_ga_candidate_mtp_boosted_20260921_vnim-mtp-boosted-09212026
  container: sglang-nemotron35-v0520-validated
  precision: bf16
resources:
  gpu_type: gb200
  gpus_per_node: 4
engine: sglang
dynamo:
  install: false
identity:
  container:
    image: lmsysorg/sglang:v0.5.20
  frameworks:
    sglang: 0.5.20
frontend:
  type: sglang-router
  enable_multiple_frontends: false
  num_additional_frontends: 0
  args:
    request-timeout-secs: 1200
    worker-startup-timeout-secs: 1200
    max-concurrent-requests: 512
    pool-max-idle-per-host: 0
    pool-idle-timeout-secs: 2
    health-check-interval-secs: 5
    log-level: info
    policy: cache_aware
benchmark:
  type: manual
roles:
  prefill:
    nodes: 1
    workers: 1
    gpus: 4
    env:
      CUDA_VISIBLE_DEVICES: 0,1,2,3
      # UCX_NET_DEVICES: eth0  # Original
      UCX_NET_DEVICES: mlx5_0,mlx5_1,mlx5_3,mlx5_4
      SGLANG_DISAGGREGATION_NIXL_BACKEND: UCX
      UCX_TLS: tcp,cuda_copy,cuda_ipc,sm,self
      SGLANG_MOONCAKE_CUSTOM_MEM_POOL: NVLINK
      UCX_CUDA_IPC_ENABLE_MNNVL: y
      NCCL_MNNVL_ENABLE: '1'
      NCCL_CUMEM_ENABLE: '1'
      UCX_PROTO_INFO: y
      UCX_LOG_LEVEL: info
      SGLANG_DISABLE_USAGE_REPORT: '1'
      HF_HOME: /tmp/nemotron35-hf
      HF_HUB_CACHE: /tmp/nemotron35-hf/hub
      HF_MODULES_CACHE: /tmp/nemotron35-hf/modules
      SGLANG_CACHE_DIR: /tmp/nemotron35-sglang
      CUDA_ENABLE_COREDUMP_ON_EXCEPTION: '0'
      CUDA_ENABLE_CPU_COREDUMP_ON_EXCEPTION: '0'
      SGLANG_CUDA_COREDUMP: '0'
      SGLANG_CUDA_COREDUMP_BEFORE_CRASH: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    args:
      model-path: /model
      served-model-name: nemotron-3.5-super-ga-mtp-boosted
      disaggregation-mode: prefill
      skip-server-warmup: true
      attention-backend: trtllm_mha
      chunked-prefill-size: 8192
      context-length: 262144
      disaggregation-transfer-backend: nixl
      dtype: bfloat16
      enable-cache-report: true
      enable-metrics: true
      ep-size: 4
      kv-cache-dtype: fp8_e4m3
      linear-attn-backend: triton
      mamba-backend: flashinfer
      mamba-full-memory-ratio: 4
      mamba-radix-cache-strategy: extra_buffer
      mamba-ssm-dtype: float32
      max-prefill-tokens: 16384
      max-running-requests: 256
      mem-fraction-static: 0.9
      moe-a2a-backend: none
      page-size: 64
      random-seed: 42
      reasoning-parser: nemotron_3
      speculative-algorithm: EAGLE
      speculative-draft-model-path: /model
      speculative-eagle-topk: 1
      speculative-num-draft-tokens: 4
      speculative-num-steps: 3
      tokenizer-worker-num: 4
      tool-call-parser: qwen3_coder
      tp-size: 4
      trust-remote-code: true
      weight-loader-drop-cache-after-load: true
  decode:
    nodes: 1
    workers: 1
    gpus: 4
    env:
      CUDA_VISIBLE_DEVICES: 0,1,2,3
      UCX_NET_DEVICES: eth0
      SGLANG_DISAGGREGATION_NIXL_BACKEND: UCX
      UCX_TLS: tcp,cuda_copy,cuda_ipc,sm,self
      SGLANG_MOONCAKE_CUSTOM_MEM_POOL: NVLINK
      UCX_CUDA_IPC_ENABLE_MNNVL: y
      NCCL_MNNVL_ENABLE: '1'
      NCCL_CUMEM_ENABLE: '1'
      UCX_PROTO_INFO: y
      UCX_LOG_LEVEL: info
      SGLANG_DISABLE_USAGE_REPORT: '1'
      HF_HOME: /tmp/nemotron35-hf
      HF_HUB_CACHE: /tmp/nemotron35-hf/hub
      HF_MODULES_CACHE: /tmp/nemotron35-hf/modules
      SGLANG_CACHE_DIR: /tmp/nemotron35-sglang
      CUDA_ENABLE_COREDUMP_ON_EXCEPTION: '0'
      CUDA_ENABLE_CPU_COREDUMP_ON_EXCEPTION: '0'
      SGLANG_CUDA_COREDUMP: '0'
      SGLANG_CUDA_COREDUMP_BEFORE_CRASH: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    args:
      model-path: /model
      served-model-name: nemotron-3.5-super-ga-mtp-boosted
      disaggregation-mode: decode
      skip-server-warmup: true
      attention-backend: trtllm_mha
      context-length: 262144
      cuda-graph-max-bs-decode: 256
      disaggregation-decode-extra-slots: 0
      disaggregation-transfer-backend: nixl
      dtype: bfloat16
      enable-cache-report: true
      enable-metrics: true
      ep-size: 4
      kv-cache-dtype: fp8_e4m3
      linear-attn-backend: triton
      mamba-backend: flashinfer
      mamba-radix-cache-strategy: extra_buffer
      mamba-ssm-dtype: float32
      max-running-requests: 256
      max-total-tokens: 16777216
      mem-fraction-static: 0.8
      moe-a2a-backend: none
      page-size: 64
      random-seed: 42
      reasoning-parser: nemotron_3
      speculative-algorithm: EAGLE
      speculative-draft-model-path: /model
      speculative-eagle-topk: 1
      speculative-num-draft-tokens: 4
      speculative-num-steps: 3
      tokenizer-worker-num: 4
      tool-call-parser: qwen3_coder
      tp-size: 4
      trust-remote-code: true
      weight-loader-drop-cache-after-load: true
