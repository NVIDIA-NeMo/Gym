#
# Run Gym evaluation against the SGLang 1P1D endpoint in the same Slurm job.
# Serving settings are copied from 1P1D.yaml; its recorded scores do not apply to new runs.
# The selected BF16 checkpoint must include compatible MTP weights.
#
# Before submission:
#   export MODEL=/path/to/checkpoint
#   export GYM_REPO=/shared/path/to/Gym
#   export OPENSANDBOX_DOMAIN=your-sandbox-host
#   export OPENSANDBOX_API_KEY=your-key
#   export WANDB_API_KEY=your-key  # Or export WANDB_MODE=offline.
#   srtctl apply -f benchmarks/nemotron_3.5_super/sglang_configs/1P1D_gym.yaml
#
# In srtslurm.yaml, map sglang-nemotron35-v0520-validated to the serving image
# described in 1P1D.yaml and gym-eval to your Gym evaluation .sqsh. The latter
# needs /opt/Gym_venv and the benchmark dependencies in /opt/uv_venvs, as built
# by benchmarks/nemotron_3.5_super/build_eval_container.sh. GYM_REPO is mounted
# at /opt/Gym; export credentials in the submission environment, not this file.
# The sandbox_utils.yaml OpenCode/tmux paths must also be available to sandboxes.
#
# Defaults: SWE-bench Verified/OpenCode, 128 concurrent rollouts, and the
# benchmark config's repeat count (currently 3). Select another Gym config with:
#   --set benchmark.env.GYM_CONFIG=benchmarks/swebench/pro/opencode.yaml
# Adjust concurrency with --set 'benchmark.env.NUM_SAMPLES_IN_PARALLEL="256"'.
# Pass QoS with --set sbatch_directives.qos=your-qos.
# Gym artifacts persist under <SRT job log directory>/gym/<EXPERIMENT_NAME>/.
# EXPORT_TO_CSV uses the existing full-suite exporter; enable it only for a
# Gym config containing all of the benchmarks required by export_to_csv.py.

schema: 2
name: nemotron35-ga-gb200-1p1d-gym
model:
  path: "$MODEL"
  container: sglang-nemotron35-v0520-validated
  precision: bf16
resources:
  gpu_type: gb200
  gpus_per_node: 4
engine: sglang
dynamo:
  install: false
identity:
  container:
    image: lmsysorg/sglang:v0.5.20
  frameworks:
    sglang: 0.5.20
frontend:
  type: sglang-router
  enable_multiple_frontends: false
  num_additional_frontends: 0
  args:
    request-timeout-secs: 1200
    worker-startup-timeout-secs: 1200
    max-concurrent-requests: 512
    pool-max-idle-per-host: 0
    pool-idle-timeout-secs: 2
    health-check-interval-secs: 5
    log-level: info
    policy: cache_aware
# Keep the Gym checkout and its results visible outside the evaluation container.
# SRT already mounts its job log directory at /logs and the checkpoint at /model.
container_mounts:
  "$GYM_REPO": /opt/Gym

# Gym's inference-metrics collector handles vLLM metrics; SRT collects engine telemetry here.
observability:
  enabled: true

benchmark:
  type: custom
  container_image: gym-eval
  client_placement: last_decode
  stream_output: true
  env:
    GYM_CONFIG: benchmarks/swebench/verified/opencode.yaml
    NUM_SAMPLES_IN_PARALLEL: '128'
    POLICY_MODEL_NAME: &served_model_name nemotron-3.5-super-ga-mtp-boosted
    EXPERIMENT_NAME: sglang-1p1d-gym
    EXPORT_TO_CSV: '0'
    EXPORT_CSV_TO_MODEL_DIR: '0'
  command: |
    set -euo pipefail
    source /opt/Gym_venv/bin/activate
    cd /opt/Gym

    : "${SRT_FRONTEND_HOST:?SRT must provide the router host}"
    : "${SRT_FRONTEND_PORT:?SRT must provide the router port}"
    : "${OPENSANDBOX_API_KEY:?Export OPENSANDBOX_API_KEY before submitting}"
    export NEMO_GYM_RUN_ID="${SLURM_JOB_ID:?Must run inside a Slurm job}"
    export NEMO_GYM_USER="${NEMO_GYM_USER:-${SLURM_JOB_USER:-$USER}}"

    experiment_name="${EXPERIMENT_NAME}/slurm_job_id_${SLURM_JOB_ID}"
    output_dir="/logs/gym/${EXPERIMENT_NAME}"
    mkdir -p "$output_dir"
    rollouts_fpath="$output_dir/rollouts.jsonl"

    gym eval prepare --config "$GYM_CONFIG" +use_cached_prepared_benchmarks=true

    gym eval run \
      --config "$GYM_CONFIG" \
      --model-type vllm_model \
      --config benchmarks/nemotron_3.5_super/sandbox_utils.yaml \
      --config benchmarks/nemotron_3.5_super/policy_model_override.yaml \
      "+wandb_project=${NEMO_GYM_USER}-gym-eval" \
      "+wandb_name=$experiment_name" \
      +uv_venv_dir=/opt/uv_venvs \
      "+nemo_gym_log_dir=$output_dir/logs" \
      +skip_venv_if_present=true \
      "++output_jsonl_fpath=$rollouts_fpath" \
      ++overwrite_metrics_conflicts=true \
      ++split=benchmark \
      ++use_absolute_ip=true \
      ++reuse_existing_data_preparation=true \
      "++policy_base_url=http://${SRT_FRONTEND_HOST}:${SRT_FRONTEND_PORT}/v1" \
      ++policy_api_key=dummy_api_key \
      "++policy_model_name=$POLICY_MODEL_NAME" \
      ++upload_rollouts=false \
      ++global_aiohttp_connector_limit_per_host=16384 \
      ++port_range_low=63000 \
      ++port_range_high=64000 \
      "++num_samples_in_parallel=$NUM_SAMPLES_IN_PARALLEL" \
      ++model_endpoint_readiness_timeout_seconds=1200 \
      ++policy_model.responses_api_models.vllm_model.sampling_overrides.temperature=1.0 \
      ++policy_model.responses_api_models.vllm_model.sampling_overrides.top_p=0.95 \
      "++sandbox.opensandbox.connection.protocol=${OPENSANDBOX_PROTOCOL:-http}"

roles:
  prefill:
    nodes: 1
    workers: 1
    gpus: 4
    env:
      CUDA_VISIBLE_DEVICES: 0,1,2,3
      # UCX_NET_DEVICES: eth0  # Original
      UCX_NET_DEVICES: mlx5_0,mlx5_1,mlx5_3,mlx5_4
      SGLANG_DISAGGREGATION_NIXL_BACKEND: UCX
      UCX_TLS: tcp,cuda_copy,cuda_ipc,sm,self
      SGLANG_MOONCAKE_CUSTOM_MEM_POOL: NVLINK
      UCX_CUDA_IPC_ENABLE_MNNVL: y
      NCCL_MNNVL_ENABLE: '1'
      NCCL_CUMEM_ENABLE: '1'
      UCX_PROTO_INFO: y
      UCX_LOG_LEVEL: info
      SGLANG_DISABLE_USAGE_REPORT: '1'
      HF_HOME: /tmp/nemotron35-hf
      HF_HUB_CACHE: /tmp/nemotron35-hf/hub
      HF_MODULES_CACHE: /tmp/nemotron35-hf/modules
      SGLANG_CACHE_DIR: /tmp/nemotron35-sglang
      CUDA_ENABLE_COREDUMP_ON_EXCEPTION: '0'
      CUDA_ENABLE_CPU_COREDUMP_ON_EXCEPTION: '0'
      SGLANG_CUDA_COREDUMP: '0'
      SGLANG_CUDA_COREDUMP_BEFORE_CRASH: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    args:
      model-path: /model
      served-model-name: *served_model_name
      disaggregation-mode: prefill
      skip-server-warmup: true
      attention-backend: trtllm_mha
      chunked-prefill-size: 8192
      context-length: 262144
      disaggregation-transfer-backend: nixl
      dtype: bfloat16
      enable-cache-report: true
      enable-metrics: true
      ep-size: 4
      kv-cache-dtype: fp8_e4m3
      linear-attn-backend: triton
      mamba-backend: flashinfer
      mamba-full-memory-ratio: 4
      mamba-radix-cache-strategy: extra_buffer
      mamba-ssm-dtype: float32
      max-prefill-tokens: 16384
      max-running-requests: 256
      mem-fraction-static: 0.9
      moe-a2a-backend: none
      page-size: 64
      random-seed: 42
      reasoning-parser: nemotron_3
      speculative-algorithm: EAGLE
      speculative-draft-model-path: /model
      speculative-eagle-topk: 1
      speculative-num-draft-tokens: 4
      speculative-num-steps: 3
      tokenizer-worker-num: 4
      tool-call-parser: qwen3_coder
      tp-size: 4
      trust-remote-code: true
      weight-loader-drop-cache-after-load: true
  decode:
    nodes: 1
    workers: 1
    gpus: 4
    env:
      CUDA_VISIBLE_DEVICES: 0,1,2,3
      UCX_NET_DEVICES: eth0
      SGLANG_DISAGGREGATION_NIXL_BACKEND: UCX
      UCX_TLS: tcp,cuda_copy,cuda_ipc,sm,self
      SGLANG_MOONCAKE_CUSTOM_MEM_POOL: NVLINK
      UCX_CUDA_IPC_ENABLE_MNNVL: y
      NCCL_MNNVL_ENABLE: '1'
      NCCL_CUMEM_ENABLE: '1'
      UCX_PROTO_INFO: y
      UCX_LOG_LEVEL: info
      SGLANG_DISABLE_USAGE_REPORT: '1'
      HF_HOME: /tmp/nemotron35-hf
      HF_HUB_CACHE: /tmp/nemotron35-hf/hub
      HF_MODULES_CACHE: /tmp/nemotron35-hf/modules
      SGLANG_CACHE_DIR: /tmp/nemotron35-sglang
      CUDA_ENABLE_COREDUMP_ON_EXCEPTION: '0'
      CUDA_ENABLE_CPU_COREDUMP_ON_EXCEPTION: '0'
      SGLANG_CUDA_COREDUMP: '0'
      SGLANG_CUDA_COREDUMP_BEFORE_CRASH: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    args:
      model-path: /model
      served-model-name: *served_model_name
      disaggregation-mode: decode
      skip-server-warmup: true
      attention-backend: trtllm_mha
      context-length: 262144
      cuda-graph-max-bs-decode: 256
      disaggregation-decode-extra-slots: 0
      disaggregation-transfer-backend: nixl
      dtype: bfloat16
      enable-cache-report: true
      enable-metrics: true
      ep-size: 4
      kv-cache-dtype: fp8_e4m3
      linear-attn-backend: triton
      mamba-backend: flashinfer
      mamba-radix-cache-strategy: extra_buffer
      mamba-ssm-dtype: float32
      max-running-requests: 256
      max-total-tokens: 16777216
      mem-fraction-static: 0.8
      moe-a2a-backend: none
      page-size: 64
      random-seed: 42
      reasoning-parser: nemotron_3
      speculative-algorithm: EAGLE
      speculative-draft-model-path: /model
      speculative-eagle-topk: 1
      speculative-num-draft-tokens: 4
      speculative-num-steps: 3
      tokenizer-worker-num: 4
      tool-call-parser: qwen3_coder
      tp-size: 4
      trust-remote-code: true
      weight-loader-drop-cache-after-load: true
