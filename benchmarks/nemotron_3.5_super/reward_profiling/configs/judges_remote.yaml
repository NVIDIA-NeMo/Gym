# Judge bindings for reward profiling, served by the NVIDIA inference gateway.
#
# Each resources server names its judge; it never names an endpoint. So binding a judge is
# assigning that name here, and every entry below targets a distinct top-level key -- one file
# covers the whole judge lane without collisions.
#
# Self-hosting instead: swap this file for a variant binding the same names to local_vllm_model
# (see benchmarks/nemotron_3_ultra/judge_local_endpoints.yaml). The pre-sweep scripts ran 47
# separate judge jobs, including sixteen 4-node Qwen3-235B servers for long_context alone; the
# gateway removes that entirely, at the cost of depending on its throughput.
#
# nv_inference_api_key comes from env.yaml.

# max_concurrent_requests is not optional at sweep scale. The transport retries 429s with a flat
# 0.5s sleep and *extends* its retry budget on rate-limit codes, so a saturated judge degrades into
# a retry storm rather than backpressure. Total load is this value times the number of drivers.
math_judge_model: &gateway_judge
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: https://inference-api.nvidia.com/v1
      openai_model: nvidia/qwen/qwen-235b
      openai_api_key: ${nv_inference_api_key}
      max_concurrent_requests: 64

# The pre-sweep scripts pointed abstention and inverse_if at a separately named judge instance.
# Kept distinct so the two can be repointed independently without touching the math judge.
nl2bash_judge_model: *gateway_judge

# Names the shipped configs already reference. abstention declares genrm_model and inverse_if
# declares judge_model; nothing else defines them, so the composed config fails to resolve without
# these. Defining them is also what avoids depending on merge order to rebind.
genrm_model: *gateway_judge
judge_model: *gateway_judge

# --- bindings: which judge each resources server uses -----------------------------------------

# math_with_judge verifies symbolically via math-verify by default; the judge is the fallback and
# has to be switched on explicitly.
math_with_judge:
  resources_servers:
    math_with_judge:
      should_use_judge: true
      judge_model_server:
        type: responses_api_models
        name: math_judge_model

lc_judge:
  resources_servers:
    equivalence_llm_judge:
      judge_model_server:
        type: responses_api_models
        name: math_judge_model

equivalence_llm_judge:
  resources_servers:
    equivalence_llm_judge:
      judge_model_server:
        type: responses_api_models
        name: math_judge_model

multichallenge:
  resources_servers:
    multichallenge:
      judge_model_server:
        type: responses_api_models
        name: math_judge_model

abstention:
  resources_servers:
    abstention:
      judge_model_server:
        type: responses_api_models
        name: nl2bash_judge_model

inverse_if:
  resources_servers:
    inverse_if:
      judge_model_server:
        type: responses_api_models
        name: nl2bash_judge_model
