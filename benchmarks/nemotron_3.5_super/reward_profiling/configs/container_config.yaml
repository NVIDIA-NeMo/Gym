policy_model:
  responses_api_models:
    vllm_model:
      num_workers: 16
port_range_low: 20000
port_range_high: 30000
math_judge_model: &id001
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: https://inference-api.nvidia.com/v1
      openai_model: nvidia/qwen/qwen-235b
      openai_api_key: ${nv_inference_api_key}
      max_concurrent_requests: 64
nl2bash_judge_model: *id001
genrm_model: *id001
judge_model: *id001
math_with_judge:
  resources_servers:
    math_with_judge:
      should_use_judge: true
      judge_model_server:
        type: responses_api_models
        name: math_judge_model
lc_judge:
  resources_servers:
    equivalence_llm_judge:
      judge_model_server:
        type: responses_api_models
        name: math_judge_model
equivalence_llm_judge:
  resources_servers:
    equivalence_llm_judge:
      judge_model_server:
        type: responses_api_models
        name: math_judge_model
multichallenge:
  resources_servers:
    multichallenge:
      judge_model_server:
        type: responses_api_models
        name: math_judge_model
abstention:
  resources_servers:
    abstention:
      judge_model_server:
        type: responses_api_models
        name: nl2bash_judge_model
      judge_responses_create_params:
        max_output_tokens: 8192
inverse_if:
  resources_servers:
    inverse_if:
      judge_model_server:
        type: responses_api_models
        name: nl2bash_judge_model
ns_tools:
  resources_servers:
    ns_tools:
      verifiers:
        math_with_judge:
          type: resources_servers
          name: math_with_judge
        mcqa:
          type: resources_servers
          name: mcqa
        equivalence_llm_judge:
          type: resources_servers
          name: equivalence_llm_judge
      disable_session_restore: true
policy_base_url: dummy
policy_api_key: dummy
policy_model_name: dummy
nv_inference_api_key: dummy
