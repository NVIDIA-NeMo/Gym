# The whole reward-profiling sweep: every environment, one Gym deployment, one input file.
#
# This is the shape the design targets. Rows carry their own agent_ref and rollout collection
# dispatches per row, so 36 environments across 3 lanes need one deployment rather than 36 jobs.
# The lane manifests remain runnable on their own for narrower runs; this composes them.
#
# Requires SANDBOX_CONTAINER (the sandbox lane) and env.yaml (the judge lane). Without the
# sandbox, ns_tools and math_formal_lean fail per rollout rather than at startup.

nickname: super35_all

defaults:
  num_repeats: 8

includes:
  - no_judge_no_sandbox.yaml
  - judge.yaml
  - sandbox.yaml
