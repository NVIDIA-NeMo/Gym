# Reward-profiling sweep for Nemotron 3.5 Super: no-judge, no-sandbox environments.
#
# Each entry pairs one training JSONL with the config(s) declaring the agent its rows name.
# 'agent' must match the agent_ref carried by the data; `gym sweep validate` enforces it.
# Provenance: data_gym/ultra_v3_sets/260603_ultra_v3_set_final (36 envs; the 10 judge and
# sandbox environments are intentionally excluded from this sweep).
#
# Row counts are deliberately absent: they are a property of the data, not a declaration, and
# hand-carried copies go stale. `nemo_gym.sweep materialize` writes the observed counts to
# <out-dir>/<nickname>/sweep_report.json.

# Identifies this run and scopes its artifacts. Change it per checkpoint.
nickname: super35_dualds0821_iter6500

# Optional. Unset = one input file, one invocation. Set only if the driver cannot hold
# every materialized row at once.
# num_shards: 4

defaults:
  num_repeats: 8

# Merged ahead of every entry: the agents reference `policy_model`, which no entry config
# declares. Swap in judge or sandbox bindings here too.
extra_configs:
  - responses_api_models/vllm_model/configs/vllm_model.yaml

