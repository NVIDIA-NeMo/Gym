# Minimal manifest for a judge-scored environment.
#
# The difference from example_basic is config_overlay. The shipped config names a judge but never
# an endpoint -- binding the judge means defining that name here. Without it the composed config
# fails to resolve and the run dies at parse, before a single rollout.
#
# ${nv_inference_api_key} comes from env.yaml, which the launchers mount into the container.

nickname: example_judge

num_repeats: 8

extra_configs:
  - responses_api_models/vllm_model/configs/vllm_model.yaml

config_overlay:

  # Ordinary Gym config, spliced into the emitted sweep_config.yaml as top-level keys. Inline
  # rather than a separate file because the container is built from a Gym ref and does not contain
  # this repo, so a repo-relative extra_config path would not resolve inside it.
  #
  # max_concurrent_requests is not optional at scale: the transport retries 429s with a flat sleep
  # and extends its retry budget on rate limits, so a saturated judge degrades into a retry storm
  # rather than backpressure.
  math_judge_model:
    responses_api_models:
      openai_model:
        entrypoint: app.py
        openai_base_url: https://inference-api.nvidia.com/v1
        openai_model: nvidia/qwen/qwen-235b
        openai_api_key: ${nv_inference_api_key}
        max_concurrent_requests: 64

  # lc_judge.yaml declares that equivalence_llm_judge needs a judge; this says which one.
  lc_judge:
    resources_servers:
      equivalence_llm_judge:
        judge_model_server:
          type: responses_api_models
          name: math_judge_model

entries:

  - label: long_context
    agent: lc_judge_simple_agent
    configs:
      - resources_servers/equivalence_llm_judge/configs/lc_judge.yaml
    data: /lustre/fs1/portfolios/llmservice/projects/llmservice_modelalignment_ppo/users/jiaqiz/data/gym/all_super_env/long_context/0123_chengping_qwenlong_v3b_profiled.jsonl
    owner: fjia
