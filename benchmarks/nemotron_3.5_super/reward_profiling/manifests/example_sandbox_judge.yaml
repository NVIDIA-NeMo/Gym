# Minimal manifest for an environment that needs a sandbox AND a judge.
#
# math_tir runs generated code in a nemo-skills sandbox (ns_tools) and scores the result with
# math_with_judge, so it exercises both halves at once. Two things have to be set up:
#
#   1. A sandbox. ns_tools reads NEMO_SKILLS_SANDBOX_HOST/PORT and otherwise falls back to
#      127.0.0.1:6000, where nothing listens -- every rollout then fails with a bare 500. Pass
#      SANDBOX_CONTAINER to 03_run.sh, which starts one and waits for /health before collecting.
#   2. A judge. math_with_judge verifies symbolically via math-verify by default and only consults
#      the judge as a fallback, so should_use_judge has to be turned on explicitly.

nickname: example_sandbox_judge

# Becomes sweep_config.yaml, passed to `gym env start --config`.
gym_env_start:
  config_paths:
    - responses_api_models/vllm_model/configs/vllm_model.yaml

  math_judge_model:
    responses_api_models:
      openai_model:
        entrypoint: app.py
        openai_base_url: https://inference-api.nvidia.com/v1
        openai_model: nvidia/qwen/qwen-235b
        openai_api_key: ${nv_inference_api_key}
        max_concurrent_requests: 64

  math_with_judge:
    resources_servers:
      math_with_judge:
        # The judge is the fallback path, not the default one.
        should_use_judge: true
        judge_model_server:
          type: responses_api_models
          name: math_judge_model

  ns_tools:
    resources_servers:
      ns_tools:
        # Rows carry a per-row verifier_type, and an unregistered name is a hard failure that
        # reaches the driver as a bare 500 ("ValueError: Unknown verifier"). Upstream registers
        # only math_with_judge, which is all this manifest's rows use; add mcqa and
        # equivalence_llm_judge here if you add entries whose rows select them.
        verifiers:
          math_with_judge:
            type: resources_servers
            name: math_with_judge
        # Replaying a session after a sandbox worker restarts is what tends to wedge the tool call.
        disable_session_restore: true

# Runtime settings for `gym eval run --no-serve`.
gym_eval_run:
  num_repeats: 8

entries:

  - label: math_tir
    agent: ns_tools_simple_agent
    configs:
      - resources_servers/ns_tools/configs/ns_tools.yaml
      - resources_servers/math_with_judge/configs/math_with_judge.yaml
    data: /lustre/fsw/portfolios/llmservice/users/jkyi/current/nemo/data_gym/ultra_v3_sets/260501_ultra_v3_set/math_tir/math_tir_260501.jsonl
    owner: igitman
