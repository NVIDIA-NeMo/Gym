# Reward-profiling sweep: environments scored by an LLM judge.
#
#
# Provenance: data_gym/ultra_v3_sets/260603_ultra_v3_set_final.

nickname: super35_judge

defaults:
  num_repeats: 8

extra_configs:
  - responses_api_models/vllm_model/configs/vllm_model.yaml

# --- judge deployment ---------------------------------------------------------------------------
# Everything under config_overlay is ordinary Gym config, verbatim -- the same yaml you would write
# in resources_servers/<name>/configs/, just inline. It is copied unchanged into the emitted
# sweep_config.yaml as top-level keys, and since a config overrides anything its own config_paths
# pulled in, these win over every file listed above. Hence "overlay".
#
# Inline rather than a separate config file on purpose: the container is built from a Gym ref and
# does not contain this repo, so a repo-relative extra_config path does not resolve inside it,
# whereas sweep_config.yaml lives in SWEEP_DIR and is always mounted.
#
# Each resources server names its judge; it never names an endpoint. Binding a judge is assigning
# that name here. Every key below is distinct, so there are no collisions.
#
# Self-hosting instead: rebind these names to local_vllm_model (see
# benchmarks/nemotron_3_ultra/judge_local_endpoints.yaml). The pre-sweep scripts ran 47 separate
# judge jobs, including sixteen 4-node Qwen3-235B servers for long_context alone; the gateway
# removes that, at the cost of depending on its throughput.
#
# nv_inference_api_key comes from env.yaml, which the launchers mount.
#
# max_concurrent_requests is not optional at sweep scale. The transport retries 429s with a flat
# 0.5s sleep and *extends* its retry budget on rate-limit codes, so a saturated judge degrades into
# a retry storm rather than backpressure. Total load is this value times the number of drivers.
config_overlay:

  math_judge_model: &gateway_judge
    responses_api_models:
      openai_model:
        entrypoint: app.py
        openai_base_url: https://inference-api.nvidia.com/v1
        openai_model: nvidia/qwen/qwen-235b
        openai_api_key: ${nv_inference_api_key}
        max_concurrent_requests: 64

  # The pre-sweep scripts pointed abstention and inverse_if at a separately named judge instance.
  # Kept distinct so the two can be repointed without touching the math judge.
  nl2bash_judge_model: *gateway_judge

  # Names the shipped configs already reference: abstention declares genrm_model and inverse_if
  # declares judge_model, and nothing else defines them, so the composed config fails to resolve
  # without these. Defining them also avoids depending on merge order to rebind.
  genrm_model: *gateway_judge
  judge_model: *gateway_judge

  # math_with_judge verifies symbolically via math-verify by default; the judge is the fallback and
  # has to be switched on explicitly.
  math_with_judge:
    resources_servers:
      math_with_judge:
        should_use_judge: true
        judge_model_server:
          type: responses_api_models
          name: math_judge_model

  lc_judge:
    resources_servers:
      equivalence_llm_judge:
        judge_model_server:
          type: responses_api_models
          name: math_judge_model

  equivalence_llm_judge:
    resources_servers:
      equivalence_llm_judge:
        judge_model_server:
          type: responses_api_models
          name: math_judge_model

  multichallenge:
    resources_servers:
      multichallenge:
        judge_model_server:
          type: responses_api_models
          name: math_judge_model

  abstention:
    resources_servers:
      abstention:
        judge_model_server:
          type: responses_api_models
          name: nl2bash_judge_model
        judge_responses_create_params:
          # Upstream caps this at 64. That was fine for a judge that emits a bare verdict, but
          # qwen-235b is a reasoning model and 64 tokens truncates it mid-thought, so the verdict
          # never arrives. The pre-sweep configs raised it to 8192 for exactly this reason; every
          # other judge env here already ships 8192 or no cap. abstention is the lone holdout.
          max_output_tokens: 8192

  inverse_if:
    resources_servers:
      inverse_if:
        judge_model_server:
          type: responses_api_models
          name: nl2bash_judge_model

entries:

  - label: math_cot
    agent: math_with_judge_simple_agent
    configs:
      - resources_servers/math_with_judge/configs/math_with_judge.yaml
    data: /lustre/fsw/portfolios/llmservice/users/jkyi/current/nemo/data_gym/ultra_v3_sets/260501_ultra_v3_set/math_cot/math_cot_260501.jsonl
    owner: igitman

  - label: long_context
    agent: lc_judge_simple_agent
    configs:
      - resources_servers/equivalence_llm_judge/configs/lc_judge.yaml
    data: /lustre/fs1/portfolios/llmservice/projects/llmservice_modelalignment_ppo/users/jiaqiz/data/gym/all_super_env/long_context/0123_chengping_qwenlong_v3b_profiled.jsonl
    owner: fjia

  - label: multichallenge
    agent: multichallenge_simple_agent
    configs:
      - resources_servers/multichallenge/configs/multichallenge.yaml
    data: /lustre/fs1/portfolios/llmservice/projects/llmservice_modelalignment_ppo/users/jiaqiz/data/gym/all_super_env/multichallenge/vanilla_and_advanced_reward_profiled.jsonl
    owner: ???

  - label: stem_openqa_ultra_0
    agent: equivalence_llm_judge_simple_agent
    configs:
      - resources_servers/equivalence_llm_judge/configs/equivalence_llm_judge.yaml
    data: /lustre/fsw/portfolios/llmservice/users/jiaqiz/data/gym/science_rl_rima/subsampled/openq-hard-moderate-cot.jsonl
    owner: ???

  - label: abstention
    agent: abstention_simple_agent
    configs:
      - resources_servers/abstention/configs/abstention.yaml
    data: /lustre/fsw/portfolios/llmservice/users/jiaqiz/data/gym/abstention/all4_combined_train.jsonl
    owner: ???

  - label: inverse_if
    agent: inverse_if_simple_agent
    configs:
      - resources_servers/inverse_if/configs/inverse_if.yaml
    data: /lustre/fsw/portfolios/llmservice/users/jkyi/current/nemo/data_gym/ultra_v3_sets/260501_ultra_v3_set/inverse_if/inverse_if.jsonl
    owner: ???
