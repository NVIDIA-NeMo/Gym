  - label: terminal_pivot
    agent: terminus_judge_string_only_simple_agent
    configs:
      - resources_servers/terminus_judge/configs/terminus_judge_string_only.yaml
    data: data/terminal_pivot.jsonl

  - label: workbench
    agent: workplace_assistant_simple_agent
    configs:
      - resources_servers/workplace_assistant/configs/workplace_assistant.yaml
    data: data/workbench.jsonl

  - label: calendar_v2
