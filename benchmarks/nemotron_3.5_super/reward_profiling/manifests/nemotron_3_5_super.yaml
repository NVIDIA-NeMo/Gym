

# The reward-profiling sweep: every environment, one Gym deployment, one input file.
# Needs SANDBOX_CONTAINER (ns_tools, math_formal_lean) and env.yaml (the judge entries).
# See README "Why these settings" for the reasoning behind the values below.
#
# Local source datasets must be supplied separately.

nickname: nemotron_3_5_super

# Slurm jobs to split across. Nodes = num_shards x (prefill_nodes + decode_nodes) = 160.
num_shards: 16

vllm:
  model: /path/to/model
  # Nodes per shard, 10. The only shape measured since the router and sandbox fixes; one job
  # cannot exceed ~16, and decode limits throughput, so widen that side first.
  prefill_nodes: 2
  decode_nodes: 8

# P/D front end. The stock health-check defaults eject engines for being busy.
vllm_router:
  health_timeout_s: 60
  health_interval_s: 120
  health_failures: 10
  request_timeout_s: 3600        # must be finite and shorter than the walltime
  queue_timeout_s: 600
  circuit_breaker: false
  log_level: info

# Which rows enter the sweep. Unset means every row of every dataset.
# materialize:
#   limit_per_entry: 10000
#   sample: random               # head (default) | random
#   seed: 0

# Each key becomes SBATCH_<KEY>. A launcher's own env var wins.
sbatch:
  account: your_slurm_account
  qos: normal                    # interactive caps at 4 nodes / 8 jobs and fails at submit
  timelimit: "04:00:00"

srun:
# Set this to a sandbox image available in your environment.
  sandbox_container: /path/to/sandbox.sqsh
  # Concurrent code executions per node. sandbox_nodes is unset, so every node in the job runs one.
  sandbox_workers: 64
  # Built from this manifest's entries. A mismatched image hangs rather than erroring.
  container: /path/to/eval.sqsh

gym_eval_run:
  num_repeats: 8                 # rollouts per task; the spread across them is the profile

gym_eval_profile:
  allow_partial_rollouts: true

# Becomes sweep_config.yaml, passed to `gym env start --config`.
gym_env_start:
  policy_model:
    responses_api_models:
      vllm_model:
        num_workers: 16

  port_range_low: 20000
  port_range_high: 30000

  config_paths:
    - responses_api_models/vllm_model/configs/vllm_model.yaml

  math_judge_model: &gateway_judge
    responses_api_models:
      openai_model:
        entrypoint: app.py
        openai_base_url: https://inference-api.nvidia.com/v1
        openai_model: nvidia/qwen/qwen-235b
        openai_api_key: ${nv_inference_api_key}
        max_concurrent_requests: 64

  # The pre-sweep scripts pointed abstention and inverse_if at a separately named judge instance.
  # Kept distinct so the two can be repointed without touching the math judge.
  nl2bash_judge_model: *gateway_judge

  # Names the shipped configs already reference: abstention declares genrm_model and inverse_if
  # declares judge_model, and nothing else defines them, so the composed config fails to resolve
  # without these. Defining them also avoids depending on merge order to rebind.
  genrm_model: *gateway_judge
  judge_model: *gateway_judge

  # math_with_judge verifies symbolically via math-verify by default; the judge is the fallback and
  # has to be switched on explicitly.
  math_with_judge:
    resources_servers:
      math_with_judge:
        should_use_judge: true
        judge_model_server:
          type: responses_api_models
          name: math_judge_model

  lc_judge:
    resources_servers:
      equivalence_llm_judge:
        judge_model_server:
          type: responses_api_models
          name: math_judge_model

  equivalence_llm_judge:
    resources_servers:
      equivalence_llm_judge:
        judge_model_server:
          type: responses_api_models
          name: math_judge_model

  multichallenge:
    resources_servers:
      multichallenge:
        judge_model_server:
          type: responses_api_models
          name: math_judge_model

  abstention:
    resources_servers:
      abstention:
        judge_model_server:
          type: responses_api_models
          name: nl2bash_judge_model
        judge_responses_create_params:
          # Paired with the rebind above, not an independent change. Upstream points abstention at
          # genrm_model -- a GenRM scorer, served locally on its own GPUs -- and nothing here
          # defines that name. We serve judges from the gateway instead, so it has to be a chat
          # judge, and a chat judge grading against app.py's A/B/C prompt needs room for more than
          # a bare letter.
          #
          # Failure is silent, which is why this is generous rather than tight: parse_judge_grade
          # (resources_servers/abstention/app.py:218) falls back to "B" (INCORRECT) on anything it
          # cannot parse, so a judge truncated before its letter scores the rollout wrong rather
          # than erroring. Upstream's 64 fits a bare letter and nothing else. Too high only costs
          # latency on a runaway generation, and matching the ultra-3 branch keeps the measured
          # rates in RATES.md comparable.
          max_output_tokens: 8192

  inverse_if:
    resources_servers:
      inverse_if:
        judge_model_server:
          type: responses_api_models
          name: nl2bash_judge_model

  # The shipped ns_tools.yaml registers only math_with_judge. Our rows carry per-row verifier_type
  # of mcqa and equivalence_llm_judge, and an unregistered name is a hard failure --
  # "ValueError: Unknown verifier: mcqa" surfaces to the driver as a bare 500 from the agent.
  # Registering all three is what lets the three ns_tools entries share one agent.
  ns_tools:
    resources_servers:
      ns_tools:
        verifiers:
          math_with_judge:
            type: resources_servers
            name: math_with_judge
          mcqa:
            type: resources_servers
            name: mcqa
          equivalence_llm_judge:
            type: resources_servers
            name: equivalence_llm_judge
        # Carried over from the pre-sweep configs, which note it improves stability: after a
        # sandbox worker restarts, replaying the session is what tends to wedge the tool call.
        disable_session_restore: true

