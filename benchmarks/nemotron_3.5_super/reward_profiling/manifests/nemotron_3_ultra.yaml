# The reward-profiling sweep: every environment, one Gym deployment, one input file.
#
# Rows carry their own agent_ref and rollout collection dispatches per row, so 36 environments
# across judge / sandbox / neither run as one job rather than 36. That is the whole point of the
# sweep abstraction -- the pre-sweep infrastructure ran ~110 separate sbatch jobs for this.
#
# Requires SANDBOX_CONTAINER (ns_tools, math_formal_lean) and env.yaml (the judge entries). Without
# a sandbox those environments fail per rollout rather than at startup, so check the launcher's
# /health gate rather than waiting on the rollout count.
#
# Provenance: data_gym/ultra_v3_sets/260603_ultra_v3_set_final.

nickname: nemotron_3_ultra

# Becomes sweep_config.yaml, passed to `gym env start --config`.
gym_env_start:
  policy_model:
    responses_api_models:
      vllm_model:
        num_workers: 16

  port_range_low: 20000
  port_range_high: 30000

  config_paths:
    - responses_api_models/vllm_model/configs/vllm_model.yaml

  math_judge_model: &gateway_judge
    responses_api_models:
      openai_model:
        entrypoint: app.py
        openai_base_url: https://inference-api.nvidia.com/v1
        openai_model: nvidia/qwen/qwen-235b
        openai_api_key: ${nv_inference_api_key}
        max_concurrent_requests: 64

  # The pre-sweep scripts pointed abstention and inverse_if at a separately named judge instance.
  # Kept distinct so the two can be repointed without touching the math judge.
  nl2bash_judge_model: *gateway_judge

  # Names the shipped configs already reference: abstention declares genrm_model and inverse_if
  # declares judge_model, and nothing else defines them, so the composed config fails to resolve
  # without these. Defining them also avoids depending on merge order to rebind.
  genrm_model: *gateway_judge
  judge_model: *gateway_judge

  # math_with_judge verifies symbolically via math-verify by default; the judge is the fallback and
  # has to be switched on explicitly.
  math_with_judge:
    resources_servers:
      math_with_judge:
        should_use_judge: true
        judge_model_server:
          type: responses_api_models
          name: math_judge_model

  lc_judge:
    resources_servers:
      equivalence_llm_judge:
        judge_model_server:
          type: responses_api_models
          name: math_judge_model

  equivalence_llm_judge:
    resources_servers:
      equivalence_llm_judge:
        judge_model_server:
          type: responses_api_models
          name: math_judge_model

  multichallenge:
    resources_servers:
      multichallenge:
        judge_model_server:
          type: responses_api_models
          name: math_judge_model

  abstention:
    resources_servers:
      abstention:
        judge_model_server:
          type: responses_api_models
          name: nl2bash_judge_model
        judge_responses_create_params:
          # Paired with the rebind above, not an independent change. Upstream points abstention at
          # genrm_model -- a GenRM scorer, served locally on its own GPUs -- and nothing here
          # defines that name. We serve judges from the gateway instead, so it has to be a chat
          # judge, and a chat judge grading against app.py's A/B/C prompt needs room for more than
          # a bare letter.
          #
          # 64 is enough for a compliant "A", so this may never bind. It matters because failure is
          # silent: parse_judge_grade (resources_servers/abstention/app.py:218) falls back to "B"
          # (INCORRECT) on anything it cannot parse, so a judge truncated before its letter scores
          # the rollout wrong rather than erroring. 8192 matches what the ultra-3 branch runs.
          max_output_tokens: 8192

  inverse_if:
    resources_servers:
      inverse_if:
        judge_model_server:
          type: responses_api_models
          name: nl2bash_judge_model


  # The shipped ns_tools.yaml registers only math_with_judge. Our rows carry per-row verifier_type
  # of mcqa and equivalence_llm_judge, and an unregistered name is a hard failure --
  # "ValueError: Unknown verifier: mcqa" surfaces to the driver as a bare 500 from the agent.
  # Registering all three is what lets the three ns_tools entries share one agent.
  ns_tools:
    resources_servers:
      ns_tools:
        verifiers:
          math_with_judge:
            type: resources_servers
            name: math_with_judge
          mcqa:
            type: resources_servers
            name: mcqa
          equivalence_llm_judge:
            type: resources_servers
            name: equivalence_llm_judge
        # Carried over from the pre-sweep configs, which note it improves stability: after a
        # sandbox worker restarts, replaying the session is what tends to wedge the tool call.
        disable_session_restore: true


# Which rows enter the sweep, read by `01_materialize.sh`.
# Unset limits mean every row of every dataset, which is what a real profiling run wants.
# Uncomment to commit a subset -- LIMIT_PER_ENTRY is for smoke runs and only lowers these.
# materialize:
#   limit_per_entry: 10000   # rows per entry, unless the entry sets its own `limit`
#   sample: random           # head (default, stops reading at the limit) | random (reads all)
#   seed: 0                  # seeds `random`; mixed with each entry's label


# Slurm settings, read by the launchers that shell out to `sbatch`. Each key becomes
# SBATCH_<KEY>, so anything under INPUT ENVIRONMENT VARIABLES in `man sbatch` works. A launcher's
# own env var wins, so override per run without editing this file.
sbatch:
  account: nemotron_n3_post
  qos: interactive
  timelimit: "04:00:00"


# Containers, for `srun --container-image`.
srun:
  # Only one arm64 build of the sandbox exists; ns_tools and math_formal_lean need it, and without
  # it they fall back to 127.0.0.1:6000 and fail with a bare 500 per rollout.
  sandbox_container: /lustre/fsw/portfolios/llmservice/users/igitman/images/nemo-skills-sandbox-0.7.1-arm64.sqsh
  # Built by ../../build_eval_container.sh from configs/container_config.yaml, which is generated
  # from this manifest -- so the image has exactly these entries' servers baked in. Rebuild and
  # update this when an entry pulls in a new server; running against an image built for a different
  # manifest presents as a hang, not an error. Override with CONTAINER for a one-off.
  container: "/lustre/fsw/portfolios/llmservice/users/jkyi/current/nemo/Gym-github_worktrees/reward-profiling/results/vllm/vllm-openai:v0.27.1___tomer_with_gym_all.sqsh"


# What gets served, i.e. `vllm serve <model>`; also passed as ++policy_model_name.
# Pinned so the manifest is reproducible on its own and a run needs no arguments at all. Profiling
# a different checkpoint means MODEL=<ckpt> on the command line, which overrides this -- change
# `nickname` too, or the new run's artifacts land in the same directory as the old one's.
vllm:
  model: /lustre/fsw/portfolios/llmservice/users/abukharin/super35_dualds0821_pure_lm_ab/hf_text/full_generalist_prod/iter_6500
  # Nodes per shard = prefill + decode, so this is 3. Capped near 16 by --segment, which needs a
  # topology-contiguous allocation and an NVL72 rack is 18 nodes. Decode limits throughput, so
  # widen that side first.
  prefill_nodes: 1
  decode_nodes: 2

# Runtime settings for `gym eval run --no-serve`.
gym_eval_run:
  num_repeats: 8


