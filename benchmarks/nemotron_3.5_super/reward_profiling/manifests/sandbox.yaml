# Reward-profiling sweep: environments needing a code-execution sandbox.
#
# ns_tools and math_formal_lean read NEMO_SKILLS_SANDBOX_HOST/PORT from the environment, so no
# sandbox config is needed here -- the launcher starts the sandbox and points them at it.
#
# The three ns_tools entries share an agent but carry per-row verifier_type (math_with_judge,
# mcqa, equivalence_llm_judge), which overrides the server's default_verifier. They coexist.
#
# stem_openqa_tools_ultra_0 also needs a judge, hence judges_remote.yaml below.

nickname: super35_sandbox

defaults:
  num_repeats: 8

extra_configs:
  - responses_api_models/vllm_model/configs/vllm_model.yaml
  - benchmarks/nemotron_3.5_super/reward_profiling/configs/judges_remote.yaml

entries:

  - label: math_tir
    agent: ns_tools_simple_agent
    configs:
      - resources_servers/ns_tools/configs/ns_tools.yaml
      - resources_servers/math_with_judge/configs/math_with_judge.yaml
    data: /lustre/fsw/portfolios/llmservice/users/jkyi/current/nemo/data_gym/ultra_v3_sets/260501_ultra_v3_set/math_tir/math_tir_260501.jsonl
    owner: jkyi

  - label: stem_mcqa_tools_ultra_0
    agent: ns_tools_simple_agent
    configs:
      - resources_servers/ns_tools/configs/ns_tools.yaml
      - resources_servers/equivalence_llm_judge/configs/equivalence_llm_judge.yaml
      - resources_servers/mcqa/configs/mcqa.yaml
    data: /lustre/fsw/portfolios/llmservice/users/jkyi/current/nemo/data_gym/science_rl_rima/subsampled/stem0417_tools_mcq_converted_subsampled_20k.jsonl
    owner: jkyi

  - label: stem_openqa_tools_ultra_0
    agent: ns_tools_simple_agent
    configs:
      - resources_servers/ns_tools/configs/ns_tools.yaml
      - resources_servers/equivalence_llm_judge/configs/equivalence_llm_judge.yaml
      - resources_servers/mcqa/configs/mcqa.yaml
    data: /lustre/fsw/portfolios/llmservice/users/jiaqiz/data/gym/science_rl_rima/subsampled/openq-hard-moderate-tools.jsonl
    owner: jiaqiz

  - label: lean
    agent: math_formal_lean_refinement_agent
    configs:
      - resources_servers/math_formal_lean/configs/math_formal_lean_multi_turn.yaml
    data: /lustre/fs1/portfolios/llmservice/projects/llmservice_modelalignment_ppo/users/jiaqiz/data/gym/all_super_env/lean/nemotron_math_proofs_10k_with_pass_rate_1000.jsonl
    owner: jiaqiz
