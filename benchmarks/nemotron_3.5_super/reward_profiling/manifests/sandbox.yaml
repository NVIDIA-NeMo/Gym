# Reward-profiling sweep: environments needing a code-execution sandbox.
#
# ns_tools and math_formal_lean read NEMO_SKILLS_SANDBOX_HOST/PORT from the environment, so no
# sandbox config is needed here -- the launcher starts the sandbox and points them at it.
#
# The three ns_tools entries share an agent but carry per-row verifier_type (math_with_judge,
# mcqa, equivalence_llm_judge), which overrides the server's default_verifier. They coexist.
#

nickname: super35_sandbox

defaults:
  num_repeats: 8

extra_configs:
  - responses_api_models/vllm_model/configs/vllm_model.yaml

# --- judge deployment ---------------------------------------------------------------------------
# Everything under config_overlay is ordinary Gym config, verbatim -- the same yaml you would write
# in resources_servers/<name>/configs/, just inline. It is copied unchanged into the emitted
# sweep_config.yaml as top-level keys, and since a config overrides anything its own config_paths
# pulled in, these win over every file listed above. Hence "overlay".
#
# Inline rather than a separate config file on purpose: the container is built from a Gym ref and
# does not contain this repo, so a repo-relative extra_config path does not resolve inside it,
# whereas sweep_config.yaml lives in SWEEP_DIR and is always mounted.
#
# Each resources server names its judge; it never names an endpoint. Binding a judge is assigning
# that name here. Every key below is distinct, so there are no collisions.
#
# Self-hosting instead: rebind these names to local_vllm_model (see
# benchmarks/nemotron_3_ultra/judge_local_endpoints.yaml). The pre-sweep scripts ran 47 separate
# judge jobs, including sixteen 4-node Qwen3-235B servers for long_context alone; the gateway
# removes that, at the cost of depending on its throughput.
#
# nv_inference_api_key comes from env.yaml, which the launchers mount.
#
# max_concurrent_requests is not optional at sweep scale. The transport retries 429s with a flat
# 0.5s sleep and *extends* its retry budget on rate-limit codes, so a saturated judge degrades into
# a retry storm rather than backpressure. Total load is this value times the number of drivers.
config_overlay:

  math_judge_model: &gateway_judge
    responses_api_models:
      openai_model:
        entrypoint: app.py
        openai_base_url: https://inference-api.nvidia.com/v1
        openai_model: nvidia/qwen/qwen-235b
        openai_api_key: ${nv_inference_api_key}
        max_concurrent_requests: 64

  # math_with_judge verifies symbolically via math-verify by default; the judge is the fallback and
  # has to be switched on explicitly.
  math_with_judge:
    resources_servers:
      math_with_judge:
        should_use_judge: true
        judge_model_server:
          type: responses_api_models
          name: math_judge_model

  equivalence_llm_judge:
    resources_servers:
      equivalence_llm_judge:
        judge_model_server:
          type: responses_api_models
          name: math_judge_model

  # The shipped ns_tools.yaml registers only math_with_judge. Our rows carry per-row verifier_type
  # of mcqa and equivalence_llm_judge, and an unregistered name is a hard failure --
  # "ValueError: Unknown verifier: mcqa" surfaces to the driver as a bare 500 from the agent.
  # Registering all three is what lets the three ns_tools entries share one agent.
  ns_tools:
    resources_servers:
      ns_tools:
        verifiers:
          math_with_judge:
            type: resources_servers
            name: math_with_judge
          mcqa:
            type: resources_servers
            name: mcqa
          equivalence_llm_judge:
            type: resources_servers
            name: equivalence_llm_judge
        # Carried over from the pre-sweep configs, which note it improves stability: after a
        # sandbox worker restarts, replaying the session is what tends to wedge the tool call.
        disable_session_restore: true

entries:

  - label: math_tir
    agent: ns_tools_simple_agent
    configs:
      - resources_servers/ns_tools/configs/ns_tools.yaml
      - resources_servers/math_with_judge/configs/math_with_judge.yaml
    data: /lustre/fsw/portfolios/llmservice/users/jkyi/current/nemo/data_gym/ultra_v3_sets/260501_ultra_v3_set/math_tir/math_tir_260501.jsonl
    owner: ???

  - label: stem_mcqa_tools_ultra_0
    agent: ns_tools_simple_agent
    configs:
      - resources_servers/ns_tools/configs/ns_tools.yaml
      - resources_servers/equivalence_llm_judge/configs/equivalence_llm_judge.yaml
      - resources_servers/mcqa/configs/mcqa.yaml
    data: /lustre/fsw/portfolios/llmservice/users/jkyi/current/nemo/data_gym/science_rl_rima/subsampled/stem0417_tools_mcq_converted_subsampled_20k.jsonl
    owner: ???

  - label: stem_openqa_tools_ultra_0
    agent: ns_tools_simple_agent
    configs:
      - resources_servers/ns_tools/configs/ns_tools.yaml
      - resources_servers/equivalence_llm_judge/configs/equivalence_llm_judge.yaml
      - resources_servers/mcqa/configs/mcqa.yaml
    data: /lustre/fsw/portfolios/llmservice/users/jiaqiz/data/gym/science_rl_rima/subsampled/openq-hard-moderate-tools.jsonl
    owner: ???

  - label: lean
    agent: math_formal_lean_refinement_agent
    configs:
      - resources_servers/math_formal_lean/configs/math_formal_lean_multi_turn.yaml
    data: /lustre/fs1/portfolios/llmservice/projects/llmservice_modelalignment_ppo/users/jiaqiz/data/gym/all_super_env/lean/nemotron_math_proofs_10k_with_pass_rate_1000.jsonl
    owner: igitman
