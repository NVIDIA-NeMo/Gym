# Shared auxiliary-model connections for container builds and core evaluation.
# Callers supply nv_inference_api_key; limits and benchmark settings stay in each recipe.

# Tau2 simulated customer.
gpt-5_2-2025-12-11:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: https://inference-api.nvidia.com/v1
      openai_api_key: ${nv_inference_api_key}
      openai_model: openai/openai/gpt-5.2

