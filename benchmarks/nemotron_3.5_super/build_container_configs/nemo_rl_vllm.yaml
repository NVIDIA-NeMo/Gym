# Reuse the SOTA build stages and Slurm settings in NeMo-RL's worker environment.
config_paths:
  - benchmarks/nemotron_3.5_super/build_container_configs/current_sota.yaml

# Need to override these
input_container_fpath: null
output_container_fpath: null

python_executable: /opt/ray_venvs/nemo_rl.models.generation.vllm.vllm_worker_async.VllmAsyncGenerationWorker/bin/python

vllm:
  branch: bxyu/v0.32.0-dwdpnvfp4-rlrefit
  # Match the trainer's NCCL runtime and refit bindings (NeMo RL uv.lock).
  # vLLM's torch dependencies otherwise replace NCCL with 2.29.7.
  dependency_overrides:
    - nvidia-nccl-cu13==2.32.3
    - nccl4py==0.5.0

vllm_router:
  branch: bxyu/nemo-rl-pd

# Use the output as CONTAINER in the RL launcher. Warm up and serve through RL:
# Gym's serving stages would launch outside the vLLM actor environment.
warmup: null
run: null
