config_paths:
  - benchmarks/nemotron_3.5_super/build_container_configs/swe_8n-11_reward_profiling.yaml

slurm:
  account: nemotron_n4_longeval
  qos: n4_longeval
  partition: batch_long

shared_run_warmup_env_vars:
  NUM_PREFILL_NODES: 8
  NUM_DECODE_NODES: 8
  SEGMENT: 1
  VLLM_CONFIG: benchmarks/nemotron_3.5_super/vllm_configs/nemotron_3.5_super_withmetrics.sh

run:
  env:
    EXPERIMENT_NAME: swe_20261118/super_3.5_GA-BF16-p6d6-rewardprofiling
    SBATCH_TIMELIMIT: "12:00:00"
  # The input JSONL supplies the tasks. Clear R2E's unused catalog entry, whose
  # free-form license string is rejected by Gym's dataset schema. Disable
  # compaction/pruning for the six agents not covered by sandbox_utils.yaml.
  args: |
    --config responses_api_models/vllm_model/configs/vllm_model.yaml \
    --config resources_servers/swe_rebench/configs/swe_rebench_opencode.yaml \
    --config resources_servers/scale_swe/configs/scale_swe_opencode.yaml \
    --config resources_servers/swemer_v1/configs/swemer_v1_opencode.yaml \
    --config resources_servers/swemer_v2/configs/swemer_v2_opencode.yaml \
    --config resources_servers/swe_next/configs/swe_next_opencode.yaml \
    --config resources_servers/deepswe_external1/configs/deepswe_external1_opencode.yaml \
    --config resources_servers/swemer_ultra/configs/swemer_ultra_opencode.yaml \
    --config resources_servers/r2e_gym/configs/r2e_gym_opencode.yaml \
    --config resources_servers/swe_gym/configs/swe_gym_opencode.yaml \
    --config resources_servers/swemer_oml/configs/swemer_oml_opencode.yaml \
    --config resources_servers/swe_internal_v1/configs/swe_internal_v1_opencode.yaml \
    ++deepswe_external1_opencode_sandboxed_agent.responses_api_agents.opencode_sandboxed_agent.opencode_config.compaction.auto=false \
    ++deepswe_external1_opencode_sandboxed_agent.responses_api_agents.opencode_sandboxed_agent.opencode_config.compaction.prune=false \
    ++swemer_ultra_opencode_sandboxed_agent.responses_api_agents.opencode_sandboxed_agent.opencode_config.compaction.auto=false \
    ++swemer_ultra_opencode_sandboxed_agent.responses_api_agents.opencode_sandboxed_agent.opencode_config.compaction.prune=false \
    ++r2e_gym_opencode_sandboxed_agent.responses_api_agents.opencode_sandboxed_agent.opencode_config.compaction.auto=false \
    ++r2e_gym_opencode_sandboxed_agent.responses_api_agents.opencode_sandboxed_agent.opencode_config.compaction.prune=false \
    ++swe_gym_opencode_sandboxed_agent.responses_api_agents.opencode_sandboxed_agent.opencode_config.compaction.auto=false \
    ++swe_gym_opencode_sandboxed_agent.responses_api_agents.opencode_sandboxed_agent.opencode_config.compaction.prune=false \
    ++swemer_oml_opencode_sandboxed_agent.responses_api_agents.opencode_sandboxed_agent.opencode_config.compaction.auto=false \
    ++swemer_oml_opencode_sandboxed_agent.responses_api_agents.opencode_sandboxed_agent.opencode_config.compaction.prune=false \
    ++swe_internal_v1_opencode_sandboxed_agent.responses_api_agents.opencode_sandboxed_agent.opencode_config.compaction.auto=false \
    ++swe_internal_v1_opencode_sandboxed_agent.responses_api_agents.opencode_sandboxed_agent.opencode_config.compaction.prune=false \
    ++r2e_gym_opencode_sandboxed_agent.responses_api_agents.opencode_sandboxed_agent.datasets=[] \
    ++input_jsonl_fpath=data/swe_20261118.jsonl \
    ++num_repeats=8 \
    ++num_samples_in_parallel=7168
