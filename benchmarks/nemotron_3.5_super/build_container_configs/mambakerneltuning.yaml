input_container_fpath: results/vllm/vllm-openai:v0.32.0___with_gym_vllmfixes___dwdp_nvfp4.sqsh
output_container_fpath: results/vllm/vllm-openai:v0.32.0___with_gym_vllmfixes___mambakerneltuning.sqsh

slurm:
  account: nemotron_rl_algo
  partition: batch
  qos: short
  gpus-per-node: "4"
  mem: "0"
  container-mounts: ${oc.env:PWD}:${oc.env:PWD}

vllm:
  repo: https://github.com/bxyu-nvidia/vllm.git
  branch: bxyu/v0.32.0-mambakerneltuning
  version: "0.32.0"
  precompiled_wheel_commit: v0.32.0

shared_run_warmup_env_vars:
  MODEL: ${oc.env:PWD}/results/Nemotron-3.5-Super-VL-120B-A12B-GA-candidate-MTP-boosted-20261001
  VLLM_CONFIG: benchmarks/nemotron_3.5_super/vllm_configs/nemotron_3.5_super_dwdp_nvfp4.sh
  NUM_PREFILL_NODES: 2
  NUM_DECODE_NODES: 2
  ENABLE_MOONCAKE: 1
  VLLM_PREFILL_ENGINES_PER_NODE: 4
  VLLM_DECODE_ENGINES_PER_NODE: 1
  # Prefill APIs are DP1; decode's API balances its four DP ranks internally.
  ROUTER_INTRA_NODE_DATA_PARALLEL_SIZE: 1
  SLURM_COMMENT: '{"OccupiedIdleGPUsJobReaper":{"exemptIdleTimeMins":"720","reason":"benchmarking","description":"POR - https://nvaiinfa.aha.io/ideas/ideas/NMP-I-791"}}'
  MOUNTS: ${oc.env:PWD}:${oc.env:PWD},${oc.env:PWD}:/opt/Gym

warmup:
  env:
    _copy: shared_run_warmup_env_vars
    ROUTER_WORKER_STARTUP_TIMEOUT_SECONDS: 3600
    SBATCH_TIMELIMIT: "01:30:00"
    # Compilation
    MAX_JOBS: 64
    FLASHINFER_NVCC_THREADS: 4
    # Debug env vars
    # CUDA_LOG_FILE: stderr
    # PYTHONFAULTHANDLER: "1"
    # CUTE_DSL_FILTER_STACKTRACE: "0"
    # CUTE_DSL_LOG_TO_CONSOLE: "1"
    # CUTE_DSL_LOG_LEVEL: "30"
    # FLASHINFER_DEBUG_FC2: "1"

run:
  env:
    _copy: shared_run_warmup_env_vars
    EXPERIMENT_NAME: opencode_swe_verified/super_3.5_GA-BF16-p2d2-dwdp-nvfp4
    SBATCH_TIMELIMIT: "01:30:00"
  args: |
    --config responses_api_models/vllm_model/configs/vllm_model.yaml \
    --config benchmarks/swebench/verified/opencode.yaml \
    ++swebench_verified_opencode_sandboxed_agent.responses_api_agents.opencode_sandboxed_agent.sandbox_timeout=2700 \
    ++num_samples_in_parallel=1024
