input_container_fpath: results/vllm/vllm-openai:v0.32.0___with_gym.sqsh
output_container_fpath: results/vllm/vllm-openai:v0.32.0___with_gym___fixduplicatemambaforward.sqsh

slurm:
  account: nemotron_n4_post
  partition: batch
  qos: short
  gpus-per-node: "4"
  mem: "0"

vllm:
  repo: https://github.com/bxyu-nvidia/vllm.git
  branch: bxyu/v0.32.0-fixduplicatemambaforward
  version: "0.32.0"
  precompiled_wheel_commit: v0.32.0

vllm_router:
  repo: https://github.com/bxyu-nvidia/router
  branch: bxyu/fix-healthcheck
  cpus_per_task: 16

mooncake:
    repo: https://github.com/bxyu-nvidia/Mooncake.git
    branch: bxyu/v0.3.13.post1-mooncakemetricstry2
    cpus_per_task: 96
    build_parallel_level: 96

shared_run_warmup_env_vars:
  MODEL: ${oc.env:PWD}/results/Nemotron-3.5-Super-VL-120B-A12B-GA-candidate-MTP-boosted-20261001
  VLLM_CONFIG: benchmarks/nemotron_3.5_super/vllm_configs/nemotron_3.5_super.sh
  NUM_PREFILL_NODES: 2
  NUM_DECODE_NODES: 2
  ENABLE_MOONCAKE: 1
  ROUTER_INTRA_NODE_DATA_PARALLEL_SIZE: 4
  SLURM_COMMENT: '{"OccupiedIdleGPUsJobReaper":{"exemptIdleTimeMins":"720","reason":"benchmarking","description":"POR - https://nvaiinfa.aha.io/ideas/ideas/NMP-I-791"}}'
  MOUNTS: ${oc.env:PWD}:${oc.env:PWD},${oc.env:PWD}:/opt/Gym

warmup:
  env:
    _copy: shared_run_warmup_env_vars
    SBATCH_TIMELIMIT: "01:00:00"
    # Compilation
    MAX_JOBS: 64
    FLASHINFER_NVCC_THREADS: 1

run:
  env:
    _copy: shared_run_warmup_env_vars
    EXPERIMENT_NAME: opencode_swe_verified/super_3.5_GA-BF16-p2d2-dp4tp1
    SBATCH_TIMELIMIT: "01:30:00"
  args: |
    --config responses_api_models/vllm_model/configs/vllm_model.yaml \
    --config benchmarks/swebench/verified/opencode.yaml \
    ++swebench_verified_opencode_sandboxed_agent.responses_api_agents.opencode_sandboxed_agent.sandbox_timeout=2700 \
    ++num_samples_in_parallel=1024
