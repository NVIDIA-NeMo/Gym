config_paths:
- benchmarks/nemotron_3.5_super/eval_container_config.yaml

# @bxyu-nvidia: We manually copy over the datasets here, onto the same resources-server
# blocks the base config empties, so each dataset stays declared exactly once.
opencode_swebench_verified_resources_server:
  resources_servers:
    swebench:
      datasets:
      - name: swebench_verified
        type: benchmark
        jsonl_fpath: benchmarks/swebench/data/swebench_verified_benchmark.jsonl
        prepare_script: benchmarks/swebench/verified/prepare.py
        num_repeats: 3

opencode_swebench_multilingual_resources_server:
  resources_servers:
    swebench:
      datasets:
      - name: swebench_multilingual
        type: benchmark
        jsonl_fpath: benchmarks/swebench/data/swebench_multilingual_benchmark.jsonl
        prepare_script: benchmarks/swebench/multilingual/prepare.py
        num_repeats: 3

opencode_deepswe_resources_server:
  resources_servers:
    deepswe:
      datasets:
      - name: deepswe_v1_1
        type: benchmark
        jsonl_fpath: benchmarks/deepswe/data/deepswe_benchmark.jsonl
        prepare_script: benchmarks/deepswe/prepare.py
        num_repeats: 5

opencode_sandboxed_agent_terminal_bench_2_1:
  responses_api_agents:
    opencode_sandboxed_agent:
      datasets:
        - name: terminal_bench_2_1
          type: benchmark
          jsonl_fpath: benchmarks/terminal_bench_2_1/data/benchmark.jsonl
          prepare_script: benchmarks/terminal_bench_2_1/prepare.py
          num_repeats: 8
