########################################
# START Secrets
# The following secrets identified with `dummy` must be filled in via env.yaml at runtime
########################################

nv_inference_api_key: dummy  # pragma: allowlist secret

# Used in SWE Verified
sandbox:
  opensandbox:
    connection:
      domain: dummy
      api_key: dummy  # pragma: allowlist secret

critpt_benchmark_resources_server:
  resources_servers:
    critpt:
      api_key: dummy  # pragma: allowlist secret

########################################
# END Secrets
########################################

########################################
# START Nvidia-specific configs
########################################

policy_base_url: dummy
policy_api_key: dummy  # pragma: allowlist secret
policy_model_name: dummy

# Tau2 and Tau3 servers may take a long time to spin up since we import the Tau repo which has hefty dependencies.
uvicorn_timeout_worker_healthcheck: 600  # 10 mins
upload_rollouts_to_wandb: false  # Rollouts file is massive. We leave on the cluster.
global_aiohttp_connector_limit_per_host: 16384  # 16k concurrent requests should be enough. We can raise further if our inference is efficient enough to support.
port_range_low: 63000  # Move into ephemeral ports
port_range_high: 64000
overwrite_metrics_conflicts: true
split: benchmark
use_absolute_ip: true  # Necessary for communication between harness in sandbox and Gym model servers
reuse_existing_data_preparation: true
skip_venv_if_present: true  # Reuse the venvs baked into the container if possible.

# Used in Tau3 Banking
gpt-5_4-mini-2026-03-17:
  responses_api_models:
    openai_model:
      openai_base_url: https://inference-api.nvidia.com/v1
      openai_model: azure/openai/gpt-5.4-mini
      openai_api_key: ${nv_inference_api_key}

# Used in AA-LCR
Qwen3-235B-A22B-Instruct-2507-FP8:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      model: nvidia/qwen/qwen-235b
      base_url: https://inference-api.nvidia.com/v1
      api_key: ${nv_inference_api_key}

# Used in Tau2
gpt-5_2-2025-12-11:
  responses_api_models:
    openai_model:
      openai_base_url: https://inference-api.nvidia.com/v1
      openai_model: openai/openai/gpt-5.2
      openai_api_key: ${nv_inference_api_key}

# Used in AA-Omniscience
# TODO @bxyu-nvidia: Need to properly rename this and add this Gemini config
genrm_model:
  responses_api_models:
    openai_model:
      openai_base_url: https://inference-api.nvidia.com/v1
      openai_model: gcp/google/gemini-3-flash-preview
      openai_api_key: ${nv_inference_api_key}
      max_concurrent_requests: 16

policy_model:
  responses_api_models:
    vllm_model:
      num_workers: 16

# TODO @bxyu-nvidia: Remove this to turn on SWE Verified after it is validated. This is a placeholder for container build.
opencode_sandboxed_agent_swebench_verified:
  _inherit_from: opencode_sandboxed_agent
  responses_api_agents:
    opencode_sandboxed_agent:
      resources_server:
        type: resources_servers
        name: opencode_swebench_verified_resources_server
      datasets: []

########################################
# END Nvidia-specific configs.
########################################
