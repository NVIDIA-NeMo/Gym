config_paths:
- nemo_gym/sandbox/providers/opensandbox/configs/opensandbox.yaml

swebench_verified_opencode_sandboxed_agent:
  responses_api_agents:
    opencode_sandboxed_agent:
      remote_opencode_install_script_path: /mnt/s3-data/data/bxyu/opencode/install.sh
      remote_opencode_binary_path: /mnt/s3-data/data/bxyu/opencode/opencode-linux-x64

swebench_multilingual_opencode_sandboxed_agent:
  responses_api_agents:
    opencode_sandboxed_agent:
      remote_opencode_install_script_path: /mnt/s3-data/data/bxyu/opencode/install.sh
      remote_opencode_binary_path: /mnt/s3-data/data/bxyu/opencode/opencode-linux-x64

# DeepSWE's agent sandbox has no internet access, so OpenCode runs the mounted binary instead of downloading one. The
# digest is that of `package/bin/opencode` in npm's opencode-linux-x64@1.17.11 (the x86_64 glibc build); session setup
# refuses any other file.
deepswe_opencode_agent:
  responses_api_agents:
    opencode_agent:
      sandbox_executable_path: /mnt/s3-data/data/bxyu/opencode/opencode-linux-x64
      sandbox_executable_sha256: 0254a429cd0e6cf0ba53fc01672cf98e4a8dc728f7fa94be88f1e4b3645e6ded  # pragma: allowlist secret (public runtime digest)

# Verified OpenCode 1.17.11 binaries (Linux x64) that benchmarks/swebench/pro/opencode.yaml selects by task-image
# libc. A top-level block, not a swebench_pro_opencode_agent block, so configs without that recipe stay unchanged.
swebench_pro_opencode_runtime:
  glibc_path: /mnt/s3-data/data/bxyu/opencode/opencode-linux-x64
  glibc_sha256: 0254a429cd0e6cf0ba53fc01672cf98e4a8dc728f7fa94be88f1e4b3645e6ded  # pragma: allowlist secret
  musl_path: /mnt/s3-data/data/bxyu/opencode/opencode-linux-x64-musl-v1.17.11
  musl_sha256: 674a7e3c4e397bd58452bdaf3da83800f4eb541029bfc6306b24b4d788a87eec  # pragma: allowlist secret

swebench_pro_opencode_sandboxed_agent:
  responses_api_agents:
    opencode_sandboxed_agent:
      remote_opencode_install_script_path: /mnt/s3-data/data/bxyu/opencode/install_cached_opencode.sh
      remote_opencode_binary_path: /mnt/s3-data/data/bxyu/opencode/opencode-linux-x64
      remote_opencode_musl_binary_path: /mnt/s3-data/data/bxyu/opencode/opencode-linux-x64-musl-v1.17.11

terminal_bench_2_1_opencode_sandboxed_agent:
