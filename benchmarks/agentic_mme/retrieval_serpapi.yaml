# Overlay on benchmarks/agentic_mme/config.yaml: live web search through serpapi.
# Key read from the environment (SERPAPI_API_KEY); fetch_webpage uses Jina Reader (JINA_API_KEY if set; anonymous otherwise is rate-limited).
# Google Lens is on: task images are uploaded to SerpAPI's own Image API (no ImgBB), expiring after 10 minutes.
agentic_mme_agent:
  responses_api_agents:
    agentic_mme_agent:
      retrieval:
        mode: live
        search_provider: serpapi
        serpapi_api_key: ${oc.env:SERPAPI_API_KEY,""}
        allow_image_upload: true
        jina_api_key: ${oc.env:JINA_API_KEY,""}
