config_paths:
- resources_servers/chemeval/configs/chemeval.yaml
chemeval_simple_agent:
  responses_api_agents:
    simple_agent:
      max_steps: 1
chemeval:
  resources_servers:
    chemeval:
      judge_model_server:
        type: responses_api_models
        name: policy_model
      judge_responses_create_params:
        input: []
        temperature: 0
        max_output_tokens: 16384
      datasets:
      - name: chemeval
        type: benchmark
        jsonl_fpath: benchmarks/chemeval/data/test.jsonl
        prepare_script: benchmarks/chemeval/prepare.py
        num_repeats: 1
