name: ragtruth
version: 0.1.0
experimental: true
kind: benchmark
integration_profile: custom-gym-verifier
domain: knowledge
description: RAGTruth hallucination detection over QA, summary, and data-to-text slices;
  reward is binary verdict accuracy.
modality: text
licensing: MIT
authors:
- Maria Bagdasarova
maintainers:
- pachmu
intended_use:
- evaluation
primary_metric: mean_reward
requirements:
