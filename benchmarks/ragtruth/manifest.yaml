  network: no-network
reward:
  range:
  - 0.0
  - 1.0
  higher_is_better: true
determinism: unknown
resources_server: ragtruth
agent_server: simple_agent
datasets:
- name: ragtruth
  type: benchmark
  jsonl_fpath: benchmarks/ragtruth/data/ragtruth_benchmark.jsonl
  prepare_script: benchmarks/ragtruth/prepare.py
  num_repeats: 1
model_server: policy_model
canonical_split: test
prompt_source: prepared
adopted_from:
  source: https://github.com/ParticleMedia/RAGTruth
  ref: c103204b9ce28d6bbad859304bf30de72b8ed8fe
  reconciled: '2026-07-14'
lifecycle: active
