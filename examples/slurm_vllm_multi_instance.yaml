compute:
  cluster:
    type: slurm
    hostname: myslurmcluster
    walltime: "01:00:00"
    account: myaccount
    node_pools:
      compute:
        partition: batch
        nodes: 1
        ntasks_per_node: 1
        gpus_per_node: 8

services:
  vllm_model:
    container: vllm/vllm-openai:v0.9.0
    type: vllm
    model: Qwen/Qwen2.5-7B-Instruct
    trust_remote_code: true
    tensor_parallel_size: 2
    number_of_instances: 4       # 4 engine replicas, total 8 GPUs
    distributed_backend:
      type: vllm_service         # vLLM native --data-parallel-size; ray_serve/dynamo coming later
    port: 8000
    health_check:
      timeout_seconds: 1200
    mounts:
      - /lustre/datasets:/data

driver:
  policy_model: vllm_model
  container: python:3.13
  gym_install:
    ref: main
  benchmarks:
    gpqa:
      run:
        split: benchmark
        config_paths:
          - benchmarks/gpqa/config.yaml

job:
  output_path: /lustre/fsw/my-path
