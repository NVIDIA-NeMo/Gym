compute:
  cluster:
    type: slurm
    hostname: myslurmcluster
    walltime: "01:00:00"
    account: myaccount
    node_pools:
      compute:
        partition: batch
        nodes: 2
        ntasks_per_node: 1
        gpus_per_node: 8

services:
  vllm_model:
    container: vllm/vllm-openai:v0.9.0
    type: vllm
    model: Qwen/Qwen2.5-72B-Instruct
    trust_remote_code: true
    tensor_parallel_size: 2      # 8 instances x TP2 = 16 GPUs total, spans both nodes (2 x 8 GPUs)
    number_of_instances: 8       # needs the ray backend since the footprint exceeds one node
    distributed_backend:
      type: ray                  # vLLM's Ray core executor (--distributed-executor-backend ray).
                                  # Not the ray.serve library - just lets vLLM's instances span nodes.
                                  # A separate ray_serve backend may be added later.
    port: 8000
    health_check:
      timeout_seconds: 1200
    mounts:
      - /lustre/datasets:/data

driver:
  policy_model: vllm_model
  container: python:3.13
  gym_install:
    ref: main
  benchmarks:
    gpqa:
      run:
        split: benchmark
        config_paths:
          - benchmarks/gpqa/config.yaml

job:
  output_path: /lustre/fsw/my-path
