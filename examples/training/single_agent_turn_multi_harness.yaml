# Gym pairing config; use with the existing NeMo RL recipe and launcher.
config_paths:
- responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
- responses_api_agents/opencode_agent/configs/opencode_agent.yaml
- responses_api_agents/pi_agent/configs/pi_agent.yaml
- environment_servers/single_agent_turn/configs/single_agent_turn.yaml
- resources_servers/swe_rebench/configs/swe_rebench_legacy_agent.yaml
- resources_servers/swemer_v1/configs/swemer_v1_legacy_agent.yaml
- resources_servers/swemer_v2/configs/swemer_v2_legacy_agent.yaml
- resources_servers/swe_internal_v1/configs/swe_internal_v1_legacy_agent.yaml
use_absolute_ip: true
absolute_ip_server_types:
- responses_api_models
model_call_sampling:
  required_model_servers:
  - policy_model
environment_server_routes:
  swe_rebench: swe_rebench_single_agent_turn
  swemer_v1: swemer_v1_single_agent_turn
  swemer_v2: swemer_v2_single_agent_turn
  swe_internal_v1: swe_internal_v1_single_agent_turn
swe_rebench_resources_server:
  resources_servers:
    swe_rebench:
      allowed_agents:
      - opencode_agent
      datasets:
      - name: swe_rebench
        type: train
        taskset: swe_rebench
        jsonl_fpath: resources_servers/swe_rebench/data/swe_rebench_training.jsonl
        num_repeats: 1
        license: Creative Commons Attribution 4.0 International
swe_rebench_single_agent_turn:
  _inherit_from: single_agent_turn
  environment_servers:
    single_agent_turn:
      resources_server:
        type: resources_servers
        name: swe_rebench_resources_server
      agent_server:
        type: responses_api_agents
        name: opencode_agent
      resources_tool_transports: []
swemer_v1_resources_server:
  resources_servers:
    swemer_v1:
      allowed_agents:
      - opencode_agent
      datasets:
      - name: swemer_v1
        type: train
        taskset: swemer_v1
        jsonl_fpath: resources_servers/swemer_v1/data/swemer_v1_training.jsonl
        num_repeats: 1
        license: NVIDIA Internal Use Only, Do Not Distribute
swemer_v1_single_agent_turn:
  _inherit_from: single_agent_turn
  environment_servers:
    single_agent_turn:
      resources_server:
        type: resources_servers
        name: swemer_v1_resources_server
      agent_server:
        type: responses_api_agents
        name: opencode_agent
      resources_tool_transports: []
swemer_v2_resources_server:
  resources_servers:
    swemer_v2:
      allowed_agents:
      - pi_agent
      datasets:
      - name: swemer_v2
        type: train
        taskset: swemer_v2
        jsonl_fpath: resources_servers/swemer_v2/data/swemer_v2_training.jsonl
        num_repeats: 1
        license: NVIDIA Internal Use Only, Do Not Distribute
swemer_v2_single_agent_turn:
  _inherit_from: single_agent_turn
  environment_servers:
    single_agent_turn:
      resources_server:
        type: resources_servers
        name: swemer_v2_resources_server
      agent_server:
        type: responses_api_agents
        name: pi_agent
      resources_tool_transports: []
swe_internal_v1_resources_server:
  resources_servers:
    swe_internal_v1:
      allowed_agents:
      - pi_agent
      datasets:
      - name: swe_internal_v1
        type: train
        taskset: swe_internal_v1
        jsonl_fpath: resources_servers/swe_internal_v1/data/swe_internal_v1_training.jsonl
        num_repeats: 1
        license: NVIDIA Internal Use Only, Do Not Distribute
swe_internal_v1_single_agent_turn:
  _inherit_from: single_agent_turn
  environment_servers:
    single_agent_turn:
      resources_server:
        type: resources_servers
        name: swe_internal_v1_resources_server
      agent_server:
        type: responses_api_agents
        name: pi_agent
      resources_tool_transports: []
