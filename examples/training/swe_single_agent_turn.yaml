#
# Nemotron 3.5 Nano SWE, 4 training + 12 generation nodes, four GPUs per node.
# Model/data/training values reference pipeline MR69@36e2364f9f79e9071a4f8e76634f73d3c204e6f9,
# RLVR/nemotron-3.5-nano-swe/configs/swe_sc_8n_masked_nocompact_lag3_sbx4800_gb300.yaml
# and scripts/launch_nano35_swe_8n11.sh. This recipe is independently authored;
# the pipeline source and launcher are not runtime dependencies.
# defaults is resolved against the chosen NeMo RL checkout by the preparer.
# Main's masked_reward_policy=include retains masked rewards, including logprob-error
# rows; that population is broader than MR69's old incomplete/overlong-only option.
cluster:
  gpus_per_node: 4
  num_nodes: 16
  segment_size: 4
checkpointing:
  enabled: true
  checkpoint_dir: ${oc.env:CHECKPOINT_DIR}
  metric_name: null
  higher_is_better: true
  keep_top_k: 10
  save_period: 5
  ft_keep_latest_k: 1
  ft_save_period: 5
  save_data_plane: true
  checkpoint_must_save_by: 00:03:30:00
  save_optimizer: true
grpo:
  num_prompts_per_step: 32
  num_generations_per_prompt: 16
  max_rollout_turns: 1
  max_num_epochs: 4
  max_num_steps: 50
  normalize_rewards: true
  use_leave_one_out_baseline: true
  advantage_clip_low: -20
  advantage_clip_high: 20
  val_period: 0
  val_at_start: false
  val_at_end: false
  val_start_at: -1
  overlong_filtering: true
  max_val_samples: null
  val_batch_size: 256
  seed: 42
  use_dynamic_sampling: false
  dynamic_sampling_max_gen_batches: 10
  batch_multiplier: 1
  penalize_invalid_tool_call: false
  invalid_tool_call_advantage: null
  penalize_malformed_thinking: false
  malformed_thinking_advantage: null
  reward_shaping:
    enabled: false
    overlong_buffer_length: 128
    overlong_buffer_penalty: 1
    max_response_length: ${policy.max_total_sequence_length}
    stop_properly_penalty_coef: null
  reward_scaling:
    enabled: false
    source_min: 0.0
    source_max: 1.0
    target_min: 0.0
    target_max: 1.0
  async_grpo: null
  use_best_at_k: false
  best_at_k_k: 8
  best_at_k_m: 1000
  use_combined_training: false
  combined_training_weight_mode: auto
  combined_training_best_at_k_weight: 0.2
  combined_training_pass_at_1_weight: 1.0
  dynamic_sampling_oversample_ratio: 1.0
  seq_logprob_error_threshold: 2
  skip_reference_policy_logprobs_calculation: true
  val_num_generations_per_prompt: 2
  masked_reward_policy: include
loss_fn:
  reference_policy_kl_penalty: 0.0
  reference_policy_kl_type: k3
  kl_input_clamp_value: null
  kl_output_clamp_value: null
  ratio_clip_min: 0.2
  ratio_clip_max: 0.28
  ratio_clip_c: null
  use_on_policy_kl_approximation: true
  use_importance_sampling_correction: true
  truncated_importance_sampling_ratio: 5
  truncated_importance_sampling_ratio_min: 0.2
  truncated_importance_sampling_type: tis
  sequence_level_importance_ratios: false
  token_level_loss: true
  force_on_policy_ratio: true
  use_kl_in_reward: false
policy:
  model_name: ${oc.env:MODEL_PATH}
  tokenizer:
    name: ${policy.model_name}
    chat_template_kwargs: null
  hf_config_overrides: {}
  train_global_batch_size: 512
  train_micro_batch_size: 1
  generation_batch_size: 64
  logprob_batch_size: 1
  max_total_sequence_length: 196608
  precision: bfloat16
  logprob_chunk_size: 1024
  offload_optimizer_for_logprob: false
  megatron_cfg:
    enabled: true
    empty_unused_memory_level: 2
    activation_checkpointing: true
    tensor_model_parallel_size: 4
    expert_tensor_parallel_size: 1
    expert_model_parallel_size: 16
    pipeline_model_parallel_size: 1
    num_layers_in_first_pipeline_stage: null
    num_layers_in_last_pipeline_stage: null
    context_parallel_size: 4
    pipeline_dtype: ${policy.precision}
    sequence_parallel: true
    freeze_moe_router: true
    moe_router_dtype: fp32
    moe_router_load_balancing_type: none
    moe_router_bias_update_rate: 0.001
    moe_router_enable_expert_bias: true
    moe_permute_fusion: true
    moe_enable_deepep: false
    moe_token_dispatcher_type: allgather
    moe_flex_dispatcher_backend: alltoall
    moe_hybridep_num_sms: 32
    moe_aux_loss_coeff: 0.0
    moe_shared_expert_overlap: false
    apply_rope_fusion: false
    use_fused_weighted_squared_relu: true
    bias_activation_fusion: false
    defer_fp32_logits: true
    track_moe_metrics: true
    moe_per_layer_logging: true
    mtp_loss_scaling_factor: 0.3
    mtp_use_repeated_layer: true
    mtp_num_layers: 5
    mtp_detach_heads: true
    optimizer:
      optimizer: adam
      lr: 3.0e-06
      min_lr: 3.0e-06
      weight_decay: 0.0
      bf16: true
      fp16: false
      params_dtype: float32
      adam_beta1: 0.9
      adam_beta2: 0.999
      adam_eps: 1.0e-08
      sgd_momentum: 0.9
      use_distributed_optimizer: true
      use_precision_aware_optimizer: true
      clip_grad: ${policy.max_grad_norm}
      optimizer_cpu_offload: false
      optimizer_offload_fraction: 0.0
    scheduler:
      start_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      end_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      weight_decay_incr_style: constant
      lr_decay_style: constant
      lr_decay_iters: null
      lr_warmup_iters: 10
      lr_warmup_init: 3.0e-07
      override_opt_param_scheduler: true
    distributed_data_parallel_config:
      grad_reduce_in_fp32: false
      overlap_grad_reduce: false
      overlap_param_gather: true
      average_in_collective: false
      use_custom_fsdp: false
      data_parallel_sharding_strategy: optim_grads_params
    gradient_accumulation_fusion: false
    fp8_cfg:
      enabled: false
      fp8: e4m3
      fp8_recipe: mxfp8
      fp8_param: false
    first_last_layers_bf16: true
    num_layers_at_start_in_bf16: 1
    num_layers_at_end_in_bf16: 1
    use_gloo_process_groups: false
    checkpoint:
      async_save: true
      ckpt_assume_constant_structure: true
      fully_parallel_save_process_group: ep_dp
      fully_parallel_load_process_group: ep_dp
      fully_parallel_load_exchange_algo: broadcast
    env_vars: null
  dynamic_batching:
    enabled: false
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    sequence_length_round: 64
  sequence_packing:
    enabled: true
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    algorithm: modified_first_fit_decreasing
    sequence_length_round: 64
    fuse_loss: true
  make_sequence_length_divisible_by: ${mul:${mul:${policy.megatron_cfg.tensor_model_parallel_size},
    ${policy.megatron_cfg.context_parallel_size}}, 2}
  max_grad_norm: 1.0
  optimizer: null
  scheduler: null
  draft:
    enabled: false
    model_name: null
    loss_weight: 0.1
    num_layers: null
    aux_layer_indices: null
  generation:
    port_range_low: 3000
    port_range_high: 4999
    backend: vllm
    refit_transport: nccl_reshard
    max_new_tokens: ${policy.max_total_sequence_length}
    temperature: 1.0
    top_p: 1.0
    top_k: null
    val_temperature: ${.temperature}
    val_top_p: ${.top_p}
    val_top_k: ${.top_k}
    stop_token_ids: null
    stop_strings: null
    vllm_cfg:
      async_engine: true
      precision: ${policy.precision}
      kv_cache_dtype: auto
      tensor_parallel_size: 1
      pipeline_parallel_size: 1
      expert_parallel_size: 1
      gpu_memory_utilization: 0.85
      max_model_len: ${policy.max_total_sequence_length}
      enforce_eager: false
      use_deep_gemm: false
      num_last_layers_in_bf16: 0
      num_first_layers_in_bf16: 0
      enable_vllm_metrics_logger: true
      vllm_metrics_logger_interval: 0.5
      expose_http_server: true
      skip_tokenizer_init: false
      http_server_serving_chat_kwargs:
        enable_auto_tools: true
        tool_parser: qwen3_coder
        reasoning_parser: nano_v3
        default_chat_template_kwargs:
          enable_thinking: true
      reasoning_parser_plugin: /opt/nemo-rl/nemo_rl/models/generation/vllm/reasoning_parsers/nano_v3_reasoning_parser.py
    vllm_kwargs:
      moe_backend: flashinfer_cutlass
      attention_backend: FLASHINFER
      max_num_seqs: 512
      max_num_batched_tokens: 32768
      mamba_ssm_cache_dtype: float32
      mamba_cache_mode: align
      compilation_config:
        cudagraph_capture_sizes:
        - 1
        - 2
        - 4
        - 8
        - 16
        - 32
        - 64
        - 128
        - 256
        cudagraph_mode: PIECEWISE
        pass_config:
          fuse_allreduce_rms: false
    colocated:
      enabled: false
      resources:
        gpus_per_node: 4
        num_nodes: 12
  automodel_cfg:
    enabled: false
data:
  max_input_seq_length: null
  shuffle: false
  num_workers: 1
  use_multiple_dataloader: false
  train:
    data_path: ${oc.env:TRAIN_PATH}
  validation:
    data_path: ${oc.env:TRAIN_PATH}
  default:
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    prompt_file: null
    system_prompt_file: null
    processor: nemo_gym_data_processor
env:
  should_use_nemo_gym: true
  should_log_nemo_gym_responses: true
  nemo_gym:
    nemo_gym_log_dir: ${logger.log_dir}/nemo_gym
    skip_venv_if_present: true
    num_gpu_nodes: 0
    port_range_low: 5000
    port_range_high: 5999
    gzip_responses_enabled: true
    gzip_responses_minimum_size: 4096
    gzip_responses_compresslevel: 1
    global_aiohttp_client_request_debug: false
    global_aiohttp_connector_limit: 65536
    global_aiohttp_connector_limit_per_host: 16384
    global_aiohttp_keepalive_timeout_seconds: 2.0
    uvicorn_timeout_keep_alive_seconds: 15
    run_response_cache_enabled: true
    run_response_cache_max_entries: 8192
    run_response_cache_ttl_seconds: 7200
    run_response_cache_max_response_bytes: 67108864
    run_response_cache_max_total_bytes: 8589934592
    run_response_cache_body_read_retries: 4
    run_response_cache_retry_delay_seconds: 0.25
    run_response_cache_log_interval: 1000
    invalid_tool_call_patterns:
    - <tool_call>
    - </tool_call>
    - <function_call>
    - </function_call>
    thinking_tags:
    - <think>
    - </think>
    policy_model:
      responses_api_models:
        vllm_model:
          num_workers: 8
          chat_template_kwargs:
            enable_thinking: true
            truncate_history_thinking: false
          sequential_reasoning_allowed: false
          sampling_overrides:
            temperature: ${policy.generation.temperature}
            top_p: ${policy.generation.top_p}
    swe_rebench_resources_server:
      resources_servers:
        swe_rebench:
          evaluation_timeout: 1200
          sandbox_config:
            env:
              OPENCODE_VERSION: 1.17.11
          inconclusive_verification_retries: 0
    sandbox:
      default_metadata:
        sandbox-api: opensandbox-sdk
      opensandbox:
        connection:
          protocol: https
          tls_verify: false
          request_timeout_s: 300
          use_server_proxy: true
        create:
          request_timeout_s: 1200
          timeout_s: 1500
          connect_attempt_timeout_s: 1500
          skip_health_check: false
          retries: 10
          retry_delay_s: 5.0
          retry_max_delay_s: 90.0
    scale_swe_resources_server:
      resources_servers:
        scale_swe:
          evaluation_timeout: 1200
          sandbox_config:
            env:
              OPENCODE_VERSION: 1.17.11
          inconclusive_verification_retries: 0
    swemer_v1_resources_server:
      resources_servers:
        swemer_v1:
          evaluation_timeout: 1200
          sandbox_config:
            env:
              OPENCODE_VERSION: 1.17.11
          inconclusive_verification_retries: 0
    swemer_v2_resources_server:
      resources_servers:
        swemer_v2:
          evaluation_timeout: 1200
          sandbox_config:
            env:
              OPENCODE_VERSION: 1.17.11
          inconclusive_verification_retries: 0
    denovo_swe_resources_server:
      resources_servers:
        denovo_swe:
          evaluation_timeout: 1200
          sandbox_config:
            env:
              OPENCODE_VERSION: 1.17.11
          inconclusive_verification_retries: 0
    swe_next_resources_server:
      resources_servers:
        swe_next:
          evaluation_timeout: 1200
          sandbox_config:
            env:
              OPENCODE_VERSION: 1.17.11
          inconclusive_verification_retries: 0
  should_mask_flagged_samples: true
logger:
  log_dir: ${oc.env:LOG_DIR}
  num_val_samples_to_print: 0
  wandb_enabled: false
  tensorboard_enabled: false
  mlflow_enabled: false
  monitor_gpus: true
  swanlab_enabled: false
  wandb:
    project: nano35-swe-v2
    name: nano35-swe-sc
    log_nemo_gym_full_result_tables: false
  tensorboard: {}
  mlflow:
    experiment_name: nano35-swe-v2
    run_name: nano35-swe-sc
  gpu_monitoring:
    collection_interval: 10
    flush_interval: 10
reward_penalties:
  penalize_duplicated_reasoning: false
  penalize_empty_final_answer: false
  penalize_unwanted_tokens: false
  penalize_malformed_think_tag: false
  token_ids:
    unwanted:
    - 2
    think_open: 12
    think_close: 13
token_capture:
  enabled: true
  staging_partition: rollout_staging
  num_reassembler_workers: 2
rollout_recovery:
  target_level: sibling
  task_source_target_level_overrides: {}
  agent_target_level_overrides: {}
async_rl:
  sampler:
    name: in_order
    max_lookahead_versions: 3
  recompute_kv_cache_after_weight_updates: false
  min_groups_for_streaming_train: 8
  max_inflight_prompts: 128
  max_buffered_rollouts: 128
  rollout_failure:
    max_infra_attempts_per_prompt: 5
    max_data_attempts_per_prompt: 2
    backoff_base_s: 1.0
    max_backoff_s: 30.0
    max_consecutive_dropped_prompts: 32
    max_skipped_prompts: 0
    on_dropped_prompt: replace
    max_replacement_attempts: 1
    replacement_reserve_prompts: 1
    min_step_batch_fraction: 0.9
    nemo_gym:
      rollout_timeout_s: 8400.0
  stall_watchdog:
    interval_s: 30.0
    stall_timeout_s: 10800.0
    stall_action: warn
    gym_subprocess_check: true
data_plane:
  enabled: true
  impl: transfer_queue
  backend: simple
  claim_meta_poll_interval_s: 0.5
  simple:
    storage_capacity: 1000000
    num_storage_units: 16
  mooncake_cpu:
    global_segment_size: 34359738368
    local_buffer_size: 8589934592
defaults: grpo_math_1B_megatron_single_controller.yaml
