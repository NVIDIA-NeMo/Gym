# Gym pairing config; use with the existing NeMo RL recipe and launcher.
# Prepared Harbor rows already carry task_id.taskset; keep them materialized.
config_paths:
- responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
- responses_api_agents/opencode_agent/configs/opencode_agent.yaml
- responses_api_agents/pi_agent/configs/pi_agent.yaml
- environment_servers/harbor/configs/harbor.yaml
- results/harbor/terminal_bench_2_1/run_config_opencode_agent.yaml
results_dir: ${oc.env:PWD}/results/harbor-multi-harness
use_absolute_ip: true
absolute_ip_server_types:
- responses_api_models
model_call_sampling:
  required_model_servers:
  - policy_model
environment_server_routes:
  terminal_bench_2_1: harbor_terminal_5fbench_5f2_5f1_environment
  terminal-bench-pi: terminal-bench-pi-environment
terminal-bench-pi-agent:
  _inherit_from: pi_agent
  responses_api_agents:
    pi_agent:
      datasets:
      - name: terminal-bench-pi
        type: train
        jsonl_fpath: results/training/harbor/pi.jsonl
        num_repeats: 1
        license: MIT
terminal-bench-pi-environment:
  _inherit_from: harbor_environment_server
  environment_servers:
    harbor:
      agent_server:
        type: responses_api_agents
        name: terminal-bench-pi-agent
      tasksets:
        terminal-bench-pi: ${harbor_terminal_5fbench_5f2_5f1_environment.environment_servers.harbor.tasksets.terminal_bench_2_1}
harbor_terminal_5fbench_5f2_5f1_agent:
  responses_api_agents:
    opencode_agent:
      datasets:
      - name: terminal-bench-opencode
        type: train
        jsonl_fpath: results/harbor/terminal_bench_2_1/tasks_opencode_agent.jsonl
        num_repeats: 1
        license: MIT
