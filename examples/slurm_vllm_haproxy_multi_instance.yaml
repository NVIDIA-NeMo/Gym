compute:
  cluster:
    type: slurm
    hostname: myslurmcluster
    walltime: "01:00:00"
    account: myaccount
    node_pools:
      compute:
        partition: batch
        nodes: 1
        ntasks_per_node: 1
        gpus_per_node: 8

services:
  vllm_model:
    container: vllm/vllm-openai:v0.9.0
    type: vllm
    model: Qwen/Qwen2.5-7B-Instruct
    trust_remote_code: true
    tensor_parallel_size: 2      # 4 independent `vllm serve` processes x TP2 = 8 GPUs
    number_of_instances: 4
    use_haproxy: true            # route between the 4 instances via HAProxy instead of
                                  # vLLM's own --data-parallel-size
    port: 8000
    health_check:
      timeout_seconds: 1200
    mounts:
      - /lustre/datasets:/data

driver:
  policy_model: vllm_model
  container: python:3.12
  gym_install:
    ref: main
  benchmarks:
    gpqa:
      run:
        split: benchmark
        config_paths:
          - benchmarks/gpqa/config.yaml

job:
  output_path: /lustre/fsw/my-path
