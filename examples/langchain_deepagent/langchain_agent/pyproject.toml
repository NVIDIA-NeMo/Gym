[project]
name = "deepagents-langchain-agent"
version = "0.1.0"
description = "A stupidly simple deepagents agent - one model, one tool (Tavily web search)."
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.6,<0.8",
    "langchain-openai>=1.0",
    "langchain-tavily>=0.2.18",
    "python-dotenv>=1.0",
]

# A real installable package (not just an app) so the parent example directory can depend on it as
# an editable local path — see ../pyproject.toml's [tool.uv.sources].
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
