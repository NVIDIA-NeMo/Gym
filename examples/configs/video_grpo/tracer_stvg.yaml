# Compose with the caller's policy_model config and resolve the MR133 v0.2 media before collection.
# NEMO_GYM_EXTRA_ROOTS must expose these pinned upstream components:
# https://github.com/NVIDIA-NeMo/Gym/tree/f57d175397141ea8fdcd5d320ae9ea87efec426a/resources_servers/multi_object_tracking
# https://github.com/NVIDIA-NeMo/Gym/tree/7deb29ecfdc25e355a66e5b32583a86a23602c56/resources_servers/molmo2_videotrack
config_paths:
  - resources_servers/sav_tracks/configs/sav_tracks.yaml
  - resources_servers/vstar_spatiotemporal/configs/vstar_spatiotemporal.yaml
  - resources_servers/multi_object_tracking/configs/multi_object_tracking.yaml
  - resources_servers/molmo2_videotrack/configs/molmo2_videotrack.yaml

# A required endpoint keeps VQA grading independent of the policy model.
tracer_stvg_judge_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: ${oc.env:TRACER_STVG_JUDGE_BASE_URL}
      api_key: ${oc.env:TRACER_STVG_JUDGE_API_KEY,unused}
      model: Qwen/Qwen2.5-72B-Instruct
      return_token_id_information: false
      uses_reasoning_parser: false

vstar_spatiotemporal_resources_server:
  resources_servers:
    vstar_spatiotemporal:
      judge_model_server:
        type: responses_api_models
        name: tracer_stvg_judge_model
      judge_responses_create_params:
        input: []
        temperature: 0.0
        max_output_tokens: 512

vstar_spatiotemporal_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: vstar_spatiotemporal_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
vstar_spatiotemporal_environment_server:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: vstar_spatiotemporal_resources_server
      agent_server:
        type: responses_api_agents
        name: vstar_spatiotemporal_agent

molmo2_videotrack_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: molmo2_videotrack_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
molmo2_videotrack_environment_server:
  environment_servers:
    single_agent_turn_legacy:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: molmo2_videotrack_resources_server
      agent_server:
        type: responses_api_agents
        name: molmo2_videotrack_agent
