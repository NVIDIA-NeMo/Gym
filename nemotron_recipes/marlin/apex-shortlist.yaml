#
# APEX Shortlist (no tools): 47 problems x 16 repeats. The final \boxed{} answer is graded
# symbolically against the reference; there is no judge model.
#
#   nemotron_recipes/marlin/run.sh apex-shortlist
#
# The dataset is not pinned to a revision: Gym loads the latest MathArena/apex-shortlist,
# which had 47 problems when the published number was produced. A different problem count
# means a different problem set.

# Gym commit the published number was produced with; run.sh pins to it.
gym_commit: ae8d388dda62f40fe8b8105bf079be132383fe4d
# Gym benchmark config this recipe builds on.
benchmark_config: benchmarks/apex_shortlist/config.yaml

# 16 samples per problem, each sent with its own seed.
num_repeats: 16
num_repeats_add_seed: true
