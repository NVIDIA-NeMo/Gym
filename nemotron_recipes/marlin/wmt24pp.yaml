# WMT24++ (no tools): 960 English sentences translated into 9 languages, 8,640 translations,
# one sample each. Scored by xCOMET-XXL (reported: COMET averaged over the 9 languages), plus
# spBLEU and chrF.
#
#   nemotron_recipes/marlin/run.sh wmt24pp
#
# Scoring runs xCOMET-XXL (43 GB) on this machine's GPUs, one copy per GPU: about 60 GB free per
# GPU (80 GB GPUs). It uses the GPUs in CUDA_VISIBLE_DEVICES, or every GPU with that much free
# memory if it is unset. On Slurm it is set to all your job's GPUs, so point it at the GPUs vLLM does not use.
# run.sh first sources wmt24pp.setup.sh, which sets this up and downloads the model once (gated
# on the Hugging Face Hub: accept its terms, and set HF_TOKEN).

# Gym commit the published number was produced with; run.sh pins to it.
gym_commit: ae8d388dda62f40fe8b8105bf079be132383fe4d
# Gym benchmark config this recipe builds on.
benchmark_config: benchmarks/wmt24pp/config.yaml

prepare_script_args:
  # The published run's 9 target languages (the benchmark default prepares 55).
  target_languages: [de_DE, es_MX, fr_FR, it_IT, ja_JP, zh_CN, hi_IN, pt_BR, ko_KR]
  # wmt24pp.setup.sh downloads the scorer model instead.
  prefetch_comet: false

wmt24pp_wmt_translation_resources_server:
  resources_servers:
    wmt_translation:
      compute_comet: true
      # Translations per scoring call. The published run used 128 on 186 GB GPUs; 16 needs about
      # 53 GB per GPU instead of 140 GB and gives the same scores, only more slowly.
      comet_batch_size: 16
      # The published run turned the per-answer language check off (benchmark default: CLD2).
      language_consistency_backend: null
