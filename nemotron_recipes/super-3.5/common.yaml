#
# Settings shared by every recipe in this folder.
#
# run.sh loads, in this order: the recipe's benchmark config, the model config, this file,
# the recipe. Later files override earlier ones, so these values replace the benchmark's
# own defaults and anything a recipe sets itself replaces these.

split: benchmark
overwrite_metrics_conflicts: true

responses_create_params:
  temperature: 1.0
  top_p: 0.95
  # No output cap: most published runs sent none, so generation is bounded only by the
  # served context length. A recipe whose run sent a cap sets it itself (CritPt).
  max_output_tokens: null

policy_model:
  responses_api_models:
    vllm_model:
      chat_template_kwargs:
        enable_thinking: true
