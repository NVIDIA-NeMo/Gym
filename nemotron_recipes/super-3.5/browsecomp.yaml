# BrowseComp (web-browsing agent): all 1,266 questions, one sample each. The model searches the
# web through Exa, reads the pages it finds and answers; a judge model (GLM-5.1) compares the
# answer with the reference.
#
#   nemotron_recipes/super-3.5/run.sh browsecomp
#
# Score: in evaluator_rollouts_aggregate_metrics.json, the entry of agent
# browsecomp_benchmark_agent. The tech report shows these x100:
#   BrowseComp: key_metrics["mean/reward"]
#
# Set in .env: POLICY_API_KEY, BROWSECOMP_JUDGE_API_KEY, EXA_API_KEY
#
# Needs the judge endpoint in env.yaml (browsecomp_judge_base_url, browsecomp_judge_api_key)
# serving GLM-5.1 on Chat Completions (<browsecomp_judge_base_url>/chat/completions), and an
# Exa API key (https://exa.ai).
#
# run.sh first sources browsecomp.setup.sh, which selects all 1,266 questions (Gym's default
# is a 400-question subset) and points the search at the domain exclude list.
#
# The run uses Exa's "deep" search, which costs more per query than its default; the
# published run made about 33 searches per question.

# Gym commit the published number was produced with; run.sh pins to it.
gym_commit: 0a287243543020c1cc23f76f6004fcf3c83fc4a9
# Gym benchmark config this recipe builds on.
benchmark_config: benchmarks/browsecomp/config.yaml

# Judge: GLM-5.1, the benchmark's own judge. Endpoint and key come from env.yaml; set
# browsecomp_judge_model_name there only if your provider serves this model under a different id.
judge_model:
  responses_api_models:
    vllm_model:
      base_url: ${browsecomp_judge_base_url}
      api_key: ${browsecomp_judge_api_key}
      model: ${oc.select:browsecomp_judge_model_name,zai-org/GLM-5.1}

browsecomp_benchmark_resources_server:
  resources_servers:
    browsecomp_advanced_harness:
      exa_api_key: ${oc.select:exa_api_key,null}
      # Exa's multi-step research search, as the published run used (Gym's default is auto).
      exa_search_type: deep
      # Domains search skips: the NVIDIA opt-out registry the published run used (same 47
      # domains). Absolute path from browsecomp.setup.sh: the server runs in its own directory.
      exclude_domains_file_path: ${oc.env:BROWSECOMP_EXCLUDE_DOMAINS}

browsecomp_benchmark_agent:
  responses_api_agents:
    browsecomp_agent:
      # Counts prompt tokens through vLLM's /tokenize before each call; off, as in the
      # published run, so any OpenAI-compatible endpoint works.
      save_model_call_using_vllm_tokenize_endpoint: false
