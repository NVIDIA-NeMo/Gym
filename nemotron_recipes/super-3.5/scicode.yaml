#
# SciCode (no tools): 65 problems x 8 repeats, each split into sub-steps. The model writes the
# code for each sub-step, which runs against the problem's test cases; there is no judge model.
#
#   nemotron_recipes/super-3.5/run.sh scicode
#
# Tech report (key_metrics of scicode_benchmark_agent):
#   SciCode (subtask): mean/subtask_accuracy x100
#   SciCode (problem): mean/problem_accuracy x100
#
# Set in .env: POLICY_API_KEY, TEST_DATA
#
# Needs SciCode's ~1 GB test_data.h5; set TEST_DATA to its path (reproducibility.md,
# "SciCode" has the download).
#
# run.sh first sources scicode.setup.sh, which checks that the file is readable: otherwise
# every test case fails and the run scores 0 without an error.

# Gym commit the published number was produced with; run.sh pins to it.
gym_commit: e446e4f415b9cde0e95bb813c85e9e3e23f5d893
# Gym benchmark config this recipe builds on.
benchmark_config: benchmarks/scicode/config.yaml

# 8 samples per problem (the benchmark default is 3). Set on the dataset entry, where the
# benchmark sets it: a top-level num_repeats would multiply the default instead. Lists are
# replaced, not merged, hence the full entry.
scicode_benchmark_agent:
  responses_api_agents:
    scicode_agent:
      datasets:
      - name: scicode
        type: benchmark
        jsonl_fpath: benchmarks/scicode/data/scicode_benchmark.jsonl
        prepare_script: benchmarks/scicode/prepare.py
        prompt_config: null
        num_repeats: 8

scicode_benchmark_resources_server:
  resources_servers:
    scicode:
      # The numeric reference values the test cases are checked against.
      test_data_fpath: ${oc.env:TEST_DATA}
      # Each sub-step's code may run for up to 300 s against its test cases (default 30 s).
      timeout_secs: 300

# SciCode's agent sends only the prompt, so temperature and top_p from common.yaml never reach
# the server. Gym's model server adds these to every request instead; without them the server's
# own defaults apply.
policy_model:
  responses_api_models:
    vllm_model:
      extra_body:
        temperature: 1.0
        top_p: 0.95
