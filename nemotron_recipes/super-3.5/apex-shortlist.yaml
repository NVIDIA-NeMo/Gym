# APEX Shortlist (no tools): 47 math problems x 16 repeats. The final \boxed{} answer is checked
# symbolically against the reference; there is no judge model.
#
#   nemotron_recipes/super-3.5/run.sh apex-shortlist
#
# Tech report (agent_metrics of apex_shortlist_math_with_judge_simple_agent):
#   Apex-Shortlist: mean/reward x100
#
# Set in .env: POLICY_API_KEY

# Gym commit the published number was produced with; run.sh pins to it.
gym_commit: ae8d388dda62f40fe8b8105bf079be132383fe4d
# Gym benchmark config this recipe builds on.
benchmark_config: benchmarks/apex_shortlist/config.yaml

# Each sample is sent with its own seed.
num_repeats: 16
num_repeats_add_seed: true
