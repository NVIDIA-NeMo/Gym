#
# CritPt (no tools): 70 research-level physics problems x 5 repeats, two turns each: a
# derivation, then the problem's Python template filled in with the answer. The Artificial
# Analysis (AA) API grades the templates in batches of all 70 problems against private test
# cases; every rollout in a batch gets that batch's accuracy.
#
#   nemotron_recipes/super-3.5/run.sh critpt
#
# Tech report (key_metrics of critpt_benchmark_agent):
#   CritPt: mean/accuracy x100
#
# Set in .env: POLICY_API_KEY, ARTIFICIAL_ANALYSIS_API_KEY
#
# Needs an AA API key (https://artificialanalysis.ai/documentation#critpt-api): one key, or
# '[key1,key2]' to switch keys when one is rate-limited. A full run makes 5 grading calls.
# Details: reproducibility.md, "CritPt".
#
# Needs --max-model-len 262144: each turn asks for 245,760 output tokens, and a turn that does
# not fit comes back empty and scores 0 without an error (check that output_tokens is above 0).
#
# Leave PARALLEL unset (or at 350 or more). A rollout holds its slot until its batch is
# graded, so with fewer slots no batch ever fills, and the run fails once the 6 h verify
# timeout expires.
#
# LIMIT does not work for a smoke here: the 5 repeats of each problem come one after another
# and LIMIT keeps the first rows, so a limited run cannot fill a batch and fails the same way.
# For a smoke, copy this file to critpt-smoke.yaml, add `fire_after: 1` next to
# verify_timeout_seconds below and run `LIMIT=1 nemotron_recipes/super-3.5/run.sh
# critpt-smoke`. That is one AA call with the other 69 problems sent empty: it shows the
# setup works, but it is not a score.

# Gym commit the published number was produced with; run.sh pins to it.
gym_commit: 1e668906d2e69a9e8ee9aaafc60050a4025d9688
# Gym benchmark config this recipe builds on.
benchmark_config: benchmarks/critpt/config.yaml

# 5 samples per problem (the benchmark default), each sent with its own seed.
num_repeats_add_seed: true

responses_create_params:
  # The published run capped each turn at 245,760 output tokens.
  max_output_tokens: 245760

policy_model:
  responses_api_models:
    vllm_model:
      # As in the published run (Gym's default is true): a conversation that ends with
      # reasoning but no answer is not sent back to the model to continue.
      sequential_reasoning_allowed: false

critpt_resources_server:
  resources_servers:
    critpt:
      # Wait up to 6 h for a rollout's batch to fill and be graded (default 2.5 h).
      verify_timeout_seconds: 21600
      # Keep every submission and grader response, so a run that runs out of grading quota
      # can be re-scored later without new inference:
      #   python -m resources_servers.critpt.replay --cache-dir <directory logged at startup>
      # Relative to the Gym repo root, whatever OUT is.
      cache_dir: results/critpt/critpt_cache
      # Grading key: one key, or a '[key1,key2]' list, parsed here as the published run's
      # command line did.
      api_key: ${oc.decode:${oc.select:artificial_analysis_api_key,null}}
