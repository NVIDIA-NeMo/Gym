#
# WMT24++ (no tools): 960 English sentences translated into 9 languages, 8,640 translations, one
# sample each. Scored by xCOMET-XXL, plus spBLEU and chrF.
#
#   nemotron_recipes/super-3.5/run.sh wmt24pp
#
# Tech report "WMT24pp COMET": xx->xx/comet
#   (key_metrics of wmt24pp_wmt_translation_simple_agent)
#
# Set in .env: POLICY_API_KEY, HF_TOKEN
#
# Needs HF_TOKEN (the scorer model is gated; accept its terms on the Hugging Face Hub first)
# and GPUs for scoring: xCOMET-XXL runs on this machine, one copy per GPU, 43 GB of weights
# plus room for the batch (comet_batch_size below). By default it uses every GPU with 75 GB
# free; to include GPUs with less, list the GPUs to use in CUDA_VISIBLE_DEVICES. On Slurm it
# is set to all your job's GPUs, so point it at the GPUs vLLM does not use. Details:
# reproducibility.md, "WMT24++".
#
# run.sh first sources wmt24pp.setup.sh, which sets this up and downloads the scorer model
# once.
#
# The published run's served context capped each translation, thinking included, at about
# 32,768 tokens. max_output_tokens below caps it the same way, so serve the model as for the
# other recipes.

# Gym commit the published number was produced with; run.sh pins to it.
gym_commit: ae8d388dda62f40fe8b8105bf079be132383fe4d
# Gym benchmark config this recipe builds on.
benchmark_config: benchmarks/wmt24pp/config.yaml

responses_create_params:
  max_output_tokens: 32768

prepare_script_args:
  # The published run's 9 target languages (the benchmark default prepares 55).
  target_languages: [de_DE, es_MX, fr_FR, it_IT, ja_JP, zh_CN, hi_IN, pt_BR, ko_KR]
  # wmt24pp.setup.sh downloads the scorer model instead.
  prefetch_comet: false

wmt24pp_wmt_translation_resources_server:
  resources_servers:
    wmt_translation:
      compute_comet: true
      # Translations per scoring call: changes memory per GPU, not scores. The published run
      # used 128; lower it if scoring runs out of memory.
      comet_batch_size: 16
      # The published run turned the per-answer language check off (benchmark default: CLD2).
      language_consistency_backend: null
