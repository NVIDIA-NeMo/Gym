#
# GraphWalks (long context, no tools): 950 prompts, one sample each. Each lists the edges of a
# directed graph and asks for the parents of a node or the nodes at exactly depth N of a
# breadth-first search; scored by F1 against the expected node set; there is no judge model.
#
#   nemotron_recipes/super-3.5/run.sh graphwalks
#
# Tech report (key_metrics of graphwalks_benchmark_simple_agent):
#   GraphWalks (≤1M): pass@1/accuracy
#
# Set in .env: POLICY_API_KEY
#
# run.sh first sources graphwalks.setup.sh, which installs the tokenizer packages prepare
# needs.
#
# Prompts are up to ~361,000 tokens. Serve the model with --max-model-len 1048576, as in the
# published run; it needs at least the longest prompt plus the 100,000-token output cap.
#
# Like the published run, prepare counts tokens with the Nemotron 3 Super tokenizer and drops
# the 200 of openai/graphwalks' 1,150 prompts above 1,048,576 tokens.

# Gym commit the published number was produced with; run.sh pins to it.
gym_commit: ae8d388dda62f40fe8b8105bf079be132383fe4d
# Gym benchmark config this recipe builds on.
benchmark_config: benchmarks/graphwalks/config.yaml

# The published run's prompt set (the benchmark default drops none).
prepare_script_args:
  tokenizer_name: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16
  max_context_tokens: 1048576

responses_create_params:
  # The published run capped each answer at 100,000 output tokens.
  max_output_tokens: 100000
