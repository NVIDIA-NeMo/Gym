#
# IFBench (no tools): 300 prompts x 8 repeats, each with one or more verifiable output
# constraints. The reward is the fraction of a prompt's constraints the response follows,
# checked strictly by AllenAI's IFBench rules; there is no judge model.
#
#   nemotron_recipes/super-3.5/run.sh ifbench
#
# Tech report (key_metrics of ifbench_benchmark_simple_agent):
#   IFBench: mean/reward x100
#
# Set in .env: POLICY_API_KEY

# Gym commit the published number was produced with; run.sh pins to it.
gym_commit: ae8d388dda62f40fe8b8105bf079be132383fe4d
# Gym benchmark config this recipe builds on.
benchmark_config: benchmarks/ifbench/config.yaml

# 8 samples per prompt (the benchmark default is 5). Set on the dataset entry, where the
# benchmark sets it: a top-level num_repeats would multiply the default instead. Lists are
# replaced, not merged, hence the full entry.
ifbench_benchmark_simple_agent:
  responses_api_agents:
    simple_agent:
      datasets:
      - name: ifbench
        type: benchmark
        jsonl_fpath: benchmarks/ifbench/data/ifbench_benchmark.jsonl
        prompt_config: benchmarks/ifbench/prompts/default.yaml
        prepare_script: benchmarks/ifbench/prepare.py
        num_repeats: 8
