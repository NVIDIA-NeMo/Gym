sandbox:
  default_metadata:
    sandbox-api: substrate-ateapi
  substrate:
    connection:
      # Both default to a port-forward:
      #   kubectl port-forward -n ate-system svc/api 8080:443
      #   kubectl port-forward -n ate-system svc/atenet-router 8000:80
      ateapi_addr: localhost:8080
      atenet_addr: localhost:8000
      atespace: nemo-gym
      template_namespace: nemo-gym
    create:
      ready_timeout_s: 1200
      # pause_after_exec parks the actor on its node once create or a step
      # finishes and the actor has been idle for idle_before_suspend_s, so an
      # idle sandbox holds no worker while back-to-back steps pay no
      # checkpoint. after_exec suspends to object storage instead. Set never
      # to measure against always-on.
      suspend_policy: pause_after_exec
      idle_before_suspend_s: 1.0
    exec:
      default_timeout_s: 1800
      concurrency: 32
      capacity_retry_delay_s: 5
    probe:
      # Above the router's --parked-request-budget, so a probe waiting for a
      # slot is held by the router rather than cut and re-parked.
      timeout_s: 660
      stable_delay_s: 1.0
