# IdeGYM sandbox provider config.
#
# `sandbox` is the instance name an agent references via `sandbox_provider: sandbox`;
# the child key `idegym` selects the provider class and its value is passed to the
# provider constructor.
#
# Every shipped provider config binds the same name `sandbox`, so swapping providers is
# swapping this config path in `+config_paths` (no agent edit):
#
#   AGENT=responses_api_agents/mini_swe_agent_2/configs/mini_swe_agent_2.yaml
#   MODEL=responses_api_models/vllm_model/configs/vllm_model.yaml
#   gym env start \
#       --config $AGENT \
#       --config nemo_gym/sandbox/providers/idegym/configs/idegym.yaml \
#       --config $MODEL
#
# Requires a reachable IdeGYM 0.13.1+ orchestrator (github.com/JetBrains-Research/idegym)
# and the SDK: `uv pip install 'nemo-gym[idegym]'`. The sandbox image must be an IdeGYM
# 0.13.1+ *server* image, not a plain benchmark image -- see ../README.md.
#
# `default_metadata` (optional) is merged into every sandbox's spec metadata
# (SandboxSpec.metadata); an agent's own sandbox_spec.metadata overrides it. Metadata
# becomes Kubernetes labels on the server pod (values sanitized), next to the
# attribution labels below, so `kubectl get pods -l <key>=<value>` finds a sandbox.
sandbox:
  default_metadata:
    sandbox-api: idegym-client
  idegym:
    connection:
      # A bare host gets an https:// scheme; the literal `idegym.test` is the SDK's
      # unauthenticated local-testing host.
      orchestrator_url: ${oc.env:IDEGYM_ORCHESTRATOR_URL,idegym.test}
      # Namespace the client and its server pods live in.
      namespace: ${oc.env:IDEGYM_NAMESPACE,idegym}
      # Basic auth. Left null, the SDK reads IDEGYM_AUTH_USERNAME /
      # IDEGYM_AUTH_PASSWORD, which is the preferred way to pass credentials.
      username: ${oc.env:IDEGYM_AUTH_USERNAME,null}
      password: ${oc.env:IDEGYM_AUTH_PASSWORD,null}
      # Names the one client this process registers and shares across all its
      # sandboxes. Resource quotas match it by regex, so pin it to whatever your
      # deployment's rule expects. Null derives it from `attribution` below.
      client_name: ${oc.env:IDEGYM_CLIENT_NAME,null}
      # Dedicated nodes requested at registration; 0 uses the shared pool.
      nodes_count: 0
      heartbeat_interval_s: 60
      request_timeout_s: 60
      # "aiohttp" routes the SDK's httpx client through the httpx-aiohttp bridge,
      # falling back to httpx with a warning when it is not installed.
      transport_backend: aiohttp
      # Caps in-flight HTTP to the orchestrator across every sandbox sharing this
      # connection. null for no cap, on either backend.
      max_connections: 64
      # Idle connections kept open. Applies to transport_backend: httpx only; aiohttp
      # has no such cap and only honours keepalive_expiry_s.
      max_keepalive_connections: 20
      keepalive_expiry_s: 5.0
      # Retries of a request whose connection never opened, safe for any method.
      connect_retries: 2
      # Retries of idempotent GETs -- above all the SDK's operation-status polls, which
      # it sends once each -- on a transport error or a 429/502/503/504.
      poll_retries: 3
      retry_delay_s: 0.5
      # Tracing is opt-in: set your own OTLP HTTP endpoint to collect the SDK's traces.
      # Null keeps tracing off.
      tracing_endpoint: ${oc.env:IDEGYM_OTEL_TRACING_ENDPOINT,null}
      # Used only with an endpoint set: seconds per trace export, and basic auth for
      # the collector (null sends none).
      tracing_timeout_s: 10.0
      tracing_username: ${oc.env:IDEGYM_OTEL_TRACING_AUTH_USERNAME,null}
      tracing_password: ${oc.env:IDEGYM_OTEL_TRACING_AUTH_PASSWORD,null}
    create:
      # Bounds the whole start-server call: pod scheduling, image pull, and the IdeGYM
      # server coming up. An agent's sandbox_spec.ready_timeout_s overrides it. The SDK
      # adds max(60 s, 10%) of client-side slack to the orchestrator's wait. From 120 s
      # up, the provider leaves room for it. Below that, the orchestrator gets half the
      # budget and the call can run up to 60 s longer.
      ready_timeout_s: 1200
      # Retries of the whole call on transient control-plane failures (408/429/502/503/
      # 504, connection errors and connect timeouts). Retries keep the server name.
      retries: 3
      retry_delay_s: 5.0
      retry_max_delay_s: 60.0
      # Delay the SDK waits between its own in-call retries of a 429.
      busy_retry_delay_s: 15.0
      # RFC-1035 prefix of the generated server name, which becomes the pod name.
      server_name_prefix: nemo-gym
      # Metadata keys folded into that name. Cosmetic, since metadata is also on the pod
      # as labels, but it keeps pod names readable. IdeGYM appends its own
      # `-<server_id>`, which is what makes the pod name unique.
      server_name_metadata_keys: [instance_id]
      # The reuse lookup only considers servers left FINISHED, and the provider always
      # stops the ones it creates, so NONE is the only strategy that can apply.
      reuse_strategy: NONE
      # Run the container as UID 0. SWE-bench style images generally need this. Off by
      # default in code, as in the SDK, so this file opts in on purpose. exec(user=...)
      # works either way, through the server image's passwordless sudo.
      run_as_root: true
      service_port: 80
      container_port: 8000
      # Pod restarts tolerated before IdeGYM tears the server down. 0 surfaces the
      # first crash instead of looping restarts.
      max_restarts: 0
      # Minutes to hold each server against IdeGYM's inactivity reaper (10 min by
      # default on the cluster), taken right after start and extended before any exec
      # whose timeout would outlive the hold. null leaves servers to the cluster's
      # timeout. At most 1440. An agent can set it per sandbox through
      # sandbox_spec.provider_options.keepalive_minutes.
      keepalive_minutes: null
      # Backoff for the orchestrator's async-operation polling, which start, stop,
      # exec and every file chunk go through (keepalive and status are single requests).
      # How long to poll follows each call's own timeout. Longer delays trade latency
      # for orchestrator load.
      polling:
        initial_delay_s: 0.25
        # 0 selects the exponential schedule below.
        interval_s: 0.0
        backoff_factor: 1.5
        max_delay_s: 30.0
    exec:
      default_timeout_s: 180
      # Grace period a timed-out process group gets before SIGKILL.
      graceful_termination_timeout_s: 2.0
      # Client-side budget on top of the command timeout, covering the orchestrator
      # round trip. Keep it non-zero so the sandbox's own timeout fires first and the
      # caller gets the partial output instead of a transport error.
      request_overhead_s: 60
      # Bytes kept per output stream; past it IdeGYM keeps the head and tail around a
      # truncation marker. null keeps complete output.
      max_output_bytes: 1048576
    verify:
      # IdeGYM already waits for the pod's Kubernetes readiness probe against the
      # server's health endpoint, so what is left is the working-directory check.
      timeout_s: 30
      # Fail create when sandbox_spec.workdir is missing from the image, instead of
      # letting every later command fail.
      check_workdir: true
    files:
      # Bytes per chunk of the SDK's binary upload and download, at most 8 MiB. Each
      # chunk is one orchestrator request.
      chunk_bytes: 1048576
      # Bounds each chunk request, not the whole transfer.
      timeout_s: 300
    operations:
      # A failing teardown can take up to (retries + 1) * close_timeout_s.
      close_timeout_s: 180
      # Bounds a status read and a keepalive extension alike.
      status_timeout_s: 60
      # Further rounds of stop after a transient failure (status is not retried). The
      # SDK makes up to 3 attempts per round, all inside one close_timeout_s, so its
      # own retries only help when a stop fails fast.
      retries: 1
      retry_delay_s: 1.0
      retry_max_delay_s: 15.0
      # Longest keepalive extension taken before a long exec, in minutes; at most 1440.
      keepalive_minutes_max: 1440
    # Who this run belongs to. Attribution becomes labels on every server pod
    # (`<key_prefix>team`, `user`, `workload`, `run`), as on OpenSandbox, and names
    # the registered client -- `nemo-gym-<team>-<user>-<workload>` -- which the IdeGYM
    # dashboard groups by and resource-limit rules match. Fields left unset are
    # auto-detected from NEMO_GYM_TEAM / NEMO_GYM_USER / NEMO_GYM_WORKLOAD, then Slurm
    # job env vars, then the OS login name (`user`) and the running server's instance
    # name (`workload`). `run` is a label but stays out of the client name, which has
    # to stay stable across launches for quota matching to work. Setting
    # connection.client_name above overrides the name, not the labels.
    attribution:
      enabled: true
      # Kubernetes label-key prefix; "" for bare `team` / `user` / ... keys.
      key_prefix: nemo-gym.nvidia.com/
      client_name_prefix: nemo-gym
      # team: my-team
      # user: my-user
      # workload: my-benchmark
