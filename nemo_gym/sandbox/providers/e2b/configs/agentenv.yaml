# AgentENV sandbox provider config: the E2B provider pointed at an AgentENV cell.
#
# AgentENV speaks the E2B API. This file holds only what AgentENV changes and pulls in e2b.yaml for the
# rest, so pass it alone. Swap it in for another provider config in `+config_paths`:
#
#   gym env start \
#     --config responses_api_agents/mini_swe_agent_2/configs/mini_swe_agent_2.yaml \
#     --config nemo_gym/sandbox/providers/e2b/configs/agentenv.yaml \
#     --config responses_api_models/vllm_model/configs/vllm_model.yaml
#
# Environment:
#   E2B_API_KEY       AgentENV API key
#   E2B_API_URL       the cell's address (API and sandboxes share it)
#   E2B_SANDBOX_URL   usually the same address
#   SSL_CERT_FILE     a CA bundle with the system CAs and the cell's certificate, when the cell
#                     serves a certificate the system does not trust; keeps TLS verification on.
#                     Set REQUESTS_CA_BUNDLE to the same bundle for other clients in the process.
#
# AgentENV snapshots save the whole VM, so a sandbox restored from a checkpoint continues the
# processes it was running (the provider's `capabilities.snapshot_keeps` includes `processes`).
config_paths:
  - nemo_gym/sandbox/providers/e2b/configs/e2b.yaml
sandbox:
  e2b:
    create:
      # A live session's sandbox lives at most this long; it must exceed the agent's timeout plus the checkpoint pause
      # allowance plus close. A sandbox of a process that died still ends one lease later.
      timeout_s: 10800.0
      # Sandboxes of a process that died end one lease later instead of at their full lifetime. e2b.yaml's
      # `auto_resume: false` kills at timeout: AgentENV otherwise pauses timed-out sandboxes and never evicts them.
      renew_ttl_s: 1200.0
      # At hundreds of creates a minute, AgentENV can report a sandbox created before its gateway reaches it (502):
      # wait for it to answer instead of failing the first command run in it.
      reachable_timeout_s: 120.0
      # Keep the PATH each task image declares in the login shells E2B runs commands in (Debian images reset it).
      restore_login_env: true
    exec:
      # Task images expect root, as on OpenSandbox.
      user: root
    snapshots:
      # On: a snapshot whose request fails or is cancelled is deleted by its name, so one AgentENV took without
      # Gym learning its id does not stay. A named snapshot is a template alias the whole team can see.
      # e2b.yaml's `list_by_name: false` stays: the cell's snapshot listing may not answer, and a checkpoint
      # release would wait for it.
      send_names: true
      # A sandbox created from a snapshot keeps the wall clock the snapshot was taken at, so a harness that
      # continues in it sees no jump in time.
      keep_guest_clock: true
