# OpenSandbox sandbox provider config.
#
# `sandbox` is the instance name an agent references via `sandbox_provider:
# sandbox`; the child key `opensandbox` selects the provider class and its value
# is passed to the provider constructor.
#
# Every shipped provider config binds the same name `sandbox`, so swapping
# providers is swapping this config path in `+config_paths` (no agent edit):
#
#   AGENT=responses_api_agents/mini_swe_agent_2/configs/mini_swe_agent_2.yaml
#   MODEL=responses_api_models/vllm_model/configs/vllm_model.yaml
#   ng_run "+config_paths=[$AGENT, nemo_gym/sandbox/providers/opensandbox/configs/opensandbox.yaml, $MODEL]"
#
# To run multiple sandboxes at once, give each block a distinct instance name
# (e.g. `opensandbox_foo`, `opensandbox_baz`) and reference each by name.
#
# `default_metadata` (optional) is merged into every sandbox's spec metadata
# (SandboxSpec.metadata); an agent's own sandbox_spec.metadata overrides it.
sandbox:
  default_metadata:
    sandbox-api: opensandbox-sdk
  opensandbox:
    connection:
      domain: ${oc.env:OPENSANDBOX_DOMAIN,opensandbox-server.opensandbox-system.svc.cluster.local}
      api_key: ${oc.env:OPENSANDBOX_API_KEY}
      protocol: http
      request_timeout_s: 300
      use_server_proxy: true
      # Must stay below the server's keep-alive idle timeout (uvicorn: ~5s),
      # else pooled sockets are reused after the server has closed them.
      keepalive_expiry_s: 3.0
      # 0 disables connection reuse.
      max_keepalive_connections: 20
      # null for no cap.
      max_connections: null
      connect_retries: 2
      # "aiohttp-native" selects the OpenSandbox SDK's own aiohttp backend on one
      # provider-owned aiohttp session shared by every SDK call and PTY socket.
      # It needs an SDK that ships the backend (no PyPI release up to 0.1.16
      # does); with an older SDK the provider logs a warning and uses "aiohttp"
      # instead. "aiohttp" keeps the SDK's httpx client layer over the optional
      # httpx-aiohttp bridge (falls back to httpx with a warning when absent);
      # "httpx" is the SDK's default transport.
      transport_backend: aiohttp-native
      # Verify TLS certificates on https endpoints. OPENSANDBOX_INSECURE_TLS=1
      # forces this off for validation cells with certificates the client cannot
      # verify; never disable it for production endpoints.
      tls_verify: true
    create:
      request_timeout_s: 1200
      # Must exceed the spec's ready_timeout_s (1200 for mini_swe_agent_2): this
      # bounds the whole create call, which now includes the readiness wait.
      timeout_s: 1500
      connect_attempt_timeout_s: 1500
      # Skipping the check lets the first command race a pod whose exec daemon
      # is not listening yet, which returns a 502 and kills the rollout.
      skip_health_check: false
      retries: 10
      retry_delay_s: 5.0
      retry_max_delay_s: 90.0
      # Container env applied to every sandbox under the spec's own env (the
      # spec wins on conflicts). execd holds every /command response open for
      # EXECD_API_GRACE_SHUTDOWN after the terminal frame
      # (components/execd/pkg/web/controller/command.go:
      # time.Sleep(flag.ApiGracefulShutdownTimeout), default 1s) so an egress
      # sidecar can sync policy changes the command made. Gym commands never
      # touch egress policy, so 50ms removes ~1s from every exec, background
      # submit and create probe.
      execd_env:
        EXECD_API_GRACE_SHUTDOWN: "50ms"
    probe:
      timeout_s: 60
      deadline_s: 180
      stable_count: 2
      stable_delay_s: 1.0
    operations:
      retries: 5
      retry_delay_s: 1.0
      retry_max_delay_s: 45.0
      # A retried command the server already started runs twice; agent commands
      # are usually mutating. Raise only for idempotent workloads.
      command_retries: 0
      close_timeout_s: 30
      # Short status/log polls instead of one long-lived SSE stream, for load
      # balancers that cap stream duration. Costs extra round trips. Also keeps
      # high-concurrency runs clear of the OpenSandbox server proxy's upstream
      # pool (one httpx.AsyncClient per server process, default 100
      # connections): a foreground SSE stream holds a proxy slot for the whole
      # command, a poll for one round trip.
      background_exec: true
      # Poll interval backs off from initial to interval.
      # @bxyu-nvidia: Too frequent of a poll interval can quickly reduce server performance.
      # e.g. on SWE Bench Verified 500 samples with 3 repeats = 1500 concurrent samples, we would do polling every `background_poll_interval_s` seconds
      # 0.5 is tuned for the 50ms execd grace above (1.0 was tuned around the
      # 1s default tail).
      background_poll_initial_s: 0.5
      background_poll_interval_s: 30.0
      # Per-request budget for status polls, which are small idempotent GETs:
      # without their own short budget, each poll against an unreachable
      # sandbox hangs for the full connection request_timeout_s (tuned for
      # long submits) per retry. null falls back to that shared budget.
      status_poll_timeout_s: 10.0
      # aiohttp-native only: stop reading a foreground command stream at its
      # terminal frame and close the connection instead of waiting out execd's
      # grace tail. Costs a reconnect per command; with the 50ms grace above,
      # reading to EOF and reusing the connection is faster, so leave it off.
      close_on_terminal_frame: false
    # Job attribution merged into every sandbox's metadata. OpenSandbox propagates
    # metadata as Kubernetes labels on the sandbox resources, so sandboxes are
    # attributable both via the OpenSandbox list API and at the cluster level, e.g.
    # `kubectl get pods -l nemo-gym.nvidia.com/team=my-team`. Unset fields auto-detect
    # from NEMO_GYM_TEAM / NEMO_GYM_USER / NEMO_GYM_WORKLOAD, then Slurm job env vars
    # (SLURM_JOB_ACCOUNT / SLURM_JOB_USER / SLURM_JOB_NAME), then the OS login name for
    # `user` ("root" is ignored) and the gym CLI's NEMO_GYM_CONFIG_PATH server instance
    # name for `workload`; unresolvable fields are omitted. `run` scopes sandboxes to one
    # launch of the creating process (NEMO_GYM_RUN_ID, else generated per process and
    # logged) so an interrupted run's sandboxes can be listed and cleaned up exactly.
    # Explicit sandbox_spec.metadata and default_metadata keys always win over
    # attribution keys.
    attribution:
      enabled: true
      # Kubernetes prefixed-key namespace for the injected label keys; "" for bare keys.
      key_prefix: nemo-gym.nvidia.com/
      # team: my-team
      # user: my-user
      # workload: my-benchmark
      # run: my-run-id
